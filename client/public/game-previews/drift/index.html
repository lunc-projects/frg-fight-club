// ---------- input ----------
const keys = {};
let steerTouch = null, mouseDown = false, mouseX = 0;
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; if (!steerTouch) steerTouch = { id: t.identifier, x: t.clientX, sx: t.clientX }; }, { passive:false });
cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (steerTouch && t.identifier === steerTouch.id) steerTouch.x = t.clientX; }, { passive:false });
function endTouch(e) { for (const t of e.changedTouches) if (steerTouch && t.identifier === steerTouch.id) steerTouch = null; }
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
cv.addEventListener('mousedown', e => { mouseDown = true; mouseX = e.clientX; });
window.addEventListener('mousemove', e => { if (mouseDown) mouseX = e.clientX; });
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- game state ----------
const S = { mode:'title', score:0, combo:1, dist:0, shake:0, grace:0, driftGain:0 };
const car = { x:0, y:0, vx:0, slide:0, len:118, wid:44 };
let cones = [], barrels = [], smoke = [], popups = [], spawnT = 1.2, barrelT = 7;
function roadHalf() { return W * 0.37; }
function roadCx(worldD) {
  return W / 2 + Math.sin(worldD * 0.0016) * W * 0.15 + Math.sin(worldD * 0.0041 + 1.7) * W * 0.06;
}
function reset() {
  S.score = 0; S.combo = 1; S.dist = 0; S.shake = 0; S.grace = 0; S.driftGain = 0;
  cones = []; barrels = []; smoke = []; popups = []; spawnT = 1.4; barrelT = 6;
  car.x = W / 2; car.y = H - 210; car.vx = 0; car.slide = 0;
}
function startGame() { reset(); S.mode = 'run'; overlay.style.display = 'none'; }
function gameOver() {
  S.mode = 'over'; S.shake = 16;
  overlay.innerHTML = '<h1>WALLED!</h1><div class="big">SCORE ' + Math.floor(S.score) + '</div>' +
    '<p>You clipped a barrier barrel. The drift line was looking good though…</p><div class="tap">TAP TO SLIDE AGAIN</div>';
  overlay.style.display = 'flex';
}
function showTitle() {
  overlay.innerHTML = '<h1>SLIDE <span class="b">KING</span></h1><h2>DRIFT RUN</h2>' +
    '<p>Flick the car sideways and <b style="color:#39c2ff">hold the slide</b> — drift points grow with your angle and your combo.<br>Chain drifts to raise the multiplier. Cones break your combo, barrels end the run!</p>' +
    '<div class="tap">TAP TO START</div>';
  overlay.style.display = 'flex';
}
overlay.addEventListener('click', () => { if (S.mode !== 'run') startGame(); });
overlay.addEventListener('touchstart', e => { e.preventDefault(); if (S.mode !== 'run') startGame(); }, { passive:false });

function popup(x, y, txt, col) { popups.push({ x, y, txt, col: col || '#39c2ff', t: 0 }); }

function update(dt) {
  // steering input: -1..1
  let steer = 0;
  if (keys['ArrowLeft'] || keys['a']) steer -= 1;
  if (keys['ArrowRight'] || keys['d']) steer += 1;
  if (steerTouch) steer = Math.max(-1, Math.min(1, (steerTouch.x - steerTouch.sx) / 55));
  else if (mouseDown) steer = Math.max(-1, Math.min(1, (mouseX - car.x) / 70));

  // lateral physics: steering accelerates the car sideways; grip pulls back
  car.vx += steer * 1500 * dt;
  car.vx *= Math.pow(0.12, dt);                    // grip damping
  car.x += car.vx * dt;
  car.x = Math.max(24, Math.min(W - 24, car.x));
  // slide angle follows sideways velocity + steer
  const targetSlide = Math.max(-0.62, Math.min(0.62, car.vx / 620 + steer * 0.18));
  car.slide += (targetSlide - car.slide) * Math.min(1, dt * 7);
  car.y = H - 210;

  // road position at the car
  const cxHere = roadCx(S.dist + (H - car.y));
  const off = Math.abs(car.x - cxHere) - (roadHalf() - 16);
  const offroad = off > 0;

  // speed: base cruise, offroad drag
  let speed = 355;
  if (offroad) speed = 150;
  S.dist += speed * dt;

  // drifting?
  const sliding = Math.abs(car.slide) > 0.16 && !offroad;
  if (sliding) {
    S.grace = 1.0;
    S.combo = Math.min(5, S.combo + dt * 0.22);
    const gain = Math.abs(car.slide) * 57 * S.combo * dt * 3.1;   // points
    S.score += gain; S.driftGain = gain / dt;
    // smoke from the rear of the car
    const rearX = car.x - Math.cos(car.slide) * 10, rearY = car.y + 44;
    for (let i = 0; i < 3; i++)
      smoke.push({ x: rearX + (Math.random() * 30 - 15), y: rearY + Math.random() * 10, r: 7 + Math.random() * 8, t: 0, life: 0.8 + Math.random() * 0.5 });
  } else {
    S.driftGain = 0;
    if (S.grace > 0) S.grace -= dt;
    else S.combo = Math.max(1, S.combo - dt * 1.6);
  }

  // cones
  spawnT -= dt;
  if (spawnT <= 0) {
    const d = S.dist + H + 140, cx = roadCx(d);
    cones.push({ wx: cx + (Math.random() * 2 - 1) * (roadHalf() - 46), wd: d, hit: false, fly: 0 });
    spawnT = 0.9 + Math.random() * 1.1;
  }
  // barrels at the road edge
  barrelT -= dt;
  if (barrelT <= 0) {
    const d = S.dist + H + 160, cx = roadCx(d), side = Math.random() < 0.5 ? -1 : 1;
    barrels.push({ wx: cx + side * (roadHalf() + 8), wd: d });
    barrelT = 5 + Math.random() * 4;
  }
  const carWorldD = S.dist + (H - car.y);
  for (const c of cones) {
    if (c.hit) { c.fly += dt; continue; }
    const sy = H - (c.wd - S.dist), dx = c.wx - car.x, dy = sy - car.y;
    if (Math.abs(dy) < 56 && Math.abs(dx) < 32) {
      c.hit = true; c.fly = 0.001;
      if (S.combo > 1.2) popup(car.x, car.y - 84, 'CONE! COMBO LOST', '#ff5147');
      S.combo = 1; S.grace = 0; S.shake = Math.max(S.shake, 5);
    }
  }
  cones = cones.filter(c => (c.wd - S.dist) > -80 && c.fly < 0.7);
  for (const b of barrels) {
    const sy = H - (b.wd - S.dist), dx = b.wx - car.x, dy = sy - car.y;
    if (Math.abs(dy) < 62 && Math.abs(dx) < 40) { gameOver(); return; }
  }
  barrels = barrels.filter(b => (b.wd - S.dist) > -80);

  // smoke + popups
  for (const p of smoke) { p.t += dt; p.y += 130 * dt; p.x += (Math.random() - 0.5) * 14 * dt; p.r += 16 * dt; }
  smoke = smoke.filter(p => p.t < p.life);
  if (smoke.length > 260) smoke.splice(0, smoke.length - 260);
  for (const p of popups) { p.t += dt; p.y -= 44 * dt; }
  popups = popups.filter(p => p.t < 0.95);
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
  void carWorldD;
}

// ---------- drawing ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawRoad() {
  // ground
  ctx.fillStyle = '#20261c'; ctx.fillRect(0, 0, W, H);
  // dirt texture stripes
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  const off = S.dist % 90;
  for (let y = -90 + off; y < H; y += 90) ctx.fillRect(0, y, W, 3);
  // road slices
  const step = 26;
  for (let y = -step; y < H + step; y += step) {
    const d0 = S.dist + (H - y), d1 = S.dist + (H - (y + step));
    const c0 = roadCx(d0), c1 = roadCx(d1), hw = roadHalf();
    ctx.fillStyle = '#3a3e45';
    ctx.beginPath();
    ctx.moveTo(c0 - hw, y); ctx.lineTo(c0 + hw, y);
    ctx.lineTo(c1 + hw, y + step); ctx.lineTo(c1 - hw, y + step);
    ctx.closePath(); ctx.fill();
    // edge lines
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(c0 - hw - 3, y, 4, step + 1); ctx.fillRect(c0 + hw - 1, y, 4, step + 1);
    // center wear line
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect((c0 + c1) / 2 - 2, y, 4, step + 1);
  }
}
function drawCone(x, y, flyT) {
  ctx.save(); ctx.translate(x, y);
  if (flyT) { ctx.rotate(flyT * 9); ctx.globalAlpha = 1 - flyT / 0.7; ctx.translate(flyT * 130, -flyT * 90); }
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 8, 13, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff7b1c';
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(10, 8); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-6.5, -4, 13, 5);
  ctx.fillStyle = '#d9620f'; ctx.fillRect(-12, 8, 24, 4);
  ctx.restore();
}
function drawBarrel(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 12, 17, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c8102e'; roundRect(-14, -16, 28, 30, 5); ctx.fill();
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-14, -6, 28, 7); ctx.fillRect(-14, 5, 28, 7);
  ctx.restore();
}
function draw() {
  const sx = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  const sy = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawRoad();
  // skid marks while sliding
  if (Math.abs(car.slide) > 0.16) {
    ctx.strokeStyle = 'rgba(10,10,10,.35)'; ctx.lineWidth = 7; ctx.beginPath();
    ctx.moveTo(car.x - 15, car.y + 40); ctx.lineTo(car.x - car.slide * 60 - 15, car.y + 92);
    ctx.moveTo(car.x + 15, car.y + 40); ctx.lineTo(car.x - car.slide * 60 + 15, car.y + 92);
    ctx.stroke();
  }
  // smoke (behind car)
  for (const p of smoke) {
    ctx.globalAlpha = 0.30 * (1 - p.t / p.life);
    ctx.fillStyle = '#dfe6ee';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // cones + barrels
  for (const c of cones) drawCone(c.wx, H - (c.wd - S.dist), c.hit ? c.fly : 0);
  for (const b of barrels) drawBarrel(b.wx, H - (b.wd - S.dist));
  // car — sprite faces left; rotate +90° so the nose points up-screen, plus slide angle
  if (carImg.complete && carImg.naturalWidth) {
    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(Math.PI / 2 + car.slide);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(5, 4, car.len * 0.5, car.wid * 0.62, 0, 0, 7); ctx.fill();
    ctx.drawImage(carImg, -car.len / 2, -car.wid / 2 - 4, car.len, car.len * (carImg.naturalHeight / carImg.naturalWidth));
    ctx.restore();
  }
  // popups
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 0.95;
    ctx.fillStyle = p.col; ctx.font = '900 18px Arial'; ctx.textAlign = 'center';
    ctx.fillText(p.txt, p.x, p.y); ctx.globalAlpha = 1;
  }
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(5,8,12,.55)'; ctx.fillRect(0, 0, W, 64);
  ctx.fillStyle = '#fff'; ctx.font = '900 21px Arial'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + Math.floor(S.score), 12, 30);
  ctx.font = '800 13px Arial'; ctx.fillStyle = '#9fb4c8';
  ctx.fillText('HOLD A SLIDE TO SCORE', 12, 53);
  if (S.combo > 1.05 || S.driftGain > 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = S.driftGain > 0 ? '#39c2ff' : '#fff'; ctx.font = '900 23px Arial';
    ctx.fillText('×' + S.combo.toFixed(1), W - 12, 32);
    if (S.driftGain > 0) { ctx.font = '900 15px Arial'; ctx.fillText('DRIFT +' + Math.round(S.driftGain) + '/s', W - 12, 54); }
  }
  // offroad warning
  const cxHere = roadCx(S.dist + (H - car.y));
  if (Math.abs(car.x - cxHere) > roadHalf() - 16 && S.mode === 'run') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffb01f'; ctx.font = '900 19px Arial';
    ctx.fillText('⚠ OFF TRACK — NO POINTS', W / 2, 92);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode === 'run') update(dt);
  else { S.dist += 40 * dt; car.x = W / 2; car.y = H - 210; }
  draw();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);

// QA / debug hook
window.__game = { S, car, start: startGame,
  state: () => ({ mode: S.mode, score: S.score, combo: +S.combo.toFixed(2), x: Math.round(car.x), slide: +car.slide.toFixed(2), smoke: smoke.length, cones: cones.length }) };
</script>
</body>
</html>
