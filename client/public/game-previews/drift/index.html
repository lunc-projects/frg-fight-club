<script>
'use strict';
/* GAME PREVIEWS v2 — shared engine.
   Framework modeled directly on LUNC GRAND PRIX (the F1 game):
   CatmullRom closed spline -> sampled frames (p/tan/side/kappa) ->
   ribbon-built road/walls, canvas textures, dist/lat sim, chase cam,
   navy+gold HUD with round touch buttons. Config-driven per game. */
var CFG = window.PV_CONFIG;

/* ---------------- utils ---------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function wrapAngle(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
var _seed = 1234567;

/* ---------------- renderer / scene ---------------- */

/* sky dome: gradient canvas, F1 style */
var clouds = [];
(function buildSky() {

  x.fillStyle = g; x.fillRect(0, 0, 64, 512);

    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false }));
  scene.add(sky);
  var sunSpr = new THREE.Mesh(new THREE.CircleGeometry(46, 24),
    new THREE.MeshBasicMaterial({ color: 0xfff6da, fog: false, transparent: true, opacity: 0.95 }));
  sunSpr.position.set(640, 285, -1500); sunSpr.lookAt(0, 0, 0); scene.add(sunSpr);
  /* warm halo behind the sun disc */
  var gc = makeCanvas(128, 128), gx = gc.getContext('2d');
  var gg = gx.createRadialGradient(64, 64, 4, 64, 64, 62);
  gg.addColorStop(0, 'rgba(255,244,205,0.85)'); gg.addColorStop(0.35, 'rgba(255,232,175,0.38)'); gg.addColorStop(1, 'rgba(255,232,175,0)');
  gx.fillStyle = gg; gx.fillRect(0, 0, 128, 128);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTexture(gc), transparent: true, opacity: 0.9, fog: false, depthWrite: false }));
  glow.position.set(700, 315, -1620); glow.scale.set(1150, 1150, 1); scene.add(glow);
  /* drifting puff clouds */
  var cc = makeCanvas(256, 128), cx2 = cc.getContext('2d');
  for (var bi = 0; bi < 30; bi++) {
    var bx = 26 + rnd() * 204, by = 42 + rnd() * 44, br = 13 + rnd() * 30;
    var bg = cx2.createRadialGradient(bx, by, 2, bx, by, br);
    bg.addColorStop(0, 'rgba(255,255,255,0.17)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
    cx2.fillStyle = bg; cx2.beginPath(); cx2.arc(bx, by, br, 0, Math.PI * 2); cx2.fill();
  }
  var cloudTex = canvasTexture(cc);
  for (var ci = 0; ci < 14; ci++) {
    var cm = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, color: 0xffdcbc, transparent: true, opacity: 0.5 + rnd() * 0.32, fog: false, depthWrite: false }));
    var ca = rnd() * Math.PI * 2, cr = 1250 + rnd() * 700;
    cm.position.set(Math.cos(ca) * cr, 250 + rnd() * 300, Math.sin(ca) * cr);
    cm.scale.set(400 + rnd() * 420, 120 + rnd() * 100, 1);

/* ---------------- textures (F1-style canvas work) ---------------- */
function asphaltTexture() {
  var c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = CFG.roadBase || '#24262c'; x.fillRect(0, 0, 512, 512);
  /* large tonal patches / repairs — kept faint: at full strength these
     read as dirt stains on the surface */
  for (var p = 0; p < 14; p++) {
    x.fillStyle = 'rgba(' + (rnd() > 0.5 ? '255,255,255' : '0,0,0') + ',' + (0.015 + rnd() * 0.025) + ')';
    x.beginPath(); x.ellipse(rnd() * 512, rnd() * 512, 24 + rnd() * 64, 16 + rnd() * 44, rnd() * 3, 0, Math.PI * 2); x.fill();
  }
  /* aggregate grain: dark + light flecks */
  for (var i = 0; i < 15000; i++) {
    var l = rnd() > 0.46;
    x.fillStyle = l ? 'rgba(' + (165 + rnd() * 70 | 0) + ',' + (170 + rnd() * 70 | 0) + ',' + (182 + rnd() * 60 | 0) + ',' + (0.05 + rnd() * 0.08) + ')'
                    : 'rgba(0,0,0,' + (0.05 + rnd() * 0.09) + ')';
    x.fillRect(rnd() * 512, rnd() * 512, 1.5, 1.5);
  }
  /* polished wheel tracks (soft-edged dark bands down the length) */
  [118, 394].forEach(function (bx) {
    var g = x.createLinearGradient(bx - 46, 0, bx + 46, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, 'rgba(0,0,0,0.17)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(bx - 46, 0, 92, 512);
  });
  var cg = x.createLinearGradient(176, 0, 336, 0);
  cg.addColorStop(0, 'rgba(0,0,0,0)'); cg.addColorStop(0.5, 'rgba(0,0,0,0.05)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = cg; x.fillRect(176, 0, 160, 512);
  /* cracks: jittery dark polylines */
  x.strokeStyle = 'rgba(8,8,10,0.20)'; x.lineWidth = 1.3;
  for (var k = 0; k < 9; k++) {
    x.beginPath();
    var px = rnd() * 512, py = rnd() * 512; x.moveTo(px, py);
    for (var sgm = 0; sgm < 6; sgm++) { px += (rnd() - 0.5) * 60; py += rnd() * 46; x.lineTo(px, py); }
    x.stroke();
  }
  /* tar seams */
  x.strokeStyle = 'rgba(10,10,12,0.20)'; x.lineWidth = 3;
  for (var t2 = 0; t2 < 3; t2++) {
    x.beginPath(); var ty = rnd() * 512; x.moveTo(0, ty);
    x.bezierCurveTo(170, ty + (rnd() - 0.5) * 22, 340, ty + (rnd() - 0.5) * 22, 512, ty); x.stroke();
  }
  /* rubber streaks near the edges */
  for (var r2 = 0; r2 < 40; r2++) {
    x.fillStyle = 'rgba(0,0,0,' + (0.03 + rnd() * 0.05) + ')';
    var rx = rnd() < 0.5 ? rnd() * 60 : 452 + rnd() * 60;
    x.fillRect(rx, rnd() * 512, 2 + rnd() * 4, 14 + rnd() * 40);
  }
  /* drift scars: curved black arcs where a thousand slides crossed —
     the surface memory of a drift circuit, darkest mid-corner band */
  for (var da = 0; da < 34; da++) {
    x.strokeStyle = 'rgba(5,5,8,' + (0.05 + rnd() * 0.10) + ')';
    x.lineWidth = 3 + rnd() * 6;
    x.beginPath();
    var ax = 60 + rnd() * 392, ay = rnd() * 512, ar = 30 + rnd() * 90, aa = rnd() * Math.PI * 2;
    x.arc(ax, ay, ar, aa, aa + 0.5 + rnd() * 0.9); x.stroke();
  }
  /* rectangular repair patches with pale sealed edges */
  for (var rp = 0; rp < 5; rp++) {
    var rpx = rnd() * 400, rpy = rnd() * 400, rpw = 50 + rnd() * 80, rph = 40 + rnd() * 70;
    x.fillStyle = 'rgba(0,0,0,0.13)'; x.fillRect(rpx, rpy, rpw, rph);
    x.strokeStyle = 'rgba(200,200,205,0.10)'; x.lineWidth = 2; x.strokeRect(rpx, rpy, rpw, rph);
  }
  /* faint oil sheen spots */
  for (var os = 0; os < 7; os++) {
    var og = x.createRadialGradient(rnd() * 512, rnd() * 512, 2, rnd() * 512, rnd() * 512, 16 + rnd() * 26);
    og.addColorStop(0, 'rgba(12,10,16,0.16)'); og.addColorStop(1, 'rgba(12,10,16,0)');
    x.fillStyle = og; x.fillRect(0, 0, 512, 512);
  }
  var t = canvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function grassTexture() {
  var c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = CFG.terrainCss; x.fillRect(0, 0, 512, 512);
  /* mow stripes: alternating light/dark bands — at the ground plane's
     repeat these land as ~7 m stripes, the infield-grooming cue */
  for (var mb = 0; mb < 8; mb++) {
    x.fillStyle = mb % 2 ? 'rgba(0,0,0,0.055)' : 'rgba(255,255,225,0.045)';
    x.fillRect(mb * 64, 0, 64, 512);
  }
  var patchCols = ['rgba(0,0,0,0.10)', 'rgba(255,255,220,0.05)', 'rgba(28,40,14,0.13)', 'rgba(124,104,58,0.08)'];
  for (var i = 0; i < 280; i++) {
    x.fillStyle = patchCols[(rnd() * patchCols.length) | 0];
    x.beginPath(); x.ellipse(rnd() * 512, rnd() * 512, 14 + rnd() * 62, 10 + rnd() * 42, rnd() * 3, 0, Math.PI * 2); x.fill();
  }
  for (var j = 0; j < 5600; j++) {
    x.fillStyle = ['rgba(255,255,255,0.05)', 'rgba(0,0,0,0.08)', 'rgba(255,255,180,0.045)', 'rgba(18,28,8,0.10)'][(rnd() * 4) | 0];
    x.fillRect(rnd() * 512, rnd() * 512, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  /* blade strokes: short vertical ticks in mixed greens/straw */
  for (var bt = 0; bt < 2600; bt++) {
    x.fillStyle = ['rgba(20,34,10,0.13)', 'rgba(140,160,80,0.10)', 'rgba(190,170,95,0.07)'][(rnd() * 3) | 0];
    x.fillRect(rnd() * 512, rnd() * 512, 1.4, 3 + rnd() * 4);
  }
  /* dry worn patches near where the track will sit */
  for (var dp = 0; dp < 26; dp++) {
    x.fillStyle = 'rgba(146,124,74,' + (0.04 + rnd() * 0.06) + ')';
    x.beginPath(); x.ellipse(rnd() * 512, rnd() * 512, 10 + rnd() * 34, 7 + rnd() * 22, rnd() * 3, 0, Math.PI * 2); x.fill();
  }
  var t = canvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function wornLineTexture() {
  var c = makeCanvas(64, 256), x = c.getContext('2d');
  x.fillStyle = '#efeee3'; x.fillRect(0, 0, 64, 256);
  for (var i = 0; i < 300; i++) { /* scuffs + grime streaks along the paint */
    x.fillStyle = 'rgba(88,90,94,' + (0.05 + rnd() * 0.17) + ')';
    x.fillRect(rnd() * 64, rnd() * 256, 1 + rnd() * 3, 2 + rnd() * 10);
  }
  x.fillStyle = 'rgba(58,58,62,0.22)'; /* chipped edges */
  for (var j = 0; j < 30; j++) x.fillRect(rnd() < 0.5 ? rnd() * 5 : 59 - rnd() * 5, rnd() * 256, 2 + rnd() * 3, 3 + rnd() * 9);
  var t = canvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function speckleTexture(base, flecks, n, w, h) {
  var c = makeCanvas(w || 256, h || 256), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, c.width, c.height);
  for (var i = 0; i < n; i++) {
    x.fillStyle = flecks[(rnd() * flecks.length) | 0];
    x.fillRect(rnd() * c.width, rnd() * c.height, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  var t = canvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function bannerTexture(text, bg, fg, accent) {
  var c = makeCanvas(1024, 128), x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 1024, 128);
  x.fillStyle = accent; x.fillRect(0, 0, 1024, 10); x.fillRect(0, 118, 1024, 10);
  x.font = '900 74px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = fg; x.fillText(text, 512, 66);
  return canvasTexture(c);
}
function checkBannerTexture(text) {
  var c = makeCanvas(1024, 128), x = c.getContext('2d');
  var s = 32;
  for (var i = 0; i < 1024 / s; i++) for (var j = 0; j < 128 / s; j++) {
    x.fillStyle = (i + j) % 2 ? '#101014' : '#f2f2ee'; x.fillRect(i * s, j * s, s, s);
  }
  x.fillStyle = 'rgba(8,10,18,0.88)'; x.fillRect(212, 24, 600, 80);
  x.font = '900 56px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#ffd75e'; x.fillText(text, 512, 66);
  return canvasTexture(c);
}
function fenceTexture() {
  var c = makeCanvas(128, 128), x = c.getContext('2d');
  x.clearRect(0, 0, 128, 128);
  x.strokeStyle = 'rgba(200,210,220,0.55)'; x.lineWidth = 2;
  for (var i = 0; i <= 128; i += 16) {
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 128); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(128, i); x.stroke();
  }
  var t = canvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function poly(x, pts) {
  x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]);
  x.closePath(); x.fill();
}
/* Stock-car side livery, painted after the approved concept:
   deep blue, a big lightning bolt sweeping up the door, the number in
   white on the bolt, black rear-quarter panel with slashes, yellow
   fuel ring. Canonical canvas: x 0 = FRONT of car, x W = rear, y 0 = top.
   flip=true mirrors the painting (the car's left box UVs run mirrored,
   so the flipped painting reads correctly there). */
function carSideTexture(liv, flip) {
  var W = 1024, H = 128, c = makeCanvas(W, H), x = c.getContext('2d');
  /* On the flipped (left) face the box UVs map the canvas with its
     left edge at the REAR of the car but glyphs unmirrored — so the
     artwork is painted flipped while text is painted unflipped at
     mirrored positions. */
  x.save(); if (flip) { x.translate(W, 0); x.scale(-1, 1); }
  var g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, liv.mainCss); g.addColorStop(1, liv.shadeCss || liv.mainCss);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#0e1013'; x.fillRect(0, 104, W, 24);                    /* rocker band */
  x.fillStyle = '#101218'; poly(x, [[838, 0], [1024, 0], [1024, 128], [884, 128], [842, 58]]); /* rear-quarter panel */
  var bolt = [[30, 104], [330, 40], [282, 72], [560, 16], [508, 56], [838, 40], [706, 128], [742, 88], [452, 128], [506, 84], [196, 128], [262, 82]];
  x.save(); x.translate(0, 5); x.fillStyle = liv.boltEdgeCss; poly(x, bolt); x.restore();
  x.fillStyle = liv.boltCss; poly(x, bolt);
  for (var i = 0; i < 3; i++) {                                          /* rear-quarter slashes */
    x.fillStyle = i % 2 ? liv.boltCss : liv.boltEdgeCss;
    poly(x, [[856 + i * 52, 128], [884 + i * 52, 34], [906 + i * 52, 34], [878 + i * 52, 128]]);
  }
  var fb = [[66, 116], [150, 84], [128, 102], [206, 92], [150, 124], [160, 106], [96, 124]];   /* front-fender mini bolt */
  x.save(); x.translate(0, 3); x.fillStyle = liv.boltEdgeCss; poly(x, fb); x.restore();
  x.fillStyle = liv.boltCss; poly(x, fb);
  x.fillStyle = 'rgba(6,8,12,0.5)';                                      /* wheel-arch shade */
  x.beginPath(); x.arc(190, 134, 88, Math.PI, 0); x.fill();
  x.beginPath(); x.arc(834, 134, 88, Math.PI, 0); x.fill();
  x.strokeStyle = liv.boltCss; x.lineWidth = 6;                          /* fuel filler ring */
  x.beginPath(); x.arc(922, 27, 12, 0, Math.PI * 2); x.stroke();
  x.fillStyle = '#14161c'; x.beginPath(); x.arc(922, 27, 7, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#0a0b0e'; x.fillRect(714, 109, 54, 11);                 /* side exhaust outlet */
  x.restore();
  x.font = 'italic 900 98px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 13; x.strokeStyle = liv.boltEdgeCss;
  var numX = flip ? W - 648 : 648;
  x.strokeText(liv.number, numX, 68);
  x.fillStyle = liv.numCss || '#ffffff'; x.fillText(liv.number, numX, 68);
  x.font = '900 20px Arial, sans-serif';
  try { x.letterSpacing = '3px'; } catch (e) {}
  x.fillStyle = 'rgba(255,255,255,0.92)';
  if (flip) { x.textAlign = 'right'; x.fillText(liv.word || '', W - 30, 15); }
  else { x.textAlign = 'left'; x.fillText(liv.word || '', 30, 15); }
  return canvasTexture(c);
}
/* Cabin side glass: dark glasshouse with a body-colour roof rail,
   B-pillar and a faint window-net cross-hatch on the rear half. */
function cabinSideTexture(liv) {
  var c = makeCanvas(512, 128), x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, '#24304a'); g.addColorStop(0.5, '#161e2c'); g.addColorStop(1, '#0f141d');
  x.fillStyle = g; x.fillRect(0, 0, 512, 128);
  x.fillStyle = liv.mainCss; x.fillRect(0, 0, 512, 12);
  x.fillStyle = '#090b0f'; x.fillRect(262, 0, 15, 128);
  x.strokeStyle = 'rgba(255,255,255,0.08)'; x.lineWidth = 3;
  for (var i = -4; i < 11; i++) {
    x.beginPath(); x.moveTo(292 + i * 22, 128); x.lineTo(352 + i * 22, 12); x.stroke();
    x.beginPath(); x.moveTo(292 + i * 22, 12); x.lineTo(352 + i * 22, 128); x.stroke();
  }
  return canvasTexture(c);
}
/* Nose side: plain clip with the black lower band and a mini-bolt tip,
   continuing the body livery onto the front clip. Shapes only. */

function buildTireStacks() {

function drawDial(speedKmh) {
  if (!dialCtx) return;
  var x = dialCtx, cx = 118, cy = 118, R = 104;
  x.clearRect(0, 0, 236, 236);
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2);
  x.fillStyle = 'rgba(8,12,22,0.72)'; x.fill();
  x.lineWidth = 3; x.strokeStyle = 'rgba(170,205,255,0.6)'; x.stroke();
  var a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  for (var v = 0; v <= 240; v += 20) {
    var a = a0 + (a1 - a0) * (v / 240);
    var big = v % 40 === 0;
    x.beginPath();
    x.moveTo(cx + Math.cos(a) * (R - (big ? 20 : 12)), cy + Math.sin(a) * (R - (big ? 20 : 12)));
    x.lineTo(cx + Math.cos(a) * (R - 4), cy + Math.sin(a) * (R - 4));
    x.lineWidth = big ? 4 : 2; x.strokeStyle = v >= 200 ? '#ff5347' : '#dfeaf8'; x.stroke();
    if (big) {
      x.fillStyle = '#dfeaf8'; x.font = '900 19px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(String(v / 10 | 0), cx + Math.cos(a) * (R - 36), cy + Math.sin(a) * (R - 36));
    }
  }
  var na = a0 + (a1 - a0) * clamp(speedKmh / 240, 0, 1);
  x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(na) * (R - 26), cy + Math.sin(na) * (R - 26));
  x.lineWidth = 5; x.strokeStyle = '#ff5347'; x.stroke();
  x.beginPath(); x.arc(cx, cy, 9, 0, Math.PI * 2); x.fillStyle = '#dfeaf8'; x.fill();
  x.fillStyle = '#ffd75e'; x.font = '900 34px Arial'; x.textAlign = 'center';
  x.fillText(String(Math.round(speedKmh)), cx, cy + 44);
  x.fillStyle = '#7fd0ff'; x.font = '900 13px Arial'; x.fillText('KM/H', cx, cy + 66);
  x.fillStyle = '#ffd75e'; x.font = '900 18px Arial'; x.fillText('GEAR ' + G.gear, cx, cy - 32);
}

   (blob shadows, catch fence) are skipped so they don't print solids */
function shadowize(root) {

    if (!m.isMesh && !m.isInstancedMesh) return;
    var mats = Array.isArray(m.material) ? m.material : [m.material];
    for (var i = 0; i < mats.length; i++) {

      placeCar(playerCar, G.s, G.lat, G.slip, G.steerVis, 0);
      endRace('WRECKED!', 'You hit the wall at ' + Math.round(G.v * 3.6) + ' KM/H.<br>' +
        (CFG.mode === 'nascar' ? 'Score: ' + Math.round(G.score) : 'Drift points: ' + Math.round(G.score)));
      G.phase = 'over';
    } else { G.latVel *= -0.25; G.v *= 0.93; G.shake = Math.max(G.shake, 0.3); G.combo = 1; }
  }
  if (racing) {
    G.s += G.v * dt; G.prog += G.v * dt;
    if (G.s >= TRACK_LEN) {
      G.s -= TRACK_LEN; G.lap++;
      if (CFG.mode === 'nascar') {
        if (G.lap >= CFG.laps) {
          endRace('FINISH — P' + G.pos, 'Score: ' + Math.round(G.score) + '<br>Position ' + G.pos + ' of ' + (rivals.length + 1));
        } else showEvent('LAP ' + (G.lap + 1), 1100);
      }
    }
  }
  /* drift model */
  var drifting = false;
  if (CFG.mode === 'drift') {
    var grip = input.action && G.v > 9 ? 1.0 : 0.55;
    var slipT = -(G.steerVis * clamp(G.v / 40, 0, 1) * 0.85 * grip + (input.action ? G.steerVis * 0.25 : 0)) * (curSpec ? curSpec.drift : 1);
    G.slip += (clamp(slipT, -1.05, 1.05) - G.slip) * Math.min(1, dt * 5.5);
    drifting = racing && Math.abs(G.slip) > 0.20 && G.v > 11 && !offroad;
    G.wasDrifting = drifting;
    if (drifting) {
      var gain = Math.abs(G.slip) * G.v * dt * 9 * G.combo;
      G.score += gain; G.segScore += gain; G.segOn = true;
      G.combo = Math.min(5, G.combo + dt * 0.45); G.comboIdle = 0;
      if (G.combo > G.bestCombo) G.bestCombo = G.combo;
      G.smokeAcc = (G.smokeAcc || 0) + dt * (130 + 360 * Math.min(1, Math.abs(G.slip)));
      var backV = fr.tan.clone().multiplyScalar(-G.v * 0.22);
      while (G.smokeAcc >= 1) {
        G.smokeAcc -= 1;
        var wp = surfPoint(fr, G.lat + (rnd() > 0.5 ? 0.95 : -0.95), 0.1);
        puff(wp, 0.85, 1, backV);
      }
    } else {
      G.comboIdle += dt;
      if (G.segOn && G.comboIdle > 0.25) {
        if (G.segScore > 900) showEvent('MEGA SLIDE +' + Math.round(G.segScore) + ' DP');
        else if (G.segScore > 420) showEvent('GREAT ENTRY +' + Math.round(G.segScore) + ' DP');
        else if (G.segScore > 160) showEvent('NICE DRIFT +' + Math.round(G.segScore) + ' DP');
        G.segScore = 0; G.segOn = false;
      }
      if (G.comboIdle > 2.5) G.combo = Math.max(1, G.combo - dt * 1.6);
    }
    /* cones */
    if (racing) cones.forEach(function (c) {
      if (c.hit) return;
      var ds = ((c.s - G.s + TRACK_LEN * 1.5) % TRACK_LEN) - TRACK_LEN / 2;
      if (Math.abs(ds) < 2.3 && Math.abs(c.lat - G.lat) < 1.15) {
        c.hit = true; c.mesh.visible = false; c.band.visible = false;
        if (G.combo > 1.2) showEvent('CONE HIT — COMBO LOST', 1100);
        G.combo = 1; G.shake = Math.max(G.shake, 0.2);
      }
    });
    if (racing) {
      G.timeLeft -= dt;
      if (G.timeLeft <= 0) {
        G.timeLeft = 0;
        endRace('TIME!', 'Drift points: ' + Math.round(G.score) + '<br>Best combo: ×' + G.bestCombo.toFixed(1));
      }
    }
  }
  /* DRIFT traffic update: runners circulate at a moderate pace,
     easing off for corners (target speed scaled by curvature) and
     capped by the car ahead in their lane — the same no-ghosting
     traffic sense as the NASCAR field. Contact with the player is a
     bump, not a wreck: it costs speed and the combo, like a cone. */
  if (traffic.length) {
    traffic.forEach(function (tc) {
      if (racing) {
        var tcFr = frameAt(tc.s);
        var curveF = 1 - clamp(Math.abs(tcFr.kappa) * 7.5, 0, 0.42);
        var tcTop = CFG.topSpeed * tc.pace * curveF;
        for (var oi2 = 0; oi2 < traffic.length; oi2++) {
          var oc = traffic[oi2]; if (oc === tc) continue;
          var tGap = ((oc.s - tc.s) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
          if (tGap > 0.5 && tGap < 11 && Math.abs(oc.lat - tc.lat) < 1.8) tcTop = Math.min(tcTop, oc.v + 0.3);
        }
        tc.v += 9 * (1 - tc.v / (tcTop * 1.1)) * dt;
        tc.v = Math.min(tc.v, tcTop);
        tc.s += tc.v * dt;
        if (tc.s >= TRACK_LEN) tc.s -= TRACK_LEN;
        tc.lat = tc.lane + Math.sin(G.t * 0.3 + tc.wob) * 0.6;
        /* traffic knocks cones down too (no penalty to anyone) */
        cones.forEach(function (c) {
          if (c.hit) return;
          var cds = ((c.s - tc.s + TRACK_LEN * 1.5) % TRACK_LEN) - TRACK_LEN / 2;
          if (Math.abs(cds) < 2.3 && Math.abs(c.lat - tc.lat) < 1.15) { c.hit = true; c.mesh.visible = false; c.band.visible = false; }
        });
        var relT = ((tc.s - G.s + TRACK_LEN * 1.5) % TRACK_LEN) - TRACK_LEN / 2;
        if (Math.abs(relT) < 4.1 && Math.abs(tc.lat - G.lat) < 1.65 && G.v > 8 && G.t > tc.nearT) {
          tc.nearT = G.t + 2.5;
          G.v *= 0.55; G.latVel += (G.lat < tc.lat ? -3.2 : 3.2);
          if (G.combo > 1.2) showEvent('CONTACT — COMBO LOST', 1100);
          G.combo = 1; G.shake = Math.max(G.shake, 0.35);
        }
      }
      placeCar(tc.car, tc.s, tc.lat, 0, 0, 0);
      spinWheels(tc.car, tc.v, dt, 0);
    });
  }
  /* rivals + nascar scoring */
  if (CFG.mode === 'nascar') {
    var aheadDraft = false;
    rivals.forEach(function (r) {
      if (racing) {
        var aiTop = CFG.topSpeed * r.pace;
        /* traffic sense: a faster rival must not ghost through the car
           ahead in its lane — cap its pace to the leader's speed */
        for (var oi = 0; oi < rivals.length; oi++) {
          var o = rivals[oi]; if (o === r) continue;
          var gap = ((o.s - r.s) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
          if (gap > 0.5 && gap < 11 && Math.abs(o.lat - r.lat) < 1.8) aiTop = Math.min(aiTop, o.v + 0.3);
        }
        r.v += 11 * (1 - r.v / (aiTop * 1.1)) * dt;
        r.v = Math.min(r.v, aiTop);
        r.s += r.v * dt; r.prog += r.v * dt;
        if (r.s >= TRACK_LEN) r.s -= TRACK_LEN;
        r.lat = r.lane + Math.sin(G.t * 0.35 + r.wob) * 0.7;
      }
      placeCar(r.car, r.s, r.lat, 0, 0, 0);
      spinWheels(r.car, r.v, dt, 0);
      if (racing) {
        var rel = ((r.prog - G.prog) % (TRACK_LEN * 4) + TRACK_LEN * 4) % (TRACK_LEN * 4);
        var relS = ((r.s - G.s + TRACK_LEN * 1.5) % TRACK_LEN) - TRACK_LEN / 2;
        if (relS > 3.5 && relS < 16 && Math.abs(r.lat - G.lat) < 1.8) aheadDraft = true;
        /* any completed pass scores: the old lateral gate (< 3.4) ate
           most honest oval passes (lanes sit ~3.7 apart) and left the
           score on 0 for whole races */
        if (!r.passed && relS < -3) { r.passed = true; G.score += 100; showEvent('PASS +100', 800); }
        if (r.passed && relS > 3) r.passed = false;
        if (Math.abs(relS) < 4.4 && Math.abs(r.lat - G.lat) >= 1.75 && Math.abs(r.lat - G.lat) < 2.9 && G.v - r.v > 5 && G.t > r.nearT) {
          r.nearT = G.t + 5; G.score += 150; showEvent('NEAR MISS +150', 800);
        }
        if (Math.abs(relS) < 4.2 && Math.abs(r.lat - G.lat) < 1.7 && G.v > 16) {
          endRace('WRECKED!', 'You tangled with a rival at ' + Math.round(G.v * 3.6) + ' KM/H.<br>Score: ' + Math.round(G.score));
        }
      }
    });
    G.pos = 1 + rivals.filter(function (r) { return r.prog > G.prog; }).length;
    if (racing && aheadDraft && G.boostT <= 0) {
      G.draft = Math.min(100, G.draft + dt * 30);
      showTag('◆ DRAFT ◆', true);
    } else if (G.boostT > 0) showTag('◆ BOOST ◆', true);
    else showTag('', false);
    if (racing && input.action && G.draft > 25 && G.boostT <= 0) G.boostT = 1.25;
  }
  /* player placement */
  var placed = placeCar(playerCar, G.s, G.lat, CFG.mode === 'drift' ? G.slip : G.steerVis * -0.05, G.steerVis, -G.steerVis * 0.045);
  spinWheels(playerCar, G.v, dt, G.steerVis);
  stepSmoke(dt);
  stepDust(dt);
  /* camera */
  if (G.phase === 'title' && CFG.mode === 'drift') {
    /* showroom orbit: slow circle around the chosen car on the grid */
    var ga = G.t * 0.30;
    var gp = placed.pos;
    var orbit = new THREE.Vector3(gp.x + Math.sin(ga) * 6.4, gp.y + 1.55, gp.z + Math.cos(ga) * 6.4);
    camPos.copy(orbit);
    camera.position.copy(camPos);
    camera.lookAt(gp.x, gp.y + 2.1, gp.z);
  } else {
  /* camera view (Tom, Nov 7): glide the smoothed multipliers toward
     the picked view — ~0.4s, never a snap. Portrait pull-back below
     composes on top of the picked view's distance/height. */
  var vTgt = CAM_VIEWS[camViewIx];
  var kSm = Math.min(1, dt * 6);
  camMultSm.d += ((vTgt.hood ? 1 : vTgt.d) - camMultSm.d) * kSm;
  camMultSm.h += ((vTgt.hood ? 1 : vTgt.h) - camMultSm.h) * kSm;
  camMultSm.hood += ((vTgt.hood ? 1 : 0) - camMultSm.hood) * kSm;
  var camDist = (CFG.camDist || 8.6) * camMultSm.d, camH = (CFG.camH || 3.1) * camMultSm.h;
  if (camera.aspect < 1) { camDist *= 1.32; camH *= 1.30; } /* portrait: pull back + up so the road ahead reads (Tom, Nov 6) */
  var camTargetTan = placed.fr.tan;
  camTan.lerp(camTargetTan, Math.min(1, dt * (CFG.mode === 'drift' ? 4.2 : 9))).normalize();
  var back = placed.pos.clone().addScaledVector(camTan, -camDist).addScaledVector(placed.up, camH);
  back.addScaledVector(placed.fr.side, G.lat * 0.22);
  if (camMultSm.hood > 0.001) { /* bonnet cam: just over the hood, road ahead.
     NOTE the livery cars are TALL (bbox ~1.8 incl. wing) with the
     driver's eye at ~1.3 in surface space — the camera rides at 1.62
     over the SURFACE POINT (placed.pos rides ~0.33 under the mesh
     origin), i.e. just above the roofline, nose-forward. Its chase
     target sits high over the car so the blend arcs OVER the roof
     instead of pushing the camera through the bodywork. */
    var hoodBack = placed.pos.clone().addScaledVector(camTan, -(CFG.camDist || 8.6) * 0.35).addScaledVector(placed.up, (CFG.camH || 3.1) * 1.9);
    var hoodPos = placed.pos.clone().addScaledVector(placed.up, 1.62).addScaledVector(camTan, 1.7);
    back.copy(hoodBack).lerp(hoodPos, camMultSm.hood);
  }
  camPos.lerp(back, Math.min(1, dt * (camMultSm.hood > 0.02 && camMultSm.hood < 0.98 ? 3.2 : 7))); /* slower push through the hood transition so no frame lands inside the car */
  camera.position.copy(camPos);
  if (G.shake > 0) {
    G.shake -= dt;
    camera.position.x += (rnd() - 0.5) * G.shake * 0.5;
    camera.position.y += (rnd() - 0.5) * G.shake * 0.4;
  }
  var look = placed.pos.clone().addScaledVector(placed.fr.tan, 10).addScaledVector(placed.up, 1.0);
  if (camMultSm.hood > 0.001) {
    var hoodLook = placed.pos.clone().addScaledVector(placed.fr.tan, 34).addScaledVector(placed.up, 1.05);
    look.lerp(hoodLook, camMultSm.hood);
  }
  camera.lookAt(look);
  }
  /* speed feel: FOV widens as the car gets fast, streaks stream past */
  var fovT = baseFov + clamp(G.v / (CFG.topSpeed || 50), 0, 1) * 7;
  if (Math.abs(fovT - camera.fov) > 0.05) {
    camera.fov += (fovT - camera.fov) * Math.min(1, dt * 3.2);
    camera.updateProjectionMatrix();
  }
  stepStreaks(dt, camera.position, camTan, placed.fr.side, placed.up, G.v);
  /* HUD */
  var kmh = Math.round(G.v * 3.6);
  document.getElementById('speedVal').textContent = kmh;
  drawDial(kmh);
  if (CFG.mode === 'nascar') {
    document.getElementById('tbLK').textContent = 'POSITION';
    document.getElementById('tbLV').innerHTML = 'P' + G.pos + ' <span style="font-size:11px;color:#9fc3ee">of ' + (rivals.length + 1) + '</span>';
    document.getElementById('tbMK').textContent = 'LAP';
    document.getElementById('tbMV').innerHTML = Math.min(G.lap + 1, CFG.laps) + '/' + CFG.laps;
    document.getElementById('tbRV').innerHTML = '<span class="gold">' + Math.round(G.score) + '</span>';
    document.getElementById('barFill').style.width = G.draft + '%';
  } else {
    document.getElementById('tbLK').textContent = 'TIME';
    var tl = Math.max(0, G.timeLeft);
    document.getElementById('tbLV').textContent = Math.floor(tl / 60) + ':' + ('0' + Math.floor(tl % 60)).slice(-2);
    document.getElementById('tbMK').textContent = 'DRIFT POINTS';
    document.getElementById('tbMV').innerHTML = '<span class="gold">' + Math.round(G.score) + '</span>';
    document.getElementById('tbRK').textContent = 'COMBO';
    document.getElementById('tbRV').innerHTML = '<span class="gold">×' + G.combo.toFixed(1) + '</span>';
    document.getElementById('comboPts').textContent = Math.round(G.score) + ' DP';
    document.getElementById('comboMult').textContent = '×' + G.combo.toFixed(1);
    document.getElementById('barFill').style.width = ((G.combo - 1) / 4 * 100) + '%';
    document.getElementById('boostFill').style.width = G.boost + '%';
    btnBoost.classList.toggle('empty', G.boost <= 0.5);
    btnBoost.classList.toggle('on', !!G.boosting);
  }
  drawMinimap();
}
function loop() {
  requestAnimationFrame(loop);
  var dt = Math.min(clock.getDelta(), 0.05);
  if (G.phase !== 'over') step(dt);
  else { /* idle scene drift on title/over screens */
    stepSmoke(dt);
    stepDust(dt);
    if (streakMat.opacity > 0) {
      streakMat.opacity = Math.max(0, streakMat.opacity - dt * 1.5);
      streaks.visible = streakMat.opacity > 0.015;
    }
    var fr = frameAt(G.s);
    var pos = surfPoint(fr, G.lat, 0.03);
    var back = pos.clone().addScaledVector(fr.tan, -(CFG.camDist || 8.6)).addScaledVector(surfUp(fr), (CFG.camH || 3.1));
    camPos.lerp(back, Math.min(1, dt * 3)); camera.position.copy(camPos);
    camera.lookAt(pos.clone().addScaledVector(fr.tan, 10));
  }
  /* shadow camera rides with the player so shadows stay crisp;
     clouds drift slowly across the sky */
  sun.position.set(playerCar.position.x + 150, playerCar.position.y + 62, playerCar.position.z + 55);
  sun.target.position.copy(playerCar.position);
  sun.target.updateMatrixWorld();
  for (var ci = 0; ci < clouds.length; ci++) {
    var cl = clouds[ci];
    cl.position.x += cl.userData.v * dt;
    if (cl.position.x > 2300) cl.position.x = -2300;
  }
  renderer.render(scene, camera);
}
function resize() {
  var w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  smokeMat.uniforms.uScale.value = h * (renderer.getPixelRatio ? renderer.getPixelRatio() : 1) * 0.5 * 1.40;
  baseFov = h > w ? 78 : 60;
  camera.fov = baseFov;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
/* QA hook */
window.__pv = {
  state: function () {
    return { phase: G.phase, s: G.s, lat: G.lat, v: G.v, score: G.score, pos: G.pos, lap: G.lap, slip: G.slip, combo: G.combo, car: selIx, color: selColor, gear: G.gear, boost: Math.round(G.boost), boosting: G.boosting, joyX: +joy.x.toFixed(2), joyBrake: +joy.brake.toFixed(2), steerVis: +G.steerVis.toFixed(2) };
  },
  setCar: function (i) { selectCar(i); },
  setColor: function (h) { selectCar(selIx, h); },
  car: function () { return { ix: selIx, name: CAR_DEFS[selIx].name, color: selColor }; },
  start: function () { startCountdown(); },
  warp: function (s, v) { G.s = s; if (v !== undefined) G.v = v; },
  debug: function () {
    return {
      cam: camera.position.toArray().map(function (n) { return Math.round(n); }),
      car: playerCar.position.toArray().map(function (n) { return Math.round(n); }),
      s: Math.round(G.s), lat: +G.lat.toFixed(1), roadHalf: ROAD_HALF
    };
  },
  traffic: function () {
    return traffic.map(function (t) {
      return { s: Math.round(t.s), lat: +t.lat.toFixed(1), v: +t.v.toFixed(1), y: +t.car.position.y.toFixed(2) };
    });
  },
  findCurve: function () {
    var bi = 0, bv = 0;
    for (var i = 0; i < frames.length; i++) { var k = Math.abs(frames[i].kappa); if (k > bv) { bv = k; bi = i; } }
    return { s: bi * SAMP_DS, kappa: frames[bi].kappa, len: TRACK_LEN };
  },
  input: input,
  joy: joy,
  setGear: function (g) { setGear(g, true); },
  view: function () { return { ix: camViewIx, name: CAM_VIEWS[camViewIx].name, dSm: +camMultSm.d.toFixed(2), hSm: +camMultSm.h.toFixed(2), hoodSm: +camMultSm.hood.toFixed(2) }; },
  cycleView: function () { cycleCamView(); }
};
window.__qaErrors = [];
window.addEventListener('error', function (e) { window.__qaErrors.push(String(e.message || e)); });
placeCar(playerCar, G.s = TRACK_LEN - GRID_BACK, CFG.mode === 'nascar' ? 3.4 : 0, 0, 0, 0);
rivals.forEach(function (r) { placeCar(r.car, r.s, r.lat, 0, 0, 0); });
traffic.forEach(function (t) { placeCar(t.car, t.s, t.lat, 0, 0, 0); });
resize();
loop();
requestAnimationFrame(function () { window.__qaReady = true; });

</script>
