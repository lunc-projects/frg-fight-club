// ---------- input ----------
const keys = {};
let steerTouch = null;           // {id, x}
const pedals = { gas:false, brake:false };
let pedalTouch = {};             // id -> 'gas'|'brake'
function pedalZone(x, y) {
  if (y < H - 108) return null;
  if (x < 96) return 'brake';
  if (x > W - 96) return 'gas';
  return null;
}
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const z = pedalZone(t.clientX, t.clientY);
    if (z) { pedalTouch[t.identifier] = z; pedals[z] = true; }
    else if (!steerTouch) steerTouch = { id: t.identifier, x: t.clientX };
  }
}, { passive:false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches)
    if (steerTouch && t.identifier === steerTouch.id) steerTouch.x = t.clientX;
}, { passive:false });
function endTouch(e) {
  for (const t of e.changedTouches) {
    if (steerTouch && t.identifier === steerTouch.id) steerTouch = null;
    const z = pedalTouch[t.identifier];
    if (z) { delete pedalTouch[t.identifier]; pedals[z] = Object.values(pedalTouch).includes(z); }
  }
}
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
let mouseDown = false, mouseX = 0;
cv.addEventListener('mousedown', e => { const z = pedalZone(e.clientX, e.clientY); if (z) pedals[z] = true; else { mouseDown = true; mouseX = e.clientX; } });
window.addEventListener('mousemove', e => { if (mouseDown) mouseX = e.clientX; });
window.addEventListener('mouseup', e => { mouseDown = false; pedals.gas = pedals.brake = false; });
window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- game state ----------
const S = { mode:'title', score:0, lap:1, distM:0, speed:0.35, shake:0, banner:'', bannerT:0 };
const player = { x:0, y:0, w:132, h:68, lean:0 };
let rivals = [], popups = [], spawnT = 0, bgScroll = 0, lastLapM = 0;
const RIVAL_COLORS = ['#e33','#3af','#fa0','#4c4','#e4e','#eee','#0cc','#f6c'];
let rivalSeq = 0;

function roadX() { const rw = W * 0.88; return { l:(W - rw) / 2, r:(W + rw) / 2, w:rw }; }
function reset() {
  S.score = 0; S.lap = 1; S.distM = 0; S.speed = 0.35; S.shake = 0; S.banner = ''; S.bannerT = 0;
  rivals = []; popups = []; spawnT = 0.4; lastLapM = 0;
  player.x = W / 2; player.y = H - 190; player.lean = 0;
}
function startGame() { reset(); S.mode = 'run'; overlay.style.display = 'none'; }
function gameOver() {
  S.mode = 'over'; S.shake = 14;
  overlay.innerHTML = '<div class="flag">🏁🏁🏁</div><h1>WRECKED!</h1>' +
    '<div class="big">SCORE ' + Math.floor(S.score) + '</div>' +
    '<p>You survived ' + S.lap + ' lap' + (S.lap > 1 ? 's' : '') + ' of the Oval King run.</p>' +
    '<div class="tap">TAP TO RACE AGAIN</div>';
  overlay.style.display = 'flex';
}
function showTitle() {
  overlay.innerHTML = '<div class="flag">🏁🏁🏁</div><h1>OVAL <span class="y">KING</span></h1><h2>STOCK CAR RUN</h2>' +
    '<p>Drag to steer your #77 stock car through traffic.<br>Hold <b style="color:#7dff8a">GAS</b> to fly, <b style="color:#ff8a7d">BRAKE</b> to thread the pack.<br>Near misses pay bonus points!</p>' +
    '<div class="tap">TAP TO START</div>';
  overlay.style.display = 'flex';
}
overlay.addEventListener('click', () => { if (S.mode !== 'run') startGame(); });
overlay.addEventListener('touchstart', e => { e.preventDefault(); if (S.mode !== 'run') startGame(); }, { passive:false });

function spawnRival() {
  const rd = roadX(), lanes = 4, lane = Math.floor(Math.random() * lanes);
  const x = rd.l + rd.w * (lane + 0.5) / lanes + (Math.random() * 22 - 11);
  for (const r of rivals) if (Math.abs(r.y + 130) < 130 && Math.abs(r.x - x) < 70) return;
  rivals.push({ x, y:-130, w:58, h:102, f:0.34 + Math.random() * 0.26,
    c: RIVAL_COLORS[rivalSeq % RIVAL_COLORS.length], n: (rivalSeq * 7 % 89) + 3, passed:false });
  rivalSeq++;
}
function popup(x, y, txt, col) { popups.push({ x, y, txt, col: col || '#ffd21f', t: 0 }); }

function update(dt) {
  // steering
  let steer = 0;
  if (keys['ArrowLeft'] || keys['a']) steer -= 1;
  if (keys['ArrowRight'] || keys['d']) steer += 1;
  const gasIn = pedals.gas || keys['ArrowUp'] || keys['w'];
  const brakeIn = pedals.brake || keys['ArrowDown'] || keys['s'];
  if (steerTouch) {
    const dx = steerTouch.x - player.x;
    player.x += dx * Math.min(1, dt * 11); steer = Math.max(-1, Math.min(1, dx / 60));
  } else if (mouseDown) {
    const dx = mouseX - player.x;
    player.x += dx * Math.min(1, dt * 11); steer = Math.max(-1, Math.min(1, dx / 60));
  } else if (steer) player.x += steer * 430 * dt;
  const rd = roadX();
  player.x = Math.max(rd.l + 30, Math.min(rd.r - 30, player.x));
  player.lean += ((steer * 0.13) - player.lean) * Math.min(1, dt * 9);
  player.y = H - 190;

  // speed
  if (gasIn) S.speed = Math.min(1, S.speed + dt * 0.55);
  else if (brakeIn) S.speed = Math.max(0.12, S.speed - dt * 0.9);
  else S.speed += (0.55 - S.speed) * dt * 0.5;
  const world = 240 + S.speed * 620;                 // px/s scroll
  bgScroll += world * dt;
  S.distM += world * dt * 0.055;
  S.score += world * dt * 0.02;
  if (S.distM - lastLapM >= 1000) {
    lastLapM += 1000; S.lap++; S.score += 500;
    S.banner = '🏁 LAP ' + S.lap; S.bannerT = 1.4;
  }
  if (S.bannerT > 0) S.bannerT -= dt;

  // rivals
  spawnT -= dt;
  if (spawnT <= 0) { spawnRival(); spawnT = Math.max(0.42, 1.05 - S.speed * 0.45) * (0.7 + Math.random() * 0.6); }
  for (const r of rivals) {
    r.y += (world - (240 + r.f * 620)) * dt + world * 0.12 * dt;
    if (!r.passed && r.y - r.h / 2 > player.y + player.h / 2) {
      r.passed = true; S.score += 100;
      if (Math.abs(r.x - player.x) < 108) { S.score += 150; popup(player.x, player.y - 70, 'NEAR MISS +150'); }
      else popup(r.x, player.y - 60, '+100', '#9fe870');
    }
    // collision (shrunk hitboxes)
    if (Math.abs(r.x - player.x) < (r.w * 0.62 + player.w * 0.52) / 2 + 16 &&
        Math.abs(r.y - player.y) < (r.h * 0.8 + player.h * 0.72) / 2) { gameOver(); return; }
  }
  rivals = rivals.filter(r => r.y < H + 160);
  for (const p of popups) { p.t += dt; p.y -= 44 * dt; }
  popups = popups.filter(p => p.t < 0.9);
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 26);
}

// ---------- drawing ----------
function drawRival(r) {
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(3, 5, r.w * 0.56, r.h * 0.52, 0, 0, 7); ctx.fill();
  ctx.fillStyle = r.c;
  roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRect(-r.w/2 + 6, -r.h * 0.18, r.w - 12, r.h * 0.3, 6); ctx.fill();   // cabin
  ctx.fillStyle = '#111';
  roundRect(-r.w/2 - 3, -r.h/2 + 4, r.w + 6, 10, 4); ctx.fill();          // splitter
  roundRect(-r.w/2 - 3, r.h/2 - 14, r.w + 6, 10, 4); ctx.fill();          // spoiler
  ctx.fillStyle = '#fff'; ctx.font = '900 24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(r.n, 0, r.h * 0.28);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  const sx = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  const sy = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  ctx.save(); ctx.translate(sx, sy);
  // apron / infield
  ctx.fillStyle = '#274d1d'; ctx.fillRect(-20, -20, W + 40, H + 40);
  const rd = roadX();
  // grandstands (scrolling crowd stripes) both sides
  const crowdCols = ['#d94f4f','#f2f2f2','#4f7dd9','#ffd21f','#e88bb0','#7dd97d'];
  const rowH = 46, off = bgScroll % rowH;
  ctx.fillStyle = '#3a3f4a'; ctx.fillRect(-20, -20, rd.l - 6 + 20, H + 40); ctx.fillRect(rd.r + 6, -20, W - rd.r + 14, H + 40);
  for (let y = -rowH + off; y < H + rowH; y += rowH) {
    const row = Math.floor((y + bgScroll) / rowH);
    for (let x = 6; x < rd.l - 16; x += 13) { ctx.fillStyle = crowdCols[(x * 7 + row * 3) % 6]; ctx.fillRect(x, y + 8, 7, 7); }
    for (let x = rd.r + 12; x < W - 10; x += 13) { ctx.fillStyle = crowdCols[(x * 5 + row * 7) % 6]; ctx.fillRect(x, y + 8, 7, 7); }
  }
  // asphalt
  ctx.fillStyle = '#33373d'; ctx.fillRect(rd.l, -20, rd.w, H + 40);
  // banking shade
  const grd = ctx.createLinearGradient(rd.l, 0, rd.r, 0);
  grd.addColorStop(0, 'rgba(255,255,255,.10)'); grd.addColorStop(0.5, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = grd; ctx.fillRect(rd.l, -20, rd.w, H + 40);
  // rumble strips
  const seg = 34, so = bgScroll % (seg * 2);
  for (let y = -seg * 2 + so; y < H + seg; y += seg) {
    ctx.fillStyle = (Math.floor((y + bgScroll) / seg) % 2 === 0) ? '#d21f2e' : '#f2f2f2';
    ctx.fillRect(rd.l - 9, y, 9, seg); ctx.fillRect(rd.r, y, 9, seg);
  }
  // lane dashes
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  const dashH = 44, dsp = 78, doff = bgScroll % dsp;
  for (let l = 1; l < 4; l++) {
    const x = rd.l + rd.w * l / 4;
    for (let y = -dsp + doff; y < H + dsp; y += dsp) ctx.fillRect(x - 3, y, 6, dashH);
  }
  // rivals + player
  for (const r of rivals) drawRival(r);
  if (carImg.complete && carImg.naturalWidth) {
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.lean);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(4, 10, player.w * 0.52, player.h * 0.52, 0, 0, 7); ctx.fill();
    ctx.drawImage(carImg, -player.w / 2, -player.h / 2, player.w, player.h);
    ctx.restore();
  }
  // popups
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.fillStyle = p.col; ctx.font = '900 19px Arial'; ctx.textAlign = 'center';
    ctx.fillText(p.txt, p.x, p.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(5,8,14,.55)'; ctx.fillRect(0, 0, W, 64 + (window.safeTop || 0));
  ctx.fillStyle = '#fff'; ctx.font = '900 21px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('SCORE ' + Math.floor(S.score), 12, 30);
  ctx.font = '800 15px Arial'; ctx.fillStyle = '#ffd21f';
  ctx.fillText('LAP ' + S.lap, 12, 53);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '900 21px Arial';
  ctx.fillText(Math.round(60 + S.speed * 130) + ' MPH', W - 126, 30);
  ctx.font = '800 13px Arial'; ctx.fillStyle = '#9fb4c8';
  ctx.fillText('PASS +100', W - 126, 53);
  if (S.bannerT > 0) {
    ctx.globalAlpha = Math.min(1, S.bannerT);
    ctx.textAlign = 'center'; ctx.font = '900 34px Arial'; ctx.fillStyle = '#ffd21f';
    ctx.fillText(S.banner, W / 2, 120); ctx.globalAlpha = 1;
  }
  // pedals
  drawPedal(10, H - 100, 82, 88, 'BRAKE', pedals.brake, '#ff5147');
  drawPedal(W - 92, H - 100, 82, 88, 'GAS', pedals.gas, '#51ff6e');
}
function drawPedal(x, y, w, h, label, on, col) {
  ctx.save();
  ctx.globalAlpha = on ? 0.95 : 0.55;
  ctx.fillStyle = on ? col : '#1c222c';
  roundRect(x, y, w, h, 14); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = on ? '#111' : col;
  ctx.font = '900 17px Arial'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 6);
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode === 'run') update(dt);
  else { bgScroll += 60 * dt; player.x = W / 2; player.y = H - 190; }
  draw();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);

// QA / debug hook
window.__game = { S, player, rivals, start: startGame,
  state: () => ({ mode: S.mode, score: S.score, lap: S.lap, x: Math.round(player.x), speed: +S.speed.toFixed(2), rivals: rivals.length }) };
</script>
</body>
</html>
