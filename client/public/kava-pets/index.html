let AC = null, muted = localStorage.getItem('kavaPetsMute') === '1';
function ensureAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function blip(f0, f1, dur, type, vol){
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
const sndCatch = combo => blip(520 + Math.min(combo, 12) * 45, 940 + Math.min(combo, 12) * 60, 0.14, 'triangle', 0.14);
const sndMiss = () => blip(220, 60, 0.3, 'sawtooth', 0.10);
const sndOver = () => { blip(392, 392, 0.16, 'triangle', 0.12); setTimeout(() => blip(311, 311, 0.16, 'triangle', 0.12), 150); setTimeout(() => blip(233, 180, 0.34, 'triangle', 0.12), 300); };
$('muteBtn').textContent = muted ? '🔇' : '🔊';
$('muteBtn').onclick = () => { muted = !muted; localStorage.setItem('kavaPetsMute', muted ? '1' : '0'); $('muteBtn').textContent = muted ? '🔇' : '🔊'; if (!muted) ensureAudio(); };

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  const r = $('wrap').getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(280, r.width); H = Math.max(320, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutCatcher();
}
addEventListener('resize', resize);

const TYPES = {
  red:     { pts: 100, w: 0.60, scale: 1.0,  spd: 1.0 },
  amber:   { pts: 150, w: 0.30, scale: 0.94, spd: 1.08 },
  diamond: { pts: 500, w: 0.10, scale: 0.8,  spd: 1.3 },
};
let state = 'menu'; // menu | play | over
let score = 0, best = +(localStorage.getItem('kavaPetsBest') || 0);
let lives = 3, combo = 0, elapsed = 0, startStamp = 0;
let pets = [], parts = [], pops = [], spawnT = 0;
let ambientOn = true; // QA hook can pause the ambient spawner for precision tests
const catcher = { x: 0, tx: 0, w: 0, h: 0, y: 0 };
function layoutCatcher(){
  catcher.h = clamp(H * 0.235, 110, 250);
  catcher.w = catcher.h * (513 / 900);
  catcher.y = H - catcher.h - Math.max(6, H * 0.012);
  if (!catcher.x) { catcher.x = W / 2; catcher.tx = W / 2; }
  catcher.x = clamp(catcher.x, catcher.w * 0.36, W - catcher.w * 0.36);
  catcher.tx = clamp(catcher.tx, catcher.w * 0.36, W - catcher.w * 0.36);
}
/* basket catch zone inside the catcher sprite (measured from the art) */
const BASKET = { cx: 0.566, rimY: 0.40, halfW: 0.375 };
function basketCX(){ return catcher.x - catcher.w / 2 + catcher.w * BASKET.cx; }
function basketRimY(){ return catcher.y + catcher.h * BASKET.rimY; }

function pickType(){
  const r = Math.random();
  if (r < TYPES.diamond.w) return 'diamond';
  if (r < TYPES.diamond.w + TYPES.amber.w) return 'amber';
  return 'red';
}
function spawnPet(type, x){
  const t = TYPES[type];
  const size = clamp(Math.min(W, H) * 0.155, 46, 96) * t.scale;
  const speedBase = (H * 0.34 + elapsed * 2.4) * t.spd;
  pets.push({
    type, x: (typeof x === 'number') ? x : size / 2 + Math.random() * (W - size),
    y: -size / 2 - Math.random() * 30, size,
    vy: speedBase * (0.85 + Math.random() * 0.35),
    sway: Math.random() * Math.PI * 2, swayAmp: 8 + Math.random() * 16,
    rot: (Math.random() - 0.5) * 0.3, vr: (Math.random() - 0.5) * 0.5,
    pulse: Math.random() * Math.PI * 2,
  });
}
function burst(x, y, color, n){
  for (let i = 0; i < (n || 14); i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 150;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.55 + Math.random() * 0.3, t: 0, color, r: 1.5 + Math.random() * 2.6 });
  }
}
function popText(x, y, text, color){
  pops.push({ x, y, text, color: color || '#ffd76a', t: 0, life: 0.85 });
}
/* ambient cavern dust */
const dust = [];
for (let i = 0; i < 42; i++) dust.push({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 1.9, s: 0.008 + Math.random() * 0.03, o: 0.25 + Math.random() * 0.55, ph: Math.random() * 6.28 });

function reset(){
  score = 0; lives = 3; combo = 0; elapsed = 0; pets = []; parts = []; pops = []; spawnT = 0.35;
  catcher.x = W / 2; catcher.tx = W / 2;
  syncHud();
}
function syncHud(){
  $('scoreV').textContent = score;
  $('bestV').textContent = best;
  $('hearts').textContent = lives > 0 ? '❤️'.repeat(lives) + '🖤'.repeat(3 - lives) : '🖤🖤🖤';
  const cc = $('comboChip');
  if (combo >= 2){ cc.style.display = ''; $('comboV').textContent = 'x' + mult(); } else cc.style.display = 'none';
}
function mult(){ return 1 + Math.min(4, Math.floor(combo / 4)); }

function startGame(){
  ensureAudio();
  reset();
  state = 'play';
  startStamp = performance.now();
  $('startScreen').hidden = true;
  $('overScreen').hidden = true;
  $('boardScreen').hidden = true;
}
function gameOver(){
  state = 'over';
  sndOver();
  const isNew = score > best;
  if (isNew){ best = score; localStorage.setItem('kavaPetsBest', best); }
  $('finalScore').textContent = score;
  $('finalBest').textContent = best;
  $('newBest').hidden = !isNew;
  prefillName();
  $('submitBtn').disabled = false;
  $('submitStatus').textContent = '';
  $('overScreen').hidden = false;
  syncHud();
}
function step(dt){
  if (state !== 'play') return;
  elapsed = (performance.now() - startStamp) / 1000;
  /* catcher eases toward target */
  catcher.x += (catcher.tx - catcher.x) * Math.min(1, dt * 16);
  /* spawner: interval tightens as the run goes on */
  spawnT -= dt;
  const interval = clamp(0.92 - elapsed * 0.008, 0.38, 0.92);
  if (spawnT <= 0){ if (ambientOn) spawnPet(pickType()); spawnT = interval * (0.7 + Math.random() * 0.6); }
  const rimY = basketRimY(), bcx = basketCX(), halfW = catcher.w * BASKET.halfW;
  const floorY = H - 4;
  for (let i = pets.length - 1; i >= 0; i--){
    const p = pets[i];
    p.sway += dt * 2.1; p.pulse += dt * 5; p.rot += p.vr * dt;
    p.y += p.vy * dt * (1 + elapsed * 0.004);
    p.x += Math.sin(p.sway) * p.swayAmp * dt;
    /* caught? pet centre crosses the basket rim inside the basket span */
    if (p.y + p.size * 0.32 >= rimY && p.y - p.size * 0.3 < rimY + 26 && Math.abs(p.x - bcx) < halfW + p.size * 0.18){
      const pts = TYPES[p.type].pts * mult();
      score += pts; combo++;
      popText(p.x, rimY - 14, '+' + pts, p.type === 'diamond' ? '#bfe9ff' : '#ffd76a');
      if (combo === 2 || combo % 4 === 0) popText(bcx, rimY - 46, T('catchW') + ' x' + combo, '#ffe98a');
      burst(p.x, rimY, p.type === 'diamond' ? '#cfeeff' : (p.type === 'amber' ? '#ffcf6a' : '#ff7d6a'), p.type === 'diamond' ? 22 : 13);
      sndCatch(combo);
      pets.splice(i, 1);
      syncHud();
      continue;
    }
    if (p.y - p.size / 2 > floorY){
      lives--; combo = 0;
      burst(p.x, floorY - 6, '#8a4a3a', 10);
      popText(p.x, floorY - 34, '💔', '#ff9a8a');
      sndMiss();
      pets.splice(i, 1);
      syncHud();
      if (lives <= 0){ gameOver(); return; }
    }
  }
  for (let i = parts.length - 1; i >= 0; i--){ const q = parts[i]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 260 * dt; if (q.t > q.life) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--){ const q = pops[i]; q.t += dt; q.y -= 42 * dt; if (q.t > q.life) pops.splice(i, 1); }
}
function drawGemFallback(c, p){
  const r = p.size / 2;
  const g = c.createRadialGradient(p.x - r * 0.3, p.y - r * 0.35, r * 0.15, p.x, p.y, r);
  const cols = { red: ['#ffb3c2', '#e01e4e', '#7d0a28'], amber: ['#fff0b3', '#f5a623', '#8a4d05'], diamond: ['#ffffff', '#bfe6ff', '#4d7fa8'] }[p.type];
  g.addColorStop(0, cols[0]); g.addColorStop(0.55, cols[1]); g.addColorStop(1, cols[2]);
  c.fillStyle = g;
  c.beginPath(); c.arc(p.x, p.y, r, 0, 6.283); c.fill();
  c.fillStyle = '#241014';
  c.beginPath(); c.arc(p.x - r * 0.32, p.y - r * 0.05, r * 0.11, 0, 6.283); c.arc(p.x + r * 0.32, p.y - r * 0.05, r * 0.11, 0, 6.283); c.fill();
  c.strokeStyle = '#241014'; c.lineWidth = Math.max(2, r * 0.07);
  c.beginPath(); c.arc(p.x, p.y + r * 0.28, r * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  /* background: cover-fit cavern art */
  const bg = IMG.bg;
  if (bg && bg.complete && bg.naturalWidth){
    const s = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
    const dw = bg.naturalWidth * s, dh = bg.naturalHeight * s;
    ctx.drawImage(bg, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a070d'); g.addColorStop(1, '#12030a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  /* warm light glow from the shaft */
  const lg = ctx.createRadialGradient(W * 0.55, H * 0.1, 10, W * 0.55, H * 0.1, H * 0.75);
  lg.addColorStop(0, 'rgba(255,190,90,0.16)'); lg.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  /* ambient dust */
  const now = performance.now() / 1000;
  for (const d of dust){
    const y = ((d.y + now * d.s) % 1) * H;
    const x = d.x * W + Math.sin(now * 0.7 + d.ph) * 9;
    ctx.globalAlpha = d.o * (0.6 + 0.4 * Math.sin(now * 2 + d.ph));
    ctx.fillStyle = '#ffcf8f';
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* pets */
  for (const p of pets){
    const img = IMG[p.type];
    const s = p.size * (1 + Math.sin(p.pulse) * 0.035);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot + Math.sin(p.sway) * 0.06);
    ctx.shadowColor = p.type === 'diamond' ? 'rgba(160,220,255,0.9)' : (p.type === 'amber' ? 'rgba(255,180,60,0.85)' : 'rgba(255,60,80,0.85)');
    ctx.shadowBlur = 16;
    if (img && img.complete && img.naturalWidth) ctx.drawImage(img, -s / 2, -s / 2, s, s);
    else { ctx.shadowBlur = 0; drawGemFallback(ctx, { x: 0, y: 0, size: s, type: p.type }); }
    ctx.restore();
  }
  /* catcher */
  const ci = IMG.catcher;
  const bob = state === 'play' ? Math.sin(now * 2.4) * 2.2 : 0;
  if (ci && ci.complete && ci.naturalWidth){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    ctx.drawImage(ci, catcher.x - catcher.w / 2, catcher.y + bob, catcher.w, catcher.h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#8a5a22';
    ctx.beginPath(); ctx.ellipse(basketCX(), basketRimY(), catcher.w * BASKET.halfW, 14, 0, 0, 6.283); ctx.fill();
  }
  /* particles */
  for (const q of parts){
    ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* floating score pops */
  ctx.textAlign = 'center';
  for (const q of pops){
    ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
    ctx.font = '900 19px Trebuchet MS, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,2,6,0.85)';
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
}

let dragging = false;
function ptrX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left); }
cv.addEventListener('pointerdown', e => { ensureAudio(); dragging = true; catcher.tx = clamp(ptrX(e), catcher.w * 0.36, W - catcher.w * 0.36); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (dragging) catcher.tx = clamp(ptrX(e), catcher.w * 0.36, W - catcher.w * 0.36); });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') catcher.tx = clamp(catcher.tx - 46, catcher.w * 0.36, W - catcher.w * 0.36);
  if (e.code === 'ArrowRight') catcher.tx = clamp(catcher.tx + 46, catcher.w * 0.36, W - catcher.w * 0.36);
  if (e.code === 'Space' && state !== 'play'){ e.preventDefault(); startGame(); }
  if (e.code === 'KeyM') $('muteBtn').onclick();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') startStamp += 0; /* elapsed derives from stamp; hidden tab rAF stalls anyway */ });

const API_URL = 'https://frg-fight-club.vercel.app/api/luna-games?game=kava-pets';
function prefillName(){
  const inp = $('nameInput');
  const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe;
  const tname = tg && tg.user && tg.user.first_name;
  inp.value = (localStorage.getItem('kavaPetsName') || tname || 'Guest').slice(0, 16);
}
let boardData = null, boardTab = 'all', boardErr = false;
async function loadBoard(){
  $('boardList').innerHTML = '<p style="text-align:center; opacity:.85">' + T('loading') + '</p>';
  boardErr = false;
  try {
    const r = await fetch(API_URL);
    if (!r.ok) throw new Error('board ' + r.status);
    boardData = await r.json();
  } catch (e) { boardData = null; boardErr = true; }
  renderBoard();
}
function renderBoard(){
  $('tabAll').className = 'play' + (boardTab === 'all' ? '' : ' alt');
  $('tabAll').style.cssText = 'font-size:14px; padding:8px 18px';
  $('tabWeek').className = 'play' + (boardTab === 'week' ? '' : ' alt');
  $('tabWeek').style.cssText = 'font-size:14px; padding:8px 18px';
  if (boardErr || !boardData){ $('boardList').innerHTML = '<p style="text-align:center; opacity:.85">' + T('boardOff') + '</p>'; return; }
  const rows = boardData[boardTab] || [];
  if (!rows.length){ $('boardList').innerHTML = '<p style="text-align:center; opacity:.85">' + T('noScores') + '</p>'; return; }
  $('boardList').innerHTML = rows.map((r, i) =>
    '<div class="row"><span class="rk">' + (i + 1) + '.</span><span class="nm"></span><span class="sc">' + r.score + '</span></div>'
  ).join('');
  [...$('boardList').querySelectorAll('.row .nm')].forEach((el, i) => { el.textContent = rows[i].name; });
}
function openBoard(){
  $('boardScreen').hidden = false;
  boardTab = 'all';
  loadBoard();
}
$('tabAll').onclick = () => { boardTab = 'all'; renderBoard(); };
$('tabWeek').onclick = () => { boardTab = 'week'; renderBoard(); };
$('boardClose').onclick = () => { $('boardScreen').hidden = true; };
$('boardBtn').onclick = openBoard;
$('startBoardBtn').onclick = openBoard;
$('overBoardBtn').onclick = openBoard;
$('submitBtn').onclick = async () => {
  const btn = $('submitBtn');
  btn.disabled = true;
  const name = ($('nameInput').value.trim() || 'Guest').slice(0, 16);
  localStorage.setItem('kavaPetsName', name);
  $('submitStatus').textContent = T('saving');
  const initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.initData) || '';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData, name, score, seconds: Math.max(1, Math.round(elapsed)) }),
    });
    const d = await r.json();
    if (d && d.ok){
      $('submitStatus').textContent = d.rank ? ('🏆 #' + d.rank + ' — ' + T('saved')) : T('saved');
      boardData = null;
    } else {
      $('submitStatus').textContent = T('couldNot');
      btn.disabled = false;
    }
  } catch (e) {
    $('submitStatus').textContent = T('couldNot');
    btn.disabled = false;
  }
};
$('startBtn').onclick = startGame;
$('againBtn').onclick = () => { $('overScreen').hidden = true; startGame(); };

/* ================= main loop ================= */
let lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const now = ts / 1000;
  const dt = Math.min(0.033, lastT ? now - lastT : 0.016);
  lastT = now;
  step(dt);
  draw();
}

/* ================= test API (house QA hooks) ================= */
window.KP = {
  start: startGame,
  step, draw,
  spawnPet, pickType,
  setCatcher(x){ catcher.x = x; catcher.tx = x; },
  catcherX: () => catcher.x,
  basket: () => ({ cx: basketCX(), rimY: basketRimY(), halfW: catcher.w * BASKET.halfW }),
  state: () => state,
  score: () => score,
  lives: () => lives,
  combo: () => combo,
  pets: () => pets.map(p => ({ type: p.type, x: p.x, y: p.y, size: p.size })),
  setLives(n){ lives = n; syncHud(); },
  setAmbient(on){ ambientOn = !!on; },
  clearPets(){ pets = []; },
  elapsed: () => elapsed,
};

resize();
applyLang();
syncHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
