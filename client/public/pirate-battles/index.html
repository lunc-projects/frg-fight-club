  #windVal { font-size: 22px; font-weight: 900; color: #ffe9a8; line-height: 1.1; }

  #capFace { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; border: 3px solid #ffd968; flex: 0 0 auto; background: #f2c894; box-shadow: 0 3px 10px rgba(0,0,0,.5); }

  #capInfo .ct { font-size: clamp(11px, 2.4vw, 13px); color: #d8c9a3; font-style: italic; }
  #scoreBox { margin-left: auto; text-align: right; font-size: clamp(12px, 2.6vw, 15px); line-height: 1.5; }
  #scoreBox b { color: #ffd968; }
  /* Controls */
  #controls { width: 100%; max-width: 980px; margin-top: 12px; display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  #readouts { display: flex; gap: 10px; flex: 1 1 260px; }

  .ro .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9fc3e8; }
  .ro .val { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; color: #fff; }
  #powWrap { width: 100%; max-width: 980px; margin-top: 10px; }
  #powBarOuter { height: 22px; border-radius: 12px; background: #12283e; border: 2px solid #33597c; overflow: hidden; position: relative; }
  #powBar { height: 100%; width: 0%; background: linear-gradient(90deg, #37d67a, #ffd968 55%, #ff7847 80%, #ff3b30); transition: none; }

  #fireBtn {

function portraitSVG(c){
  const beard = c.beardStyle==="big" ? `<path d="M22 52 Q50 96 78 52 Q74 84 50 88 Q26 84 22 52Z" fill="${c.beard}"/>`
    : c.beardStyle==="long" ? `<path d="M28 54 Q50 88 72 54 Q68 76 50 78 Q32 76 28 54Z" fill="${c.beard}"/>`
    : c.beardStyle==="short" ? `<path d="M30 56 Q50 74 70 56 Q66 70 50 71 Q34 70 30 56Z" fill="${c.beard}"/>` : "";
  const hair = c.hair ? `<path d="M18 40 Q14 74 24 82 L30 82 Q24 60 26 42Z M82 40 Q86 74 76 82 L70 82 Q76 60 74 42Z" fill="${c.hair}"/>` : "";
  const hat = c.hatStyle==="tricorn"
    ? `<path d="M8 34 Q50 4 92 34 Q92 22 76 14 Q50 4 24 14 Q8 22 8 34Z" fill="${c.hat}"/><rect x="44" y="12" width="12" height="10" rx="2" fill="#ffd968"/>`
    : `<path d="M14 36 Q16 14 50 13 Q84 14 86 36 Q50 26 14 36Z" fill="${c.hat}"/><circle cx="80" cy="34" r="4" fill="${c.hat}"/>`;
  const patch = c.patch ? `<circle cx="63" cy="44" r="7.5" fill="#14161a"/><path d="M20 30 L84 52" stroke="#14161a" stroke-width="2.5"/>` : `<circle cx="63" cy="44" r="3.4" fill="#1c1410"/>`;
  const scar = c.scar ? `<path d="M28 50 L38 62" stroke="#b06a4a" stroke-width="2.2" stroke-linecap="round"/>` : "";
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#9fc3e8"/><circle cx="50" cy="52" r="34" fill="${c.skin}"/>${hair}${beard}`+
   `<circle cx="37" cy="44" r="3.4" fill="#1c1410"/>${patch}`+
   `<path d="M31 37 L43 35 M57 35 L69 37" stroke="#2a1c10" stroke-width="2.6" stroke-linecap="round"/>`+
   `<path d="M50 46 L47 55 L53 55" stroke="#c98a54" stroke-width="2" fill="none" stroke-linecap="round"/>${scar}`+
   (c.beardStyle==="none" ? `<path d="M40 64 Q50 70 60 64" stroke="#7a3b22" stroke-width="2.6" fill="none" stroke-linecap="round"/>` : "")+
   `<circle cx="24" cy="66" r="3" fill="#ffd968"/>${hat}</svg>`;
}

/* =============== AUDIO (WebAudio synth) =============== */
let AC = null, ambGain = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); startAmbience(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function noiseBuf(dur){ const b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate); const d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
function startAmbience(){
  const src = AC.createBufferSource(); src.buffer = noiseBuf(3); src.loop = true;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 320;
  ambGain = AC.createGain(); ambGain.gain.value = 0.045;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.13; const lg = AC.createGain(); lg.gain.value = 0.02;
  lfo.connect(lg); lg.connect(ambGain.gain);
  src.connect(f); f.connect(ambGain); ambGain.connect(AC.destination); src.start(); lfo.start();
}
function sBoom(big){
  if(!audio()) return; const t = AC.currentTime;
  const n = AC.createBufferSource(); n.buffer = noiseBuf(0.6);
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(90, t+0.5);
  const g = AC.createGain(); g.gain.setValueAtTime(big?0.85:0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
  n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t); n.stop(t+0.6);
  const o = AC.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t+0.4);
  const og = AC.createGain(); og.gain.setValueAtTime(0.7, t); og.gain.exponentialRampToValueAtTime(0.001, t+0.45);
  o.connect(og); og.connect(AC.destination); o.start(t); o.stop(t+0.5);
}
function sSplash(){
  if(!audio()) return; const t = AC.currentTime;
  const n = AC.createBufferSource(); n.buffer = noiseBuf(0.45);
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(500, t+0.4);
  const g = AC.createGain(); g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.45);
  n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t); n.stop(t+0.5);
}
function sHit(kind){
  if(!audio()) return; const t = AC.currentTime;
  for(let i=0;i<4;i++){ const n = AC.createBufferSource(); n.buffer = noiseBuf(0.08);
    const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1800 + Math.random()*1500;
    const g = AC.createGain(); g.gain.setValueAtTime(0.35, t + i*0.05); g.gain.exponentialRampToValueAtTime(0.001, t + i*0.05 + 0.09);
    n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t + i*0.05); n.stop(t + i*0.05 + 0.1); }
  const o = AC.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(kind==="sail"?300:110, t); o.frequency.exponentialRampToValueAtTime(45, t+0.3);
  const og = AC.createGain(); og.gain.setValueAtTime(0.55, t); og.gain.exponentialRampToValueAtTime(0.001, t+0.32);
  o.connect(og); og.connect(AC.destination); o.start(t); o.stop(t+0.35);
}
function sJingle(win){
  if(!audio()) return; const notes = win ? [523,659,784,1046] : [392,330,262,196];
  notes.forEach((fr,i)=>{ const t = AC.currentTime + i*0.16; const o = AC.createOscillator(); o.type = "square"; o.frequency.value = fr;
    const g = AC.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.24); });
}

/* =============== STATE =============== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 960, H = 540, WATER = 428, GRAV = 330;
const $ = id => document.getElementById(id);
const G = {
  state: "menu", level: 0, php: 100, ehp: 100, emax: 100,
  score: 0, sunk: 0, shots: 0, hits: 0, battleStartScore: 0,
  angle: 45, power: 0, chargeDir: 1, wind: 0,
  ball: null, parts: [], floats: [], trail: [],
  island: {cx: 480, w: 210, h: 74}, shake: 0, flash: 0,
  sinkP: 0, sinkE: 0, t: 0, lastEnemyShot: null, msgTimer: 0
};
const clouds = Array.from({length: 6}, (_,i)=>({x: Math.random()*W, y: 22 + Math.random()*90, s: 0.6 + Math.random()*0.9, v: 4 + Math.random()*7}));
function islandH(x){ const d = (x - G.island.cx) / (G.island.w/2); if (Math.abs(d) >= 1) return 0; return G.island.h * Math.pow(1 - d*d, 1.15); }
function waterYAt(x){ return WATER + Math.sin(x*0.018 + G.t*2.1)*2.5 + Math.sin(x*0.05 - G.t*3.2)*1.2; }
function saveBest(){ const b = +(localStorage.getItem("pirateBest")||0); if (G.score > b){ localStorage.setItem("pirateBest", G.score); return true; } return false; }
function saveProgress(){ localStorage.setItem("pirateSave", JSON.stringify({level: G.level, score: G.score, sunk: G.sunk, shots: G.shots, hits: G.hits, php: G.php})); }
function loadProgress(){ try{ const s = JSON.parse(localStorage.getItem("pirateSave")||"null"); if (s && s.level >= 0 && s.level < 8){ G.level = s.level; G.score = s.score||0; G.sunk = s.sunk||0; G.shots = s.shots||0; G.hits = s.hits||0; G.php = Math.max(30, s.php||100); } }catch(e){} }

/* =============== UI TEXT =============== */
function applyLang(){
  const t = T(); document.documentElement.lang = lang; document.dir = (lang === "ar") ? "rtl" : "ltr";
  $("tTitle").textContent = t.title; $("tSub").textContent = t.sub; $("tYou").textContent = t.you;
  $("tWind").textContent = t.wind; $("tBattle").textContent = t.battle; $("tScore").textContent = t.score;
  $("tSunk").textContent = t.sunk; $("tAcc").textContent = t.acc; $("tBest").textContent = t.best;
  $("tAngle").textContent = t.angle; $("tPower").textContent = t.power; $("tFire").textContent = t.fire;
  $("howto").textContent = t.howto; $("langSel").value = lang;
  updateCaptainCard(); updateHUD();
}
function updateCaptainCard(){
  const c = CAPTAINS[G.level];
  $("capFace").innerHTML = portraitSVG(c);
  $("capName").textContent = c.name;
  $("capLvl").textContent = (G.level+1) + " / " + CAPTAINS.length;
  $("capTaunt").textContent = "“" + (TAUNTS[lang] || TAUNTS.en)[G.level] + "”";
  $("eName").textContent = c.name;
}
function updateHUD(){
  $("pHpBar").style.width = Math.max(0, G.php) + "%"; $("pHpNum").textContent = Math.max(0, Math.round(G.php));
  $("eHpBar").style.width = Math.max(0, G.ehp / G.emax * 100) + "%"; $("eHpNum").textContent = Math.max(0, Math.round(G.ehp));
  const wv = $("windVal"); const a = G.wind === 0 ? "·" : (G.wind > 0 ? "→" : "←");
  wv.textContent = a + " " + Math.abs(G.wind); wv.style.color = Math.abs(G.wind) >= 6 ? "#ff9d7a" : "#ffe9a8";
  $("scVal").textContent = G.score; $("sunkVal").textContent = G.sunk;
  $("accVal").textContent = G.shots ? Math.round(G.hits / G.shots * 100) + "%" : "—";
  $("bestVal").textContent = +(localStorage.getItem("pirateBest")||0);
  $("angVal").textContent = Math.round(G.angle) + "°";
  $("powVal").textContent = Math.round(G.power) + "%";
  $("powBar").style.width = G.power + "%";
}
function setMsg(txt, hold){ $("msg").textContent = txt; G.msgTimer = hold || 2.6; }
function showPanel(title, text, scoreLine, mainLabel, mainFn, secondLabel, secondFn){
  $("pTitle").textContent = title; $("pText").textContent = text; $("pScore").textContent = scoreLine || "";
  const m = $("pMain"); m.textContent = mainLabel; m.onclick = ()=>{ audio(); hidePanel(); mainFn(); };
  const s = $("pSecond");
  if (secondLabel){ s.style.display = ""; s.textContent = secondLabel; s.onclick = ()=>{ audio(); hidePanel(); secondFn(); }; }
  else s.style.display = "none";
  $("overlay").classList.add("show");
}
function hidePanel(){ $("overlay").classList.remove("show"); }

/* =============== BATTLE FLOW =============== */
function newWind(){ G.wind = Math.round((Math.random()*2 - 1) * 9); if (Math.random() < 0.18) G.wind = 0; }
function startBattle(repair){
  const c = CAPTAINS[G.level];
  G.emax = c.hp; G.ehp = c.hp;
  if (repair) G.php = Math.min(100, G.php + 40);
  G.island = { cx: 480 + (Math.random()*70 - 35), w: 180 + Math.random()*90, h: 52 + Math.random()*58 + G.level*3 };
  G.ball = null; G.parts = []; G.floats = []; G.trail = []; G.sinkE = 0; G.sinkP = 0;
  G.battleStartScore = G.score; newWind(); G.state = "aim"; G.power = 0;
  updateCaptainCard(); updateHUD(); setMsg(T().yourTurn, 3.2);
  $("fireBtn").disabled = false; saveProgress();
}
function newCampaign(){
  G.level = 0; G.score = 0; G.sunk = 0; G.shots = 0; G.hits = 0; G.php = 100;
  localStorage.removeItem("pirateSave"); startBattle(false);
}
function endBattle(won){
  G.state = "over"; $("fireBtn").disabled = true;
  const isBest = saveBest();
  if (won){
    G.sunk++; const acc = G.shots ? G.hits / G.shots : 0;
    const bonus = 500 + Math.round(acc * 400); G.score += bonus;
    sJingle(true);
    if (G.level >= CAPTAINS.length - 1){
      localStorage.removeItem("pirateSave"); updateHUD();
      showPanel(T().champion, T().youSunk + " +" + bonus, T().finalScore + ": " + G.score + (isBest ? " · " + T().newBest : ""), T().again, newCampaign);
    } else {
      G.level++; saveProgress(); updateHUD();
      showPanel(T().youSunk, "+" + bonus + " · " + T().repair + (isBest ? " " + T().newBest : ""), T().score + ": " + G.score, T().next, ()=>startBattle(true));
    }
  } else {
    sJingle(false); G.score = G.battleStartScore; saveProgress(); updateHUD();
    showPanel(T().youLost, CAPTAINS[G.level].name + " ⚓", T().score + ": " + G.score, T().retry, ()=>{ G.php = 100; startBattle(false); }, T().restart, newCampaign);
  }
  updateHUD();
}
/* =============== FIRING & PHYSICS =============== */
const PX = 138, EX = 822;
function pMuzzle(){ const a = G.angle*Math.PI/180; return { x: PX + 54 + Math.cos(a)*38, y: WATER - 46 - Math.sin(a)*38 + (G.pBobY||0) }; }
function eMuzzle(ang){ const a = (ang||45)*Math.PI/180; return { x: EX - 54 - Math.cos(a)*38, y: WATER - 46 - Math.sin(a)*38 + (G.eBobY||0) }; }
function burst(x, y, kind, n){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 30 + Math.random()*120;
    if (kind==="splash") G.parts.push({k:kind, x, y, vx:(Math.random()-0.5)*90, vy:-60-Math.random()*150, life:0.7+Math.random()*0.4, t:0, r:1.5+Math.random()*2.5});
    else if (kind==="splinter") G.parts.push({k:kind, x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, life:0.6+Math.random()*0.5, t:0, r:2+Math.random()*3});
    else if (kind==="smoke") G.parts.push({k:kind, x:x+(Math.random()-0.5)*10, y, vx:(Math.random()-0.5)*14, vy:-24-Math.random()*20, life:1.1+Math.random()*0.7, t:0, r:6+Math.random()*8});
    else if (kind==="bubble") G.parts.push({k:kind, x:x+(Math.random()-0.5)*70, y:y+Math.random()*8, vx:(Math.random()-0.5)*10, vy:-18-Math.random()*22, life:1+Math.random(), t:0, r:1.5+Math.random()*3});
  }
}
function floater(x, y, txt, color){ G.floats.push({x, y, txt, color, t: 0}); }
function fireBall(who, angDeg, pow){
  const m = who === "player" ? pMuzzle() : eMuzzle(angDeg);
  const a = angDeg * Math.PI/180, sp = 300 + pow * 3.4;
  const dir = who === "player" ? 1 : -1;
  G.ball = { x: m.x, y: m.y, vx: Math.cos(a)*sp*dir, vy: -Math.sin(a)*sp, from: who };
  G.trail = []; burst(m.x, m.y, "smoke", 7); sBoom(who === "player");
  if (who === "player"){ G.shots++; G.state = "ball"; }
  else { G.state = "enemyBall"; G.eAngle = angDeg; }
  updateHUD();
}
function shipRegions(isPlayer){
  const cx = isPlayer ? PX : EX, wy = WATER + (isPlayer ? (G.pBobY||0) : (G.eBobY||0));
  return {
    hull: { x1: cx-82, x2: cx+82, y1: wy-48, y2: wy+12 },
    sail: { x1: cx-58, x2: cx+44, y1: wy-200, y2: wy-48 },
    wl: wy - 22, cx, wy
  };
}
function inRect(x, y, r){ return x >= r.x1 && x <= r.x2 && y >= r.y1 && y <= r.y2; }
function resolveBall(kind){
  const b = G.ball; G.ball = null;
  const fromPlayer = b.from === "player";
  if (kind === "splash"){ burst(b.x, WATER, "splash", 22); sSplash(); if (fromPlayer) setMsg(T().miss); }
  if (kind === "blocked"){ burst(b.x, b.y, "splinter", 10); sHit("sail"); if (fromPlayer) setMsg(T().blocked); }
  if (kind === "hull" || kind === "sail" || kind === "waterline"){
    const tgtPlayer = !fromPlayer;
    let dmg = kind === "sail" ? 7 + Math.random()*5 : 15 + Math.random()*9;
    if (kind === "waterline") dmg *= 1.6;
    dmg = Math.round(dmg);
    burst(b.x, b.y, "splinter", kind === "sail" ? 10 : 20); burst(b.x, b.y, "smoke", 5);
    sHit(kind === "sail" ? "sail" : "hull"); G.shake = kind === "sail" ? 4 : 8;
    floater(b.x, b.y - 18, "-" + dmg, tgtPlayer ? "#ff8a75" : "#ffe9a8");
    if (tgtPlayer){ G.php -= dmg; G.flash = 0.4; }
    else { G.ehp -= dmg; if (fromPlayer){ G.hits++; G.score += kind === "waterline" ? 80 : (kind === "sail" ? 30 : 50); } }
    if (fromPlayer) setMsg(kind === "waterline" ? T().wlHit : (kind === "sail" ? T().sailHit : T().hit));
    updateHUD();
    if (G.ehp <= 0){ G.ehp = 0; G.state = "sinking"; updateHUD(); return; }
    if (G.php <= 0){ G.php = 0; G.state = "sinking"; updateHUD(); return; }
  }
  if (fromPlayer){
    G.state = "enemyWait"; setMsg(T().enemyTurn, 2);
    $("fireBtn").disabled = true;
    setTimeout(enemyShoot, 1150);
  } else {
    newWind(); G.state = "aim"; G.power = 0; setMsg(T().yourTurn, 3);
    $("fireBtn").disabled = false; updateHUD();
  }
}
function stepBall(dt){
  const b = G.ball; if (!b) return;
  const steps = 3, sdt = dt/steps;
  for (let i=0;i<steps;i++){
    b.vy += GRAV * sdt; b.vx += G.wind * 7 * sdt;
    b.x += b.vx * sdt; b.y += b.vy * sdt;
    const ih = islandH(b.x);
    if (ih > 2 && b.y > waterYAt(b.x) - ih - 2 && b.y < WATER + 14){ resolveBall("blocked"); return; }
    const tgt = shipRegions(b.from === "enemy");
    if (inRect(b.x, b.y, tgt.sail)){ resolveBall("sail"); return; }
    if (inRect(b.x, b.y, tgt.hull)){ resolveBall(b.y > tgt.wl ? "waterline" : "hull"); return; }
    if (b.y >= waterYAt(b.x)){ b.y = waterYAt(b.x); resolveBall("splash"); return; }
    if (b.x < -50 || b.x > W + 50 || b.y > H + 60){ resolveBall("splash"); return; }
  }
  G.trail.push({x: b.x, y: b.y}); if (G.trail.length > 20) G.trail.shift();
}
function gauss(){ return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function enemyShoot(){
  if (G.state !== "enemyWait" || G.ball) return;
  const c = CAPTAINS[G.level], from = eMuzzle(45);
  const target = { x: PX + gauss()*22, y: WATER - 26 };
  let best = null;
  for (let pw = 56; pw <= 96; pw += 5){
    for (let an = 20; an <= 76; an += 2.5){
      const a = an*Math.PI/180, sp = 300 + pw*3.4;
      let x = from.x, y = from.y, vx = -Math.cos(a)*sp, vy = -Math.sin(a)*sp, md = 1e9;
      for (let s = 0; s < 260; s++){ const dt = 0.016; vy += GRAV*dt; vx += G.wind*7*dt; x += vx*dt; y += vy*dt;
        const d = (x-target.x)*(x-target.x) + (y-target.y)*(y-target.y); if (d < md) md = d;
        if (y > WATER + 20) break; }
      if (!best || md < best.md) best = { an, pw, md };
    }
  }
  const ang = Math.max(14, Math.min(80, best.an + gauss() * c.err / 11));
  const pow = Math.max(30, Math.min(100, best.pw + gauss() * c.err / 4.5));
  G.lastEnemyShot = { ang, pow };
  fireBall("enemy", ang, pow);
}

/* =============== RENDERING =============== */
function crescent(x, y, r, color){
  ctx.save(); ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2); ctx.arc(x + r*0.45, y - r*0.18, r*0.8, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill("evenodd"); ctx.restore();
}
function drawCrew(x, y, skin, hatColor, patch, shirt){
  ctx.fillStyle = shirt; ctx.beginPath(); ctx.moveTo(x-7, y+12); ctx.lineTo(x+7, y+12); ctx.lineTo(x+5, y+1); ctx.lineTo(x-5, y+1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x, y-4, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = hatColor; ctx.beginPath(); ctx.arc(x, y-6.5, 7.2, Math.PI, Math.PI*2); ctx.fill();
  ctx.fillRect(x-7.2, y-7.5, 14.4, 2.4);
  ctx.fillStyle = "#1c1410";
  if (patch){ ctx.beginPath(); ctx.arc(x+3, y-4, 2.8, 0, Math.PI*2); ctx.fill(); ctx.fillRect(x-5, y-5, 2, 2); }
  else { ctx.fillRect(x-4.4, y-5.2, 2, 2.4); ctx.fillRect(x+2.4, y-5.2, 2, 2.4); }
  ctx.strokeStyle = "#7a3b22"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y-1.5, 3, 0.25, Math.PI - 0.25); ctx.stroke();
}
function drawShip(cx, isPlayer){
  const cap = isPlayer ? null : CAPTAINS[G.level];
  const hpFrac = isPlayer ? G.php/100 : G.ehp/G.emax;
  const sink = isPlayer ? G.sinkP : G.sinkE;
  const bobY = Math.sin(G.t*1.25 + (isPlayer?0:2.1))*3, roll = Math.sin(G.t*0.9 + (isPlayer?0.5:2.6))*0.022 + sink*0.38;
  if (isPlayer) G.pBobY = bobY; else G.eBobY = bobY;
  const sailCol = isPlayer ? "#f6efdc" : cap.sail;
  ctx.save();
  ctx.translate(cx, WATER + bobY + sink*52); ctx.rotate(roll * (isPlayer?1:-1));
  if (!isPlayer) ctx.scale(-1, 1);
  ctx.globalAlpha = 1 - sink*0.25;
  /* hull */
  const hg = ctx.createLinearGradient(0, -40, 0, 14); hg.addColorStop(0, "#8a5a28"); hg.addColorStop(0.6, "#6f431d"); hg.addColorStop(1, "#4c2c10");
  ctx.fillStyle = hg; ctx.beginPath();
  ctx.moveTo(-82, -34); ctx.lineTo(86, -34); ctx.quadraticCurveTo(80, 2, 58, 9); ctx.lineTo(-56, 11); ctx.quadraticCurveTo(-80, 4, -82, -34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#3a2008"; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
  for (let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-76, -22 + i*10); ctx.lineTo(78, -22 + i*10); ctx.stroke(); }
  ctx.fillStyle = "#ffd968"; ctx.fillRect(-82, -37, 168, 4);
  ctx.fillStyle = "#20140a"; for (let i=0;i<4;i++) ctx.fillRect(-46 + i*30, -20, 11, 9);
  /* stern castle */
  ctx.fillStyle = "#5e3a16"; ctx.fillRect(-84, -58, 30, 24); ctx.fillStyle = "#ffd968"; ctx.fillRect(-84, -60, 30, 3);
  ctx.fillStyle = "#ffe9a8"; ctx.fillRect(-76, -52, 7, 8); ctx.fillRect(-64, -52, 7, 8);
  /* masts & yards */
  ctx.strokeStyle = "#4c2c10"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(-6, -196); ctx.moveTo(42, -36); ctx.lineTo(42, -168); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-44, -182); ctx.lineTo(32, -182); ctx.moveTo(-42, -118); ctx.lineTo(30, -118); ctx.moveTo(14, -156); ctx.lineTo(68, -156); ctx.stroke();
  /* sails (billowing) */
  const bl = Math.sin(G.t*1.7 + (isPlayer?0:1.3))*4;
  function sail(x, top, bot, wdt, main){
    const g2 = ctx.createLinearGradient(x, top, x, bot); g2.addColorStop(0, sailCol); g2.addColorStop(1, isPlayer ? "#ddd0ae" : sailCol);
    ctx.fillStyle = g2; ctx.beginPath();
    ctx.moveTo(x, top); ctx.quadraticCurveTo(x + wdt + bl, (top+bot)/2, x, bot);
    ctx.quadraticCurveTo(x + 8, (top+bot)/2, x, top); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(90,70,40,.5)"; ctx.lineWidth = 1.2; ctx.stroke();
    if (main){
      if (isPlayer){ crescent(x + wdt*0.42, (top+bot)/2 - 6, 17, "#e8a91c"); ctx.fillStyle = "#0d2b52"; ctx.font = "900 11px Trebuchet MS"; ctx.textAlign = "center"; ctx.fillText("LUNC", x + wdt*0.42, (top+bot)/2 + 22); }
      else if (G.level >= 3){ ctx.fillStyle = "rgba(20,16,20,.85)"; ctx.beginPath(); ctx.arc(x + wdt*0.42, (top+bot)/2 - 8, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(x + wdt*0.42 - 6, (top+bot)/2 + 1, 12, 5);
        ctx.fillStyle = sailCol; ctx.beginPath(); ctx.arc(x + wdt*0.42 - 3.5, (top+bot)/2 - 9, 2.2, 0, Math.PI*2); ctx.arc(x + wdt*0.42 + 3.5, (top+bot)/2 - 9, 2.2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "rgba(20,16,20,.85)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + wdt*0.42 - 12, (top+bot)/2 + 16); ctx.lineTo(x + wdt*0.42 + 12, (top+bot)/2 + 8); ctx.moveTo(x + wdt*0.42 - 12, (top+bot)/2 + 8); ctx.lineTo(x + wdt*0.42 + 12, (top+bot)/2 + 16); ctx.stroke(); }
    }
  }
  sail(-6, -182, -118, 44, true); sail(-6, -112, -66, 38, false); sail(42, -156, -104, 30, false);
  /* flag */
  ctx.strokeStyle = "#4c2c10"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -196); ctx.lineTo(-6, -210); ctx.stroke();
  ctx.fillStyle = isPlayer ? "#e8a91c" : (G.level >= 3 ? "#151312" : "#a11616");
  ctx.beginPath(); ctx.moveTo(-6, -210); ctx.quadraticCurveTo(10, -213 + Math.sin(G.t*6)*2, 22, -208 + Math.sin(G.t*6 + 1)*2); ctx.quadraticCurveTo(10, -203, -6, -201); ctx.closePath(); ctx.fill();
  if (isPlayer) crescent(6, -206, 4.5, "#0d2b52");
  /* crew at the rail */
  const skins = ["#f2c894", "#c98d5a", "#8a5632"], hats = isPlayer ? ["#a11616", "#0d2b52", "#274d27"] : ["#22252b", "#5e0f1d", "#151312"];
  drawCrew(-46, -44, skins[0], hats[0], false, "#28536e");
  drawCrew(-18, -44, skins[1], hats[1], !isPlayer && cap.patch, "#5e3a16");
  drawCrew(12, -44, skins[2], hats[2], false, "#274d27");
  /* cannon */
  const ang = (isPlayer ? G.angle : (G.eAngle || 45)) * Math.PI/180;
  ctx.save(); ctx.translate(54, -42); ctx.rotate(-ang);
  ctx.fillStyle = "#22252b"; ctx.fillRect(-4, -4.5, 40, 9); ctx.fillStyle = "#3c4149"; ctx.fillRect(26, -5.5, 10, 11);
  ctx.restore();
  ctx.fillStyle = "#3a2008"; ctx.beginPath(); ctx.arc(50, -34, 6, 0, Math.PI*2); ctx.arc(62, -34, 6, 0, Math.PI*2); ctx.fill();
  /* damage fire */
  if (hpFrac < 0.45 && sink === 0){
    for (let i=0;i<3;i++){ const fx = -30 + i*30 + Math.sin(G.t*9 + i*2)*3, fh = 12 + Math.sin(G.t*13 + i)*5;
      ctx.fillStyle = "rgba(255,120,30,.85)"; ctx.beginPath(); ctx.moveTo(fx-6, -36); ctx.quadraticCurveTo(fx, -36 - fh - 8, fx+6, -36); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,210,80,.9)"; ctx.beginPath(); ctx.moveTo(fx-3, -36); ctx.quadraticCurveTo(fx, -36 - fh, fx+3, -36); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
}
function drawIsland(){
  const { cx, w, h } = G.island;
  ctx.fillStyle = "#c2a06b"; ctx.beginPath(); ctx.moveTo(cx - w/2 - 26, WATER + 8);
  for (let x = cx - w/2 - 26; x <= cx + w/2 + 26; x += 8) ctx.lineTo(x, waterYAt(x) - islandH(x) - 2);
  ctx.lineTo(cx + w/2 + 26, WATER + 8); ctx.closePath();
  const g = ctx.createLinearGradient(0, WATER - h, 0, WATER + 8); g.addColorStop(0, "#e6cf9a"); g.addColorStop(1, "#a37f45");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(90,64,20,.6)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#3f7d33"; ctx.beginPath(); ctx.ellipse(cx, WATER - h - 4, w*0.3, 9, 0, 0, Math.PI*2); ctx.fill();
  /* palm tree */
  const tx = cx + w*0.16, ty = WATER - islandH(tx) - 2;
  ctx.strokeStyle = "#6f4a1f"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + 6, ty - 22, tx + 14, ty - 38); ctx.stroke();
  ctx.strokeStyle = "#2f8f2f"; ctx.lineWidth = 3.4;
  for (let i=0;i<5;i++){ const a = -0.4 - i*0.5; ctx.beginPath(); ctx.moveTo(tx + 14, ty - 38); ctx.quadraticCurveTo(tx + 14 + Math.cos(a)*20, ty - 38 + Math.sin(a)*14 - 6, tx + 14 + Math.cos(a)*30, ty - 38 + Math.sin(a)*22 + 6); ctx.stroke(); }
  ctx.fillStyle = "#5e3a16"; ctx.beginPath(); ctx.arc(tx + 11, ty - 34, 3.6, 0, Math.PI*2); ctx.arc(tx + 17, ty - 32, 3.2, 0, Math.PI*2); ctx.fill();
}
function draw(){
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  /* sky */
  const sky = ctx.createLinearGradient(0, 0, 0, WATER); sky.addColorStop(0, "#2f6db4"); sky.addColorStop(0.55, "#7ec0e8"); sky.addColorStop(1, "#cfeef7");
  ctx.fillStyle = sky; ctx.fillRect(-12, -12, W + 24, WATER + 14);
  /* sun */
  const sg = ctx.createRadialGradient(872, 66, 6, 872, 66, 90); sg.addColorStop(0, "rgba(255,244,190,.95)"); sg.addColorStop(0.25, "rgba(255,230,140,.55)"); sg.addColorStop(1, "rgba(255,230,140,0)");
  ctx.fillStyle = sg; ctx.fillRect(760, -20, 220, 190);
  ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(872, 66, 24, 0, Math.PI*2); ctx.fill();
  /* clouds */
  ctx.fillStyle = "rgba(255,255,255,.88)";
  for (const c of clouds){ ctx.beginPath(); ctx.ellipse(c.x, c.y, 34*c.s, 12*c.s, 0, 0, Math.PI*2); ctx.ellipse(c.x + 22*c.s, c.y + 3, 24*c.s, 9*c.s, 0, 0, Math.PI*2); ctx.ellipse(c.x - 24*c.s, c.y + 4, 20*c.s, 8*c.s, 0, 0, Math.PI*2); ctx.fill(); }
  /* distant islands */
  ctx.fillStyle = "rgba(70,110,90,.35)";
  ctx.beginPath(); ctx.ellipse(180, WATER - 4, 130, 17, 0, Math.PI, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(760, WATER - 4, 160, 21, 0, Math.PI, Math.PI*2); ctx.fill();
  drawIsland();
  /* sea back layer */
  ctx.fillStyle = "rgba(46,127,184,.75)"; ctx.beginPath(); ctx.moveTo(-12, WATER + 16);
  for (let x = -12; x <= W + 12; x += 12) ctx.lineTo(x, waterYAt(x) - 3);
  ctx.lineTo(W + 12, H + 12); ctx.lineTo(-12, H + 12); ctx.closePath(); ctx.fill();
  drawShip(EX, false); drawShip(PX, true);
  /* aim guide */
  if ((G.state === "aim" || G.state === "charging") && !G.ball){
    const pw = G.state === "charging" ? G.power : 60, a = G.angle*Math.PI/180, sp = 300 + pw*3.4, m = pMuzzle();
    let x = m.x, y = m.y, vx = Math.cos(a)*sp, vy = -Math.sin(a)*sp;
    ctx.fillStyle = "rgba(255,255,255,.55)";
    for (let s = 0; s < 46; s++){ const dt = 0.045; vy += GRAV*dt; vx += G.wind*7*dt; x += vx*dt; y += vy*dt;
      if (s % 3 === 0){ ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI*2); ctx.fill(); }
      if (y > waterYAt(x) || (islandH(x) > 2 && y > waterYAt(x) - islandH(x))) break; }
  }
  /* ball + trail */
  for (let i=0;i<G.trail.length;i++){ const p = G.trail[i]; ctx.fillStyle = "rgba(30,30,40," + (i/G.trail.length*0.4) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); }
  if (G.ball){ ctx.fillStyle = "#191c22"; ctx.beginPath(); ctx.arc(G.ball.x, G.ball.y, 5.5, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(G.ball.x - 1.8, G.ball.y - 1.8, 1.8, 0, Math.PI*2); ctx.fill(); }
  /* particles */
  for (const p of G.parts){
    const f = 1 - p.t/p.life;
    if (p.k === "splash"){ ctx.fillStyle = "rgba(220,245,255," + f + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
    else if (p.k === "splinter"){ ctx.fillStyle = "rgba(122,74,33," + f + ")"; ctx.fillRect(p.x - p.r/2, p.y - p.r/2, p.r, p.r*0.6); }
    else if (p.k === "smoke"){ ctx.fillStyle = "rgba(200,200,205," + (f*0.4) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + p.t*16, 0, Math.PI*2); ctx.fill(); }
    else if (p.k === "bubble"){ ctx.strokeStyle = "rgba(220,245,255," + f + ")"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke(); }
  }
  /* sea front layer */
  const fg = ctx.createLinearGradient(0, WATER, 0, H); fg.addColorStop(0, "rgba(21,94,138,.92)"); fg.addColorStop(1, "rgba(7,44,74,.97)");
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-12, H + 12);
  for (let x = -12; x <= W + 12; x += 12) ctx.lineTo(x, waterYAt(x) + 9 + Math.sin(x*0.03 + G.t*2.6)*2);
  ctx.lineTo(W + 12, H + 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let x = -12; x <= W + 12; x += 12){ const y = waterYAt(x) + 9 + Math.sin(x*0.03 + G.t*2.6)*2; x === -12 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  /* floaters */
  ctx.textAlign = "center"; ctx.font = "900 21px Trebuchet MS";
  for (const f of G.floats){ ctx.fillStyle = f.color; ctx.globalAlpha = Math.max(0, 1 - f.t/1.2); ctx.fillText(f.txt, f.x, f.y - f.t*36); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (G.flash > 0){ ctx.fillStyle = "rgba(255,50,20," + G.flash*0.4 + ")"; ctx.fillRect(0, 0, W, H); }
}

/* =============== UPDATE LOOP =============== */
let lastTs = 0;
function loop(ts){
  const dt = Math.min(0.033, (ts - lastTs)/1000 || 0.016); lastTs = ts; G.t += dt;
  for (const c of clouds){ c.x += c.v * dt; if (c.x > W + 60) c.x = -60; }
  if (G.state === "charging"){
    G.power += G.chargeDir * dt * 135;
    if (G.power >= 100){ G.power = 100; G.chargeDir = -1; } if (G.power <= 0){ G.power = 0; G.chargeDir = 1; }
    $("powBar").style.width = G.power + "%"; $("powVal").textContent = Math.round(G.power) + "%";
  }
  if (G.ball) stepBall(dt);
  if (G.state === "sinking"){
    if (G.ehp <= 0 && G.sinkE < 1){ G.sinkE = Math.min(1, G.sinkE + dt/2.3); burst(EX, WATER + 4, "bubble", 2); if (G.sinkE >= 1) endBattle(true); }
    if (G.php <= 0 && G.sinkP < 1){ G.sinkP = Math.min(1, G.sinkP + dt/2.3); burst(PX, WATER + 4, "bubble", 2); if (G.sinkP >= 1) endBattle(false); }
  }
  for (let i = G.parts.length - 1; i >= 0; i--){ const p = G.parts[i]; p.t += dt;
    if (p.t >= p.life){ G.parts.splice(i, 1); continue; }
    if (p.k === "splash" || p.k === "splinter") p.vy += 300 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = G.floats.length - 1; i >= 0; i--){ G.floats[i].t += dt; if (G.floats[i].t > 1.2) G.floats.splice(i, 1); }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 22);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.4);
  if (G.msgTimer > 0){ G.msgTimer -= dt; if (G.msgTimer <= 0 && (G.state === "aim")) $("msg").textContent = ""; else if (G.msgTimer <= 0) $("msg").textContent = ""; }
  draw();
  requestAnimationFrame(loop);
}

/* =============== INPUT =============== */
function canvasPos(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function aimFromPointer(e){
  if (G.state !== "aim" && G.state !== "charging") return;
  const p = canvasPos(e), m = { x: PX + 54, y: WATER - 46 };
  if (p.x <= m.x + 8) return;
  let a = Math.atan2(-(p.y - m.y), p.x - m.x) * 180 / Math.PI;
  G.angle = Math.max(12, Math.min(78, a)); $("angVal").textContent = Math.round(G.angle) + "°";
}
cv.addEventListener("pointerdown", e => { audio(); aimFromPointer(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (e.buttons) aimFromPointer(e); });
function startCharge(){ if (G.state !== "aim") return; audio(); G.state = "charging"; G.power = 0; G.chargeDir = 1; $("fireBtn").classList.add("charging"); }
function releaseFire(){ if (G.state !== "charging") return; $("fireBtn").classList.remove("charging"); fireBall("player", G.angle, G.power); }
const fb = $("fireBtn");
fb.addEventListener("pointerdown", e => { e.preventDefault(); startCharge(); });
fb.addEventListener("pointerup", e => { e.preventDefault(); releaseFire(); });
fb.addEventListener("pointerleave", () => { if (G.state === "charging") releaseFire(); });
fb.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); if (!e.repeat) startCharge(); }
  if (e.code === "ArrowUp"){ G.angle = Math.min(78, G.angle + 1); $("angVal").textContent = Math.round(G.angle) + "°"; }
  if (e.code === "ArrowDown"){ G.angle = Math.max(12, G.angle - 1); $("angVal").textContent = Math.round(G.angle) + "°"; }
});
window.addEventListener("keyup", e => { if (e.code === "Space"){ e.preventDefault(); releaseFire(); } });
$("langSel").addEventListener("change", e => { lang = e.target.value; localStorage.setItem("pirateLang", lang); applyLang(); if (G.state === "menu") showStart(); });

/* =============== INIT =============== */
function showStart(){
  G.state = "menu"; $("fireBtn").disabled = true;
  showPanel(T().title, T().howto, ( +(localStorage.getItem("pirateBest")||0) > 0 ? T().best + ": " + localStorage.getItem("pirateBest") : ""), T().start, ()=>startBattle(false), G.level > 0 || G.score > 0 ? T().restart : null, newCampaign);
}
loadProgress(); G.eAngle = 45; applyLang(); showStart(); updateHUD();
requestAnimationFrame(loop);

/* QA hook */
window.__pirate = {
  G, CAPTAINS,
  start(){ hidePanel(); newCampaign(); },
  fireAt(a, p){ if (G.state === "aim" || G.state === "charging"){ G.angle = a; G.power = p; G.state = "aim"; fireBall("player", a, p); return true; } return false; },
  enemyNow(){ if (G.state === "enemyWait"){ enemyShoot(); return true; } return false; },
  state(){ return G.state; }
};
