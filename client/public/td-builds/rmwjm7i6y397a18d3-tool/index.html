<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tip Calculator — Built with Tom's Dev</title>
<style>
:root{--bg:#0a0f1e;--card:#111a2e;--line:#26324a;--ink:#e8eef7;--mut:#8fa3c0;--indigo:#6366f1;--cyan:#22d3ee;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 40px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
.brand b{font-size:17px;} .brand span{display:block;color:var(--mut);font-size:12px;font-weight:600;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
h1{font-size:22px;margin:4px 0 8px;} p{color:var(--mut);line-height:1.5;}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--indigo),#4f46e5);color:#fff;cursor:pointer;}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">TD</div><div><b>Tom's Dev</b><span>Built in the app, live in front of you</span></div></div>
<div class="card"><h1>💵 Tip Calculator</h1><p>Work out the tip and split the bill fairly — it updates as you type.</p><label style="display:block;color:var(--mut);font-weight:700;font-size:13px;">Bill amount ($)</label><input id="tpBill" type="number" min="0" step="0.01" placeholder="e.g. 64.50" style="width:100%;background:#0d1526;border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;margin:4px 0 12px;"><label style="display:block;color:var(--mut);font-weight:700;font-size:13px;">Tip %</label><input id="tpPct" type="number" min="0" step="1" value="18" style="width:100%;background:#0d1526;border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;margin:4px 0 12px;"><label style="display:block;color:var(--mut);font-weight:700;font-size:13px;">Split between (people)</label><input id="tpPpl" type="number" min="1" step="1" value="1" style="width:100%;background:#0d1526;border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;margin:4px 0 12px;"><div id="tpOut" style="background:#0d1526;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:800;min-height:24px;">Enter a bill to see the split.</div></div>
<script>
function n(id){var v=parseFloat(document.getElementById(id).value);return isFinite(v)?v:0;}
function calc(){var bill=n("tpBill"),pct=n("tpPct"),ppl=Math.max(1,Math.floor(n("tpPpl")||1));
 var tip=bill*pct/100,total=bill+tip,each=total/ppl;
 document.getElementById("tpOut").innerHTML="Tip: $"+tip.toFixed(2)+"<br>Total: $"+total.toFixed(2)+(ppl>1?"<br>Each pays: $"+each.toFixed(2):"");}
["tpBill","tpPct","tpPpl"].forEach(function(id){document.getElementById(id).addEventListener("input",calc);});
</script>
<p class="foot">Built by the Tom's Dev live builder · unlisted page</p>
</div>
</body>
</html>
