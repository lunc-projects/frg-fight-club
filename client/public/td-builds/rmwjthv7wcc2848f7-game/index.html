<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Snake — Built with Tom's Dev</title>
<style>
:root{--bg:#0a0f1e;--card:#111a2e;--line:#26324a;--ink:#e8eef7;--mut:#8fa3c0;--indigo:#6366f1;--cyan:#22d3ee;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 40px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
.brand b{font-size:17px;} .brand span{display:block;color:var(--mut);font-size:12px;font-weight:600;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
h1{font-size:22px;margin:4px 0 8px;} p{color:var(--mut);line-height:1.5;}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--indigo),#4f46e5);color:#fff;cursor:pointer;}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">TD</div><div><b>Tom's Dev</b><span>Built in the app, live in front of you</span></div></div>
<div class="card"><h1>🐍 Snake</h1><p>Eat the apples, grow long, and don't bite yourself or the walls. Arrow keys or the on-screen pad.</p><p><b id="snScore">Score: 0</b> · <b id="snBest">Best: 0</b></p><canvas id="snCv" width="320" height="320" style="width:100%;max-width:340px;background:#0d1526;border:1.5px solid var(--line);border-radius:14px;display:block;margin:0 auto;"></canvas><p id="snMsg" style="color:var(--cyan);font-weight:800;min-height:20px;"></p><div style="display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:8px 0;"><span></span><button type="button" data-d="up">⬆️</button><span></span><button type="button" data-d="left">⬅️</button><button type="button" data-d="down">⬇️</button><button type="button" data-d="right">➡️</button></div><button id="snNew" type="button">▶ Start / restart</button></div>
<script>
var cv=document.getElementById("snCv"),cx=cv.getContext("2d"),N=16,CELL=20;
var snake,dir,nd,food,score,best=0,timer=null,alive=false,waiting=false;
function place(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 for(var i=0;i<snake.length;i++)if(snake[i].x===food.x&&snake[i].y===food.y)return place();}
function start(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};nd=dir;score=0;alive=true;waiting=true;place();
 document.getElementById("snMsg").textContent="👆 Pick a direction to start moving!";draw();upd();
 if(timer)clearInterval(timer);timer=setInterval(tick,135);}
function upd(){document.getElementById("snScore").textContent="Score: "+score;
 document.getElementById("snBest").textContent="Best: "+best;}
function draw(){cx.fillStyle="#0d1526";cx.fillRect(0,0,320,320);
 cx.fillStyle="#f59e0b";cx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4);
 snake.forEach(function(s,i){cx.fillStyle=i===0?"#22d3ee":"#6366f1";cx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});}
function tick(){if(waiting)return;dir=nd;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x===h.x&&s.y===h.y;})){
  alive=false;clearInterval(timer);best=Math.max(best,score);upd();
  document.getElementById("snMsg").textContent="💥 Game over — score "+score+". Tap Start to go again.";return;}
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y){score+=10;place();}else{snake.pop();}
 draw();upd();}
function setD(d){var m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};var v=m[d];
 if(!v)return;if(!alive)start();
 if(v.x!==-dir.x||v.y!==-dir.y)nd=v;waiting=false;document.getElementById("snMsg").textContent="";}
document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){setD(b.getAttribute("data-d"));};});
document.addEventListener("keydown",function(e){var k={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];if(k){e.preventDefault();setD(k);}});
document.getElementById("snNew").onclick=start;
cx.fillStyle="#0d1526";cx.fillRect(0,0,320,320);cx.fillStyle="#8fa3c0";cx.font="700 16px system-ui";cx.textAlign="center";cx.fillText("Tap Start to play",160,165);
</script>
<p class="foot">Built by the Tom's Dev live builder · unlisted page</p>
</div>
</body>
</html>
