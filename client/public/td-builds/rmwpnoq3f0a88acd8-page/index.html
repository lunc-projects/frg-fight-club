<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ok My Choices Kind Of Site — Built with Tom's Dev</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        --bg-dark: #121212;
        --card-bg: #1e1e1e;
        --accent: #ff9800;
        --text-light: #e0e0e0;
        --text-muted: #a0a0a0;
        --radius: 12px;
        --gap: 1rem;
    }
    body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg-dark);
        color: var(--text-light);
        line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    .container { max-width: 800px; margin: 0 auto; padding: var(--gap); }
    .hero {
        background: linear-gradient(135deg, #2c3e50, #4b79a1);
        text-align: center;
        padding: 3rem var(--gap);
        border-radius: var(--radius);
        margin-bottom: var(--gap);
    }
    .hero h1 {
        margin: 0;
        font-size: 2.2rem;
        color: var(--accent);
    }
    .hero p {
        margin: 0.5rem 0 0;
        font-size: 1.1rem;
        color: var(--text-muted);
    }
    .section {
        margin-bottom: var(--gap);
    }
    .section h2 {
        margin-top: 0;
        font-size: 1.6rem;
        color: var(--accent);
    }
    .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: var(--gap);
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        margin-bottom: var(--gap);
    }
    .card p {
        margin: 0.5rem 0;
    }
    .footer {
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-muted);
        padding: 1rem 0;
    }
    @media (max-width: 600px) {
        .hero h1 { font-size: 1.8rem; }
        .hero p { font-size: 1rem; }
    }
</style>
</head>
<body>
<div class="container">
    <section class="hero">
        <h1>Ok My Choices</h1>
        <p>🔎 Trading Site – Good Look</p>
    </section>

    <section class="section">
        <h2>⏱️ 1 Minute Section</h2>
        <div class="card">
            <p>This section is dedicated to quick, one‑minute insights and updates for traders.</p>
        </div>
    </section>

    <section class="section">
        <h2>📞 Contact / Trade Details</h2>
        <div class="card">
            <p><strong>Currency I will trade:</strong> —</p>
            <p><strong>Signal:</strong> —</p>
        </div>
    </section>
</div>
<footer class="footer">
    Built by the Tom's Dev live builder · unlisted page
</footer>
</body>
</html>
