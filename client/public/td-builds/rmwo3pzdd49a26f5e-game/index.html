<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GAME Game LUNC Coin Catch Catch — Built with Tom's Dev</title>
<style>
:root{--bg:#0a0f1e;--card:#111a2e;--line:#26324a;--ink:#e8eef7;--mut:#8fa3c0;--indigo:#6366f1;--cyan:#22d3ee;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 40px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
.brand b{font-size:17px;} .brand span{display:block;color:var(--mut);font-size:12px;font-weight:600;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
h1{font-size:22px;margin:4px 0 8px;} p{color:var(--mut);line-height:1.5;}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--indigo),#4f46e5);color:#fff;cursor:pointer;}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">TD</div><div><b>Tom's Dev</b><span>Built in the app, live in front of you</span></div></div>
<div class="card"><h1>🧠 GAME Game LUNC Coin Catch Catch</h1><p>Flip the cards and find all 8 matching pairs. Fewest moves wins — tap New game to shuffle and go again.</p><p><b id="mmMoves">Moves: 0</b> · <b id="mmPairs">Pairs: 0 / 8</b></p><div id="mmGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;"></div><p id="mmWin" style="color:var(--cyan);font-weight:800;"></p><button id="mmNew" type="button">🔀 New game</button></div>
<script>
var EM=["🚀","🌙","⭐","🪐","☄️","🔭","👾","🎮"];
var LBL_MOVES="Moves:",LBL_PAIRS="Pairs:",WIN="🎉 You matched them all in {m} moves!";
var deck,open,lock,moves,pairs,first;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(){deck=shuffle(EM.concat(EM));open={};lock=false;moves=0;pairs=0;first=-1;
 document.getElementById("mmWin").textContent="";draw();}
function draw(){var g=document.getElementById("mmGrid");g.innerHTML="";
 document.getElementById("mmMoves").textContent=LBL_MOVES+" "+moves;
 document.getElementById("mmPairs").textContent=LBL_PAIRS+" "+pairs+" / 8";
 deck.forEach(function(e,i){var b=document.createElement("button");b.type="button";
  b.style.cssText="aspect-ratio:1;font-size:30px;border-radius:14px;background:"+(open[i]?"#12304a":"#1c2946")+";border:1.5px solid var(--line);cursor:pointer;";
  b.textContent=open[i]?e:"❔";b.onclick=function(){flip(i);};g.appendChild(b);});}
function flip(i){if(lock||open[i])return;open[i]=1;draw();
 if(first<0){first=i;return;}
 moves++;if(deck[first]===deck[i]){pairs++;first=-1;draw();
  if(pairs===8)document.getElementById("mmWin").textContent=WIN.replace("{m}",moves);}
 else{lock=true;var a=first;first=-1;setTimeout(function(){open[a]=0;open[i]=0;lock=false;draw();},750);}}
document.getElementById("mmNew").onclick=start;start();
</script>
<p class="foot">Built by the Tom's Dev live builder · unlisted page</p>
</div>
</body>
</html>
