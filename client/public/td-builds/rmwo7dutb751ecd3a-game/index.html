<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GARUDA NFT DEFENDER — Built with Tom's Dev</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:sans-serif;}
#gameCanvas{display:block;background:#000;}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);z-index:2;}
.button{background:#444;padding:10px 20px;margin:10px;border-radius:5px;cursor:pointer;}
.button:hover{background:#666;}
.guardian{width:80px;height:80px;border-radius:50%;margin:10px;display:inline-flex;justify-content:center;align-items:center;color:#000;font-weight:bold;cursor:pointer;}
.joystick{position:absolute;bottom:20px;left:20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%;}
.joystick .inner{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.3);border-radius:50%;top:30px;left:30px;}
.attackBtn{position:absolute;bottom:20px;right:20px;width:80px;height:80px;background:rgba(200,0,0,0.6);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px;color:#fff;}
.info{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:14px;z-index:1;}
footer{position:absolute;bottom:0;width:100%;text-align:center;font-size:10px;color:#777;padding:5px;background:#000;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiOverlay" class="overlay">
  <h1>GARUDA NFT DEFENDER</h1>
  <p>Select your Guardian</p>
  <div id="guardianSelect"></div>
  <div class="button" id="startBtn">Start Level 1</div>
</div>
<div class="info">
  <div id="tokenDisplay">Token: 0</div>
  <div id="levelDisplay">Level: 1</div>
  <div id="scoreDisplay">Score: 0</div>
</div>
<div class="joystick" id="joystick"><div class="inner" id="joystickInner"></div></div>
<div class="attackBtn" id="attackBtn">⚔️</div>
<footer>Built by the Tom's Dev live builder · unlisted page</footer>
<script>
(() => {
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth;
let H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});
const overlay=document.getElementById('uiOverlay');
const startBtn=document.getElementById('startBtn');
const guardianDiv=document.getElementById('guardianSelect');
const tokenDisp=document.getElementById('tokenDisplay');
const levelDisp=document.getElementById('levelDisplay');
const scoreDisp=document.getElementById('scoreDisplay');
const joystick=document.getElementById('joystick');
const joystickInner=document.getElementById('joystickInner');
const attackBtn=document.getElementById('attackBtn');

const guardians=[
{id:0,name:'Common Eagle',rarity:'Common',color:'#bbb',power:1},
{id:1,name:'Rare Eagle',rarity:'Rare',color:'#0f0',power:1.5},
{id:2,name:'Epic Eagle',rarity:'Epic',color:'#ff0',power:2}
];
let selectedGuardian=guardians[0];

function createGuardianButtons(){
guardianDiv.innerHTML='';
guardians.forEach(g=>{
  const div=document.createElement('div');
  div.className='guardian';
  div.style.background=g.color;
  div.textContent=g.rarity[0];
  div.title=g.name;
  div.onclick=()=>{selectedGuardian=g;highlight();}
  guardianDiv.appendChild(div);
});
function highlight(){
  document.querySelectorAll('.guardian').forEach((el,i)=>{
    el.style.border=i===selectedGuardian.id?'3px solid #fff':'none';
  });
}
highlight();
}
createGuardianButtons();

let gameState='menu'; // menu, playing, gameover, victory
let level=1;
let token=0;
let score=0;
let player, enemies, projectiles, boss, lastAttack=0;
const maxLevel=10;
const temple={x:W/2, y:H-80, w:200, h:60};

function initPlayer(){
player={x:W/2, y:H/2, r:20, speed:3, power:selectedGuardian.power, color:'#fff'};
}
function spawnEnemies(){
enemies=[];
let count=level*5;
for(let i=0;i<count;i++){
  enemies.push({x:Math.random()*W, y:-Math.random()*H, r:12, speed:1+level*0.2, health:1});
}
}
function spawnBoss(){
boss={x:W/2, y:-150, r:40+level*5, speed:0.5+level*0.1, health:level*5, maxHealth:level*5, color:'#f00'};
}
function startLevel(){
gameState='playing';
initPlayer();
spawnEnemies();
spawnBoss();
}
function endGame(victory){
gameState='gameover';
let name=prompt('Enter your name for leaderboard:','Player');
if(name){
  let scores=JSON.parse(localStorage.getItem('garudaScores')||'[]');
  scores.push({name,score});
  scores.sort((a,b)=>b.score-a.score);
  scores=scores.slice(0,5);
  localStorage.setItem('garudaScores',JSON.stringify(scores));
}
showGameOver(victory);
}
function showGameOver(victory){
let txt=victory?'Victory!':'Game Over';
let html=`<h2>${txt}</h2><p>Score: ${score}<br>Token: ${token}</p>`;
let scores=JSON.parse(localStorage.getItem('garudaScores')||'[]');
if(scores.length){
  html+='<p>Leaderboard</p><ol>';
  scores.forEach(s=>html+=`<li>${s.name}: ${s.score}</li>`);
  html+='</ol>';
}
html+='<div class="button" id="restartBtn">Restart</div>';
overlay.innerHTML=html;
overlay.style.display='flex';
document.getElementById('restartBtn').onclick=()=>{resetGame();};
}
function resetGame(){
level=1;token=0;score=0;updateUI();
overlay.style.display='none';
startBtn.textContent='Start Level 1';
gameState='menu';
}
function updateUI(){
tokenDisp.textContent='Token: '+token;
levelDisp.textContent='Level: '+level;
scoreDisp.textContent='Score: '+score;
}
let joystickActive=false, joystickPos={x:0,y:0}, moveDir={x:0,y:0};
joystick.addEventListener('pointerdown',e=>{joystickActive=true;joystickPos={x:e.clientX,y:e.clientY};});
window.addEventListener('pointermove',e=>{
if(!joystickActive) return;
let dx=e.clientX-joystickPos.x;
let dy=e.clientY-joystickPos.y;
let len=Math.hypot(dx,dy);
if(len>40){dx*=40/len;dy*=40/len;}
joystickInner.style.transform=`translate(${dx}px,${dy}px)`;
moveDir={x:dx/40,y:dy/40};
});
window.addEventListener('pointerup',e=>{joystickActive=false;joystickInner.style.transform='';moveDir={x:0,y:0};});
let attackActive=false;
attackBtn.addEventListener('pointerdown',()=>{attackActive=true;});
attackBtn.addEventListener('pointerup',()=>{attackActive=false;});
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
function gameLoop(ts){
if(gameState==='playing'){
  // movement
  let dx=0,dy=0;
  if(joystickActive){dx+=moveDir.x;dy+=moveDir.y;}
  if(keys['ArrowLeft']||keys['a'])dx-=1;
  if(keys['ArrowRight']||keys['d'])dx+=1;
  if(keys['ArrowUp']||keys['w'])dy-=1;
  if(keys['ArrowDown']||keys['s'])dy+=1;
  if(dx||dy){
    let len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    player.x+=dx*player.speed;
    player.y+=dy*player.speed;
    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  }
  // attack
  if((attackActive||keys[' ']) && ts-lastAttack>300){
    const speed=5;
    const angle=Math.atan2(dy||-1,dx||0);
    projectiles.push({x:player.x,y:player.y,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed,r:5,damage:player.power});
    lastAttack=ts;
  }
  // update projectiles
  projectiles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;});
  projectiles=projectiles.filter(p=>p.x>0&&p.x<W&&p.y>0&&p.y<H);
  // update enemies
  enemies.forEach(e=>{
    e.y+=e.speed;
  });
  // boss movement
  if(boss){
    boss.y+=boss.speed;
  }
  // collisions projectile-enemy
  projectiles.forEach(p=>{
    enemies.forEach((e,i)=>{
      if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){
        token+=1;score+=1;
        enemies.splice(i,1);
      }
    });
    if(boss && Math.hypot(p.x-boss.x,p.y-boss.y)<p.r+boss.r){
      boss.health-=p.damage;
    }
  });
  // remove dead enemies already handled
  // check boss death
  if(boss && boss.health<=0){
    token+=20;score+=20;
    boss=null;
    level++;
    if(level>maxLevel){
      endGame(true);
    }else{
      startLevel();
    }
  }
  // check lose condition
  const templeRect={x:temple.x-temple.w/2,y:temple.y-temple.h/2,w:temple.w,h:temple.h};
  const hitTemple=e=>e.x>templeRect.x && e.x<templeRect.x+templeRect.w && e.y>templeRect.y && e.y<templeRect.y+templeRect.h;
  if(enemies.some(hitTemple) || (boss && hitTemple(boss))){
    endGame(false);
  }
  updateUI();
}
draw();
requestAnimationFrame(gameLoop);
}
function draw(){
ctx.clearRect(0,0,W,H);
// background
const grad=ctx.createLinearGradient(0,0,W,0);
grad.addColorStop(0,'#001');
grad.addColorStop(1,'#004');
ctx.fillStyle=grad;
ctx.fillRect(0,0,W,H);
// storm clouds
ctx.fillStyle='rgba(50,50,80,0.3)';
for(let i=0;i<30;i++){
  ctx.beginPath();
  ctx.arc(Math.random()*W,Math.random()*H,30+Math.random()*20,0,Math.PI*2);
  ctx.fill();
}
// temple
ctx.fillStyle='#222';
ctx.fillRect(temple.x-temple.w/2,temple.y-temple.h/2,temple.w,temple.h);
ctx.fillStyle='gold';
ctx.font='20px sans-serif';
ctx.textAlign='center';
ctx.fillText('GARUDA',temple.x,temple.y+5);
// draw player
if(gameState==='playing'){
  ctx.fillStyle=player.color;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  // draw guardians (just a halo)
  ctx.strokeStyle='rgba(255,215,0,0.5)';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.stroke();
  // enemies
  ctx.fillStyle='red';
  enemies.forEach(e=>{
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  });
  // boss
  if(boss){
    ctx.fillStyle='darkred';
    ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,Math.PI*2);ctx.fill();
    // health bar
    ctx.fillStyle='black';
    ctx.fillRect(boss.x-boss.r,boss.y-boss.r-10,boss.r*2,5);
    ctx.fillStyle='lime';
    const hp=boss.health/boss.maxHealth;
    ctx.fillRect(boss.x-boss.r,boss.y-boss.r-10,boss.r*2*hp,5);
  }
  // projectiles
  ctx.fillStyle='yellow';
  projectiles.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
}
}
startBtn.onclick=()=>{overlay.style.display='none';gameState='playing';level=1;token=0;score=0;updateUI();startLevel();};
requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
