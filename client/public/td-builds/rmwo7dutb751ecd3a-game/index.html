<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GARUDA NFT DEFENDER — Built with Tom's Dev</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:sans-serif;}
#gameCanvas{display:block;background:#000;width:100%;height:100%;}
#uiOverlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);z-index:10;}
#uiOverlay button{margin:5px;padding:10px 20px;font-size:1.2em;border:none;border-radius:8px;background:#444;color:#fff;cursor:pointer;}
#uiOverlay button:hover{background:#666;}
#joystick{position:absolute;bottom:20px;left:20px;width:120px;height:120px;touch-action:none;}
#joystickBase{position:absolute;width:100%;height:100%;background:rgba(255,255,255,0.2);border-radius:50%;}
#joystickKnob{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.6);border-radius:50%;left:30px;top:30px;transform:translate(0,0);}
#attackBtn{position:absolute;bottom:20px;right:20px;width:100px;height:100px;background:rgba(255,0,0,0.6);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:2em;color:#fff;user-select:none;touch-action:none;}
#infoBar{position:absolute;top:0;left:0;width:100%;padding:5px 10px;display:flex;justify-content:space-between;font-size:1em;background:rgba(0,0,0,0.5);}
#leaderboardBtn{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.5);border:none;color:#fff;padding:5px 10px;border-radius:5px;cursor:pointer;}
#leaderboardOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:12;display:none;}
#leaderboardOverlay button{margin-top:20px;padding:5px 10px;background:#555;border:none;color:#fff;border-radius:5px;cursor:pointer;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="uiOverlay">
  <h2>Select Your Guardian</h2>
  <div id="guardianList"></div>
</div>

<div id="infoBar">
  <div id="tokenDisplay">Tokens: 0</div>
  <div id="levelDisplay">Level: 1</div>
</div>

<button id="leaderboardBtn">Leaderboard</button>

<div id="leaderboardOverlay">
  <h2>Leaderboard</h2>
  <ol id="leaderboardList"></ol>
  <button id="closeLeaderboard">Close</button>
</div>

<div id="joystick">
  <div id="joystickBase"></div>
  <div id="joystickKnob"></div>
</div>
<div id="attackBtn">⚔️</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const resize = () => {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
  };
  resize();
  window.addEventListener('resize', resize);

  // Game state
  const guardians = [
    {name:'Common Eagle', emoji:'🦅', rarity:'Common', power:1},
    {name:'Rare Eagle', emoji:'🦅✨', rarity:'Rare', power:1.5},
    {name:'Epic Eagle', emoji:'🦅🔥', rarity:'Epic', power:2},
    {name:'Legendary Eagle', emoji:'🦅⚡', rarity:'Legendary', power:3}
  ];
  let player = null;
  let enemies = [];
  let projectiles = [];
  let boss = null;
  let level = 1;
  let tokens = 0;
  let enemySpawnTimer = 0;
  let enemiesKilled = 0;
  let gameRunning = false;
  let joystickDir = {x:0,y:0};
  const tokenDisplay = document.getElementById('tokenDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const uiOverlay = document.getElementById('uiOverlay');
  const guardianList = document.getElementById('guardianList');
  const leaderboardBtn = document.getElementById('leaderboardBtn');
  const leaderboardOverlay = document.getElementById('leaderboardOverlay');
  const leaderboardList = document.getElementById('leaderboardList');
  const closeLeaderboard = document.getElementById('closeLeaderboard');

  // Initialize guardian selection UI
  guardians.forEach((g,i)=>{
    const btn=document.createElement('button');
    btn.innerHTML=`${g.emoji} ${g.name} (${g.rarity})`;
    btn.onclick=()=>{startLevel(g);};
    guardianList.appendChild(btn);
  });

  function startLevel(selectedGuardian){
    player = {
      x: canvas.width/(2*dpr),
      y: canvas.height/(dpr)-80,
      radius: 20,
      speed: 3,
      power: selectedGuardian.power,
      emoji: selectedGuardian.emoji
    };
    enemies=[];
    projectiles=[];
    boss=null;
    enemiesKilled=0;
    enemySpawnTimer=0;
    gameRunning=true;
    uiOverlay.style.display='none';
    updateInfo();
  }

  function updateInfo(){
    tokenDisplay.textContent=`Tokens: ${tokens}`;
    levelDisplay.textContent=`Level: ${level}`;
  }

  // Joystick handling
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystickKnob');
  let joystickActive = false;
  const maxDist = 40;
  joystick.addEventListener('pointerdown', e=>{
    joystickActive=true;
    moveKnob(e);
  });
  window.addEventListener('pointermove', e=>{
    if(!joystickActive) return;
    moveKnob(e);
  });
  window.addEventListener('pointerup', e=>{
    joystickActive=false;
    knob.style.left='30px';
    knob.style.top='30px';
    joystickDir={x:0,y:0};
  });
  function moveKnob(e){
    const rect=joystick.getBoundingClientRect();
    const dx=e.clientX-rect.left-rect.width/2;
    const dy=e.clientY-rect.top-rect.height/2;
    const dist=Math.hypot(dx,dy);
    const angle=Math.atan2(dy,dx);
    const limitedDist=Math.min(dist,maxDist);
    const nx=Math.cos(angle)*limitedDist;
    const ny=Math.sin(angle)*limitedDist;
    knob.style.left=`${30+nx}px`;
    knob.style.top=`${30+ny}px`;
    joystickDir={x:nx/maxDist, y:ny/maxDist};
  }

  // Attack button
  const attackBtn=document.getElementById('attackBtn');
  let attackPressed=false;
  attackBtn.addEventListener('pointerdown',()=>{attackPressed=true;});
  attackBtn.addEventListener('pointerup',()=>{attackPressed=false;});
  attackBtn.addEventListener('pointerleave',()=>{attackPressed=false;});

  // Keyboard controls
  const keys={};
  window.addEventListener('keydown',e=>{keys[e.key]=true;});
  window.addEventListener('keyup',e=>{keys[e.key]=false;});

  function spawnEnemy(){
    const side = Math.random()<0.5?'left':'right';
    const x = side==='left'?20:canvas.width/dpr-20;
    const y = -20;
    const speed = 1 + level*0.2;
    enemies.push({x,y,radius:15,speed,health:1});
  }

  function spawnBoss(){
    const x = canvas.width/dpr/2;
    const y = -80;
    const health = 5 + level*2;
    boss={x,y,radius:40,speed:0.5,health, maxHealth:health};
  }

  function fireProjectile(){
    const speed=5;
    const dir={x:0,y:-1};
    projectiles.push({
      x:player.x,
      y:player.y,
      vx:dir.x*speed,
      vy:dir.y*speed,
      radius:5,
      damage:player.power
    });
  }

  function update(dt){
    if(!gameRunning) return;
    // Player movement
    let moveX=0, moveY=0;
    if(joystickActive){
      moveX+=joystickDir.x;
      moveY+=joystickDir.y;
    }
    if(keys['ArrowLeft']||keys['a']) moveX-=1;
    if(keys['ArrowRight']||keys['d']) moveX+=1;
    if(keys['ArrowUp']||keys['w']) moveY-=1;
    if(keys['ArrowDown']||keys['s']) moveY+=1;
    const len=Math.hypot(moveX,moveY);
    if(len>0){
      moveX/=len; moveY/=len;
      player.x+=moveX*player.speed;
      player.y+=moveY*player.speed;
      // Clamp
      player.x=Math.max(player.radius, Math.min(canvas.width/dpr-player.radius, player.x));
      player.y=Math.max(player.radius, Math.min(canvas.height/dpr-player.radius, player.y));
    }
    // Attack
    if((attackPressed||keys[' ']) && (!player.lastShot||Date.now()-player.lastShot>300)){
      fireProjectile();
      player.lastShot=Date.now();
    }
    // Spawn enemies
    enemySpawnTimer+=dt;
    const spawnInterval = Math.max(800- level*50,200);
    if(enemySpawnTimer>spawnInterval && enemiesKilled < level*5){
      spawnEnemy();
      enemySpawnTimer=0;
    }
    // After enough enemies, spawn boss
    if(enemiesKilled>=level*5 && !boss){
      spawnBoss();
    }
    // Update enemies
    enemies.forEach(e=>{e.y+=e.speed;});
    // Update boss
    if(boss){
      boss.y+=boss.speed;
    }
    // Update projectiles
    projectiles.forEach(p=>{p.x+=p.vx; p.y+=p.vy;});
    // Collision detection
    // Projectiles vs enemies
    projectiles = projectiles.filter(p=>{
      let hit=false;
      enemies.forEach((e,i)=>{
        if(Math.hypot(p.x-e.x,p.y-e.y)<p.radius+e.radius){
          e.health-=p.damage;
          hit=true;
        }
      });
      if(boss && Math.hypot(p.x-boss.x,p.y-boss.y)<p.radius+boss.radius){
        boss.health-=p.damage;
        hit=true;
      }
      if(hit) return false;
      // Remove off-screen
      if(p.x<0||p.x>canvas.width/dpr||p.y<0||p.y>canvas.height/dpr) return false;
      return true;
    });
    // Remove dead enemies
    enemies = enemies.filter(e=>{
      if(e.health<=0){
        tokens+=1;
        enemiesKilled+=1;
        return false;
      }
      // Enemy reaches temple (bottom)
      if(e.y>canvas.height/dpr){
        endGame();
        return false;
      }
      return true;
    });
    // Boss health check
    if(boss && boss.health<=0){
      tokens+=10;
      level+=1;
      if(level>10){
        // Victory
        endGame(true);
        return;
      }
      // Reset for next level
      enemies=[];
      projectiles=[];
      boss=null;
      enemiesKilled=0;
      uiOverlay.innerHTML='<h2>Level Complete!</h2><button id="nextBtn">Next Level</button>';
      uiOverlay.style.display='flex';
      document.getElementById('nextBtn').onclick=()=>{uiOverlay.style.display='none';};
    }
    // Player collision with enemies
    enemies.forEach(e=>{
      if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+e.radius){
        endGame();
      }
    });
    if(boss && Math.hypot(player.x-boss.x,player.y-boss.y)<player.radius+boss.radius){
      endGame();
    }
    updateInfo();
  }

  function draw(){
    // Clear
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
    // Background sky
    const grad=ctx.createLinearGradient(0,0,0,canvas.height/dpr);
    grad.addColorStop(0,'#001');
    grad.addColorStop(1,'#004');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);
    // Storm clouds (simple)
    ctx.fillStyle='rgba(20,20,30,0.5)';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(100+i*200,80,80,0,Math.PI*2);
      ctx.fill();
    }
    // Temple
    const templeX=canvas.width/dpr/2-100;
    const templeY=canvas.height/dpr-150;
    ctx.fillStyle='#222';
    ctx.fillRect(templeX,templeY,200,150);
    ctx.fillStyle='gold';
    ctx.fillRect(templeX+20,templeY+20,160,30);
    ctx.fillStyle='#444';
    ctx.fillRect(templeX+10,templeY+60,180,80);
    // Banners
    ctx.fillStyle='gold';
    ctx.font='30px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('GARUDA',canvas.width/dpr/2,templeY+45);
    // Player
    ctx.fillStyle='white';
    ctx.font='30px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(player.emoji,player.x,player.y+10);
    // Enemies
    ctx.fillStyle='red';
    enemies.forEach(e=>{
      ctx.beginPath(); ctx.arc(e.x,e.y,e.radius,0,Math.PI*2); ctx.fill();
    });
    // Boss
    if(boss){
      ctx.fillStyle='purple';
      ctx.beginPath(); ctx.arc(boss.x,boss.y,boss.radius,0,Math.PI*2); ctx.fill();
      // Health bar
      ctx.fillStyle='black';
      ctx.fillRect(boss.x-40,boss.y-60,80,8);
      ctx.fillStyle='lime';
      const hpRatio=boss.health/boss.maxHealth;
      ctx.fillRect(boss.x-40,boss.y-60,80*hpRatio,8);
    }
    // Projectiles
    ctx.fillStyle='yellow';
    projectiles.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill();
    });
  }

  let lastTime=0;
  function loop(timestamp){
    const dt=timestamp-lastTime;
    lastTime=timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function endGame(victory=false){
    gameRunning=false;
    const msg=victory?'You Defended the Temple!':'Game Over';
    uiOverlay.innerHTML=`<h2>${msg}</h2><p>Tokens Earned: ${tokens}</p><button id="restartBtn">Restart</button>`;
    uiOverlay.style.display='flex';
    document.getElementById('restartBtn').onclick=()=>{resetGame();};
    // Leaderboard entry
    const name=prompt('Enter your name for the leaderboard:','Player');
    if(name){
      const scores=JSON.parse(localStorage.getItem('garudaScores')||'[]');
      scores.push({name,score:tokens});
      scores.sort((a,b)=>b.score-a.score);
      if(scores.length>10) scores.length=10;
      localStorage.setItem('garudaScores',JSON.stringify(scores));
    }
  }

  function resetGame(){
    level=1;
    tokens=0;
    uiOverlay.innerHTML='<h2>Select Your Guardian</h2><div id="guardianList"></div>';
    uiOverlay.style.display='flex';
    // Rebuild guardian list
    guardianList.innerHTML='';
    guardians.forEach((g,i)=>{
      const btn=document.createElement('button');
      btn.innerHTML=`${g.emoji} ${g.name} (${g.rarity})`;
      btn.onclick=()=>{startLevel(g);};
      guardianList.appendChild(btn);
    });
    updateInfo();
  }

  // Leaderboard UI
  leaderboardBtn.onclick=()=>{showLeaderboard();};
  closeLeaderboard.onclick=()=>{leaderboardOverlay.style.display='none';};

  function showLeaderboard(){
    const scores=JSON.parse(localStorage.getItem('garudaScores')||'[]');
    leaderboardList.innerHTML='';
    scores.forEach(s=>{
      const li=document.createElement('li');
      li.textContent=`${s.name}: ${s.score}`;
      leaderboardList.appendChild(li);
    });
    leaderboardOverlay.style.display='flex';
  }

})();
</script>

<footer style="position:absolute;bottom:0;width:100%;text-align:center;font-size:0.8em;padding:5px;background:rgba(0,0,0,0.5);color:#aaa;">
Built by the Tom's Dev live builder · unlisted page
</footer>
</body>
</html>
