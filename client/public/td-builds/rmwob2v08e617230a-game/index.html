<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GARUDA GRAND PRIX — Built with Tom's Dev</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif;color:#fff;}
#gameCanvas{display:block;background:#111;}
#uiOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.button{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.2);border-radius:30px;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
#gasBtn{right:20px;bottom:100px;}
#brakeBtn{right:20px;bottom:20px;}
#joystickBase{position:absolute;left:20px;bottom:20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:60px;pointer-events:auto;}
#joystickKnob{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.4);border-radius:30px;left:30px;top:30px;}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;}
.screen button{margin:10px;padding:10px 20px;font-size:18px;}
.list{max-height:60vh;overflow:auto;width:90%;background:#222;padding:10px;border-radius:8px;}
.list div{padding:5px;border-bottom:1px solid #444;cursor:pointer;}
.list div.selected{background:#555;}
footer{position:absolute;bottom:0;width:100%;text-align:center;font-size:12px;color:#777;}
#raceScreen{position:absolute;top:0;left:0;width:100%;flex-direction:row;justify-content:space-around;align-items:center;background:rgba(10,8,4,0.55);padding:8px 4px;font-size:15px;pointer-events:none;z-index:5;box-sizing:border-box;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiOverlay">
  <div id="joystickBase"><div id="joystickKnob"></div></div>
  <div id="gasBtn" class="button">▲</div>
  <div id="brakeBtn" class="button">▼</div>
</div>

<div id="startScreen" class="screen">
  <h1>GARUDA GRAND PRIX</h1>
  <button id="btnGarage">Garage</button>
  <button id="btnStart">Start Championship</button>
  <button id="btnLeaderboard">Leaderboard</button>
</div>

<div id="garageScreen" class="screen" style="display:none;">
  <h2>Garage</h2>
  <div><strong>TEST G Balance:</strong> <span id="balanceDisplay"></span></div>
  <h3>Select Car (NFT)</h3>
  <div id="carList" class="list"></div>
  <h3>Parts Shop</h3>
  <div id="partList" class="list"></div>
  <button id="btnBackFromGarage">Back</button>
</div>

<div id="raceScreen" style="display:none;">
  <h2>Race <span id="raceNumber"></span> / 10</h2>
  <div>Lap: <span id="lapNumber"></span> / 3</div>
  <div>Position: <span id="positionDisplay"></span></div>
  <div>TEST G: <span id="balanceRace"></span></div>
</div>

<div id="resultScreen" class="screen" style="display:none;">
  <h2>Race Finished!</h2>
  <div id="resultText"></div>
  <button id="btnNextRace">Next Race</button>
  <button id="btnBackToMenu">Back to Menu</button>
</div>

<div id="leaderboardScreen" class="screen" style="display:none;">
  <h2>Leaderboard</h2>
  <div id="leaderboardList"></div>
  <button id="btnBackFromLeaderboard">Back</button>
</div>

<footer>Built by the Tom's Dev live builder · unlisted page</footer>

<script>
(() => {
  // Canvas setup
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Game state
  const STATE = {
    MENU: 'menu',
    GARAGE: 'garage',
    RACE: 'race',
    RESULT: 'result',
    LEADERBOARD: 'leaderboard'
  };
  let currentState = STATE.MENU;

  // Persistent data
  const storageKey = 'garudaGrandPrixData';
  let data = {
    balance: 1000,
    ownedCars: [], // ids
    ownedParts: [], // part ids
    selectedCar: null,
    partsEquipped: {engine:null, tires:null, wing:null, turbo:null},
    leaderboard: [] // {name, score}
  };
  function loadData() {
    const saved = localStorage.getItem(storageKey);
    if (saved) data = JSON.parse(saved);
    // Ensure defaults
    if (!data.balance) data.balance = 1000;
    if (!data.ownedCars) data.ownedCars = [];
    if (!data.ownedParts) data.ownedParts = [];
    if (!data.partsEquipped) data.partsEquipped = {engine:null, tires:null, wing:null, turbo:null};
    if (!data.leaderboard) data.leaderboard = [];
  }
  function saveData() {
    localStorage.setItem(storageKey, JSON.stringify(data));
  }
  loadData();

  // NFT Cars
  const carNFTs = [
    {id:1, name:'Garuda Rookie', rarity:'Common', baseSpeed:2, baseHandling:2},
    {id:2, name:'Garuda Swift', rarity:'Rare', baseSpeed:2.5, baseHandling:2.2},
    {id:3, name:'Garuda Falcon', rarity:'Epic', baseSpeed:3, baseHandling:2.5},
    {id:4, name:'Garuda Phoenix', rarity:'Legendary', baseSpeed:3.5, baseHandling:3},
    {id:5, name:'Garuda Titan', rarity:'Mythic', baseSpeed:4, baseHandling:3.5}
  ];
  // Give player all NFTs initially for simplicity
  if (data.ownedCars.length===0) {
    data.ownedCars = carNFTs.map(c=>c.id);
    data.selectedCar = carNFTs[0].id;
    saveData();
  }

  // Parts definitions
  const parts = [
    {id:'engine1', type:'engine', name:'Turbo Engine', cost:200, speedMul:1.2},
    {id:'tires1', type:'tires', name:'Grip Tires', cost:150, handlingMul:1.2},
    {id:'wing1', type:'wing', name:'Aero Wing', cost:180, handlingMul:1.15},
    {id:'turbo1', type:'turbo', name:'Nitro Turbo', cost:250, speedMul:1.3}
  ];
  // UI Elements
  const startScreen = document.getElementById('startScreen');
  const garageScreen = document.getElementById('garageScreen');
  const raceScreen = document.getElementById('raceScreen');
  const resultScreen = document.getElementById('resultScreen');
  const leaderboardScreen = document.getElementById('leaderboardScreen');
  const balanceDisplay = document.getElementById('balanceDisplay');
  const carListDiv = document.getElementById('carList');
  const partListDiv = document.getElementById('partList');
  const raceNumberSpan = document.getElementById('raceNumber');
  const lapNumberSpan = document.getElementById('lapNumber');
  const positionDisplay = document.getElementById('positionDisplay');
  const balanceRace = document.getElementById('balanceRace');
  const resultText = document.getElementById('resultText');
  const leaderboardList = document.getElementById('leaderboardList');

  // Buttons
  document.getElementById('btnGarage').onclick = () => switchState(STATE.GARAGE);
  document.getElementById('btnStart').onclick = () => startChampionship();
  document.getElementById('btnLeaderboard').onclick = () => switchState(STATE.LEADERBOARD);
  document.getElementById('btnBackFromGarage').onclick = () => switchState(STATE.MENU);
  document.getElementById('btnBackFromLeaderboard').onclick = () => switchState(STATE.MENU);
  document.getElementById('btnNextRace').onclick = () => nextRace();
  document.getElementById('btnBackToMenu').onclick = () => switchState(STATE.MENU);

  // Joystick handling
  const joystickBase = document.getElementById('joystickBase');
  const joystickKnob = document.getElementById('joystickKnob');
  let joystickActive = false;
  let steerValue = 0; // -1 left, 1 right
  joystickBase.addEventListener('pointerdown', e=>{ joystickActive=true; moveJoystick(e); });
  window.addEventListener('pointermove', e=>{ if(joystickActive) moveJoystick(e); });
  window.addEventListener('pointerup', e=>{ joystickActive=false; steerValue=0; joystickKnob.style.left='30px'; joystickKnob.style.top='30px'; });
  function moveJoystick(e){
    const rect = joystickBase.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const maxDist = rect.width/2;
    const dist = Math.min(maxDist, Math.hypot(dx,dy));
    const angle = Math.atan2(dy,dx);
    const nx = Math.cos(angle)*dist;
    const ny = Math.sin(angle)*dist;
    joystickKnob.style.left = `${30+nx}px`;
    joystickKnob.style.top = `${30+ny}px`;
    steerValue = nx / maxDist; // -1..1
  }

  // Gas/Brake buttons
  let gasPressed = false;
  let brakePressed = false;
  const gasBtn = document.getElementById('gasBtn');
  const brakeBtn = document.getElementById('brakeBtn');
  gasBtn.addEventListener('pointerdown',()=>gasPressed=true);
  gasBtn.addEventListener('pointerup',()=>gasPressed=false);
  gasBtn.addEventListener('pointerleave',()=>gasPressed=false);
  brakeBtn.addEventListener('pointerdown',()=>brakePressed=true);
  brakeBtn.addEventListener('pointerup',()=>brakePressed=false);
  brakeBtn.addEventListener('pointerleave',()=>brakePressed=false);

  // Keyboard controls fallback
  const keys = {};
  window.addEventListener('keydown',e=>keys[e.key]=true);
  window.addEventListener('keyup',e=>keys[e.key]=false);

  // Game objects — the track is a rectangular temple-court
  // ring: an outer wall and an infield block, with the racing
  // line running around the corridor between them. The
  // centreline is sampled into waypoints; rivals ride the
  // line (always upright, always on the road), the player
  // drives freely inside the ring and is lap-counted by
  // nearest-waypoint progress around the same line.
  const RIVAL_COLORS = ['#44aaff','#37c978','#b678ff','#ff9f43','#e8e8f2','#ff6b9d'];
  let track = null;
  let waypoints = [];
  const WP_SPACING = 32;
  let steerVis = 0; // player's current steer input, for the front wheels
  function computeTrack(){
    const W = canvas.width, H = canvas.height;
    const outer = {x:14, y:64, w:W-28, h:H-88};
    const inner = {x:outer.x+84, y:outer.y+84, w:outer.w-168, h:outer.h-168};
    track = { outerRect: outer, innerRect: inner };
    const cx = outer.x + 42, cy = outer.y + 42, cw = outer.w - 84, ch = outer.h - 84;
    const edges = [
      {x1:cx, y1:cy+ch, x2:cx+cw, y2:cy+ch},   // bottom straight, heading right
      {x1:cx+cw, y1:cy+ch, x2:cx+cw, y2:cy},   // right side, heading up
      {x1:cx+cw, y1:cy, x2:cx, y2:cy},         // top straight, heading left
      {x1:cx, y1:cy, x2:cx, y2:cy+ch}          // left side, heading down
    ];
    const pts = [];
    for (const e of edges) {
      const len = Math.hypot(e.x2-e.x1, e.y2-e.y1);
      const steps = Math.max(2, Math.round(len/WP_SPACING));
      for (let i=0;i<steps;i++) {
        const t = i/steps;
        pts.push({x: e.x1 + (e.x2-e.x1)*t, y: e.y1 + (e.y2-e.y1)*t});
      }
    }
    waypoints = pts.map((p,i)=>{
      const n = pts[(i+1)%pts.length];
      const ang = Math.atan2(n.y-p.y, n.x-p.x);
      return {x:p.x, y:p.y, ang, nx:-Math.sin(ang), ny:Math.cos(ang)};
    });
  }
  computeTrack();
  window.addEventListener('resize', computeTrack);
  function pointAt(wf){
    const N = waypoints.length;
    if (!N) return {x:0, y:0, ang:0, nx:0, ny:1};
    const fl = Math.floor(wf);
    const i0 = ((fl%N)+N)%N;
    const i1 = (i0+1)%N;
    const fr = wf - fl;
    const a = waypoints[i0], b = waypoints[i1];
    return { x: a.x+(b.x-a.x)*fr, y: a.y+(b.y-a.y)*fr, ang: a.ang, nx: a.nx, ny: a.ny };
  }
  const player = {
    x:0,y:0,angle:0,speed:0,lap:0,finished:false,prog:0,local:0,startProg:0
  };
  const rivals = [];
  const maxLaps = 3;
  let raceNumber = 1;
  const totalRaces = 10;
  let raceInProgress = false;
  let raceStartTime = 0;
  let raceTimes = []; // per race

  function switchState(state){
    currentState = state;
    startScreen.style.display = (state===STATE.MENU)?'flex':'none';
    garageScreen.style.display = (state===STATE.GARAGE)?'flex':'none';
    raceScreen.style.display = (state===STATE.RACE)?'flex':'none';
    resultScreen.style.display = (state===STATE.RESULT)?'flex':'none';
    leaderboardScreen.style.display = (state===STATE.LEADERBOARD)?'flex':'none';
    if(state===STATE.GARAGE) updateGarageUI();
    if(state===STATE.LEADERBOARD) updateLeaderboardUI();
  }

  // Garage UI
  function updateGarageUI(){
    balanceDisplay.textContent = data.balance;
    // Car list
    carListDiv.innerHTML='';
    carNFTs.forEach(car=>{
      const div=document.createElement('div');
      div.textContent=`${car.name} (${car.rarity})`;
      if(data.selectedCar===car.id) div.classList.add('selected');
      div.onclick=()=>{ data.selectedCar=car.id; saveData(); updateGarageUI(); };
      carListDiv.appendChild(div);
    });
    // Part list
    partListDiv.innerHTML='';
    parts.forEach(p=>{
      const owned = data.ownedParts.includes(p.id);
      const div=document.createElement('div');
      div.textContent=`${p.name} [${p.type}] - ${p.cost} TEST G ${owned?'(Owned)':''}`;
      div.onclick=()=>{ if(!owned && data.balance>=p.cost){ data.balance-=p.cost; data.ownedParts.push(p.id); data.partsEquipped[p.type]=p.id; saveData(); updateGarageUI(); } };
      partListDiv.appendChild(div);
    });
  }

  // Leaderboard UI
  function updateLeaderboardUI(){
    leaderboardList.innerHTML='';
    const sorted = data.leaderboard.slice().sort((a,b)=>b.score-a.score).slice(0,5);
    sorted.forEach((entry,i)=>{
      const div=document.createElement('div');
      div.textContent=`${i+1}. ${entry.name} - ${entry.score.toFixed(2)}s`;
      leaderboardList.appendChild(div);
    });
    if(sorted.length===0) leaderboardList.textContent='No scores yet.';
  }

  // Race setup
  function startChampionship(){
    raceNumber=1;
    data.balance+=0; // keep balance
    raceTimes=[];
    startRace();
  }
  let raceSetup = false;
  function startRace(){
    computeTrack();
    const startWf = 2; // just past the start line on the bottom straight
    const sp = pointAt(startWf);
    player.x = sp.x;
    player.y = sp.y;
    player.angle = sp.ang;
    player.speed = 0;
    player.lap = 0;
    player.finished = false;
    player.prog = startWf;
    player.local = startWf;
    player.startProg = startWf;
    // Rivals grid up behind the start line, each in its own
    // lane of the corridor, riding the racing line.
    rivals.length = 0;
    const opponentCount = Math.min(3 + raceNumber, 6);
    const lanes = [-24, 24, -13, 13, -30, 0];
    for (let i=0;i<opponentCount;i++){
      rivals.push({
        wf: startWf - 2.4*(i+1),
        startWf: startWf - 2.4*(i+1),
        lane: lanes[i % lanes.length],
        factor: 0.93 + (i%4)*0.04,
        x: 0, y: 0, angle: 0, lap: 0, finished: false,
        baseSpeed: 218 + raceNumber*9, // px per second
        hue: RIVAL_COLORS[i % RIVAL_COLORS.length]
      });
    }
    placeRivals();
    raceSetup = true;
    raceInProgress = true;
    raceStartTime = performance.now();
    switchState(STATE.RACE);
    updateRaceHUD();
  }
  // Rival positions are derived from their place on the
  // racing line every frame — upright and on the road by
  // construction, heading along the line's tangent.
  function placeRivals(){
    const N = waypoints.length;
    if (!N) return;
    for (const r of rivals) {
      const p = pointAt(r.wf);
      r.x = p.x + p.nx * r.lane;
      r.y = p.y + p.ny * r.lane;
      r.angle = p.ang;
      r.lap = Math.max(0, Math.floor((r.wf - r.startWf) / N));
    }
  }
  function updateRaceHUD(){
    raceNumberSpan.textContent = raceNumber;
    lapNumberSpan.textContent = player.lap+1;
    balanceRace.textContent = data.balance;
    positionDisplay.textContent = calculatePosition();
  }
  function calculatePosition(){
    // Progress is measured in waypoints around the same
    // line for everyone, so positions compare directly.
    let pos = 1;
    for (const r of rivals) if (r.wf > player.prog + 0.001) pos++;
    return pos;
  }

  // Main loop
  let lastTs = 0;
  function gameLoop(ts){
    const dt = Math.min(0.05, lastTs ? (ts-lastTs)/1000 : 0.016);
    lastTs = ts;
    if(currentState===STATE.RACE && raceInProgress){
      updatePhysics(dt);
      renderScene();
      updateRaceHUD();
    }else{
      renderScene(); // still render background for menus
    }
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);

  // Physics
  function getPlayerStats(){
    const base = carNFTs.find(c=>c.id===data.selectedCar);
    let speedMul=1, handlingMul=1;
    const equipped = data.partsEquipped;
    Object.values(equipped).forEach(pid=>{
      const part = parts.find(p=>p.id===pid);
      if(part){
        if(part.speedMul) speedMul*=part.speedMul;
        if(part.handlingMul) handlingMul*=part.handlingMul;
      }
    });
    return {
      maxSpeed: (base.baseSpeed*speedMul)*120, // px per second
      acceleration: 0.1*speedMul,
      handling: (base.baseHandling*handlingMul)*0.05
    };
  }
  function updatePhysics(dt){
    // Player input
    const stats = getPlayerStats();
    const steerInput = Math.max(-1, Math.min(1,
      (keys['ArrowLeft']||keys['a']?-1:0)+(keys['ArrowRight']||keys['d']?1:0)+steerValue));
    steerVis = steerInput;
    const gasInput = (keys['ArrowUp']||keys['w']?1:0)+(gasPressed?1:0);
    const brakeInput = (keys['ArrowDown']||keys['s']?1:0)+(brakePressed?1:0);
    // Steering — authority grows with speed, capped so the
    // car turns like a car, not a top.
    const authority = 0.35 + 0.65*Math.min(1, Math.abs(player.speed)/70);
    const turnRate = Math.min(3.4, stats.handling*26) * authority;
    player.angle += steerInput * turnRate * dt;
    // Speed (px per second)
    if (gasInput) player.speed += 320*dt;
    else if (brakeInput) player.speed -= 520*dt;
    else player.speed -= Math.sign(player.speed)*Math.min(Math.abs(player.speed), 90*dt);
    if (player.speed > stats.maxSpeed) player.speed = Math.max(stats.maxSpeed, player.speed - 260*dt);
    if (player.speed < 0) player.speed = 0;
    // Move
    player.x += Math.cos(player.angle)*player.speed*dt;
    player.y += Math.sin(player.angle)*player.speed*dt;
    collideWalls(player);
    updatePlayerProgress();
    player.lap = Math.max(0, Math.floor((player.prog - player.startProg) / waypoints.length));
    // Rivals ride the racing line; a rival closing on a
    // slower car in the same lane matches its speed instead
    // of piling into it.
    for (const r of rivals) {
      let v = r.baseSpeed * r.factor * (r.finished ? 0.55 : 1);
      for (const o of rivals) {
        if (o === r) continue;
        const gap = o.wf - r.wf;
        if (gap > 0 && gap < 1.4 && Math.abs(o.lane - r.lane) < 14) {
          v = Math.min(v, o.baseSpeed * o.factor * (o.finished ? 0.55 : 1));
        }
      }
      r.wf += (v * dt) / WP_SPACING;
      if (!r.finished && Math.floor((r.wf - r.startWf) / waypoints.length) >= maxLaps) r.finished = true;
    }
    placeRivals();
    // Check race end
    if(!player.finished && player.lap>=maxLaps){
      player.finished=true;
      endRace();
    }
  }
  // Keep the player inside the ring: clamp at the outer
  // wall, push out of the infield block along the smallest
  // penetration, and scrub speed on contact.
  function collideWalls(car){
    const R = 14;
    const o = track.outerRect, inr = track.innerRect;
    if (car.x < o.x+R) { car.x = o.x+R; hitWall(); }
    if (car.x > o.x+o.w-R) { car.x = o.x+o.w-R; hitWall(); }
    if (car.y < o.y+R) { car.y = o.y+R; hitWall(); }
    if (car.y > o.y+o.h-R) { car.y = o.y+o.h-R; hitWall(); }
    if (car.x > inr.x-R && car.x < inr.x+inr.w+R && car.y > inr.y-R && car.y < inr.y+inr.h+R) {
      const dl = car.x-(inr.x-R), dr = (inr.x+inr.w+R)-car.x;
      const dtp = car.y-(inr.y-R), db = (inr.y+inr.h+R)-car.y;
      const m = Math.min(dl, dr, dtp, db);
      if (m === dl) car.x = inr.x-R;
      else if (m === dr) car.x = inr.x+inr.w+R;
      else if (m === dtp) car.y = inr.y-R;
      else car.y = inr.y+inr.h+R;
      hitWall();
    }
  }
  function hitWall(){ player.speed *= 0.55; }
  // Lap progress from the nearest racing-line waypoint,
  // unwrapped so crossing the start line counts exactly
  // once per loop — driving backwards unwinds it again.
  function updatePlayerProgress(){
    const N = waypoints.length;
    if (!N) return;
    const prev = ((Math.round(player.local)%N)+N)%N;
    let best = prev, bd = Infinity;
    for (let k=-12;k<=12;k++){
      const i = ((prev+k)%N+N)%N;
      const dx = waypoints[i].x-player.x, dy = waypoints[i].y-player.y;
      const d = dx*dx+dy*dy;
      if (d<bd){ bd=d; best=i; }
    }
    let delta = best - prev;
    if (delta < -N/2) delta += N;
    if (delta > N/2) delta -= N;
    player.prog += delta;
    player.local = best;
  }
  function endRace(){
    raceInProgress=false;
    const raceTime = (performance.now()-raceStartTime)/1000;
    raceTimes.push(raceTime);
    // Reward
    const position = calculatePosition();
    let reward = 0;
    if(position===1) reward=300;
    else if(position===2) reward=200;
    else if(position===3) reward=100;
    data.balance+=reward;
    saveData();
    resultText.textContent=`You finished ${position}${ordinalSuffix(position)} in ${raceTime.toFixed(2)}s and earned ${reward} TEST G.`;
    switchState(STATE.RESULT);
  }
  function ordinalSuffix(i){
    const j = i % 10, k = i % 100;
    if (j == 1 && k != 11) return "st";
    if (j == 2 && k != 12) return "nd";
    if (j == 3 && k != 13) return "rd";
    return "th";
  }
  function nextRace(){
    if(raceNumber<totalRaces){
      raceNumber++;
      startRace();
    }else{
      // Championship over, record total time
      const totalTime = raceTimes.reduce((a,b)=>a+b,0);
      const name = prompt('Championship complete! Enter your name for leaderboard:','Player');
      if(name){
        data.leaderboard.push({name, score:totalTime});
        saveData();
      }
      switchState(STATE.MENU);
    }
  }

  // Rendering — a top-down temple circuit: bronze apron,
  // gold rim, warm stone track ring you can actually read,
  // chequered start line, and the infield block carrying
  // the GARUDA name. No per-frame randomness (the old storm
  // clouds flickered) and no full-screen dimmer over the
  // race (the old HUD screen did that).
  function renderScene(){
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#14100b';
    ctx.fillRect(0,0,W,H);
    if (!track) return;
    const o = track.outerRect, inr = track.innerRect;
    // Bronze apron + gold rim
    ctx.fillStyle = '#6e4f16';
    ctx.fillRect(o.x-8, o.y-8, o.w+16, o.h+16);
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    ctx.strokeRect(o.x-8, o.y-8, o.w+16, o.h+16);
    // Track surface — the ring between outer wall and infield
    ctx.fillStyle = '#35312b';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // Centreline dashes
    ctx.fillStyle = 'rgba(232,220,180,0.45)';
    for (let i=0;i<waypoints.length;i+=2){
      const p = waypoints[i];
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.ang);
      ctx.fillRect(-7,-1.5,14,3);
      ctx.restore();
    }
    // Start / finish chequers across the bottom straight
    const sf = pointAt(0);
    ctx.save();
    ctx.translate(sf.x, sf.y);
    ctx.rotate(sf.ang);
    for (let rI=0;rI<6;rI++) for (let cI=0;cI<2;cI++){
      ctx.fillStyle = (rI+cI)%2 ? '#e8e8e8' : '#151515';
      ctx.fillRect(cI*6-6, -42 + rI*14, 6, 14);
    }
    ctx.restore();
    // Infield temple block
    ctx.fillStyle = '#20180f';
    ctx.fillRect(inr.x, inr.y, inr.w, inr.h);
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2;
    ctx.strokeRect(inr.x, inr.y, inr.w, inr.h);
    ctx.save();
    ctx.translate(inr.x + inr.w/2, inr.y + inr.h/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = '#d4af37';
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('GARUDA', 0, -4);
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('TEMPLE CIRCUIT', 0, 18);
    ctx.restore();
    // Gold pennants along the top wall
    for (let i=0;i<6;i++){
      const bx = o.x + (i+0.5)*(o.w/6);
      ctx.fillStyle = i%2 ? '#d4af37' : '#a37e1c';
      ctx.fillRect(bx-11, o.y+4, 22, 30);
    }
    // Cars — only once a race is set up (no stray car in menus)
    if (raceSetup) {
      for (const r of rivals) drawCar(r.x, r.y, r.angle, r.hue, false, 0);
      drawCar(player.x, player.y, player.angle, '#ff4444', true, steerVis);
    }
  }
  // A drawn top-down car whose nose (+X after rotation) is
  // its direction of travel — the old version drew the body
  // along the other axis, so every car rendered sideways.
  function drawCar(x,y,angle,color,isPlayer,steer){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    // Wheels (front pair turns with the steering)
    ctx.fillStyle = '#0c0c0c';
    ctx.save(); ctx.translate(13,-11); ctx.rotate(steer*0.4); ctx.fillRect(-5,-3,10,6); ctx.restore();
    ctx.save(); ctx.translate(13, 11); ctx.rotate(steer*0.4); ctx.fillRect(-5,-3,10,6); ctx.restore();
    ctx.fillRect(-18,-14,10,6);
    ctx.fillRect(-18,  8,10,6);
    // Body with a tapered nose
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(22,0);
    ctx.lineTo(12,-9);
    ctx.lineTo(-14,-10);
    ctx.lineTo(-20,-6);
    ctx.lineTo(-20,6);
    ctx.lineTo(-14,10);
    ctx.lineTo(12,9);
    ctx.closePath();
    ctx.fill();
    // Racing stripe + cockpit
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-16,-2,30,4);
    ctx.fillStyle = 'rgba(10,16,28,0.9)';
    ctx.beginPath(); ctx.ellipse(0,0,8,6,0,0,Math.PI*2); ctx.fill();
    // Rear wing
    ctx.fillStyle = '#191919';
    ctx.fillRect(-22,-12,5,24);
    // The player's car wears a gold ring so it is never lost
    if (isPlayer) {
      ctx.strokeStyle = '#ffd94d';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  // Read-only snapshot for automated play checks — the same
  // numbers the game itself is using, nothing invented.
  window.__gpState = () => ({
    state: currentState,
    raceInProgress,
    player: {x: player.x, y: player.y, angle: player.angle, speed: player.speed, lap: player.lap, prog: player.prog},
    rivals: rivals.map(r => ({x: r.x, y: r.y, angle: r.angle, lap: r.lap, finished: r.finished})),
    track: track ? {outer: track.outerRect, inner: track.innerRect} : null,
    canvas: {w: canvas.width, h: canvas.height}
  });
})();
</script>
</body>
</html>
