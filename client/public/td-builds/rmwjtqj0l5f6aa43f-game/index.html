<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Breakout — Built with Tom's Dev</title>
<style>
:root{--bg:#0a0f1e;--card:#111a2e;--line:#26324a;--ink:#e8eef7;--mut:#8fa3c0;--indigo:#6366f1;--cyan:#22d3ee;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 40px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
.brand b{font-size:17px;} .brand span{display:block;color:var(--mut);font-size:12px;font-weight:600;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
h1{font-size:22px;margin:4px 0 8px;} p{color:var(--mut);line-height:1.5;}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--indigo),#4f46e5);color:#fff;cursor:pointer;}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">TD</div><div><b>Tom's Dev</b><span>Built in the app, live in front of you</span></div></div>
<div class="card"><h1>🧱 Breakout</h1><p>Smash every brick with the ball. Move the paddle with your finger, mouse, or arrow keys — don't let the ball past you.</p><p><b id="bkScore">Score: 0</b> · <b id="bkLives">Lives: 3</b></p><canvas id="bkCv" width="320" height="400" style="width:100%;max-width:340px;background:#0d1526;border:1.5px solid var(--line);border-radius:14px;display:block;margin:0 auto;touch-action:none;"></canvas><p id="bkMsg" style="color:var(--cyan);font-weight:800;min-height:20px;"></p><button id="bkNew" type="button">▶ Start / restart</button></div>
<script>
var cv=document.getElementById("bkCv"),cx=cv.getContext("2d"),W=320,H=400;
var px,bx,by,bvx,bvy,bricks,score,lives,run=false,raf=null;
function buildBricks(){bricks=[];for(var r=0;r<5;r++)for(var c=0;c<6;c++)bricks.push({x:8+c*51,y:36+r*20,w:45,h:13,on:true});}
function start(){px=130;bx=160;by=330;bvx=2.4;bvy=-2.8;score=0;lives=3;buildBricks();run=true;
 document.getElementById("bkMsg").textContent="";upd();if(raf)cancelAnimationFrame(raf);loop();}
function upd(){document.getElementById("bkScore").textContent="Score: "+score;document.getElementById("bkLives").textContent="Lives: "+lives;}
function draw(){cx.fillStyle="#0d1526";cx.fillRect(0,0,W,H);
 var cols=["#f59e0b","#22d3ee","#6366f1","#4ade80","#fb7185"];
 bricks.forEach(function(b,i){if(!b.on)return;cx.fillStyle=cols[Math.floor(i/6)%5];cx.fillRect(b.x,b.y,b.w,b.h);});
 cx.fillStyle="#e8eef7";cx.fillRect(px,378,60,10);
 cx.beginPath();cx.arc(bx,by,6,0,7);cx.fillStyle="#fbbf24";cx.fill();}
function loop(){if(!run)return;bx+=bvx;by+=bvy;
 if(bx<6||bx>W-6)bvx=-bvx;if(by<6)bvy=-bvy;
 if(by>372&&by<384&&bx>px&&bx<px+60){bvy=-Math.abs(bvy);bvx=((bx-(px+30))/30)*3.2;}
 if(by>H){lives--;upd();if(lives<=0){run=false;document.getElementById("bkMsg").textContent="💥 Out of lives — score "+score+". Tap Start to retry.";draw();return;}bx=160;by=330;bvx=2.4;bvy=-2.8;}
 for(var i=0;i<bricks.length;i++){var b=bricks[i];if(b.on&&bx>b.x&&bx<b.x+b.w&&by>b.y&&by<b.y+b.h){b.on=false;bvy=-bvy;score+=10;upd();break;}}
 if(bricks.every(function(b){return !b.on;})){run=false;document.getElementById("bkMsg").textContent="🎉 You cleared every brick — score "+score+"!";draw();return;}
 draw();raf=requestAnimationFrame(loop);}
function move(clientX){var r=cv.getBoundingClientRect();var x=(clientX-r.left)*(W/r.width);px=Math.max(0,Math.min(W-60,x-30));}
cv.addEventListener("touchmove",function(e){e.preventDefault();move(e.touches[0].clientX);},{passive:false});
cv.addEventListener("mousemove",function(e){move(e.clientX);});
document.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")px=Math.max(0,px-18);if(e.key==="ArrowRight")px=Math.min(W-60,px+18);});
document.getElementById("bkNew").onclick=start;
px=130;buildBricks();bx=160;by=330;draw();
</script>
<p class="foot">Built by the Tom's Dev live builder · unlisted page</p>
</div>
</body>
</html>
