  .spacer { flex:1; }

  .total { background:rgba(0,0,0,.45); border:1px solid rgba(255,217,104,.55); color:#ffd968; border-radius:999px; padding:2px 10px; font-size:13px; min-width:34px; text-align:center; }

  .card { width:62px; height:88px; border-radius:9px; position:relative; flex:0 0 auto;
    background:linear-gradient(160deg, #ffffff 0%, #f1ecdf 100%);
    box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 0 0 1px #d8d2c0;
    animation: dealIn .38s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: top right; }
  @keyframes dealIn { from { transform: translate(46px,-64px) rotate(14deg) scale(.6); opacity:0; } to { transform:none; opacity:1; } }
  .card .tl { position:absolute; top:4px; left:6px; font-size:16px; font-weight:800; line-height:1; text-align:center; }
  .card .tl small { display:block; font-size:14px; margin-top:1px; }
  .card .pip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:38px; }
  .card.red { color:#c22430; } .card.black { color:#1d2433; }
  .card.face .pip { font-size:30px; font-weight:900; width:44px; height:56px; margin:auto; inset:0; border:2px solid currentColor; border-radius:6px; background:rgba(255,215,90,.18); }
  .cardWrap { perspective:600px; flex:0 0 auto; width:62px; height:88px; }
  .cardFlip { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.7,.3,1); }
  .cardFlip.flipped { transform: rotateY(180deg); }
  .cardFlip .card { animation:none; position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .cardFlip .front { transform: rotateY(180deg); }
  .cardBack { background:
      repeating-linear-gradient(45deg, #7a1420 0 7px, #5e0e18 7px 14px);
    box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 0 0 3px #f3e3bb, inset 0 0 0 5px #7a1420; }
  .cardBack::after { content:"☾"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ffd968; font-size:30px; text-shadow:0 0 8px rgba(0,0,0,.6); }

  #banner { min-height:52px; display:flex; align-items:center; justify-content:center; text-align:center; margin:10px 0 2px; }
  #banner .inner { font-size:21px; font-weight:900; letter-spacing:.6px; padding:8px 18px; border-radius:14px; display:none; }

  #banner .push { background:linear-gradient(180deg,#5b4a12,#3d320c); border:2px solid #facc15; color:#fff3c4; }
  #banner .bj { background:linear-gradient(180deg,#a16207,#713f12); border:2px solid #ffd968; color:#fff8dc; box-shadow:0 0 28px rgba(255,217,104,.65); }

  .bankBox .val { font-size:19px; font-weight:900; color:#ffd968; }

  .chip:active { transform:scale(.92); }
  .chip:disabled { opacity:.32; cursor:default; }
  .chip.c10 { background:radial-gradient(circle at 35% 30%, #4f83e3, #1d4fa1); }
  .chip.c25 { background:radial-gradient(circle at 35% 30%, #3fbf72, #177245); }
  .chip.c50 { background:radial-gradient(circle at 35% 30%, #e3574f, #a11d1d); }
  .chip.c100 { background:radial-gradient(circle at 35% 30%, #555f73, #141a28); }
  .chip.cmax { background:radial-gradient(circle at 35% 30%, #e9b949, #8a6410); font-size:11px; }
  #betStack { display:flex; justify-content:center; align-items:flex-end; gap:3px; min-height:14px; margin-top:2px; }
  #betStack .stk { width:34px; height:8px; border-radius:4px; border:1px dashed rgba(255,255,255,.5); box-shadow:0 2px 3px rgba(0,0,0,.4); }

  /* Buttons */
  .btnRow { display:flex; gap:9px; margin-top:10px; }
  button.act { flex:1; font-size:17px; font-weight:900; letter-spacing:.5px; padding:15px 6px; border-radius:14px; border:none; cursor:pointer; color:#fff; box-shadow:0 5px 14px rgba(0,0,0,.45); transition:transform .07s, filter .15s; }

function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type, vol, slideTo){
  if (muted) return; const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, c.currentTime + t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || .12, c.currentTime + t0 + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
}

  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600;
  const g = c.createGain(); g.gain.value = .25; s.connect(f).connect(g).connect(c.destination); s.start(); }

}
newShoe();
function draw(){ if (shoe.length < 15) newShoe(); return shoe.pop(); }
function val(hand){
  let t = 0, aces = 0;
  for (const c of hand){ if (c.r === 'A'){ t += 11; aces++; } else if ('KQJ'.includes(c.r)) t += 10; else t += +c.r; }
  while (t > 21 && aces){ t -= 10; aces--; }
  return { total: t, soft: aces > 0 };
}
const isBJ = hand => hand.length === 2 && val(hand).total === 21;
const fmt = n => n.toLocaleString('en-US');

/* ============ Rendering ============ */
function cardEl(c, faceDown){
  if (faceDown){
    const w = document.createElement('div'); w.className = 'cardWrap';
    const f = document.createElement('div'); f.className = 'cardFlip'; f.id = 'holeFlip';
    const back = document.createElement('div'); back.className = 'card cardBack';
    const front = cardEl(c, false); front.classList.add('front'); front.style.animation = 'none';
    f.append(back, front); w.appendChild(f); return w;
  }
  const el = document.createElement('div');
  const red = (c.s === '♥' || c.s === '♦');
  const face = 'JQK'.includes(c.r);
  el.className = 'card ' + (red ? 'red' : 'black') + (face ? ' face' : '');
  el.innerHTML = '<div class="tl">' + c.r + '<small>' + c.s + '</small></div><div class="pip">' + (face ? c.r : c.s) + '</div>';
  return el;
}
function renderHands(){
  const ph = $('playerHand'), dh = $('dealerHand');
  ph.innerHTML = ''; dh.innerHTML = '';
  player.forEach(c => ph.appendChild(cardEl(c, false)));
  dealer.forEach((c, i) => dh.appendChild(cardEl(c, holeDown && i === 1)));
  $('playerTotal').textContent = player.length ? val(player).total : '–';
  $('dealerTotal').textContent = !dealer.length ? '–' : (holeDown ? val([dealer[0]]).total : val(dealer).total);
}
function renderBank(){
  $('balVal').textContent = fmt(store.bal);
  $('betVal').textContent = fmt(bet);
  const st = $('betStack'); st.innerHTML = '';
  const layers = Math.min(10, Math.ceil(bet / 25));
  const cols = ['#1d4fa1','#177245','#a11d1d','#141a28','#8a6410'];
  for (let i = 0; i < layers; i++){ const d = document.createElement('div'); d.className = 'stk'; d.style.background = cols[i % cols.length]; st.appendChild(d); }
  document.querySelectorAll('#betChips .chip').forEach(ch => {
    const v = ch.dataset.chip === 'max' ? store.bal : +ch.dataset.chip;
    ch.disabled = phase !== 'bet' || store.bal <= 0 || (ch.dataset.chip !== 'max' && v > store.bal) || (ch.dataset.chip === 'max' && store.bal <= 0);
  });
  $('dealBtn').disabled = phase !== 'bet' || bet <= 0 || busy;
  $('clearBtn').disabled = phase !== 'bet' || bet <= 0 || busy;
  $('refillBtn').classList.toggle('hidden', !(phase === 'bet' && store.bal < 10 && bet === 0));
}
function renderStats(){ $('stats').textContent = T('stats').replace('{h}', store.hands).replace('{w}', store.won).replace('{b}', store.bjs); }
function showBanner(txt, cls){
  const b = $('bannerInner');
  if (!txt){ b.className = 'inner'; b.textContent = ''; return; }
  b.className = 'inner show ' + cls; b.textContent = txt;
}
function setPhase(p){
  phase = p;
  $('betRow').classList.toggle('hidden', p !== 'bet');
  $('playRow').classList.toggle('hidden', p !== 'play');
  $('againRow').classList.toggle('hidden', p !== 'done');
  $('betChips').style.visibility = p === 'bet' ? 'visible' : 'hidden';
  if (p === 'play'){
    $('doubleBtn').disabled = !(player.length === 2 && store.bal >= bet);
  }
  renderBank();
}

/* ============ Flow ============ */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function dealCardTo(hand, el){
  hand.push(draw()); sndCard(); renderHands(); await wait(300);
}
async function startHand(){
  if (bet <= 0 || bet > store.bal || busy) return;
  busy = true; store.bal -= bet; save(); showBanner('', '');
  player = []; dealer = []; holeDown = true; renderHands(); renderBank();
  setPhase('play'); document.querySelectorAll('#playRow .act').forEach(b => b.disabled = true);
  await dealCardTo(player); await dealCardTo(dealer); await dealCardTo(player); await dealCardTo(dealer);
  renderHands();
  const pBJ = isBJ(player), dBJ = isBJ(dealer);
  if (pBJ || dBJ){
    holeDown = false; flipHole(); renderHands(); await wait(450);
    if (pBJ && dBJ) return settle('push');
    if (pBJ) return settle('blackjack');
    return settle('lose');
  }
  document.querySelectorAll('#playRow .act').forEach(b => b.disabled = false);
  $('doubleBtn').disabled = !(store.bal >= bet);
  busy = false;
}
function flipHole(){ const f = $('holeFlip'); if (f) f.classList.add('flipped'); }
async function dealerPlay(){
  holeDown = false; flipHole(); sndCard(); renderHands(); await wait(550);
  while (val(dealer).total < 17){ await dealCardTo(dealer); }
  renderHands();
}
function settle(kind, doubled){
  const amt = bet;
  store.hands++;
  let net = 0, txt = '', cls = '';
  if (kind === 'blackjack'){ net = Math.floor(amt * 1.5); store.bal += amt + net; store.won++; store.bjs++; txt = T('blackjack') + ' +' + fmt(net); cls = 'bj'; sndBigWin(); }
  else if (kind === 'win'){ net = amt; store.bal += amt * 2; store.won++; txt = T('win') + ' +' + fmt(net); cls = 'win'; sndWin(); }
  else if (kind === 'dealerBust'){ net = amt; store.bal += amt * 2; store.won++; txt = T('dealerBust') + ' · ' + T('win') + ' +' + fmt(net); cls = 'win'; sndWin(); }
  else if (kind === 'push'){ store.bal += amt; txt = T('push'); cls = 'push'; sndChip(); }
  else if (kind === 'bust'){ net = -amt; txt = T('bust') + ' · −' + fmt(amt); cls = 'lose'; sndLose(); }
  else { net = -amt; txt = T('lose') + ' · −' + fmt(amt); cls = 'lose'; sndLose(); }
  lastBet = amt; bet = 0; busy = false;
  save(); renderHands(); renderBank(); renderStats(); showBanner(txt, cls);
  $('rebetBtn').disabled = store.bal < lastBet;
  setPhase('done'); renderBank();
}
async function finishWithDealer(){
  document.querySelectorAll('#playRow .act').forEach(b => b.disabled = true);
  await dealerPlay();
  const pv = val(player).total, dv = val(dealer).total;
  if (dv > 21) settle('dealerBust');
  else if (pv > dv) settle('win');
  else if (pv < dv) settle('lose');
  else settle('push');
}

/* ============ Actions ============ */
document.querySelectorAll('#betChips .chip').forEach(ch => {
  ch.onclick = () => {
    if (phase !== 'bet') return;
    const add = ch.dataset.chip === 'max' ? store.bal - bet : +ch.dataset.chip;
    if (add <= 0 || bet + add > store.bal) return;
    bet += add; sndChip(); renderBank();
  };
});
$('clearBtn').onclick = () => { bet = 0; sndChip(); renderBank(); };
$('dealBtn').onclick = startHand;
$('refillBtn').onclick = () => { store.bal += 1000; save(); sndChip(); renderBank(); };
$('hitBtn').onclick = async () => {
  if (phase !== 'play' || busy) return; busy = true;
  $('doubleBtn').disabled = true;
  await dealCardTo(player); renderHands();
  if (val(player).total > 21){ busy = false; return settle('bust'); }
  if (val(player).total === 21){ busy = false; return finishWithDealer(); }
  busy = false;
};
$('standBtn').onclick = () => { if (phase === 'play' && !busy){ busy = true; finishWithDealer().then(() => busy = false); } };
$('doubleBtn').onclick = async () => {
  if (phase !== 'play' || busy || player.length !== 2 || store.bal < bet) return;
  busy = true; store.bal -= bet; bet *= 2; save(); sndChip(); renderBank();
  document.querySelectorAll('#playRow .act').forEach(b => b.disabled = true);
  await dealCardTo(player); renderHands();
  if (val(player).total > 21){ busy = false; return settle('bust'); }
  busy = false; finishWithDealer();
};
$('newBetBtn').onclick = () => { player = []; dealer = []; holeDown = true; renderHands(); showBanner('', ''); setPhase('bet'); };
$('rebetBtn').onclick = () => { if (store.bal >= lastBet){ bet = lastBet; player = []; dealer = []; renderHands(); showBanner('', ''); startHand(); } };

/* ============ Boot ============ */
applyLang(); renderHands(); renderStats(); setPhase('bet'); showBanner('', '');
window.BJ = { get shoe(){ return shoe; }, set shoe(v){ shoe = v; }, get state(){ return { phase, bal: store.bal, bet, player: player.slice(), dealer: dealer.slice(), holeDown }; } };
</script>
</body>
