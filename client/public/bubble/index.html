  <div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>

<button id="swapBtn" class="hidden"><span id="swapLab">⇄ SWAP</span></button>

<div id="loading">

  <div class="ls">LUNC DEV STUDIO · LUNA CLASSIC</div>
</div>

<!-- MENU -->
<div id="menu" class="screen hidden">
  <svg class="cresLogo" viewBox="0 0 100 100" aria-hidden="true"><path d="M62 8a40 40 0 1 0 30 58A44 44 0 0 1 62 8z" fill="#ffcf3d"/></svg>
  <div class="logo">LUNA<br><span class="bub">BUBBLE</span></div>
  <div class="studio">LUNC DEV STUDIO · LUNA CLASSIC</div>
  <div id="menuTag"></div>
  <button class="bigbtn" id="playBtn"></button>
  <div class="rowbtns">
    <button class="smallbtn" id="howBtn"></button>
    <button class="smallbtn" id="boardBtn"></button>
  </div>
  <select id="langSel" aria-label="Language"></select>
  <div id="secStrip"></div>
</div>

<!-- HOW TO -->
<div id="howPanel" class="screen hidden">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="body" id="howBody"></div>
    <div class="center"><button class="smallbtn" id="howClose"></button></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="boardPanel" class="screen hidden">
  <div class="panel">
    <h2 id="boardTitle"></h2>
    <div class="tabs">
      <button class="tab on" id="tabAll"></button>
      <button class="tab" id="tabWeek"></button>
    </div>
    <div id="boardBody"></div>
    <div class="center"><button class="smallbtn" id="boardClose"></button></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pausePanel" class="screen hidden">
  <div class="panel" style="text-align:center">
    <h2 id="pauseTitle"></h2>
    <div class="center">
      <button class="bigbtn" id="resumeBtn"></button><br>
      <button class="smallbtn" id="howBtn2"></button>
      <button class="smallbtn" id="quitBtn"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="overPanel" class="screen hidden">
  <div id="overTitle"></div>
  <div id="finalScoreLine"></div>
  <div id="finalDetail"></div>
  <div id="saveRow">
    <input id="nameInput" maxlength="16" autocomplete="off">
    <button class="bigbtn" id="submitBtn" style="font-size:17px;padding:10px 26px"></button>
  </div>
  <div id="savedLine"></div>
  <div class="rowbtns">
    <button class="bigbtn" id="againBtn"></button>
    <button class="smallbtn" id="overBoardBtn"></button>
    <button class="smallbtn" id="menuBtn"></button>
  </div>
</div>

<div id="qaState"></div>

R", "allTime": "Histórico", "week": "Esta semana", "loading": "Cargando…", "noScores": "Sin puntuaciones aún: ¡sé el primero!", "score": "PUNTOS", "wave": "OLEADA", "next": "SIGUIENTE", "over": "¡EL CIELO SE VINO ABAJO!", "finalScore": "Puntuación final", "submit": "GUARDAR", "saved": "¡Guardado!", "rank": "¡Eres el n.º {n} histórico!", "namePh": "Tu nombre", "again": "JUGAR OTRA VEZ", "menu": "MENÚ", "paused": "PAUSA", "resume": "SEGUIR", "quit": "SALIR AL MENÚ", "waveClear": "¡OLEADA {n} SUPERADA!", "dropped": "¡{n} CAYERON!", "best": "RÉCORD", "shoot": "LANZADOR", "swap": "CAMBIAR", "popped": "reventadas", "shotsLine": "{w} oleadas · {p} reventadas · {d} caídas · {s} disparos · {t}s", "howBody": "<b>Arrastra en cualquier parte</b> para apuntar el lanzador lunar: la línea de neón punteada muestra tu tiro, incluido el rebote en las paredes. <b>Suelta para disparar.</b><br>Junta <b>3 o más</b> burbujas de un color para reventarlas en un destello de luz. Las burbujas que quedan colgando sin nada encima <b>caen y dan puntos extra</b>.<br>Toca la <b>burbuja siguiente</b> (o pulsa S) para intercambiar la burbuja cargada con la siguiente.<br>La <b>burbuja de la media luna dorada</b> combina con CUALQUIER color. La <b>burbuja de la estrella azul</b> revienta todas las burbujas del color que toca. Ambas son raras: ¡úsalas bien!<br>Limpia todo el cielo para terminar la oleada… pero el <b>techo sigue bajando</b>. ¡No dejes que las burbujas crucen la <b>línea de peligro</b>!"}, "pt": {"tag": "Arraste para mirar, solte para atirar! Combine 3 ou mais bolhas de neon para estourá-las em flashes de luz. Vença cada onda antes que o teto descendente empurre as bolhas além da linha de perigo!", "play": "▶ JOGAR", "how": "COMO JOGAR", "board": "🏆 PLACAR", "howTitle": "Como jogar", "close": "FECHAR", "allTime": "Geral", "week": "Esta semana", "loading": "Carregando…", "noScores": "Sem pontuações ainda — seja o primeiro!", "score": "PONTOS", "wave": "ONDA", "next": "PRÓXIMA", "over": "O CÉU DESABOU!", "finalScore": "Pontuação final", "submit": "SALVAR", "saved": "Salvo!", "rank": "Você é o nº {n} de todos os tempos!", "namePh": "Seu nome", "again": "JOGAR DE NOVO", "menu": "MENU", "paused": "PAUSADO", "resume": "CONTINUAR", "quit": "SAIR AO MENU", "waveClear": "ONDA {n} VENCIDA!", "dropped": "{n} CAÍRAM!", "best": "RECORDE", "shoot": "ATIRADOR", "swap": "TROCAR", "popped": "estouradas", "shotsLine": "{w} ondas · {p} estouradas · {d} caídas · {s} tiros · {t}s", "howBody": "<b>Arraste em qualquer lugar</b> para mirar o lançador lunar — a linha de neon pontilhada mostra seu tiro, incluindo o ricochete nas paredes. <b>Solte para atirar.</b><br>Combine <b>3 ou mais</b> bolhas de uma cor para estourá-las num flash de luz. Bolhas penduradas sem nada acima <b>caem e dão pontos bônus</b>.<br>Toque na <b>próxima bolha</b> (ou pressione S) para trocar a bolha carregada pela seguinte.<br>A <b>bolha da lua crescente dourada</b> combina com QUALQUER cor. A <b>bolha da estrela azul</b> estoura todas as bolhas da cor que tocar. As duas são raras — use bem!<br>Limpe todo o céu para terminar a onda… mas o <b>teto continua descendo</b>. Não deixe as bolhas cruzarem a <b>linha de perigo</b>!"}, "fr": {"tag": "Glissez pour viser, relâchez pour tirer ! Assemblez 3 bulles néon ou plus pour les éclater dans des éclairs de lumière. Terminez chaque vague avant que le plafond descendant ne pousse les bulles au-delà de la ligne de danger !", "play": "▶ JOUER", "how": "COMMENT JOUER", "board": "🏆 CLASSEMENT", "howTitle": "Comment jouer", "close": "FERMER", "allTime": "Tout temps", "week": "Cette semaine", "loading": "Chargement…", "noScores": "Aucun score — soyez le premier !", "score": "SCORE", "wave": "VAGUE", "next": "SUIVANTE", "over": "LE CIEL EST TOMBÉ !", "finalScore": "Score final", "submit": "ENREGISTRER", "saved": "Enregistré !", "rank": "Vous êtes n°{n} de tous les temps !", "namePh": "Votre nom", "again": "REJOUER", "menu": "MENU", "paused": "PAUSE", "resume": "REPRENDRE", "quit": "QUITTER AU MENU", "waveClear": "VAGUE {n} TERMINÉE !", "dropped": "{n} TOMBÉES !", "best": "RECORD", "shoot": "LANCEUR", "swap": "ÉCHANGER", "popped": "éclatées", "shotsLine": "{w} vagues · {p} éclatées · {d} tombées · {s} tirs · {t}s", "howBody": "<b>Glissez n'importe où</b> pour viser le lanceur lunaire — la ligne néon en pointillés montre votre tir, y compris le rebond sur les murs. <b>Relâchez pour tirer.</b><br>Assemblez <b>3 bulles ou plus</b> d'une couleur pour les éclater dans un éclair de lumière. Les bulles suspendues sans rien au-dessus <b>tombent pour des points bonus</b>.<br>Touchez l'<b>orbe bulle suivante</b> (ou touche S) pour échanger la bulle chargée avec la suivante.<br>La <b>bulle croissant dorée</b> correspond à TOUTES les couleurs. La <b>bulle étoile bleue</b> éclate toutes les bulles de la couleur qu'elle touche. Toutes deux sont rares — utilisez-les bien !<br>Dégagez tout le ciel pour finir la vague… mais le <b>plafond continue de descendre</b>. Ne laissez pas les bulles franchir la <b>ligne de danger</b> !"}, "de": {"tag": "Ziehen zum Zielen, loslassen zum Schießen! Kombiniere 3 oder mehr Neon-Blasen, um sie in Lichtblitzen platzen zu lassen. Schaffe jede Welle, bevor die sinkende Decke die Blasen über die Gefahrenlinie drückt!", "play": "▶ SPIELEN", "how": "SO GEHT'S", "board": "🏆 BESTLEISTUNG", "howTitle": "So geht's", "close": "SCHLIESSEN", "allTime": "Gesamt", "week": "Diese Woche", "loading": "Lädt…", "noScores": "Noch keine Punkte — sei der Erste!", "score": "PUNKTE", "wave": "WELLE", "next": "NÄCHSTE", "over": "DER HIMMEL STÜRZTE EIN!", "finalScore": "Endpunktzahl", "submit": "SPEICHERN", "saved": "Gespeichert!", "rank": "Du bist Nr. {n} aller Zeiten!", "namePh": "Dein Name", "again": "NOCHMAL", "menu": "MENÜ", "paused": "PAUSE", "resume": "WEITER", "quit": "ZUM MENÜ", "waveClear": "WELLE {n} GESCHAFFT!", "dropped": "{n} GEFALLEN!", "best": "REKORD", "shoot": "WERFER", "swap": "TAUSCHEN", "popped": "geplatzt", "shotsLine": "{w} Wellen · {p} geplatzt · {d} gefallen · {s} Schüsse · {t}s", "howBody": "<b>Ziehe irgendwohin</b>, um den Mondwerfer zu zielen — die gepunktete Neonlinie zeigt deinen Schuss, inklusive Abpraller an den Wänden. <b>Loslassen zum Schießen.</b><br>Kombiniere <b>3 oder mehr</b> Blasen einer Farbe, um sie in einem Lichtblitz platzen zu lassen. Blasen, die ohne Halt oben hängen, <b>fallen für Bonuspunkte</b>.<br>Tippe auf die <b>Nächste-Blase-Kugel</b> (oder drücke S), um die geladene Blase mit der nächsten zu tauschen.<br>Die <b>goldene Sichel-Blase</b> passt zu JEDER Farbe. Die <b>blaue Stern-Blase</b> lässt alle Blasen der Farbe platzen, die sie berührt. Beide sind selten — setze sie gut ein!<br>Leere den ganzen Himmel, um die Welle zu beenden… aber die <b>Decke sinkt weiter</b>. Lass die Blasen nicht über die <b>Gefahrenlinie</b>!"}, "it": {"tag": "Trascina per mirare, rilascia per sparare! Abbina 3 o più bolle al neon per farle scoppiare in lampi di luce. Completa ogni ondata prima che il soffitto che scende spinga le bolle oltre la linea di pericolo!", "play": "▶ GIOCA", "how": "COME SI GIOCA", "board": "🏆 CLASSIFICA", "howTitle": "Come si gioca", "close": "CHIUDI", "allTime": "Sempre", "week": "Questa settimana", "loading": "Caricamento…", "noScores": "Nessun punteggio — sii il primo!", "score": "PUNTI", "wave": "ONDATA", "next": "PROSSIMA", "over": "IL CIELO È CADUTO!", "finalScore": "Punteggio finale", "submit": "SALVA", "saved": "Salvato!", "rank": "Sei il n. {n} di sempre!", "namePh": "Il tuo nome", "again": "GIOCA ANCORA", "menu": "MENU", "paused": "PAUSA", "resume": "RIPRENDI", "quit": "ESCI AL MENU", "waveClear": "ONDATA {n} COMPLETATA!", "dropped": "{n} CADUTE!", "best": "RECORD", "shoot": "LANCIATORE", "swap": "CAMBIA", "popped": "scoppiate", "shotsLine": "{w} ondate · {p} scoppiate · {d} cadute · {s} tiri · {t}s", "howBody": "<b>Trascina ovunque</b> per mirare il lanciatore lunare — la linea al neon punteggiata mostra il tiro, compreso il rimbalzo sulle pareti. <b>Rilascia per sparare.</b><br>Abbina <b>3 o più</b> bolle di un colore per farle scoppiare in un lampo di luce. Le bolle rimaste appese senza nulla sopra <b>cadono per punti bonus</b>.<br>Tocca la <b>sfera bolla successiva</b> (o premi S) per scambiare la bolla caricata con la prossima.<br>La <b>bolla mezzaluna dorata</b> combina con QUALSIASI colore. La <b>bolla stella blu</b> fa scoppiare tutte le bolle del colore che tocca. Entrambe rare — usale bene!<br>Pulisci tutto il cielo per finire l'ondata… ma il <b>soffitto continua a scendere</b>. Non lasciare che le bolle superino la <b>linea di pericolo</b>!"}, "nl": {"tag": "Sleep om te richten, laat los om te schieten! Combineer 3 of meer neonbellen om ze in lichtflitsen te laten knappen. Voltooi elke golf voordat het dalende plafond de bellen over de gevarenlijn duwt!", "play": "▶ SPELEN", "how": "HOE TE SPELEN", "board": "🏆 RANGLIJST", "howTitle": "Hoe te spelen", "close": "SLUITEN", "allTime": "Altijd", "week": "Deze week", "loading": "Laden…", "noScores": "Nog geen scores — wees de eerste!", "score": "SCORE", "wave": "GOLF", "next": "VOLGENDE", "over": "DE HEMEL VIEL NEER!", "finalScore": "Eindscore", "submit": "OPSLAAN", "saved": "Opgeslagen!", "rank": "Je bent nr. {n} aller tijden!", "namePh": "Je naam", "again": "OPNIEUW", "menu": "MENU", "paused": "PAUZE", "resume": "VERDER", "quit": "NAAR MENU", "waveClear": "GOLF {n} GEHAALD!", "dropped": "{n} GEVALLEN!", "best": "RECORD", "shoot": "SCHIETER", "swap": "WISSELEN", "popped": "geknald", "shotsLine": "{w} golven · {p} geknald · {d} gevallen · {s} schoten · {t}s", "howBody": "<b>Sleep overal</b> om de maanwerper te richten — de gestippelde neonline toont je schot, inclusief de stuiter tegen de muren. <b>Laat los om te schieten.</b><br>Combineer <b>3 of meer</b> bellen van één kleur om ze in een lichtflits te laten knappen. Bellen die loshangen zonder iets erboven <b>vallen voor bonuspunten</b>.<br>Tik op de <b>volgende-bel bol</b> (of druk op S) om de geladen bel met de volgende te wisselen.<br>De <b>gouden sikkelbel</b> past bij ELKE kleur. De <b>blauwe sterbel</b> laat alle bellen van de kleur die hij raakt knappen. Beide zijn zeldzaam — gebruik ze goed!<br>Maak de hele hemel leeg om de golf af te ronden… maar het <b>plafond blijft dalen</b>. Laat de bellen niet over de <b>gevarenlijn</b> gaan!"}, "ru": {"tag": "Веди, чтобы прицелиться, отпусти, чтобы выстрелить! Собирай 3 и более неоновых пузыря, чтобы лопать их вспышками света. Проходи каждую волну, пока опускающийся потолок не вытолкнул пузыри за линию опасности!", "play": "▶ ИГРАТЬ", "how": "КАК ИГРАТЬ", "board": "🏆 РЕЙТИНГ", "howTitle": "Как играть", "close": "ЗАКРЫТЬ", "allTime": "За всё время", "week": "Эта неделя", "loading": "Загрузка…", "noScores": "Пока нет результатов — стань первым!", "score": "ОЧКИ", "wave": "ВОЛНА", "next": "СЛЕД.", "over": "НЕБО РУХНУЛО!", "finalScore": "Итоговые очки", "submit": "СОХРАНИТЬ", "saved": "Сохранено!", "rank": "Ты №{n} за всё время!", "namePh": "Твоё имя", "again": "ЕЩЁ РАЗ", "menu": "МЕНЮ", "paused": "ПАУЗА", "resume": "ДАЛЬШЕ", "quit": "В МЕНЮ", "waveClear": "ВОЛНА {n} ПРОЙДЕНА!", "dropped": "УПАЛО: {n}!", "best": "РЕКОРД", "shoot": "ПУШКА", "swap": "СМЕНА", "popped": "лопнуло", "shotsLine": "{w} волн · {p} лопнуло · {d} упало · {s} выстрелов · {t}с", "howBody": "<b>Веди в любом месте</b>, чтобы прицелить лунную пушку — пунктирная неоновая линия показывает выстрел, включая рикошет от стен. <b>Отпусти, чтобы выстрелить.</b><br>Собирай <b>3 и более</b> пузыря одного цвета, чтобы лопнуть их вспышкой света. Пузыри, повисшие без опоры сверху, <b>падают за бонусные очки</b>.<br>Коснись <b>шара следующего пузыря</b> (или нажми S), чтобы поменять заряженный пузырь на следующий.<br><b>Золотой пузырь-полумесяц</b> подходит к ЛЮБОМУ цвету. <b>Синий пузырь-звезда</b> лопает все пузыри цвета, которого коснётся. Оба редкие — используй с умом!<br>Очисти всё небо, чтобы завершить волну… но <b>потолок продолжает опускаться</b>. Не дай пузырям пересечь <b>линию опасности</b>!"}, "uk": {"tag": "Веди, щоб прицілитися, відпусти, щоб вистрілити! Збирай 3 і більше неонових бульбашок, щоб лопати їх спалахами світла. Проходь кожну хвилю, доки стеля, що опускається, не виштовхнула бульбашки за лінію небезпеки!", "play": "▶ ГРАТИ", "how": "ЯК ГРАТИ", "board": "🏆 РЕЙТИНГ", "howTitle": "Як грати", "close": "ЗАКРИТИ", "allTime": "За весь час", "week": "Цей тиждень", "loading": "Завантаження…", "noScores": "Поки немає результатів — стань першим!", "score": "ОЧКИ", "wave": "ХВИЛЯ", "next": "НАСТ.", "over": "НЕБО ВПАЛО!", "finalScore": "Підсумкові очки", "submit": "ЗБЕРЕГТИ", "saved": "Збережено!", "rank": "Ти №{n} за весь час!", "namePh": "Твоє ім'я", "again": "ЩЕ РАЗ", "menu": "МЕНЮ", "paused": "ПАУЗА", "resume": "ДАЛІ", "quit": "ДО МЕНЮ", "waveClear": "ХВИЛЮ {n} ПРОЙДЕНО!", "dropped": "ВПАЛО: {n}!", "best": "РЕКОРД", "shoot": "ГАРМАТА", "swap": "ЗМІНА", "popped": "лопнуло", "shotsLine": "{w} хвиль · {p} лопнуло · {d} впало · {s} пострілів · {t}с", "howBody": "<b>Веди будь-де</b>, щоб прицілити місячну гармату — пунктирна неонова лінія показує постріл, включно з рикошетом від стін. <b>Відпусти, щоб вистрілити.</b><br>Збирай <b>3 і більше</b> бульбашки одного кольору, щоб лопнути їх спалахом світла. Бульбашки, що зависли без опори зверху, <b>падають за бонусні очки</b>.<br>Торкнись <b>кулі наступної бульбашки</b> (або натисни S), щоб поміняти заряджену бульбашку на наступну.<br><b>Золота бульбашка-півмісяць</b> підходить до БУДЬ-ЯКОГО кольору. <b>Синя бульбашка-зірка</b> лопає всі бульбашки кольору, якого торкнеться. Обидві рідкісні — використовуй розумно!<br>Очисти все небо, щоб завершити хвилю… але <b>стеля продовжує опускатися</b>. Не дай бульбашкам перетнути <b>лінію небезпеки</b>!"}, "tr": {"tag": "Nişan almak için sürükle, ateş etmek için bırak! 3 veya daha fazla neon baloncuğu eşleştirip ışık patlamalarıyla yok et. Alçalan tavan baloncukları tehlike çizgisinin ötesine itmeden her dalgayı temizle!", "play": "▶ OYNA", "how": "NASIL OYNANIR", "board": "🏆 SIRALAMA", "howTitle": "Nasıl oynanır", "close": "KAPAT", "allTime": "Tüm zamanlar", "week": "Bu hafta", "loading": "Yükleniyor…", "noScores": "Henüz skor yok — ilk sen ol!", "score": "SKOR", "wave": "DALGA", "next": "SONRAKİ", "over": "GÖKYÜZÜ ÇÖKTÜ!", "finalScore": "Final skoru", "submit": "KAYDET", "saved": "Kaydedildi!", "rank": "Tüm zamanlarda {n}. sıradasın!", "namePh": "Adın", "again": "TEKRAR OYNA", "menu": "MENÜ", "paused": "DURAKLATILDI", "resume": "DEVAM", "quit": "MENÜYE ÇIK", "waveClear": "DALGA {n} TEMİZ!", "dropped": "{n} DÜŞTÜ!", "best": "REKOR", "shoot": "ATICI", "swap": "DEĞİŞTİR", "popped": "patlatıldı", "shotsLine": "{w} dalga · {p} patlatıldı · {d} düştü · {s} atış · {t}sn", "howBody": "Ay atıcısını nişanlamak için <b>herhangi bir yere sürükle</b> — noktalı neon çizgi, duvarlardan sekme dahil atışını gösterir. <b>Ateş etmek için bırak.</b><br>Bir renkten <b>3 veya daha fazla</b> baloncuğu eşleştirip ışık parlamasıyla patlat. Üstünde hiçbir şey olmadan asılı kalan baloncuklar <b>bonus puan için düşer</b>.<br>Yüklü baloncuğu sonrasıyla değiştirmek için <b>sonraki-balon küresine</b> dokun (veya S'ye bas).<br><b>Altın hilal baloncuğu</b> HER renkle eşleşir. <b>Mavi yıldız baloncuğu</b> dokunduğu rengin tüm baloncuklarını patlatır. İkisi de nadirdir — iyi kullan!<br>Dalgayı bitirmek için tüm gökyüzünü temizle… ama <b>tavan alçalmaya devam ediyor</b>. Baloncukların <b>tehlike çizgisini</b> geçmesine izin verme!"}, "ar": {"tag": "اسحب للتصويب وأفلت للإطلاق! طابِق 3 فقاعات نيون أو أكثر لتفجيرها في ومضات من الضوء. أنهِ كل موجة قبل أن يدفع السقف الهابط الفقاعات إلى ما بعد خط الخطر!", "play": "▶ العب", "how": "طريقة اللعب", "board": "🏆 الترتيب", "howTitle": "طريقة اللعب", "close": "إغلاق", "allTime": "كل الأوقات", "week": "هذا الأسبوع", "loading": "جارٍ التحميل…", "noScores": "لا نتائج بعد — كن الأول!", "score": "النقاط", "wave": "الموجة", "next": "التالية", "over": "سقطت السماء!", "finalScore": "النتيجة النهائية", "submit": "حفظ", "saved": "تم الحفظ!", "rank": "أنت رقم {n} على الإطلاق!", "namePh": "اسمك", "again": "العب مجددًا", "menu": "القائمة", "paused": "إيقاف مؤقت", "resume": "استئناف", "quit": "خروج إلى القائمة", "waveClear": "أكملت الموجة {n}!", "dropped": "سقطت {n}!", "best": "الأفضل", "shoot": "القاذف", "swap": "تبديل", "popped": "انفجرت", "shotsLine": "{w} موجات · {p} انفجرت · {d} سقطت · {s} طلقات · {t}ث", "howBody": "<b>اسحب في أي مكان</b> لتصويب قاذف القمر — يُظهر خط النيون المنقط طلقتك، بما في ذلك الارتداد عن الجدران. <b>أفلت للإطلاق.</b><br>طابِق <b>3 فقاعات أو أكثر</b> من لون واحد لتفجيرها في وميض من الضوء. الفقاعات المعلقة دون شيء فوقها <b>تسقط مقابل نقاط إضافية</b>.<br>المس <b>كرة الفقاعة التالية</b> (أو اضغط S) لتبديل الفقاعة المحملة بالتالية.<br><b>فقاعة الهلال الذهبية</b> تطابق أي لون. <b>فقاعة النجمة الزرقاء</b> تفجر كل فقاعات اللون الذي تلمسه. كلتاهما نادرة — فاستخدمهما بحكمة!<br>نظّف السماء كلها لإنهاء الموجة… لكن <b>السقف يستمر في النزول</b>. لا تدع الفقاعات تعبر <b>خط الخطر</b>!"}, "hi": {"tag": "निशाना लगाने के लिए खींचो, फायर करने के लिए छोड़ो! 3 या अधिक नियॉन बुलबुलों को मिलाकर उन्हें रोशनी की चमक में फोड़ो। डूबती छत बुलबुलों को ख़तरे की रेखा के पार धकेले, उससे पहले हर लहर साफ़ करो!", "play": "▶ खेलो", "how": "कैसे खेलें", "board": "🏆 लीडरबोर्ड", "howTitle": "कैसे खेलें", "close": "बंद करो", "allTime": "सर्वकालिक", "week": "इस सप्ताह", "loading": "लोड हो रहा है…", "noScores": "अभी कोई स्कोर नहीं — पहले बनो!", "score": "स्कोर", "wave": "लहर", "next": "अगला", "over": "आसमान गिर गया!", "finalScore": "अंतिम स्कोर", "submit": "सेव करो", "saved": "सेव हो गया!", "rank": "तुम सर्वकालिक #{n} हो!", "namePh": "तुम्हारा नाम", "again": "फिर खेलो", "menu": "मेनू", "paused": "रुका हुआ", "resume": "जारी रखो", "quit": "मेनू पर जाएँ", "waveClear": "लहर {n} साफ़!", "dropped": "{n} गिरे!", "best": "सर्वश्रेष्ठ", "shoot": "शूटर", "swap": "बदलो", "popped": "फूटे", "shotsLine": "{w} लहरें · {p} फूटे · {d} गिरे · {s} शॉट · {t}से", "howBody": "चाँद शूटर से निशाना लगाने के लिए <b>कहीं भी खींचो</b> — बिंदीदार नियॉन रेखा तुम्हारा शॉट दिखाती है, दीवारों से टकराकर लौटना भी। <b>फायर करने के लिए छोड़ो।</b><br>एक रंग के <b>3 या अधिक</b> बुलबुले मिलाओ और उन्हें रोशनी की चमक में फोड़ो। जिन बुलबुलों के ऊपर कुछ नहीं बचा, वे <b>बोनस अंकों के लिए गिरते हैं</b>।<br>लोड किया बुलबुला अगले से बदलने के लिए <b>अगले-बुलबुले गोले</b> को छुओ (या S दबाओ)।<br><b>सुनहरा अर्धचंद्र बुलबुला</b> किसी भी रंग से मिलता है। <b>नीला तारा बुलबुला</b> जिस रंग को छूता है, उसके सारे बुलबुले फोड़ देता है। दोनों दुर्लभ हैं — समझदारी से इस्तेमाल करो!<br>लहर खत्म करने के लिए पूरा आसमान साफ़ करो… लेकिन <b>छत डूबती रहती है</b>। बुलबुलों को <b>ख़तरे की रेखा</b> पार न करने दो!"}, "id": {"tag": "Seret untuk membidik, lepas untuk menembak! Cocokkan 3 gelembung neon atau lebih untuk meletuskannya dalam kilatan cahaya. Selesaikan setiap gelombang sebelum langit-langit yang turun mendorong gelembung melewati garis bahaya!", "play": "▶ MAINKAN", "how": "CARA BERMAIN", "board": "🏆 PAPAN SKOR", "howTitle": "Cara bermain", "close": "TUTUP", "allTime": "Sepanjang masa", "week": "Minggu ini", "loading": "Memuat…", "noScores": "Belum ada skor — jadilah yang pertama!", "score": "SKOR", "wave": "GELOMBANG", "next": "BERIKUTNYA", "over": "LANGIT RUNTUH!", "finalScore": "Skor akhir", "submit": "SIMPAN", "saved": "Tersimpan!", "rank": "Kamu peringkat #{n} sepanjang masa!", "namePh": "Namamu", "again": "MAIN LAGI", "menu": "MENU", "paused": "JEDA", "resume": "LANJUT", "quit": "KELUAR KE MENU", "waveClear": "GELOMBANG {n} SELESAI!", "dropped": "{n} JATUH!", "best": "TERBAIK", "shoot": "PENEMBAK", "swap": "TUKAR", "popped": "meletus", "shotsLine": "{w} gelombang · {p} meletus · {d} jatuh · {s} tembakan · {t}dtk", "howBody": "<b>Seret di mana saja</b> untuk membidik penembak bulan — garis neon putus-putus menunjukkan tembakanmu, termasuk pantulan dari dinding. <b>Lepas untuk menembak.</b><br>Cocokkan <b>3 atau lebih</b> gelembung satu warna untuk meletuskannya dalam kilatan cahaya. Gelembung yang menggantung tanpa apa pun di atasnya <b>jatuh untuk poin bonus</b>.<br>Ketuk <b>bola gelembung berikutnya</b> (atau tekan S) untuk menukar gelembung yang dimuat dengan yang berikutnya.<br><b>Gelembung sabit emas</b> cocok dengan warna APA PUN. <b>Gelembung bintang biru</b> meletuskan semua gelembung warna yang disentuhnya. Keduanya langka — gunakan dengan bijak!<br>Bersihkan seluruh langit untuk menyelesaikan gelombang… tapi <b>langit-langit terus turun</b>. Jangan biarkan gelembung melewati <b>garis bahaya</b>!"}, "vi": {"tag": "Kéo để ngắm, thả để bắn! Ghép 3 bong bóng neon trở lên để làm nổ chúng trong những tia sáng. Dọn sạch mỗi đợt trước khi trần nhà đang hạ đẩy bong bóng qua vạch nguy hiểm!", "play": "▶ CHƠI", "how": "CÁCH CHƠI", "board": "🏆 BẢNG XẾP HẠNG", "howTitle": "Cách chơi", "close": "ĐÓNG", "allTime": "Mọi thời đại", "week": "Tuần này", "loading": "Đang tải…", "noScores": "Chưa có điểm — hãy là người đầu tiên!", "score": "ĐIỂM", "wave": "ĐỢT", "next": "TIẾP THEO", "over": "BẦU TRỜI SỤP ĐỔ!", "finalScore": "Điểm cuối", "submit": "LƯU ĐIỂM", "saved": "Đã lưu!", "rank": "Bạn hạng #{n} mọi thời đại!", "namePh": "Tên của bạn", "again": "CHƠI LẠI", "menu": "MENU", "paused": "TẠM DỪNG", "resume": "TIẾP TỤC", "quit": "VỀ MENU", "waveClear": "QUA ĐỢT {n}!", "dropped": "{n} ĐÃ RƠI!", "best": "CAO NHẤT", "shoot": "SÚNG BẮN", "swap": "ĐỔI", "popped": "đã nổ", "shotsLine": "{w} đợt · {p} đã nổ · {d} đã rơi · {s} phát bắn · {t}s", "howBody": "<b>Kéo ở bất cứ đâu</b> để ngắm súng bắn mặt trăng — đường neon chấm chấm cho thấy phát bắn của bạn, kể cả cú nảy vào tường. <b>Thả ra để bắn.</b><br>Ghép <b>3 bong bóng trở lên</b> cùng màu để làm nổ chúng trong một tia sáng. Bong bóng treo lơ lửng không còn gì phía trên sẽ <b>rơi xuống lấy điểm thưởng</b>.<br>Chạm vào <b>quả cầu bong bóng tiếp theo</b> (hoặc nhấn S) để đổi bong bóng đã nạp với bong bóng tiếp theo.<br><b>Bong bóng lưỡi liềm vàng</b> khớp với MỌI màu. <b>Bong bóng ngôi sao xanh</b> làm nổ m
