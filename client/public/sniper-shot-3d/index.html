<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNIPER SHOT 3D — LUNC Dev Studio</title>
<style>
  :root{
    --gold:#ffb340; --ink:#eaf2ff; --red:#ff4d5e; --cyan:#35c4ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#79a6d8;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;color:var(--ink)}
  #game{position:fixed;inset:0}
  canvas{display:block}
  /* ---------- loading ---------- */
  #loading{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#274b73,#0e1c30);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  #loading .lt{font-size:clamp(26px,7vw,44px);font-weight:900;font-style:italic;letter-spacing:.06em}
  #loading .lt span{color:var(--gold)}
  #loadBar{width:min(70vw,340px);height:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
  #loadFill{height:100%;width:0%;background:linear-gradient(90deg,#ffcf5e,#ff8b3d)}
  #loadPct{font-size:12px;letter-spacing:.25em;opacity:.8}
  /* ---------- language ---------- */
  #langSel{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:26;background:rgba(6,12,26,.82);color:#ffe9b0;border:1px solid rgba(255,190,80,.6);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;max-width:46vw}
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  #topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
  .stat .lab{font-size:9px;letter-spacing:.32em;font-weight:700;opacity:.85;text-shadow:0 1px 4px #000}
  .stat .val{font-size:clamp(20px,5.4vw,30px);font-weight:900;font-style:italic;line-height:1;text-shadow:0 2px 10px #000}
  .stat.mid{text-align:center}
  .stat.right{text-align:right;margin-right:min(40vw,196px)}
  #waveTimer{color:var(--gold)}
  #waveTimer.hurry{color:var(--red);animation:tpulse .5s infinite alternate}
  @keyframes tpulse{from{transform:scale(1)}to{transform:scale(1.1)}}
  #muteBtn{pointer-events:auto;cursor:pointer;position:absolute;top:60px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(5,8,16,.6);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
  /* fouls */
  #fouls{position:absolute;top:66px;left:12px;display:flex;gap:7px;align-items:center}
  #fouls .flab{font-size:9px;letter-spacing:.28em;font-weight:700;opacity:.85;margin-right:2px;text-shadow:0 1px 4px #000}
  .fpip{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;background:rgba(5,8,16,.35)}
  .fpip.hit{border-color:var(--red);background:rgba(255,40,60,.8);color:#fff;box-shadow:0 0 12px rgba(255,40,60,.8)}
  /* combo toast */
  #combo{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-size:clamp(17px,4.6vw,26px);font-weight:900;font-style:italic;color:var(--gold);text-shadow:0 0 18px rgba(255,160,40,.8),0 2px 8px #000;opacity:0;transition:opacity .25s;letter-spacing:.06em;white-space:nowrap}
  /* score popups */
  #pops{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .pop{position:absolute;font-weight:900;font-style:italic;transform:translate(-50%,-50%);text-shadow:0 2px 8px #000,0 0 14px rgba(0,0,0,.35);white-space:nowrap;opacity:0}
  .pop.good{color:#ffd76a}
  .pop.foul{color:#ff5d6e}
  /* bottom-left: ammo + breath */
  #lowleft{position:absolute;left:14px;bottom:18px}
  #ammoLab{font-size:9px;letter-spacing:.32em;font-weight:700;opacity:.85;margin-bottom:5px;text-shadow:0 1px 4px #000}
  #ammo{display:flex;gap:5px}
  .round{width:10px;height:26px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#ffe9b0,#d99a26);box-shadow:0 0 8px rgba(255,180,60,.45)}
  .round.spent{background:rgba(255,255,255,.16);box-shadow:none}
  #breathWrap{margin-top:12px;width:118px;display:none}
  #breathWrap .blab2{font-size:9px;letter-spacing:.28em;font-weight:700;opacity:.85;margin-bottom:4px;text-shadow:0 1px 4px #000}
  #breathShell{height:8px;background:rgba(5,8,16,.7);border:1px solid rgba(255,255,255,.3)}
  #breathFill{height:100%;width:100%;background:linear-gradient(90deg,#7fd8ff,#35c4ff)}
  /* buttons */
  #btns{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .gbtn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.45);color:#fff;font-family:inherit;font-weight:900;font-style:italic;letter-spacing:.08em;background:rgba(5,8,16,.62);display:flex;align-items:center;justify-content:center;border-radius:50%;user-select:none;-webkit-user-select:none;touch-action:none}
  .gbtn:active{filter:brightness(1.5)}
  .gbtn:disabled{filter:grayscale(.8) brightness(.55)}
  #fireBtn{width:96px;height:96px;font-size:21px;background:radial-gradient(circle at 50% 38%,rgba(200,30,40,.85),rgba(110,8,16,.9));border-color:rgba(255,120,120,.7);box-shadow:0 8px 28px rgba(200,20,30,.4)}
  #fireBtn:disabled{filter:grayscale(.7) brightness(.6)}
  #scopeBtn{width:76px;height:76px;font-size:13px;background:radial-gradient(circle at 50% 38%,rgba(30,110,160,.85),rgba(8,40,80,.9));border-color:rgba(120,200,255,.65)}
  #scopeBtn.on{background:radial-gradient(circle at 50% 38%,rgba(70,190,255,.95),rgba(10,70,120,.95))}
  #zoomBtn{width:62px;height:62px;font-size:12px}
  .zbtn{width:54px;height:54px;font-size:24px;line-height:1}
  #reloadBtn{width:62px;height:62px;font-size:11px}
  /* zoom readout pinned inside the scope view */
  #zoomReadout{position:fixed;left:50%;top:calc(50% + min(38vh,38vw));transform:translateX(-50%);z-index:5;pointer-events:none;display:none;background:rgba(5,8,16,.72);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 16px;font-weight:900;font-style:italic;letter-spacing:.1em;font-size:15px;color:#ffd76a;text-shadow:0 1px 4px #000}
  /* hitmarker */
  #hitmarker{position:fixed;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);z-index:6;pointer-events:none;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.85)) drop-shadow(0 0 6px rgba(0,0,0,.9))}
  #hitmarker:before,#hitmarker:after{content:"";position:absolute;inset:0;background:
    linear-gradient(45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%)}
  #hitmarker.foul:before,#hitmarker.foul:after{background:
    linear-gradient(45deg,transparent 44%,#ff3b47 44%,#ff3b47 56%,transparent 56%),
    linear-gradient(-45deg,transparent 44%,#ff3b47 44%,#ff3b47 56%,transparent 56%)}
  /* unscoped crosshair */
  #cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;width:34px;height:34px;opacity:.9}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.95);box-shadow:0 0 4px #000}
  #cross:before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);clip-path:polygon(0 0,100% 0,100% 32%,0 32%,0 68%,100% 68%,100% 100%,0 100%)}
  #cross:after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%);clip-path:polygon(0 0,32% 0,32% 100%,68% 100%,68% 0,100% 0,100% 100%,0 100%)}
  /* scope overlay */
  #scopeOverlay{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
  #scopeOverlay .mask{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,transparent min(41.5vh,41.5vw),rgba(0,0,0,.985) min(43vh,43vw))}
  #scopeOverlay .ring{position:absolute;left:50%;top:50%;width:min(86vh,86vw);height:min(86vh,86vw);transform:translate(-50%,-50%);border-radius:50%;border:3px solid #0a0a0c;box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
  #reticle{position:absolute;left:50%;top:50%;width:min(86vh,86vw);height:min(86vh,86vw);transform:translate(-50%,-50%)}
  #reticle .hline,#reticle .vline{position:absolute;background:rgba(10,10,12,.92)}
  #reticle .hline{left:0;right:0;top:50%;height:2px;transform:translateY(-50%)}
  #reticle .vline{top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%)}
  #reticle .dot{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#c8102e;transform:translate(-50%,-50%)}
  /* flashes */
  #foulFlash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(220,10,25,.5) 100%);opacity:0;z-index:7;pointer-events:none;transition:opacity .15s}
  #muzzleFlash{position:fixed;inset:0;background:radial-gradient(ellipse at 78% 82%,rgba(255,190,80,.30),transparent 46%);opacity:0;z-index:3;pointer-events:none}
  /* banner */
  #banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;pointer-events:none;text-align:center;padding:0 12px}
  #bannerMain{font-size:clamp(34px,10vw,92px);font-weight:900;font-style:italic;letter-spacing:.03em;line-height:.98;color:#fff;text-shadow:0 0 34px rgba(255,120,40,.55),0 6px 0 rgba(0,0,0,.35),0 12px 44px rgba(0,0,0,.8);opacity:0}
  #bannerMain.red{text-shadow:0 0 34px rgba(255,40,60,.75),0 6px 0 rgba(0,0,0,.35),0 12px 44px rgba(0,0,0,.85)}
  #bannerSub{margin-top:10px;font-size:clamp(12px,2.6vw,21px);font-weight:700;letter-spacing:.32em;color:var(--gold);text-shadow:0 2px 12px #000;opacity:0}
  #bannerMain.pop{animation:pop .38s cubic-bezier(.16,1.4,.3,1) forwards}
  #bannerSub.pop{animation:pop .38s .05s cubic-bezier(.16,1.4,.3,1) forwards}
  @keyframes pop{0%{opacity:0;transform:scale(2.6)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
  #bannerMain.fadeout,#bannerSub.fadeout{transition:opacity .3s;opacity:0 !important}
  /* menu / panels / game over */
  .screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 14px 5vh;text-align:center;background:linear-gradient(180deg,rgba(6,16,34,.30) 0%,rgba(6,16,34,0) 34%,rgba(6,16,34,.22) 60%,rgba(6,16,34,.88) 100%)}
  #logo .l1{font-size:clamp(38px,10.5vw,92px);font-weight:900;font-style:italic;line-height:.92;background:linear-gradient(180deg,#fff 20%,#a9c8ff 55%,#3d7bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(30,90,255,.45))}
  #logo .l2{font-size:clamp(38px,10.5vw,92px);font-weight:900;font-style:italic;line-height:.92;background:linear-gradient(180deg,#ffe9b0 15%,#ffb340 55%,#e05e12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(255,130,20,.5))}
  #logo .l2 b{font-size:.52em;vertical-align:.62em;color:#7fe0ff;-webkit-text-fill-color:#7fe0ff}
  #logo .tag{margin-top:8px;letter-spacing:.42em;font-size:clamp(10px,1.9vw,14px);font-weight:700;color:#eaf4ff;text-shadow:0 2px 10px #000}
  #ruleBox{margin-top:2vh;max-width:min(92vw,560px);background:rgba(90,10,20,.55);border:1.5px solid rgba(255,90,100,.75);border-radius:14px;padding:10px 16px;backdrop-filter:blur(2px)}
  #ruleTitle{font-weight:900;font-style:italic;letter-spacing:.08em;color:#ffb3ba;font-size:clamp(14px,2.6vw,18px)}
  #ruleBody{margin-top:4px;font-size:clamp(12px,2.2vw,15px);line-height:1.5;color:#ffe3e6}
  .bigbtn{pointer-events:auto;cursor:pointer;border:none;outline:none;background:linear-gradient(180deg,#ffb340,#e05e12);color:#fff;font-family:inherit;font-size:clamp(19px,3.6vw,28px);font-weight:900;font-style:italic;letter-spacing:.12em;padding:14px 46px;transform:skewX(-12deg);box-shadow:0 10px 34px rgba(255,120,20,.45), inset 0 2px 0 rgba(255,255,255,.5);animation:btnpulse 1.1s infinite alternate;margin-top:2.2vh}
  @keyframes btnpulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
  .rowbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .altbtn{pointer-events:auto;cursor:pointer;background:rgba(6,14,30,.72);color:#cfe0ff;border:1.5px solid rgba(160,190,255,.55);font-family:inherit;font-size:clamp(13px,2.4vw,16px);font-weight:800;font-style:italic;letter-spacing:.1em;padding:11px 22px;transform:skewX(-12deg);margin-top:12px}
  .altbtn:active{filter:brightness(1.5)}
  #credits{margin-top:1.8vh;font-size:10px;letter-spacing:.14em;color:rgba(220,232,250,.6)}
  .panel{pointer-events:auto;background:rgba(5,10,24,.92);border:1.5px solid rgba(140,175,255,.4);border-radius:18px;padding:20px 22px;max-width:min(94vw,560px);max-height:82vh;overflow:auto;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .panel h2{font-size:clamp(20px,4.6vw,30px);font-weight:900;font-style:italic;color:#fff;letter-spacing:.04em}
  .panel p{margin-top:12px;font-size:clamp(12.5px,2.4vw,15px);line-height:1.75;color:#c3d2ee;text-align:left}
  .panel p b{color:#fff}
  .tabs{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .tab{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(160,190,255,.4);color:#cfe0ff;font-family:inherit;font-weight:800;font-style:italic;padding:8px 18px;border-radius:999px;font-size:13px;letter-spacing:.08em}
  .tab.on{background:linear-gradient(180deg,#ffb340,#e05e12);color:#fff;border-color:transparent}
  #boardList{margin-top:14px;min-height:60px}
  #boardList .row{display:flex;align-items:baseline;gap:10px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
  #boardList .rk{font-weight:900;font-style:italic;color:var(--gold);width:34px;text-align:right}
  #boardList .nm{flex:1;text-align:left;color:#eaf2ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #boardList .sc{font-weight:900;color:#fff}
  #goTitle{font-size:clamp(32px,8.6vw,68px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 30px rgba(255,60,60,.5),0 6px 0 rgba(0,0,0,.35)}
  #goSub{margin-top:6px;font-size:clamp(13px,2.6vw,17px);font-weight:700;letter-spacing:.14em;color:#ffb3ba;text-shadow:0 2px 10px #000}
  #goStats{margin-top:2vh;font-size:clamp(12.5px,2.4vw,16px);line-height:1.9;color:#b9c8e8;text-shadow:0 1px 6px #000;letter-spacing:.04em}
  #goStats b{color:#fff}
  #nameInput{pointer-events:auto;margin-top:1.6vh;width:min(78vw,320px);background:rgba(255,255,255,.1);border:1.5px solid rgba(160,190,255,.55);border-radius:10px;color:#fff;font-family:inherit;font-size:17px;font-weight:700;padding:10px 14px;text-align:center;outline:none}
  #submitStatus{margin-top:8px;font-size:13px;color:#ffd76a;min-height:18px}
  #qaState{display:none}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta property="og:image" content="https://frg-fight-club.vercel.app/arcade/img/sniper-shot.webp"><meta name="twitter:image" content="https://frg-fight-club.vercel.app/arcade/img/sniper-shot.webp"></head>
<body>
<div id="game"></div>

<div id="loading">
  <div class="lt">SNIPER <span>SHOT 3D</span></div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadPct">0%</div>
</div>

<select id="langSel" aria-label="Language"></select>

<div id="hud">
  <div id="topbar">
    <div class="stat"><div class="lab" id="scoreLab">SCORE</div><div class="val" id="scoreVal">0</div></div>
    <div class="stat mid"><div class="lab" id="waveLab">WAVE</div><div class="val" id="waveVal">1</div></div>
    <div class="stat mid"><div class="lab" id="timeLab">TIME</div><div class="val" id="waveTimer">60</div></div>
    <div class="stat right"><div class="lab" id="targetsLab">TARGETS</div><div class="val" id="targetVal">0</div></div>
  </div>
  <div id="fouls"><span class="flab" id="foulsLab">FOULS</span><div class="fpip">!</div><div class="fpip">!</div><div class="fpip">!</div></div>
  <div id="muteBtn">♪</div>
  <div id="combo"></div>
  <div id="lowleft">
    <div id="ammoLab">MAGAZINE</div>
    <div id="ammo"></div>
    <div id="breathWrap"><div class="blab2" id="breathLab">BREATH</div><div id="breathShell"><div id="breathFill"></div></div></div>
  </div>
  <div id="btns">
    <button class="gbtn" id="scopeBtn">SCOPE</button>
    <button class="gbtn" id="zoomBtn">ZOOM</button>
    <button class="gbtn zbtn" id="zoomInBtn" aria-label="Zoom in">+</button>
    <button class="gbtn zbtn" id="zoomOutBtn" aria-label="Zoom out">−</button>
    <button class="gbtn" id="fireBtn">FIRE</button>
    <button class="gbtn" id="reloadBtn">RELOAD</button>
  </div>
</div>

<div id="pops"></div>
<div id="cross"></div>
<div id="scopeOverlay">
  <div class="mask"></div>
  <div class="ring"></div>
  <div id="reticle"><div class="hline"></div><div class="vline"></div><div class="dot"></div></div>
</div>
<div id="hitmarker"></div>
<div id="zoomReadout">ZOOM <span id="zoomVal">1.7X</span></div>
<div id="muzzleFlash"></div>
<div id="foulFlash"></div>

<div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>

<div class="screen" id="menu">
  <div id="logo">
    <div class="l1">SNIPER</div>
    <div class="l2">SHOT <b>3D</b></div>
    <div class="tag" id="tagLine">ROOFTOP RANGE OVER THE CITY</div>
  </div>
  <div id="ruleBox"><div id="ruleTitle">🎯 TARGETS ONLY</div><div id="ruleBody"></div></div>
  <button class="bigbtn" id="startBtn">▶ TAKE THE ROOF</button>
  <div class="rowbtns">
    <button class="altbtn" id="howBtn">HOW TO PLAY</button>
    <button class="altbtn" id="boardBtn">🏆 LEADERBOARD</button>
  </div>
  <div id="credits">LUNC DEV STUDIO · ALL ART PROCEDURAL &amp; ORIGINAL · ENGINE: THREE.JS (MIT)</div>
</div>

<div class="screen" id="howScreen" style="justify-content:center">
  <div class="panel">
    <h2 id="howTitle">How to play</h2>
    <p id="howBody"></p>
    <button class="altbtn" id="howClose">CLOSE</button>
  </div>
</div>

<div class="screen" id="boardScreen" style="justify-content:center">
  <div class="panel" style="width:min(94vw,500px)">
    <h2 id="boardTitle">🏆 LEADERBOARD</h2>
    <div class="tabs">
      <button class="tab on" id="tabAll">All time</button>
      <button class="tab" id="tabWeek">This week</button>
    </div>
    <div id="boardList"></div>
    <button class="altbtn" id="boardClose">CLOSE</button>
  </div>
</div>

<div class="screen" id="gameover">
  <div id="goTitle">RANGE CLOSED</div>
  <div id="goSub"></div>
  <div id="goStats"></div>
  <input id="nameInput" maxlength="16" autocomplete="off">
  <div class="rowbtns">
    <button class="altbtn" id="submitBtn">SAVE SCORE</button>
    <button class="altbtn" id="endBoardBtn">🏆 LEADERBOARD</button>
  </div>
  <div id="submitStatus"></div>
  <button class="bigbtn" id="againBtn">SHOOT AGAIN</button>
  <div id="credits">LUNC DEV STUDIO</div>
</div>

<div id="qaState"></div>

<script>
