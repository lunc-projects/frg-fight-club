<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LUNA BLASTER — Luna Classic 3D Space Blaster</title>
<meta name="description" content="Luna Blaster — a full-3D space shooter from LUNC Dev Studio. Pilot the last gunship of the Luna Classic fleet, blast the Swarm, and guard the moon gate.">
<meta name="theme-color" content="#0a0618">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0a0618;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;height:100dvh}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none !important}

  /* ---------- loading ---------- */
  #loader{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 90% at 50% 20%,#1b0f3a 0%,#0a0618 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  #loader .moon{font-size:64px;filter:drop-shadow(0 0 22px rgba(255,203,61,.85));animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  #loader h1{font-size:30px;letter-spacing:3px;color:#ffcf3d;text-shadow:0 2px 0 #7a4d00,0 6px 22px rgba(0,0,0,.7)}
  #loader p{color:#b9a8ff;font-weight:700;letter-spacing:1px}
  #loadBarWrap{width:min(300px,80vw);height:10px;border:2px solid rgba(255,203,61,.6);border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
  #loadBar{height:100%;width:0%;background:linear-gradient(90deg,#ffcf3d,#ff9d3d);transition:width .25s}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start}
  #hudLeft{display:flex;gap:6px;flex-wrap:wrap;max-width:62vw}
  .hudbox{background:rgba(16,8,40,.74);border:2px solid rgba(168,120,255,.8);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#e8dcff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .hudbox.score{color:#ffe9a8;border-color:rgba(255,203,61,.85)}
  .hudbox .coinIco{color:#ffcf3d;font-size:16px;line-height:1}
  .hudbox .starIco{color:#63b3ff;font-size:16px;line-height:1}
  #hudRight{display:flex;gap:6px;align-items:center}
  #hearts{font-size:14px;letter-spacing:1px;color:#ff5d7a;text-shadow:0 1px 3px rgba(0,0,0,.6);background:rgba(16,8,40,.74);border-radius:999px;padding:7px 10px;border:2px solid rgba(255,93,122,.6)}
  .iconbtn{pointer-events:auto;background:rgba(16,8,40,.8);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{transform:scale(.93)}
  #banner{position:absolute;top:24%;left:0;right:0;text-align:center;pointer-events:none}
  #bannerMain{font-size:clamp(28px,8vw,54px);font-weight:900;color:#ffcf3d;text-shadow:0 3px 0 #7a4d00,0 6px 18px rgba(0,0,0,.6);letter-spacing:1px}
  #bannerSub{font-size:clamp(14px,4vw,22px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);margin-top:4px}
  #hpWrap{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);width:min(340px,72vw);display:none}
  #hpLabel{text-align:center;font-weight:900;font-size:12px;letter-spacing:2px;color:#ff8fa8;text-shadow:0 1px 4px #000;margin-bottom:3px}
  #hpBarBg{height:12px;border:2px solid rgba(255,120,150,.8);border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ff9d3d);transition:width .15s}

  /* ---------- touch controls ---------- */
  #controls{position:fixed;inset:0;z-index:6;pointer-events:none}
  #stickBase{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(60,30,120,.55),rgba(16,8,40,.72));border:3px solid rgba(255,203,61,.75);box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 0 24px rgba(0,0,0,.5);pointer-events:none}
  #stickBase .cres{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(255,203,61,.28)}
  #stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffe9a8,#ffcf3d 55%,#c98a12);border:2px solid #fff3c4;box-shadow:0 4px 12px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:22px;color:#7a4d00}
  #fireBtn{position:absolute;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ff8fa8,#e0274f 58%,#8f1030);border:3px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 6px 20px rgba(0,0,0,.55);pointer-events:auto;cursor:pointer;touch-action:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #fireBtn.on{filter:brightness(1.35);transform:scale(.96)}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;background:radial-gradient(120% 90% at 50% 18%,rgba(26,12,64,.72),rgba(7,4,20,.88));overflow-y:auto}
  .screen h1{background:linear-gradient(180deg,#fff3c4 0%,#ffcf3d 45%,#e08a00 80%,#ffcf3d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 rgba(90,50,0,.9)) drop-shadow(0 10px 26px rgba(0,0,0,.75));letter-spacing:3px}
  .screen h1{font-size:clamp(30px,9vw,46px);letter-spacing:2px;color:#ffcf3d;text-shadow:0 3px 0 #7a4d00,0 8px 26px rgba(0,0,0,.8)}
  .screen h2{font-size:clamp(24px,7vw,34px);color:#ffcf3d;letter-spacing:1px}
  .screen .by{color:#b9a8ff;font-weight:800;letter-spacing:2px;font-size:13px}
  .screen .tag{color:#e8dcff;font-size:15px;max-width:430px;line-height:1.45}
  .btn{pointer-events:auto;background:linear-gradient(180deg,#ffd95e,#f5a623);color:#3d2700;border:0;border-radius:14px;font-size:20px;font-weight:900;letter-spacing:1px;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #9c6a06,0 10px 22px rgba(0,0,0,.5);min-width:min(280px,78vw)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c6a06}
  .btn.alt{background:linear-gradient(180deg,#3b2a6e,#241547);color:#e8dcff;box-shadow:0 5px 0 #120826,0 10px 22px rgba(0,0,0,.5);border:2px solid rgba(168,120,255,.6);font-size:16px;padding:11px 26px}
  .btn.small{min-width:0;font-size:15px;padding:9px 18px}
  #langSel{margin-top:6px;background:rgba(16,8,40,.9);color:#fff;border:2px solid rgba(168,120,255,.7);border-radius:12px;font-size:17px;padding:10px 14px;max-width:86vw;min-width:min(280px,78vw);text-align:center;font-weight:700}
  .strip{margin-top:10px;max-width:440px;background:rgba(20,60,30,.35);border:1.5px solid rgba(84,255,150,.55);border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.45;color:#c9ffe0}
  .best{color:#ffe9a8;font-weight:800}
  .howbody{max-width:440px;text-align:left;font-size:14.5px;line-height:1.6;color:#e8dcff;background:rgba(255,255,255,.05);border:1.5px solid rgba(168,120,255,.35);border-radius:14px;padding:14px 16px}
  .boardwrap{width:min(400px,92vw);max-height:46vh;overflow-y:auto;background:rgba(255,255,255,.05);border:1.5px solid rgba(168,120,255,.35);border-radius:14px;padding:8px 10px}
  table.board{width:100%;border-collapse:collapse;font-size:15px}
  table.board td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
  table.board td.nm{text-align:left;font-weight:700}
  table.board td.sc{text-align:right;font-weight:900;color:#ffe9a8}
  .tabs{display:flex;gap:8px}
  #nameInput{background:rgba(255,255,255,.1);border:2px solid rgba(255,203,61,.6);border-radius:12px;color:#fff;font-size:17px;padding:11px 14px;text-align:center;width:min(280px,78vw);font-weight:700}
  #nameInput::placeholder{color:rgba(255,255,255,.45)}
  .finalscore{font-size:44px;font-weight:900;color:#ffe9a8;text-shadow:0 3px 0 #7a4d00}
  .statsline{color:#b9a8ff;font-weight:700}
  .statusline{min-height:20px;color:#8dffb0;font-weight:800}
</style>
</head>
<body>
<div id="game"></div>

<div id="loader">
  <div class="moon">🌙</div>
  <h1>LUNA BLASTER</h1>
  <p>LUNA CLASSIC · LUNC DEV STUDIO</p>
  <div id="loadBarWrap"><div id="loadBar"></div></div>
</div>

<div id="failPanel" class="hidden" style="position:fixed;inset:0;z-index:70;background:radial-gradient(120% 90% at 50% 20%,#1b0f3a 0%,#0a0618 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px">
  <div style="font-size:44px">🌙</div>
  <h2 style="color:#ffcf3d;letter-spacing:2px;margin:0">LUNA BLASTER</h2>
  <p style="color:#cfc4f5;max-width:320px;margin:0">The game hit a graphics snag on this device. Tap below to reload in lighter graphics mode — your leaderboard and best score are safe.</p>
  <button id="failRetry" style="background:linear-gradient(180deg,#ffd94d,#f5a623);border:none;border-radius:14px;padding:14px 34px;font-size:17px;font-weight:800;letter-spacing:1px;color:#241300;cursor:pointer">↻ RELOAD — LIGHTER GRAPHICS</button>
</div>

<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="hudLeft">
      <div class="hudbox score"><span data-i18n="score">SCORE</span>&nbsp;<span id="hudScore">0</span></div>
      <div class="hudbox"><span class="coinIco">☾</span><span id="hudCoins">0</span></div>
      <div class="hudbox"><span class="starIco">★</span><span id="hudStars">0</span></div>
      <div class="hudbox"><span id="hudDist">0m</span></div>
    </div>
    <div id="hudRight">
      <div id="hearts">♥♥♥</div>
      <button class="iconbtn" id="muteBtn" aria-label="Sound">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </div>
  <div id="hpWrap"><div id="hpLabel">DREADNOUGHT</div><div id="hpBarBg"><div id="hpBar"></div></div></div>
  <div id="banner" class="hidden"><div id="bannerMain"></div><div id="bannerSub"></div></div>
</div>

<div id="controls" class="hidden">
  <div id="stickBase"><div class="cres">☾</div><div id="stickKnob">☾</div></div>
  <button id="fireBtn">FIRE</button>
</div>

<div class="screen hidden" id="menuScreen">
  <div class="by">LUNC DEV STUDIO</div>
  <h1>🌙 LUNA BLASTER</h1>
  <p class="tag" data-i18n="tag"></p>
  <button class="btn" id="playBtn" data-i18n="play"></button>
  <button class="btn alt" id="howBtn" data-i18n="how"></button>
  <button class="btn alt" id="boardBtn" data-i18n="board"></button>
  <div class="best" id="bestLine"></div>
  <select id="langSel" aria-label="Language"></select>
  <div class="strip" data-i18n="strip"></div>
</div>

<div class="screen hidden" id="howScreen">
  <h2 data-i18n="howTitle"></h2>
  <div class="howbody" data-i18n-html="howBody"></div>
  <button class="btn small" id="howClose" data-i18n="close"></button>
</div>

<div class="screen hidden" id="boardScreen">
  <h2 data-i18n="boardTitle"></h2>
  <div class="tabs">
    <button class="btn small" id="tabAll" data-i18n="allTime"></button>
    <button class="btn small alt" id="tabWeek" data-i18n="week"></button>
  </div>
  <div class="boardwrap" id="boardBody"></div>
  <button class="btn small" id="boardClose" data-i18n="close"></button>
</div>

<div class="screen hidden" id="pauseScreen">
  <h2 data-i18n="paused"></h2>
  <button class="btn" id="resumeBtn" data-i18n="resume"></button>
  <button class="btn alt" id="quitBtn" data-i18n="quit"></button>
</div>

<div class="screen hidden" id="overScreen">
  <h2 data-i18n="over"></h2>
  <div class="finalscore" id="finalScore">0</div>
  <div class="statsline" id="overStats"></div>
  <input id="nameInput" maxlength="16" autocomplete="off">
  <button class="btn" id="submitBtn" data-i18n="submit"></button>
  <div class="statusline" id="savedLine"></div>
  <button class="btn alt" id="overBoardBtn" data-i18n="board"></button>
  <button class="btn alt" id="againBtn" data-i18n="again"></button>
  <button class="btn alt" id="menuBtn" data-i18n="menu"></button>
</div>

<script>
/* crash guard — installed BEFORE the game module loads. Any fatal error or a
   stuck loader becomes a friendly recoverable panel (tap to retry in LOW
   GRAPHICS mode) — never a black screen. */
(function () {
  var stage = 0; // 0 = fancy, 1 = stepped down once, 2 = low graphics
  try { stage = parseInt(localStorage.getItem('lunaBlasterStage') || '0', 10) || 0; } catch (e) {}
  window.__gfxStage = Math.min(2, Math.max(0, stage));
  function showFail() {
    var f = document.getElementById('failPanel');
    if (f) { f.classList.remove('hidden'); }
    var l = document.getElementById('loader'); if (l) l.classList.add('hidden');
  }
  window.__showFail = showFail;
  window.addEventListener('error', function (ev) {
    if (ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) { showFail(); return; }
    if (typeof window.__blaster === 'undefined') showFail();
  }, true);
  window.addEventListener('unhandledrejection', function () { if (typeof window.__blaster === 'undefined') showFail(); });
  setTimeout(function () {
    if (typeof window.__blaster === 'undefined') showFail();
  }, 14000);
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('failRetry');
    if (btn) btn.addEventListener('click', function () {
      try { localStorage.setItem('lunaBlasterStage', String(Math.min(2, window.__gfxStage + 1))); } catch (e) {}
      location.reload();
    });
  });
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js"
} }
</script>
<script src="i18n.js"></script>
<script type="module" src="game.js?v=blast1"></script>
</body>
</html>
