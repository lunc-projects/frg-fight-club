<!DOCTYPE html>
<html lang="en">
<head>
<base href="/lunc-archery/">

<title>LUNC Archery — LUNC Dev Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#140a20;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff4e0;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- language selector (house pattern) ---------- */
  #langWrap{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;z-index:80;display:flex;align-items:center;gap:6px;background:rgba(24,10,26,.85);border:1px solid #ffb347;border-radius:999px;padding:5px 10px;box-shadow:0 0 14px rgba(255,150,50,.3)}
  #langWrap span{font-size:17px}
  #langSel{background:transparent;border:none;color:#ffb347;font-size:15px;font-weight:700;outline:none;max-width:128px}
  #langSel option{background:#1c0d22;color:#fff}
  #muteBtn{position:fixed;top:calc(6px + env(safe-area-inset-top));left:8px;z-index:80;background:rgba(24,10,26,.85);border:1px solid #ffb347;border-radius:999px;padding:5px 12px;font-size:16px;color:#ffb347;cursor:pointer}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:40;pointer-events:none}
  #topBar{position:absolute;top:calc(52px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  #roundLine{font-size:15px;font-weight:800;letter-spacing:2px;color:#ffe9c9;text-shadow:0 2px 6px #000}
  #roundLine b{color:#ffd23e}
  #strip{display:flex;gap:6px}
  .chip{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#1a0d00;background:rgba(20,8,24,.75);border:2px solid rgba(255,255,255,.35);text-shadow:none}
  .chip.gold{background:radial-gradient(circle at 35% 35%,#ffe98a,#f5b921);border-color:#fff2b0}
  .chip.red{background:radial-gradient(circle at 35% 35%,#ff9a8a,#d92b1f);color:#fff;border-color:#ffc4b8}
  .chip.blue{background:radial-gradient(circle at 35% 35%,#7ec3ff,#1256c9);color:#fff;border-color:#bfe0ff}
  .chip.black{background:radial-gradient(circle at 35% 35%,#5a5a66,#101014);color:#fff;border-color:#9a9aa6}
  .chip.white{background:radial-gradient(circle at 35% 35%,#ffffff,#c9c9d4);color:#222;border-color:#fff}
  .chip.miss{background:rgba(20,8,24,.75);color:#ff7b6b;border-color:#ff7b6b}
  #windBox{position:absolute;top:calc(52px + env(safe-area-inset-top));left:10px;background:rgba(20,8,24,.78);border:1px solid rgba(255,179,71,.7);border-radius:12px;padding:6px 10px;text-align:center;min-width:74px}
  #windBox .wl{font-size:10px;font-weight:800;letter-spacing:2px;color:#ffcf99}
  #windVal{font-size:19px;font-weight:900;color:#fff}
  #windVal .arr{display:inline-block;color:#ffd23e}
  #scoreBox{position:absolute;top:calc(52px + env(safe-area-inset-top));right:10px;background:rgba(20,8,24,.78);border:1px solid rgba(255,179,71,.7);border-radius:12px;padding:6px 12px;text-align:center;min-width:74px}
  #scoreBox .wl{font-size:10px;font-weight:800;letter-spacing:2px;color:#ffcf99}
  #scoreVal{font-size:19px;font-weight:900;color:#ffd23e}
  #hint{position:absolute;left:0;right:0;bottom:calc(108px + env(safe-area-inset-bottom));text-align:center;font-size:15px;font-weight:700;color:#ffe9c9;text-shadow:0 2px 6px #000;padding:0 20px}
  #powerWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));width:min(240px,60vw);height:14px;border-radius:999px;background:rgba(10,4,16,.7);border:1px solid rgba(255,255,255,.4);overflow:hidden;opacity:0;transition:opacity .15s}
  #powerFill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#57d95e,#ffd23e,#ff5f2e)}
  #cross{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none;opacity:.95}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,235,180,.9);box-shadow:0 0 4px #000}
  #cross:before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
  #cross:after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
  #crossDot{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#ffd23e;box-shadow:0 0 6px #ffb347,0 0 2px #000}
  #popup{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(30px,9vw,52px);font-weight:900;letter-spacing:1px;color:#ffd23e;text-shadow:0 0 22px rgba(255,160,0,.8),0 3px 0 #8a3c00,0 5px 10px rgba(0,0,0,.6);opacity:0;transform:scale(.7);transition:opacity .18s,transform .18s}
  #popup.show{opacity:1;transform:scale(1)}
  #popup small{display:block;font-size:clamp(15px,4.4vw,21px);color:#fff;letter-spacing:2px;text-shadow:0 2px 6px #000}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 115%,rgba(255,110,30,.25),rgba(10,4,16,.45) 60%);text-align:center}
  .hidden{display:none !important}
  .titleArt{font-size:clamp(40px,12vw,76px);font-weight:900;letter-spacing:1px;line-height:.95;color:#ffd23e;text-shadow:0 0 26px rgba(255,140,0,.75),0 3px 0 #8a3c00,0 6px 0 rgba(0,0,0,.45)}
  .titleArt .d2{color:#ff7b24}
  .tagline{margin-top:10px;font-size:clamp(14px,4.4vw,20px);font-weight:800;letter-spacing:2px;color:#ffe9c9;text-shadow:0 2px 8px #000}
  .crescent{color:#ffd23e}
  .btn{display:block;width:min(320px,84vw);margin:12px auto 0;padding:15px 18px;border:none;border-radius:14px;font-size:20px;font-weight:900;letter-spacing:1px;cursor:pointer;color:#2a1400;background:linear-gradient(180deg,#ffd23e,#ff8b1f);box-shadow:0 5px 0 #9c4d00,0 10px 22px rgba(0,0,0,.5)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c4d00}
  .btn.dark{color:#ffe9c9;background:linear-gradient(180deg,#4a2358,#2a1236);box-shadow:0 5px 0 #17081f,0 10px 22px rgba(0,0,0,.5);border:1px solid #ffb347}
  .bestLine{margin-top:14px;font-size:15px;font-weight:700;color:#ffcf99;text-shadow:0 1px 4px #000}
  .howto{margin-top:16px;max-width:min(430px,92vw);font-size:15px;line-height:1.55;color:#ffe9c9;text-shadow:0 1px 4px #000;background:rgba(20,8,24,.55);border:1px solid rgba(255,179,71,.4);border-radius:14px;padding:12px 16px}
  .card{background:rgba(20,8,24,.93);border:1px solid #ffb347;border-radius:18px;padding:22px 20px;max-width:min(430px,94vw);box-shadow:0 14px 40px rgba(0,0,0,.6)}
  .card h2{color:#ffd23e;letter-spacing:1px;margin-bottom:10px;font-size:clamp(24px,7vw,32px)}
  .card p{font-size:16px;line-height:1.6;color:#ffe9c9;margin-bottom:6px}
  .card p b{color:#ffd23e}
  [dir="rtl"] .card p{text-align:right}
</style>
</head>

let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f0, f1, dur, type, vol, when){
  if(muted) return; const ac = audio(); if(!ac) return;
  const t = ac.currentTime + (when||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f0, t);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(vol||0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
}
function noiseBurst(dur, freq, vol, when){
  if(muted) return; const ac = audio(); if(!ac) return;
  const t = ac.currentTime + (when||0);
  const len = Math.max(1, (dur*ac.sampleRate)|0), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq||800;
  const g = ac.createGain(); g.gain.value = vol||0.2;
  src.connect(f).connect(g).connect(ac.destination); src.start(t);
}

/* dusk sky dome (canvas gradient, sun glow low over the range) */
function makeSkyTexture(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,512);
  grad.addColorStop(0.00,'#1c0e3e'); grad.addColorStop(0.24,'#4a2060');
  grad.addColorStop(0.40,'#93365e'); grad.addColorStop(0.47,'#e06432');
  grad.addColorStop(0.505,'#ffb347'); grad.addColorStop(0.53,'#7a4630');
  grad.addColorStop(1.00,'#241428');
  g.fillStyle = grad; g.fillRect(0,0,1024,512);
  for (const sx of [0, 512, 1024]) {
    const sun = g.createRadialGradient(sx,252,8,sx,252,210);
    sun.addColorStop(0,'rgba(255,232,175,0.95)'); sun.addColorStop(0.3,'rgba(255,180,80,0.5)'); sun.addColorStop(1,'rgba(255,150,50,0)');
    g.fillStyle = sun; g.fillRect(0,0,1024,512);
    g.fillStyle = '#ffedb5'; g.beginPath(); g.arc(sx,252,24,0,7); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeEarthTexture(){

/* moon hills — two silhouette rings */
function hillRing(count, rMin, rMax, hMin, hMax, color){
  const mat = new THREE.MeshStandardMaterial({ color, roughness:1, flatShading:true });
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2 + Math.random()*0.3;
    const r = rMin + Math.random()*(rMax-rMin);
    const h = hMin + Math.random()*(hMax-hMin);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(h*0.9, h, 5), mat);
    cone.position.set(Math.cos(a)*r, h/2 - 2, Math.sin(a)*r - 40);
    cone.rotation.y = Math.random()*3;
    scene.add(cone);
  }
}

function makeTargetTexture(){

}

  };
  seg(new THREE.Vector3(0,-0.15,-0.02), new THREE.Vector3(0,0.15,-0.02), 0.030, riserMat);           /* riser */
  seg(new THREE.Vector3(0,0.13,-0.02), new THREE.Vector3(0,0.36,-0.09), 0.020, limbMat);            /* upper limb 1 */
  seg(new THREE.Vector3(0,0.36,-0.09), BOW.tipTop, 0.015, limbMat);                                  /* upper limb 2 */
  seg(new THREE.Vector3(0,-0.13,-0.02), new THREE.Vector3(0,-0.36,-0.09), 0.020, limbMat);          /* lower limb 1 */
  seg(new THREE.Vector3(0,-0.36,-0.09), BOW.tipBot, 0.015, limbMat);                                 /* lower limb 2 */
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.13, 10),
    new THREE.MeshStandardMaterial({ color:0xd9a520, roughness:0.35, metalness:0.5 }));
  grip.position.set(0, 0, -0.01); bowGroup.add(grip);
  /* gold crescent emblem on the riser */
  const cc = document.createElement('canvas'); cc.width = cc.height = 64;
  const cg = cc.getContext('2d');
  cg.fillStyle = '#ffd23e'; cg.beginPath(); cg.arc(32,32,24,0,7); cg.fill();
  cg.fillStyle = '#2e1a3e'; cg.beginPath(); cg.arc(41,26,20,0,7); cg.fill();
  const ctex = new THREE.CanvasTexture(cc); ctex.colorSpace = THREE.SRGBColorSpace;
  const emblem = new THREE.Mesh(new THREE.CircleGeometry(0.045, 24),
    new THREE.MeshBasicMaterial({ map: ctex, transparent: true }));
  emblem.position.set(0, 0.09, 0.016); emblem.rotation.y = Math.PI; bowGroup.add(emblem);
  /* string */
  const sgeo = new THREE.BufferGeometry().setFromPoints([BOW.tipTop, new THREE.Vector3(0,0,BOW.restZ), BOW.tipBot]);
  stringLine = new THREE.Line(sgeo, new THREE.LineBasicMaterial({ color:0xf3e9d2 }));
  bowGroup.add(stringLine);
}
function makeArrowMesh(){
  const grp = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.72, 8),
    new THREE.MeshStandardMaterial({ color:0xc9a86a, roughness:0.6 }));
  shaft.rotation.x = Math.PI/2; grp.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.07, 10),
    new THREE.MeshStandardMaterial({ color:0xb9c1cc, roughness:0.3, metalness:0.8 }));
  tip.rotation.x = -Math.PI/2; tip.position.z = -0.39; grp.add(tip);
  const fmat = new THREE.MeshStandardMaterial({ color:0xff5f2e, roughness:0.7, side:THREE.DoubleSide });
  for(let i=0;i<3;i++){
    const fgeo = new THREE.PlaneGeometry(0.12, 0.055);
    fgeo.rotateY(Math.PI/2);            /* length now along Z (the shaft) */
    fgeo.translate(0, 0.030, 0.29);     /* out from shaft, near the back */
    const fin = new THREE.Mesh(fgeo, fmat);
    fin.rotation.z = i * Math.PI*2/3;
    grp.add(fin);
  }
  return grp;
}
nockArrow = makeArrowMesh();
nockArrow.position.set(0, 0, 0.02);
bowGroup.add(nockArrow);
function setStringPull(power){
  const pos = stringLine.geometry.attributes.position;
  pos.setXYZ(1, 0, 0, BOW.restZ + power*0.24);
  pos.needsUpdate = true;
  nockArrow.position.z = 0.02 + power*0.24;
  nockArrow.visible = (state === 'aim' || state === 'draw');
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- game state ---------- */
const DISTANCES = [20, 35, 50];
let state = 'menu'; /* menu | aim | draw | fly | score | roundEnd | over */
let round = 0, arrowIdx = 0;
let roundScores = [], totalScore = 0, roundTotals = [];
let bestTotal = parseInt(localStorage.getItem('luncArchery_bestTotal')||'0', 10) || 0;
let bestRound = parseInt(localStorage.getItem('luncArchery_bestRound')||'0', 10) || 0;
let wind = 0;                 /* sideways accel, m/s^2 */
let aimYaw = 0, aimPitch = 0.03;
let power = 0, holdTime = 0, swayT = Math.random()*100, scoreTimer = 0;
let flying = null;
let stuckArrows = [];
let lastHitInfo = null;
const keys = {};

function newWind(){
  wind = (Math.random()*2 - 1) * (1.1 + round*0.55);
  const arrow = wind >= 0 ? '→' : '←';
  $('windVal').innerHTML = '<span class="arr">' + arrow + '</span> ' + (Math.abs(wind)*2).toFixed(1);
  flags.forEach(f => { f.flag.rotation.y = wind >= 0 ? 0 : Math.PI; });
}
function updateRoundLine(){
  $('roundLine').innerHTML = T('round') + ' <b>' + (round+1) + '</b> · ' + DISTANCES[round] + 'm';
}
function updateBestLine(){
  $('bestLine').textContent = bestTotal > 0 ? (T('bestTotal') + ': ' + bestTotal + '  ·  ' + T('bestRound') + ': ' + bestRound) : '';
}
function ringClass(s){ return s >= 9 ? 'gold' : s >= 7 ? 'red' : s >= 5 ? 'blue' : s >= 3 ? 'black' : s >= 1 ? 'white' : 'miss'; }
function renderStrip(){
  const strip = $('strip'); strip.innerHTML = '';
  for(let i=0;i<6;i++){
    const d = document.createElement('div');
    if(i < roundScores.length){ const s = roundScores[i]; d.className = 'chip ' + ringClass(s); d.textContent = s > 0 ? s : '✕'; }
    else { d.className = 'chip'; d.textContent = '·'; }
    strip.appendChild(d);
  }
}
function clearStuck(){
  stuckArrows.forEach(m => scene.remove(m)); stuckArrows = [];
}
function startMatch(){
  round = 0; totalScore = 0; roundTotals = [];
  $('scoreVal').textContent = '0';
  startRound();
}
function startRound(){
  roundScores = []; arrowIdx = 0;
  clearStuck();
  targetGroup.position.z = -DISTANCES[round];
  drawSign(DISTANCES[round]);
  updateRoundLine(); renderStrip(); newWind();
  aimYaw = 0; aimPitch = 0.03; power = 0; setStringPull(0);
  $('menuScr').classList.add('hidden');
  $('roundScr').classList.add('hidden');
  $('finalScr').classList.add('hidden');
  $('hud').classList.remove('hidden');
  state = 'aim';
}
function endRound(){
  const rs = roundScores.reduce((a,b)=>a+b, 0);
  roundTotals.push(rs);
  let newBestFlag = false;
  if(rs > bestRound){ bestRound = rs; localStorage.setItem('luncArchery_bestRound', String(bestRound)); }
  if(round >= 2){
    if(totalScore > bestTotal){ bestTotal = totalScore; localStorage.setItem('luncArchery_bestTotal', String(bestTotal)); newBestFlag = true; }
    state = 'over';
    $('finalLines').innerHTML =
      roundTotals.map((v,i)=> T('round') + ' ' + (i+1) + ' (' + DISTANCES[i] + 'm): <b>' + v + '</b>').join('<br>') +
      '<br>' + T('total') + ': <b>' + totalScore + '</b>';
    $('finalBest').innerHTML = newBestFlag ? T('newBest') : (T('bestTotal') + ': ' + bestTotal);
    $('finalScr').classList.remove('hidden');
  } else {
    state = 'roundEnd';
    $('roundTitle').textContent = T('round') + ' ' + (round+1);
    $('roundScoreLine').innerHTML = T('roundScore') + ': <b>' + rs + '</b>';
    $('roundBestLine').innerHTML = T('total') + ': <b>' + totalScore + '</b>  ·  ' + T('bestRound') + ': ' + bestRound;
    $('roundScr').classList.remove('hidden');
  }
  updateBestLine();
}
function nextArrow(){
  arrowIdx++;
  if(arrowIdx >= 6){ endRound(); return; }
  newWind(); power = 0; holdTime = 0; setStringPull(0);
  state = 'aim';
}
function showPopup(main, sub){
  const p = $('popup');
  p.innerHTML = main + (sub ? '<small>' + sub + '</small>' : '');
  p.classList.add('show');
  setTimeout(()=> p.classList.remove('show'), 1000);
}

/* ---------- aiming / sway ---------- */
function effAim(){
  const distF = 1 + round*0.35;
  let amp = (0.0016 + Math.min(holdTime, 2.5)*0.0016) * distF * (state === 'draw' ? (0.5 + power*0.9) : 0.35);
  let y = (Math.sin(swayT*1.7)*0.6 + Math.sin(swayT*2.9 + 1.3)*0.4) * amp;
  let p = (Math.sin(swayT*2.3 + 0.7)*0.6 + Math.sin(swayT*3.7 + 2.1)*0.4) * amp;
  if(state === 'draw' && holdTime > 2.4){ const j = (holdTime - 2.4)*0.004; y += (Math.random()-0.5)*j; p += (Math.random()-0.5)*j; }
  return { yaw: aimYaw + y, pitch: aimPitch + p };
}

/* ---------- shooting ---------- */
function loose(){
  const a = effAim();
  const dir = new THREE.Vector3(
    Math.sin(a.yaw)*Math.cos(a.pitch),
    Math.sin(a.pitch),
    -Math.cos(a.yaw)*Math.cos(a.pitch));
  const speed = 20 + power*22;
  const mesh = makeArrowMesh();
  const spawn = new THREE.Vector3(0.13, 1.24, -0.55);
  mesh.position.copy(spawn);
  scene.add(mesh);
  flying = { mesh, vel: dir.multiplyScalar(speed), t: 0, prevZ: spawn.z };
  state = 'fly'; power = 0; holdTime = 0; setStringPull(0);
  sRelease(); whistleStart();
}
function scoreForRadius(r){
  const f = r / TARGET_R;
  if(f <= 0.1) return 10; if(f <= 0.2) return 9; if(f <= 0.3) return 8;
  if(f <= 0.4) return 7; if(f <= 0.5) return 6; if(f <= 0.6) return 5;
  if(f <= 0.7) return 4; if(f <= 0.8) return 3; if(f <= 0.9) return 2;
  if(f <= 1.0) return 1; return 0;
}
function resolveShot(score, stuckMesh){
  whistleStop();
  if(stuckMesh) stuckArrows.push(stuckMesh);
  roundScores.push(score); totalScore += score;
  $('scoreVal').textContent = String(totalScore);
  renderStrip();
  if(score === 10){ sBullseye(); showPopup(T('bullseye'), '+10'); }
  else if(score > 0){ showPopup('+' + score, ''); }
  else { showPopup(T('miss'), ''); }
  state = 'score'; scoreTimer = 1.15;
}
function updateFlight(dt){
  if(!flying) return;
  const f = flying; f.t += dt;
  f.vel.y -= 4.5*dt;
  f.vel.x += wind*dt;
  const prev = f.mesh.position.clone();
  f.mesh.position.addScaledVector(f.vel, dt);
  const p = f.mesh.position;
  const ahead = p.clone().add(f.vel);
  f.mesh.lookAt(ahead);
  const faceZ = -DISTANCES[round];
  if(prev.z > faceZ && p.z <= faceZ){
    const frac = (prev.z - faceZ) / (prev.z - p.z);
    const hit = prev.clone().lerp(p, frac);
    const r = Math.hypot(hit.x, hit.y - TARGET_Y);
    if(r <= TARGET_R){
      const score = scoreForRadius(r);
      lastHitInfo = { x: hit.x, y: hit.y, score };
      p.copy(hit); p.z = faceZ - 0.04;
      flying = null; sThud();
      resolveShot(score, f.mesh);
      return;
    }
  }
  if(p.y <= 0.03 && f.vel.y < 0){
    p.y = 0.03; flying = null; sGround();
    resolveShot(0, f.mesh);
    return;
  }
  if(p.z < faceZ - 30 || f.t > 5){
    scene.remove(f.mesh); flying = null;
    resolveShot(0, null);
  }
}

/* ---------- input ---------- */
let dragStart = null, aimStart = null;
function onDown(e){
  audio();
  if(state !== 'aim') return;
  if(e.target.closest && e.target.closest('#langWrap, #muteBtn, .screen, button, select')) return;
  state = 'draw'; holdTime = 0; power = 0;
  dragStart = { x: e.clientX, y: e.clientY };
  aimStart = { yaw: aimYaw, pitch: aimPitch };
  sDraw();
}
function onMove(e){
  if(state !== 'draw' || !dragStart) return;
  aimYaw = THREE.MathUtils.clamp(aimStart.yaw + (e.clientX - dragStart.x)*0.0035, -0.14, 0.14);
  aimPitch = THREE.MathUtils.clamp(aimStart.pitch - (e.clientY - dragStart.y)*0.0035, -0.05, 0.22);
}
function onUp(){
  if(state !== 'draw') return;
  dragStart = null;
  loose();
}
window.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space' && state === 'aim'){ e.preventDefault(); state = 'draw'; holdTime = 0; power = 0; dragStart = null; sDraw(); }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if(e.code === 'Space' && state === 'draw'){ e.preventDefault(); loose(); }
});

/* ---------- buttons ---------- */
$('playBtn').onclick = () => { audio(); sClick(); startMatch(); };
$('contBtn').onclick = () => { sClick(); round++; startRound(); };
$('againBtn').onclick = () => { sClick(); startMatch(); };
$('menuBtn').onclick = () => { sClick(); state = 'menu'; $('finalScr').classList.add('hidden'); $('hud').classList.add('hidden'); $('menuScr').classList.remove('hidden'); updateBestLine(); };

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  swayT += dt;
  earth.rotation.y += dt*0.004;

  /* flags wave with the wind */
  const wStr = Math.min(Math.abs(wind), 2.4)/2.4;
  for(const fl of flags){
    const pos = fl.flag.geometry.attributes.position, base = fl.base;
    for(let i=0;i<pos.count;i++){
      const bx = base[i*3];
      pos.setZ(i, Math.sin(bx*5 - t*(4 + Math.abs(wind)*3) + fl.phase) * 0.07 * (0.35 + wStr) * (bx/0.95));
    }
    pos.needsUpdate = true;
  }

  if(state === 'draw'){
    holdTime += dt;
    power = Math.min(1, holdTime/1.15);
    setStringPull(power);
    if(keys['ArrowLeft']) aimYaw = Math.max(-0.14, aimYaw - dt*0.25);
    if(keys['ArrowRight']) aimYaw = Math.min(0.14, aimYaw + dt*0.25);
    if(keys['ArrowUp']) aimPitch = Math.min(0.22, aimPitch + dt*0.25);
    if(keys['ArrowDown']) aimPitch = Math.max(-0.05, aimPitch - dt*0.25);
  }
  if(state === 'fly') updateFlight(dt);
  if(state === 'score'){ scoreTimer -= dt; if(scoreTimer <= 0) nextArrow(); }

  /* crosshair + bow follow the (swaying) aim */
  const a = effAim();
  const inGame = (state === 'aim' || state === 'draw');
  const cross = $('cross');
  cross.style.opacity = inGame ? '0.95' : '0';
  if(inGame){
    const pxPerRad = (window.innerHeight/2) / Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    cross.style.left = (window.innerWidth/2 + a.yaw*pxPerRad) + 'px';
    cross.style.top = (window.innerHeight/2 - a.pitch*pxPerRad) + 'px';
  }
  $('hint').style.opacity = state === 'aim' ? '1' : '0';
  $('powerWrap').style.opacity = state === 'draw' ? '1' : '0';
  $('powerFill').style.width = (power*100).toFixed(0) + '%';
  bowGroup.rotation.y = a.yaw*0.7;
  bowGroup.rotation.x = -a.pitch*0.7;
  camera.rotation.y = a.yaw*0.35;
  camera.rotation.x = a.pitch*0.35;
  const targetFov = state === 'draw' ? 60 - power*6 : 60;
  if(Math.abs(camera.fov - targetFov) > 0.1){ camera.fov += (targetFov - camera.fov)*0.2; camera.updateProjectionMatrix(); }

  renderer.render(scene, camera);
}
applyLang();
updateBestLine();
setStringPull(0);
animate();

/* QA / debug hook */
window.__archery = {
  get state(){ return state; },
  get total(){ return totalScore; },
  get roundScores(){ return roundScores.slice(); },
  get round(){ return round; },
  get wind(){ return wind; },
  get arrowIdx(){ return arrowIdx; },
  get lastHit(){ return lastHitInfo; },
  setWind(v){ wind = v; },
  skipWait(){ if(state === 'score') scoreTimer = 0; },
  start(){ startMatch(); },
  solvePitch(pw){
    const dist = DISTANCES[round], speed = 20 + pw*22;
    const tt = dist/speed, drop = 0.5*4.5*tt*tt;
    return Math.atan2((TARGET_Y - 1.24) + drop, dist);
  },
  fire(yaw, pitch, pw){
    if(state !== 'aim' && state !== 'draw') return false;
    aimYaw = yaw; aimPitch = pitch; power = pw; state = 'draw';
    loose(); return true;
  }
};
</script>
</body>
