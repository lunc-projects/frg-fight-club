<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LUNA RACER 3D — Race the Champion · Luna Classic</title>
<meta name="description" content="Luna Racer 3D — a full-3D race over the Moon Pass. Steep hills, winding corners, three big jumps, and one Champion to beat. Free Luna Classic arcade game by LUNC Dev Studio.">
<meta name="theme-color" content="#101f42">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#101f42;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;height:100dvh}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  #hudLeft{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
  .hudbox{background:rgba(6,24,44,.72);border:2px solid rgba(255,203,61,.85);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#ffe9a8;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
  .hudbox img{width:19px;height:19px}
  .hudbox .starIco{color:#63b3ff;font-size:17px;line-height:1}
  .hudbox.pos{font-size:19px;color:#fff;border-color:rgba(255,255,255,.75)}
  .hudbox.pos.first{color:#7dff9a;border-color:rgba(125,255,154,.8)}
  .hudbox.gap{color:#cfe8ff;font-size:13.5px}
  .hudbox.gap b{color:#fff}
  .hudbox.speed{color:#fff;font-variant-numeric:tabular-nums}
  .hudbox.speed small{font-size:10.5px;color:#9fc6ee;font-weight:700}
  .iconbtn{pointer-events:auto;background:rgba(6,24,44,.78);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .iconbtn:active{transform:scale(.93)}
  /* progress bar: you vs champion */
  #progWrap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translateX(-50%);width:min(62vw,430px);height:12px;background:rgba(6,24,44,.66);border:2px solid rgba(255,255,255,.35);border-radius:999px}
  #progYou{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#ffd23e;border:2px solid #fff3c4;transform:translate(-50%,-50%);left:0%;box-shadow:0 0 8px rgba(255,210,62,.9);z-index:2}
  #progChamp{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#e33; border:2px solid #ffb3b3;transform:translate(-50%,-50%);left:0%;box-shadow:0 0 8px rgba(255,60,60,.8)}
  #progFlag{position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:13px}
  #banner{position:absolute;top:21%;left:0;right:0;text-align:center;pointer-events:none}
  #bannerMain{font-size:clamp(30px,9vw,58px);font-weight:900;color:#ffcf3d;text-shadow:0 3px 0 #b97e0a,0 6px 18px rgba(0,0,0,.55);letter-spacing:1px}
  #bannerSub{font-size:clamp(15px,4.2vw,24px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.75);margin-top:4px}
  #bannerMain.fadeout,#bannerSub.fadeout{transition:opacity .3s;opacity:0 !important}
  #cdWrap{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none}
  #cdText{font-size:clamp(44px,13vw,84px);font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.6);letter-spacing:2px}
  #cdText.go{color:#7dff9a;text-shadow:0 4px 0 #14662e,0 8px 30px rgba(0,0,0,.6)}

  /* ---------- Touch controls ---------- */
  #touchUI{position:fixed;inset:auto 0 0 0;z-index:6;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-end;gap:10px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
  .tbtn{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,93,93,.9);background:rgba(90,16,10,.55);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(2px);letter-spacing:.5px;text-align:center}
  .tbtn:active,.tbtn.on{transform:scale(.92);background:rgba(255,80,60,.55)}
  /* nitrous: big orange thumb button + tank meter (charge ONLY from collected tokens) */
  #btnNitro{width:88px;height:88px;border-color:rgba(255,170,40,.95);background:rgba(96,52,4,.60);color:#ffd76a;font-size:16px;flex-direction:column;gap:3px;line-height:1.05}
  #btnNitro small{font-size:9.5px;font-weight:800;color:#ffe9a8;letter-spacing:.4px}
  #nitroKeyHint{display:none}
  @media (pointer:fine){ #nitroKeyHint{display:block} }
  #btnNitro:active,#btnNitro.on{transform:scale(.92);background:rgba(255,140,20,.65);color:#fff}
  #btnNitro.empty{opacity:.45;border-color:rgba(255,255,255,.35);color:#cfd8e6}
  #nitroMeter{width:52px;height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  #nitroFill{height:100%;width:0%;background:linear-gradient(90deg,#ff9a1f,#ffd23e);border-radius:99px}
  .hudbox.nitro{color:#ffd76a}
  #hudNitroWrap{width:64px;height:8px;border-radius:99px;background:rgba(255,255,255,.20);overflow:hidden;display:inline-block}
  #hudNitroFill{height:100%;width:0%;background:linear-gradient(90deg,#ff9a1f,#ffd23e)}
  @media (pointer:fine){ #touchUI{opacity:.6} }
  /* camera VIEW button + cockpit dash frame (owner, Nov 7 late) */
  #btnView{width:66px;height:66px;border-color:rgba(125,184,255,.9);background:rgba(10,40,80,.55);color:#cfe8ff;font-size:13px;flex-direction:column;gap:2px;line-height:1.05}
  #btnView small{font-size:9px;font-weight:800;color:#ffe9a8;letter-spacing:.4px}
  #viewKeyHint{display:none}
  @media (pointer:fine){ #viewKeyHint{display:block} }
  #btnView:active{transform:scale(.92);background:rgba(40,110,200,.55)}
  #viewName{font-size:11px;color:#ffd76a;font-weight:900;letter-spacing:.6px}
  #cockpitFrame{position:fixed;inset:0;z-index:4;pointer-events:none}
  #cockpitFrame svg{width:100%;height:100%;display:block}

  /* ---------- Floating joystick (house style: gold crescent knob) ---------- */
  #stickDock{position:fixed;left:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:118px;height:118px;z-index:7;pointer-events:none}
  #stickBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,203,61,.75);background:radial-gradient(circle at 50% 42%,rgba(120,90,20,.30),rgba(6,24,44,.42));box-shadow:0 4px 18px rgba(0,0,0,.4),inset 0 0 22px rgba(255,203,61,.20);opacity:.62}
  #stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;will-change:transform;border-radius:50%;border:3px solid rgba(255,203,61,.95);background:radial-gradient(circle at 38% 32%,#ffe9a8,#f5a623 72%,#b97e0a);box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  #stickKnob img{width:30px;height:30px;pointer-events:none}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,rgba(11,60,110,.50),rgba(4,16,32,.86));padding:18px;text-align:center;overflow:auto}
  .logo{font-size:clamp(36px,10vw,62px);font-weight:900;line-height:.98;color:#ffcf3d;text-shadow:0 4px 0 #b97e0a,0 8px 24px rgba(0,0,0,.6);letter-spacing:1px}
  .logo .d3{color:#63b3ff;text-shadow:0 4px 0 #1d5fa8,0 8px 24px rgba(0,0,0,.6)}
  .crescent{width:72px;height:72px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));margin-bottom:2px}
  #menuTag{font-size:clamp(14px,4vw,19px);font-weight:600;color:#d8ecff;margin:10px 0 6px;max-width:540px}
  #menuHint{font-size:13.5px;font-weight:700;color:#ffe9a8;margin-bottom:12px}
  .bigbtn{pointer-events:auto;background:linear-gradient(180deg,#ffd94d,#f5a623);border:none;border-bottom:5px solid #b97e0a;color:#3a2400;font-size:clamp(19px,5.4vw,25px);font-weight:900;padding:13px 42px;border-radius:999px;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 20px rgba(0,0,0,.45);margin:5px}
  .bigbtn:active{transform:translateY(3px);border-bottom-width:2px}
  .bigbtn:disabled{opacity:.55}
  .smallbtn{pointer-events:auto;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:15px;font-weight:800;padding:9px 22px;border-radius:999px;cursor:pointer;margin:5px}
  .smallbtn:active{transform:scale(.95)}
  .rowbtns{display:flex;flex-wrap:wrap;justify-content:center}
  #langSel{margin-top:14px;background:rgba(6,24,44,.85);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:10px;font-size:15px;padding:8px 10px;max-width:86vw}
  .panel{background:rgba(6,24,44,.92);border:2px solid rgba(255,203,61,.6);border-radius:18px;padding:18px 20px;max-width:min(92vw,480px);max-height:82vh;overflow:auto;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .panel h2{color:#ffcf3d;font-size:22px;margin-bottom:10px;text-align:center}
  .panel .body{font-size:15px;line-height:1.55;color:#e6f2ff}
  .panel .center{text-align:center;margin-top:14px}
  .secStrip{margin-top:16px;max-width:520px;background:rgba(20,80,50,.3);border:1.5px solid #2f9e63;color:#c9f5da;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.5;font-weight:600}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
  .tab{background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:14px;font-weight:800;padding:7px 16px;border-radius:999px;cursor:pointer}
  .tab.on{background:linear-gradient(180deg,#ffd94d,#f5a623);color:#3a2400;border-color:#ffe9a8}
  #boardBody{min-width:min(74vw,300px)}
  #boardBody .row{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);font-size:15.5px}
  #boardBody .row .rk{color:#9fc6ee;font-weight:800;width:30px}
  #boardBody .row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #boardBody .row .sc{font-weight:900;color:#ffd76a}
  #boardBody p{text-align:center;opacity:.85;padding:10px 0}
  #overTitle{font-size:clamp(26px,7.4vw,44px);font-weight:900;color:#ffcf3d;text-shadow:0 3px 0 #b97e0a,0 6px 20px rgba(0,0,0,.6);max-width:94vw}
  #overTitle.lose{color:#ff8f8f;text-shadow:0 3px 0 #7e1d1d,0 6px 20px rgba(0,0,0,.6)}
  #overSub{font-size:clamp(14px,4vw,19px);font-weight:700;color:#d8ecff;margin:8px 0 2px;max-width:520px}
  #finalScoreLine{font-size:clamp(19px,5.6vw,28px);font-weight:900;color:#fff;margin-top:10px}
  #finalDetail{font-size:15px;color:#cfe8ff;font-weight:700;margin-top:4px;line-height:1.5}
  #saveRow{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
  #nameInput{background:rgba(6,24,44,.85);border:2px solid rgba(255,255,255,.45);border-radius:999px;color:#fff;font-size:16px;font-weight:700;padding:10px 16px;width:170px;text-align:center;outline:none}
  #savedLine{min-height:22px;font-size:14.5px;font-weight:800;color:#7dff9a;margin-top:8px}
  #loadBar{width:min(70vw,300px);height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:14px;overflow:hidden}
  #loadFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd94d,#f5a623);border-radius:99px;transition:width .2s}
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="hudLeft">
      <div class="hudbox pos" id="hudPos">2nd</div>
      <div class="hudbox gap" id="hudGap">GAP <b>0 m</b></div>
      <div class="hudbox"><img src="lunc.png" alt=""><span id="hudCoins">0</span><span class="starIco">★</span><span id="hudStars">0</span></div>
      <div class="hudbox" id="hudScore">0</div>
      <div class="hudbox nitro" title="Nitrous — refilled by collecting tokens">⚡<span id="hudNitroWrap"><span id="hudNitroFill" style="display:block"></span></span><span id="hudNitroPct">0%</span></div>
    </div>
    <div style="display:flex;gap:6px;align-items:flex-start">
      <div class="hudbox speed"><span id="hudSpeed">0</span><small>km/h</small></div>
      <div class="hudbox" id="hudTime" style="font-variant-numeric:tabular-nums">0:00</div>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
      <button class="iconbtn" id="soundBtn" aria-label="Sound">🔊</button>
    </div>
  </div>
  <div id="progWrap"><div id="progChamp"></div><div id="progYou"></div><div id="progFlag">🏁</div></div>
  <div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>
  <div id="cdWrap" class="hidden"><div id="cdText"></div></div>
</div>

<!-- COCKPIT frame (dash + wheel overlay, shown only in COCKPIT camera view) -->
<div id="cockpitFrame" class="hidden" aria-hidden="true">
  <svg viewBox="0 0 1000 620" preserveAspectRatio="none">
    <path d="M0,0 H1000 V20 H0 Z" fill="rgba(4,6,10,.5)"/>
    <path d="M0,0 H118 L34,318 L0,352 Z" fill="rgba(4,6,10,.55)"/>
    <path d="M1000,0 H882 L966,318 L1000,352 Z" fill="rgba(4,6,10,.55)"/>
    <path d="M0,620 V486 Q260,446 500,456 Q740,446 1000,486 V620 Z" fill="#0a0d13"/>
    <path d="M0,486 Q260,446 500,456 Q740,446 1000,486" fill="none" stroke="rgba(255,210,62,.35)" stroke-width="3"/>
    <ellipse cx="322" cy="520" rx="128" ry="44" fill="#12161f"/>
    <circle cx="272" cy="518" r="27" fill="none" stroke="#ffd23e" stroke-width="4" opacity=".8"/>
    <circle cx="372" cy="518" r="27" fill="none" stroke="#7db8ff" stroke-width="4" opacity=".8"/>
    <circle cx="322" cy="580" r="96" fill="none" stroke="#05070a" stroke-width="30"/>
    <circle cx="322" cy="580" r="96" fill="none" stroke="rgba(255,210,62,.5)" stroke-width="3"/>
    <path d="M226,580 H418 M322,580 L322,664 M322,580 L252,516 M322,580 L392,516" stroke="#05070a" stroke-width="17"/>
    <circle cx="322" cy="580" r="27" fill="#141a24" stroke="rgba(255,210,62,.65)" stroke-width="3"/>
    <circle cx="322" cy="580" r="13" fill="#ffd23e"/>
    <circle cx="328" cy="576" r="11" fill="#141a24"/>
  </svg>
</div>

<!-- Touch controls -->
<div id="touchUI" class="hidden">
  <button class="tbtn" id="btnView">VIEW<span id="viewName">CHASE</span><small id="viewKeyHint">V</small></button>
  <button class="tbtn empty" id="btnNitro">NITRO<span id="nitroMeter"><span id="nitroFill" style="display:block"></span></span><small id="nitroKeyHint">SHIFT</small></button>
  <button class="tbtn" id="btnBrake">BRAKE</button>
</div>
<div id="stickDock" class="hidden">
  <div id="stickBase"><div id="stickKnob"><img src="lunc.png" alt=""></div></div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <img class="crescent" src="lunc.png" alt="Luna Classic crescent">
  <div class="logo">LUNA RACER <span class="d3">3D</span></div>
  <div id="menuTag"></div>
  <div id="menuHint"></div>
  <button class="bigbtn" id="playBtn"></button>
  <div class="rowbtns">
    <button class="smallbtn" id="howBtn"></button>
    <button class="smallbtn" id="boardBtn"></button>
  </div>
  <select id="langSel" aria-label="Language"></select>
  <div class="secStrip" id="secStrip"></div>
  <div id="loadBar"><div id="loadFill"></div></div>
</div>

<!-- HOW TO -->
<div id="howPanel" class="screen hidden">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="body" id="howBody"></div>
    <div class="center"><button class="smallbtn" id="howClose"></button></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="boardPanel" class="screen hidden">
  <div class="panel">
    <h2 id="boardTitle"></h2>
    <div class="tabs">
      <button class="tab on" id="tabAll"></button>
      <button class="tab" id="tabWeek"></button>
    </div>
    <div id="boardBody"></div>
    <div class="center"><button class="smallbtn" id="boardClose"></button></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pausePanel" class="screen hidden">
  <div class="panel" style="text-align:center">
    <h2 id="pauseTitle"></h2>
    <div class="center">
      <button class="bigbtn" id="resumeBtn"></button><br>
      <button class="smallbtn" id="quitBtn"></button>
    </div>
  </div>
</div>

<!-- RACE OVER -->
<div id="overPanel" class="screen hidden">
  <div id="overTitle"></div>
  <div id="overSub"></div>
  <div id="finalScoreLine"></div>
  <div id="finalDetail"></div>
  <div id="saveRow">
    <input id="nameInput" maxlength="14" autocomplete="off">
    <button class="bigbtn" id="submitBtn" style="font-size:17px;padding:10px 26px"></button>
  </div>
  <div id="savedLine"></div>
  <div class="rowbtns">
    <button class="bigbtn" id="againBtn"></button>
    <button class="smallbtn" id="menuBtn"></button>
    <button class="smallbtn" id="overBoardBtn"></button>
  </div>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>

<script>
/* ================= three setup ================= */
const container = $('game');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x101f42, 1); /* match the sky-dome top colour: a bare first frame is sky, never a flat blue pop */
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101f42); /* from the very first frame: no unlit-blue flash at race start */
scene.fog = new THREE.Fog(0x8a5f49, 190, 1500); /* warm dusk haze matching the sunset horizon (was 0x2a3350 — a dark BLUE that washed the whole distance blue) */
const camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, 0.1, 4200);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* gradient-cube environment reflections (Drift's proven trick) */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const ENV = (function makeEnv() {
  function face(stops, sunBlob) {
    const c = makeCanvas(64, 64), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 64);
    stops.forEach(s => g.addColorStop(s[0], s[1]));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    if (sunBlob) { x.fillStyle = 'rgba(255,240,205,0.95)'; x.fillRect(26, 10, 13, 13); }
    return c;
  }
  const side = [[0, '#7d9fd4'], [0.52, '#e8d9c0'], [0.72, '#8a7a5e'], [1, '#3d4636']];
  const t = new THREE.CubeTexture([
    face(side, true), face(side, false),
    face([[0, '#9db9e8'], [1, '#e8ecf5']], false),
    face([[0, '#4a5442'], [1, '#2b332a']], false),
    face(side, false), face(side, false)
  ]);
  t.needsUpdate = true;
  return t;
})();

/* lights — golden-hour Moon Pass */
scene.add(new THREE.HemisphereLight(0x9db9e8, 0x4a3b28, 0.68));
const sun = new THREE.DirectionalLight(0xffd9a0, 1.35);
sun.position.set(120, 180, -260);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x7d9fd4, 0.30);
fill.position.set(-90, 60, 120); scene.add(fill);

/* sky dome + moon + stars */
(function buildSky() {
  const geo = new THREE.SphereGeometry(2500, 24, 16); /* dome centred on the COURSE centre (10,0,1480), radius 2500: the old dome sat at the world origin with r=2600 while the course runs to z~3060 — over the last ~500 m the camera was OUTSIDE the dome and the sky gradient distorted/popped to dark navy (the recurring blue glitch). Centred here, the camera (max ~1600 m from centre) is always inside, and the far shell (<= ~4100 m) stays inside the 4200 far plane. */
  const cols = []; const pos = geo.attributes.position;
  const top = new THREE.Color(0x101f42), mid = new THREE.Color(0x53679c),
        hor = new THREE.Color(0xf2a56b), low = new THREE.Color(0x1c1830);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 2500;
    let c;
    if (y > 0.28) c = top.clone().lerp(mid, 1 - (y - 0.28) / 0.72);
    else if (y > 0.0) c = mid.clone().lerp(hor, 1 - y / 0.28);
    else c = hor.clone().lerp(low, Math.min(1, -y / 0.3));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.position.set(10, 0, 1480); /* course centre — see radius note above */
  sky.renderOrder = -10; scene.add(sky);
  /* stars */
  const n = 700, sp = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = 0.12 + Math.random() * 1.35, r = 2450;
    sp[i * 3] = Math.cos(a) * Math.cos(e) * r; sp[i * 3 + 1] = Math.sin(e) * r; sp[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r + 1400;
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 3.0, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85 })));
  /* crescent moon billboard */
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  const grd = x.createRadialGradient(128, 128, 30, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,244,200,0.55)'); grd.addColorStop(1, 'rgba(255,244,200,0)');
  x.fillStyle = grd; x.fillRect(0, 0, 256, 256);
  x.fillStyle = '#ffeeb8'; x.beginPath(); x.arc(118, 128, 74, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(158, 106, 66, 0, Math.PI * 2); x.fill();
  const mt = new THREE.CanvasTexture(c);
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: mt, fog: false, depthWrite: false, transparent: true }));
  moon.position.set(-950, 880, 3050); moon.scale.setScalar(620); scene.add(moon);
})();

/* ================= the Moon Pass course ================= */
const COURSE_PTS = [
  [0, 0, 0], [0, 0, 90], [6, 0, 190], [26, 1, 285], [70, 3, 375], [128, 6, 450], [185, 10, 505],
  [228, 16, 575], [248, 24, 660], [240, 33, 745], [205, 42, 815], [150, 50, 865],
  [95, 55, 900], [45, 52, 955], [15, 44, 1020], [-8, 34, 1095], [-20, 24, 1170],
  [-48, 16, 1245], [-95, 10, 1300], [-140, 7, 1330], [-178, 6, 1395], [-195, 6, 1470],
  [-180, 7, 1550], [-140, 9, 1615], [-85, 12, 1665], [-30, 16, 1700], [20, 21, 1760],
  [62, 27, 1835], [82, 33, 1915], [78, 39, 1995], [45, 44, 2055], [0, 47, 2090],
  [-48, 45, 2145], [-85, 40, 2210], [-100, 33, 2280], [-88, 26, 2350], [-45, 20, 2405],
  [0, 15, 2450], [38, 11, 2510], [55, 8, 2580], [48, 6, 2655], [15, 4, 2715],
  [-12, 2, 2790], [-8, 1, 2880], [0, 0, 2960], [0, 0, 3060]
];

    const tgt = champTargetSpeed();
    const dv = clamp(tgt - C.v, -32 * dt * 3, 24 * dt * 3) / 3;
    C.v += dv > 0 ? dv * launchRamp() : dv;
  }
  C.s += C.v * dt;
  const lineLat = clamp(-frameAt(C.s + 14).kappaS * 3000, -3.3, 3.3);
  const err = lineLat - C.lat;
  C.latV += (clamp(err * 2.2, -6, 6) - C.latV) * Math.min(1, dt * 5);
  if (!C.air) C.lat += C.latV * dt; else C.lat += C.latV * dt * 0.4;
  C.lat = clamp(C.lat, -(ROAD_HALF + 0.25), ROAD_HALF + 0.25); /* same solid rail as the player */
  stepAir(C, dt);
  C.steerVis += (clamp(-C.latV * 0.09, -1, 1) - C.steerVis) * Math.min(1, dt * 6);
  placeCar(champCar, C.s, C.lat, C.airY, -C.steerVis * 0.10, C.air ? clamp(C.vy * 0.012, -0.1, 0.14) : 0);
  spinWheels(champCar, C.v, dt, C.steerVis);
  C.nextMistake -= dt;
  if (C.nextMistake <= 0) { C.mistakeT = 1.6; C.nextMistake = 14 + Math.random() * 10; }
  if (C.mistakeT > 0) C.mistakeT -= dt;
  if (!C.finished && C.s >= FINISH_S) { C.finished = true; C.finishTime = raceTime; if (!P.finished) showBanner(T('pos2'), ''); }
}
/* QA autopilot: steers the racing line, brakes for the sharp stuff */
function autoLine(s) { return clamp(-frameAt(s + 20).kappaS * 3000, -3.4, 3.4); }
function autoSteer() {
  const err = autoLine(P.s) - P.lat;
  return clamp(-err * 0.30 - P.latV * 0.05, -1, 1);
}
function autoBrake() {
  let kMax = 0;
  for (let d = 10; d < 55; d += 6) kMax = Math.max(kMax, Math.abs(frameAt(P.s + d).kappaS));
  const corner = kMax > 0.004 ? Math.sqrt(259 / kMax) : 99;
  return P.v > corner + 2;
}

/* ================= camera views (owner, Nov 7 late) =================
   The VIEW button (or V / C key) cycles CHASE -> FAR -> HOOD -> COCKPIT.
   viewMode is deliberately NOT touched by resetRace: the chosen view
   survives the countdown and race restarts until the player changes it.
   CHASE keeps the exact framing the game shipped with. HOOD and
   COCKPIT are rigid (no lerp) so they stay glued to the car. */
const VIEW_NAMES = ['CHASE', 'FAR', 'HOOD', 'COCKPIT'];
let viewMode = 0;
function applyView() {
  $('viewName').textContent = VIEW_NAMES[viewMode];
  $('cockpitFrame').classList.toggle('hidden', !(viewMode === 3 && (state === 'race' || state === 'count')));
}
function cycleView() { viewMode = (viewMode + 1) % VIEW_NAMES.length; applyView(); }
function setView(i) { viewMode = ((i % VIEW_NAMES.length) + VIEW_NAMES.length) % VIEW_NAMES.length; applyView(); }

/* Nitrous flames: visible exactly while P.boosting (physics already
   turns boosting off on button release, empty tank and braking).
   Flicker is two beating sines; flame length grows with boost speed. */
let flameT = 0;
function updateNitroFlames(dt) {
  const on = !!P.boosting;
  nitroFlames.visible = on;
  if (!on) return;
  flameT += dt;
  const strength = 0.85 + 0.35 * Math.min(1, P.v / NITRO_TOP);
  for (const f of nitroFlameParts) {
    const fl = 0.88 + 0.16 * Math.sin(flameT * 43 + f.phase) + 0.10 * Math.sin(flameT * 97 + f.phase * 1.7);
    f.outer.scale.set(fl, fl, strength * fl);
    f.core.scale.set(fl, fl, strength * fl * 0.74);
    f.glow.material.opacity = 0.45 + 0.25 * (0.5 + 0.5 * Math.sin(flameT * 51 + f.phase));
  }
}

/* ================= camera ================= */
const camPos = new THREE.Vector3(0, 6, -14);
let menuAng = 0, qaBeauty = -1, qaCam = null;
function stepCamera(dt, t) {
  if (qaCam) {
    camera.position.set(qaCam[0], qaCam[1], qaCam[2]);
    camera.lookAt(qaCam[3], qaCam[4], qaCam[5]);
    return;
  }
  if (qaBeauty >= 0) {
    const isP = qaBeauty < 2;
    const cs = isP ? P.s : C.s, cl = isP ? P.lat : C.lat;
    const f = frameAt(cs);
    let cp;
    if (qaBeauty % 2 === 0) cp = surfPoint(f, cl, 1.7).addScaledVector(f.side, 3.1).addScaledVector(f.tan, -6.2);
    else cp = surfPoint(f, cl, 1.0).addScaledVector(f.side, 7.6);
    camera.position.copy(cp);
    camera.lookAt(surfPoint(f, cl, 0.55));
    sun.position.set(f.pos.x + 120, f.pos.y + 180, f.pos.z - 260);
    sun.target.position.copy(f.pos);
    return;
  }
  if (state === 'menu' || state === 'over') {
    menuAng += dt * 0.16;
    const f = frameAt(18);
    const cx = f.pos.x + Math.cos(menuAng) * 12.5, cz = f.pos.z + Math.sin(menuAng) * 12.5;
    camPos.lerp(new THREE.Vector3(cx, f.pos.y + 4.2, cz), 1 - Math.exp(-3 * dt));
    camera.position.copy(camPos);
    camera.lookAt(f.pos.x, f.pos.y + 1.0, f.pos.z);
    sun.position.set(f.pos.x + 120, f.pos.y + 180, f.pos.z - 260);
    sun.target.position.copy(f.pos);
    return;
  }
  const fr = frameAt(P.s);
  if (viewMode === 2) {
    /* HOOD: rigid on the nose of the car — the track fills the screen */
    camera.position.copy(surfPoint(fr, P.lat, 1.04 + P.airY).addScaledVector(fr.tan, 1.55));
    camera.lookAt(surfPoint(fr, P.lat * 0.92, 0.70 + P.airY * 0.6).addScaledVector(fr.tan, 26));
  } else if (viewMode === 3) {
    /* COCKPIT: rigid inside the cabin on the driver's side; the dash +
       wheel overlay (#cockpitFrame) frames the view */
    camera.position.copy(surfPoint(fr, P.lat - 0.34, 1.14 + P.airY).addScaledVector(fr.tan, 0.42));
    camera.lookAt(surfPoint(fr, P.lat * 0.92, 0.86 + P.airY * 0.6).addScaledVector(fr.tan, 26));
  } else {
    /* CHASE (viewMode 0, the shipped framing) and FAR CHASE (viewMode 1:
       higher, wider, further back — more of the course ahead) */
    const far = viewMode === 1;
    const back = surfPoint(fr, P.lat * 0.55, (far ? 6.4 : 3.4) + P.airY * 0.45).addScaledVector(fr.tan, far ? -17.5 : -10.8);
    camPos.lerp(back, 1 - Math.exp(-(far ? 5.5 : 6.5) * dt));
    camera.position.copy(camPos);
    const look = surfPoint(fr, P.lat * 0.8, (far ? 1.5 : 1.15) + P.airY * 0.5).addScaledVector(fr.tan, far ? 13 : 9);
    camera.lookAt(look);
  }
  sun.position.set(fr.pos.x + 120, fr.pos.y + 180, fr.pos.z - 260);
  sun.target.position.copy(fr.pos);
}

/* ================= HUD / banner ================= */
function fmtTime(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
function showBanner(main, sub, hold) {
  $('bannerMain').textContent = main || '';
  $('bannerSub').textContent = sub || '';
  $('bannerMain').classList.remove('fadeout'); $('bannerSub').classList.remove('fadeout');
  bannerT = hold || 1.6;
}
function updateHUD() {
  const ahead = P.s >= C.s;
  const posEl = $('hudPos');
  posEl.textContent = ahead ? T('pos1') : T('pos2');
  posEl.classList.toggle('first', ahead);
  const gap = Math.abs(P.s - C.s);
  $('hudGap').innerHTML = T('gapWord') + ' <b>' + (ahead ? '▲ ' : '▼ ') + Math.round(gap) + ' m</b>';
  $('hudCoins').textContent = coins;
  $('hudStars').textContent = stars;
  $('hudScore').textContent = score;
  $('hudSpeed').textContent = Math.round(P.v * 3.6);
  $('hudTime').textContent = fmtTime(raceTime);
  const nPct = Math.round(P.nitro);
  $('hudNitroFill').style.width = nPct + '%';
  $('hudNitroPct').textContent = nPct + '%';
  $('nitroFill').style.width = nPct + '%';
  nitroBtn.classList.toggle('empty', P.nitro <= 0);
  nitroBtn.classList.toggle('on', P.boosting);
  $('progYou').style.left = clamp(P.s / FINISH_S * 100, 0, 100) + '%';
  $('progChamp').style.left = clamp(C.s / FINISH_S * 100, 0, 100) + '%';
}
function checkPickups() {
  for (const pk of pickups) {
    if (pk.got) continue;
    const ds = pk.s - P.s;
    if (ds < -3 || ds > 3.2) continue;
    if (Math.abs(pk.lat - P.lat) > 1.7) continue;
    const carY = 0.9 + P.airY;
    if (Math.abs(pk.y - carY) > 1.9) continue;
    pk.got = true; pk.mesh.visible = false;
    if (pk.kind === 'coin') { coins++; score += 40; P.nitro = Math.min(100, P.nitro + NITRO_PER_COIN); sndCoin(); showBanner('', '🌙 +40 · ⚡+' + NITRO_PER_COIN + '%', 0.7); }
    else { stars++; score += 150; P.nitro = Math.min(100, P.nitro + NITRO_PER_STAR); sndStar(); showBanner('', '⭐ +150 · ⚡+' + NITRO_PER_STAR + '%', 0.7); }
  }
}

/* ================= flow ================= */
function showScreen(id) {
  ['menu', 'howPanel', 'boardPanel', 'pausePanel', 'overPanel'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  if (!id) ['menu', 'howPanel', 'boardPanel', 'pausePanel', 'overPanel'].forEach(x => $(x).classList.add('hidden'));
}
function startRace() {
  resetRace();
  clock.getDelta(); /* zero the clock: no stale delta leaks into the launch */
  showScreen(null);
  $('hud').classList.remove('hidden');
  $('touchUI').classList.remove('hidden');
  dock.classList.remove('hidden');
  state = 'count'; cdT = 0; cdStep = -1;
  $('cdWrap').classList.remove('hidden');
  applyView();
  updateHUD();
}
function pauseGame() {
  if (state !== 'race') return;
  state = 'paused'; showScreen('pausePanel');
}
function resumeGame() {
  if (state !== 'paused') return;
  showScreen(null); state = 'race';
}
function quitToMenu() {
  state = 'menu'; showScreen('menu');
  $('hud').classList.add('hidden'); $('touchUI').classList.add('hidden'); dock.classList.add('hidden');
  resetRace();
  applyView();
}
function liveScore() {
  return coins * 40 + stars * 150 + Math.floor(P.airTime) * 100;
}
function finishRace() {
  if (state === 'over') return;
  const won = !C.finished || P.finishTime <= C.finishTime;
  const posBonus = won ? 1500 : 800;
  const timeBonus = Math.max(0, Math.floor(170 - P.finishTime)) * 10;
  score = liveScore() + posBonus + timeBonus;
  score = Math.min(score, Math.floor(45 * Math.max(P.finishTime, 1) + 280));
  state = 'over';
  applyView();
  $('hud').classList.add('hidden'); $('touchUI').classList.add('hidden'); dock.classList.add('hidden');
  $('overTitle').textContent = won ? T('win') : T('lose');
  $('overTitle').classList.toggle('lose', !won);
  $('overSub').textContent = won ? T('winSub') : T('loseSub');
  $('finalScoreLine').textContent = T('score') + ': ' + score;
  $('finalDetail').innerHTML = T('timeWord') + ': ' + fmtTime(P.finishTime) + ' · 🌙 ' + coins + ' · ⭐ ' + stars + '<br>' + T('airWord') + ': ' + P.airTime.toFixed(1) + 's';
  try { const n = localStorage.getItem('lunaRacerName'); if (n) $('nameInput').value = n; } catch (e) {}
  showScreen('overPanel');
  if (won) sndWin(); else sndLose();
}

/* ================= leaderboard (shared luna-games router) ================= */
async function fetchBoard() {
  const r = await fetch(API, { method: 'GET' });
  if (!r.ok) throw new Error('board ' + r.status);
  return r.json();
}
async function renderBoard() {
  const el = $('boardBody');
  el.innerHTML = '<p>' + T('loading') + '</p>';
  try {
    const data = await fetchBoard();
    const rows = (boardMode === 'all' ? data.all : data.week) || [];
    if (!rows.length) { el.innerHTML = '<p>' + T('noScores') + '</p>'; return; }
    el.innerHTML = rows.slice(0, 10).map((r, i) =>
      '<div class="row"><span class="rk">' + (i + 1) + '.</span><span class="nm">' + String(r.name || '').replace(/[<>&"]/g, '') + '</span><span class="sc">' + r.score + '</span></div>').join('');
  } catch (e) { el.innerHTML = '<p>' + T('noScores') + '</p>'; }
}
async function submitScore() {
  if (submitted) return;
  const name = ($('nameInput').value || '').trim().slice(0, 14) || 'RACER';
  $('submitBtn').disabled = true;
  try {
    try { localStorage.setItem('lunaRacerName', name); } catch (e) {}
    const r = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: '', name, score, seconds: Math.max(5, Math.round(P.finishTime)) })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok !== false) {
      submitted = true;
      $('savedLine').textContent = T('saved') + (d.rank ? ' · ' + T('rank') + ' #' + d.rank : '');
    } else { $('savedLine').textContent = T('cantSave'); $('submitBtn').disabled = false; }
  } catch (e) { $('savedLine').textContent = T('cantSave'); $('submitBtn').disabled = false; }
}

/* buttons */
$('playBtn').addEventListener('click', startRace);
$('againBtn').addEventListener('click', startRace);
$('howBtn').addEventListener('click', () => showScreen('howPanel'));
$('howClose').addEventListener('click', () => { if (state === 'menu') showScreen('menu'); });
$('boardBtn').addEventListener('click', () => { showScreen('boardPanel'); renderBoard(); });
$('overBoardBtn').addEventListener('click', () => { showScreen('boardPanel'); renderBoard(); });
$('boardClose').addEventListener('click', () => showScreen(state === 'over' ? 'overPanel' : 'menu'));
$('tabAll').addEventListener('click', () => { boardMode = 'all'; $('tabAll').classList.add('on'); $('tabWeek').classList.remove('on'); renderBoard(); });
$('tabWeek').addEventListener('click', () => { boardMode = 'week'; $('tabWeek').classList.add('on'); $('tabAll').classList.remove('on'); renderBoard(); });
$('pauseBtn').addEventListener('click', () => { if (state === 'race') pauseGame(); });
$('resumeBtn').addEventListener('click', resumeGame);
$('quitBtn').addEventListener('click', quitToMenu);
$('menuBtn').addEventListener('click', quitToMenu);
$('submitBtn').addEventListener('click', submitScore);
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  try { localStorage.setItem('lunaRacerSound', soundOn ? '1' : '0'); } catch (e) {}
});
$('soundBtn').textContent = soundOn ? '🔊' : '🔇';

/* countdown */
function stepCountdown(dt) {
  cdT += dt;
  const step = Math.floor(cdT / 0.8);
  if (step !== cdStep && step <= 3) {
    cdStep = step;
    const el = $('cdText');
    if (step < 3) { el.textContent = String(3 - step); el.classList.remove('go'); beep(440, 0.12, 'square', 0.06); }
    else { el.textContent = T('go'); el.classList.add('go'); beep(880, 0.3, 'square', 0.07); }
  }
  if (cdT >= 3.4) { $('cdWrap').classList.add('hidden'); state = 'race'; clock.getDelta(); showBanner(T('ready'), '', 1.2); }
}

/* ================= main loop ================= */
const clock = new THREE.Clock();
let spinT = 0;
const _ry = new THREE.Quaternion(), _yAxis = new THREE.Vector3(0, 1, 0);
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;
  spinT += dt;
  for (const pk of pickups) {
    if (pk.got) continue;
    _ry.setFromAxisAngle(_yAxis, spinT * 2.4 + pk.phase);
    pk.mesh.quaternion.copy(pk.baseQ).multiply(_ry);
  }
  if (bannerT > 0) {
    bannerT -= dt;
    if (bannerT <= 0) { $('bannerMain').classList.add('fadeout'); $('bannerSub').classList.add('fadeout'); }
  }
  if (window.__holdSim === true) { /* QA time-warp holds the live loop */ }
  else if (state === 'count' || state === 'race') {
    /* Physics runs in fixed substeps of at most 1/60 s: a long or jittery
       frame (phone warmup at the start) can never become one big step. */
    let rem = dt;
    while (rem > 1e-6) {
      const h = Math.min(rem, 1 / 60);
      if (state === 'count') { stepCountdown(h); stepPlayer(h); stepChamp(h); }
      else if (state === 'race') { raceTime += h; stepPlayer(h); stepChamp(h); }
      else break;
      rem -= h;
    }
    if (state === 'race') {
      score = liveScore();
      checkPickups(); updateHUD();
      if (P.finished && C.finished) finishRace();
    }
  }
  else if (state === 'menu' || state === 'over') {
    placeCar(playerCar, P.s, P.lat, 0, 0, 0);
    placeCar(champCar, C.s, C.lat, 0, 0, 0);
  }
  updateNitroFlames(dt);
  stepCamera(dt, t);
  renderer.render(scene, camera);
}
applyLang();
resetRace();
applyView();
animate();

/* QA hook (used by automated verification only) */
if (QA) {
  window.__racer = {
    get state() { return state; },
    get loaded() { return modelsLoaded; },
    start: () => startRace(),
    beauty: n => { qaBeauty = n; },
    cam: a => { qaCam = a; },
    cycleView: () => cycleView(),
    setView: i => setView(i),
    get view() { return VIEW_NAMES[viewMode]; },
    warp(steps) {
      window.__holdSim = true;
      const dt = 1 / 30;
      for (let i = 0; i < steps; i++) {
        if (state === 'count') { stepCountdown(dt); stepPlayer(dt); stepChamp(dt); }
        else if (state === 'race') {
          raceTime += dt; stepPlayer(dt); stepChamp(dt);
          score = liveScore(); checkPickups();
          if (state === 'over') break;
        } else break;
      }
      updateHUD();
    },
    shot() {
      if (!qaCam && qaBeauty < 0 && viewMode === 0 && (state === 'race' || state === 'count')) {
        const fr = frameAt(P.s);
        const back = surfPoint(fr, P.lat * 0.55, 3.4 + P.airY * 0.45).addScaledVector(fr.tan, -10.8);
        camPos.copy(back); camera.position.copy(back);
        camera.lookAt(surfPoint(fr, P.lat * 0.8, 1.15 + P.airY * 0.5).addScaledVector(fr.tan, 9));
      } else stepCamera(0, 0);
      renderer.render(scene, camera);
      return renderer.domElement.toDataURL('image/png');
    },
    probe() {
      const big = [];
      scene.children.forEach(c => {
        if (c.geometry && c.geometry.attributes && c.geometry.attributes.position.count > 4000) {
          const p = c.geometry.attributes.position; let mn = 1e9, mx = -1e9;
          for (let i = 0; i < p.count; i++) { const y = p.getY(i); if (y < mn) mn = y; if (y > mx) mx = y; }
          big.push({ type: c.geometry.type, n: p.count, yMin: +mn.toFixed(1), yMax: +mx.toFixed(1), vis: c.visible });
        }
      });
      return { kids: scene.children.length, big, terrain05: +terrainH(0, 5).toFixed(1), frame10: frameAt(10).pos.toArray().map(v => +v.toFixed(1)), drawCalls: renderer.info.render.calls, tris: renderer.info.render.triangles };
    },
    snap() {
      return {
        state, t: +raceTime.toFixed(2),
        pS: +P.s.toFixed(1), pV: +P.v.toFixed(1), pLat: +P.lat.toFixed(2), airY: +P.airY.toFixed(2), airTime: +P.airTime.toFixed(2),
        cS: +C.s.toFixed(1), cV: +C.v.toFixed(1), gap: +(P.s - C.s).toFixed(1),
        coins, stars, score, pFin: P.finished, cFin: C.finished, trackLen: +TRACK_LEN.toFixed(0),
        nitro: +P.nitro.toFixed(1), boosting: P.boosting,
        view: VIEW_NAMES[viewMode], flames: nitroFlames.visible,
        flameLen: nitroFlameParts.length ? +nitroFlameParts[0].outer.scale.z.toFixed(2) : 0,
        camPos: camera.position.toArray().map(v => +v.toFixed(2))
      };
    }
  };
}
</script>
