<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Luna Pool 3D — Luna Classic Billiards</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; overflow:hidden; background:#04061a; height:100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff;
         -webkit-user-select:none; user-select:none; touch-action:none;
         display:flex; flex-direction:column; height:100dvh; }
  #cvwrap { position:relative; flex:1; min-height:0; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud {
    position:relative; flex:0 0 auto; margin:10px 10px 2px; z-index:5;
    background:linear-gradient(90deg, rgba(40,26,4,.88), rgba(6,44,54,.88)); border-radius:999px; padding:8px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    box-shadow:0 0 18px rgba(255,183,0,.22), 0 4px 18px rgba(0,0,0,.5);
    border:1.5px solid rgba(255,215,106,.4);
  }
  #hudShots { font-weight:900; font-size:13px; letter-spacing:.06em; color:#ffe9a8; white-space:nowrap; }
  #hudBalls { font-size:15px; letter-spacing:1px; white-space:nowrap; }
  #hudScore { font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; min-width:52px; text-align:right; }
  #muteBtn, #rstBtn { background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.35); color:#fff; border-radius:999px; width:34px; height:34px; font-size:16px; cursor:pointer; font-family:inherit; flex:0 0 auto; }
  #toast {
    position:absolute; top:13%; width:100%; text-align:center; font-size:25px; font-weight:900; letter-spacing:.05em;
    color:#ffd76a; text-shadow:0 0 18px rgba(255,183,0,.8), 0 2px 12px rgba(0,0,0,.7);
    opacity:0; transition:opacity .15s; pointer-events:none; z-index:4;
  }
  /* power rail — pull down, release to shoot */
  #powerRail {
    position:absolute; right:10px; bottom:12%; width:46px; height:44%; z-index:3;
    border-radius:999px; border:2px solid rgba(255,215,106,.55); background:rgba(5,8,24,.55);
    display:none; touch-action:none;
  }
  #powerFill { position:absolute; left:0; right:0; bottom:0; height:0%; border-radius:999px;
    background:linear-gradient(0deg,#39d353,#ffd76a 55%,#ff7847); pointer-events:none; }
  #powerLbl { position:absolute; width:100%; top:-24px; text-align:center; font-size:10px; font-weight:900;
    letter-spacing:.14em; color:#ffe9a8; text-shadow:0 1px 6px #000; pointer-events:none; }
  #aimHint {
    position:absolute; left:50%; transform:translateX(-50%); bottom:12px; z-index:3; pointer-events:none;
    font-size:12.5px; font-weight:700; letter-spacing:.04em; color:rgba(255,255,255,.85);
    background:rgba(4,8,24,.55); padding:6px 14px; border-radius:999px; display:none; white-space:nowrap;
  }
  .screen {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:22px; background:rgba(5,9,26,.62); pointer-events:auto; overflow-y:auto;
  }
  .screen h1 { margin:0; font-size:40px; letter-spacing:.1em; font-weight:900; color:#fff;
    text-shadow:0 0 8px #40e0d0, 0 0 26px #40e0d0, 0 0 44px #ffb700; }
  #startScreen h1 {
    font-size:46px; letter-spacing:.05em; text-shadow:none;
    background:linear-gradient(180deg,#fff3b0 5%,#ffe259 40%,#ffa751 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:2px rgba(80,40,5,.9);
    filter:drop-shadow(0 3px 0 rgba(80,40,5,.85)) drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }
  .screen h1 .gold { color:#ffe9a8; }
  .screen p { margin:0; font-size:15px; line-height:1.5; max-width:470px; opacity:.95; }
  .screen .small { font-size:12px; letter-spacing:.22em; opacity:.7; font-weight:700; }
  button.play {
    cursor:pointer; border:none; color:#fff; border-radius:14px; padding:14px 40px; margin-top:4px;
    font-size:18px; font-weight:900; letter-spacing:.07em; font-family:inherit;
    background:linear-gradient(180deg,#4ade3d,#22b41f); box-shadow:0 5px 0 #147a0c; text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  button.play:active { transform:translateY(3px); box-shadow:0 2px 0 #147a0c; }
  button.play.alt { background:linear-gradient(180deg,#8d99c9,#5a6699); box-shadow:0 5px 0 #39406b; font-size:15px; padding:12px 26px; }
  button.play.alt:active { box-shadow:0 2px 0 #39406b; }
  button.play:disabled { opacity:.55; }
  #overScreen, #boardScreen { display:none; }
  #boardScreen { background:rgba(3,7,20,.9); }
  #nameInput { width:min(300px, 82vw); padding:12px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(10,6,28,.85); color:#fff; font-size:16px; text-align:center; outline:none; font-family:inherit; pointer-events:auto; }
  #submitStatus, #shareStatus { min-height:18px; font-size:14px; margin:0; }
  #boardList { width:min(430px, 92vw); max-height:46vh; overflow-y:auto; text-align:left; font-size:15px; }
  #boardList .row { display:flex; justify-content:space-between; gap:10px; padding:7px 12px; border-bottom:1px solid rgba(255,255,255,.09); }
  #boardList .row .rk { opacity:.65; width:34px; flex:0 0 auto; }
  #boardList .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #boardList .row .sc { font-weight:900; color:#ffd76a; }
  .tabs { display:flex; gap:8px; }
  .badge { font-size:60px; filter:drop-shadow(0 6px 18px rgba(255,183,0,.35)); }
  .crescent { font-size:74px; line-height:1; filter:drop-shadow(0 0 22px rgba(255,183,0,.65)); }
  #langSel { margin-top:2px; background:rgba(6,24,44,.9); color:#fff; border:2px solid rgba(255,255,255,.4);
    border-radius:10px; font-size:15px; padding:8px 10px; max-width:86vw; font-family:inherit; }
  #secStrip { max-width:470px; font-size:12.5px; line-height:1.45; color:#bfefff; background:rgba(4,30,44,.72);
    border:1px solid rgba(64,224,208,.45); border-radius:12px; padding:9px 13px; }
  #loadScreen { background:#04061a; z-index:30; }
  #loadBarWrap { width:min(280px,70vw); height:10px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; }
  #loadBar { height:100%; width:12%; border-radius:999px; background:linear-gradient(90deg,#ffb700,#40e0d0); transition:width .3s; }
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta property="og:image" content="https://frg-fight-club.vercel.app/arcade/img/pool.webp"><meta name="twitter:image" content="https://frg-fight-club.vercel.app/arcade/img/pool.webp"></head>
<body>
<div id="hud">
  <div id="hudShots">SHOT 0/12</div>
  <div id="hudBalls">🎱×8</div>
  <div id="hudScore">0</div>
  <button id="rstBtn" title="Restart rack (R)">↩</button>
  <button id="muteBtn">🔊</button>
</div>
<div id="cvwrap">
  <canvas id="gl"></canvas>
  <div id="toast"></div>
  <div id="powerRail"><div id="powerLbl">POWER</div><div id="powerFill"></div></div>
  <div id="aimHint"></div>
</div>

<div class="screen" id="loadScreen">
  <div class="crescent">🌙</div>
  <h1>LUNA <span class="gold">POOL</span></h1>
  <div id="loadBarWrap"><div id="loadBar"></div></div>
  <p class="small" id="loadTxt">LOADING…</p>
</div>

<div class="screen" id="startScreen" style="display:none">
  <div class="small">LUNA CLASSIC · 3D BILLIARDS</div>
  <div class="crescent">🌙</div>
  <h1>LUNA <span class="gold">POOL</span></h1>
  <p id="howto"></p>
  <button class="play" id="startBtn">▶ <span data-k="break">BREAK</span></button>
  <button class="play alt" id="boardBtn">🏆 <span data-k="leaderboard">LEADERBOARD</span></button>
  <select id="langSel" aria-label="Language"></select>
  <div id="secStrip"></div>
</div>

<div class="screen" id="overScreen">
  <div class="small" id="overKicker">RACK OVER</div>
  <div class="badge" id="overBadge">🎱</div>
  <h1 id="overTitle">OUT OF SHOTS</h1>
  <p id="overStats"></p>
  <input id="nameInput" maxlength="16" placeholder="Your name — or just Guest">
  <button class="play" id="submitBtn">🏆 <span data-k="submit">SUBMIT SCORE</span></button>
  <p id="submitStatus"></p>
  <button class="play alt" id="shareBtn">📣 <span data-k="share">SHARE SCORE</span></button>
  <p id="shareStatus"></p>
  <button class="play alt" id="overBoardBtn">🏆 <span data-k="leaderboard">LEADERBOARD</span></button>
  <button class="play" id="againBtn">↩ <span data-k="again">PLAY AGAIN</span></button>
</div>

<div class="screen" id="boardScreen">
  <div class="small">🏆 LUNA POOL</div>
  <h1 data-k="leaderboard">LEADERBOARD</h1>
  <div class="tabs">
    <button id="tabAll" class="play" data-k="allTime">ALL-TIME</button>
    <button id="tabWeek" class="play alt" data-k="thisWeek">THIS WEEK</button>
  </div>
  <div id="boardList"><p style="text-align:center; opacity:.8">Loading…</p></div>
  <button id="boardClose" class="play alt">✕ <span data-k="close">CLOSE</span></button>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="game.js?v=pool3d2"></script>
</body>
</html>
