<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solitaire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --cw: min(12.6vw, 96px); --ch: calc(var(--cw) * 1.4); --gap: calc(var(--cw) * .16); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    min-height:100vh; color:#e8eaf6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(300px 300px at 90% -70px, rgba(255,214,106,.28), rgba(255,214,106,0) 70%),
      radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.8), rgba(255,255,255,0) 60%),
      radial-gradient(1.6px 1.6px at 32% 64%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      radial-gradient(2.2px 2.2px at 58% 14%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%),
      radial-gradient(1.5px 1.5px at 76% 48%, rgba(255,255,255,.5), rgba(255,255,255,0) 60%),
      radial-gradient(1.8px 1.8px at 88% 78%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%),
      radial-gradient(1.4px 1.4px at 44% 88%, rgba(255,255,255,.45), rgba(255,255,255,0) 60%),
      radial-gradient(130% 90% at 50% 0%, #232a5e 0%, #12173a 48%, #070a22 100%);
    -webkit-user-select:none; user-select:none; touch-action: manipulation; overflow-x:hidden;
  }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px 2px; max-width:1060px; margin:0 auto; flex-wrap:wrap;
  }
  header .title { font-weight:900; letter-spacing:.14em; font-size:17px; color:#ffd76a; text-shadow:0 2px 10px rgba(255,180,0,.35); }
  header .title small { display:block; letter-spacing:.08em; font-weight:700; font-size:10.5px; opacity:.75; }
  header .title { display:flex; align-items:center; gap:9px; }
  header .brandmark { width:30px; height:30px; flex:0 0 auto; display:block; }
  .stats { display:flex; gap:8px; font-size:13.5px; font-weight:800; }
  .stats span {
    background:linear-gradient(90deg,#2a2a72,#6a63e8); color:#fff; border-radius:999px;
    padding:6px 14px; box-shadow:0 3px 8px rgba(5,8,30,.55);
  }
  .stats b { color:#fff; font-variant-numeric: tabular-nums; }
  #stars { text-align:center; font-size:29px; letter-spacing:12px; padding:2px 0 4px 12px; }
  #stars span { color:#4a5490; opacity:.55; transition:all .3s; }
  #stars span.lit { color:#ffb400; opacity:1; text-shadow:0 2px 10px rgba(255,170,0,.75); }
  button.chunky {
    cursor:pointer; border:none; color:#fff; border-radius:14px; padding:13px 30px;
    font-size:16px; font-weight:900; letter-spacing:.07em; text-shadow:0 1px 2px rgba(0,0,0,.3);
    font-family:inherit;
  }
  button.chunky:active { transform:translateY(3px); }
  button.green { background:linear-gradient(180deg,#7a6cff,#4b3ed1); box-shadow:0 5px 0 #2c2390; }
  button.green:active { box-shadow:0 2px 0 #2c2390; }
  button.orange { background:linear-gradient(180deg,#8d99c9,#5a6699); box-shadow:0 5px 0 #39406b; }
  button.orange:active { box-shadow:0 2px 0 #39406b; }
  #actionbar {
    position:sticky; bottom:0; display:flex; justify-content:space-between; gap:10px;
    max-width:1060px; margin:0 auto; padding:10px 14px 16px;
  }
  .badge {
    position:absolute; left:50%; bottom:7px; transform:translateX(-50%); z-index:3;
    background:rgba(18,22,52,.9); color:#fff; font-size:13px; font-weight:800;
    padding:3px 13px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.35); pointer-events:none;
  }
  #board { max-width:1060px; margin:0 auto; padding:4px 10px 40px; }
  .row { display:flex; gap:var(--gap); }
  .row.top { margin-bottom:calc(var(--cw)*.3); }
  .slot {
    width:var(--cw); height:var(--ch); border-radius:calc(var(--cw)*.11); flex:0 0 auto; position:relative;
    border:2.5px dashed rgba(190,198,255,.4); background:rgba(120,130,255,.08);
  }
  .slot .ghost {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--cw)*.5); opacity:.55; color:#fff;
  }
  .slot.spacer { border:none; background:none; }
  .pile { position:relative; width:var(--cw); flex:0 0 auto; min-height:var(--ch); }
  .card {
    position:absolute; width:var(--cw); height:var(--ch); border-radius:calc(var(--cw)*.11);
    background:linear-gradient(170deg,#ffffff 55%,#e9e4ff); color:#33308f;
    box-shadow:0 3px 7px rgba(23,32,84,.35), inset 0 0 0 1px rgba(90,80,160,.16);
    font-family: system-ui, -apple-system, sans-serif; font-weight:900; cursor:pointer; touch-action:none;
  }
  .card.red { color:#e5324f; }
  .card .idx { position:absolute; top:3.5%; left:6.5%; text-align:center; line-height:1.02; }
  .card .idx .r { font-size:calc(var(--cw)*.22); display:block; }
  .card .idx .s { font-size:calc(var(--cw)*.19); display:block; }
  .card .idx.br { top:auto; left:auto; bottom:3.5%; right:6.5%; transform:rotate(180deg); }
  .card .pip {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .card .pip .big {
    font-size:calc(var(--cw)*.6); line-height:1;
    background:linear-gradient(180deg,#6a63e8,#2e2a72);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card.red .pip .big {
    background:linear-gradient(180deg,#ff7aa8,#e5324f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card .pip .suit { font-size:calc(var(--cw)*.3); line-height:1; margin-top:calc(var(--cw)*.04); }

  @keyframes dealIn { from { transform:translateY(-16px) scale(.96); opacity:0; } to { transform:none; opacity:1; } }
  .card.dealt { animation:dealIn .3s both; }
  #dragLayer { position:fixed; inset:0; pointer-events:none; z-index:50; }
  #dragLayer .card { cursor:grabbing; box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.08); }
  #win {
    position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(10,24,64,.86); text-align:center; padding:20px;
  }
  #win h1 { margin:0; font-size:42px; letter-spacing:.08em; color:#ffd76a; text-shadow:0 4px 26px rgba(255,180,0,.45); }
  #win p { margin:0; font-size:16px; color:#fff; }
  .fall { position:fixed; top:-40px; z-index:59; font-size:30px; animation:fall linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(110vh) rotate(340deg); } }
  footer { text-align:center; font-size:12px; color:#9aa3d0; font-weight:600; padding:0 12px 18px; }
  /* leaderboard */
  #nameInput { width:min(300px, 82vw); padding:12px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(10,6,28,.85); color:#fff; font-size:16px; text-align:center; outline:none; font-family:inherit; }
  #submitStatus { min-height:18px; font-size:14px; color:#fff; margin:0; }
  #boardScreen {
    position:fixed; inset:0; z-index:70; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(7,10,34,.92); text-align:center; padding:20px;
  }
  #boardScreen .tag { font-size:13px; letter-spacing:.28em; font-weight:800; color:#ffd76a; }
  #boardScreen h1 { margin:0; font-size:32px; letter-spacing:.08em; color:#fff; }
  #boardList { width:min(430px, 92vw); max-height:46vh; overflow-y:auto; text-align:left; font-size:15px; color:#fff; }
  #boardList .row { display:flex; justify-content:space-between; gap:10px; padding:7px 12px; border-bottom:1px solid rgba(255,255,255,.09); }
  #boardList .row .rk { opacity:.65; width:34px; flex:0 0 auto; }
  #boardList .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #boardList .row .sc { font-weight:900; color:#ffd76a; }
  .tabs { display:flex; gap:8px; }
</style>

<script>
'use strict';
/* ================= state ================= */
const SUITS = ['S','H','D','C'];
const SUIT_CHAR = { S:'♠', H:'♥', D:'♦', C:'♣' };
const RED = { H:1, D:1 };
const RANK_LABEL = { 1:'A', 11:'J', 12:'Q', 13:'K' };
const rankLabel = r => RANK_LABEL[r] || String(r);

let stock = [], waste = [], foundations = {}, tableau = [];
let score = 0, moves = 0, startedAt = null, elapsed = 0, timerId = null, won = false;
let history = [];

const $ = id => document.getElementById(id);
const topRow = $('topRow'), tabRow = $('tabRow'), dragLayer = $('dragLayer');

function snapshot(){
  history.push(JSON.stringify({ stock, waste, foundations, tableau, score, moves }));
  if (history.length > 300) history.shift();
}
function undo(){
  const s = history.pop();
  if (!s) return;
  const d = JSON.parse(s);
  stock = d.stock; waste = d.waste; foundations = d.foundations; tableau = d.tableau;
  score = d.score; moves = d.moves; won = false;
  render();
}
function newGame(){
  const deck = [];
  for (const s of SUITS) for (let r = 1; r <= 13; r++) deck.push({ s, r, up:false });
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  tableau = Array.from({ length:7 }, () => []);
  foundations = { S:[], H:[], D:[], C:[] };
  waste = []; stock = [];
  let k = 0;
  for (let col = 0; col < 7; col++)
    for (let n = 0; n <= col; n++){
      const c = deck[k++]; c.up = (n === col); tableau[col].push(c);
    }
  while (k < 52) stock.push(deck[k++]);
  score = 0; moves = 0; history = []; won = false;
  startedAt = null; elapsed = 0; stopTimer();
  $('win').style.display = 'none';
  render(true);
}
function startTimer(){
  if (timerId) return;
  startedAt = Date.now() - elapsed * 1000;
  timerId = setInterval(() => {
    elapsed = Math.floor((Date.now() - startedAt) / 1000);
    $('stTime').textContent = Math.floor(elapsed/60) + ':' + String(elapsed%60).padStart(2,'0');
  }, 500);
}
function stopTimer(){ clearInterval(timerId); timerId = null; }
function touch(){ moves++; if (!startedAt) startTimer(); }

/* ================= move engine ================= */
function pileOf(loc){
  if (loc.type === 'tableau') return tableau[loc.i];
  if (loc.type === 'foundation') return foundations[loc.suit];
  if (loc.type === 'waste') return waste;
  return stock;
}
function canFoundation(card){
  const f = foundations[card.s];
  return f.length === card.r - 1;
}
function canTableau(card, col){
  const t = tableau[col];
  if (!t.length) return card.r === 13;
  const top = t[t.length - 1];
  return top.up && (!!RED[top.s] !== !!RED[card.s]) && top.r === card.r + 1;
}
function flipTop(col){
  const t = tableau[col];
  if (t.length && !t[t.length - 1].up){ t[t.length - 1].up = true; score += 5; }
}
function doMove(fromLoc, fromIdx, toLoc){
  const from = pileOf(fromLoc);
  const moving = from.splice(fromIdx);
  const card = moving[0];
  if (toLoc.type === 'foundation'){
    foundations[card.s].push(...moving);
    score += (fromLoc.type === 'waste') ? 10 : 10;
  } else {
    tableau[toLoc.i].push(...moving);
    if (fromLoc.type === 'waste') score += 5;
    if (fromLoc.type === 'foundation') score -= 15;
  }
  if (fromLoc.type === 'tableau') flipTop(fromLoc.i);
  if (score < 0) score = 0;
  touch(); render(); checkWin();
}
function movableFrom(loc, idx){
  if (loc.type === 'waste') return idx === waste.length - 1 && waste.length > 0;
  if (loc.type === 'foundation'){ const f = pileOf(loc); return idx === f.length - 1 && f.length > 0; }
  if (loc.type === 'tableau'){
    const t = tableau[loc.i];
    if (idx < 0 || idx >= t.length || !t[idx].up) return false;
    for (let i = idx; i < t.length - 1; i++){
      const a = t[i], b = t[i + 1];
      if (!(!!RED[a.s] !== !!RED[b.s] && a.r === b.r + 1)) return false;
    }
    return true;
  }
  return false;
}
function tryMove(fromLoc, idx, toLoc){
  if (!movableFrom(fromLoc, idx)) return false;
  const from = pileOf(fromLoc);
  const card = from[idx];
  const count = from.length - idx;
  if (toLoc.type === 'foundation'){
    if (count !== 1 || !canFoundation(card)) return false;
  } else if (toLoc.type === 'tableau'){
    if (fromLoc.type === 'tableau' && fromLoc.i === toLoc.i) return false;
    if (!canTableau(card, toLoc.i)) return false;
  } else return false;
  snapshot(); doMove(fromLoc, idx, toLoc);
  return true;
}
function drawStock(){
  snapshot();
  if (stock.length){
    const c = stock.pop(); c.up = true; waste.push(c); touch();
  } else if (waste.length){
    while (waste.length){ const c = waste.pop(); c.up = false; stock.push(c); }
    score = Math.max(0, score - 20); touch();
  }
  render();
}
function autoMove(loc, idx){
  if (!movableFrom(loc, idx)) return;
  const from = pileOf(loc);
  const card = from[idx];
  const count = from.length - idx;
  if (count === 1 && tryMove(loc, idx, { type:'foundation' })) return;
  for (let col = 0; col < 7; col++){
    if (loc.type === 'tableau' && loc.i === col) continue;
    if (tryMove(loc, idx, { type:'tableau', i:col })) return;
  }
  if (count === 1) tryMove(loc, idx, { type:'foundation' });
}
function checkWin(){
  const n = SUITS.reduce((a, s) => a + foundations[s].length, 0);
  if (n !== 52 || won) return;
  won = true; stopTimer();
  $('submitBtn').disabled = false;
  $('submitStatus').textContent = '';
  $('winStats').textContent = `Score ${score} · ${moves} moves · ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}`;
  $('win').style.display = 'flex';
  const glyphs = ['♠','♥','♦','♣','🌙'];
  for (let i = 0; i < 26; i++){
    const el = document.createElement('div');
    el.className = 'fall'; el.textContent = glyphs[i % glyphs.length];
    el.style.left = Math.random() * 96 + 'vw';
    el.style.color = ['#ffd76a','#ff5b6a','#7df4ff','#ffffff'][i % 4];
    el.style.animationDuration = (2.2 + Math.random() * 2.4) + 's';
    el.style.animationDelay = (Math.random() * .9) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

/* ================= render ================= */
function cardEl(card, loc, idx, dealt){
  const el = document.createElement('div');
  el.className = 'card' + (card.up ? (RED[card.s] ? ' red' : '') : ' back') + (dealt ? ' dealt' : '');
  el.dataset.loc = JSON.stringify(loc);
  el.dataset.idx = idx;
  if (card.up){
    el.innerHTML =
      `<div class="idx"><span class="r">${rankLabel(card.r)}</span><span class="s">${SUIT_CHAR[card.s]}</span></div>` +
      `<div class="pip"><span class="big">${rankLabel(card.r)}</span><span class="suit">${SUIT_CHAR[card.s]}</span></div>` +
      `<div class="idx br"><span class="r">${rankLabel(card.r)}</span><span class="s">${SUIT_CHAR[card.s]}</span></div>`;
  }
  return el;
}
function slotEl(ghost, loc){
  const el = document.createElement('div');
  el.className = 'slot' + (ghost === null ? ' spacer' : '');
  if (ghost !== null) el.innerHTML = `<div class="ghost">${ghost}</div>`;
  if (loc) el.dataset.target = JSON.stringify(loc);
  return el;
}
function render(dealt){
  topRow.innerHTML = ''; tabRow.innerHTML = '';
  /* stock */
  const stockPile = document.createElement('div'); stockPile.className = 'pile';
  if (stock.length){
    const c = cardEl(stock[stock.length - 1], { type:'stock' }, stock.length - 1, false);
    c.style.left = '0'; c.style.top = '0';
    stockPile.appendChild(c);
    const badge = document.createElement('div');
    badge.className = 'badge'; badge.textContent = stock.length;
    stockPile.appendChild(badge);
  } else {
    const s = slotEl('↻', { type:'stock' }); stockPile.appendChild(s);
  }
  topRow.appendChild(stockPile);
  /* waste */
  const wastePile = document.createElement('div'); wastePile.className = 'pile';
  if (waste.length){
    const c = cardEl(waste[waste.length - 1], { type:'waste' }, waste.length - 1, dealt);
    c.style.left = '0'; c.style.top = '0';
    wastePile.appendChild(c);
  } else wastePile.appendChild(slotEl(''));
  topRow.appendChild(wastePile);
  topRow.appendChild(slotEl(null));
  /* foundations */
  for (const s of SUITS){
    const p = document.createElement('div'); p.className = 'pile';
    const f = foundations[s];
    if (f.length){
      const c = cardEl(f[f.length - 1], { type:'foundation', suit:s }, f.length - 1, dealt);
      c.style.left = '0'; c.style.top = '0';
      p.appendChild(c);
    } else {
      const sl = slotEl(SUIT_CHAR[s], { type:'foundation', suit:s });
      if (RED[s]) sl.querySelector('.ghost').style.color = '#ff8f96';
      p.appendChild(sl);
    }
    topRow.appendChild(p);
  }
  /* tableau */
  const cwPx = Math.min(innerWidth * .126, 96);
  const offDown = 9, offUp = Math.max(22, cwPx * .34);
  tableau.forEach((pile, col) => {
    const p = document.createElement('div'); p.className = 'pile';
    if (!pile.length){
      p.appendChild(slotEl('', { type:'tableau', i:col }));
    }
    let y = 0;
    pile.forEach((card, idx) => {
      const c = cardEl(card, { type:'tableau', i:col }, idx, dealt);
      c.style.left = '0'; c.style.top = y + 'px';
      c.style.animationDelay = (idx * 30 + col * 40) + 'ms';
      p.appendChild(c);
      y += card.up ? offUp : offDown;
    });
    p.style.height = (pile.length ? y - (pile[pile.length-1].up ? offUp : offDown) + cwPx * 1.4 : cwPx * 1.4) + 'px';
    tabRow.appendChild(p);
  });
  $('stScore').textContent = score;
  $('stMoves').textContent = moves;
  const home = SUITS.reduce((a, s) => a + foundations[s].length, 0);
  const lit = (home >= 13 ? 1 : 0) + (home >= 26 ? 1 : 0) + (home >= 39 ? 1 : 0);
  document.querySelectorAll('#stars span').forEach((sp, i) => sp.classList.toggle('lit', i < lit));
}

/* ================= pointer: tap = auto-move, drag = move ================= */
let pending = null, lastTap = { key:'', t:0 };
function locKey(loc, idx){ return JSON.stringify(loc) + ':' + idx; }

document.addEventListener('pointerdown', e => {
  const cardNode = e.target.closest ? e.target.closest('.card') : null;
  const slotNode = !cardNode && e.target.closest ? e.target.closest('.slot') : null;
  if (slotNode && slotNode.dataset.target){
    const t = JSON.parse(slotNode.dataset.target);
    if (t.type === 'stock'){ drawStock(); }
    return;
  }
  if (!cardNode || cardNode.closest('#dragLayer')) return;
  const loc = JSON.parse(cardNode.dataset.loc);
  const idx = +cardNode.dataset.idx;
  if (loc.type === 'stock'){ drawStock(); return; }
  if (!movableFrom(loc, idx)) return;
  const pileEl = cardNode.parentElement;
  const stackEls = [...pileEl.querySelectorAll('.card')].filter(n => +n.dataset.idx >= idx);
  const rects = stackEls.map(n => n.getBoundingClientRect());
  pending = { loc, idx, x0:e.clientX, y0:e.clientY, dragging:false, stackEls, rects, grabDX:0, grabDY:0 };
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!pending) return;
  const dx = e.clientX - pending.x0, dy = e.clientY - pending.y0;
  if (!pending.dragging && Math.hypot(dx, dy) > 7){
    pending.dragging = true;
    pending.grabDX = pending.x0 - pending.rects[0].left;
    pending.grabDY = pending.y0 - pending.rects[0].top;
    pending.stackEls.forEach((n, i) => {
      const clone = n.cloneNode(true);
      clone.style.position = 'fixed';
      clone.style.left = pending.rects[i].left + 'px';
      clone.style.top = pending.rects[i].top + 'px';
      clone.style.margin = '0'; clone.style.animation = 'none';
      clone.dataset.clone = i;
      dragLayer.appendChild(clone);
      n.style.visibility = 'hidden';
    });
  }
  if (pending.dragging){
    const clones = dragLayer.children;
    for (let i = 0; i < clones.length; i++){
      clones[i].style.left = (e.clientX - pending.grabDX + (pending.rects[i].left - pending.rects[0].left)) + 'px';
      clones[i].style.top = (e.clientY - pending.grabDY + (pending.rects[i].top - pending.rects[0].top)) + 'px';
    }
  }
});
document.addEventListener('pointerup', e => {
  if (!pending) return;
  const p = pending; pending = null;
  dragLayer.innerHTML = '';
  p.stackEls.forEach(n => n.style.visibility = '');
  if (!p.dragging){
    const key = locKey(p.loc, p.idx);
    const now = Date.now();
    const dbl = (lastTap.key === key && now - lastTap.t < 400);
    lastTap = { key, t: now };
    if (dbl){
      /* double-tap: foundation first, hard */
      const from = pileOf(p.loc);
      if (from.length - p.idx === 1 && !tryMove(p.loc, p.idx, { type:'foundation' })) autoMove(p.loc, p.idx);
    } else autoMove(p.loc, p.idx);
    return;
  }
  /* drop: foundations (single card), then tableau columns */
  const x = e.clientX, y = e.clientY;
  const from = pileOf(p.loc);
  const single = from.length - p.idx === 1;
  const targets = [];
  topRow.querySelectorAll('.pile').forEach((el, i) => {
    if (i >= 3) targets.push({ loc:{ type:'foundation', suit:SUITS[i - 3] }, rect:el.getBoundingClientRect() });
  });
  tabRow.querySelectorAll('.pile').forEach((el, i) => {
    targets.push({ loc:{ type:'tableau', i }, rect:el.getBoundingClientRect() });
  });
  let done = false;
  if (single){
    for (const t of targets){
      if (t.loc.type !== 'foundation') continue;
      if (x >= t.rect.left - 8 && x <= t.rect.right + 8 && y >= t.rect.top - 8 && y <= t.rect.bottom + 8){
        done = tryMove(p.loc, p.idx, t.loc); if (done) break;
      }
    }
  }
  if (!done){
    /* nearest tableau column by x, generous y */
    let bestT = null, bestD = 1e9;
    for (const t of targets){
      if (t.loc.type !== 'tableau') continue;
      const cx = (t.rect.left + t.rect.right) / 2;
      const d = Math.abs(x - cx);
      if (x >= t.rect.left - 14 && x <= t.rect.right + 14 && y >= t.rect.top - 16 && y <= t.rect.bottom + 60 && d < bestD){
        bestD = d; bestT = t;
      }
    }
    if (bestT) done = tryMove(p.loc, p.idx, bestT.loc);
  }
  if (!done) render();
});
document.addEventListener('pointercancel', () => {
  if (!pending) return;
  pending.stackEls.forEach(n => n.style.visibility = '');
  pending = null; dragLayer.innerHTML = ''; render();
});

$('undoBtn').addEventListener('click', undo);
$('newBtn').addEventListener('click', newGame);
$('againBtn').addEventListener('click', newGame);
addEventListener('resize', () => render());

newGame();
</script>
<script>
/* ================= leaderboard (SOLITAIRE) ================= */
const TG_SOL = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let solInitData = '';
try { if (TG_SOL){ TG_SOL.ready(); TG_SOL.expand(); solInitData = TG_SOL.initData || ''; } } catch (e) {}
const solNameInput = document.getElementById('nameInput');
try {
  const tgUser = TG_SOL && TG_SOL.initDataUnsafe ? TG_SOL.initDataUnsafe.user : null;
  solNameInput.value = (tgUser && tgUser.first_name) || localStorage.getItem('solName') || 'Guest';
} catch (e) {}
let solBoardCache = null, solBoardTab = 'all';
function solRenderBoard(){
  const list = document.getElementById('boardList');
  const rows = (solBoardCache && solBoardCache[solBoardTab]) || [];
  document.getElementById('tabAll').className = solBoardTab === 'all' ? 'chunky green' : 'chunky orange';
  document.getElementById('tabWeek').className = solBoardTab === 'week' ? 'chunky green' : 'chunky orange';
  if (!rows.length){ list.innerHTML = '<p style="text-align:center; opacity:.8">No scores yet — be the first 🏆</p>'; return; }
  list.innerHTML = rows.map((r, i) =>
    `<div class="row"><span class="rk">${i+1}.</span><span class="nm"></span><span class="sc">${r.score}</span></div>`).join('');
  [...list.querySelectorAll('.nm')].forEach((el, i) => el.textContent = rows[i].name);
}
async function solOpenBoard(){
  document.getElementById('boardScreen').style.display = 'flex';
  document.getElementById('boardList').innerHTML = '<p style="text-align:center; opacity:.8">Loading…</p>';
  try {
    const r = await fetch('/api/solitaire-board');
    if (!r.ok) throw new Error(r.status);
    solBoardCache = await r.json();
  } catch (e) {
    solBoardCache = null;
    document.getElementById('boardList').innerHTML = '<p style="text-align:center; opacity:.8">Leaderboard unavailable right now.</p>';
    return;
  }
  solRenderBoard();
}
document.getElementById('boardBtn').addEventListener('click', solOpenBoard);
document.getElementById('winBoardBtn').addEventListener('click', solOpenBoard);
document.getElementById('boardClose').addEventListener('click', () => document.getElementById('boardScreen').style.display = 'none');
document.getElementById('tabAll').addEventListener('click', () => { solBoardTab = 'all'; solRenderBoard(); });
document.getElementById('tabWeek').addEventListener('click', () => { solBoardTab = 'week'; solRenderBoard(); });
document.getElementById('submitBtn').addEventListener('click', async () => {
  if (!won) return;
  let name = solNameInput.value.trim();
  if (name.length < 2) { name = 'Guest'; solNameInput.value = name; }
  try { localStorage.setItem('solName', name); } catch (e) {}
  const btn = document.getElementById('submitBtn'), status = document.getElementById('submitStatus');
  btn.disabled = true; status.textContent = 'Submitting…';
  try {
    const r = await fetch('/api/solitaire-score', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: solInitData, name, score: Math.floor(score), seconds: Math.floor(elapsed) })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.status);
    status.textContent = d.rank ? `🏆 You're #${d.rank} all-time!` : '🏆 Score submitted!';
    solBoardTab = 'all';
    setTimeout(solOpenBoard, 650);
  } catch (e) {
    status.textContent = 'Could not submit (' + e.message + ') — try again.';
    btn.disabled = false;
  }
});
</script>
