<title>Barrel Tower — Luna Classic 3D Barrel Climber</title>
<meta name="description" content="Barrel Tower — an original 3D arcade climber from LUNC Dev Studio. Dodge the great ape's rolling barrels, climb the girder tower, grab LUNC crescents and USTC stars.">
<meta name="theme-color" content="#0a1026">

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0a1026;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;height:100dvh}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none !important}

  /* ---------- Loading ---------- */
  #loader{position:fixed;inset:0;z-index:60;background:#0a1026;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #loader img{width:96px;height:96px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
  #loadTxt{font-weight:800;letter-spacing:2px;color:#ffe9a8}

  /* ---------- HUD (concept shape: SCORE | crescent count | LIVES) ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hudBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;align-items:stretch;gap:6px;background:linear-gradient(180deg,rgba(38,64,110,.88),rgba(16,30,58,.88));border:2px solid rgba(140,180,240,.5);border-radius:18px;padding:6px 10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
  .hudCell{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .hudCell.mid{flex:1;align-items:center}
  .hudCell.right{align-items:flex-end}
  .hudLbl{font-size:10px;font-weight:900;letter-spacing:2px;color:#bcd6ff}
  .hudVal{display:flex;align-items:center;gap:5px;font-size:19px;font-weight:900;color:#ffd94d;line-height:1.1}
  .hudVal img{width:19px;height:19px}
  .hudVal.cres{color:#fff;font-size:21px}
  .hudVal.cres .cresIco{color:#ffcf3d;font-size:20px;text-shadow:0 0 8px rgba(255,207,61,.8)}
  #hearts{font-size:15px;letter-spacing:1px;color:#ff5d7a;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #hudLvl{font-size:11px;font-weight:900;color:#9fd8ff;letter-spacing:1px}
  #hudBtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:8px;display:flex;gap:6px}
  .iconbtn{pointer-events:auto;background:rgba(10,22,44,.78);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{transform:scale(.93)}
  #banner{position:absolute;top:24%;left:0;right:0;text-align:center;pointer-events:none}
  #bannerMain{font-size:clamp(30px,8.5vw,56px);font-weight:900;color:#ffcf3d;text-shadow:0 3px 0 #b97e0a,0 6px 18px rgba(0,0,0,.55),0 0 26px rgba(255,185,46,.5);letter-spacing:1px}
  #bannerSub{font-size:clamp(15px,4.2vw,24px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);margin-top:4px}
  #bannerMain.fadeout,#bannerSub.fadeout{transition:opacity .3s;opacity:0 !important}
  #popups{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:21px;color:#ffe9a8;text-shadow:0 2px 0 #7a4d00,0 3px 8px rgba(0,0,0,.85),0 0 14px rgba(255,185,46,.45);animation:poprise 1s ease-out forwards;white-space:nowrap}
  @keyframes poprise{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-44px}}

  /* ---------- Touch controls (concept: big round gold buttons) ---------- */
  #touchUI{position:fixed;inset:auto 0 0 0;z-index:6;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-end;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .goldbtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:3px solid #ffe9a8;background:radial-gradient(circle at 38% 30%,#ffe98a,#f5a623 68%,#c77f1a);color:#4a2c00;font-size:15px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);letter-spacing:.5px}
  .goldbtn .arr{font-size:30px;line-height:.9}
  .goldbtn:active{transform:scale(.92)}
  @media (pointer:fine){ #touchUI{opacity:.6} }

  /* ---------- Floating joystick (house style: gold crescent knob) ---------- */
  #stickDock{position:fixed;left:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:118px;height:118px;z-index:7;pointer-events:none}
  #stickBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,203,61,.75);background:radial-gradient(circle at 50% 42%,rgba(120,84,10,.34),rgba(10,22,44,.45));box-shadow:0 4px 18px rgba(0,0,0,.4),inset 0 0 22px rgba(255,203,61,.22);opacity:.62}
  #stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;will-change:transform;border-radius:50%;border:3px solid rgba(255,203,61,.95);background:radial-gradient(circle at 38% 32%,#ffe9a8,#f5a623 72%,#b97e0a);box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  #stickKnob img{width:30px;height:30px;pointer-events:none}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at 50% 30%,rgba(24,40,90,.5),rgba(4,8,24,.9));padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;overflow-y:auto}
  #menuHero{width:min(88vw,340px);border-radius:18px;border:3px solid rgba(255,203,61,.75);box-shadow:0 12px 34px rgba(0,0,0,.6);margin-top:8px}
  .logo{font-size:clamp(36px,10.5vw,58px);font-weight:900;line-height:.98;color:#ffcf3d;text-shadow:0 4px 0 #b97e0a,0 8px 24px rgba(0,0,0,.6);letter-spacing:1px;margin-top:10px}
  .logoSub{letter-spacing:7px;font-weight:800;color:#cdd6ff;font-size:clamp(11px,3.2vw,15px);margin-top:5px}
  #menuTag{font-size:clamp(14px,4vw,18px);font-weight:600;color:#d8ecff;margin:10px 0 14px;max-width:520px}
  .bigbtn{pointer-events:auto;background:linear-gradient(180deg,#ffd94d,#f5a623);border:none;border-bottom:5px solid #b97e0a;color:#3a2400;font-size:clamp(19px,5.4vw,25px);font-weight:900;padding:13px 42px;border-radius:999px;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 20px rgba(0,0,0,.45);margin:5px}
  .bigbtn:active{transform:translateY(3px);border-bottom-width:2px}
  .smallbtn{pointer-events:auto;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:15px;font-weight:800;padding:9px 22px;border-radius:999px;cursor:pointer;margin:5px}
  .smallbtn:active{transform:scale(.95)}
  .rowbtns{display:flex;flex-wrap:wrap;justify-content:center}
  #langSel{margin-top:14px;background:rgba(6,24,44,.85);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:10px;font-size:16px;padding:9px 12px;max-width:88vw}
  .secStrip{margin-top:16px;max-width:520px;background:rgba(20,80,50,.3);border:1.5px solid #2f9e63;color:#c9f5da;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.5;font-weight:600}
  .builtBy{margin-top:12px;color:#8b96c9;font-size:12.5px;font-weight:700;letter-spacing:.5px}
  .panel{background:rgba(6,20,44,.94);border:2px solid rgba(255,203,61,.6);border-radius:18px;padding:18px 20px;max-width:min(92vw,480px);max-height:84vh;overflow:auto;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5);margin:auto}
  .panel h2{color:#ffcf3d;font-size:22px;margin-bottom:10px;text-align:center}
  .panel .body{font-size:15px;line-height:1.55;color:#e6f2ff}
  .panel .center{text-align:center;margin-top:14px}
  table.board{width:100%;border-collapse:collapse;font-size:15px}
  table.board td,table.board th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.14)}
  table.board td.nm{font-weight:700;color:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.board td.sc{text-align:right;font-weight:800;color:#ffe9a8}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
  .tab{pointer-events:auto;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);color:#cfe8ff;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}
  .tab.on{background:#ffcf3d;color:#3a2400;border-color:#ffcf3d}
  #overTitle{font-size:clamp(32px,9vw,52px);font-weight:900;color:#ff5d7a;text-shadow:0 3px 0 #8f1d33,0 6px 18px rgba(0,0,0,.5);margin-top:9vh}
  #finalScoreLine{font-size:clamp(20px,6vw,30px);font-weight:900;color:#ffe9a8;margin:8px 0 2px}
  #finalDetail{color:#cfe8ff;font-weight:600;margin-bottom:12px}
  #saveRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  #nameInput{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);border-radius:999px;color:#fff;font-size:16px;font-weight:700;padding:10px 16px;width:170px;text-align:center;outline:none}
  #nameInput::placeholder{color:rgba(255,255,255,.55)}
  #savedLine{color:#7dff9a;font-weight:800;min-height:22px;margin-top:6px}
  #loadErr{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:#0a1026;color:#ffd7d7;font-size:16px;padding:24px;text-align:center}
</style>
<meta property="og:image" content="https://frg-fight-club.vercel.app/barrel-tower/lunc.png"></head>
<body>
<div id="game"></div>

<div id="loader"><img src="lunc.png" alt="Luna Classic"><div id="loadTxt">BARREL TOWER</div></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hudBar">
    <div class="hudCell"><div class="hudLbl" id="hudScoreLbl">SCORE</div><div class="hudVal"><img src="lunc.png" alt=""><span id="hudScore">0</span></div></div>
    <div class="hudCell mid"><div class="hudVal cres"><span class="cresIco">&#9790;</span><span id="hudCres">0</span></div><div id="hudLvl">LEVEL 1</div></div>
    <div class="hudCell right"><div class="hudLbl" id="hudLivesLbl">LIVES</div><div id="hearts">&#10084;&#10084;&#10084;</div></div>
  </div>
  <div id="hudBtns">
    <button class="iconbtn" id="muteBtn" aria-label="Sound">&#128266;</button>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause">&#10073;&#10073;</button>
  </div>
  <div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>
  <div id="popups"></div>
</div>

<!-- Touch controls -->
<div id="touchUI" class="hidden">
  <button class="goldbtn" id="btnJump"><span class="arr">&#8599;</span><span id="jumpLbl">JUMP</span></button>
</div>
<div id="stickDock" class="hidden">
  <div id="stickBase"><div id="stickKnob"><img src="lunc.png" alt=""></div></div>
</div>

<!-- MENU -->
<div id="menu" class="screen hidden">
  <img id="menuHero" src="keyart.webp" alt="Barrel Tower — the great ape atop the Luna Classic tower">
  <div class="logo">BARREL TOWER</div>
  <div class="logoSub">LUNA CLASSIC</div>
  <div id="menuTag"></div>
  <button class="bigbtn" id="playBtn"></button>
  <div class="rowbtns">
    <button class="smallbtn" id="howBtn"></button>
    <button class="smallbtn" id="boardBtn"></button>
  </div>
  <select id="langSel" aria-label="Language"></select>
  <div class="secStrip" id="secStrip"></div>
  <div class="builtBy">LUNC DEV STUDIO</div>
</div>

<!-- HOW TO -->
<div id="howPanel" class="screen hidden">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="body" id="howBody"></div>
    <div class="center"><button class="smallbtn" id="howClose"></button></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="boardPanel" class="screen hidden">
  <div class="panel">
    <h2 id="boardTitle"></h2>
    <div class="tabs">
      <button class="tab on" id="tabAll"></button>
      <button class="tab" id="tabWeek"></button>
    </div>
    <div id="boardBody"></div>
    <div class="center"><button class="smallbtn" id="boardClose"></button></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pausePanel" class="screen hidden">
  <div class="panel" style="text-align:center">
    <h2 id="pauseTitle"></h2>
    <div class="center">
      <button class="bigbtn" id="resumeBtn"></button><br>
      <button class="smallbtn" id="quitBtn"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="overPanel" class="screen hidden">
  <div id="overTitle"></div>
  <div id="finalScoreLine"></div>
  <div id="finalDetail"></div>
  <div id="saveRow">
    <input id="nameInput" maxlength="14" autocomplete="off">
    <button class="bigbtn" id="submitBtn" style="font-size:17px;padding:10px 26px"></button>
  </div>
  <div id="savedLine"></div>
  <div class="rowbtns">
    <button class="bigbtn" id="againBtn"></button>
    <button class="smallbtn" id="menuBtn"></button>
  </div>
</div>
</body>

ick (in basso a sinistra): spingi ◀ ▶</b> per correre sulle piattaforme.<br><b>Spingi in su vicino a una scala</b> per salire · <b>in giù</b> per scendere.<br><b>Pulsante SALTA</b> (o spingi il joystick in su a terra) per saltare i barili — saltarne uno vale <b>+100</b>!<br>Desktop: frecce o WASD + spazio.<br>Raccogli <b>mezzelune LUNC</b> dorate (+50) e <b>stelle USTC</b> blu (+250).<br>Raggiungi la piattaforma in alto accanto alla scimmia per superare il livello. Attento alle casse rotolanti e ai fusti di fuoco!","level":"LIVELLO","levelClear":"LIVELLO SUPERATO!","bonus":"Bonus livello","overTitle":"PARTITA FINITA","climbWord":"salite","hint":"Arrampicati fino alla scimmia!","sec":"🔒 Questo gioco è gratuito e non chiede mai di collegare un wallet o firmare nulla per giocare. Qualsiasi pagina che lo chiede è falsa."},"nl":{"tag":"Beklim de stalen toren, ontwijk de vaten van de grote aap en bereik de top.","howBody":"<b>Joystick (linksonder): duw ◀ ▶</b> om over de platforms te rennen.<br><b>Duw omhoog bij een ladder</b> om te klimmen · <b>omlaag</b> om af te dalen.<br><b>SPRING-knop</b> (of duw de joystick op de grond omhoog) om over vaten te springen — één overspringen is <b>+100</b>!<br>Desktop: pijltjestoetsen of WASD + spatie.<br>Pak gouden <b>LUNC-sikkels</b> (+50) en blauwe <b>USTC-sterren</b> (+250).<br>Bereik het bovenste platform naast de aap om het level te halen. Pas op voor rollende kisten en vuurvaten!","level":"LEVEL","levelClear":"LEVEL GEHAALD!","bonus":"Levelbonus","overTitle":"SPEL VOORBIJ","climbWord":"beklimmingen","hint":"Klim omhoog naar de aap!","sec":"🔒 Dit spel is gratis en vraagt nooit om een wallet te verbinden of iets te tekenen om te spelen. Elke pagina die dat wel vraagt, is nep."},"ru":{"tag":"Заберись на стальную башню, уворачивайся от бочек большой обезьяны и доберись до вершины.","howBody":"<b>Джойстик (слева внизу): веди ◀ ▶</b>, чтобы бегать по платформам.<br><b>У лестницы веди вверх</b> — подняться · <b>вниз</b> — спуститься.<br
