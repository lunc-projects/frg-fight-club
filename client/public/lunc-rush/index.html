<title>LUNC RUSH — Luna Classic Speed Run</title>
<style>

  canvas { display:block; width:100%; height:100%; touch-action:none; }

  #titleScreen { background:radial-gradient(ellipse at 50% 30%, rgba(20,28,80,.25), rgba(4,6,20,.78) 75%); }

  h1.logo { font-size:clamp(44px,13vw,84px); font-weight:900; letter-spacing:2px; line-height:.95;
    background:linear-gradient(180deg,#fff3b0 15%,#ffd23e 45%,#f39c12 70%,#ffe9a3); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 0 rgba(120,60,0,.0); filter:drop-shadow(0 5px 0 rgba(90,45,0,.55)) drop-shadow(0 10px 22px rgba(0,0,0,.6)); }

  .tag { margin-top:10px; font-size:clamp(13px,3.8vw,17px); color:#cfd8ff; max-width:520px; text-shadow:0 1px 4px #000; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:999px; font-weight:800; color:#231303;
    background:linear-gradient(180deg,#ffe066,#f5b921); padding:14px 38px; font-size:clamp(17px,5vw,21px); letter-spacing:1px;
    box-shadow:0 5px 0 #9c6d0e, 0 10px 24px rgba(0,0,0,.5); margin-top:14px; transition:transform .06s; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #9c6d0e; }
  .btn.alt { background:linear-gradient(180deg,#3d4b8f,#26336e); color:#e8ecff; box-shadow:0 5px 0 #141d47, 0 10px 24px rgba(0,0,0,.5); font-size:clamp(14px,4vw,17px); padding:11px 26px; }
  .btn.small { padding:9px 20px; font-size:15px; margin-top:10px; }
  .panel { background:rgba(10,14,40,.92); border:2px solid rgba(255,210,63,.55); border-radius:18px; padding:20px 22px; max-width:min(92vw,480px); max-height:82vh; overflow:auto; box-shadow:0 18px 50px rgba(0,0,0,.65); }
  .panel h2 { color:#ffd23e; letter-spacing:1px; margin-bottom:10px; font-size:22px; }
  .panel p { color:#dfe6ff; font-size:15px; line-height:1.5; text-align:left; }
  .panel p b { color:#ffe066; }
  .row { display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.08); font-size:16px; }
  .row .rk { width:34px; color:#ffd23e; font-weight:800; }
  .row .nm { flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sc { font-weight:800; color:#fff; }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
  .tab { cursor:pointer; border:1px solid rgba(255,210,63,.5); background:transparent; color:#ffeec2; border-radius:999px; padding:7px 18px; font-weight:700; font-size:14px; }
  .tab.on { background:#ffd23e; color:#231303; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 0; z-index:5; pointer-events:none; }
  .hudbox { background:rgba(8,10,30,.62); border:1px solid rgba(255,210,63,.35); border-radius:12px; padding:5px 10px; font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px; text-shadow:0 1px 3px #000; white-space:nowrap; }
  .hudbox img { width:19px; height:19px; }
  .star-ic { color:#5ea0ff; font-size:17px; }
  #hudRight { margin-left:auto; display:flex; gap:8px; }
  .iconbtn { pointer-events:auto; cursor:pointer; width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,210,63,.35); background:rgba(8,10,30,.62); color:#ffeec2; font-size:18px; display:flex; align-items:center; justify-content:center; }
  #zoneBanner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:8; pointer-events:none; }
  #zoneBanner .zname { font-size:clamp(30px,9vw,52px); font-weight:900; color:#ffe066; letter-spacing:2px; text-shadow:0 4px 0 rgba(90,45,0,.6), 0 8px 30px #000; }
  #zoneBanner .zsub { font-size:clamp(15px,4.5vw,20px); color:#dfe6ff; font-weight:700; text-shadow:0 2px 6px #000; margin-top:4px; }
  #banner { position:absolute; top:16%; left:0; right:0; text-align:center; z-index:8; pointer-events:none; font-weight:900; font-size:clamp(22px,7vw,36px); color:#ffe066; text-shadow:0 3px 0 rgba(90,45,0,.6),0 6px 22px #000; }
  #touch { position:absolute; left:0; right:0; bottom:0; z-index:6; display:none; justify-content:space-between; padding:0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  #touch.on { display:flex; }
  .tgroup { display:flex; gap:10px; align-items:flex-end; }
  .tbtn { pointer-events:auto; width:62px; height:62px; border-radius:50%; border:2px solid rgba(255,238,194,.5); background:rgba(10,14,40,.55); color:#ffeec2; font-size:24px; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:none; }
  .tbtn:active, .tbtn.held { background:rgba(255,210,62,.5); }
  .tbtn.big { width:74px; height:74px; font-size:15px; font-weight:900; letter-spacing:.5px; }
  #touch.stickmode { justify-content:flex-end; }
  #touch.stickmode #padLeft, #touch.stickmode #tRoll { display:none; }
  #stickZone { position:absolute; left:0; bottom:0; width:54%; height:66%; z-index:6; display:none; touch-action:none; }
  #stickZone.on { display:block; }
  #stickBase { position:absolute; width:118px; height:118px; margin:-59px 0 0 -59px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(130,150,200,.50), rgba(28,36,68,.55) 72%);
    border:2px solid rgba(207,216,255,.45); box-shadow:inset 0 0 26px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35); opacity:.92; }
  #stickKnob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #ffe98a, #f5b921 65%, #c47f0e); border:2px solid rgba(156,109,14,.85);
    box-shadow:0 4px 10px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
  #stickKnob img { width:34px; height:34px; pointer-events:none; }
  #langSel { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:20; background:rgba(8,10,30,.8); color:#ffeec2; border:1px solid rgba(255,210,63,.5); border-radius:10px; padding:7px 9px; font-size:14px; max-width:44vw; }
  input.name { pointer-events:auto; width:min(78vw,300px); padding:12px 16px; border-radius:12px; border:2px solid rgba(255,210,63,.6); background:rgba(255,255,255,.94); color:#141414; font-size:17px; font-weight:700; text-align:center; margin-top:10px; }
  .bigscore { font-size:clamp(30px,9vw,44px); font-weight:900; color:#ffe066; text-shadow:0 3px 0 rgba(90,45,0,.6); }
  .statline { font-size:16px; color:#dfe6ff; margin-top:4px; }
  .statline b { color:#fff; }
  #toast { position:absolute; left:50%; bottom:19%; transform:translateX(-50%); z-index:9; background:rgba(8,10,30,.85); border:1px solid rgba(255,210,63,.5); color:#ffeec2; padding:9px 18px; border-radius:999px; font-weight:700; font-size:15px; pointer-events:none; opacity:0; transition:opacity .25s; }
</style>

<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hudbox"><img src="lunc.png" alt="LUNC"><span id="hudCoins">0</span></div>
    <div class="hudbox"><span class="star-ic">★</span><span id="hudStars">0</span></div>
    <div class="hudbox"><span id="hudScore">0</span></div>

      <button class="iconbtn" id="muteBtn" aria-label="Mute">🔊</button>
    </div>
  </div>

  <div id="banner" class="hidden"></div>
  <div id="zoneBanner" class="hidden"><div class="zname" id="zbName"></div><div class="zsub" id="zbSub"></div></div>
  <div id="toast"></div>

  <div id="touch">
    <div class="tgroup" id="padLeft">
      <div class="tbtn" id="tLeft">◀</div>
      <div class="tbtn" id="tRight">▶</div>
    </div>
    <div class="tgroup">
      <div class="tbtn" id="tRoll">ROLL</div>
      <div class="tbtn big" id="tJump">JUMP</div>
    </div>
  </div>

  <div id="stickZone">
    <div id="stickBase"><div id="stickKnob"><img src="lunc.png" alt=""></div></div>
  </div>

  <select id="langSel" aria-label="Language"></select>

  <div class="overlay" id="titleScreen">
    <img class="crescent" src="lunc.png" alt="Luna Classic crescent">
    <h1 class="logo">LUNC RUSH</h1>
    <div class="brand">LUNA CLASSIC</div>
    <div class="tag" id="tagline"></div>
    <button class="btn" id="playBtn"></button>
    <button class="btn alt" id="howBtn"></button>
    <button class="btn alt" id="boardBtn"></button>
    <button class="btn alt" id="ctrlBtn"></button>
  </div>

  <div class="overlay hidden" id="howScreen" style="background:rgba(3,5,16,.55)">
    <div class="panel">
      <h2 id="howTitle"></h2>
      <p id="howBody"></p>
      <button class="btn small" id="howClose"></button>
    </div>
  </div>

  <div class="overlay hidden" id="boardScreen" style="background:rgba(3,5,16,.55)">
    <div class="panel" style="width:min(92vw,480px)">
      <h2 id="boardTitle"></h2>
      <div class="tabs">
        <button class="tab on" id="tabAll"></button>
        <button class="tab" id="tabWeek"></button>
      </div>
      <div id="boardList"></div>
      <button class="btn small" id="boardClose"></button>
    </div>
  </div>

  <div class="overlay hidden" id="endScreen" style="background:rgba(3,5,16,.45)">
    <div class="panel" style="text-align:center">
      <h2 id="endTitle"></h2>
      <div class="bigscore" id="endScore">0</div>
      <div class="statline" id="endStats"></div>
      <div class="statline" id="endBonus"></div>
      <input class="name" id="nameInput" maxlength="16" autocomplete="off">
      <div><button class="btn small" id="submitBtn"></button></div>
      <div class="statline" id="submitStatus"></div>
      <div>
        <button class="btn alt small" id="againBtn"></button>
        <button class="btn alt small" id="endBoardBtn"></button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="pauseScreen" style="background:rgba(3,5,16,.55)">
    <div class="panel" style="text-align:center">
      <h2 id="pauseTitle"></h2>
      <button class="btn small" id="resumeBtn"></button><br>
      <button class="btn alt small" id="ctrlBtnP"></button><br>
      <button class="btn alt small" id="quitBtn"></button>
    </div>
  </div>
</div>
