<style>

  // ---- rider ----
  const thrown = mode === "thrown" || mode === "done";
  let rx = 4, ry = -58, rRot = balance * 0.0062, fly = 0;
  if (thrown) {
    fly = Math.min(fallT * 1.15, 1);
    rx += fallDir * fly * 235; ry += -Math.sin(fly * Math.PI) * 120 + fly * fly * 165;
    rRot = fallDir * fly * 2.4;
  }
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(rRot);
  const waving = riding && (rideT - waveT) < 0.85;
  const legSwing = riding ? Math.sin(buckPhase) * 5 : 0;
  ctx.strokeStyle = "#274b8f"; ctx.lineWidth = 11; ctx.lineCap = "round";   // jeans legs gripping
  ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-34, 30 + legSwing); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 6); ctx.lineTo(36, 30 - legSwing); ctx.stroke();
  ctx.fillStyle = "#4a2c10"; ctx.fillRect(-44, 26 + legSwing, 15, 7); ctx.fillRect(30, 26 - legSwing, 15, 7); // boots
  const tg = ctx.createLinearGradient(0, -58, 0, 8); tg.addColorStop(0, "#d32f2f"); tg.addColorStop(1, "#8e1414");
  ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(0, -26, 17.5, 30, 0, 0, 6.29); ctx.fill();  // torso (plaid shirt)
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-16, -44); ctx.lineTo(16, -44); ctx.moveTo(-17, -26); ctx.lineTo(17, -26); ctx.stroke();
  crescent(0, -34, 5.5, "#ffe082");                                                              // LUNC crescent on shirt
  ctx.strokeStyle = "#c62828"; ctx.lineWidth = 9;                                                        // grip arm (down to rope)
  ctx.beginPath(); ctx.moveTo(10, -44); ctx.quadraticCurveTo(24, -26, 22, -8); ctx.stroke();
  ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(22, -6, 5.4, 0, 6.29); ctx.fill();
  // free arm — up! waves when WAVE pressed
  const armA = waving ? -2.5 + Math.sin(now * 26) * 0.5 : -2.35;
  ctx.strokeStyle = "#c62828"; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-10, -46); ctx.lineTo(-10 + Math.cos(armA) * 30, -46 + Math.sin(armA) * 30); ctx.stroke();
  ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(-10 + Math.cos(armA) * 33, -46 + Math.sin(armA) * 33, 5.6, 0, 6.29); ctx.fill();
  // head + face
  ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(0, -68, 13.5, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#201105"; ctx.beginPath(); ctx.arc(-4.6, -70, 1.8, 0, 6.29); ctx.arc(4.6, -70, 1.8, 0, 6.29); ctx.fill();
  ctx.strokeStyle = "#201105"; ctx.lineWidth = 1.7;
  ctx.beginPath();
  if (Math.abs(balance) > 72 && riding) ctx.arc(0, -58.5, 4, 0, 6.29);            // "O" mouth in danger
  else ctx.arc(0, -66, 6, 0.4, 2.74);                                              // grin
  ctx.stroke();
  // cowboy hat
  ctx.fillStyle = "#8d5a1d"; ctx.beginPath(); ctx.ellipse(0, -79, 21, 5.6, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#a06a24"; ctx.beginPath(); ctx.ellipse(0, -84, 11.5, 7.5, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#ffd54f"; ctx.fillRect(-11.5, -82.5, 23, 3.4);
  ctx.restore(); // rider
  ctx.restore(); // bull group
}
function drawHUD(now) {
  const L = t();
  // big central timer
  ctx.textAlign = "center";
  ctx.font = "900 54px Trebuchet MS";
  ctx.lineWidth = 9; ctx.strokeStyle = "rgba(20,8,0,.85)";
  const tstr = rideT.toFixed(1);
  ctx.strokeText(tstr, 450, 66); ctx.fillStyle = buzzed ? "#69f0ae" : "#fff3e0"; ctx.fillText(tstr, 450, 66);
  ctx.font = "800 15px Trebuchet MS"; ctx.fillStyle = "#ffdfae";
  ctx.fillText(L.time + " • " + L.toQual, 450, 88);
  // style + best chips
  ctx.font = "800 16px Trebuchet MS"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(20,10,2,.72)"; ctx.fillRect(12, 12, 168, 30);
  ctx.fillStyle = "#ce93d8"; ctx.fillText("✋ " + L.style + ": " + style, 22, 33);
  if (bestTime > 0) {
    ctx.fillStyle = "rgba(20,10,2,.72)"; ctx.fillRect(12, 46, 184, 30);
    ctx.fillStyle = "#9be15d"; ctx.textAlign = "left"; ctx.fillText("🏆 " + L.best + ": " + bestTime.toFixed(1) + "s", 22, 67);
  }
  // balance gauge
  const gx = 450, gy = 556, gw = 460, gh = 22;
  const grd = ctx.createLinearGradient(gx - gw / 2, 0, gx + gw / 2, 0);
  grd.addColorStop(0, "#c62828"); grd.addColorStop(0.28, "#f9a825"); grd.addColorStop(0.5, "#43a047"); grd.addColorStop(0.72, "#f9a825"); grd.addColorStop(1, "#c62828");
  ctx.fillStyle = "rgba(15,7,1,.8)"; ctx.fillRect(gx - gw / 2 - 8, gy - 24, gw + 16, gh + 34);
  ctx.fillStyle = grd; ctx.fillRect(gx - gw / 2, gy, gw, gh);
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(gx - gw * 0.175, gy, gw * 0.35, gh); // safe zone sheen
  ctx.fillStyle = "#fff"; ctx.fillRect(gx - 1.5, gy - 4, 3, gh + 8);                        // center tick
  const nx = gx + (balance / 100) * (gw / 2);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#160b02"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(nx, gy - 9); ctx.lineTo(nx - 8, gy - 21); ctx.lineTo(nx + 8, gy - 21); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#160b02"; ctx.fillRect(nx - 2, gy - 3, 4, gh + 6);
  if (mode === "riding" && Math.abs(balance) > 72 && Math.floor(now * 5) % 2 === 0) {
    ctx.font = "900 27px Trebuchet MS"; ctx.textAlign = "center";
    ctx.lineWidth = 6; ctx.strokeStyle = "#000"; ctx.strokeText(L.danger, 450, 140);
    ctx.fillStyle = "#ff5252"; ctx.fillText(L.danger, 450, 140);
  }
  if (mode === "riding" && (rideT - waveT) < 0.85) {
    ctx.font = "900 22px Trebuchet MS"; ctx.textAlign = "center"; ctx.fillStyle = "#ce93d8";
    ctx.fillText("+5 " + L.style, 450 + Math.sin(spin) * 26, 300 - (rideT - waveT) * 42);
  }
}

/* ================= INPUT ================= */
function bindHold(el, on, off) {
  const start = e => { e.preventDefault(); el.classList.add("on"); on(); };
  const end = e => { if (e) e.preventDefault(); el.classList.remove("on"); off(); };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", end); el.addEventListener("pointerleave", end); el.addEventListener("pointercancel", end);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindHold($("btnLeft"), () => input.left = true, () => input.left = false);
bindHold($("btnRight"), () => input.right = true, () => input.right = false);
$("btnWave").addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); doWave(); });
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") input.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") input.right = true;
  if (e.key === " " || e.key === "w" || e.key === "W") { initAudio(); doWave(); e.preventDefault(); }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") input.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") input.right = false;
});
// drag on canvas = analog lean
let dragId = null, dragX0 = 0;
cv.addEventListener("pointerdown", e => { dragId = e.pointerId; dragX0 = e.clientX; });
cv.addEventListener("pointermove", e => { if (e.pointerId === dragId) input.drag = Math.max(-1, Math.min(1, (e.clientX - dragX0) / 90)); });
const dragEnd = e => { if (e.pointerId === dragId) { dragId = null; input.drag = 0; } };
cv.addEventListener("pointerup", dragEnd); cv.addEventListener("pointercancel", dragEnd);
$("btnStart").addEventListener("click", startRide);
$("btnAgain").addEventListener("click", startRide);

/* ================= LOOP ================= */
let lastMs = 0;
function frame(ms) {
  const now = ms / 1000;
  let dt = Math.min(0.033, lastMs ? now - lastMs : 0.016);
  lastMs = now;
  update(dt);
  drawScene(now);
  requestAnimationFrame(frame);
}
applyLang();
requestAnimationFrame(frame);

/* QA / debug hook */
window.__rodeo = {
  start: startRide, wave: doWave,
  setLean: v => { input.left = v < 0; input.right = v > 0; input.drag = (typeof v === "number" && Math.abs(v) <= 1 && v !== 0 && !input.left && !input.right) ? v : input.drag; },
  lean: v => { input.drag = Math.max(-1, Math.min(1, v)); },
  state: () => mode, balance: () => balance, time: () => rideT,
  style: () => style, score: () => score
};
</script>
