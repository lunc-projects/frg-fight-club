function noise(dur, vol, freq, delay) {

  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + (delay || 0), src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 800;
  const g = a.createGain(); g.gain.setValueAtTime(vol || 0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0); src.stop(t0 + dur + 0.02);
}
function sfx(name) {
  if (!AC) return;
  switch (name) {
    case 'shoot': tone(760, 240, 0.06, 'square', 0.035); break;
    case 'frost': tone(1350, 620, 0.09, 'sine', 0.05); break;
    case 'cannon': tone(150, 40, 0.22, 'sawtooth', 0.10); noise(0.18, 0.10, 500); break;
    case 'zap': tone(1500, 180, 0.10, 'sawtooth', 0.06); noise(0.06, 0.05, 3200); break;
    case 'boom': noise(0.35, 0.20, 420); tone(90, 30, 0.3, 'sine', 0.14); break;
    case 'die': tone(320, 60, 0.14, 'triangle', 0.06); break;
    case 'coin': tone(950, 950, 0.05, 'sine', 0.05); tone(1420, 1420, 0.09, 'sine', 0.05, 0.05); break;
    case 'place': tone(300, 300, 0.06, 'square', 0.07); tone(520, 520, 0.09, 'square', 0.07, 0.06); break;
    case 'error': tone(160, 110, 0.16, 'square', 0.07); break;
    case 'leak': tone(220, 55, 0.3, 'sawtooth', 0.12); noise(0.25, 0.12, 300); break;
    case 'horn': tone(196, 196, 0.18, 'sawtooth', 0.09); tone(147, 147, 0.28, 'sawtooth', 0.09, 0.16); break;
    case 'win': [523,659,784,1047].forEach((f,i)=>tone(f, f, 0.22, 'triangle', 0.09, i*0.13)); break;

const PATH = [[-40,120],[760,120],[760,360],[200,360],[200,520],[868,520]];
const VAULT = { x: 912, y: 520, r: 33 };
const SEGS = []; let PATHLEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const x1 = PATH[i][0], y1 = PATH[i][1], x2 = PATH[i+1][0], y2 = PATH[i+1][1];
  const len = Math.hypot(x2-x1, y2-y1);
  SEGS.push({ x1, y1, x2, y2, len, start: PATHLEN, ang: Math.atan2(y2-y1, x2-x1) });
  PATHLEN += len;
}
function posAt(d) {
  d = Math.max(0, Math.min(d, PATHLEN - 0.01));
  for (const s of SEGS) if (d <= s.start + s.len) { const f = (d - s.start) / s.len; return { x: s.x1 + (s.x2-s.x1)*f, y: s.y1 + (s.y2-s.y1)*f, ang: s.ang }; }
  const s = SEGS[SEGS.length-1]; return { x: s.x2, y: s.y2, ang: s.ang };
}
const PADS = [[120,240],[280,40],[440,240],[600,40],[840,40],[880,240],[880,440],[520,440],[280,440],[120,440],[120,600],[440,600],[680,600],[840,600]];
const CRATERS = [], DUST = [];
(function(){ let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) CRATERS.push({ x: rnd()*W, y: rnd()*H, r: 12 + rnd()*36 });
  for (let i = 0; i < 130; i++) DUST.push({ x: rnd()*W, y: rnd()*H, r: rnd()*1.8 + 0.4, p: rnd()*6.28 });
})();

  cannon:  { cost:110, range:158, dmg:34, rate:0.75, projSpeed:360, splash:64, color:'#ff9a3c', icon:'💣' },

const EDEFS = {
  drone:   { hp:26,   speed:54, reward:7,   r:15, leak:1,  color:'#ff5d5d' },
  scout:   { hp:15,   speed:96, reward:6,   r:12, leak:1,  color:'#ffb84d' },

function towerStats(type, level) {
  const d = TDEFS[type], m = Math.pow(1.55, level - 1);
  return { dmg: Math.round(d.dmg * m), range: Math.round(d.range * Math.pow(1.08, level - 1)), rate: +(d.rate * Math.pow(1.12, level - 1)).toFixed(2) };
}
function upgradeCost(type, level) { return level >= 3 ? null : Math.round(TDEFS[type].cost * (level === 1 ? 0.9 : 1.4)); }

let G;
function resetGame() {
  G = { credits: 220, hp: 20, wave: 0, score: 0, kills: 0, time: 0,
        enemies: [], projs: [], fx: [], queue: [], spawnT: 0, spawnInt: 1,
        pads: PADS.map(p => ({ x: p[0], y: p[1], tw: null })),
        phase: 'build', paused: false, speed: 1, sel: -1, vaultFlash: 0, over: false };
  document.getElementById('overlay').classList.remove('open');
  setMsg(t('tapPad'));
  updateHUD(true); renderMenu();
}
function best() { return { w: +(localStorage.getItem('luncTD_bestWave') || 0), s: +(localStorage.getItem('luncTD_bestScore') || 0) }; }
function saveBest() {
  const b = best();
  if (G.wave > b.w) localStorage.setItem('luncTD_bestWave', G.wave);
  if (G.score > b.s) localStorage.setItem('luncTD_bestScore', G.score);

/* ================= WAVES ================= */
function buildWave(w) {
  const q = [], hpMul = Math.pow(1.21, w - 1), spMul = Math.min(1.35, 1 + (w - 1) * 0.014);
  const add = (type, n) => { for (let i = 0; i < n; i++) q.push(type); };
  add('drone', 6 + w * 2);
  if (w >= 3) add('scout', Math.floor((w - 2) * 1.3));
  if (w >= 5) add('armored', Math.floor((w - 4) * 0.9));
  if (w >= 10) add('scout', 4);
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = q[i]; q[i] = q[j]; q[j] = tmp; }
  if (w === 15) q.splice(Math.floor(q.length * 0.35), 0, 'boss');
  G.queue = q.map(type => ({ type, hpMul, spMul }));
  G.spawnInt = Math.max(0.34, 1.05 - w * 0.045);
  G.spawnT = 0.4;
}
function spawnNext() {
  const item = G.queue.shift(); if (!item) return;
  const d = EDEFS[item.type];
  const hp = Math.round(d.hp * item.hpMul);
  G.enemies.push({ type: item.type, hp, maxHp: hp, dist: 0, speed: d.speed * item.spMul,
                   reward: d.reward, r: d.r, leak: d.leak, slowT: 0, slowF: 1, dead: false,
                   x: -40, y: 120, ang: 0, seed: Math.random() * 10 });
}
function startWave() {
  if (G.phase !== 'build' || G.over) return;
  ac(); G.wave++; buildWave(G.wave); G.phase = 'wave';
  if (G.wave === 15) { setMsg(t('bossWarn')); sfx('horn'); } else setMsg('');
  updateHUD(true); renderMenu();
}

/* ================= COMBAT ================= */
function addFx(fx) { G.fx.push(fx); }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (0.3 + Math.random() * 0.7) * (spd || 90);
    addFx({ kind:'p', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, ttl: 0.45 + Math.random()*0.3, max: 0.7, color, r: 2 + Math.random()*2.5 }); }
}
function damage(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  if (e.hp <= 0) {
    e.dead = true; G.kills++; G.credits += e.reward; G.score += e.reward * 5 + 10;
    burst(e.x, e.y, EDEFS[e.type].color, e.type === 'boss' ? 42 : 14, e.type === 'boss' ? 170 : 110);
    addFx({ kind:'ring', x: e.x, y: e.y, ttl: 0.3, max: 0.3, r: e.r + 4, color: EDEFS[e.type].color });
    addFx({ kind:'text', x: e.x, y: e.y - e.r - 6, ttl: 0.8, max: 0.8, txt: '+' + e.reward, color: '#ffd95e' });
    sfx(e.type === 'boss' ? 'boom' : 'die'); if (e.type !== 'boss' && Math.random() < 0.3) sfx('coin');
    updateHUD();
  }
}
function fire(pad, st, target) {
  const tw = pad.tw, def = TDEFS[tw.type];
  tw.angle = Math.atan2(target.y - pad.y, target.x - pad.x);
  tw.flash = 0.06;
  if (tw.type === 'tesla') {
    const pts = [{ x: pad.x, y: pad.y - 14 }]; let cur = target, from = { x: pad.x, y: pad.y - 14 }, hitSet = new Set();
    for (let i = 0; i < def.chain; i++) {
      if (!cur || cur.dead) break;
      pts.push({ x: cur.x, y: cur.y }); damage(cur, Math.round(st.dmg * Math.pow(0.75, i))); hitSet.add(cur); from = cur;
      let nxt = null, nd = def.chainRange;
      for (const e of G.enemies) { if (e.dead || hitSet.has(e)) continue; const dd = Math.hypot(e.x - from.x, e.y - from.y); if (dd < nd) { nd = dd; nxt = e; } }
      cur = nxt;
    }
    addFx({ kind:'bolt', pts, ttl: 0.14, max: 0.14 });
    sfx('zap');
  } else if (tw.type === 'cannon') {
    G.projs.push({ kind:'shell', x: pad.x, y: pad.y - 10, tx: target.x, ty: target.y, speed: def.projSpeed, dmg: st.dmg, splash: def.splash });
    tw.recoil = 1; sfx('cannon');
  } else {
    G.projs.push({ kind:'bolt', x: pad.x, y: pad.y - 10, target, speed: def.projSpeed, dmg: st.dmg, type: tw.type });
    sfx(tw.type === 'frost' ? 'frost' : 'shoot');
  }
}
function update(dt) {
  G.time += dt;
  if (G.vaultFlash > 0) G.vaultFlash -= dt;
  /* spawning */
  if (G.phase === 'wave' && G.queue.length) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawnNext(); G.spawnT = G.spawnInt; }
  }
  /* enemies */
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 1; }
    e.dist += e.speed * e.slowF * dt;
    const p = posAt(e.dist); e.x = p.x; e.y = p.y; e.ang = p.ang;
    if (e.dist >= PATHLEN - 1) {
      e.dead = true; e.leaked = true; G.hp -= e.leak; G.vaultFlash = 0.5;
      burst(VAULT.x - 20, VAULT.y, '#ff6b6b', 16, 120); sfx('leak'); updateHUD();
      if (G.hp <= 0) { G.hp = 0; return gameOver(false); }
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  /* towers */
  for (const pad of G.pads) {
    if (!pad.tw) continue;
    const tw = pad.tw, st = towerStats(tw.type, tw.level), def = TDEFS[tw.type];
    tw.cool -= dt; if (tw.flash > 0) tw.flash -= dt; if (tw.recoil > 0) tw.recoil = Math.max(0, tw.recoil - dt * 6);
    let target = null, bd = -1;
    for (const e of G.enemies) { const dd = Math.hypot(e.x - pad.x, e.y - pad.y); if (dd <= st.range && e.dist > bd) { bd = e.dist; target = e; } }
    if (target) {
      const want = Math.atan2(target.y - pad.y, target.x - pad.x);
      let da = want - tw.angle; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
      tw.angle += da * Math.min(1, dt * 14);
      if (tw.cool <= 0) { fire(pad, st, target); tw.cool = 1 / st.rate; }
    }
  }
  /* projectiles */
  for (const pr of G.projs) {
    if (pr.done) continue;
    if (pr.kind === 'bolt') {
      if (!pr.target || pr.target.dead) { pr.done = true; continue; }
      const dx = pr.target.x - pr.x, dy = pr.target.y - pr.y, dd = Math.hypot(dx, dy), step = pr.speed * dt;
      if (dd <= step + pr.target.r * 0.5) {
        if (pr.type === 'frost') { pr.target.slowF = 1 - TDEFS.frost.slow; pr.target.slowT = TDEFS.frost.slowDur; addFx({ kind:'ring', x: pr.target.x, y: pr.target.y, ttl: 0.25, max: 0.25, r: pr.target.r + 5, color: '#5ff2ff' }); }
        damage(pr.target, pr.dmg); pr.done = true;
      } else { pr.x += dx / dd * step; pr.y += dy / dd * step; }
    } else if (pr.kind === 'shell') {
      const dx = pr.tx - pr.x, dy = pr.ty - pr.y, dd = Math.hypot(dx, dy), step = pr.speed * dt;
      if (dd <= step + 4) {
        addFx({ kind:'ring', x: pr.tx, y: pr.ty, ttl: 0.32, max: 0.32, r: pr.splash, color: '#ff9a3c' });
        burst(pr.tx, pr.ty, '#ffb84d', 18, 150); burst(pr.tx, pr.ty, '#ff5d5d', 8, 90); sfx('boom');
        for (const e of G.enemies.slice()) { if (Math.hypot(e.x - pr.tx, e.y - pr.ty) <= pr.splash + e.r * 0.4) damage(e, pr.dmg); }
        pr.done = true;
      } else { pr.x += dx / dd * step; pr.y += dy / dd * step; }
    }
  }
  G.projs = G.projs.filter(p => !p.done);
  G.enemies = G.enemies.filter(e => !e.dead);
  /* fx */
  for (const f of G.fx) { f.ttl -= dt; if (f.kind === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; } if (f.kind === 'text') f.y -= 34 * dt; }
  G.fx = G.fx.filter(f => f.ttl > 0);
  /* wave end */
  if (G.phase === 'wave' && !G.queue.length && !G.enemies.length) {
    const bonus = 20 + G.wave * 5;
    G.credits += bonus; G.score += 50 * G.wave;
    if (G.wave >= 15) return gameOver(true);
    G.phase = 'build'; setMsg(t('waveClear', { b: bonus })); sfx('coin');
    updateHUD(true); renderMenu();
  }
}
function gameOver(won) {
  G.phase = 'over'; G.over = true; saveBest(); updateHUD(true);
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = t(won ? 'victory' : 'defeat');
  document.getElementById('ovText').textContent = t(won ? 'victoryText' : 'defeatText', { s: G.score, w: G.wave, k: G.kills });
  ov.classList.add('open'); sfx(won ? 'win' : 'lose');
}

/* ================= DRAWING ================= */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawTerrain() {
  const g = ctx.createRadialGradient(480, 300, 80, 480, 320, 720);
  g.addColorStop(0, '#16264e'); g.addColorStop(0.55, '#0d1834'); g.addColorStop(1, '#070f22');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const d of DUST) { ctx.globalAlpha = 0.25 + 0.2 * Math.sin(G.time * 1.5 + d.p); ctx.fillStyle = '#a9c4ff'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const c of CRATERS) {
    ctx.fillStyle = '#0a142c'; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r, c.r * 0.55, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#22355f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(c.x, c.y - 2, c.r, c.r * 0.55, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  }
  /* base grid pads deco */
  ctx.strokeStyle = 'rgba(70,110,190,0.10)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}
function drawPath() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const trace = w => { ctx.beginPath(); ctx.moveTo(PATH[0][0], PATH[0][1]); for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i][0], PATH[i][1]); ctx.lineWidth = w; ctx.stroke(); };
  ctx.strokeStyle = '#050a18'; trace(52);
  ctx.strokeStyle = '#1b2c52'; trace(46);
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#24365f'); g.addColorStop(1, '#2c4476');
  ctx.strokeStyle = g; trace(38);
  ctx.strokeStyle = 'rgba(95,242,255,0.55)'; ctx.shadowColor = '#5ff2ff'; ctx.shadowBlur = 12; trace(3);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,217,94,0.8)'; ctx.setLineDash([4, 26]); ctx.lineDashOffset = -G.time * 60; trace(3); ctx.setLineDash([]);
  /* spawn gate */
  ctx.fillStyle = '#ff5d5d'; ctx.shadowColor = '#ff5d5d'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(6, 120, 7 + Math.sin(G.time * 4) * 1.6, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
}
function drawVault() {
  const v = VAULT, pulse = 1 + Math.sin(G.time * 2.2) * 0.03;

  ctx.strokeStyle = G.vaultFlash > 0 ? 'rgba(255,80,80,0.9)' : 'rgba(95,242,255,0.5)';
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, (v.r + 12) * pulse, 0, 6.283); ctx.stroke();
  ctx.fillStyle = '#0d1a38'; ctx.beginPath(); ctx.arc(0, 0, v.r + 7, 0, 6.283); ctx.fill();

  ctx.fillStyle = '#f5b921'; ctx.beginPath(); ctx.arc(9, -6, 12.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#5b3a00'; ctx.font = '900 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('LUNC', 0, 24);

function drawPads() {
  for (let i = 0; i < G.pads.length; i++) {
    const p = G.pads[i];

    ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283 + 0.39; const px = Math.cos(a) * 30, py = Math.sin(a) * 30; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath(); ctx.arc(0, 0, 13 + pl * 3, 0, 6.283); ctx.stroke();
      ctx.fillStyle = 'rgba(160,220,255,0.9)'; ctx.font = '900 17px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', 0, 1);

function drawTower(p) {

  if (G.sel >= 0 && G.pads[G.sel] === p) {

    ctx.fillStyle = 'rgba(120,200,255,0.10)'; ctx.strokeStyle = 'rgba(120,200,255,0.45)'; ctx.lineWidth = 1.5;

    ctx.fillStyle = def.color; ctx.fillRect(4, -8, 20 - tw.recoil * 4, 5); ctx.fillRect(4, 3, 20 - tw.recoil * 4, 5);
    ctx.fillStyle = '#bfe0ff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 6.283); ctx.fill();
    if (tw.flash > 0) { ctx.fillStyle = 'rgba(255,240,170,0.95)'; ctx.beginPath(); ctx.arc(27, -5.5, 5, 0, 6.283); ctx.arc(27, 5.5, 5, 0, 6.283); ctx.fill(); }
  } else if (tw.type === 'cannon') {
    ctx.fillStyle = '#6e4520'; rr(-14, -14, 28, 28, 7); ctx.fill();
    ctx.fillStyle = def.color; rr(2 - tw.recoil * 6, -7, 26, 14, 5); ctx.fill();
    ctx.fillStyle = '#2b1a08'; ctx.beginPath(); ctx.arc(26 - tw.recoil * 6, 0, 6, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffd9a3'; ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 6.283); ctx.fill();
    if (tw.flash > 0) { ctx.fillStyle = 'rgba(255,190,90,0.95)'; ctx.beginPath(); ctx.arc(33 - tw.recoil * 6, 0, 7, 0, 6.283); ctx.fill(); }
  } else if (tw.type === 'frost') {
    ctx.rotate(-tw.angle); /* crystal stays upright, spins slowly instead */
    ctx.rotate(G.time * 0.7);
    ctx.fillStyle = 'rgba(95,242,255,0.25)'; ctx.beginPath(); ctx.arc(0, 0, 17 + Math.sin(G.time * 3) * 2, 0, 6.283); ctx.fill();
    ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(10, 0); ctx.lineTo(0, 17); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#eaffff'; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 0); ctx.lineTo(0, 9); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
  } else if (tw.type === 'tesla') {
    ctx.rotate(-tw.angle);
    ctx.strokeStyle = def.color; ctx.lineWidth = 3;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0, 8 - k * 7, 11 - k * 2.2, 0, 6.283); ctx.stroke(); }
    ctx.fillStyle = '#e9dcff'; ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, -14, 6.5 + Math.sin(G.time * 6) * 0.8, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    if (Math.random() < 0.10) { ctx.strokeStyle = 'rgba(220,180,255,0.8)'; ctx.lineWidth = 1.4; ctx.beginPath(); let ax = 0, ay = -14; ctx.moveTo(ax, ay); for (let k = 0; k < 3; k++) { ax += (Math.random() - 0.5) * 22; ay += (Math.random() - 0.5) * 14; ctx.lineTo(ax, ay); } ctx.stroke(); }
    if (tw.flash > 0) { ctx.fillStyle = 'rgba(230,200,255,0.9)'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();
  /* level pips */
  for (let k = 0; k < tw.level; k++) { ctx.fillStyle = '#ffd95e'; ctx.beginPath(); ctx.arc(-10 + k * 10, 27, 3, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function drawEnemy(e) {
  const def = EDEFS[e.type], bob = Math.sin(G.time * 9 + e.seed * 7) * 1.6;
  ctx.save(); ctx.translate(e.x, e.y + bob * 0.3); ctx.rotate(e.ang);
  const r = e.r;
  /* rotors */
  ctx.fillStyle = 'rgba(200,220,255,0.5)';
  const rw = r * (0.9 + 0.25 * Math.sin(G.time * 40 + e.seed));
  ctx.beginPath(); ctx.ellipse(-r * 0.95, -r * 0.8, rw * 0.55, 2.4, 0, 0, 6.283); ctx.ellipse(-r * 0.95, r * 0.8, rw * 0.55, 2.4, 0, 0, 6.283);
  if (e.type !== 'scout') { ctx.ellipse(r * 0.95, -r * 0.8, rw * 0.55, 2.4, 0, 0, 6.283); ctx.ellipse(r * 0.95, r * 0.8, rw * 0.55, 2.4, 0, 0, 6.283); }
  ctx.fill();
  /* body */
  const bg = ctx.createLinearGradient(-r, -r, r, r);
  bg.addColorStop(0, '#3d475e'); bg.addColorStop(1, '#1c2436');
  ctx.fillStyle = bg; rr(-r, -r * 0.78, r * 2, r * 1.56, r * 0.4); ctx.fill();
  ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.stroke();
  /* hazard stripes */
  ctx.fillStyle = def.color; ctx.globalAlpha = 0.75;
  for (let k = -1; k <= 1; k++) ctx.fillRect(k * r * 0.55 - 2.5, r * 0.52, 5, r * 0.2);
  ctx.globalAlpha = 1;
  if (e.type === 'armored') {
    ctx.fillStyle = '#574a86'; rr(-r * 1.02, -r * 0.5, r * 0.5, r, 4); ctx.fill(); rr(r * 0.52, -r * 0.5, r * 0.5, r, 4); ctx.fill();
    ctx.fillStyle = '#d9ccff'; ctx.beginPath(); ctx.moveTo(r * 0.4, -r * 0.78); ctx.lineTo(r * 0.75, -r * 1.15); ctx.lineTo(r * 0.85, -r * 0.7); ctx.closePath(); ctx.fill();
  }
  if (e.type === 'boss') {
    ctx.strokeStyle = '#ffd95e'; ctx.lineWidth = 2.5;
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * r * 0.5, -r * 0.8); ctx.lineTo(k * r * 0.6, -r * 1.3); ctx.stroke(); ctx.fillStyle = '#ffd95e'; ctx.beginPath(); ctx.arc(k * r * 0.6, -r * 1.35, 3, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,46,136,0.35)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.62 + Math.sin(G.time * 5) * 2, 0, 6.283); ctx.fill();
  }
  /* face: angry eyes */
  const blink = (Math.sin(G.time * 1.3 + e.seed * 9) > 0.96) ? 0.15 : 1;
  ctx.fillStyle = '#0a0f1e'; rr(r * 0.05, -r * 0.42, r * 0.8, r * 0.84, r * 0.3); ctx.fill();
  const eye = (ey) => { ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.ellipse(r * 0.45, ey, r * 0.17, r * 0.17 * blink + 0.4, 0, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * 0.48, ey - 1.5, r * 0.055, 0, 6.283); ctx.fill(); };
  if (e.type === 'scout' || e.type === 'boss') { eye(-r * 0.2); eye(r * 0.2); } else eye(0);
  /* angry brows */
  ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(r * 0.22, -r * 0.42); ctx.lineTo(r * 0.62, -r * 0.26);
  if (e.type === 'scout' || e.type === 'boss') { ctx.moveTo(r * 0.22, r * 0.1); ctx.lineTo(r * 0.62, r * 0.26); }
  ctx.stroke();
  /* antenna */
  ctx.strokeStyle = '#8fa5cc'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.6); ctx.lineTo(-r * 0.85, -r * 1.05); ctx.stroke();
  ctx.fillStyle = (Math.sin(G.time * 6 + e.seed * 5) > 0) ? '#ff4040' : '#7a1616';
  ctx.beginPath(); ctx.arc(-r * 0.85, -r * 1.05, 2.6, 0, 6.283); ctx.fill();
  if (e.slowT > 0) { ctx.fillStyle = 'rgba(140,235,255,0.4)'; ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#dffaff'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.fillText('❄', -r * 0.5, -r * 0.4); ctx.fillText('❄', r * 0.4, r * 0.6); }
  ctx.restore();
  /* hp bar */
  if (e.hp < e.maxHp) {
    const w = Math.max(30, e.r * 2), f = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = '#0a0f1e'; ctx.fillRect(e.x - w / 2, e.y - e.r - 13, w, 5.5);
    ctx.fillStyle = f > 0.5 ? '#7dff9a' : f > 0.25 ? '#ffd95e' : '#ff6b6b';
    ctx.fillRect(e.x - w / 2 + 0.5, e.y - e.r - 12.5, (w - 1) * f, 4.5);
  }
}
function drawProjectiles() {
  for (const pr of G.projs) {
    if (pr.kind === 'bolt') {
      ctx.fillStyle = pr.type === 'frost' ? '#aef7ff' : '#ffe9a3';
      ctx.shadowColor = pr.type === 'frost' ? '#5ff2ff' : '#f5b921'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.type === 'frost' ? 4 : 3.2, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#ffb84d'; ctx.shadowColor = '#ff9a3c'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 6, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#5b3a1a'; ctx.beginPath(); ctx.arc(pr.x, pr.y, 3, 0, 6.283); ctx.fill();
    }
  }
}
function drawFx() {
  for (const f of G.fx) {
    const a = Math.max(0, f.ttl / f.max);
    if (f.kind === 'p') { ctx.globalAlpha = a; ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    else if (f.kind === 'ring') { ctx.globalAlpha = a; ctx.strokeStyle = f.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + (1 - a) * 14, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
    else if (f.kind === 'bolt') { ctx.globalAlpha = a; ctx.strokeStyle = '#e9dcff'; ctx.lineWidth = 2.6; ctx.shadowColor = '#c07bff'; ctx.shadowBlur = 9;
      ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (let i = 1; i < f.pts.length; i++) { const p = f.pts[i], q = f.pts[i-1]; ctx.lineTo((p.x + q.x) / 2 + (Math.random() - 0.5) * 14, (p.y + q.y) / 2 + (Math.random() - 0.5) * 14); ctx.lineTo(p.x, p.y); }
      ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
    else if (f.kind === 'text') { ctx.globalAlpha = a; ctx.fillStyle = f.color; ctx.font = '800 14px Arial'; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y); ctx.globalAlpha = 1; }
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawTerrain(); drawPath(); drawVault(); drawPads();
  for (const e of G.enemies) drawEnemy(e);
  drawProjectiles(); drawFx();
}

/* ================= HUD / MENU / INPUT ================= */
const $ = id => document.getElementById(id);
const hudCache = {};
function setMsg(s) { $('msg').textContent = s; }
function updateHUD(force) {
  const vals = { hCredits: G.credits, hHp: G.hp, hWave: t('waveOf', { w: G.wave }), hScore: G.score };
  const b = best(); vals.hBest = 'W' + Math.max(b.w, G.wave) + ' · ' + Math.max(b.s, G.score);
  for (const id in vals) if (force || hudCache[id] !== vals[id]) { hudCache[id] = vals[id]; $(id).textContent = vals[id]; }
  $('hHp').classList.toggle('low', G.hp <= 6);
  const bw = $('btnWave');
  bw.disabled = G.phase !== 'build' || G.over;
  bw.innerHTML = G.phase === 'wave' ? '⚔ ' + t('enemies', { n: G.enemies.length + G.queue.length }) : '▶ ' + t(G.wave === 0 ? 'startWave' : 'nextWave');
  $('btnPause').innerHTML = G.paused ? '▶ ' + t('resume') : '⏸ ' + t('pause');
}
function closeMenu() { G.sel = -1; $('menu').classList.remove('open'); $('menu').innerHTML = ''; }
function renderMenu() {
  const m = $('menu');
  if (G.sel < 0) { m.classList.remove('open'); m.innerHTML = ''; return; }
  const pad = G.pads[G.sel];
  m.classList.add('open');
  if (!pad.tw) {
    let cards = '';
    for (const type in TDEFS) {
      const d = TDEFS[type], cant = G.credits < d.cost;
      cards += '<button class="tcard' + (cant ? ' cant' : '') + '" data-act="build" data-type="' + type + '">' +
        '<div class="ic">' + d.icon + '</div><div class="tn" style="color:' + d.color + '">' + t(type) + '</div>' +
        '<div class="td">' + t(type + 'D') + '</div>' +
        '<div class="td">' + t('damage') + ' ' + d.dmg + ' · ' + t('range') + ' ' + d.range + ' · ' + t('rate') + ' ' + d.rate + '/s</div>' +
        '<div class="tc">🪙 ' + t('cost') + ': ' + d.cost + '</div></button>';
    }
    m.innerHTML = '<h3>' + t('buildTitle') + '</h3><div class="tgrid">' + cards + '</div>' +
      '<div class="rowbtns"><button class="ghost" data-act="close">' + t('close') + '</button></div>';
  } else {
    const tw = pad.tw, st = towerStats(tw.type, tw.level), uc = upgradeCost(tw.type, tw.level);
    const sellVal = Math.floor(tw.invested * 0.7);
    m.innerHTML = '<h3>' + t('selected', { n: t(tw.type), l: tw.level }) + '</h3>' +
      '<div id="selInfo">' + TDEFS[tw.type].icon + ' ' + t('damage') + ': <b>' + st.dmg + '</b> · ' + t('range') + ': <b>' + st.range + '</b> · ' + t('rate') + ': <b>' + st.rate + '/s</b></div>' +
      '<div class="rowbtns">' +
      (uc !== null ? '<button data-act="upgrade" ' + (G.credits < uc ? 'disabled' : '') + '>⬆ ' + t('upCost', { n: uc }) + '</button>' : '<button disabled>' + t('maxLevel') + '</button>') +
      '<button class="ghost" data-act="sell">💰 ' + t('sellFor', { n: sellVal }) + '</button>' +
      '<button class="ghost" data-act="close">' + t('close') + '</button></div>';
  }
}
function placeTower(i, type) {
  const pad = G.pads[i], d = TDEFS[type];
  if (!pad || pad.tw || !d || G.credits < d.cost) return false;
  G.credits -= d.cost;
  pad.tw = { type, level: 1, cool: 0, angle: -Math.PI / 2, invested: d.cost, flash: 0, recoil: 0 };
  burst(pad.x, pad.y, d.color, 10, 70); sfx('place'); updateHUD(); renderMenu();
  return true;
}
$('menu').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-act]'); if (!btn || G.sel < 0) return;
  const pad = G.pads[G.sel], act = btn.getAttribute('data-act');
  if (act === 'close') { closeMenu(); return; }
  if (act === 'build') {
    const type = btn.getAttribute('data-type');
    if (!placeTower(G.sel, type)) { sfx('error'); setMsg(t('notEnough')); }
  } else if (act === 'upgrade' && pad.tw) {
    const uc = upgradeCost(pad.tw.type, pad.tw.level);
    if (uc !== null && G.credits >= uc) { G.credits -= uc; pad.tw.invested += uc; pad.tw.level++; burst(pad.x, pad.y, '#ffd95e', 12, 80); sfx('place'); updateHUD(); renderMenu(); }
    else { sfx('error'); setMsg(t('notEnough')); }
  } else if (act === 'sell' && pad.tw) {
    G.credits += Math.floor(pad.tw.invested * 0.7); burst(pad.x, pad.y, '#ffd95e', 8, 60);
    pad.tw = null; sfx('coin'); updateHUD(); renderMenu();
  }
});
function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX), cy = (ev.touches ? ev.touches[0].clientY : ev.clientY);
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', ev => {
  ac();
  const p = canvasPos(ev);
  let hit = -1, hd = 40;
  G.pads.forEach((pad, i) => { const dd = Math.hypot(pad.x - p.x, pad.y - p.y); if (dd < hd) { hd = dd; hit = i; } });
  if (hit >= 0) { G.sel = hit; renderMenu(); } else closeMenu();
});
$('btnWave').addEventListener('click', startWave);
$('btnPause').addEventListener('click', () => { G.paused = !G.paused; updateHUD(true); });
$('btnSpeed').addEventListener('click', ev => { G.speed = G.speed === 1 ? 2 : 1; ev.currentTarget.textContent = '⏩ ' + G.speed + '×'; });
$('btnRestart').addEventListener('click', () => { resetGame(); });
$('btnAgain').addEventListener('click', () => { resetGame(); });

/* ================= LOOP ================= */
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (!G.paused && !G.over) { const steps = G.speed; for (let i = 0; i < steps; i++) update(dt); }
  else G.time += dt * 0.25;
  draw();
  if ((G.time * 10 | 0) !== (loop._p || 0)) { loop._p = G.time * 10 | 0; if (G.phase === 'wave') updateHUD(); }
}
applyI18n();
resetGame();
requestAnimationFrame(loop);

/* debug / QA hooks */
window.__td = { get G() { return G; }, startWave, place: placeTower, t };
</script>
