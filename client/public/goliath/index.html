<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>¿Qué necesitas? — Frog Fight</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#07130b; --card:#0d2314; --card2:#12301b; --line:#1f4d2c;
    --text:#eefbee; --muted:#9fd3a8; --accent:#ffd23e; --green:#57d93d;
    --good:#37d99a; --radius:18px;
  }
  html,body{ background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; background:
    radial-gradient(900px 480px at 85% -10%, rgba(87,217,61,.20), transparent 60%),
    radial-gradient(700px 420px at -10% 30%, rgba(255,210,62,.10), transparent 60%),
    var(--bg); }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 48px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .frog{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
    background:linear-gradient(145deg,#1d5c2e,#0f3319); border:1px solid var(--line);
    font-size:26px; line-height:1; }
  .brand .name{ font-size:18px; font-weight:800; letter-spacing:.02em; }
  .brand .sub{ font-size:12px; color:var(--muted); }
  .langrow{ margin:0 0 20px; }
  .langrow label{ display:block; font-size:12px; font-weight:700; letter-spacing:.08em;
    color:var(--muted); margin-bottom:7px; text-transform:uppercase; }
  select{ width:100%; font-size:17px; font-weight:600; padding:13px 14px; border-radius:12px;
    background:var(--card2); color:var(--text); border:1px solid var(--line); appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%239fd3a8' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; }
  [dir="rtl"] select{ background-position:left 14px center; }
  h1{ font-size:34px; line-height:1.12; font-weight:900; letter-spacing:-.01em; margin-bottom:10px; }
  h1 .grad{ background:linear-gradient(90deg,var(--green),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subline{ font-size:16px; line-height:1.5; color:var(--muted); margin-bottom:22px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:0 14px 34px rgba(0,0,0,.35); }
  .boxlabel{ display:block; font-size:12px; font-weight:700; letter-spacing:.08em;
    color:var(--muted); margin-bottom:8px; text-transform:uppercase; }
  textarea{ width:100%; min-height:128px; resize:vertical; border-radius:12px;
    background:#081a0e; border:1px solid var(--line); color:var(--text);
    font-size:16px; line-height:1.5; padding:14px; font-family:inherit; }
  textarea:focus{ outline:2px solid var(--green); outline-offset:1px; }
  textarea::placeholder{ color:#5f8a68; }
  .send-btn{ flex:1; padding:16px; font-size:18px; font-weight:800;
    border:none; border-radius:14px; cursor:pointer; color:#14240a;
    background:linear-gradient(90deg,var(--green),#8bf06e);
    box-shadow:0 10px 24px rgba(87,217,61,.25); font-family:inherit; }
  .send-btn:active{ transform:scale(.985); }
  .send-row{ display:flex; gap:10px; margin-top:14px; }
  .attach-btn{ padding:16px 14px; font-size:15px; font-weight:700; border-radius:14px;
    border:1px solid var(--line); background:var(--card2); color:var(--text);
    cursor:pointer; font-family:inherit; white-space:nowrap; }
  .attach-btn:active{ transform:scale(.985); }
  .attach-preview{ margin-top:12px; display:flex; align-items:flex-start; gap:10px; }
  .attach-preview img{ width:84px; height:84px; object-fit:cover; border-radius:12px;
    border:1px solid var(--line); background:#081a0e; }
  .remove-photo{ padding:9px 13px; font-size:13px; font-weight:700; border-radius:10px;
    border:1px solid var(--line); background:transparent; color:#ff8a8a;
    cursor:pointer; font-family:inherit; }
  .req img.thumb{ display:block; margin-top:10px; width:100%; max-width:230px;
    border-radius:12px; border:1px solid var(--line); }
  .send-line{ margin-top:10px; font-size:13px; text-align:center; color:var(--muted); min-height:18px; }
  .send-line.ok{ color:var(--good); font-weight:700; }
  .send-line.bad{ color:#ff8a8a; font-weight:700; }
  .reqs-h{ font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted);
    text-transform:uppercase; margin:26px 0 10px; }
  .empty{ font-size:14px; color:var(--muted); line-height:1.5; padding:6px 2px; }
  .req{ background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:10px; box-shadow:0 10px 24px rgba(0,0,0,.3); }
  .req .meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .req .who{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .req .rid{ font-size:11px; color:#5f8a68; }
  .chip{ font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; margin-inline-start:auto;
    border:1px solid var(--line); color:var(--muted); background:var(--card2); }
  .chip.working{ color:#ffd98a; border-color:rgba(255,210,62,.55); animation:pulse 1.4s ease-in-out infinite; }
  .chip.done{ color:#06281a; background:var(--good); border-color:var(--good); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,210,62,.4);} 50%{ box-shadow:0 0 0 6px rgba(255,210,62,0);} }
  .req .text{ font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .reply{ margin-top:12px; padding-top:11px; border-top:1px dashed var(--line); }
  .reply .who{ color:var(--green); }
  .reply .rtext{ font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  .open-btn{ display:inline-block; margin-top:10px; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:800;
    color:#14240a; text-decoration:none; background:linear-gradient(90deg,var(--accent),#ffdf6b); }
  .req video.media{ display:block; width:100%; margin-top:12px; border-radius:12px;
    border:1px solid var(--line); background:#000; }
  .postbox{ margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px;
    background:var(--card2); }
  .postbox .ptext{ font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  .copy-btn{ display:block; width:100%; margin-top:11px; padding:14px; font-size:16px; font-weight:800;
    border:none; border-radius:12px; cursor:pointer; color:#14240a;
    background:linear-gradient(90deg,var(--accent),#ffdf6b); font-family:inherit; }
  .copy-btn:active{ transform:scale(.985); }
  .foot{ margin-top:26px; text-align:center; font-size:12px; color:#4d7355; }
</style>

    <input type="file" id="photoInput" accept="image/*" style="display:none">
    <div class="send-line" id="sendLine"></div>
  </div>

  <div id="reqList"></div>
  <div class="empty" id="emptyState">Todavía no enviaste ninguna solicitud.</div>

function TP(key){
  var p = PHOTO_STR[langSel.value] || PHOTO_STR.es;
  return p[key] || PHOTO_STR.es[key] || key;
}

/* Deliverable strings (Nov 26, 2026 — Tom's rule: the work lands
   INSIDE this page): a finished video plays right in the request
   card, and a post draft sits in its own box with a one-tap Copy
   button. English and Spanish in full; the other languages fall
   back to English for these strings only. */
var DELIV_STR = {
es:{postLabel:"Tu post — listo para copiar",copyPost:"📋 Copiar post",copied:"¡Copiado ✔",copyFail:"No se pudo copiar — mantén presionado el texto para copiarlo"},
en:{postLabel:"Your post — ready to copy",copyPost:"📋 Copy post",copied:"Copied ✔",copyFail:"Couldn't copy — press and hold the text to copy it"}
};
function TD(key){
  var p = DELIV_STR[langSel.value] || DELIV_STR.en;
  return p[key] || DELIV_STR.en[key] || key;
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function copyPostText(text, btn){
  function done(ok){
    btn.textContent = ok ? TD("copied") : TD("copyFail");
    setTimeout(function(){ btn.textContent = TD("copyPost"); }, 2000);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopy(text)); });
  } else {
    done(fallbackCopy(text));
  }
}

var API = "/api/luna-games?gg=1";
var LS_KEY = "gg:reqs:v1";
var langSel = document.getElementById("lang");
var desc = document.getElementById("desc");
var sendLine = document.getElementById("sendLine");
var reqList = document.getElementById("reqList");
var emptyState = document.getElementById("emptyState");
var myReqs = loadReqs();       /* [{id, text, ts, hasImg}] newest first */
var liveState = {};            /* id -> {stage, reply, link, hasImg} from ggStatus polls */
var pollTimer = null;
var pendingImg = null;         /* downscaled JPEG data URL waiting to send */
var imgCache = {};             /* id -> data URL, memory only (never localStorage) */
var imgAsked = {};             /* id -> true once the full image was fetched */
var attachBtn = document.getElementById("attachBtn");
var photoInput = document.getElementById("photoInput");
var attachPreview = document.getElementById("attachPreview");
var previewImg = document.getElementById("previewImg");
var IMG_CAP = 2450000;         /* data-URL chars; server hard cap is 2,500,000 */

function T(){ return I18N[langSel.value] || I18N.es; }

function loadReqs(){
  try {
    var v = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
    return Array.isArray(v) ? v.filter(function(r){ return r && r.id && r.text; }).slice(0, 30) : [];
  } catch(e){ return []; }
}
function saveReqs(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(myReqs.slice(0, 30))); } catch(e){}
}

function applyLang(){
  var t = T();
  document.documentElement.lang = langSel.value;
  document.documentElement.dir = t.dir || "ltr";
  document.getElementById("langLabel").textContent = t.langName;
  document.getElementById("brandSub").textContent = t.brandSub;
  document.getElementById("headline").innerHTML = t.headline;
  document.getElementById("subline").textContent = t.subline;
  document.getElementById("boxLabel").textContent = t.boxLabel;
  desc.placeholder = t.placeholder;
  document.getElementById("sendBtn").textContent = t.send;
  attachBtn.textContent = TP("attach");
  document.getElementById("removePhotoBtn").textContent = TP("removePhoto");
  document.getElementById("reqsH").textContent = t.yourReqs;
  emptyState.textContent = t.emptyList;
  renderList();
  try { localStorage.setItem("gg:lang", langSel.value); } catch(e){}
}
langSel.addEventListener("change", applyLang);
(function initLang(){
  var saved = null;
  try { saved = localStorage.getItem("gg:lang"); } catch(e){}
  if(saved && I18N[saved]) langSel.value = saved;
})();

function ggPost(body){
  return fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){ return { http: r.status, j: j }; })
      .catch(function(){ return { http: r.status, j: null }; });
  });
}

function setSendLine(msg, cls){
  sendLine.textContent = msg;
  sendLine.className = "send-line" + (cls ? " " + cls : "");
}

function stageOf(id){
  var s = liveState[id];
  return (s && s.stage) || "received";
}
function chipFor(stage){
  var t = T();
  if(stage === "done") return { cls: "chip done", label: t.stDone };
  if(stage === "building" || stage === "preview") return { cls: "chip working", label: t.stWorking };
  return { cls: "chip", label: t.stReceived };
}

function renderList(){
  var t = T();
  reqList.innerHTML = "";
  emptyState.style.display = myReqs.length ? "none" : "";
  myReqs.forEach(function(r){
    var s = liveState[r.id] || {};
    var stage = s.stage || "received";
    var chip = chipFor(stage);
    var card = document.createElement("div");
    card.className = "req";

    var meta = document.createElement("div");
    meta.className = "meta";
    var who = document.createElement("span");
    who.className = "who"; who.textContent = t.youLabel;
    var rid = document.createElement("span");
    rid.className = "rid"; rid.textContent = "#" + r.id;
    var chipEl = document.createElement("span");
    chipEl.className = chip.cls; chipEl.textContent = chip.label;
    meta.appendChild(who); meta.appendChild(rid); meta.appendChild(chipEl);
    card.appendChild(meta);

    var text = document.createElement("div");
    text.className = "text"; text.textContent = r.text;
    card.appendChild(text);

    if((r.hasImg || s.hasImg) && imgCache[r.id]){
      var thumb = document.createElement("img");
      thumb.className = "thumb"; thumb.src = imgCache[r.id]; thumb.alt = "";
      card.appendChild(thumb);
    }

    if(s.media){
      var vid = document.createElement("video");
      vid.className = "media"; vid.src = s.media; vid.controls = true;
      vid.setAttribute("preload", "metadata");
      vid.setAttribute("playsinline", "");
      card.appendChild(vid);
    }

    if(s.post){
      var pb = document.createElement("div");
      pb.className = "postbox";
      var plab = document.createElement("div");
      plab.className = "who"; plab.textContent = TD("postLabel");
      var ptext = document.createElement("div");
      ptext.className = "ptext"; ptext.textContent = s.post;
      var cbtn = document.createElement("button");
      cbtn.type = "button"; cbtn.className = "copy-btn"; cbtn.textContent = TD("copyPost");
      (function(postText, btn){
        btn.addEventListener("click", function(){ copyPostText(postText, btn); });
      })(s.post, cbtn);
      pb.appendChild(plab); pb.appendChild(ptext); pb.appendChild(cbtn);
      card.appendChild(pb);
    }

    if(s.reply){
      var rep = document.createElement("div");
      rep.className = "reply";
      var rwho = document.createElement("div");
      rwho.className = "who"; rwho.textContent = t.replyFrom;
      var rtext = document.createElement("div");
      rtext.className = "rtext"; rtext.textContent = s.reply;
      rep.appendChild(rwho); rep.appendChild(rtext);
      if(s.link){
        var a = document.createElement("a");
        a.className = "open-btn"; a.href = s.link; a.target = "_blank"; a.rel = "noopener";
        a.textContent = t.openLink;
        rep.appendChild(a);
      }
      card.appendChild(rep);
    }
    reqList.appendChild(card);
  });
}

function pollOnce(){
  if(!myReqs.length) return;
  myReqs.slice(0, 20).forEach(function(r){
    ggPost({ action: "ggStatus", id: r.id }).then(function(res){
      if(!res.j || !res.j.ok) return;
      var prev = liveState[r.id] || {};
      var next = { stage: res.j.stage || "received", reply: res.j.reply || null, link: res.j.link || null, hasImg: !!res.j.hasImg, media: res.j.media || null, post: res.j.post || null };
      if(prev.stage !== next.stage || prev.reply !== next.reply || prev.link !== next.link || prev.hasImg !== next.hasImg || prev.media !== next.media || prev.post !== next.post){
        liveState[r.id] = next;
        renderList();
      }
      /* Photo thumbnail: the polls above NEVER carry the image. If
         this record has one and we don't hold it yet, fetch it ONCE
         (explicit img:1) and keep it in memory for the list render. */
      if(next.hasImg && !imgCache[r.id] && !imgAsked[r.id]){
        imgAsked[r.id] = true;
        ggPost({ action: "ggStatus", id: r.id, img: 1 }).then(function(res2){
          if(res2.j && res2.j.ok && res2.j.img){
            imgCache[r.id] = res2.j.img;
            renderList();
          }
        }).catch(function(){ /* thumbnail is best-effort */ });
      }
    }).catch(function(){ /* a failed poll is not fatal — keep waiting */ });
  });
}
function startPoll(){
  if(pollTimer) return;
  pollOnce();
  pollTimer = setInterval(pollOnce, 15000);
}

/* ---------- photo attach: downscale on-device before upload ----------
   Canvas pass: max dimension 1600px, JPEG q0.8. If the data URL is
   still over IMG_CAP, step quality down, then dimensions down, until
   it fits — a phone screenshot lands around a few hundred KB. Only a
   photo that survives all steps still oversize is refused, in his
   language (TP "tooBig"). */
function clearPhoto(){
  pendingImg = null;
  photoInput.value = "";
  previewImg.removeAttribute("src");
  attachPreview.style.display = "none";
}
function processPhoto(file){
  if(!file) return;
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload = function(){
    URL.revokeObjectURL(url);
    var maxDim = 1600, quality = 0.8, data = null, fits = false;
    for(var attempt = 0; attempt < 7; attempt++){
      var scale = Math.min(1, maxDim / Math.max(im.naturalWidth || 1, im.naturalHeight || 1));
      var w = Math.max(1, Math.round((im.naturalWidth || 1) * scale));
      var h = Math.max(1, Math.round((im.naturalHeight || 1) * scale));
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(im, 0, 0, w, h);
      data = cv.toDataURL("image/jpeg", quality);
      if(data.length <= IMG_CAP){ fits = true; break; }
      if(quality > 0.45) quality = Math.round((quality - 0.15) * 100) / 100;
      else { maxDim = Math.round(maxDim * 0.75); quality = 0.7; }
    }
    if(!fits){
      clearPhoto();
      setSendLine(TP("tooBig"), "bad");
      return;
    }
    pendingImg = data;
    previewImg.src = data;
    attachPreview.style.display = "";
    setSendLine("", "");
  };
  im.onerror = function(){
    URL.revokeObjectURL(url);
    clearPhoto();
    setSendLine(T().couldnt, "bad");
  };
  im.src = url;
}
attachBtn.addEventListener("click", function(){ photoInput.click(); });
photoInput.addEventListener("change", function(){
  processPhoto(photoInput.files && photoInput.files[0]);
});
document.getElementById("removePhotoBtn").addEventListener("click", clearPhoto);

document.getElementById("sendBtn").addEventListener("click", function(){
  var text = desc.value.trim();
  var img = pendingImg;
  if(!text && !img){ if(desc.focus) desc.focus(); return; }
  if(!text && img) text = TP("photoOnly");
  setSendLine(T().sending, "");
  var body = { action: "ggSubmit", text: text, lang: langSel.value };
  if(img) body.img = img;
  ggPost(body).then(function(r){
    if(!r.j || !r.j.ok || !r.j.id){
      if(r.j && r.j.error && String(r.j.error).indexOf("image") >= 0){
        setSendLine(TP("tooBig"), "bad");
      } else {
        setSendLine(T().couldnt, "bad");
      }
      return;
    }
    myReqs.unshift({ id: r.j.id, text: text, ts: Date.now(), hasImg: !!img });
    myReqs = myReqs.slice(0, 30);
    saveReqs();
    if(img) imgCache[r.j.id] = img;
    liveState[r.j.id] = { stage: "received", reply: null, link: null, hasImg: !!img, media: null, post: null };
    desc.value = "";
    clearPhoto();
    setSendLine(T().sentOk + r.j.id, "ok");
    renderList();
    startPoll();
  }).catch(function(){
    setSendLine(T().couldnt, "bad");
  });
});

applyLang();
renderList();
if(myReqs.length) startPoll();
</script>
