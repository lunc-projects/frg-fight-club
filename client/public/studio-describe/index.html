<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Describe it. We build it. — LUNC Dev Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0a0e1a; --card:#121830; --card2:#171e3d; --line:#26305e;
    --text:#eef1ff; --muted:#9aa6d6; --accent:#ffb52e; --accent2:#7c5cff;
    --good:#37d99a; --radius:18px;
  }
  html,body{ background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; background:
    radial-gradient(900px 480px at 85% -10%, rgba(124,92,255,.28), transparent 60%),
    radial-gradient(700px 420px at -10% 30%, rgba(255,181,46,.12), transparent 60%),
    var(--bg); }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 48px; }
  .preview-tag{ display:inline-block; font-size:11px; letter-spacing:.14em; font-weight:700;
    color:#ffd98a; background:rgba(255,181,46,.12); border:1px solid rgba(255,181,46,.45);
    padding:5px 10px; border-radius:999px; margin-bottom:14px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .crescent{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    background:linear-gradient(145deg,#1b2450,#10142c); border:1px solid var(--line);
    font-size:24px; color:var(--accent); line-height:1; }
  .brand .name{ font-size:17px; font-weight:800; letter-spacing:.02em; }
  .brand .sub{ font-size:12px; color:var(--muted); }
  .langrow{ margin:0 0 20px; }
  .langrow label{ display:block; font-size:12px; font-weight:700; letter-spacing:.08em;
    color:var(--muted); margin-bottom:7px; text-transform:uppercase; }
  select{ width:100%; font-size:17px; font-weight:600; padding:13px 14px; border-radius:12px;
    background:var(--card2); color:var(--text); border:1px solid var(--line); appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%239aa6d6' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; }
  [dir="rtl"] select{ background-position:left 14px center; }
  h1{ font-size:34px; line-height:1.12; font-weight:900; letter-spacing:-.01em; margin-bottom:10px; }
  h1 .grad{ background:linear-gradient(90deg,var(--accent),#ff7ac8);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subline{ font-size:16px; line-height:1.5; color:var(--muted); margin-bottom:22px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:0 14px 34px rgba(0,0,0,.35); }
  textarea{ width:100%; min-height:128px; resize:vertical; border-radius:12px;
    background:#0c1126; border:1px solid var(--line); color:var(--text);
    font-size:16px; line-height:1.5; padding:14px; font-family:inherit; }
  textarea:focus{ outline:2px solid var(--accent2); outline-offset:1px; }
  textarea::placeholder{ color:#6d79a8; }
  .examples-h{ font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted);
    text-transform:uppercase; margin:16px 0 9px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:14px; font-weight:600; padding:9px 13px; border-radius:999px; cursor:pointer;
    background:var(--card2); color:var(--text); border:1px solid var(--line); }
  .chip:active{ transform:scale(.97); border-color:var(--accent); }
  .build-btn{ width:100%; margin-top:18px; padding:16px; font-size:18px; font-weight:800;
    border:none; border-radius:14px; cursor:pointer; color:#1a1200;
    background:linear-gradient(90deg,var(--accent),#ffc95e);
    box-shadow:0 10px 24px rgba(255,181,46,.25); }
  .build-btn:active{ transform:scale(.985); }
  #result{ display:none; margin-top:18px; }
  #result.show{ display:block; }
  .you-said{ font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted);
    text-transform:uppercase; margin-bottom:6px; }
  .echo{ font-size:15px; line-height:1.55; color:var(--text); background:#0c1126;
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px;
    white-space:pre-wrap; word-break:break-word; }
  .match-title{ font-size:17px; font-weight:800; margin-bottom:6px; }
  .match-title .tick{ color:var(--good); }
  .match-body{ font-size:15px; line-height:1.55; color:var(--muted); }
  .match-body ul{ margin:8px 0 0 18px; }
  .match-body li{ margin:3px 0; }
  .next-step{ margin-top:14px; padding-top:13px; border-top:1px dashed var(--line);
    font-size:15px; line-height:1.55; }
  .preview-note{ margin-top:10px; font-size:12px; color:#6d79a8; text-align:center; }
  .send-line{ margin-top:10px; font-size:13px; text-align:center; color:var(--muted); }
  .send-line.ok{ color:var(--good); font-weight:700; }
  .send-line.bad{ color:#ff8a8a; font-weight:700; }
  .reply-box{ margin-top:14px; padding-top:13px; border-top:1px dashed var(--line); }
  .reply-text{ font-size:15px; line-height:1.55; color:var(--text); background:#0c1126;
    border:1px solid var(--good); border-radius:12px; padding:12px 14px;
    white-space:pre-wrap; word-break:break-word; }
  .foot{ margin-top:26px; text-align:center; font-size:12px; color:#5b6691; }
</style>
</head>

var langSel = document.getElementById("lang");
var desc = document.getElementById("desc");
function applyLang(code){
  var t = I18N[code] || I18N.en;
  document.documentElement.lang = code;
  document.getElementById("wrap").dir = t.dir;
  document.getElementById("headline").innerHTML = t.headline;
  document.getElementById("subline").textContent = t.subline;
  desc.placeholder = t.placeholder;
  document.getElementById("buildBtn").textContent = t.button;
  document.getElementById("examplesH").textContent = t.examples;
}
langSel.addEventListener("change", function(){ applyLang(langSel.value); });

/* ---------- example chips ---------- */
document.querySelectorAll(".chip").forEach(function(ch){
  ch.addEventListener("click", function(){
    desc.value = ch.getAttribute("data-fill");
    desc.focus();
    hideResult();
  });
});

/* ---------- honest matcher: only what the Studio actually builds ---------- */
var PRODUCTS = [
  { key:"racing",
    words:["racing","race","car","cars","driving","driver","grand prix","kart","carrera","corrida","course","rennen","wyścig","гонк","yarış","سباق","दौड़","रेसिंग","রেসিং","赛车","レース","경주","레이싱"],

    title:"📈 Signals page",
    body:"A clean signals page for your group: your pairs, your style, buy/sell calls laid out simply for your members." },

];
var ALL_FOUR = "<ul><li>🏎️ Racing games (Grand Prix engine)</li><li>📈 Signals pages</li><li>🪙 Token launches</li><li>🥊 Fighting games (Arena Clash 3D)</li></ul>";

function esc(s){ return s.replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hideResult(){ stopPoll(); var r=document.getElementById("result"); r.classList.remove("show"); r.innerHTML=""; }

document.getElementById("buildBtn").addEventListener("click", function(){
  var text = desc.value.trim();
  var r = document.getElementById("result");
  if(!text){
    r.innerHTML = '<div class="match-title">✍️ First, tell us what you want</div>' +
      '<div class="match-body">Type a sentence or two in the box above — or tap one of the examples — then press the button again.</div>' +
      '<div class="preview-note">Preview only — nothing was sent.</div>';
    r.classList.add("show");
    r.scrollIntoView({behavior:"smooth", block:"nearest"});
    return;
  }
  var low = " " + text.toLowerCase() + " ";
  var hit = null;
  for(var i=0;i<PRODUCTS.length;i++){
    for(var j=0;j<PRODUCTS[i].words.length;j++){
      if(low.indexOf(PRODUCTS[i].words[j]) !== -1){ hit = PRODUCTS[i]; break; }
    }
    if(hit) break;
  }
  var html = '<div class="you-said">You said</div><div class="echo">' + esc(text) + '</div>';
  if(hit){
    html += '<div class="match-title"><span class="tick">✓</span> We build that: ' + hit.title + '</div>' +
            '<div class="match-body">' + hit.body + '</div>';
  } else {
    html += '<div class="match-title">That one is outside what we make — for now</div>' +
            '<div class="match-body">Honest answer: that is not something the Studio builds yet, and there is no charge for asking. Here is what we do make:' + ALL_FOUR + '</div>';
  }
  html += '<div class="next-step">A builder reviews this and your app build starts — we\'ll show you a preview before anything goes live.</div>' +
          '<div class="send-line" id="sendLine">Sending…</div>' +
          '<div class="reply-box" id="replyBox" style="display:none"><div class="you-said">Builder reply</div><div class="reply-text" id="replyText"></div></div>';
  r.innerHTML = html;
  r.classList.add("show");
  r.scrollIntoView({behavior:"smooth", block:"nearest"});
  sendRequest(text);
});

/* ---------- private test loop: send to the builder inbox, poll for the reply ---------- */
var sdPollTimer = null;
function stopPoll(){ if(sdPollTimer){ clearInterval(sdPollTimer); sdPollTimer = null; } }
function sdPost(payload){
  return fetch("/api/luna-games?sd=1", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
    .then(function(resp){ return resp.json().then(function(j){ return { http: resp.status, j: j }; }); });
}
function sendRequest(text){
  stopPoll();
  var line = document.getElementById("sendLine");
  sdPost({ action:"sdSubmit", text: text, lang: langSel.value }).then(function(r){
    if(!r.j || !r.j.ok || !r.j.id){
      if(line){ line.textContent = "Couldn't send — try again"; line.className = "send-line bad"; }
      return;
    }
    var id = r.j.id;
    if(line){ line.textContent = "Sent ✓ — request #" + id; line.className = "send-line ok"; }
    var tries = 0;
    sdPollTimer = setInterval(function(){
      tries++;
      if(tries > 40){ stopPoll(); return; } /* 40 x 15s = 10 minutes */
      sdPost({ action:"sdStatus", id: id }).then(function(s){
        if(s.j && s.j.ok && s.j.status === "answered" && s.j.reply){
          stopPoll();
          var box = document.getElementById("replyBox");
          var rt = document.getElementById("replyText");
          if(box && rt){
            rt.textContent = s.j.reply;
            box.style.display = "block";
            box.scrollIntoView({behavior:"smooth", block:"nearest"});
          }
        }
      }).catch(function(){ /* a failed poll is not fatal — keep waiting */ });
    }, 15000);
  }).catch(function(){
    if(line){ line.textContent = "Couldn't send — try again"; line.className = "send-line bad"; }
  });
}
</script>
</body>
</html>
