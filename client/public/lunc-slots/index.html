let lang = localStorage.getItem('luncSlotsLang') || 'en';
if (!I[lang]) lang = 'en';
const T = k => (I[lang] && I[lang][k]) || I.en[k] || k;
const langSel = document.getElementById('langSel');
LANGS.forEach(([code,label]) => { const o=document.createElement('option'); o.value=code; o.textContent='🌐 '+label; langSel.appendChild(o); });
langSel.value = lang;
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = T(el.dataset.i); });
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  buildPaytable();
}
langSel.addEventListener('change', () => { lang = langSel.value; localStorage.setItem('luncSlotsLang', lang); applyLang(); clickSnd(); });

/* ---------- Paytable ---------- */
const ptGrid = document.getElementById('ptGrid');
function buildPaytable(){
  ptGrid.innerHTML = '';
  ['crescent','seven','diamond','rocket','coin','star','bell','cherry'].forEach(k => {
    const row = document.createElement('div'); row.className = 'ptRow';
    row.innerHTML = symHTML(k) + '<span>×3</span><span class="mult">' + SYMS[k].pay + '×</span>';
    ptGrid.appendChild(row);
  });
  const row = document.createElement('div'); row.className = 'ptRow wide';
  row.innerHTML = symHTML('cherry') + '<span>' + T('twoCherry') + '</span><span class="mult">2×</span>';
  ptGrid.appendChild(row);
}

/* ---------- Audio (WebAudio synth, no files) ---------- */
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(freq, t0, dur, type, vol){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  const t = ac.currentTime + t0;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .12, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
function clickSnd(){ beep(660, 0, .06, 'square', .07); }
function stopSnd(){ beep(180, 0, .09, 'triangle', .22); beep(90, 0, .12, 'sine', .18); }
function tickSnd(){ beep(1200, 0, .03, 'square', .045); }
function coinSnd(n){ for (let i=0;i<Math.min(n,14);i++){ beep(1568, i*.055, .09, 'square', .08); beep(2093, i*.055 + .03, .12, 'square', .07); } }
function winSnd(big){
  [523,659,784,1047].forEach((f,i) => beep(f, i*.09, .22, 'triangle', .13));
  if (big){ [784,988,1175,1568,2093].forEach((f,i) => beep(f, .38 + i*.1, .3, 'triangle', .14)); coinSnd(16); }
}

/* ---------- State ---------- */
const BETS = [10,25,50,100];
let balance = parseInt(localStorage.getItem('luncSlotsBal'), 10);
if (isNaN(balance) || balance < 0) balance = 1000;
let totalWon = parseInt(localStorage.getItem('luncSlotsWon'), 10) || 0;
let bestWin  = parseInt(localStorage.getItem('luncSlotsBest'), 10) || 0;
let betIdx = parseInt(localStorage.getItem('luncSlotsBet'), 10);
if (isNaN(betIdx) || betIdx < 0 || betIdx >= BETS.length) betIdx = 1;
let spinning = false;

const balVal = document.getElementById('balVal'), wonVal = document.getElementById('wonVal'),
      bestVal = document.getElementById('bestVal'), betVal = document.getElementById('betVal'),
      msg = document.getElementById('msg'), spinBtn = document.getElementById('spinBtn'),
      refillBtn = document.getElementById('refillBtn'), cabinet = document.getElementById('cabinet');
const fmt = n => n.toLocaleString('en-US');
function save(){ localStorage.setItem('luncSlotsBal', balance); localStorage.setItem('luncSlotsWon', totalWon); localStorage.setItem('luncSlotsBest', bestWin); localStorage.setItem('luncSlotsBet', betIdx); }
function render(){
  balVal.textContent = fmt(balance); wonVal.textContent = fmt(totalWon); bestVal.textContent = fmt(bestWin);
  betVal.textContent = BETS[betIdx];
  refillBtn.style.display = (!spinning && balance < BETS[0]) ? 'block' : 'none';
  spinBtn.disabled = spinning;
}
function setMsg(t, big){ msg.textContent = t || ''; msg.className = big ? 'big' : ''; msg.id = 'msg'; }

/* ---------- Reels ---------- */
const CELL_H = () => document.querySelector('.cell').offsetHeight || 72;
const reelsEl = document.getElementById('reels');
const reelEls = [], stripEls = [];
let curGrid = []; // [reel][row] symbol keys currently shown
function makeCell(k){ const d = document.createElement('div'); d.className = 'cell'; d.dataset.sym = k; d.innerHTML = symHTML(k); return d; }
for (let r=0;r<3;r++){
  const reel = document.createElement('div'); reel.className = 'reel';
  const strip = document.createElement('div'); strip.className = 'strip';
  reel.appendChild(strip); reelsEl.appendChild(reel);
  reelEls.push(reel); stripEls.push(strip);
  const start = [randSym(), randSym(), randSym()];
  if (r === 0) start[1] = 'crescent'; if (r === 1) start[1] = 'coin'; if (r === 2) start[1] = 'star';
  curGrid.push(start);
  start.forEach(k => strip.appendChild(makeCell(k)));
}
function setStrip(reel, keys, finalTop){
  const strip = stripEls[reel];
  strip.innerHTML = '';
  keys.forEach(k => strip.appendChild(makeCell(k)));
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(' + (-(keys.length - 3) * CELL_H()) + 'px)';
  if (finalTop) curGrid[reel] = keys.slice(keys.length - 3);
}

/* Spin one reel: build a long strip ending in [top, center, bottom]; returns a Promise. */
function spinReel(reel, result, duration){
  return new Promise(res => {
    const strip = stripEls[reel];
    const filler = [];
    const nFill = 14 + reel * 5;
    for (let i=0;i<nFill;i++) filler.push(randSym());
    const keys = filler.concat(result);
    strip.innerHTML = '';
    keys.forEach(k => strip.appendChild(makeCell(k)));
    const cellH = CELL_H();
    const target = (keys.length - 3) * cellH;
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0px)';
    reelEls[reel].classList.add('spinning');
    let lastTickCell = 0, done = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      strip.style.transition = 'transform ' + duration + 'ms cubic-bezier(.12,.62,.16,1)';
      strip.style.transform = 'translateY(' + (-target) + 'px)';
      const t0 = performance.now();
      (function watch(){
        if (done) return;
        const m = new DOMMatrixReadOnly(getComputedStyle(strip).transform);
        const cell = Math.floor(Math.abs(m.m42) / cellH);
        if (cell !== lastTickCell){ lastTickCell = cell; tickSnd(); }
        if (performance.now() - t0 < duration - 40) requestAnimationFrame(watch);
      })();
    }));
    setTimeout(() => {
      done = true;
      reelEls[reel].classList.remove('spinning');
      setStrip(reel, result, true);
      stopSnd();
      res();
    }, duration + 30);
  });
}

/* ---------- Coin burst ---------- */
function coinBurst(n){
  const rect = cabinet.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height*0.42;
  for (let i=0;i<n;i++){
    const c = document.createElement('div'); c.className = 'coin';
    c.textContent = ''; document.body.appendChild(c);
    const dx = (Math.random()-.5) * rect.width * 1.05;
    const up = 90 + Math.random()*150, down = 220 + Math.random()*160;
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    c.animate([
      { transform:'translate(-50%,-50%) rotateY(0deg)', opacity:1 },
      { transform:'translate(calc(-50% + ' + dx*.6 + 'px), calc(-50% - ' + up + 'px)) rotateY(340deg)', opacity:1, offset:.45 },
      { transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + down + 'px)) rotateY(680deg)', opacity:.15 }
    ], { duration: 950 + Math.random()*550, easing:'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
  }
}

/* ---------- Spin ---------- */
async function spin(){
  if (spinning) return;
  audio();
  const bet0 = BETS[betIdx];
  if (balance < bet0){
    if (balance < BETS[0]){ setMsg(T('needCredits')); refillBtn.style.display = 'block'; save(); render(); return; }
    while (betIdx > 0 && BETS[betIdx] > balance) betIdx--;
    setMsg(''); save(); render();
  }
  spinning = true; cabinet.classList.remove('jackpot');
  document.querySelectorAll('.winCell').forEach(c => c.classList.remove('winCell'));
  setMsg(''); balance -= BETS[betIdx]; save(); render();

  const results = [ [randSym(),randSym(),randSym()], [randSym(),randSym(),randSym()], [randSym(),randSym(),randSym()] ];
  // Near-miss tease: if reels 1+2 land a big center match, slow reel 3 down.
  const c0 = results[0][1], c1 = results[1][1];
  const tease = (c0 === c1 && SYMS[c0].pay >= 25 && results[2][1] !== c0);
  const durations = [1150, 1650, tease ? 2650 : 2150];
  if (tease) setTimeout(() => reelEls[2].classList.add('suspense'), 1650);

  await Promise.all([ spinReel(0, results[0], durations[0]), spinReel(1, results[1], durations[1]), spinReel(2, results[2], durations[2]) ]);
  reelEls[2].classList.remove('suspense');

  // Evaluate center line
  const line = [curGrid[0][1], curGrid[1][1], curGrid[2][1]];
  let mult = 0;
  if (line[0] === line[1] && line[1] === line[2]) mult = SYMS[line[0]].pay;
  else if (line.filter(k => k === 'cherry').length === 2) mult = 2;
  const betNow = BETS[betIdx];
  if (mult > 0){
    const winAmt = betNow * mult;
    balance += winAmt; totalWon += winAmt;
    if (winAmt > bestWin) bestWin = winAmt;
    stripEls.forEach(s => { const cells = s.querySelectorAll('.cell'); if (cells[1]) cells[1].classList.add('winCell'); });
    const isJackpot = mult >= 500;
    setMsg((isJackpot ? T('jackpot') + ' ' : T('win') + ' ') + fmt(winAmt), true);
    if (isJackpot) cabinet.classList.add('jackpot');
    winSnd(mult >= 25);
    coinBurst(mult >= 500 ? 42 : mult >= 25 ? 26 : 14);
    if (mult < 25) coinSnd(6);
  }
  spinning = false; save(); render();
}

/* ---------- Controls ---------- */
spinBtn.addEventListener('click', spin);
document.getElementById('betPlus').addEventListener('click', () => { if (spinning) return; betIdx = Math.min(BETS.length-1, betIdx+1); clickSnd(); save(); render(); });
document.getElementById('betMinus').addEventListener('click', () => { if (spinning) return; betIdx = Math.max(0, betIdx-1); clickSnd(); save(); render(); });
refillBtn.addEventListener('click', () => { balance += 1000; save(); render(); setMsg(T('refilled')); coinSnd(4); });
document.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); spin(); } });
window.addEventListener('resize', () => { for (let r=0;r<3;r++) setStrip(r, curGrid[r], false); });

applyLang();
render();
/* Test hooks (used by automated QA) */
window.__slots = { getState: () => ({ balance, totalWon, bestWin, bet: BETS[betIdx], spinning, grid: curGrid.map(c => c.slice()) }),
  forceGrid: (g) => { for (let r=0;r<3;r++) setStrip(r, g[r], true); },
  setBalance: (n) => { balance = n; save(); render(); }, spin };
</script>
