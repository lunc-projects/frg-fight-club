<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tom's Dev — Closed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0e1a;
    color: #f2f4fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px 18px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: #12172b;
    border: 1px solid rgba(244, 197, 66, .25);
    border-radius: 22px;
    padding: 40px 24px 34px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }
  .crescent { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
  .brand {
    font-size: 13px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #f4c542;
    font-weight: 700;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
    margin-bottom: 14px;
  }
  p {
    font-size: 16px;
    line-height: 1.5;
    color: #c6cbdd;
    margin-bottom: 30px;
  }
  .btn {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, #ffd75e, #f4b91e);
    color: #241a02;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    padding: 17px 20px;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(244, 185, 30, .35);
  }
  .btn:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <svg class="crescent" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M63.5 8 A44 44 0 1 0 63.5 92 A35 35 0 1 1 63.5 8 Z" fill="#f4c542"/>
    </svg>
    <div class="brand">LUNC Dev Studio</div>
    <h1>Tom's Dev has closed</h1>
    <p>Everything has moved to LUNC Dev Studio — the website is where you order now.</p>
    <a class="btn" href="https://luncdevstudio.com">Go to LUNC Dev Studio</a>
  </main>
</body>
</html>
