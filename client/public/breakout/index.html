<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Luna Balloon Breakout — LUNC Dev Studio Arcade</title>
<meta name="description" content="Luna Balloon Breakout: pop the whole sky! Glossy party balloons, gold LUNC crescent balloons, USTC star balloons, multi-ball and burst effects — a Luna Classic arcade game by LUNC Dev Studio.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --gold:#f5c542; --gold2:#ffdf7e; --ink:#0b1026; --panel:#131a3a; --panel2:#0e1430;
    --teal:#37e0c8; --red:#ff5470; --txt:#eef1ff; --dim:#9aa5d8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#05070f;color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
  body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 90% at 50% 0%,#14204d 0%,#05070f 55%,#02030a 100%);padding:10px 8px 26px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body.playing{overflow:hidden;position:fixed;inset:0;width:100%;height:100dvh;padding:0}
  body.playing .wrap{height:100dvh;display:flex;flex-direction:column;padding:4px 0}
  body.playing .cabinet{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  body.playing .pfbox{flex:1 1 auto;min-height:0}
  body.playing .topbar{margin-bottom:2px}
  /* header-hide during play (owner Nov 7): reclaim the top of the screen for the field */
  body.playing .topbar{display:none}
  body.playing .marquee{display:none}
  body.playing .pfbox{aspect-ratio:auto}
  /* shrink the play box to the drawn world's aspect so no dark band
     remains inside the canvas element (fit() reads clientWidth/Height) */
  #game.playfit{aspect-ratio:800/920}
  body.playing .strip,body.playing .hintline,body.playing .foot{display:none}
  body.playing .hud{margin-top:0;padding:4px 12px}
  body.playing .cabinet{padding:6px 8px}
  body.playing .pfbox{margin-top:4px}
  .wrap{max-width:452px;margin:0 auto;position:relative;z-index:3}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px}
  .topbar .brand{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--gold);text-transform:uppercase}
  .topbar .brand small{display:block;color:var(--dim);letter-spacing:.08em;font-weight:600;font-size:10px}
  .tools{display:flex;gap:6px;align-items:center}
  .tools select{background:var(--panel);color:var(--txt);border:1px solid #2b3768;border-radius:9px;padding:7px 6px;font-size:13px;max-width:128px}
  .iconbtn{background:var(--panel);border:1px solid #2b3768;color:var(--txt);border-radius:9px;padding:7px 10px;font-size:15px;cursor:pointer}
  .iconbtn:active{transform:scale(.95)}

  /* ============ THE CABINET (3D-table presentation) ============ */
  .cabinet{background:linear-gradient(180deg,#1a1030 0%,#120a24 100%);border-radius:22px;padding:10px 10px 12px;box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid #2c1e52;transform-origin:50% 0;transform:perspective(1150px) rotateX(2.2deg)}
  .marquee{background:linear-gradient(180deg,#241645,#170d33);border:2px solid #3a2766;border-radius:14px;padding:10px 12px 11px;box-shadow:inset 0 0 24px rgba(0,0,0,.55);position:relative;overflow:hidden;text-align:center}
  .marquee::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
  .marquee h1{font-size:23px;letter-spacing:.02em;font-weight:900;color:var(--gold2);text-shadow:0 0 14px rgba(245,197,66,.55),0 2px 0 #7a4d00;font-style:italic;white-space:nowrap}
  .marquee .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);font-weight:800;margin-top:3px}
  .marquee img.badge{display:block;width:86px;height:auto;margin:2px auto 6px;filter:drop-shadow(0 4px 12px rgba(245,197,66,.35))}
  .hud{display:flex;align-items:center;gap:8px;margin-top:10px;background:linear-gradient(90deg, rgba(40,26,4,.88), rgba(6,44,54,.88));border-radius:999px;padding:7px 14px;border:1.5px solid rgba(255,215,106,.4);box-shadow:0 0 18px rgba(255,183,0,.18),0 4px 18px rgba(0,0,0,.5)}
  .hud .lives{font-size:14px;letter-spacing:1px;min-width:52px}
  .hud .lvl{font-weight:900;font-size:11.5px;letter-spacing:.08em;color:#ffe9a8;white-space:nowrap}
  .hud .score{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;flex:1;text-align:right}
  .hud .sclbl{font-size:9px;letter-spacing:.18em;color:var(--dim);font-weight:800}
  .pfbox{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #060812,0 0 34px rgba(30,60,180,.25);background:#070b22;margin-top:10px;aspect-ratio:40/27;min-height:200px}
  #game{display:block;width:100%;height:100%;touch-action:none}
  /* Overlays */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;background:rgba(4,6,20,.86);backdrop-filter:blur(2.5px);z-index:8;padding:18px 16px;text-align:center;overflow-y:auto}
  .screen.show{display:flex}
  .screen h2{font-size:27px;letter-spacing:.06em;color:var(--gold2);text-shadow:0 0 16px rgba(245,197,66,.5)}
  .screen h3{font-size:20px;color:var(--gold2)}
  .screen p{font-size:14px;line-height:1.5;color:var(--txt);max-width:340px}
  .screen .tag{color:var(--dim);font-size:13.5px}
  .screen img.badge{width:104px;height:auto;filter:drop-shadow(0 6px 18px rgba(245,197,66,.4))}
  .play{border:none;border-radius:11px;padding:13px 22px;font-size:16.5px;font-weight:900;letter-spacing:.04em;cursor:pointer;color:#231600;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d99a17);box-shadow:0 4px 0 #8a5f06;text-transform:uppercase;min-width:210px}
  .play:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5f06}
  .play.alt{background:linear-gradient(180deg,#2a3565,#1b2450);color:var(--txt);box-shadow:0 4px 0 #0c1130;border:1px solid #3a4a8a}
  .play.small{min-width:0;padding:9px 15px;font-size:13.5px}
  .play:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
  .howbody{text-align:left;font-size:13.5px;line-height:1.6;max-width:340px;color:var(--txt)}
  .howbody b{color:var(--gold2)}
  #nameInput{background:#0a0f2c;border:1.5px solid #3a4a8a;border-radius:10px;color:var(--txt);font-size:17px;padding:11px 13px;text-align:center;width:230px;font-weight:700}
  #nameInput:focus{outline:none;border-color:var(--gold)}
  .boardlist{width:100%;max-width:340px;max-height:300px;overflow-y:auto}
  .boardlist .row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(90,110,200,.16);font-size:15px}
  .boardlist .row .rk{color:var(--gold);font-weight:900;width:30px;text-align:right;flex:0 0 auto}
  .boardlist .row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .boardlist .row .sc{font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:7px}
  .statusline{font-size:13px;color:var(--teal);min-height:17px;font-weight:700}
  .finalscore{font-size:41px;font-weight:900;color:var(--gold2);text-shadow:0 0 18px rgba(245,197,66,.5);font-variant-numeric:tabular-nums;line-height:1}
  .statsline{font-size:13px;color:var(--dim)}
  /* Strips + footer */
  .strip{margin-top:12px;background:linear-gradient(90deg,rgba(20,60,44,.85),rgba(13,40,30,.85));border:1px solid #1f7a4d;border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.45;text-align:center;color:#c9f5dd}
  /* floating strip + tools during play: security note + pause/sound/lang stay on top of the taller field */
  body.playing .strip{display:block;position:fixed;left:6px;right:6px;bottom:4px;margin-top:0;padding:5px 10px;font-size:10.5px;border-radius:9px;background:linear-gradient(90deg,rgba(20,60,44,.92),rgba(13,40,30,.92));z-index:30;pointer-events:none}
  body.playing .tools{position:fixed;top:6px;right:6px;z-index:30}
  body.playing .tools select{background:rgba(19,26,58,.9)}
  body.playing .tools .iconbtn{background:rgba(19,26,58,.9)}
  /* In-play pause (Nov 7 fix): the header .tools cluster lives INSIDE .topbar,
     and body.playing sets .topbar{display:none} — display:none on an ancestor
     removes the whole subtree, so the header ⏸ can never paint during play
     (its own computed display stayed "block" while its rect collapsed to 0×0).
     This dedicated twin lives OUTSIDE .topbar, exists only while playing, and
     is wired to the same togglePause(). HUD gets right room so SCORE stays clear. */
  #pauseBtnPlay{display:none}
  body.playing #pauseBtnPlay{display:flex;align-items:center;justify-content:center;position:fixed;top:6px;right:6px;z-index:40;min-width:48px;min-height:48px;padding:7px 10px;font-size:19px;line-height:1;background:rgba(19,26,58,.92);border:1px solid #2b3768;color:var(--txt);border-radius:9px;cursor:pointer}
  body.playing #pauseBtnPlay:active{transform:scale(.95)}
  body.playing .hud{padding-right:64px}
  .strip b{color:#7dffb0}
  .hintline{text-align:center;color:var(--dim);font-size:12px;margin-top:9px;line-height:1.5}
  .foot{text-align:center;color:#5d6794;font-size:11px;margin-top:12px;letter-spacing:.06em}
  .foot b{color:#8b96c4}
  /* Loading splash */
  #splash{position:fixed;inset:0;z-index:60;background:#05070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:150px;height:auto;filter:drop-shadow(0 8px 26px rgba(245,197,66,.45))}
  #splash .st{font-size:11px;letter-spacing:.34em;color:var(--dim);font-weight:800}
  #splash .bar{width:170px;height:5px;border-radius:99px;background:#1b2450;overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:ld 1s infinite alternate}
  @keyframes ld{from{transform:translateX(-30px)}to{transform:translateX(150px)}}
  @media (max-width:380px){ .marquee h1{font-size:19px} }
</style>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta property="og:image" content="https://frg-fight-club.vercel.app/lds-games-logo.webp"></head>
<body>
<div id="splash" aria-hidden="true">
  <img id="splashImg" alt="Luna Classic">
  <div class="st">LUNC DEV STUDIO</div>
  <div class="bar"><i></i></div>
</div>

<div class="wrap">
  <div class="topbar">
    <div class="brand">LUNC Dev Studio<small>Arcade · Luna Classic</small></div>
    <div class="tools">
      <select id="langSel" aria-label="Language"></select>
      <button class="iconbtn" id="muteBtn" aria-label="Sound">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </div>
  <button id="pauseBtnPlay" aria-label="Pause">⏸</button>

  <div class="cabinet">
    <div class="marquee">
      <img class="badge" id="menuBadge" alt="Luna Classic">
      <h1>🎈 LUNA BALLOON BREAKOUT</h1>
      <div class="sub">LUNA CLASSIC · LUNC DEV STUDIO</div>
    </div>

    <div class="hud">
      <div class="lives" id="hudLives">🌕🌕🌕</div>
      <div class="lvl" id="hudLevel">LEVEL 1</div>
      <div><div class="sclbl">SCORE</div><div class="score" id="hudScore">0</div></div>
    </div>

    <div class="pfbox">
      <canvas id="game" width="420" height="560" aria-label="Luna Balloon Breakout playfield"></canvas>

      <div class="screen show" id="menuScreen">
        <img class="badge" id="menuBadge2" alt="Luna Classic">
        <h2>🎈 BALLOON BREAKOUT</h2>
        <p class="tag" data-i18n="tag"></p>
        <button class="play" id="startBtn">▶ PLAY</button>
        <button class="play alt" id="howBtn" data-i18n="howBtn"></button>
        <button class="play alt" id="boardBtn" data-i18n="boardBtn"></button>
        <p class="tag" data-i18n="hint"></p>
      </div>

      <div class="screen" id="howScreen">
        <h3 data-i18n="howTitle"></h3>
        <div class="howbody" data-i18n-html="howBody"></div>
        <button class="play small" id="howClose" data-i18n="close"></button>
      </div>

      <div class="screen" id="boardScreen">
        <h3 data-i18n="boardTitle"></h3>
        <div class="tabs">
          <button class="play small" id="tabAll" data-i18n="allTime"></button>
          <button class="play small alt" id="tabWeek" data-i18n="week"></button>
        </div>
        <div class="boardlist" id="boardList"></div>
        <button class="play small" id="boardClose" data-i18n="close"></button>
      </div>

      <div class="screen" id="overScreen">
        <h2 data-i18n="gameOver"></h2>
        <div class="statsline" data-i18n="finalScore"></div>
        <div class="finalscore" id="finalScore">0</div>
        <div class="statsline" id="overStats"></div>
        <div class="statsline" id="bestLine"></div>
        <input id="nameInput" maxlength="16" autocomplete="off" data-i18n-ph="namePh">
        <button class="play" id="submitBtn" data-i18n="submitBtn"></button>
        <div class="statusline" id="submitStatus"></div>
        <button class="play alt" id="overBoardBtn" data-i18n="boardBtn"></button>
        <button class="play alt" id="againBtn" data-i18n="againBtn"></button>
      </div>

      <div class="screen" id="pauseScreen">
        <h2 data-i18n="paused"></h2>
        <button class="play" id="resumeBtn" data-i18n="resumeBtn"></button>
        <button class="play alt" id="quitBtn" data-i18n="quitBtn"></button>
      </div>
    </div>
  </div>

  <div class="strip" data-i18n-html="secStrip"></div>
  <div class="hintline" data-i18n="hint"></div>
  <div class="foot"><b>LUNA BALLOON BREAKOUT</b> · LUNC DEV STUDIO · LUNA CLASSIC</div>
</div>

wegen · Tik om te lanceren", "lvl": "LEVEL {l}", "lives": "Ballen", "howBody": "<b>🎈 De ballonnen:</b> elk doel is een glanzende ballon. Raak er een en hij <b>KNALT</b> — scherven, confetti en punten! Gewone ballonnen <b>+10</b>, de verwarde <b>feestballonnen +25</b>, en de donkere <b>harde ballonnen</b> hebben twee treffers nodig (ze barsten eerst).<br><b>🌙 Speciaal:</b> knal de gouden <b>LUNC-sikkel</b>-ballon voor +50 en bonusballen in de lucht — <b>MULTIBAL</b>! Knal de <b>USTC-ster</b>-ballon voor +50 en een vallende ster: vang hem voor een <b>brede peddel</b>.<br><b>🕹 Besturing:</b> sleep ergens om de peddel te bewegen — hij volgt je duim. Tik om de bal te lanceren. Toetsenbord: ← → en Spatie.<br><b>🎯 Doel:</b> knal alle ballonnen om een level te stijgen — de bal gaat elke keer sneller. Je hebt <b>3 ballen</b>. Laat er geen één door!"}, "ru": {"tag": "Взорви всё небо! Отбивай золотой шар ракеткой и ЛОПАЙ каждый шарик — глянцевые праздничные шары, золотые полумесяцы LUNC и звёзды USTC. Зачисти поле и поднимись на уровень выше!", "howBtn": "КАК ИГРАТЬ", "boardBtn": "🏆 РЕЙТИНГ", "boardTitle": "🏆 РЕЙТИНГ", "howTitle": "Как играть", "close": "ЗАКРЫТЬ", "allTime": "За всё время", "week": "Эта неделя", "loading": "Загрузка…", "noScores": "Пока нет результатов — стань первым!", "boardOff": "Рейтинг недоступен — продолжай лопать!", "gameOver": "ИГРА ОКОНЧЕНА", "finalScore": "Итоговые очки", "submitBtn": "СОХРАНИТЬ", "saved": "Сохранено!", "savedRank": "🏆 Ты №{n} за всё время!", "saveFail": "Не удалось сохранить — попробуй ещё раз.", "namePh": "Твоё имя", "againBtn": "ИГРАТЬ СНОВА", "paused": "ПАУЗА", "resumeBtn": "ДАЛЬШЕ", "quitBtn": "В МЕНЮ", "bestDevice": "Рекорд на этом устройстве: {s}", "overStats": "Достигнут уровень: {l} · Лопнуто шариков: {p}", "pop": "ХЛОП!", "bigPop": "БОЛЬШОЙ ХЛОП +{p}!", "wideOn": "ШИРОКАЯ РАКЕТКА!", "wideOff": "Ракетка обычная", "secStrip": "🔒 Каждая игра здесь бесплатна и никогда не просит подключить кошелёк или что-то подписать, чтобы играть. Любая страница, которая это просит, — подделка.", "hint": "Веди пальцем · Коснись, чтобы запустить", "lvl": "УРОВЕНЬ {l}", "lives": "Шары", "howBody": "<b>🎈 Шарики:</b> каждая цель — глянцевый шарик. Попади по нему, и он <b>ЛОПНЕТ</b> — осколки, конфетти и очки! Обычные шарики <b>+10</b>, взъерошенные <b>праздничные шарики +25</b>, а тёмные <b>крепкие шарики</b> выдерживают два удара (сначала трескаются).<br><b>🌙 Особые:</b> лопни золотой шарик с <b>полумесяцем LUNC</b> — +50 и бонусные шары в воздухе: <b>МУЛЬТИШАР</b>! Лопни шарик со <b>звездой USTC</b> — +50 и падающая звезда: поймай её и получи <b>широкую ракетку</b>.<br><b>🕹 Управление:</b> веди пальцем в любом месте — ракетка следует за большим пальцем. Коснись, чтобы запустить шар. Клавиатура: ← → и Пробел.<br><b>🎯 Цель:</b> лопни все шарики, чтобы подняться на уровень — шар ускоряется каждый раз. У тебя <b>3 шара</b>. Не пропусти ни одного!"}, "uk": {"tag": "Підірви все небо! Відбивай золоту кулю ракеткою і ЛОПАЙ кожну кульку — глянцеві святкові кулі, золоті півмісяці LUNC та зірки USTC. Зачисть поле й піднімися на рівень вище!", "howBtn": "ЯК ГРАТИ", "boardBtn": "🏆 РЕЙТИНГ", "boardTitle": "🏆 РЕЙТИНГ", "howTitle": "Як грати", "close": "ЗАКРИТИ", "allTime": "За весь час", "week": "Цей тиждень", "loading": "Завантаження…", "noScores": "Поки немає результатів — стань першим!", "boardOff": "Рейтинг недоступний — продовжуй лопати!", "gameOver": "ГРУ ЗАВЕРШЕНО", "finalScore": "Підсумкові очки", "submitBtn": "ЗБЕРЕГТИ", "saved": "Збережено!", "savedRank": "🏆 Ти №{n} за весь час!", "saveFail": "Не вдалося зберегти — спробуй ще раз.", "namePh": "Твоє ім'я", "againBtn": "ГРАТИ ЗНОВУ", "paused": "ПАУЗА", "resumeBtn": "ДАЛІ", "quitBtn": "ДО МЕНЮ", "bestDevice": "Рекорд на цьому пристрої: {s}", "overStats": "Досягнуто рівень: {l} · Лопнуто кульок: {p}", "pop": "БАХ!", "bigPop": "ВЕЛИКИЙ БАХ +{p}!", "wideOn": "ШИРОКА РАКЕТКА!", "wideOff": "Ракетка звичайна", "secStrip": "🔒 Кожна гра тут безкоштовна й ніколи не просить підключити гаманець чи щось підписати, щоб грати. Будь-яка сторінка, що це просить, — підробка.", "hint": "Веди пальцем · Торкнися, щоб запустити", "lvl": "РІВЕНЬ {l}", "lives": "Кулі", "howBody": "<b>🎈 Кульки:</b> кожна ціль — глянцева кулька. Влуч у неї, і вона <b>ЛОПНЕ</b> — уламки, конфеті й очки! Звичайні кульки <b>+10</b>, розпатлані <b>святкові кульки +25</b>, а темні <b>міцні кульки</b> витримують два удари (спочатку тріскаються).<br><b>🌙 Особливі:</b> лопни золоту кульку з <b>півмісяцем LUNC</b> — +50 і бонусні кулі в повітрі: <b>МУЛЬТИКУЛЯ</b>! Лопни кульку із <b>зіркою USTC</b> — +50 і зірка, що падає: спіймай її й отримай <b>широку ракетку</b>.<br><b>🕹 Керування:</b> веди пальцем будь-де — ракетка йде за великим пальцем. Торкнися, щоб запустити кулю. Клавіатура: ← → та Пробіл.<br><b>🎯 Мета:</b> лопни всі кульки, щоб піднятися на рівень — куля щоразу швидша. У тебе <b>3 кулі</b>. Не пропусти жодної!"}, "tr": {"tag": "Tüm gökyüzünü patlat! Altın topu raketinle sektir ve her balonu PATLAT — parlak parti balonları, altın LUNC hilalleri ve USTC yıldızları. Alanı temizle, seviye atla!", "howBtn": "NASIL OYNANIR", "boardBtn": "🏆 SIRALAMA", "boardTitle": "🏆 SIRALAMA", "howTitle": "Nasıl oynanır", "close": "KAPAT", "allTime": "Tüm zamanlar", "week": "Bu hafta", "loading": "Yükleniyor…", "noScores": "Henüz skor yok — ilk sen ol!", "boardOff": "Sıralama şu an yok — patlatmaya devam!", "gameOver": "OYUN BİTTİ", "finalScore": "Final skoru", "submitBtn": "KAYDET", "saved": "Kaydedildi!", "savedRank": "🏆 Tüm zamanlarda {n}. sıradasın!", "saveFail": "Kaydedilemedi — tekrar dene.", "namePh": "Adın", "againBtn": "TEKRAR OYNA", "paused": "DURAKLATILDI", "resumeBtn": "DEVAM", "quitBtn": "MENÜYE ÇIK", "bestDevice": "Bu cihazdaki en iyi: {s}", "overStats": "Ulaşılan seviye: {l} · Patlatılan balon: {p}", "pop": "PAT!", "bigPop": "BÜYÜK PAT +{p}!", "wideOn": "GENİŞ RAKET!", "wideOff": "Raket normal", "secStrip": "🔒 Buradaki her oyun ücretsizdir ve oynamak için asla cüzdan bağlamanı ya da bir şey imzalamanı istemez. Bunu isteyen her sayfa sahtedir.", "hint": "Sürükleyerek hareket et · Başlatmak için dokun", "lvl": "SEVİYE {l}", "lives": "Toplar", "howBody": "<b>🎈 Balonlar:</b> her hedef parlak bir balon. Birine vur, <b>PATLASIN</b> — parçalar, konfeti ve puan! Normal balonlar <b>+10</b>, dağınık <b>parti balonları +25</b>, koyu <b>dayanıklı balonlar</b> ise iki vuruş ister (önce çatlar).<br><b>🌙 Özeller:</b> altın <b>LUNC hilali</b> balonunu patlat: +50 ve havada bonus toplar — <b>ÇOKLU TOP</b>! <b>USTC yıldızı</b> balonunu patlat: +50 ve düşen bir yıldız — yakala ve <b>geniş raket</b> kazan.<br><b>🕹 Kontroller:</b> raketi hareket ettirmek için herhangi bir yere sürükle — başparmağını takip eder. Topu başlatmak için dokun. Klavye: ← → ve Boşluk.<br><b>🎯 Hedef:</b> seviye atlamak için tüm balonları patlat — top her seferinde hızlanır. <b>3 topun</b> var. Hiçbirini kaçırma!"}, "ar": {"tag": "فجّر السماء كلها! ارتد بالكرة الذهبية عن مضربك وفجّر كل بالونة — بالونات حفلات لامعة، وأهلّة LUNC ذهبية ونجوم USTC. نظّف الساحة واصعد بالمستويات!", "howBtn": "كيف تلعب", "boardBtn": "🏆 لوحة الشرف", "boardTitle": "🏆 لوحة الشرف", "howTitle": "كيف تلعب", "close": "إغلاق", "allTime": "كل الأوقات", "week": "هذا الأسبوع", "loading": "جارٍ التحميل…", "noScores": "لا نتائج بعد — كن الأول!", "boardOff": "اللوحة غير متاحة الآن — واصل التفجير!", "gameOver": "انتهت اللعبة", "finalScore": "النتيجة النهائية", "submitBtn": "حفظ النتيجة", "saved": "تم الحفظ!", "savedRank": "🏆 أنت رقم {n} على الإطلاق!", "saveFail": "تعذّر الحفظ — حاول مجددًا.", "namePh": "اسمك", "againBtn": "العب مجددًا", "paused": "إيقاف مؤقت", "resumeBtn": "استئناف", "quitBtn": "الخروج إلى القائمة", "bestDevice": "الأفضل على هذا الجهاز: {s}", "overStats": "وصلت إلى المستوى {l} · بالونات فُجّرت: {p}", "pop": "فرقعة!", "bigPop": "فرقعة كبيرة +{p}!", "wideOn": "مضرب عريض!", "wideOff": "المضرب عادي", "secStrip": "🔒 كل لعبة هنا مجانية ولا تطلب منك أبدًا توصيل محفظة أو توقيع أي شيء للعب. أي صفحة تطلب ذلك فهي مزيفة.", "hint": "اسحب للتحرك · المس للإطلاق", "lvl": "المستوى {l}", "lives": "الكرات", "howBody": "<b>🎈 البالونات:</b> كل هدف بالونة لامعة. اضرب واحدة فتنفجر — شظايا وقصاصات ونقاط! البالونات العادية <b>+10</b>، و<b>بالونات الحفلات +25</b>، والبالونات <b>القوية</b> الداكنة تحتاج ضربتين (تتشقق أولًا).<br><b>🌙 المميزات:</b> فجّر بالونة <b>هلال LUNC</b> الذهبية لتحصل على +50 وكرات إضافية في الهواء — <b>كرات متعددة</b>! فجّر بالونة <b>نجمة USTC</b> لتحصل على +50 ونجمة ساقطة: التقطها لتحصل على <b>مضرب عريض</b>.<br><b>🕹 التحكم:</b> اسحب في أي مكان لتحريك المضرب — يتبع إبهامك. المس لإطلاق الكرة. لوحة المفاتيح: ← → ومسافة.<br><b>🎯 الهدف:</b> فجّر كل البالونات لتصعد مستوى — الكرة تسرع في كل مرة. لديك <b>3 كرات</b>. لا تدع أيًا منها يفلت!"}, "hi": {"tag": "पूरा आसमान फोड़ दो! सुनहरी गेंद को अपने पैडल से उछालो और हर गुब्बारा फोड़ो — चमकदार पार्टी गुब्बारे, सुनहरे LUNC अर्धचंद्र और USTC तारे। मैदान साफ़ करो, लेवल चढ़ो!", "howBtn": "कैसे खेलें", "boardBtn": "🏆 लीडरबोर्ड", "boardTitle": "🏆 लीडरबोर्ड", "howTitle": "कैसे खेलें", "close": "बंद करें", "allTime": "सर्वकालिक", "week": "इस सप्ताह", "loading": "लोड हो रहा है…", "noScores": "अभी कोई स्कोर नहीं — पहले बनो!", "boardOff": "बोर्ड अभी उपलब्ध नहीं — फोड़ते रहो!", "gameOver": "खेल ख़त्म", "finalScore": "अंतिम स्कोर", "submitBtn": "स्कोर सहेजें", "saved": "सहेजा गया!", "savedRank": "🏆 आप सर्वकालिक #{n} हैं!", "saveFail": "सहेज नहीं सका — फिर कोशिश करें।", "namePh": "आपका नाम", "againBtn": "फिर खेलें", "paused": "रुका हुआ", "resumeBtn": "जारी रखें", "quitBtn": "मेनू पर जाएँ", "bestDevice": "इस डिवाइस पर सर्वश्रेष्ठ: {s}", "overStats": "लेवल {l} तक पहुँचे · गुब्बारे फोड़े: {p}", "pop": "पॉप!", "bigPop": "बड़ा पॉप +{p}!", "wideOn": "चौड़ा पैडल!", "wideOff": "पैडल सामान्य", "secStrip": "🔒 यहाँ हर खेल मुफ़्त है और खेलने के लिए कभी वॉलेट जोड़ने या कुछ साइन करने को नहीं कहता। जो पेज ऐसा कहे, वह नकली है।", "hint": "चलाने के लिए खींचें · लॉन्च के लिए टैप करें", "lvl": "लेवल {l}", "lives": "गेंदें", "howBody": "<b>🎈 गुब्बारे:</b> हर लक्ष const IW = 800;                       /* virtual world width — fixed */
let W = IW, H = VH, SCALE = 1, OX = 0, OY = 0;
function fit(){
  /* Buffer = canvas CSS box x devicePixelRatio (capped at 2). The ENTIRE
     800x540 world is letterboxed inside it: one uniform SCALE plus centering
     offsets (OX, OY) — every column, every row and the paddle zone visible. */
  let cw = cv.clientWidth || 0, ch = cv.clientHeight || 0;
  if (document.body.classList.contains('playing')){
    /* No vertical letterbox during play (owner Nov 7: "remove the stuff
       at the top so that there is room to play") — the old fixed 800x540
       fit left huge dark bands on a tall phone. Compute the viewport and
       grow the WORLD height instead: VH_now = 800 x (boxH/boxW) keeps the
       same uniform SCALE as the menu, so balloons keep their size/proportions
       and the freed vertical space becomes real play room above the paddle.
       Row positions ride in the fixed top grid; walls/paddle/pops re-anchor
       from VH_now every frame. Height is capped at 920 world units so
       absurdly tall screens stay playable.
       FIRST PASS problem: the .pfbox flex-grows to the full column height,
       so clientHeight is the TALL box and VH_now would peg at the cap with
       the world letterboxed inside it anyway. So first size the canvas
       element to the capped world's aspect (class playfit) and re-measure
       against THAT height — the box then matches the world exactly. */
    if (!cv.classList.contains('playfit')){
      cv.classList.add('playfit');
      cw = cv.clientWidth || cw; ch = cv.clientHeight || ch;
    }
    const cbw = cw, cbh = ch;
    let vhN = Math.round(800 * (cbh / Math.max(1, cbw)));
    vhN = Math.max(VH, Math.min(920, vhN));
    if (vhN !== VH_now){
      VH_now = vhN;
      updateWorldHeight();
    }
  } else {
    if (cv.classList.contains('playfit')) cv.classList.remove('playfit');
    if (VH_now !== VH){
      VH_now = VH;
      updateWorldHeight();
    }
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (cw > 0 && ch > 0){
    const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
    if (cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  }
  W = cv.width; H = cv.height;
  SCALE = Math.min(W / IW, H / VH_now);
  OX = (W - IW * SCALE) / 2;
  OY = (H - VH_now * SCALE) / 2;
}
function updateWorldHeight(){
  /* Re-anchor everything that hangs off the world height. Balls live in
     world coords, so a height change mid-flight maps them proportionally —
     they keep their relative spot instead of jumping. Called by fit()
     only when VH_now actually changed. */
  const ratio = VH_now / (updateWorldHeight._prev || VH);
  updateWorldHeight._prev = VH_now;
  PADDLE_Y = VH_now - 30;
  if (typeof balls !== 'undefined' && Array.isArray(balls)){
    for (const b of balls){ b.y *= ratio; }
  }
  if (typeof capsule !== 'undefined' && capsule){ capsule.y *= ratio; }
  if (typeof state !== 'undefined' && state === 'serve' && typeof resetBallOnPaddle === 'function'){
    resetBallOnPaddle();
  }
}
function refit(){
  /* fit() once on the next frame (layout settled after the class
     toggle), again shortly after for late layout/visualViewport settle */
  requestAnimationFrame(fit);
  setTimeout(fit, 250);
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= AUDIO (all synthesized, no files) ================= */
let AC = null, muted = localStorage.getItem('lunaBreakoutMute') === '1';
function ensureAudio(){
  if (AC) { if (AC.resume) AC.resume(); return; }
  if (muted) return;
  try { const Ctx = window.AudioContext || window.webkitAudioContext; if (Ctx) AC = new Ctx(); } catch(e){ AC = null; }
}
function beep(freq, t0, dur, type, vol, slide){
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, AC.currentTime + t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, AC.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol || 0.12, AC.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + dur + 0.05);
  } catch(e){}
}
function noisePop(big){
  if (!AC || muted) return;
  try {
    const dur = big ? 0.22 : 0.13;
    const len = Math.max(1, (AC.sampleRate * dur) | 0);
    const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = big ? 900 : 1500; f.Q.value = 0.7;
    const g = AC.createGain(); g.gain.value = big ? 0.5 : 0.34;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
    const o = AC.createOscillator(), g2 = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(big ? 300 : 420, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, AC.currentTime + 0.09);
    g2.gain.setValueAtTime(big ? 0.3 : 0.2, AC.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.1);
    o.connect(g2); g2.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.12);
  } catch(e){}
}
function sndPaddle(){ beep(300, 0, 0.06, 'square', 0.07); }
function sndWall(){ beep(200, 0, 0.05, 'square', 0.05); }
function sndPop(big){ noisePop(big); }
function sndGold(){ beep(1240, 0, 0.09, 'sine', 0.11); beep(1860, 0.06, 0.15, 'sine', 0.10); }
function sndCrack(){ beep(170, 0, 0.07, 'sawtooth', 0.09, 90); }
function sndPower(){ beep(520, 0, 0.08, 'triangle', 0.12); beep(700, 0.07, 0.08, 'triangle', 0.12); beep(980, 0.14, 0.16, 'triangle', 0.12); }
function sndClear(){ beep(784, 0, 0.12, 'triangle', 0.13); beep(988, 0.1, 0.12, 'triangle', 0.13); beep(1318, 0.2, 0.22, 'triangle', 0.13); }
function sndFanfare(){
  beep(523, 0, 0.12, 'triangle', 0.15); beep(659, 0.09, 0.12, 'triangle', 0.15);
  beep(784, 0.18, 0.12, 'triangle', 0.15); beep(1046, 0.27, 0.2, 'triangle', 0.16);
  beep(1318, 0.38, 0.32, 'triangle', 0.15); beep(1568, 0.38, 0.32, 'sine', 0.11);
  beep(784, 0.52, 0.4, 'triangle', 0.10);
}
function sndLose(){ beep(420, 0, 0.16, 'sawtooth', 0.10, 210); beep(210, 0.14, 0.3, 'sawtooth', 0.10, 70); }

/* ================= FIELD & ENTITIES ================= */
const FL = 16, FR = IW - 16, FT = 14;            /* field walls (virtual px) */
const ROW_COLORS = ['#2dd4bf', '#38bdf8', '#a78bfa', '#fb7185', '#f5c542', '#a3e635', '#f472b6', '#34d399'];
const COLS = 10, BCX = 36, BCY = 31, BGAP = 4, BX0 = 22, BY0 = 48;   /* grid x 22..778 inside walls 16..784; 7-row bottom = 506, above paddle 510 */
const BALL_R = 7;
const PADDLE_H = 13, PADDLE_BASE_W = 112;
const MIN_VY_FRAC = 0.27;

let state = 'menu';        /* menu | serve | play | over */
let paused = false;
let score = 0, lives = 3, level = 1, elapsed = 0, runActive = false;
let balloons = [], balloonsAlive = 0, balloonsTotal = 0, popped = 0;
let particles = [], floaters = [], shards = [], trailFx = [];
let capsule = null;        /* falling star token {x, y} — at most one */
let breakoutFx = null;     /* BONUS BREAKOUT ripple in flight */
let wideT = 0;
let serveT = 0;
let toastTxt = '', toastUntil = 0;
let drawT = 0;

const paddle = { x: IW / 2, w: PADDLE_BASE_W, target: IW / 2 };
let balls = [];
function newBall(x, y, speed){ return { x, y, vx: 0, vy: 0, speed, trail: [] }; }
function mainBall(){ return balls[0] || null; }

function levelSpeed(lv){ return Math.min(335 + (lv - 1) * 30, 660); }
function toast(txt, secs){ toastTxt = txt; toastUntil = performance.now() / 1000 + (secs || 1.3); }
function addFloater(x, y, txt, color){ floaters.push({ x, y, txt, color: color || '#ffd76a', life: 1.05 }); }
function burst(x, y, color, n){
  for (let i = 0; i < (n || 9); i++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 150;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.45 + Math.random() * 0.3, color, r: 1.6 + Math.random() * 2.2 });
  }
}
function popBurst(b){
  /* bloom flash at the pop point — white-hot core in the balloon's color */
  particles.push({ x: b.cx, y: b.cy, vx: 0, vy: 0, life: 0.13, color: shade(b.color, 1.5), r: 52, flash: true });
  /* rubber shards: curved slivers in the balloon's own color */
  const cx = b.cx, cy = b.cy, n = 9 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 210;
    shards.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
      size: 5 + Math.random() * 8, life: 0.55 + Math.random() * 0.35, color: b.color });
  }
  /* confetti: bright mixed paper bits */
  const confCols = ['#ffd76a', '#ff8fab', '#7ff5e6', '#c4b5fd', '#a3e635', '#ffffff'];
  for (let i = 0; i < 12; i++){
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 170;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
      life: 0.5 + Math.random() * 0.45, color: confCols[i % confCols.length], r: 2 + Math.random() * 2.6, confetti: true, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12 });
  }
  /* expanding ring */
  particles.push({ x: cx, y: cy, vx: 0, vy: 0, life: 0.28, color: b.color, r: 4, ring: true });
}

/* ---- balloon patterns: '.' empty, 'N' normal (1 hit, +10), 'P' party (1 hit, +25),
        'T' tough (2 hits, +10) — same layouts the previous build shipped ---- */
function patternRows(lv){
  const R = (s) => s.split('');
  switch (((lv - 1) % 6 + 6) % 6){
    case 0: return [R('NNNNNNNNNN'), R('NNNNNNNNNN'), R('NNNNNNNNNN'), R('NNNNNNNNNN'), R('NNNNNNNNNN'), R('NNNNNNNNNN')];
    case 1: {
      const rows = [];
      for (let r = 0; r < 7; r++){ const row = []; for (let c = 0; c < COLS; c++) row.push((r + c) % 2 ? 'N' : '.'); rows.push(row); }
      return rows;
    }
    case 2: {
      const rows = [];
      for (let r = 0; r < 7; r++){ const row = []; for (let c = 0; c < COLS; c++) row.push(c % 3 === 0 ? 'T' : 'N'); rows.push(row); }
      return rows;
    }
    case 3: {
      const counts = [4, 6, 8, 10, 8, 6, 4], rows = [];
      for (let r = 0; r < 7; r++){
        const row = Array(COLS).fill('.'), start = (COLS - counts[r]) / 2;
        for (let c = start; c < start + counts[r]; c++) row[c] = (r === 3 && (c === 4 || c === 5)) ? 'T' : 'N';
        rows.push(row);
      }
      return rows;
    }
    case 4: {
      const rows = [];
      for (let r = 0; r < 7; r++){
        const row = [];
        for (let c = 0; c < COLS; c++) row.push((r === 0 || r === 6 || c === 0 || c === COLS - 1) ? 'T' : 'N');
        rows.push(row);
      }
      return rows;
    }
    default: {
      const rng = mulberry(1234 + lv * 777), rows = [];
      const toughP = 0.22 + 0.04 * Math.floor((lv - 1) / 6);
      for (let r = 0; r < 8; r++){
        const row = [];
        for (let c = 0; c < COLS; c++){
          const v = rng();
          row.push(v < 0.2 ? '.' : (rng() < toughP ? 'T' : 'N'));
        }
        rows.push(row);
      }
      return rows;
    }
  }
}

function buildLevel(lv){
  const grid = patternRows(lv);
  const rng = mulberry(9000 + lv * 131);
  balloons = [];
  breakoutFx = null;
  for (let r = 0; r < grid.length; r++){
    for (let c = 0; c < COLS; c++){
      const ch = grid[r][c];
      if (ch === '.') continue;
      let type = ch === 'T' ? 'tough' : 'normal';
      let val = 10;
      if (type === 'normal'){
        const roll = rng();
        if (roll < 0.07){ type = 'gold'; val = 50; }
        else if (roll < 0.19){ type = 'party'; val = 25; }
      }
      balloons.push({
        cx: BX0 + c * (BCX * 2 + BGAP) + BCX, cy: BY0 + r * (BCY * 2 + BGAP) + BCY,
        rx: BCX, ry: BCY, col: c, row: r, type, val, hp: type === 'tough' ? 2 : 1,
        alive: true, color: type === 'tough' ? '#5b6478' : ROW_COLORS[r % ROW_COLORS.length],
        sway: rng() * 6.28, inflate: 0,
      });
    }
  }
  /* exactly one Luna Classic crescent balloon per level: nearest the center */
  if (balloons.length){
    const fcX = IW / 2, fcY = BY0 + (grid.length * (BCY * 2 + BGAP) - BGAP) / 2;
    let best = null, bestD = Infinity;
    for (const b of balloons){
      const d = Math.hypot(b.cx - fcX, b.cy - fcY);
      if (d < bestD){ bestD = d; best = b; }
    }
    best.type = 'special'; best.hp = 1; best.val = 50; best.color = '#ffc928';
  }
  /* guarantee at least one gold crescent and one USTC star per level */
  if (!balloons.some(b => b.type === 'gold')){
    const normals = balloons.filter(b => b.type === 'normal');
    if (normals.length){ const g = normals[Math.floor(rng() * normals.length)]; g.type = 'gold'; g.val = 50; g.color = '#f5c542'; }
  }
  const starCands = balloons.filter(b => b.type === 'normal');
  if (starCands.length){ const s = starCands[Math.floor(rng() * starCands.length)]; s.type = 'star'; s.val = 50; s.color = '#37e0c8'; }
  for (const b of balloons) if (b.type === 'gold') b.color = '#f5c542';
  balloonsAlive = balloons.length;
  balloonsTotal = balloons.length;
  capsule = null;
}

function resetBallOnPaddle(){
  balls = [newBall(paddle.x, PADDLE_Y - BALL_R - 1, levelSpeed(level))];
  serveT = 0;              /* stays on the paddle until the player taps (or auto-launch is forced) */
  state = 'serve';
}
function launchBall(){
  if (state !== 'serve') return;
  const b = mainBall(); if (!b) return;
  const a = (Math.random() * 0.9 - 0.45);
  b.vx = Math.sin(a) * b.speed;
  b.vy = -Math.cos(a) * b.speed;
  state = 'play';
  beep(660, 0, 0.07, 'triangle', 0.09);
}
function startRun(){
  score = 0; lives = 3; level = 1; elapsed = 0; popped = 0; runActive = true; paused = false;
  wideT = 0; particles = []; floaters = []; shards = []; capsule = null;
  paddle.w = PADDLE_BASE_W; paddle.x = IW / 2; paddle.target = IW / 2;
  buildLevel(1);
  showScreen(null);
  $('submitBtn').disabled = false;
  $('submitStatus').textContent = '';
  document.body.classList.add('playing');
  refit();
  resetBallOnPaddle();
  hud();
  toast(T('lvl').replace('{l}', 1));
}
function advanceLevel(){
  level++;
  localStorage.setItem('lunaBreakoutBest', Math.max(+(localStorage.getItem('lunaBreakoutBest') || 0), score));
  sndClear();
  toast(T('lvl').replace('{l}', level) + '!');
  buildLevel(level);
  resetBallOnPaddle();
  hud();
}
function loseBall(ballObj){
  balls = balls.filter(b => b !== ballObj);
  burst(ballObj.x, VH_now - 8, '#fb7185', 10);
  if (balls.length) return;           /* other balls still flying — play on */
  lives--;
  sndLose();
  capsule = null; wideT = 0; paddle.w = PADDLE_BASE_W;
  if (lives <= 0){ gameOver(); return; }
  toast('🌕 × ' + lives);
  resetBallOnPaddle();
  hud();
}
function gameOver(){
  state = 'over'; runActive = false;
  document.body.classList.remove('playing');
  refit();
  localStorage.setItem('lunaBreakoutBest', Math.max(+(localStorage.getItem('lunaBreakoutBest') || 0), score));
  $('finalScore').textContent = score;
  $('overStats').textContent = T('overStats').replace('{l}', level).replace('{p}', popped);
  const best = +(localStorage.getItem('lunaBreakoutBest') || 0);
  $('bestLine').textContent = best ? T('bestDevice').replace('{s}', best) : '';
  prefillName();
  showScreen('overScreen');
  hud();
}

function enforceAngle(b){
  const sp = Math.hypot(b.vx, b.vy);
  if (sp < 1) return;
  b.speed = sp;
  const minVy = MIN_VY_FRAC * sp;
  if (Math.abs(b.vy) < minVy){
    const sy = b.vy < 0 ? -1 : (b.vy > 0 ? 1 : -1);
    b.vy = sy * minVy;
    const sx = b.vx < 0 ? -1 : 1;
    b.vx = sx * Math.sqrt(Math.max(0, sp * sp - b.vy * b.vy));
  }
}

function spawnExtraBalls(fromBall){
  const sp = fromBall.speed;
  for (const da of [-0.5, 0.5]){
    if (balls.length >= 3) break;
    const nb = newBall(fromBall.x, fromBall.y, sp);
    const base = Math.atan2(fromBall.vy, fromBall.vx) + da;
    nb.vx = Math.cos(base) * sp; nb.vy = Math.sin(base) * sp;
    if (nb.vy > -40) nb.vy = -Math.abs(nb.vy) - 40;
    enforceAngle(nb);
    balls.push(nb);
  }
}

function hitBalloon(b, ballObj){
  b.hp--;
  if (b.hp > 0){ sndCrack(); b.inflate = 1; burst(ballObj.x, ballObj.y, '#aab4cc', 4); return; }
  b.alive = false; balloonsAlive--; popped++;
  const special = (b.type === 'special' || b.type === 'gold' || b.type === 'star');
  sndPop(special);
  popBurst(b);
  score += b.val;
  if (b.type === 'special'){
    sndGold(); sndFanfare();
    addFloater(b.cx, b.cy, '+50', '#ffd76a');
    toast(T('bigPop').replace('{p}', 50));
    spawnExtraBalls(ballObj);
    if (balloonsAlive > 0) startBreakout(b); else advanceLevel();
  } else if (b.type === 'gold'){
    sndGold();
    addFloater(b.cx, b.cy, '+50', '#ffd76a');
    toast(T('bigPop').replace('{p}', 50));
    spawnExtraBalls(ballObj);
  } else if (b.type === 'star'){
    sndGold();
    addFloater(b.cx, b.cy, '+50', '#7ff5e6');
    if (!capsule) capsule = { x: b.cx, y: b.cy, vy: 135 };
  } else if (b.type === 'party'){
    addFloater(b.cx, b.cy, '+25', '#ffd7ef');
  } else {
    addFloater(b.cx, b.cy, '+10', '#d8fffb');
  }
  hud();
  if (state === 'play' && balloonsAlive <= 0) advanceLevel();
}

/* ---- BONUS BREAKOUT: the special crescent balloon takes the whole sky with it ---- */
function startBreakout(src){
  toast('BONUS BREAKOUT!');
  const rest = balloons.filter(b => b.alive);
  const dist = b => Math.hypot(b.cx - src.cx, b.cy - src.cy);
  rest.sort((a, b2) => dist(a) - dist(b2));
  breakoutFx = { t: 0, items: rest.map(b => ({ b, at: 0.05 + dist(b) / 900 })) };
}
function breakBalloonCascade(b){
  b.alive = false; balloonsAlive--; popped++;
  sndPop(true);
  popBurst(b);
  score += b.val;
  addFloater(b.cx, b.cy, '+' + b.val, b.type === 'normal' ? '#d8fffb' : '#ffd76a');
  hud();
}

function stepBall(b, dt){
  const dist = Math.hypot(b.vx, b.vy) * dt;
  const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.85)));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++){
    b.x += b.vx * sdt;
    b.y += b.vy * sdt;

    if (b.x < FL + BALL_R){ b.x = FL + BALL_R; b.vx = Math.abs(b.vx); sndWall(); }
    else if (b.x > FR - BALL_R){ b.x = FR - BALL_R; b.vx = -Math.abs(b.vx); sndWall(); }
    if (b.y < FT + BALL_R){ b.y = FT + BALL_R; b.vy = Math.abs(b.vy); sndWall(); }

    if (b.vy > 0 &&
        b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        b.x >= paddle.x - paddle.w / 2 - BALL_R && b.x <= paddle.x + paddle.w / 2 + BALL_R){
      const rel = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
      const ang = rel * (Math.PI * 0.36);
      const sp = b.speed;
      b.vx = Math.sin(ang) * sp;
      b.vy = -Math.cos(ang) * sp;
      b.y = PADDLE_Y - BALL_R - 0.5;
      sndPaddle();
    }

    /* balloons near the ball */
    for (const bl of balloons){
      if (!bl.alive) continue;
      const dx = b.x - bl.cx, dy = b.y - bl.cy;
      if (Math.abs(dx) > bl.rx + BALL_R + 2 || Math.abs(dy) > bl.ry + BALL_R + 2) continue;
      const ex = dx / (bl.rx + BALL_R), ey = dy / (bl.ry + BALL_R);
      if (ex * ex + ey * ey > 1) continue;
      /* reflect along the dominant normalized axis */
      if (Math.abs(ex) > Math.abs(ey)){
        b.vx = (ex > 0 ? Math.abs(b.vx) : -Math.abs(b.vx));
        b.x = bl.cx + (ex > 0 ? 1 : -1) * (bl.rx + BALL_R + 0.5);
      } else {
        b.vy = (ey > 0 ? Math.abs(b.vy) : -Math.abs(b.vy));
        b.y = bl.cy + (ey > 0 ? 1 : -1) * (bl.ry + BALL_R + 0.5);
      }
      hitBalloon(bl, b);

    }

/* ================= UPDATE ================= */
const keys = { left: false, right: false };
function driftFx(dt){
  for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.ring ? 0 : 260) * dt; p.life -= dt; if (p.ring) p.r += 260 * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const s of shards){ s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt; s.vx *= (1 - 1.6 * dt); s.rot += s.vr * dt; s.life -= dt; }
  shards = shards.filter(s => s.life > 0);
  for (const f of floaters){ f.y -= 34 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  for (const bl of balloons) if (bl.inflate > 0) bl.inflate = Math.max(0, bl.inflate - dt * 3);
}
function update(dt){
  driftFx(dt);

  if (breakoutFx){
    breakoutFx.t += dt;
    while (breakoutFx.items.length && breakoutFx.items[0].at <= breakoutFx.t){
      const it = breakoutFx.items.shift();
      if (it.b.alive) breakBalloonCascade(it.b);
    }
    if (!breakoutFx.items.length){
      breakoutFx = null;
      if (balloonsAlive <= 0 && (state === 'play' || state === 'serve')) advanceLevel();
    }
  }

  if (state !== 'serve' && state !== 'play') return;
  elapsed += dt;

  if (keys.left) paddle.target -= 940 * dt;
  if (keys.right) paddle.target += 940 * dt;
  paddle.target = clamp(paddle.target, FL + paddle.w / 2, FR - paddle.w / 2);
  const want = paddle.target - paddle.x;
  const stepMax = 1650 * dt;
  paddle.x += clamp(want * Math.min(1, dt * 24), -stepMax, stepMax);
  paddle.x = clamp(paddle.x, FL + paddle.w / 2, FR - paddle.w / 2);

  if (wideT > 0){ wideT -= dt; if (wideT <= 0){ paddle.w = PADDLE_BASE_W; toast(T('wideOff')); } }

  if (state === 'serve'){
    const b = mainBall();
    if (b){ b.x = paddle.x; b.y = PADDLE_Y - BALL_R - 1; }
    return;
  }

  if (capsule){
    capsule.y += capsule.vy * dt;
    if (capsule.y + 8 >= PADDLE_Y && capsule.y <= PADDLE_Y + PADDLE_H + 8 &&
        Math.abs(capsule.x - paddle.x) <= paddle.w / 2 + 14){
      paddle.w = PADDLE_BASE_W * 1.5; wideT = 12;
      capsule = null; sndPower(); toast(T('wideOn'));
      paddle.x = clamp(paddle.x, FL + paddle.w / 2, FR - paddle.w / 2);
    } else if (capsule.y > VH_now + 16) capsule = null;
  }

  for (const b of [...balls]) stepBall(b, dt);
  if (state !== 'play') return;
  /* ball trails */
  for (const b of balls){
    b.trail.push({ x: b.x, y: b.y, life: 0.22 });
    if (b.trail.length > 14) b.trail.shift();
  }
  for (const b of balls) for (const t of b.trail) t.life -= dt;
}

      continue;
    }
    if (p.ring){
      ctx.globalAlpha = Math.max(0, p.life / 0.28) * 0.8;
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.8));
    ctx.fillStyle = p.color;
    if (p.confetti){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + drawT * p.vr * 0.2);
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  /* floaters */
  ctx.font = '900 16px system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const f of floaters){
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'serve'){
    ctx.font = '700 14px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText(T('hint').toUpperCase(), IW / 2, PADDLE_Y - 34);
  }
  /* center toast */
  if (toastTxt && performance.now() / 1000 < toastUntil){
    ctx.font = '900 27px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd76a';
    ctx.shadowColor = 'rgba(255,183,0,.8)'; ctx.shadowBlur = 16;
    ctx.fillText(toastTxt, IW / 2, VH_now * 0.42);
    ctx.shadowBlur = 0;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  /* vignette — darker corners pull focus to the center of the field (premium depth cue) */
  ctx.save();
  ctx.setTransform(SCALE, 0, 0, SCALE, OX, OY);
  const vg = ctx.createRadialGradient(IW / 2, VH_now * 0.44, VH_now * 0.34, IW / 2, VH_now * 0.52, VH_now * 0.86);
  vg.addColorStop(0, 'rgba(4,2,16,0)');
  vg.addColorStop(1, 'rgba(4,2,16,.38)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, IW, VH_now);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ================= HUD ================= */
function hud(){
  $('hudLives').textContent = lives > 0 ? '🌕'.repeat(Math.min(lives, 6)) : '—';
  $('hudLevel').textContent = T('lvl').replace('{l}', level);
  $('hudScore').textContent = score;
}

/* ================= SCREENS ================= */
function showScreen(id){
  for (const s of ['menuScreen', 'howScreen', 'boardScreen', 'overScreen', 'pauseScreen'])
    $(s).classList.toggle('show', s === id);
}

/* ================= LEADERBOARD (shared router, game=breakout) ================= */
const API_URL = 'https://frg-fight-club.vercel.app/api/luna-games?game=breakout';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function prefillName(){
  const saved = localStorage.getItem('lunaBreakoutName') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || '') : '');
  $('nameInput').value = (saved || 'Guest').slice(0, 16);
}
let boardData = null, boardTab = 'all', boardErr = false;
async function loadBoard(){
  $('boardList').innerHTML = '<div class="row"><span class="nm">' + T('loading') + '</span></div>';
  boardErr = false;
  try {
    const r = await fetch(API_URL);
    if (!r.ok) throw new Error('board ' + r.status);
    boardData = await r.json();
  } catch(e){ boardData = null; boardErr = true; }
  renderBoard();
}
function renderBoard(){
  $('tabAll').className = 'play small' + (boardTab === 'all' ? '' : ' alt');
  $('tabWeek').className = 'play small' + (boardTab === 'week' ? '' : ' alt');
  if (boardErr || !boardData){
    $('boardList').innerHTML = '<div class="row"><span class="nm">' + T('boardOff') + '</span></div>';
    return;
  }
  const rows = boardData[boardTab] || [];
  if (!rows.length){
    $('boardList').innerHTML = '<div class="row"><span class="nm">' + T('noScores') + '</span></div>';
    return;
  }
  $('boardList').innerHTML = rows.map((r, i) =>
    `<div class="row"><span class="rk">${i + 1}.</span><span class="nm"></span><span class="sc">${r.score}</span></div>`
  ).join('');
  [...$('boardList').querySelectorAll('.row .nm')].forEach((el, i) => { el.textContent = rows[i].name; });
}
function openBoard(fromOver){
  window._boardFrom = fromOver ? 'overScreen' : 'menuScreen';
  showScreen('boardScreen');
  boardTab = 'all';
  loadBoard();
}
$('tabAll').onclick = () => { boardTab = 'all'; renderBoard(); };
$('tabWeek').onclick = () => { boardTab = 'week'; renderBoard(); };
$('boardClose').onclick = () => { showScreen(window._boardFrom || 'menuScreen'); };
$('boardBtn').onclick = () => openBoard(false);
$('overBoardBtn').onclick = () => openBoard(true);
$('submitBtn').onclick = async () => {
  const btn = $('submitBtn');
  btn.disabled = true;
  const name = ($('nameInput').value.trim() || 'Guest').slice(0, 16);
  localStorage.setItem('lunaBreakoutName', name);
  $('submitStatus').textContent = T('loading');
  const initData = (tg && tg.initData) || '';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData, name, score, seconds: Math.round(elapsed) }),
    });
    const d = await r.json();
    if (d && d.ok){
      $('submitStatus').textContent = d.rank ? T('savedRank').replace('{n}', d.rank) : T('saved');
      boardData = null;
    } else {
      $('submitStatus').textContent = T('saveFail');
      btn.disabled = false;
    }
  } catch(e){
    $('submitStatus').textContent = T('saveFail');
    btn.disabled = false;
  }
};

/* ================= WIRING ================= */
$('startBtn').onclick = () => { ensureAudio(); startRun(); };
$('againBtn').onclick = () => { ensureAudio(); startRun(); };
$('howBtn').onclick = () => { showScreen('howScreen'); };
$('howClose').onclick = () => { showScreen(state === 'over' ? 'overScreen' : 'menuScreen'); };
$('muteBtn').onclick = () => {
  muted = !muted;
  localStorage.setItem('lunaBreakoutMute', muted ? '1' : '0');
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (!muted) ensureAudio();
};
function togglePause(){
  if (state !== 'play' && state !== 'serve') return;
  paused = !paused;
  if (paused) showScreen('pauseScreen');
  else showScreen(null);
}
$('pauseBtn').onclick = togglePause;
$('pauseBtnPlay').onclick = togglePause;
$('resumeBtn').onclick = togglePause;
$('quitBtn').onclick = () => {
  paused = false; state = 'menu'; balls = [];
  document.body.classList.remove('playing');
  refit();
  showScreen('menuScreen');
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'serve') && !paused) togglePause();
});

/* ================= INPUT — paddle follows the thumb (pointer events, real touch) ================= */
function pointerX(e){
  const r = cv.getBoundingClientRect();
  if (!r.width) return IW / 2;
  return clamp(((e.clientX - r.left) / r.width * W - OX) / SCALE, 0, IW);
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  paddle.target = pointerX(e);
  if (state === 'serve') launchBall();
});
cv.addEventListener('pointermove', e => {
  if (state === 'play' || state === 'serve') paddle.target = pointerX(e);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.left = true; e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.right = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter'){
    ensureAudio();
    if (state === 'serve') launchBall();
    else if (state === 'menu') startRun();
    e.preventDefault();
  }
  if (e.code === 'KeyM') $('muteBtn').onclick();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

/* ================= LANGUAGE ================= */
const langSel = $('langSel');
LANGS.forEach(([k, label]) => { const o = document.createElement('option'); o.value = k; o.textContent = label; langSel.appendChild(o); });
langSel.value = lang;
langSel.addEventListener('change', () => { lang = langSel.value; localStorage.setItem('lunaBreakoutLang', lang); applyI18n(); });

/* ================= MAIN LOOP ================= */
let lastT = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;
  if (dt <= 0) dt = 0.001;
  drawT += dt;
  if (!paused && (state === 'serve' || state === 'play')){
    try { update(dt); } catch(err){ console.error(err); }
  } else if (!paused) {
    driftFx(dt);
  }
  draw();
}

/* ================= QA / DEBUG HOOK ================= */
window.LBO = {
  get state(){ return state; },
  get paused(){ return paused; },
  get score(){ return score; },  get lives(){ return lives; },
  get level(){ return level; },
  get elapsed(){ return elapsed; },
  get balls(){ return balls; },
  get paddle(){ return paddle; },
  get balloonsAlive(){ return balloonsAlive; },
  get balloonsTotal(){ return balloonsTotal; },
  get balloons(){ return balloons; },
  get popped(){ return popped; },
  get capsule(){ return capsule; },
  get wideT(){ return wideT; },
  get shards(){ return shards; },
  get particles(){ return particles; },
  get breakoutFx(){ return breakoutFx; },
  get specials(){ return balloons.filter(b => b.type === 'special'); },
  loadLevel(lv){ level = lv; buildLevel(lv); hud(); },
  forceHitSpecial(){ const s = balloons.find(b => b.alive && b.type === 'special'); if (s && state === 'play') hitBalloon(s, mainBall()); },
  hitStar(){ const s = balloons.find(b => b.alive && b.type === 'star'); if (s && state === 'play') hitBalloon(s, mainBall()); return !!s; },
  spawnCapsuleAt(x){ capsule = { x, y: PADDLE_Y - 120, vy: 135 }; },
  startRun(){ startRun(); },
  launch(){ launchBall(); },
  setPaddleTarget(x){ paddle.target = x; },
  setBall(o){ const b = mainBall(); if (b) Object.assign(b, o); },
  setLives(n){ lives = n; hud(); },
  destroyAll(){ for (const b of balloons){ if (b.alive){ b.alive = false; balloonsAlive--; } } if (balloonsAlive <= 0 && state === 'play') advanceLevel(); },
  step(dt){ update(dt); },
};

/* ================= BOOT ================= */
buildLevel(1);
applyI18n();
$('muteBtn').textContent = muted ? '🔇' : '🔊';
fit();
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
requestAnimationFrame(frame);
addEventListener('resize', fit);
addEventListener('orientationchange', () => { fit(); setTimeout(fit, 250); });
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('load', () => setTimeout(() => $('splash').classList.add('gone'), 650));
setTimeout(() => $('splash').classList.add('gone'), 2600);
if (document.readyState === 'complete') setTimeout(() => $('splash').classList.add('gone'), 650);
</script>
