  .bigbtn { display:block; width:100%; margin-top:14px; padding:16px; font-size:19px; font-weight:900; letter-spacing:.05em; border:none; border-radius:16px; cursor:pointer; color:#241a02; background:linear-gradient(180deg,#ffe89a,#f0b940 60%,#d99a16); box-shadow:0 6px 22px rgba(240,185,64,.4), inset 0 1px 0 #fff8; }

  .ghostbtn { display:block; width:100%; margin-top:10px; padding:13px; font-size:15px; font-weight:800; border-radius:14px; cursor:pointer; color:#dbe6ff; background:linear-gradient(180deg,#1a2c5e,#101f47); border:1.5px solid #35509e; }
  .bestchip { margin-top:12px; text-align:center; background:rgba(10,19,48,.85); border:1px solid #2b3f7d; border-radius:12px; padding:9px; color:#ffd97a; font-weight:700; font-size:14.5px; }

  .footer { text-align:center; color:#7288bb; font-size:12px; margin-top:16px; letter-spacing:.08em; }
  .footer b { color:#aebfec; }

  /* ---------- cards / quiz ---------- */

  .kicker { text-align:center; color:#ffd97a; letter-spacing:.22em; font-size:12px; font-weight:800; }
  .card h2 { text-align:center; font-size:25px; margin:6px 0 8px; letter-spacing:.02em; }
  .introFacts { color:#dbe6ff; font-size:15px; line-height:1.6; }
  .introFacts p { margin:8px 0; }
  .introFacts b { color:#ffd97a; }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .hud .pill { background:rgba(10,19,48,.9); border:1px solid #2b3f7d; border-radius:999px; padding:6px 12px; font-size:13.5px; font-weight:800; color:#dbe6ff; }
  .hud .pill.gold { color:#ffd97a; border-color:#8a6a1d; }
  .timerbar { height:10px; border-radius:6px; background:#0a1330; border:1px solid #2b3f7d; overflow:hidden; margin-bottom:14px; }
  .timerbar > div { height:100%; width:100%; background:linear-gradient(90deg,#57c878,#f0b940); border-radius:6px; }
  .timerbar.low > div { background:linear-gradient(90deg,#e0483e,#f08c40); }
  .qtext { font-size:20px; font-weight:800; line-height:1.4; text-align:center; margin:4px 2px 16px; }
  .answers { display:flex; flex-direction:column; gap:10px; }
  .ans { display:flex; align-items:center; gap:11px; text-align:left; width:100%; padding:14px 13px; font-size:16px; font-weight:700; line-height:1.35; color:#eef2f8; background:linear-gradient(180deg,#1b2c5c,#111f47); border:1.5px solid #35509e; border-radius:14px; cursor:pointer; transition:transform .1s, border-color .1s; overflow-wrap:anywhere; }
  .ans:active { transform:scale(.99); }
  .ans .key { flex:0 0 30px; width:30px; height:30px; border-radius:9px; background:#0a1330; border:1px solid #35509e; display:flex; align-items:center; justify-content:center; font-size:14px; color:#ffd97a; font-weight:900; }
  .ans.correct { border-color:#57c878; background:linear-gradient(180deg,#17452a,#0e3319); box-shadow:0 0 18px rgba(87,200,120,.4); }
  .ans.wrong { border-color:#e0483e; background:linear-gradient(180deg,#571f1c,#33100e); animation:shake .4s; }
  .ans.dim { opacity:.45; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

  .verdict.good { color:#7ce79e; } .verdict.bad { color:#ff9d94; }
  .factbox { background:rgba(24,20,4,.9); border:1.5px solid #8a6a1d; border-radius:14px; padding:13px 14px; margin-top:6px; }
  .factbox .fk { color:#ffd97a; font-weight:900; letter-spacing:.14em; font-size:12px; margin-bottom:5px; }
  .factbox .ft { font-size:15.5px; line-height:1.55; color:#fdf3d0; overflow-wrap:anywhere; }
  .burst { position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
  .burst span { position:absolute; font-size:22px; animation:fly 1s ease-out forwards; }
  @keyframes fly { to { transform:translate(var(--dx), var(--dy)) rotate(320deg) scale(.4); opacity:0; } }
  .starpop { text-align:center; font-size:34px; letter-spacing:.3em; color:#f0b940; text-shadow:0 0 18px rgba(240,185,64,.6); margin:6px 0; }

      <div class="stations" id="stationList"></div>

    <button class="bigbtn" id="btnPlay"></button>

    <div class="bestchip" id="bestChip"></div>
    <div class="secnote" id="secNote"></div>
    <p class="footer">by <b>LUNC DEV STUDIO</b> · LUNA CLASSIC 🌙</p>

  <!-- ================= STATION INTRO ================= -->
  <section id="scrIntro" class="hidden">

      <div class="introFacts" id="introFacts"></div>
      <button class="bigbtn" id="btnStart"></button>
      <button class="ghostbtn" id="btnIntroMap"></button>
    </div>
  </section>

  <!-- ================= QUESTION ================= -->
  <section id="scrQuiz" class="hidden">
    <div class="hud">
      <div class="pill" id="hudStation"></div>
      <div class="pill gold" id="hudScore"></div>
      <div class="pill" id="hudStreak"></div>
    </div>
    <div class="timerbar" id="timerBar"><div></div></div>
    <div class="card">
      <div class="kicker" id="qKick"></div>
      <div class="qtext" id="qText"></div>
      <div class="answers" id="qAnswers"></div>
      <div id="qAfter" class="hidden">
        <div class="verdict" id="qVerdict"></div>
        <div class="factbox"><div class="fk" id="factKick"></div><div class="ft" id="factText"></div></div>
        <button class="bigbtn" id="btnNext"></button>
      </div>
    </div>
  </section>

  <!-- ================= STATION COMPLETE ================= -->
  <section id="scrDone" class="hidden">
    <div class="card">
      <div class="kicker" id="doneKick"></div>
      <div class="starpop" id="doneStars"></div>
      <div class="bigscore" id="doneScore"></div>
      <button class="bigbtn" id="btnNextStation"></button>
      <button class="ghostbtn" id="btnDoneMap"></button>
    </div>
  </section>

  <!-- ================= FINAL ================= -->
  <section id="scrFinal" class="hidden">
    <div class="card">
      <div class="kicker" id="finalKick"></div>
      <div class="gradeBadge"><div class="gi">🌙</div><div class="gt" id="gradeTitle"></div></div>
      <div class="bigscore" id="finalScore"></div>
      <p class="tagline" id="finalCount"></p>
      <p class="bestchip hidden" id="newBestChip" style="margin:8px 0;"></p>
      <button class="bigbtn" id="btnAgain"></button>
      <button class="ghostbtn" id="btnFinalMap"></button>
    </div>
  </section>
</div>

<!-- ================= HOW TO PLAY MODAL ================= -->
<div class="modalWrap hidden" id="howModal">
  <div class="card modal">
    <h2 id="howTitle" style="font-size:21px;"></h2>
    <div class="howBody" id="howBody"></div>
    <button class="bigbtn" id="btnHowClose"></button>
  </div>
</div>

<div class="burst hidden" id="burst"></div>

en:{gCadet:"LUNC CADET",gExplorer:"LUNC EXPLORER",gCaptain:"LUNC CAPTAIN",gLegend:"LUNC LEGEND"},
es:{gCadet:"CADETE LUNC",gExplorer:"EXPLORADOR LUNC",gCaptain:"CAPITÁN LUNC",gLegend:"LEYENDA LUNC"},
pt:{gCadet:"CADETE LUNC",gExplorer:"EXPLORADOR LUNC",gCaptain:"CAPITÃO LUNC",gLegend:"LENDA LUNC"},
fr:{gCadet:"CADET LUNC",gExplorer:"EXPLORATEUR LUNC",gCaptain:"CAPITAINE LUNC",gLegend:"LÉGENDE LUNC"},

it:{gCadet:"CADETTO LUNC",gExplorer:"ESPLORATORE LUNC",gCaptain:"CAPITANO LUNC",gLegend:"LEGGENDA LUNC"},
nl:{gCadet:"LUNC-KADET",gExplorer:"LUNC-ONTDEKKER",gCaptain:"LUNC-KAPITEIN",gLegend:"LUNC-LEGENDE"},
ru:{gCadet:"КАДЕТ LUNC",gExplorer:"ИССЛЕДОВАТЕЛЬ LUNC",gCaptain:"КАПИТАН LUNC",gLegend:"ЛЕГЕНДА LUNC"},
uk:{gCadet:"КАДЕТ LUNC",gExplorer:"ДОСЛІДНИК LUNC",gCaptain:"КАПІТАН LUNC",gLegend:"ЛЕГЕНДА LUNC"},
tr:{gCadet:"LUNC ACEMİSİ",gExplorer:"LUNC KÂŞİFİ",gCaptain:"LUNC KAPTANI",gLegend:"LUNC EFSANESİ"},

hi:{gCadet:"LUNC कैडेट",gExplorer:"LUNC खोजकर्ता",gCaptain:"LUNC कप्तान",gLegend:"LUNC लीजेंड"},
id:{gCadet:"KADET LUNC",gExplorer:"PENJELAJAH LUNC",gCaptain:"KAPTEN LUNC",gLegend:"LEGENDA LUNC"},
vi:{gCadet:"HỌC VIÊN LUNC",gExplorer:"NHÀ THÁM HIỂM LUNC",gCaptain:"THUYỀN TRƯỞNG LUNC",gLegend:"HUYỀN THOẠI LUNC"},
th:{gCadet:"นักเรียน LUNC",gExplorer:"นักสำรวจ LUNC",gCaptain:"กัปตัน LUNC",gLegend:"ตำนาน LUNC"},
ko:{gCadet:"LUNC 생도",gExplorer:"LUNC 탐험가",gCaptain:"LUNC 선장",gLegend:"LUNC 전설"},
ja:{gCadet:"LUNCカデット",gExplorer:"LUNCエクスプローラー",gCaptain:"LUNCキャプテン",gLegend:"LUNCレジェンド"},
zh:{gCadet:"LUNC学员",gExplorer:"LUNC探险家",gCaptain:"LUNC船长",gLegend:"LUNC传奇"}
});

/* ================= STATE ================= */
const $ = id => document.getElementById(id);
function loadJSON(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let progress = loadJSON('luncAcademyProgress', null);
if (!progress || !Array.isArray(progress.stars)) progress = { done:[false,false,false,false,false], stars:[0,0,0,0,0], bestScore:[0,0,0,0,0], bestCorrect:[0,0,0,0,0] };
let bestTotal = 0; try { bestTotal = parseInt(localStorage.getItem('luncAcademyBest') || '0', 10) || 0; } catch(e) {}
let muted = false; try { muted = localStorage.getItem('luncAcademyMute') === '1'; } catch(e) {}
const run = { station:0, q:0, score:0, correct:0, streak:0, order:[], answered:false, timer:null, left:15 };
function stations(){ return (CONTENT[LANG_CUR] || CONTENT.en); }
function journeyScore(){ return progress.bestScore.reduce((a,b)=>a+b,0); }
function journeyCorrect(){ return progress.bestCorrect.reduce((a,b)=>a+b,0); }

/* ================= SOUND ================= */
let AC = null;
function beep(f, t0, dur, type, vol){ if (muted) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; const t = AC.currentTime + (t0||0); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.05); } catch(e){} }
const sfx = {
  click(){ beep(520, 0, .07, 'triangle', .06); },
  good(){ beep(659, 0, .12, 'sine', .12); beep(880, .09, .18, 'sine', .12); },
  bad(){ beep(170, 0, .22, 'sawtooth', .05); beep(130, .05, .22, 'sawtooth', .04); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>beep(f, i*.11, .22, 'triangle', .11)); }
};
function applySnd(){ $('sndBtn').textContent = muted ? T('sndOff') : T('sndOn'); $('sndBtn').classList.toggle('on', !muted); }
$('sndBtn').addEventListener('click', ()=>{ muted = !muted; try { localStorage.setItem('luncAcademyMute', muted ? '1' : '0'); } catch(e){} applySnd(); if (!muted) sfx.click(); });

/* ================= STARFIELD ================= */
(function(){
  const cv = $('stars'), ctx = cv.getContext('2d'); let W, H, stars = [];
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; stars = Array.from({length:120}, ()=>({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3, p:Math.random()*6.28, s:.4+Math.random()*1.2 })); }
  size(); addEventListener('resize', size);
  (function loop(t){ ctx.clearRect(0,0,W,H); for (const st of stars){ const a = .35 + .6*Math.abs(Math.sin(t*.0006*st.s + st.p)); ctx.globalAlpha = a; ctx.fillStyle = '#dfe8ff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.29); ctx.fill(); } ctx.globalAlpha = 1; requestAnimationFrame(loop); })(0);
})();

/* ================= SCREENS ================= */
const SCREENS = ['scrMap','scrIntro','scrQuiz','scrDone','scrFinal'];
function show(id){ SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0,0); }
function burst(){ const b = $('burst'); b.innerHTML = ''; b.classList.remove('hidden'); const syms = ['🌙','⭐','✦','🪙']; for (let i=0;i<22;i++){ const s = document.createElement('span'); s.textContent = syms[i%syms.length]; s.style.left = (42+Math.random()*16)+'%'; s.style.top = '38%'; s.style.setProperty('--dx', (Math.random()*320-160)+'px'); s.style.setProperty('--dy', (Math.random()*300-190)+'px'); b.appendChild(s); } setTimeout(()=>b.classList.add('hidden'), 1050); }

/* ================= MAP ================= */
function firstOpen(){ for (let i=0;i<5;i++) if (!progress.done[i]) return i; return 5; }
function renderMap(){
  const list = $('stationList'); list.innerHTML = '';
  const C = stations(); const open = firstOpen();
  for (let i=0;i<5;i++){
    const d = document.createElement('div');
    const state = progress.done[i] ? 'done' : (i <= open ? 'open' : 'locked');
    d.className = 'station ' + state;
    const starsTxt = progress.stars[i] ? '★'.repeat(progress.stars[i]) + '☆'.repeat(3-progress.stars[i]) : '';
    d.innerHTML = '<div class="dot">' + C[i].icon + '</div><div class="meta"><div class="sname">' + (i+1) + '. ' + T('s'+(i+1)) + '</div><div class="ssub">' + T('s'+(i+1)+'sub') + '</div>' + (state==='locked' ? '<div class="lockmsg">' + T('locked') + '</div>' : '') + '</div><div class="sstars">' + starsTxt + '</div>';
    d.addEventListener('click', ()=>{ if (state === 'locked'){ sfx.bad(); d.style.animation = 'shake .4s'; setTimeout(()=>d.style.animation='', 450); return; } sfx.click(); openIntro(i); });
    list.appendChild(d);
  }
  $('btnPlay').textContent = open === 0 ? T('play') : (open === 5 ? T('again') : T('continueBtn'));
  const js = journeyScore();
  $('bestChip').textContent = js > 0 ? TF('best', {s: js}) : T('bestNone');
}
$('btnPlay').addEventListener('click', ()=>{ sfx.click(); const open = firstOpen(); if (open === 5){ progress = { done:[false,false,false,false,false], stars:[0,0,0,0,0], bestScore:[0,0,0,0,0], bestCorrect:[0,0,0,0,0] }; saveJSON('luncAcademyProgress', progress); renderMap(); openIntro(0); } else openIntro(open); });

/* ================= INTRO ================= */
function openIntro(i){
  run.station = i;
  $('introKick').textContent = TF('stationOf', {a: i+1});
  $('introName').textContent = stations()[i].icon + ' ' + T('s'+(i+1));
  $('introFacts').innerHTML = stations()[i].intro;
  show('scrIntro');
}
$('btnStart').addEventListener('click', ()=>{ sfx.click(); startStation(run.station); });
$('btnIntroMap').addEventListener('click', ()=>{ sfx.click(); renderMap(); show('scrMap'); });

/* ================= QUIZ ================= */
function shuffle(a){ const x = a.slice(); for (let i=x.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [x[i],x[j]] = [x[j],x[i]]; } return x; }
function startStation(i){ run.station = i; run.q = 0; run.score = 0; run.correct = 0; run.streak = 0; show('scrQuiz'); renderQ(); }
function renderQ(){
  const st = stations()[run.station]; const q = st.questions[run.q];
  run.order = shuffle(q.a.map((_,idx)=>idx)); run.answered = false; run.left = 15;
  $('hudStation').textContent = st.icon + ' ' + T('s'+(run.station+1));
  updateHud();
  $('qKick').textContent = TF('qOf', {a: run.q+1, b: st.questions.length});
  $('qText').textContent = q.q;
  $('qAfter').classList.add('hidden');
  const box = $('qAnswers'); box.innerHTML = '';
  run.order.forEach((ai, pos)=>{
    const b = document.createElement('button'); b.className = 'ans';
    b.innerHTML = '<span class="key">' + 'ABCD'[pos] + '</span><span></span>';
    b.querySelector('span:last-child').textContent = q.a[ai];
    b.addEventListener('click', ()=>answer(ai, b));
    box.appendChild(b);
  });
  const bar = $('timerBar'); bar.classList.remove('low'); bar.firstElementChild.style.width = '100%';
  clearInterval(run.timer);
  run.timer = setInterval(()=>{ run.left = Math.max(0, run.left - .1); const pct = run.left/15*100; bar.firstElementChild.style.width = pct + '%'; if (run.left <= 5) bar.classList.add('low'); if (run.left <= 0){ clearInterval(run.timer); answer(-1, null); } }, 100);
}
function updateHud(){ $('hudScore').textContent = TF('score', {s: run.score}); $('hudStreak').textContent = TF('streak', {s: run.streak}); }
function answer(ai, btn){
  if (run.answered) return; run.answered = true; clearInterval(run.timer);
  const st = stations()[run.station]; const q = st.questions[run.q];
  const isRight = ai === q.correct;
  const btns = $('qAnswers').children;
  run.order.forEach((origIdx, pos)=>{ if (origIdx === q.correct) btns[pos].classList.add('correct'); else if (pos === run.order.indexOf(ai) && !isRight) btns[pos].classList.add('wrong'); else btns[pos].classList.add('dim'); btns[pos].disabled = true; });
  const v = $('qVerdict');
  if (isRight){
    run.streak++; run.correct++;
    let pts = 100 + Math.round(50 * run.left / 15); let bonus = '';
    if (run.streak >= 3){ pts += 50; bonus = ' 🔥 +50'; }
    run.score += pts;
    v.textContent = T('correct') + ' +' + pts + bonus; v.className = 'verdict good';
    sfx.good(); burst();
  } else {
    run.streak = 0;
    v.textContent = ai === -1 ? T('timeUp') : T('wrong'); v.className = 'verdict bad';
    sfx.bad();
  }
  updateHud();
  $('factText').textContent = q.fact;
  $('qAfter').classList.remove('hidden');
}
$('btnNext').addEventListener('click', ()=>{
  sfx.click();
  const st = stations()[run.station];
  if (run.q < st.questions.length - 1){ run.q++; renderQ(); }
  else finishStation();
});
function finishStation(){
  const i = run.station;
  const starsEarned = run.correct >= 4 ? 3 : run.correct === 3 ? 2 : run.correct === 2 ? 1 : 0;
  progress.done[i] = true;
  progress.stars[i] = Math.max(progress.stars[i], starsEarned);
  progress.bestScore[i] = Math.max(progress.bestScore[i], run.score);
  progress.bestCorrect[i] = Math.max(progress.bestCorrect[i], run.correct);
  saveJSON('luncAcademyProgress', progress);
  $('doneKick').textContent = T('stDone');
  $('doneStars').textContent = starsEarned ? '★'.repeat(starsEarned) + '☆'.repeat(3-starsEarned) : '☆☆☆';
  $('doneScore').textContent = TF('stScore', {s: run.score});
  $('btnNextStation').textContent = i < 4 ? T('nextSt') : T('final');
  sfx.fanfare();
  show('scrDone');
}
$('btnNextStation').addEventListener('click', ()=>{ sfx.click(); if (run.station < 4) openIntro(run.station + 1); else showFinal(); });
$('btnDoneMap').addEventListener('click', ()=>{ sfx.click(); renderMap(); show('scrMap'); });

/* ================= FINAL ================= */
function showFinal(){
  const total = journeyScore(), corr = journeyCorrect();
  let g = GRADES[GRADES.length-1]; for (const gr of GRADES){ if (corr >= gr.min){ g = gr; break; } }
  $('finalKick').textContent = T('final');
  $('gradeTitle').textContent = T(g.key);
  $('finalScore').textContent = TF('finalScore', {s: total});
  $('finalCount').textContent = TF('correctOf', {c: corr});
  const isBest = total > bestTotal;
  if (isBest){ bestTotal = total; try { localStorage.setItem('luncAcademyBest', String(total)); } catch(e){} }
  $('newBestChip').textContent = T('newBest');
  $('newBestChip').classList.toggle('hidden', !isBest);
  sfx.fanfare(); burst();
  show('scrFinal');
}
$('btnAgain').addEventListener('click', ()=>{ sfx.click(); progress = { done:[false,false,false,false,false], stars:[0,0,0,0,0], bestScore:[0,0,0,0,0], bestCorrect:[0,0,0,0,0] }; saveJSON('luncAcademyProgress', progress); renderMap(); openIntro(0); });
$('btnFinalMap').addEventListener('click', ()=>{ sfx.click(); renderMap(); show('scrMap'); });

/* ================= HOW ================= */
$('btnHow').addEventListener('click', ()=>{ sfx.click(); $('howModal').classList.remove('hidden'); });
$('btnHowClose').addEventListener('click', ()=>{ sfx.click(); $('howModal').classList.add('hidden'); });

/* ================= KEYS ================= */
document.addEventListener('keydown', (e)=>{
  if (!$('scrQuiz').classList.contains('hidden')){
    if (!run.answered && ['1','2','3','4'].includes(e.key)){ const pos = parseInt(e.key,10)-1; const btns = $('qAnswers').children; if (btns[pos]) answer(run.order[pos], btns[pos]); }
    else if (run.answered && e.key === 'Enter') $('btnNext').click();
  }
});

/* ================= LANGUAGE ================= */
const langSel = $('langSel');
LANGS.forEach(L => { const o = document.createElement('option'); o.value = L[0]; o.textContent = '🌐 ' + L[1]; langSel.appendChild(o); });
langSel.value = LANG_CUR;
langSel.addEventListener('change', ()=>{ LANG_CUR = langSel.value; try { localStorage.setItem('luncAcademyLang', LANG_CUR); } catch(e){} applyLang(); });
function applyLang(){
  document.documentElement.lang = LANG_CUR;
  $('langLabel').textContent = T('lang');
  $('tagLine').textContent = T('tag');
  $('testTag').textContent = T('test');
  $('btnHow').textContent = T('how');
  $('secNote').textContent = T('sec');
  $('howTitle').textContent = T('howTitle');
  $('howBody').innerHTML = T('howBody');
  $('btnHowClose').textContent = T('close');
  $('btnStart').textContent = T('startBtn');
  $('btnIntroMap').textContent = T('toMap');
  $('btnDoneMap').textContent = T('toMap');
  $('btnFinalMap').textContent = T('toMap');
  $('btnNext').textContent = T('next');
  $('factKick').textContent = T('didYouKnow');
  $('btnAgain').textContent = T('again');
  applySnd();
  renderMap();
  if (!$('scrIntro').classList.contains('hidden')) openIntro(run.station);
  if (!$('scrQuiz').classList.contains('hidden')) renderQ();
}
applyLang();
show('scrMap');
window.ACADEMY = { get progress(){ return progress; }, get run(){ return run; }, CONTENT, I18N, startStation, showFinal, answer };
</script>
