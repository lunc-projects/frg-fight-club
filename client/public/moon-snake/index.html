};
/* ===== Setup ===== */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const COLS=20,ROWS=20,CELL=cv.width/COLS;
let lang=localStorage.getItem('ms_lang')||'en'; if(!T[lang])lang='en';
const sel=document.getElementById('lang');
LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.appendChild(o);});
sel.value=lang;
const $=id=>document.getElementById(id);
function applyLang(){
  const t=T[lang];
  document.title=t.title+' — LUNC';
  $('t_title').textContent=t.title;$('t_score').textContent=t.score;$('t_best').textContent=t.best;
  $('t_len').textContent=t.len;$('t_speed').textContent=t.speed;$('slowmo').textContent=t.slowmo;
  $('howto').innerHTML=t.howto;$('pauseBtn').textContent=paused?t.resume:t.pause;$('restartBtn').textContent=t.restart;
  if(!running){$('ovTitle').textContent= over?t.over:'🌙 '+t.title; $('ovText').textContent= over?(t.final+': '+score+(score>=best&&score>0?' · '+t.newBest:'')):t.ready; $('startBtn').textContent= over?t.again:t.start;}
}
sel.addEventListener('change',()=>{lang=sel.value;localStorage.setItem('ms_lang',lang);applyLang();});
/* ===== Audio (WebAudio synth) ===== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f,dur,type,vol,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);g.gain.setValueAtTime(vol||0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);}
const sEat=()=>{beep(660,0.09,'sine',0.14,990);};
const sGold=()=>{beep(880,0.12,'triangle',0.15,1320);setTimeout(()=>beep(1320,0.16,'triangle',0.12,1760),70);};
const sOver=()=>{beep(320,0.35,'sawtooth',0.10,70);};
const sTurn=()=>{beep(220,0.03,'square',0.03);};
/* ===== State ===== */
let snake,dir,nextDir,orb,gold,goldTimer,score,best=+(localStorage.getItem('ms_best')||0),running=false,over=false,paused=false,slowUntil=0,tickMs,lastTick=0,eatCount=0;
$('best').textContent=best;
function freeCell(){while(true){const c={x:(Math.random()*COLS)|0,y:(Math.random()*ROWS)|0};if(!snake.some(s=>s.x===c.x&&s.y===c.y)&&!(orb&&orb.x===c.x&&orb.y===c.y)&&!(gold&&gold.x===c.x&&gold.y===c.y))return c;}}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;eatCount=0;gold=null;goldTimer=0;slowUntil=0;tickMs=170;over=false;paused=false;
  orb=freeCell();updateHud();
}
function updateHud(){$('score').textContent=score;$('best').textContent=best;$('len').textContent=snake.length;$('speed').textContent=(170/currentTick()).toFixed(1)+'x';}
function currentTick(){return (performance.now()<slowUntil)?tickMs*1.8:tickMs;}
function startGame(){ac();reset();running=true;$('overlay').classList.add('hidden');applyLang();updateHud();lastTick=performance.now();}
function gameOver(){running=false;over=true;sOver();if(score>best){best=score;localStorage.setItem('ms_best',best);}updateHud();$('overlay').classList.remove('hidden');applyLang();}
/* ===== Logic ===== */
function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){gameOver();return;}
  const eatingOrb=orb&&head.x===orb.x&&head.y===orb.y;
  const eatingGold=gold&&head.x===gold.x&&head.y===gold.y;
  const bodyToCheck=(eatingOrb||eatingGold)?snake:snake.slice(0,-1);
  if(bodyToCheck.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  if(eatingOrb){score+=10;eatCount++;sEat();orb=freeCell();tickMs=Math.max(70,170-eatCount*4);if(!gold&&Math.random()<0.35){gold=freeCell();goldTimer=performance.now()+8000;}}
  else if(eatingGold){score+=50;sGold();gold=null;slowUntil=performance.now()+3500;$('slowmo').style.display='block';}
  else snake.pop();
  if(gold&&performance.now()>goldTimer)gold=null;
  if(performance.now()>=slowUntil)$('slowmo').style.display='none';
  updateHud();
}
function setDir(x,y){if(!running||paused)return;if(dir.x===-x&&dir.y===-y)return;if(nextDir.x!==x||nextDir.y!==y){nextDir={x,y};sTurn();}}
/* ===== Drawing ===== */
const craters=[];for(let i=0;i<14;i++)craters.push({x:Math.random(),y:Math.random(),r:18+Math.random()*46});
const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,p:Math.random()*6.28});
function draw(now){
  const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#141b3a');g.addColorStop(1,'#0a0f24');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  stars.forEach(s=>{ctx.globalAlpha=0.35+0.3*Math.sin(now/700+s.p);ctx.fillStyle='#dfe8ff';ctx.beginPath();ctx.arc(s.x*cv.width,s.y*cv.height,s.r,0,6.29);ctx.fill();});
  ctx.globalAlpha=1;
  // crater floor
  ctx.fillStyle='#232c52';ctx.fillRect(6,6,cv.width-12,cv.height-12);
  craters.forEach(c=>{const x=c.x*cv.width,y=c.y*cv.height;const rg=ctx.createRadialGradient(x-c.r*0.25,y-c.r*0.25,c.r*0.15,x,y,c.r);rg.addColorStop(0,'#2e3a68');rg.addColorStop(0.75,'#1a2247');rg.addColorStop(1,'#121836');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,c.r,0,6.29);ctx.fill();ctx.strokeStyle='rgba(140,165,255,0.13)';ctx.lineWidth=2;ctx.stroke();});
  // grid hint
  ctx.strokeStyle='rgba(120,150,255,0.05)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=1;i<COLS;i++){ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);}for(let i=1;i<ROWS;i++){ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);}ctx.stroke();
  // rim wall
  ctx.strokeStyle='#f5b921';ctx.lineWidth=4;ctx.strokeRect(2,2,cv.width-4,cv.height-4);
  ctx.strokeStyle='rgba(245,185,33,0.25)';ctx.lineWidth=9;ctx.strokeRect(2,2,cv.width-4,cv.height-4);
  // orbs
  function drawOrb(o,color,core,label){const cx=o.x*CELL+CELL/2,cy=o.y*CELL+CELL/2,pulse=1+0.12*Math.sin(now/220);const rg=ctx.createRadialGradient(cx,cy,1,cx,cy,CELL*0.62*pulse);rg.addColorStop(0,core);rg.addColorStop(0.55,color);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,CELL*0.62*pulse,0,6.29);ctx.fill();ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,CELL*0.3,0,6.29);ctx.fill();ctx.fillStyle='#0a1030';ctx.font='bold '+Math.round(CELL*0.34)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,cx,cy+1);}
  if(orb)drawOrb(orb,'rgba(64,200,255,0.55)','#aee9ff','L');
  if(gold)drawOrb(gold,'rgba(245,185,33,0.6)','#ffe98a','U');
  // snake body (tail -> head)
  for(let i=snake.length-1;i>=1;i--){const s=snake[i],x=s.x*CELL,y=s.y*CELL;const t=i/snake.length;
    ctx.fillStyle='rgb('+Math.round(120+60*(1-t))+','+Math.round(140+50*(1-t))+','+Math.round(235)+')';
    roundRect(x+2.5,y+2.5,CELL-5,CELL-5,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.16)';roundRect(x+5,y+4,CELL-10,5,2.5);ctx.fill();
    if(i%3===0){ctx.fillStyle='#f5b921';ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,3,0,6.29);ctx.fill();ctx.fillStyle='#0a1030';ctx.beginPath();ctx.arc(x+CELL/2-1.4,y+CELL/2-1.4,1.6,0,6.29);ctx.fill();}
  }
  // head: astronaut helmet with face
  const h=snake[0],hx=h.x*CELL,hy=h.y*CELL,cx=hx+CELL/2,cy=hy+CELL/2;
  ctx.fillStyle='#f2f5ff';ctx.beginPath();ctx.arc(cx,cy,CELL*0.52,0,6.29);ctx.fill();
  ctx.strokeStyle='#f5b921';ctx.lineWidth=2;ctx.stroke();
  const fx=dir.x,fy=dir.y;
  const vx=cx+fx*2.5,vy=cy+fy*2.5;
  ctx.fillStyle='#7fd4ff';ctx.beginPath();ctx.ellipse(vx,vy,CELL*0.34,CELL*0.30,0,0,6.29);ctx.fill();
  ctx.strokeStyle='#2b4a7a';ctx.lineWidth=1.4;ctx.stroke();
  // face inside visor
  ctx.fillStyle='#16264d';
  const ex=fx*3,ey=fy*3,px=-fy,py=fx;
  ctx.beginPath();ctx.arc(vx+ex+px*4.4,vy+ey+py*4.4,1.7,0,6.29);ctx.fill();
  ctx.beginPath();ctx.arc(vx+ex-px*4.4,vy+ey-py*4.4,1.7,0,6.29);ctx.fill();
  ctx.strokeStyle='#16264d';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(vx+ex,vy+ey+2.6,3.4,0.25,Math.PI-0.25);ctx.stroke();
  ctx.fillStyle='#ff8fa3';ctx.beginPath();ctx.arc(vx+ex+px*6.4,vy+ey+py*6.4+1.5,1.5,0,6.29);ctx.fill();ctx.beginPath();ctx.arc(vx+ex-px*6.4,vy+ey-py*6.4+1.5,1.5,0,6.29);ctx.fill();
  // crescent decal on helmet top
  ctx.fillStyle='#f5b921';ctx.beginPath();ctx.arc(cx-4,hy+4.6,3.1,0,6.29);ctx.fill();ctx.fillStyle='#f2f5ff';ctx.beginPath();ctx.arc(cx-2.8,hy+4.2,2.5,0,6.29);ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function loop(now){requestAnimationFrame(loop);if(running&&!paused&&now-lastTick>=currentTick()){lastTick=now;step();}draw(now||0);}
reset();applyLang();requestAnimationFrame(loop);
/* ===== Controls ===== */
$('startBtn').addEventListener('click',startGame);
$('restartBtn').addEventListener('click',startGame);
$('pauseBtn').addEventListener('click',()=>{if(!running)return;paused=!paused;$('pauseBtn').textContent=paused?T[lang].resume:T[lang].pause;});
const DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
document.addEventListener('keydown',e=>{const d=DIRS[e.key];if(d){e.preventDefault();if(!running&&!over)startGame();setDir(d[0],d[1]);}if(e.key===' '){e.preventDefault();if(!running)startGame();}});
function bindBtn(id,x,y){const el=$(id);const h=e=>{e.preventDefault();setDir(x,y);};el.addEventListener('touchstart',h,{passive:false});el.addEventListener('mousedown',h);}
bindBtn('dUp',0,-1);bindBtn('dDown',0,1);bindBtn('dLeft',-1,0);bindBtn('dRight',1,0);
let tsx=0,tsy=0;
cv.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;ac();},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);},{passive:true});
cv.addEventListener('mousedown',()=>ac());
window.__snake={get score(){return score},get running(){return running},get snake(){return snake},get orb(){return orb},setDir,start:startGame};
</script>
