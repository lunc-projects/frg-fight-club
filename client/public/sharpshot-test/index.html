<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">

<div id="langWrap">

  <div id="langMenu" class="hidden"></div>
</div>

<!-- MENU -->
<div id="menuScr" class="screen">

  <button class="btn ghost" id="gunBtn" data-i="choosegun"></button>
  <div class="howto" data-i="how"></div>
  <div class="sec-title" data-i="boardR"></div>
  <div id="boardRange"></div>
  <div class="sec-title" data-i="boardH"></div>
  <div id="boardHunt"></div>
  <div class="local-note" data-i="local"></div>
  <div class="foot">SHARPSHOT · LUNC DEV STUDIO · LUNA CLASSIC</div>
</div>

<!-- GUN SELECT -->
<div id="gunScr" class="screen hidden">

</div>

<!-- RESULTS -->

  <div class="big-score" id="endScore">0</div>
  <div id="endStats"></div>
  <div id="nameRow">
    <input id="nameInput" maxlength="10" autocomplete="off">
    <button id="saveBtn" data-i="save"></button>
  </div>
  <button class="btn" id="againBtn"></button>
  <button class="btn blue" id="nextBtn"></button>
  <button class="btn ghost" id="endGunBtn" data-i="choosegun"></button>
  <button class="btn ghost" id="endMenuBtn" data-i="menu"></button>
  <div class="foot">SHARPSHOT · LUNC DEV STUDIO</div>
</div>

<!-- PAUSE -->
<div id="pauseScr" class="screen hidden">
  <h1 class="screenTitle" data-i="paused"></h1>
  <button class="btn" id="resumeBtn" data-i="resume"></button>
  <button class="btn ghost" id="pauseGunBtn" data-i="choosegun"></button>
  <button class="btn ghost" id="quitBtn" data-i="quit"></button>
  <div class="foot">SHARPSHOT · LUNC DEV STUDIO</div>
</div>

const loader = new GLTFLoader();
const MODELS = {};
let modelsReady = false;
async function loadModels(){
  const files = { bottle:'models/bottle.glb', bottleGold:'models/bottle_gold.glb', enemyA:'models/enemy_a.glb', enemyB:'models/enemy_b.glb' };
  GUNS.forEach(g => files['gun_' + g.id] = 'models/' + g.file);

}

const fxGroup = new THREE.Group(); scene.add(fxGroup);
const shards = [], beams = [];
const shardGeo = new THREE.TetrahedronGeometry(0.045);
function spawnShards(pos, colorHex){
  const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.1, transparent: true });
  for (let i = 0; i < 11; i++){
    const m = new THREE.Mesh(shardGeo, mat); m.position.copy(pos);
    m.userData.v = new THREE.Vector3((Math.random()-0.5)*2.6, Math.random()*2.4 + 0.6, (Math.random()-0.5)*2.6);
    m.userData.life = 0.65; fxGroup.add(m); shards.push(m);
  }
}
const beamMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
const beamMatEnemy = new THREE.MeshBasicMaterial({ color: 0xff5040, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
function spawnBeam(a, b, enemy){
  const len = a.distanceTo(b); if (len < 0.1) return;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, len, 5), enemy ? beamMatEnemy : beamMat);
  m.position.copy(a).lerp(b, 0.5);
  m.lookAt(b); m.rotateX(Math.PI/2);
  m.userData.life = 0.07; fxGroup.add(m); beams.push(m);
}
function updateFx(dt){
  for (let i = shards.length - 1; i >= 0; i--){ const s = shards[i]; s.userData.life -= dt; s.userData.v.y -= 7.5 * dt; s.position.addScaledVector(s.userData.v, dt); s.rotation.x += dt * 7; s.rotation.y += dt * 9; s.material.opacity = Math.max(0, s.userData.life / 0.65); if (s.userData.life <= 0 || s.position.y < 0.02){ fxGroup.remove(s); shards.splice(i, 1); } }
  for (let i = beams.length - 1; i >= 0; i--){ const b = beams[i]; b.userData.life -= dt; if (b.userData.life <= 0){ fxGroup.remove(b); b.geometry.dispose(); beams.splice(i, 1); } }
  const sea = rangeGroup.getObjectByName('sea'); if (sea && rangeGroup.visible) sea.position.y = 0.06 + Math.sin(perfNow * 0.0011) * 0.03;
  for (let i = 0; i < 3; i++){ const f = rangeGroup.getObjectByName('foam' + i); if (f && rangeGroup.visible) f.position.z = -19.6 - i * 1.3 + Math.sin(perfNow * 0.0009 + i) * 0.35; }
  const bc = huntGroup.getObjectByName('beacon'); if (bc && huntGroup.visible) bc.material.emissiveIntensity = 2 + Math.sin(perfNow * 0.006) * 1.6;
}

/* ==================== BOTTLES ==================== */
function placeBottle(stand){
  const tpl = MODELS.bottle; if (!tpl) return null;
  const gold = Math.random() < 0.13;
  const grp = (gold && MODELS.bottleGold ? MODELS.bottleGold : tpl).clone(true);
  grp.scale.setScalar(1.3);
  grp.position.set(stand.x, stand.topY, stand.z);
  grp.rotation.y = Math.random() * 6.28;
  grp.userData.isBottle = true;
  rangeGroup.add(grp);
  const b = { grp, stand, gold, alive: true, respawnT: 0, center: new THREE.Vector3(stand.x, stand.topY + 0.5, stand.z) };
  grp.userData.ref = b; bottles.push(b); return b;
}
function setupBottles(){ bottles.forEach(b => rangeGroup.remove(b.grp)); bottles.length = 0; STANDS.forEach(s => placeBottle(s)); }
function breakBottle(b){
  b.alive = false; b.respawnT = 0.9; rangeGroup.remove(b.grp);
  state.breaks++;
  const now = perfNow; state.combo = (now - state.comboT < 2500) ? state.combo + 1 : 1; state.comboT = now;
  let pts = b.gold ? 300 : 100; pts += (state.combo - 1) * 10; state.score += pts;
  spawnShards(b.center, b.gold ? 0xf0b429 : 0x2fae6a); sfxGlass(); hitmark();
  if (state.combo >= 3) toast(T('combo') + ' ×' + state.combo + '  +' + pts); else toast('+' + pts, 600);
}

/* ==================== ENEMIES ==================== */
function spawnWave(n){
  enemies.forEach(e => huntGroup.remove(e.grp)); enemies = [];
  const count = Math.min(3 + n, 8);
  const hp = 90 + (n - 1) * 20;
  const spawns = [...SPAWNS].sort(() => Math.random() - 0.5);
  for (let i = 0; i < count; i++){
    const tpl = i % 2 ? MODELS.enemyB : MODELS.enemyA; if (!tpl) continue;
    const grp = tpl.clone(true); const sp = spawns[i % spawns.length];
    grp.position.set(sp.x, 0, sp.z); grp.userData.isEnemy = true;
    const sh = new THREE.Mesh(new THREE.CircleGeometry(0.55, 18), M.shadowBlob); sh.rotation.x = -Math.PI/2; sh.position.y = 0.02; grp.add(sh);
    huntGroup.add(grp);
    const e = { grp, hp, maxHp: hp, st: 'move', t: Math.random() * 0.8, cover: i % COVERS.length, burst: 0, speed: Math.min(1.5 + n * 0.12, 2.7), dmg: Math.min(6 + n, 12), shotT: 0 };
    grp.userData.ref = e; enemies.push(e);
  }
}
function coverStandPos(e){
  const c = COVERS[e.cover];
  return new THREE.Vector3(c.x, 0, c.z + c.d/2 + 0.62);
}
function damageEnemy(e, dmg, head){
  e.hp -= dmg; hitmark(); sfxHit();
  if (e.hp <= 0 && e.st !== 'dead'){
    e.st = 'dead'; e.t = 1.15; state.kills++;
    state.score += 150 + (head ? 50 : 0);
    toast(head ? '🎯 HEADSHOT +200' : '+150');
    const snd = () => { if (audio()){ const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type='triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(70, t+0.2); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.22); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.24); } }; snd();
  }
}
function hurtPlayer(dmg){
  state.hp -= dmg; sfxHurt();
  const v = $('dmgVin'); v.style.opacity = 0.95; setTimeout(() => v.style.opacity = 0, 130);
  if (state.hp <= 0){ state.hp = 0; endRun('over'); }
}
function updateEnemies(dt){
  const p = player.pos;
  enemies.forEach(e => {
    const g = e.grp;
    if (e.st === 'dead'){ e.t -= dt; g.rotation.x = Math.max(-Math.PI/2, g.rotation.x - dt * 4.2); if (e.t < 0.45) g.position.y -= dt * 0.5; if (e.t <= 0){ huntGroup.remove(g); } return; }
    g.lookAt(p.x, 0, p.z); g.rotateY(Math.PI);
    if (e.st === 'move'){
      const tp = coverStandPos(e); const d = new THREE.Vector3(tp.x - g.position.x, 0, tp.z - g.position.z); const dist = d.length();
      if (dist < 0.25){ e.st = 'aim'; e.t = Math.max(0.28, 0.5 - state.wave * 0.02); }
      else { d.normalize(); g.position.addScaledVector(d, e.speed * dt); }
    } else if (e.st === 'aim'){
      e.t -= dt; if (e.t <= 0){ e.st = 'fire'; e.burst = 3; e.shotT = 0; }
    } else if (e.st === 'fire'){
      e.shotT -= dt;
      if (e.shotT <= 0){
        e.shotT = 0.27; e.burst--;
        const from = g.position.clone(); from.y = 1.18; from.addScaledVector(new THREE.Vector3(p.x - g.position.x, 0, p.z - g.position.z).normalize(), 0.55);
        const distP = g.position.distanceTo(p);
        const playerMoving = Math.hypot(joyVec.x, joyVec.y) > 0.25 || dragMoving;
        const chance = THREE.MathUtils.clamp(0.46 - distP * 0.007 - (playerMoving ? 0.09 : 0), 0.10, 0.44);
        const hit = Math.random() < chance;
        const target = new THREE.Vector3(p.x + (hit ? 0 : (Math.random()-0.5)*3), 1.25 + (hit ? 0 : (Math.random()-0.5)*1.2), p.z + (hit ? 0 : (Math.random()-0.5)*3));
        spawnBeam(from, target, true);
        if (hit) hurtPlayer(e.dmg);
        if (audio()){ const t = AC.currentTime, o = AC.createOscillator(), og = AC.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(90, t+0.07); og.gain.setValueAtTime(0.05, t); og.gain.exponentialRampToValueAtTime(0.001, t+0.08); o.connect(og).connect(AC.destination); o.start(t); o.stop(t+0.09); }
        if (e.burst <= 0){ e.st = 'move'; let nc = Math.floor(Math.random() * COVERS.length); if (nc === e.cover) nc = (nc + 3) % COVERS.length; e.cover = nc; }
      }
    }
  });
  enemies = enemies.filter(e => !(e.st === 'dead' && e.t <= 0));
  if (state.playing && state.mode === 'hunt' && enemies.length === 0) endRun('clear');
}

/* ==================== SHOOTING ==================== */
const muzzleV = new THREE.Vector3();
function effDmg(g, dist){ if (dist <= g.falloff) return g.dmg; const f = 1 - (dist - g.falloff) / Math.max(1, g.range - g.falloff) * 0.7; return g.dmg * Math.max(0.3, f); }
function shoot(){
  const g = gun(); lastShot = perfNow; state.pulls++;
  scene.updateMatrixWorld(true);
  sfxShot(g);
  if (flashMesh){ flashMesh.visible = true; flashMesh.rotation.z = Math.random() * 6.28; setTimeout(() => flashMesh.visible = false, 42); }
  player.pitch += g.kick * (0.7 + Math.random() * 0.5);
  if (gunMesh) gunMesh.position.z = g.pos[2] + 0.045;
  if (gunMesh){ gunMesh.updateWorldMatrix(true, false); muzzleV.set(0, 0.035, g.tipZ - 0.08); gunMesh.localToWorld(muzzleV); }
  else muzzleV.copy(camera.position);
  const origin = new THREE.Vector3(player.pos.x, 1.6, player.pos.z);
  const baseDir = new THREE.Vector3(-Math.sin(player.yaw) * Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw) * Math.cos(player.pitch));
  const blockers = [];
  if (state.mode === 'range') rangeGroup.traverse(o => { if (o.userData.stand) blockers.push(o); });
  else huntGroup.traverse(o => { if (o.userData.cover || o.userData.wall) blockers.push(o); });
  for (let p = 0; p < g.pellets; p++){
    const dir = baseDir.clone();
    dir.x += ((Math.random() + Math.random()) - 1) * g.spread; dir.y += ((Math.random() + Math.random()) - 1) * g.spread; dir.z += ((Math.random() + Math.random()) - 1) * g.spread; dir.normalize();
    // ---- generous aim assist: snap to best target inside a cone ----
    let best = null, bestAng = 0.062;
    const consider = (center) => { const to = center.clone().sub(origin); const ang = dir.angleTo(to.clone().normalize()); if (ang < bestAng){ bestAng = ang; best = to.normalize(); } };
    if (state.mode === 'range') bottles.forEach(b => { if (b.alive) consider(b.center); });
    else enemies.forEach(e => { if (e.st !== 'dead') consider(e.grp.position.clone().setY(1.22)); });
    if (best) dir.copy(best);
    raycaster.set(origin, dir); raycaster.far = g.range + 12;
    let hitPoint = origin.clone().addScaledVector(dir, g.range);
    let targetHit = null, targetKind = null, head = false;
    const pools = [];
    if (state.mode === 'range'){ bottles.forEach(b => { if (b.alive) pools.push(b.grp); }); }
    else { enemies.forEach(e => { if (e.st !== 'dead') pools.push(e.grp); }); }
    const hitsT = raycaster.intersectObjects(pools, true);
    const hitsB = raycaster.intersectObjects(blockers, false);
    const dT = hitsT.length ? hitsT[0].distance : 1e9, dB = hitsB.length ? hitsB[0].distance : 1e9;
    if (dT < dB && dT <= g.range + 12){
      hitPoint = hitsT[0].point; targetHit = hitsT[0].object;
      let o = targetHit; while (o){ if (o.userData.isBottle){ targetKind = 'bottle'; targetHit = o; break; } if (o.userData.isEnemy){ targetKind = 'enemy'; targetHit = o; const nm = hitsT[0].object.name || ''; head = (nm === 'visor' || nm === 'head'); break; } o = o.parent; }
    } else if (dB < 1e8) hitPoint = hitsB[0].point;
    spawnBeam(muzzleV.clone(), hitPoint, false);
    if (targetKind === 'bottle' && targetHit.userData.ref && targetHit.userData.ref.alive) breakBottle(targetHit.userData.ref);
    else if (targetKind === 'enemy' && targetHit.userData.ref && targetHit.userData.ref.st !== 'dead'){
      const dist = origin.distanceTo(targetHit.userData.ref.grp.position);
      damageEnemy(targetHit.userData.ref, effDmg(g, dist) * (head ? 2 : 1), head);
    }
  }
  updateHud();
}
function tryFire(){ if (!state.playing || state.paused) return; if (perfNow - lastShot < gun().interval) return; shoot(); }

/* ==================== INPUT ==================== */
let dragId = null, dragLX = 0, dragLY = 0, dragMoving = false;
const joyVec = { x: 0, y: 0 }; let joyId = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { audio(); if (dragId === null){ dragId = e.pointerId; dragLX = e.clientX; dragLY = e.clientY; } });
addEventListener('pointermove', e => {
  if (e.pointerId === dragId){
    const dx = e.clientX - dragLX, dy = e.clientY - dragLY; dragLX = e.clientX; dragLY = e.clientY;
    dragMoving = Math.abs(dx) + Math.abs(dy) > 1;
    if (state.playing && !state.paused){ player.yaw -= dx * 0.0042; player.pitch -= dy * 0.0042; player.pitch = THREE.MathUtils.clamp(player.pitch, -1.15, 1.25); }
  }
  if (e.pointerId === joyId){
    const r = $('joy').getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = (e.clientX - cx) / (r.width/2), dy = (e.clientY - cy) / (r.height/2);
    const m = Math.hypot(dx, dy); if (m > 1){ dx /= m; dy /= m; }
    joyVec.x = dx; joyVec.y = dy;
    $('joyKnob').style.transform = `translate(calc(-50% + ${dx * 34}px), calc(-50% + ${dy * 34}px))`;
  }
});
addEventListener('pointerup', e => { if (e.pointerId === dragId){ dragId = null; dragMoving = false; } if (e.pointerId === joyId){ joyId = null; joyVec.x = joyVec.y = 0; $('joyKnob').style.transform = 'translate(-50%,-50%)'; } });
addEventListener('pointercancel', e => { if (e.pointerId === dragId) dragId = null; if (e.pointerId === joyId){ joyId = null; joyVec.x = joyVec.y = 0; } });
$('joy').addEventListener('pointerdown', e => { e.stopPropagation(); audio(); joyId = e.pointerId; });
$('fireBtn').addEventListener('pointerdown', e => { e.preventDefault(); audio(); firing = true; tryFire(); });
addEventListener('pointerup', () => firing = false);
$('fireBtn').addEventListener('pointerleave', () => firing = false);
$('aimBtn').addEventListener('click', () => { player.ads = !player.ads; $('aimBtn').classList.toggle('on', player.ads); sfxClick(); });
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space'){ firing = true; tryFire(); e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') firing = false; });

/* ==================== FLOW ==================== */
let gunReturn = 'menu';
function openGunScreen(from){ gunReturn = from; buildGunGrid(); showScreen('gunScr'); }
function closeGunScreen(){
  if (gunReturn === 'end') showScreen('endScr');
  else if (gunReturn === 'pause') showScreen('pauseScr');
  else showScreen('menuScr');
  attachGun();
}
function setMood(mode){
  if (mode === 'range'){ scene.fog.color.set(0xa8d4f0); scene.fog.near = 45; scene.fog.far = 130; hemi.color.set(0xeaf6ff); hemi.groundColor.set(0x8a6f45); hemi.intensity = 1.05; sun.color.set(0xfff2d8); sun.intensity = 1.7; sun.position.set(14, 24, 10); }
  else { scene.fog.color.set(0x2a1630); scene.fog.near = 22; scene.fog.far = 85; hemi.color.set(0xffd9c0); hemi.groundColor.set(0x33222a); hemi.intensity = 0.75; sun.color.set(0xffb37a); sun.intensity = 1.15; sun.position.set(-10, 15, -14); }
}
function startRange(){
  audio(); state.mode = 'range'; state.playing = true; state.paused = false; state.saved = false;
  state.score = 0; state.pulls = 0; state.breaks = 0; state.combo = 0; state.timeLeft = 60;
  player.pos.set(0, 0, 6); player.yaw = 0; player.pitch = 0; player.ads = false; $('aimBtn').classList.remove('on');
  rangeGroup.visible = true; huntGroup.visible = false; setMood('range');
  setupBottles(); showScreen(null); setControls(); attachGun(); updateHud(); startMusic();
  toast('🎯 ' + T('range'), 1100);
}
function startHunt(wave, keep){
  audio(); state.mode = 'hunt'; state.playing = true; state.paused = false; state.saved = false;
  if (!keep){ state.score = 0; state.kills = 0; }
  state.wave = wave; state.hp = keep ? Math.min(100, state.hp + 50) : 100;
  player.pos.set(0, 0, 14); player.yaw = 0; player.pitch = 0; player.ads = false; $('aimBtn').classList.remove('on');
  rangeGroup.visible = false; huntGroup.visible = true; setMood('hunt');
  spawnWave(wave); showScreen(null); setControls(); attachGun(); updateHud(); startMusic();
  toast('🌙 ' + T('wave') + ' ' + wave, 1100);
}
function endRun(kind){
  state.playing = false; firing = false; stopMusic();
  showScreen('endScr'); setControls(); gunHolder.visible = false;
  $('nameRow').classList.remove('hidden'); $('nameInput').value = localStorage.getItem('sharpshot_name') || '';
  const prevBest = getBoard(state.mode)[0];
  const isBest = !prevBest || state.score > prevBest.score;
  $('newBestTag').classList.toggle('hidden', !(isBest && state.score > 0));
  $('nextBtn').classList.toggle('hidden', kind !== 'clear');
  $('againBtn').textContent = T('retry');
  if (kind === 'clear'){ $('endTitle').textContent = T('clear'); sfxJingle(true); }
  else if (kind === 'over'){ $('endTitle').textContent = T('over'); sfxJingle(false); }
  else { $('endTitle').textContent = T('rangedone'); sfxJingle(true); }
  $('endScore').textContent = state.score;
  let rows = '';
  if (state.mode === 'range'){ const acc = state.pulls ? Math.min(100, Math.round(state.breaks / state.pulls * 100)) : 0; rows = `<div class="stat-row">${T('breaks')}: <b>${state.breaks}</b></div><div class="stat-row">${T('acc')}: <b>${acc}%</b></div>`; }
  else { rows = `<div class="stat-row">${T('kills')}: <b>${state.kills}</b></div><div class="stat-row">${T('waves')}: <b>${kind === 'clear' ? state.wave : state.wave - 1}</b></div>`; }
  rows += `<div class="stat-row">${T('gun')}: <b>${gun().name}</b></div>`;
  $('endStats').innerHTML = rows;
}
function toMenu(){
  state.playing = false; state.mode = null; firing = false; stopMusic();
  rangeGroup.visible = true; huntGroup.visible = false; setMood('range');
  showScreen('menuScr'); setControls(); gunHolder.visible = false; renderBoards();
}
/* buttons */
$('playRangeBtn').onclick = () => { sfxClick(); startRange(); };
$('playHuntBtn').onclick = () => { sfxClick(); startHunt(1, false); };
$('gunBtn').onclick = () => { sfxClick(); openGunScreen('menu'); };
$('gunBackBtn').onclick = () => { sfxClick(); closeGunScreen(); };
$('endGunBtn').onclick = () => { sfxClick(); openGunScreen('end'); };
$('pauseGunBtn').onclick = () => { sfxClick(); openGunScreen('pause'); };
$('againBtn').onclick = () => { sfxClick(); if (state.mode === 'range') startRange(); else startHunt(1, false); };
$('nextBtn').onclick = () => { sfxClick(); startHunt(state.wave + 1, true); };
$('endMenuBtn').onclick = () => { sfxClick(); toMenu(); };
$('saveBtn').onclick = () => { sfxClick(); saveScore(); };
$('pauseBtn').onclick = () => { if (!state.playing) return; state.paused = true; stopMusic(); showScreen('pauseScr'); };
$('resumeBtn').onclick = () => { sfxClick(); state.paused = false; showScreen(null); startMusic(); };
$('quitBtn').onclick = () => { sfxClick(); state.paused = false; toMenu(); };
$('muteBtn').onclick = () => { musicOn = !musicOn; localStorage.setItem('sharpshot_mute', musicOn ? '0' : '1'); $('muteBtn').textContent = musicOn ? '🔊' : '🔇'; if (musicOn) startMusic(); else stopMusic(); };
$('muteBtn').textContent = musicOn ? '🔊' : '🔇';

/* ==================== MAIN LOOP ==================== */
const clock = new THREE.Clock();
let fovCur = 72;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); perfNow = clock.elapsedTime * 1000;
  if (state.playing && !state.paused){
    if (firing) tryFire();
    // camera
    if (state.mode === 'hunt'){
      const sp = 5.2, fx = joyVec.x, fy = -joyVec.y;
      let mx = fx, mz = fy;
      if (keys.KeyW) mz += 1; if (keys.KeyS) mz -= 1; if (keys.KeyA) mx -= 1; if (keys.KeyD) mx += 1;
      const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
      const wx = (mx * cos - mz * sin), wz = (-mx * sin - mz * cos);
      player.pos.x += wx * sp * dt; player.pos.z += wz * sp * dt;
      player.pos.x = THREE.MathUtils.clamp(player.pos.x, -18.6, 18.6);
      player.pos.z = THREE.MathUtils.clamp(player.pos.z, -19.6, 17.6);
      COVERS.forEach(c => { const ex = c.w/2 + 0.45, ez = c.d/2 + 0.45; const dx = player.pos.x - c.x, dz = player.pos.z - c.z; if (Math.abs(dx) < ex && Math.abs(dz) < ez){ if (ex - Math.abs(dx) < ez - Math.abs(dz)) player.pos.x = c.x + Math.sign(dx || 1) * ex; else player.pos.z = c.z + Math.sign(dz || 1) * ez; } });
      updateEnemies(dt);
    } else if (state.mode === 'range'){
      state.timeLeft -= dt;
      [...bottles].forEach(b => { if (!b.alive){ b.respawnT -= dt; if (b.respawnT <= 0){ placeBottle(b.stand); bottles.splice(bottles.indexOf(b), 1); } } });
      if (state.timeLeft <= 0) endRun('range');
    }
    updateHud();
  }
  // camera transform
  if (state.mode){
    camera.position.set(player.pos.x, 1.6, player.pos.z);
    camera.rotation.order = 'YXZ'; camera.rotation.y = player.yaw; camera.rotation.x = player.pitch; camera.rotation.z = 0;
  } else {
    const t = perfNow * 0.00006; camera.position.set(Math.sin(t) * 3.5, 1.7, 6.5); camera.rotation.order = 'YXZ'; camera.rotation.y = Math.sin(t * 0.7) * 0.16; camera.rotation.x = -0.02; camera.rotation.z = 0;
  }
  // ADS / fov
  const g = gun(); const targetFov = (state.playing && player.ads) ? 72 / g.zoom : 72;
  fovCur += (targetFov - fovCur) * Math.min(1, dt * 11);
  if (Math.abs(fovCur - camera.fov) > 0.05){ camera.fov = fovCur; camera.updateProjectionMatrix(); }
  $('scopeOv').style.opacity = (state.playing && player.ads && g.id === 'sniper') ? 1 : 0;
  if (gunMesh && state.playing){
    const adsPos = { x: 0, y: -0.148, z: -0.30 };
    const tx = player.ads && g.zoom > 1.2 ? adsPos.x : g.pos[0], ty = player.ads && g.zoom > 1.2 ? adsPos.y : g.pos[1];
    gunMesh.position.x += (tx - gunMesh.position.x) * Math.min(1, dt * 12);
    gunMesh.position.y += (ty - gunMesh.position.y) * Math.min(1, dt * 12);
    gunMesh.position.z += ((g.pos[2]) - gunMesh.position.z) * Math.min(1, dt * 10);
    gunMesh.position.y += Math.sin(perfNow * 0.0022) * 0.0006;
  }
  updateFx(dt);
  renderer.render(scene, camera);
}
applyI18n(); renderBoards(); buildGunGrid(); toMenu();
loadModels().then(() => { attachGun(); });
animate();

/* ==================== QA HOOKS ==================== */
window.__SS = {
  state, GUNS, gun, selectGun, startRange, startHunt, endRun,
  bottles: () => bottles, enemies: () => enemies,
  modelsReady: () => modelsReady,
  fire: () => { lastShot = -9999; shoot(); },
  holdFire: v => firing = !!v,
  setAim: (yaw, pitch) => { player.yaw = yaw; player.pitch = pitch; },
  aimAt: (v3) => { const d = v3.clone().sub(camera.position); player.yaw = Math.atan2(-d.x, -d.z); player.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z)); },
  player, camera, scene, MODELS
};
</script>
</body>
