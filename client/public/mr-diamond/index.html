<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MR DIAMOND — Luna Classic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070f; font-family:Arial,Helvetica,sans-serif; }
  #wrap { position:fixed; inset:0; overflow:hidden; background:#05070f; }
  canvas#game { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:20; padding:16px; }
  #titleScreen { background:linear-gradient(180deg, rgba(3,6,18,.42) 0%, rgba(3,6,18,.10) 45%, rgba(3,6,18,.55) 100%); }
  .crescent { font-size:44px; color:#f5c542; text-shadow:0 0 22px rgba(245,197,66,.8); line-height:1; }
  h1.title { font-size:min(13vw,84px); letter-spacing:.06em; font-weight:900; line-height:.95;
    background:linear-gradient(180deg,#fff3c4 0%,#f5c542 38%,#b8860b 55%,#ffe98a 78%,#a87408 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#f5c542;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.65)); }
  .subtitle { margin-top:6px; font-size:min(5.4vw,30px); letter-spacing:.42em; color:#eaf2ff; font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .subtitle .gold { color:#f5c542; }
  .howto { margin-top:14px; color:#cfe0ff; font-size:min(3.6vw,16px); line-height:1.55; text-shadow:0 1px 5px #000; }
  .howto b { color:#ffd95e; }
  .bigbtn { margin-top:20px; pointer-events:auto; cursor:pointer; border:2px solid #f5c542; color:#0a0f22;
    background:linear-gradient(180deg,#ffe98a,#e9b62a); font-weight:900; letter-spacing:.12em;
    font-size:min(5vw,22px); padding:14px 38px; border-radius:999px; box-shadow:0 0 24px rgba(245,197,66,.45); }
  .bigbtn:active { transform:scale(.96); }
  .bestline { margin-top:14px; color:#9fb8e8; font-size:min(3.8vw,15px); letter-spacing:.08em; }
  #finishScreen { background:rgba(3,6,18,.55); display:none; }
  #finPos { font-size:min(14vw,76px); font-weight:900; color:#fff; text-shadow:0 0 26px rgba(245,197,66,.55); }
  #finPos .gold { color:#f5c542; }
  #finBreak { margin-top:10px; color:#dbe7ff; font-size:min(4.2vw,18px); line-height:1.65; white-space:pre-line;
    text-shadow:0 1px 5px #000; }
  .tbtn { position:absolute; z-index:15; border:2px solid rgba(160,200,255,.55); background:rgba(8,16,38,.55);
    color:#eaf2ff; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:900; user-select:none; -webkit-user-select:none; touch-action:none; cursor:pointer; }
  .tbtn.on { background:rgba(30,70,140,.75); border-color:#7fd8ff; }
  #btnL { left:14px; bottom:14px; width:74px; height:74px; font-size:30px; }
  #btnR { right:14px; bottom:14px; width:74px; height:74px; font-size:30px; }
  #btnBrake { left:22px; bottom:100px; width:70px; height:70px; font-size:12px; letter-spacing:.06em; color:#ffb3b3; border-color:rgba(255,140,140,.6); }
  #btnBoost { right:22px; bottom:100px; width:78px; height:78px; font-size:30px; color:#aee6ff; border-color:rgba(127,216,255,.75);
    background:rgba(10,40,80,.55); text-shadow:0 0 12px rgba(127,216,255,.9); }
  .sbtn { position:absolute; z-index:16; top:76px; width:42px; height:42px; border-radius:12px; font-size:19px;
    border:2px solid rgba(160,200,255,.45); background:rgba(8,16,38,.5); color:#eaf2ff; display:flex;
    align-items:center; justify-content:center; user-select:none; cursor:pointer; }
  #btnCam { right:106px; } #btnPause { right:58px; } #btnMute { right:10px; }
  #rotateHint { position:absolute; z-index:30; left:50%; top:10px; transform:translateX(-50%); display:none;
    color:#ffd95e; background:rgba(5,8,20,.75); border:1px solid rgba(245,197,66,.5); border-radius:999px;
    padding:7px 16px; font-size:13px; letter-spacing:.14em; font-weight:700; pointer-events:none; white-space:nowrap; }
  @media (orientation:portrait) { #rotateHint { display:block; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="btnCam" class="sbtn" title="Camera">📷</div>
  <div id="btnPause" class="sbtn" title="Pause">⏸</div>
  <div id="btnMute" class="sbtn" title="Mute">🔊</div>

  <div id="btnL" class="tbtn">◀</div>
  <div id="btnR" class="tbtn">▶</div>
  <div id="btnBrake" class="tbtn">BRAKE</div>
  <div id="btnBoost" class="tbtn">◆</div>

  <div id="rotateHint">⟳ ROTATE FOR BEST EXPERIENCE</div>

  <div id="titleScreen" class="overlay">
    <div class="crescent">☾</div>
    <h1 class="title">MR DIAMOND</h1>
    <div class="subtitle"><span class="gold">LUNA CLASSIC</span></div>
    <div class="howto">
      3 laps · 12 cars · you start last — fight to the front.<br>
      Steer <b>◀ ▶</b> · <b>BRAKE</b> for corners · grab <b>◆ diamonds</b> to fill boost ·<br>
      ride a rival's slipstream, then hit <b>◆ BOOST</b> to blast past.
    </div>
    <button id="startBtn" class="bigbtn">TAP TO RACE</button>
    <div id="bestLine" class="bestline"></div>
  </div>

  <div id="finishScreen" class="overlay">
    <div id="finPos">P12</div>
    <div id="finBreak"></div>
    <button id="againBtn" class="bigbtn">RACE AGAIN</button>
    <div id="finBest" class="bestline"></div>
  </div>
</div>

<script>
'use strict';
/* ================= MR DIAMOND — Luna Classic =================
   Pseudo-3D segmented-road racer. Fully self-contained: every visual
   is drawn in code on a single canvas. No external assets, no network. */

/* ---------- constants ---------- */
var SEG_LEN = 200;              /* world units per segment */
var ROAD_HALF = 1100;           /* road half-width in world units */
var CAM_H = 1050;               /* camera height */
var CAM_DEPTH = 0.84;           /* 1 / tan(fov/2) */
var DRAW = 170;                 /* segments drawn ahead */
var MAX_SPEED = SEG_LEN * 60;   /* 12000 u/s */
var BOOST_SPEED = MAX_SPEED * 1.125;
var OFFROAD_MAX = MAX_SPEED * 0.28;
var ACCEL = MAX_SPEED / 4.2;
var BRAKE_DECEL = MAX_SPEED * 0.95;
var OFFROAD_DECEL = MAX_SPEED * 0.8;
var COAST_DECEL = MAX_SPEED * 0.55;
var CENTRIFUGAL = 0.30;
var TOTAL_LAPS = 3;
var NUM_RIVALS = 11;
var DIAMONDS_PER_LAP = 6;
var SCORE_CAP = 100000;
var POS_POINTS = [0, 5000, 3500, 2500, 1800, 1400, 1100, 800, 600, 450, 300, 200, 100];
var LIVERIES = [
  { body:'#8f1d22', accent:'#ffd9d9' }, { body:'#5b2a86', accent:'#e3c8ff' },
  { body:'#0f6f6a', accent:'#c8fff4' }, { body:'#c8ccd4', accent:'#22304a' },
  { body:'#c25e10', accent:'#ffe6c4' }, { body:'#1d4f9c', accent:'#d3e6ff' },
  { body:'#777d29', accent:'#f4ffc4' }, { body:'#9c1d5e', accent:'#ffd3e8' },
  { body:'#2c2f38', accent:'#f5c542' }, { body:'#6e3b12', accent:'#ffe1b0' },
  { body:'#14532d', accent:'#d2ffd9' }
];
var PLAYER_LIVERY = { body:'#101f4d', accent:'#f5c542' };

/* ---------- tiny utils ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function easeIn(t){ return t * t; }
function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function overlap(a, aw, b, bw){ return Math.abs(a - b) < (aw + bw) / 2; }
var _seed = 987654321;
function rnd(){ _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; var t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function fmtTime(s){ if (!isFinite(s) || s <= 0) return '--:--.0'; var m = Math.floor(s / 60), ss = s - m * 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss.toFixed(1); }
function storeGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- track building ---------- */
var segments = [];
var TRACK_LEN = 0, NUM_SEG = 0;
function lastY(){ return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y; }
function addSegment(curve, y){
  var n = segments.length;
  segments.push({
    index: n, curve: curve,
    p1: { world: { y: lastY(), z: n * SEG_LEN }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * SEG_LEN }, camera: {}, screen: {} },
    color: Math.floor(n / 3) % 2,
    crystals: [], looped: false, fog: 0, clip: 0
  });
}
function addRoad(enter, hold, leave, curve, dy){
  var startY = lastY(), endY = startY + dy * SEG_LEN, total = enter + hold + leave, n;
  for (n = 0; n < enter; n++) addSegment(easeIn(n / enter) * curve, lerp(startY, endY, easeInOut(n / total)));
  for (n = 0; n < hold; n++) addSegment(curve, lerp(startY, endY, easeInOut((enter + n) / total)));
  for (n = 0; n < leave; n++) addSegment(lerp(curve, 0, easeInOut(n / leave)), lerp(startY, endY, easeInOut((enter + hold + n) / total)));
}
function buildTrack(){
  segments = [];
  addRoad(20, 20, 20, 0, 0);
  addRoad(18, 18, 18, 2, 16);
  addRoad(18, 18, 18, -3, -6);
  addRoad(14, 14, 14, 5, 20);
  addRoad(14, 14, 14, 0, -12);
  addRoad(16, 16, 16, -6, 0);
  addRoad(12, 12, 12, 3, -18);
  NUM_SEG = segments.length; TRACK_LEN = NUM_SEG * SEG_LEN;
  /* trackside crystal clusters — deterministic */
  for (var i = 0; i < NUM_SEG; i++){
    var s = segments[i], r = rnd();
    if (r < 0.30){
      var side = rnd() < 0.5 ? -1 : 1;
      s.crystals.push({ side: side, off: side * (1.75 + rnd() * 1.5), size: 0.7 + rnd() * 1.1, ph: rnd() * 6.28 });
      if (rnd() < 0.35) s.crystals.push({ side: -side, off: -side * (1.9 + rnd() * 1.4), size: 0.5 + rnd() * 0.8, ph: rnd() * 6.28 });
    }
  }
}
function findSegment(z){ return segments[Math.floor(z / SEG_LEN) % NUM_SEG]; }

/* diamonds: 6 per lap at fixed fractions of the lap */
var diamonds = [];
function buildDiamonds(){
  diamonds = [];
  var fracs = [0.08, 0.22, 0.38, 0.55, 0.72, 0.88], offs = [-0.30, 0.25, 0.0, -0.45, 0.40, 0.10];
  for (var i = 0; i < DIAMONDS_PER_LAP; i++)
    diamonds.push({ seg: Math.floor(fracs[i] * NUM_SEG) % NUM_SEG, offset: offs[i], lapTaken: -1, spin: rnd() * 6.28 });
}

/* ---------- game state ---------- */
var phase = 'title';            /* title | countdown | race | finish */
var paused = false;
var position = 0;               /* distance within lap */
var playerX = 0;
var speed = 0;
var lap = 1;
var raceTime = 0, lapStart = 0, lastLap = 0, bestLap = Infinity;
var boost = 25, boosting = false;
var diamondCount = 0, scoreDiamonds = 0, overtakes = 0, prevRank = 12, rank = 12;
var countT = 0, countStage = -1;
var slipT = 0, slipActive = false, inTow = false;
var slowT = 0, sparkT = 0;
var camMode = 0;                /* 0 chase, 1 cockpit */
var attractT = 0, elapsed = 0;
var breakdown = null;
var rivals = [];
var particles = [];
var skyOff = 0, hillOff1 = 0, hillOff2 = 0;
var input = { left: false, right: false, brake: false, boost: false };
var muted = storeGet('mrDiamondMuted') === '1';
var best = null;
try { best = JSON.parse(storeGet('mrDiamondBest') || 'null'); } catch (e) { best = null; }

function playerRaceDist(){ return (lap - 1) * TRACK_LEN + position; }
/* absolute track distance: a rival's grid slot ahead of the player IS race
   distance (exactly like a real start grid), so nobody ties at zero */
function rivalRaceDist(r){ return r.total; }

function initRivals(){
  rivals = [];
  for (var i = 0; i < NUM_RIVALS; i++){
    var grid = (i + 1) * SEG_LEN * 3;
    rivals.push({
      grid: grid, total: grid, speed: 0,
      pace: 0.80 + (i / (NUM_RIVALS - 1)) * 0.13 + rnd() * 0.015,
      lane: -0.55 + rnd() * 1.1, offset: 0, seedPh: rnd() * 6.28,
      cool: 0, livery: LIVERIES[i % LIVERIES.length]
    });
    rivals[i].offset = rivals[i].lane;
  }
}
function resetRace(){
  position = 0; playerX = 0; speed = 0;
  lap = 1; raceTime = 0; lapStart = 0; lastLap = 0; bestLap = Infinity;
  boost = 25; boosting = false;
  diamondCount = 0; scoreDiamonds = 0; overtakes = 0; prevRank = 12; rank = 12;
  slipT = 0; slipActive = false; inTow = false; slowT = 0; sparkT = 0;
  breakdown = null; particles = [];
  buildDiamonds(); initRivals();
}
function computeRank(){
  var pd = playerRaceDist(), r = 1;
  for (var i = 0; i < rivals.length; i++) if (rivalRaceDist(rivals[i]) > pd) r++;
  return r;
}
function computeScore(){
  var posPts = POS_POINTS[rank] || 0;
  var lapBonus = isFinite(bestLap) ? Math.max(0, Math.round((60 - bestLap) * 20)) : 0;
  var total = Math.min(SCORE_CAP, posPts + scoreDiamonds + overtakes * 50 + lapBonus);
  return { posPts: posPts, diamonds: scoreDiamonds, overtakePts: overtakes * 50, lapBonus: lapBonus, total: total };
}
function finishRace(){
  rank = computeRank(); prevRank = rank;
  phase = 'finish';
  breakdown = computeScore();
  var isBest = !best || breakdown.total > best.score;
  if (isBest){ best = { score: breakdown.total, pos: rank }; storeSet('mrDiamondBest', JSON.stringify(best)); }
  showFinish(isBest);
  sfxJingle();
}

/* ---------- audio (all guarded) ---------- */
var AC = null, engOsc = null, engGain = null;
function audioInit(){
  if (AC) { if (AC.resume) AC.resume(); return; }
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    AC = new Ctx();
    engOsc = AC.createOscillator(); engGain = AC.createGain();
    engOsc.type = 'sawtooth'; engOsc.frequency.value = 55; engGain.gain.value = 0;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engOsc.connect(f); f.connect(engGain); engGain.connect(AC.destination); engOsc.start();
  } catch (e) { AC = null; }
}
function engineSound(){
  if (!AC || !engOsc) return;
  try {
    var sp = speed / MAX_SPEED, on = (phase === 'race' || phase === 'countdown') && !paused && !muted;
    engOsc.frequency.setTargetAtTime(50 + sp * 165 + (boosting ? 25 : 0), AC.currentTime, 0.06);
    engGain.gain.setTargetAtTime(on ? 0.028 + sp * 0.05 : 0, AC.currentTime, 0.09);
  } catch (e) {}
}
function beep(freq, dur, type, vol, when){
  if (!AC || muted) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (when || 0);
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function sfxChime(){ beep(1318, 0.12, 'sine', 0.07); beep(1760, 0.2, 'sine', 0.06, 0.07); }
function sfxWhoosh(){
  if (!AC || muted) return;
  try {
    var len = AC.sampleRate * 0.35, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, AC.currentTime); f.frequency.exponentialRampToValueAtTime(2400, AC.currentTime + 0.3);
    var g = AC.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  } catch (e) {}
}
function sfxJingle(){ beep(784, 0.14, 'triangle', 0.08); beep(988, 0.14, 'triangle', 0.08, 0.13); beep(1319, 0.3, 'triangle', 0.09, 0.26); }

/* ---------- DOM ---------- */
var wrap = document.getElementById('wrap');
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var titleEl = document.getElementById('titleScreen');
var finishEl = document.getElementById('finishScreen');
var finPosEl = document.getElementById('finPos');
var finBreakEl = document.getElementById('finBreak');
var finBestEl = document.getElementById('finBest');
var bestLineEl = document.getElementById('bestLine');
var muteBtn = document.getElementById('btnMute');
var W = 960, H = 540;
function refreshBestLine(){
  bestLineEl.textContent = best ? ('LOCAL BEST — ' + best.score.toLocaleString() + ' PTS · P' + best.pos) : 'NO LOCAL BEST YET — SET ONE!';
}
function showFinish(isBest){
  var tags = { 1: 'VICTORY!', 2: 'PODIUM!', 3: 'PODIUM!' };
  finPosEl.innerHTML = 'P' + rank + (tags[rank] ? ' — <span class="gold">' + tags[rank] + '</span>' : '');
  var b = breakdown;
  finBreakEl.textContent =
    'TOTAL TIME  ' + fmtTime(raceTime) + '   ·   BEST LAP  ' + fmtTime(bestLap) + '\n' +
    '◆ DIAMONDS  ' + diamondCount + '/' + (DIAMONDS_PER_LAP * TOTAL_LAPS) + '  (+' + b.diamonds + ')\n' +
    'OVERTAKES  ' + overtakes + '  (+' + b.overtakePts + ')\n' +
    'FINISH P' + rank + '  (+' + b.posPts + ')   ·   LAP BONUS  (+' + b.lapBonus + ')\n' +
    'SCORE  ' + b.total.toLocaleString();
  finBestEl.textContent = isBest ? '★ NEW LOCAL BEST!' : ('LOCAL BEST — ' + (best ? best.score.toLocaleString() : '0') + ' PTS');
  finishEl.style.display = 'flex';
}
function resize(){
  var r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, r.width); H = Math.max(240, r.height);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- input ---------- */
function bindHold(id, key){
  var el = document.getElementById(id);
  function on(e){ e.preventDefault(); audioInit(); input[key] = true; el.classList.add('on'); }
  function off(e){ if (e) e.preventDefault(); input[key] = false; el.classList.remove('on'); }
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
bindHold('btnL', 'left'); bindHold('btnR', 'right');
bindHold('btnBrake', 'brake'); bindHold('btnBoost', 'boost');
function tap(id, fn){ var el = document.getElementById(id); el.addEventListener('click', function(e){ e.preventDefault(); audioInit(); fn(); }); }
tap('btnCam', function(){ camMode = (camMode + 1) % 2; });
tap('btnPause', function(){ if (phase === 'race' || phase === 'countdown') paused = !paused; });
function syncMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; if (engGain && AC) { try { engGain.gain.value = 0; } catch (e) {} } }
tap('btnMute', function(){ muted = !muted; storeSet('mrDiamondMuted', muted ? '1' : '0'); syncMute(); });
document.getElementById('startBtn').addEventListener('click', function(){ audioInit(); startRace(); });
document.getElementById('againBtn').addEventListener('click', function(){ audioInit(); startRace(); });
canvas.addEventListener('pointerdown', function(){ audioInit(); });
var KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'brake', KeyS: 'brake', Space: 'boost', ArrowUp: 'boost', KeyW: 'boost' };
document.addEventListener('keydown', function(e){
  if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = true; e.preventDefault(); }
  else if (e.code === 'KeyC') camMode = (camMode + 1) % 2;
  else if (e.code === 'KeyP') { if (phase === 'race' || phase === 'countdown') paused = !paused; }
  else if (e.code === 'KeyM') { muted = !muted; storeSet('mrDiamondMuted', muted ? '1' : '0'); syncMute(); }
  else if (e.code === 'Enter' && (phase === 'title' || phase === 'finish')) { audioInit(); startRace(); }
});
document.addEventListener('keyup', function(e){ if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = false; e.preventDefault(); } });

function startRace(){
  audioInit();
  resetRace();
  titleEl.style.display = 'none';
  finishEl.style.display = 'none';
  paused = false;
  phase = 'countdown'; countT = 3.3; countStage = -1;
}

/* ---------- simulation ---------- */
function spawnSparks(n, col){
  for (var i = 0; i < n; i++)
    particles.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.16, y: H * 0.88, vx: (Math.random() - 0.5) * 340,
      vy: -Math.random() * 260 - 40, life: 0.45 + Math.random() * 0.3, t: 0, col: col || '#ffcf6e', size: 2 + Math.random() * 2 });
}
function spawnGlints(x, y, n){
  for (var i = 0; i < n; i++)
    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 190, vy: (Math.random() - 0.5) * 190,
      life: 0.5, t: 0, col: '#aee6ff', size: 2 + Math.random() * 2.5 });
}

function updateRivals(dt){
  var pd = playerRaceDist();
  for (var i = 0; i < rivals.length; i++){
    var r = rivals[i];
    var seg = findSegment(((r.total % TRACK_LEN) + TRACK_LEN) % TRACK_LEN);
    var target = MAX_SPEED * r.pace * (1 - Math.min(Math.abs(seg.curve), 6) * 0.030);
    var diff = rivalRaceDist(r) - pd;
    if (diff > 25000) target *= 0.95; else if (diff < -25000) target *= 1.05;
    if (phase === 'race'){
      r.speed = r.speed < target ? Math.min(target, r.speed + MAX_SPEED * 0.22 * dt)
                                 : Math.max(target, r.speed - MAX_SPEED * 0.4 * dt);
    } else if (phase === 'title'){
      r.speed = MAX_SPEED * r.pace * 0.35;
    } else r.speed = 0;
    r.total += r.speed * dt;
    /* lane keeping + gentle avoidance of the player */
    var want = r.lane + Math.sin(elapsed * 0.35 + r.seedPh) * 0.08;
    var dz = rivalRaceDist(r) - pd;
    if (Math.abs(dz) < SEG_LEN * 2 && Math.abs(r.offset - playerX) < 0.55)
      want = clamp(r.offset + (r.offset >= playerX ? 0.65 : -0.65), -0.8, 0.8);
    r.offset = lerp(r.offset, want, clamp(dt * 1.6, 0, 1));
    if (r.cool > 0) r.cool -= dt;
  }
}

function updateRace(dt){
  raceTime += dt;
  var playerSeg = findSegment(position + PLAYER_Z());
  var speedPct = speed / MAX_SPEED;
  var steer = (input.left ? -1 : 0) + (input.right ? 1 : 0);

  /* boost */
  var wasBoosting = boosting;
  boosting = !!(input.boost && boost > 0 && !input.brake);
  if (boosting){
    boost = Math.max(0, boost - 30 * dt);
    if (!wasBoosting) sfxWhoosh();
  }

  /* longitudinal */
  var offroad = Math.abs(playerX) > 1;
  var topSpeed = boosting ? BOOST_SPEED : MAX_SPEED;
  if (slowT > 0){ topSpeed *= 0.55; slowT -= dt; }
  if (input.brake) speed = Math.max(0, speed - BRAKE_DECEL * dt);
  else if (speed < topSpeed) speed = Math.min(topSpeed, speed + ACCEL * dt * (offroad ? 0.45 : 1));
  else if (speed > topSpeed) speed = Math.max(topSpeed, speed - COAST_DECEL * dt);
  if (offroad && speed > OFFROAD_MAX) speed = Math.max(OFFROAD_MAX, speed - OFFROAD_DECEL * dt);

  /* steering + centrifugal push */
  var dx = dt * 2.1 * speedPct;
  playerX += dx * steer;
  playerX -= dx * speedPct * playerSeg.curve * CENTRIFUGAL;
  playerX = clamp(playerX, -2.6, 2.6);
  if (offroad && speed > MAX_SPEED * 0.3 && Math.random() < 0.35)
    particles.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.22, y: H * 0.92, vx: (Math.random() - 0.5) * 120,
      vy: -Math.random() * 90 - 20, life: 0.5, t: 0, col: '#8d94a6', size: 3 + Math.random() * 3 });

  /* advance + lap wrap */
  var oldPos = position;
  position = (position + speed * dt) % TRACK_LEN;
  if (position < oldPos){
    lastLap = raceTime - lapStart; lapStart = raceTime;
    if (lastLap > 0) bestLap = Math.min(bestLap, lastLap);
    if (lap >= TOTAL_LAPS){ finishRace(); return; }
    lap++;
  }

  /* slipstream: close behind a rival, roughly centred */
  inTow = false;
  var pd = playerRaceDist();
  if (speed > MAX_SPEED * 0.5){
    for (var i = 0; i < rivals.length; i++){
      var dz = rivalRaceDist(rivals[i]) - pd;
      if (dz > SEG_LEN * 0.8 && dz < SEG_LEN * 4.5 && Math.abs(rivals[i].offset - playerX) < 0.30){ inTow = true; break; }
    }
  }
  if (inTow){ slipT += dt; if (slipT > 1){ slipActive = true; boost = Math.min(100, boost + 14 * dt); } }
  else { slipT = Math.max(0, slipT - dt * 2); if (slipT <= 0) slipActive = false; }

  /* rival contact */
  for (var j = 0; j < rivals.length; j++){
    var r = rivals[j], dzr = rivalRaceDist(r) - pd;
    if (dzr > -SEG_LEN * 0.7 && dzr < SEG_LEN * 0.9 && overlap(playerX, 0.44, r.offset, 0.44)){
      if (speed > r.speed && r.cool <= 0){
        speed = r.speed * 0.92; slowT = 0.35; r.cool = 0.6;
        spawnSparks(14); sparkT = 0.25; beep(140, 0.12, 'sawtooth', 0.05);
      }
    }
  }

  /* diamonds */
  var pSegIdx = Math.floor(position / SEG_LEN) % NUM_SEG;
  for (var k = 0; k < diamonds.length; k++){
    var d = diamonds[k];
    if (d.lapTaken === lap) continue;
    var segDiff = Math.abs(((d.seg - pSegIdx + NUM_SEG * 1.5) % NUM_SEG) - NUM_SEG * 0.5) ;
    var near = (d.seg === pSegIdx) || (Math.abs(d.seg - pSegIdx) <= 1) || (Math.abs(d.seg - pSegIdx) >= NUM_SEG - 1);
    if (near && segDiff !== -999 && Math.abs(playerX - d.offset) < 0.42 && speed > 0){
      d.lapTaken = lap; diamondCount++;
      boost = Math.min(100, boost + 25); scoreDiamonds += 100;
      sfxChime();
      if (d.screenX !== undefined) spawnGlints(d.screenX, d.screenY, 10);
    }
  }

  updateRivals(dt);

  /* ranking + overtakes */
  rank = computeRank();
  if (rank < prevRank) overtakes += (prevRank - rank);
  prevRank = rank;
}

function update(dt){
  elapsed += dt;
  if (paused) return;
  if (sparkT > 0) sparkT -= dt;
  /* particles always tick */
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i]; p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
  }
  if (phase === 'title'){
    attractT += dt;
    speed = MAX_SPEED * 0.35;
    position = (position + speed * dt) % TRACK_LEN;
    playerX = Math.sin(attractT * 0.45) * 0.35;
    updateRivals(dt);
    return;
  }
  if (phase === 'countdown'){
    speed = 0;
    var el = 3.3 - countT;
    var stage = el < 0.9 ? 0 : (el < 1.8 ? 1 : (el < 2.7 ? 2 : 3));
    if (stage !== countStage){ countStage = stage; if (stage > 0) beep(440, 0.14, 'square', 0.06); }
    countT -= dt;
    if (countT <= 0){ phase = 'race'; lapStart = raceTime = 0; beep(880, 0.35, 'square', 0.07); }
    return;
  }
  if (phase === 'race'){ updateRace(dt); return; }
  if (phase === 'finish'){
    speed = Math.max(0, speed - COAST_DECEL * dt);
    position = (position + speed * dt) % TRACK_LEN;
    updateRivals(dt);
    return;
  }
}
function PLAYER_Z(){ return CAM_H * CAM_DEPTH; }

function project(p, camX, camY, camZ){
  p.camera.x = -camX; p.camera.y = (p.world.y || 0) - camY; p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = CAM_DEPTH / Math.max(1, p.camera.z);
  p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
  p.screen.w = Math.round(p.screen.scale * ROAD_HALF * W / 2);
}

function rr(x, y, w, h, r){
  ctx.beginPath();

}

function drawRidge(ridge, off, col, base){

  ctx.fillStyle = dust; ctx.fillRect(0, y2, W, y - y2);
  var rw1 = w * 1.16, rw2 = w2 * 1.16;
  poly(x - rw1, y, x + rw1, y, x2 + rw2, y2, x2 - rw2, y2, color ? '#7d6a35' : '#5d5128'); /* rumble: dark gold */
  poly(x - w, y, x + w, y, x2 + w2, y2, x2 - w2, y2, color ? '#59616f' : '#525a68');     /* road */
  /* neon edge strips */
  ctx.fillStyle = color ? '#27b6ff' : '#1668a8';
  poly(x - w * 1.04, y, x - w * 0.97, y, x2 - w2 * 0.97, y2, x2 - w2 * 1.04, y2, color ? '#27b6ff' : '#1668a8');
  poly(x + w * 0.97, y, x + w * 1.04, y, x2 + w2 * 1.04, y2, x2 + w2 * 0.97, y2, color ? '#27b6ff' : '#1668a8');
  if (color){ /* centre dashes */
    poly(x - w * 0.018, y, x + w * 0.018, y, x2 + w2 * 0.018, y2, x2 - w2 * 0.018, y2, 'rgba(230,240,255,0.5)');
  }
  if (fog > 0.01){
    ctx.fillStyle = 'rgba(10,16,40,' + (fog * 0.88).toFixed(3) + ')';
    ctx.fillRect(0, y2, W, y - y2);
  }
}

var spriteDraws = [];
function render(){
  var baseSeg = findSegment(position);
  var basePct = (position % SEG_LEN) / SEG_LEN;
  var playerSeg = findSegment(position + PLAYER_Z());
  var playerPct = ((position + PLAYER_Z()) % SEG_LEN) / SEG_LEN;
  var playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
  var speedPct = speed / MAX_SPEED;
  var steerVis = (input.left ? -1 : 0) + (input.right ? 1 : 0);
  skyOff += baseSeg.curve * speedPct * 0.0016;
  hillOff1 += baseSeg.curve * speedPct * 0.006;
  hillOff2 += baseSeg.curve * speedPct * 0.0022;

  drawBackground();

  var maxY = H, x = 0, dxv = -(baseSeg.curve * speedPct);
  spriteDraws.length = 0;
  var i, seg, n;
  for (n = 0; n < DRAW; n++){
    seg = segments[(baseSeg.index + n) % NUM_SEG];
    seg.looped = seg.index < baseSeg.index;
    seg.fog = Math.exp(-Math.pow(n / DRAW, 2) * 5) ;
    seg.fog = 1 - Math.exp(-Math.pow(n / DRAW, 2) * 5) * 1; /* 0 near → ~1 far */
    seg.fog = clamp(1 - Math.exp(-Math.pow(n / DRAW, 2) * 4.2), 0, 1);
    seg.clip = maxY; seg.drawn = false;
    var camZ = position - (seg.looped ? TRACK_LEN : 0);
    project(seg.p1, playerX * ROAD_HALF + x, CAM_H + playerY, camZ);
    project(seg.p2, playerX * ROAD_HALF + x + dxv, CAM_H + playerY, camZ);
    x += dxv; dxv += seg.curve;
    seg.accumX = x;
    if (seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxY) continue;
    renderSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
                  seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w, seg.color, seg.fog);
    seg.drawn = true;
    maxY = seg.p1.screen.y;
    /* collect sprites for this segment */
    for (i = 0; i < seg.crystals.length; i++)
      spriteDraws.push({ kind: 'crystal', seg: seg, c: seg.crystals[i], dist: n });
    for (i = 0; i < diamonds.length; i++){
      var d = diamonds[i];
      if (d.seg === seg.index && d.lapTaken !== lap)
        spriteDraws.push({ kind: 'diamond', seg: seg, d: d, dist: n });
    }
  }
  /* rivals as sprites */
  var camSegIdx = baseSeg.index;
  for (i = 0; i < rivals.length; i++){
    var r = rivals[i];
    var rPos = ((r.total % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
    var rIdx = Math.floor(rPos / SEG_LEN) % NUM_SEG;
    var rel = (rIdx - camSegIdx + NUM_SEG) % NUM_SEG;
    if (rel < DRAW){
      var rSeg = segments[rIdx];
      if (rSeg.p1.screen && rSeg.p1.screen.scale)
        spriteDraws.push({ kind: 'car', seg: rSeg, r: r, dist: rel, frac: (rPos % SEG_LEN) / SEG_LEN });
    }
  }
  /* draw far → near */
  spriteDraws.sort(function(a, b){ return b.dist - a.dist; });
  for (i = 0; i < spriteDraws.length; i++){
    var sd = spriteDraws[i], sg = sd.seg;
    if (!sg.drawn || !sg.p1.screen.scale) continue;
    var scale = sg.p1.screen.scale;
    if (sd.kind === 'crystal'){
      if (sd.dist < 2) continue;
      var cxp = sg.p1.screen.x + scale * sd.c.off * ROAD_HALF * W / 2;
      var cw = Math.min(W * 0.30, scale * ROAD_HALF * W * 0.30 * sd.c.size);
      if (cw > 1.5) drawCrystal(cxp, sg.p1.screen.y, cw, sd.c.ph);
    } else if (sd.kind === 'diamond'){
      if (sd.dist < 3) continue;
      var dxp = sg.p1.screen.x + scale * sd.d.offset * ROAD_HALF * W / 2;
      var dw = Math.min(W * 0.085, scale * ROAD_HALF * W * 0.13);
      sd.d.screenX = dxp; sd.d.screenY = sg.p1.screen.y - dw * 0.6;
      if (dw > 2) drawDiamondShape(dxp, sg.p1.screen.y - dw * 0.6, dw, elapsed * 2.4 + sd.d.spin);
    } else if (sd.kind === 'car'){
      if (sd.dist * SEG_LEN < PLAYER_Z() + SEG_LEN * 0.4) continue;
      var kx = sg.p1.screen.x + scale * sd.r.offset * ROAD_HALF * W / 2;
      var kw = Math.min(W * 0.40, scale * ROAD_HALF * W * 0.38);
      if (kw > 3) drawCar(kx, sg.p1.screen.y, kw, sd.r.livery, false, 0, false);
    }
  }

  /* player */
  if (phase !== 'title' || true){
    if (camMode === 1 && phase !== 'title'){
      drawCockpit(steerVis);
    } else {
      var pw = W * 0.34, px = W / 2 + steerVis * W * 0.008;
      var bob = Math.sin(elapsed * 31) * speedPct * 1.6;
      drawCar(px, H * 0.985 + bob, pw, PLAYER_LIVERY, true, steerVis, boosting);
    }
  }
  /* boost speed lines */
  if (boosting && phase === 'race'){
    ctx.strokeStyle = 'rgba(190,230,255,0.5)'; ctx.lineWidth = 2;
    for (i = 0; i < 7; i++){
      var lx = Math.random() * W, ly = Math.random() * H * 0.7, ln = 30 + Math.random() * 70;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + (lx < W / 2 ? -ln : ln), ly + ln * 0.25); ctx.stroke();
    }
  }
  /* particles */
  for (i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  if (sparkT > 0){ ctx.fillStyle = 'rgba(255,190,80,' + (sparkT * 0.55).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }

  if (phase === 'race' || phase === 'countdown' || phase === 'finish') drawHUD();
  if (phase === 'countdown') drawCountdown();
  if (paused && phase !== 'title'){
    ctx.fillStyle = 'rgba(3,6,18,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '900 ' + Math.round(H * 0.09) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('PAUSED', W / 2, H / 2);
  }
}

function panel(x, y, w, h){
  ctx.fillStyle = 'rgba(6,12,28,0.58)'; rr(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(127,216,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawHUD(){
  var kmh = Math.round(speed / MAX_SPEED * 320);
  ctx.textBaseline = 'alphabetic';
  /* position — top left */
  panel(12, 12, 168, 58);
  ctx.fillStyle = '#f5c542'; ctx.font = '900 30px Arial'; ctx.textAlign = 'left';
  ctx.fillText('P' + rank, 24, 46);
  ctx.fillStyle = '#eaf2ff'; ctx.font = '700 19px Arial';
  ctx.fillText('of 12', 24 + ctx.measureText('P' + rank).width + 26, 46);
  ctx.fillStyle = '#9fb8e8'; ctx.font = '700 10px Arial'; ctx.fillText('POSITION', 24, 62);
  /* lap — top right */
  panel(W - 140, 12, 128, 58);
  ctx.fillStyle = '#fff'; ctx.font = '900 26px Arial'; ctx.textAlign = 'right';
  ctx.fillText('LAP ' + Math.min(lap, TOTAL_LAPS) + '/' + TOTAL_LAPS, W - 24, 44);
  ctx.fillStyle = '#9fb8e8'; ctx.font = '700 10px Arial'; ctx.fillText('◆ ' + diamondCount + '/' + (DIAMONDS_PER_LAP * TOTAL_LAPS), W - 24, 62);
  /* lap times */
  ctx.textAlign = 'left'; ctx.fillStyle = '#cfe0ff'; ctx.font = '700 13px Arial';
  ctx.fillText('TIME ' + fmtTime(raceTime) + '   LAP ' + fmtTime(raceTime - lapStart) + '   BEST ' + fmtTime(bestLap), 14, 92);
  /* speed — bottom right, clear of the touch buttons */
  ctx.textAlign = 'right';
  ctx.fillStyle = boosting ? '#7fd8ff' : '#ffffff'; ctx.font = '900 54px Arial';
  ctx.fillText(kmh + '', W - 158, H - 22);
  ctx.fillStyle = '#9fb8e8'; ctx.font = '900 15px Arial'; ctx.fillText('KM/H', W - 106, H - 22);
  /* boost bar — bottom centre */
  var bw = Math.min(300, W * 0.34), bx = W / 2 - bw / 2, by = H - 34;
  ctx.fillStyle = 'rgba(6,12,28,0.6)'; rr(bx - 4, by - 4, bw + 8, 20, 8); ctx.fill();
  ctx.fillStyle = '#12233f'; rr(bx, by, bw, 12, 6); ctx.fill();
  var bg2 = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  bg2.addColorStop(0, '#1b6fd6'); bg2.addColorStop(1, '#7fd8ff');
  ctx.fillStyle = bg2; if (boost > 0.5) { rr(bx, by, bw * boost / 100, 12, 6); ctx.fill(); }
  ctx.fillStyle = slipActive ? '#7ffce8' : '#9fb8e8'; ctx.font = '900 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText(slipActive ? '◆ SLIPSTREAM ◆' : 'BOOST', W / 2, by - 9);
  /* minimap — circle under the position panel, clear of the touch buttons */
  var mx = 50, my = 150, mr = 38;
  ctx.fillStyle = 'rgba(6,12,28,0.58)'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.284); ctx.fill();
  ctx.strokeStyle = 'rgba(127,216,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#26355a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(mx, my, mr - 7, 0, 6.284); ctx.stroke();
  ctx.strokeStyle = '#f5c542';
  ctx.beginPath(); ctx.arc(mx, my, mr - 7, -Math.PI / 2, -Math.PI / 2 + (position / TRACK_LEN) * 6.284); ctx.stroke();
  var pd = playerRaceDist();
  for (var i = 0; i < rivals.length; i++){
    var rel = ((rivalRaceDist(rivals[i]) - pd) / TRACK_LEN) % 1; if (rel < 0) rel += 1;
    if (rel > 0.5) rel -= 1;
    var ang = -Math.PI / 2 + rel * 6.284;
    ctx.fillStyle = rivals[i].livery.body;
    ctx.beginPath(); ctx.arc(mx + Math.cos(ang) * (mr - 7), my + Math.sin(ang) * (mr - 7), 3, 0, 6.284); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.font = '900 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('LAP ' + Math.min(lap, TOTAL_LAPS), mx, my + 4);
}
function drawCountdown(){
  var el = 3.3 - countT;
  var lit = el < 0.9 ? 0 : (el < 1.8 ? 1 : (el < 2.7 ? 2 : 3));
  ctx.fillStyle = 'rgba(3,6,18,0.35)'; ctx.fillRect(0, 0, W, H * 0.4);
  for (var i = 0; i < 3; i++){
    ctx.fillStyle = i < lit ? '#ff2d40' : '#3a1220';
    ctx.beginPath(); ctx.arc(W / 2 + (i - 1) * 74, H * 0.17, 26, 0, 6.284); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.font = '900 ' + Math.round(H * 0.075) + 'px Arial'; ctx.textAlign = 'center';
  ctx.fillText(lit === 0 ? 'READY…' : 'SET…', W / 2, H * 0.32);
}

/* ---------- main loop ---------- */
var lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  if (window.__SMOKE__) { window.__fr = (window.__fr || 0) + 1;
    if (window.__fr % 30 === 0) document.title = 'MD frames=' + window.__fr + ' phase=' + phase + ' speed=' + Math.round(speed); }
  update(dt);
  render();
  engineSound();
}

/* ---------- boot ---------- */
buildTrack(); resetRace(); resize(); refreshBestLine(); syncMute();
requestAnimationFrame(frame);
if (/[?&]smoke/.test((typeof location !== 'undefined' && (location.search || location.href)) || '')) window.__SMOKE__ = true;
if (window.__SMOKE__){
  /* deterministic smoke driver: step the sim directly (headless shells may
     throttle rAF), through countdown and into the race */
  window.__fr = 0;
  startRace();
  var smokeN = 0;
  var smokeIv = setInterval(function(){
    if (smokeN === 45) window.MR_DIAMOND_TEST.skipCountdown();
    if (smokeN === 60) input.right = true;
    if (smokeN === 78) { input.right = false; window.MR_DIAMOND_TEST.setPlayer({ playerX: 0 }); }
    if (smokeN === 120) input.boost = true;
    update(0.033); render(); smokeN++;
    if (smokeN >= 300){
      clearInterval(smokeIv);
      document.title = 'MD frames=' + smokeN + ' phase=' + phase + ' speed=' + Math.round(speed) + ' lap=' + lap + ' rank=' + rank;
    }
  }, 33);
}

/* ---------- test hooks ---------- */
window.MR_DIAMOND_TEST = {
  state: function(){
    return { phase: phase, paused: paused, speed: speed, speedKmh: Math.round(speed / MAX_SPEED * 320),
      lap: lap, rank: rank, position: position, playerX: playerX, raceDist: playerRaceDist(),
      diamonds: diamondCount, boost: boost, boosting: boosting, overtakes: overtakes,
      raceTime: raceTime, bestLap: isFinite(bestLap) ? bestLap : 0,
      slipActive: slipActive, inTow: inTow, score: phase === 'finish' && breakdown ? breakdown.total : (scoreDiamonds + overtakes * 50),
      breakdown: breakdown, camMode: camMode };
  },
  start: function(){ startRace(); },
  skipCountdown: function(){ if (phase === 'countdown'){ phase = 'race'; countT = 0; lapStart = raceTime = 0; } },
  step: function(dt){ update(dt || 0.016); render(); },
  input: function(o){ for (var k in o) input[k] = !!o[k]; },
  setPlayer: function(o){
    if (o.position !== undefined) position = ((o.position % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
    if (o.lap !== undefined) lap = o.lap;
    if (o.lapStartAgo !== undefined) lapStart = raceTime - o.lapStartAgo;
    if (o.playerX !== undefined) playerX = o.playerX;
    if (o.speed !== undefined) speed = o.speed;
    if (o.boost !== undefined) boost = o.boost;
    rank = computeRank(); prevRank = rank;
  },
  diamondsList: function(){ return diamonds.map(function(d){ return { seg: d.seg, offset: d.offset, lapTaken: d.lapTaken }; }); },
  rivalsList: function(){ return rivals.map(function(r){ return { race: rivalRaceDist(r), speed: r.speed, offset: r.offset, total: r.total }; }); },
  placeBehindRival: function(){
    var bestR = null, bd = 1e18, pd = playerRaceDist();
    for (var i = 0; i < rivals.length; i++){ var dz = rivalRaceDist(rivals[i]) - pd; if (dz > 0 && dz < bd){ bd = dz; bestR = rivals[i]; } }
    if (!bestR) bestR = rivals[0];
    var target = rivalRaceDist(bestR) - SEG_LEN * 2;
    lap = clamp(Math.floor(target / TRACK_LEN) + 1, 1, TOTAL_LAPS);
    position = ((target % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
    playerX = bestR.offset; speed = bestR.speed;
    rank = computeRank(); prevRank = rank;
    return { dz: bd };
  },
  constants: { MAX_SPEED: MAX_SPEED, BOOST_SPEED: BOOST_SPEED, TRACK_LEN: TRACK_LEN, NUM_SEG: NUM_SEG, SEG_LEN: SEG_LEN, SCORE_CAP: SCORE_CAP }
};
</script>
</body>
</html>
