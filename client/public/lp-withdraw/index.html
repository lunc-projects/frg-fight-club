<!DOCTYPE html>
<html lang="en">
<head>
<base href="/lp-withdraw/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRG – LUNC · Withdraw LP (Terraswap)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0c1f16;color:#eaf5ee}
  .wrap{max-width:430px;margin:0 auto;padding:18px 14px 40px}
  h1{font-size:21px;line-height:1.25;margin:6px 0 4px;text-align:center}
  .sub{text-align:center;color:#a9cbb6;font-size:14px;margin:0 0 16px}
  .card{background:#12291d;border:1px solid #1f4430;border-radius:16px;padding:16px 14px;margin-bottom:14px}
  .btnCol{display:flex;flex-direction:column;gap:10px}
  .btnCol button{width:100%;padding:15px 12px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#1d5c38;color:#fff;cursor:pointer}
  .btnCol button:active{transform:scale(.99)}
  #nftStatus{font-size:13.5px;line-height:1.5;margin-top:10px;min-height:18px;color:#cfe8d8;word-break:break-word}
  #nftPairBox{display:none;margin-top:12px;text-align:center}
  #nftPairBox.on{display:block}
  #nftPairQr{background:#fff;border-radius:12px}
  #nftPairUri{width:100%;margin-top:8px;padding:9px;font-size:11px;border-radius:8px;border:1px solid #2c5a40;background:#0c1f16;color:#cfe8d8}
  #nftPairActs{display:none;gap:8px;justify-content:center;margin-top:8px}
  #nftPairActs a,#nftPairActs button{padding:10px 14px;font-size:14px;font-weight:700;border-radius:10px;border:1px solid #2c5a40;background:#173a26;color:#fff;text-decoration:none;cursor:pointer}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #1c3a29;font-size:15px}
  .row span{color:#a9cbb6}
  .row b{text-align:right;word-break:break-all}
  .fine{color:#8fb59d;font-size:12.5px;margin:8px 0 0}
  .zero{margin-top:12px;padding:13px;border-radius:12px;background:#3a2413;border:1px solid #6b4423;font-size:15px;line-height:1.45}
  label{display:block;margin:14px 0 6px;font-size:14px;color:#a9cbb6}
  #lpAmount{width:100%;padding:14px;font-size:19px;border-radius:12px;border:1px solid #2c5a40;background:#0c1f16;color:#fff}
  .quick{display:flex;gap:8px;margin-top:9px}
  .quick button{flex:1;padding:11px 0;font-size:15px;font-weight:700;border-radius:10px;border:1px solid #2c5a40;background:#173a26;color:#fff;cursor:pointer}
  .review{margin-top:14px;padding:13px;border-radius:12px;background:#0e2a1a;border:1px solid #2c5a40;font-size:14.5px;line-height:1.55;min-height:52px}
  #lpWithdrawBtn{width:100%;margin-top:14px;padding:17px;font-size:18px;font-weight:800;border:0;border-radius:13px;background:#e8a33d;color:#1c1305;cursor:pointer}
  #lpWithdrawBtn:disabled{opacity:.45;cursor:not-allowed}
  #lpResult{margin-top:12px;font-size:14.5px;line-height:1.55;word-break:break-word}
  #lpResult a{color:#7fd8cd}
</style>
</head>
<body>
<main class="wrap">
  <h1>FRG – LUNC · Withdraw LP (Terraswap)</h1>
  <p class="sub">Your wallet signs. This page holds no keys.</p>

  <section class="card">
    <div class="btnCol">
      <button id="nftConnectBtn" type="button">🔗 CONNECT KEPLR</button>
      <button id="nftGalaxyBtn" type="button">🌌 CONNECT GALAXY STATION</button>
      <button id="nftDashRowBtn" type="button">🚀 CONNECT LUNCDASH</button>
    </div>
    <div id="nftPairBox">
      <canvas id="nftPairQr" width="180" height="180" style="display:none"></canvas>
      <input type="text" id="nftPairUri" readonly>
      <div id="nftPairActs">
        <a id="nftPairOpen" href="#">Open in wallet</a>
        <button id="nftPairCopy" type="button">Copy link</button>
      </div>
    </div>
    <div id="nftStatus"></div>
  </section>

  <section class="card" id="lpPanel" hidden>
    <div class="row"><span>Wallet</span><b id="lpAddr"></b></div>
    <div class="row"><span>Your LP</span><b id="lpBalance"></b></div>
    <div class="row"><span>Your share</span><b id="lpShare"></b></div>
    <div class="row"><span>You'd get back about</span><b id="lpEst"></b></div>
    <p class="fine">Estimate — the pool moves as people trade.</p>

    <div id="lpZero" class="zero" hidden>No Terraswap FRG–LUNC LP in this wallet.</div>

    <div id="lpForm">
      <label for="lpAmount">LP amount to withdraw</label>
      <input id="lpAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.0">
      <div class="quick">
        <button type="button" data-pct="25">25%</button>
        <button type="button" data-pct="50">50%</button>
        <button type="button" data-pct="75">75%</button>
        <button type="button" data-pct="100">MAX</button>
      </div>
      <div class="review" id="lpReview">Enter an amount to see exactly what will be sent.</div>
      <button id="lpWithdrawBtn" type="button" disabled>WITHDRAW</button>
      <div id="lpResult"></div>
    </div>
  </section>
</main>

<script>const $ = id => document.getElementById(id);</script>
<script src="lpwallet.js"></script>
<script>
/* ================= LP page glue =================
   Renders what lpwallet.js reads (LP balance + pool) and runs the
   withdraw. All math on raw 6-decimal integers with BigInt; the
   review box always shows exactly what the button will sign. */
let lpCur = { addr: '', connected: false, via: '', lpRaw: '0', pool: null };
let lpBusy = false;

function fmtUnits(raw){
  let v = BigInt(raw || '0');
  const whole = v / 1000000n, frac = v % 1000000n;
  const f = frac.toString().padStart(6, '0').replace(/0+$/, '');
  return whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
}
function rawToInput(raw){
  let v = BigInt(raw || '0');
  const whole = v / 1000000n, frac = v % 1000000n;
  const f = frac.toString().padStart(6, '0').replace(/0+$/, '');
  return whole.toString() + (f ? '.' + f : '');
}
function poolReserves(pool){
  let frg = null, lunc = null;
  for (const a of (pool && pool.assets) || []){
    if (a && a.info && a.info.token && a.info.token.contract_addr === window.__lpwallet.contracts.frg) frg = a.amount;
    if (a && a.info && a.info.native_token && a.info.native_token.denom === 'uluna') lunc = a.amount;
  }
  return { frg, lunc, total: pool ? pool.total_share : null };
}
function estFor(rawStr){
  const r = poolReserves(lpCur.pool);
  if (r.frg === null || r.lunc === null || !r.total) return null;
  const raw = BigInt(rawStr || '0'), total = BigInt(r.total);
  if (total <= 0n) return null;
  return { frg: raw * BigInt(r.frg) / total, lunc: raw * BigInt(r.lunc) / total };
}
function parseAmount(str){
  str = String(str || '').trim().replace(/,/g, '');
  if (!/^\d+(\.\d+)?$/.test(str)) return null;
  const parts = str.split('.');
  const w = parts[0], f = parts[1] || '';
  if (f.length > 6) return null;
  return BigInt(w) * 1000000n + BigInt((f + '000000').slice(0, 6) || '0');
}
function shareText(){
  const r = poolReserves(lpCur.pool);
  if (!r.total || BigInt(r.total) <= 0n) return '—';
  const pct = Number(lpCur.lpRaw) / Number(r.total) * 100;
  return pct.toFixed(4).replace(/0+$/, '').replace(/\.$/, '') + '%';
}

function updateReview(){
  const btn = $('lpWithdrawBtn');
  const box = $('lpReview');
  if (!lpCur.connected){ box.textContent = 'Connect the wallet that holds the LP first.'; btn.disabled = true; return; }
  const raw = parseAmount($('lpAmount').value);
  if (raw === null){ box.textContent = 'Enter an amount to see exactly what will be sent.'; btn.disabled = true; return; }
  if (raw <= 0n){ box.textContent = 'Enter an amount above zero.'; btn.disabled = true; return; }
  if (raw > BigInt(lpCur.lpRaw)){ box.textContent = 'That is more LP than this wallet holds (' + fmtUnits(lpCur.lpRaw) + ' LP).'; btn.disabled = true; return; }
  const est = estFor(raw.toString());
  box.textContent = 'Sending ' + fmtUnits(raw.toString()) + ' LP to the FRG–LUNC pair.'
    + (est ? ' You\u2019d get back about ' + fmtUnits(est.frg.toString()) + ' FRG + ' + fmtUnits(est.lunc.toString()) + ' LUNC (estimate).' : '')
    + ' Fee paid in LUNC from your wallet. Your wallet will ask you to approve this exact send.';
  btn.disabled = lpBusy;
}

function render(){
  const panel = $('lpPanel');
  if (!lpCur.addr){ panel.hidden = true; return; }
  panel.hidden = false;
  $('lpAddr').textContent = lpCur.addr;
  $('lpBalance').textContent = fmtUnits(lpCur.lpRaw) + ' LP';
  $('lpShare').textContent = shareText();
  const est = estFor(lpCur.lpRaw);
  $('lpEst').textContent = est ? (fmtUnits(est.frg.toString()) + ' FRG + ' + fmtUnits(est.lunc.toString()) + ' LUNC') : '—';
  const zero = BigInt(lpCur.lpRaw || '0') <= 0n;
  $('lpZero').hidden = !zero;
  $('lpForm').style.display = zero ? 'none' : '';
  if (!zero) updateReview();
}

window.__lpOnWallet = function(st){
  lpCur = { addr: st.addr, connected: st.connected, via: st.via, lpRaw: st.lpRaw || '0', pool: st.pool || null };
  render();
};

document.querySelectorAll('.quick button').forEach(b => {
  b.onclick = () => {
    if (BigInt(lpCur.lpRaw || '0') <= 0n) return;
    const raw = BigInt(lpCur.lpRaw) * BigInt(b.dataset.pct) / 100n;
    $('lpAmount').value = rawToInput(raw.toString());
    updateReview();
  };
});
$('lpAmount').addEventListener('input', updateReview);

$('lpWithdrawBtn').onclick = async () => {
  if (lpBusy) return;
  const raw = parseAmount($('lpAmount').value);
  if (raw === null || raw <= 0n || raw > BigInt(lpCur.lpRaw || '0')){ updateReview(); return; }
  lpBusy = true;
  const btn = $('lpWithdrawBtn');
  btn.disabled = true; btn.textContent = 'SIGN IN YOUR WALLET…';
  $('lpResult').textContent = 'Waiting for your wallet to sign…';
  try {
    const out = await window.__lpwallet.withdraw(raw.toString());
    const hash = out && out.transactionHash;
    const res = $('lpResult');
    res.innerHTML = '';
    res.appendChild(document.createTextNode('✅ Done — your FRG + LUNC are back in your wallet. '));
    if (hash){
      const a = document.createElement('a');
      a.href = 'https://finder.terraclassic.community/columbus-5/tx/' + hash;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'View the transaction: ' + hash;
      res.appendChild(a);
    }
    $('lpAmount').value = '';
    await window.__lpwallet.refresh();
  } catch (e) {
    $('lpResult').textContent = '❌ ' + ((e && e.message) || 'Withdraw failed — nothing was sent.');
  }
  lpBusy = false;
  btn.textContent = 'WITHDRAW';
  updateReview();
};

/* if a stored session restored before this glue loaded, adopt it */
setTimeout(() => {
  if (!lpCur.addr && window.__lpwallet){
    const st = window.__lpwallet.state();
    if (st.addr) window.__lpOnWallet(st);
  }
}, 1200);
</script>
</body>
</html>
