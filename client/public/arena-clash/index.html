<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ARENA CLASH — Duel of the Fallen Crown</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#07060a;overflow:hidden}
body{font-family:"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;color:#e8e2d4}
#wrap{position:fixed;inset:0;touch-action:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 0%,#17121f 0%,#07060a 70%)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* touch controls */
.tc{position:fixed;bottom:0;z-index:20;display:none;width:100%;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none;justify-content:space-between;align-items:flex-end}
body.touch .tc{display:flex}
.tc .cluster{display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.tc button{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:2px solid rgba(232,226,212,.35);background:rgba(14,12,20,.55);color:#e8e2d4;font-size:22px;font-weight:700;backdrop-filter:blur(2px)}
.tc button:active,.tc button.on{background:rgba(198,44,44,.65);border-color:#ffb3a0}
.tc button.wide{width:72px;height:72px;font-size:13px;letter-spacing:.06em}
.tc button.sp{border-color:rgba(120,200,255,.6)}
.tc button.sp:active,.tc button.sp.on{background:rgba(38,110,180,.7)}
#rematch{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:30;display:none;padding:16px 42px;font-size:20px;font-weight:800;letter-spacing:.14em;color:#fff;background:linear-gradient(180deg,#a31616,#6d0d0d);border:2px solid #ffb3a0;border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.7);cursor:pointer}
#rematch:active{transform:translateX(-50%) scale(.97)}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<button id="rematch">REMATCH</button>
<div class="tc" id="tcL">
  <div class="cluster">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
    <button data-k="jump">▲</button>
    <button data-k="crouch">▼</button>
    <button data-k="block">⛨</button>
  </div>
  <div class="cluster">
    <button data-k="special" class="wide sp">SPECIAL</button>
    <button data-k="kick" class="wide">HEAVY</button>
    <button data-k="punch" class="wide">SLASH</button>
  </div>
</div>

function noise(dur,fFrom,fTo,vol){if(!AC)return;var t=AC.currentTime,len=Math.max(1,(dur*AC.sampleRate)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;var s=AC.createBufferSource();s.buffer=buf;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(fFrom,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,fTo),t+dur);f.Q.value=1.1;var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur);}
function sfx(n){if(!AC)return;
 if(n==='swing')noise(.13,2600,300,.20);
 if(n==='swingH')noise(.2,1500,180,.28);
 if(n==='hit'){noise(.1,900,120,.5);tone(160,50,.12,'square',.25);}
 if(n==='hitH'){noise(.16,700,80,.65);tone(120,34,.22,'square',.4);}
 if(n==='block'){tone(2200,1800,.06,'square',.12);noise(.05,3000,2400,.15);}
 if(n==='cast'){tone(300,1400,.25,'sawtooth',.12);}

 if(n==='ko'){tone(140,26,1.1,'sine',.6);noise(.7,500,60,.5);}
 if(n==='bell'){tone(1240,1240,.5,'sine',.18);tone(1860,1860,.3,'sine',.08);}

}

var parts=[],projs=[];
function sparks(x,y,col,n,pow){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=(0.3+Math.random()*0.7)*pow;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.28+Math.random()*.25,t:0,col:col,r:1.5+Math.random()*2.2,grav:900,type:'spark'});}}

function ring(x,y,col){parts.push({x:x,y:y,vx:0,vy:0,life:.3,t:0,col:col,r:8,grav:0,type:'ring'});}
function updateParts(dt){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue;}p.vy+=(p.grav||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='ring')p.r+=340*dt;}}

 if(p.type==='spark'){ctx.globalAlpha=k;ctx.strokeStyle=p.col;ctx.lineWidth=p.r;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();}

 });ctx.globalAlpha=1;}

var ANIMS={

};
var ATK={
 hero:{atk1:{dmg:7,range:298,push:250,stop:.055,stun:.26,meter:8},atk2:{dmg:12,range:318,push:430,stop:.11,stun:.38,meter:12,shake:9},special:{dmg:13,range:330,push:460,stop:.12,stun:.4,meter:0,shake:11}},

};
function Fighter(cfg){
 this.cfg=cfg;this.key=cfg.key;this.name=cfg.name;this.sub=cfg.sub;
 this.anchorX=cfg.anchorX;this.feetY=cfg.feetY;this.S=cfg.scale;this.speed=cfg.speed;
 this.x=cfg.x;this.face=cfg.face;this.y=0;this.vx=0;this.vy=0;

 this.hasHit=false;this.flashT=0;this.stunT=0;this.in={};this.aiT=0;this.aiBlockT=0;this.aiCd=0;this.dead=false;
}
Fighter.prototype.setAnim=function(a){if(this.anim!==a){this.anim=a;this.frame=0;this.frameT=0;}};
Fighter.prototype.animDone=function(){var A=ANIMS[this.key][this.anim];return !A.loop&&this.frame>=A.f-1&&this.frameT>=A.d;};
Fighter.prototype.updateAnim=function(dt){var A=ANIMS[this.key][this.anim];this.frameT+=dt;while(this.frameT>=A.d){this.frameT-=A.d;if(this.frame<A.f-1)this.frame++;else if(A.loop)this.frame=0;else{this.frameT=0;break;}}};

var P1=new Fighter({key:'hero',name:'VALE',sub:'THE WANDERING BLADE',anchorX:95,feetY:122,scale:7.0,speed:305,x:360,face:1});

function endRound(winner,byKO){

/* ================= combat ================= */
function isBlocking(f,att){if(f.y>4)return false;if(f.state!=='block'&&f.state!=='blockstun'&&!(f.state==='idle'&&f.in.block))return false;var dirToAtt=Math.sign(att.x-f.x);return f.face===dirToAtt||f.state==='blockstun';}
function tryHit(att,def,atkKey){
 var A=ATK[att.key][atkKey];if(att.hasHit)return;
 var dx=def.x-att.x,adx=Math.abs(dx);
 var inFront=(Math.sign(dx)===att.face&&adx<=A.range)||(A.spin&&adx<=A.range*.55);
 var vertOk=Math.abs(def.y-att.y)<170&&def.y<190;
 if(!inFront||!vertOk)return;
 att.hasHit=true;
 var blocked=isBlocking(def,att);
 var hx=def.x-att.face*30,hy=FLOOR-def.y-185;
 if(blocked){
  def.hp=Math.max(1,def.hp-Math.ceil(A.dmg*.15));def.state='blockstun';def.stunT=.18;def.vx=att.face*A.push*.45;
  sparks(hx,hy,'#bfe3ff',10,320);ring(hx,hy,'#9fd0ff');sfx('block');att.meter=Math.min(100,att.meter+3);def.meter=Math.min(100,def.meter+4);
 }else{
  def.hp-=A.dmg;def.ghostT=0;def.flashT=.07;def.vx=att.face*A.push;def.state='hit';def.stunT=A.stun;def.setAnim('hit');
  if(att.y>4||def.y>4){def.vy=Math.max(def.vy,260);} 
  sparks(hx,hy,'#ffd76a',atkKey==='atk1'?14:22,atkKey==='atk1'?420:560);sparks(hx,hy,'#ff5a2e',8,300);ring(hx,hy,'#ffe9b0');
  G.hitstop=Math.max(G.hitstop,A.stop);if(A.shake)G.shake=Math.max(G.shake,A.shake);
  sfx(atkKey==='atk1'?'hit':'hitH');
  att.meter=Math.min(100,att.meter+A.meter);def.meter=Math.min(100,def.meter+A.dmg*.7);
  if(def.hp<=0){def.hp=0;ko(att,def);}
 }
}
function ko(att,def){
 def.dead=true;def.state='ko';def.setAnim('death');def.vx=att.face*300;def.vy=330;
 G.slowmo=1.5;G.shake=16;sfx('ko');dust(FLOOR*0+def.x,FLOOR,16);
 G.winner=att;setTimeout(function(){if(G.state==='fight')endRound(att,true);},900);
}

/* ================= per-fighter update ================= */
function fighterUpdate(f,foe,dt){
 f.stateT+=dt;if(f.flashT>0)f.flashT-=dt;if(f.ghostT<.6)f.ghostT+=dt;
 if(f.ghost>f.hp&&f.ghostT>.45)f.ghost=Math.max(f.hp,f.ghost-30*dt);
 var busy=(f.state==='atk1'||f.state==='atk2'||f.state==='special'||f.state==='hit'||f.state==='blockstun'||f.state==='ko'||f.state==='win');
 // physics
 f.x+=f.vx*dt;
 if(f.y>0||f.vy>0){f.vy-=2600*dt;f.y+=f.vy*dt;if(f.y<=0){f.y=0;f.vy=0;dust(f.x,FLOOR,7);if(f.state==='jump')f.state='idle';}}
 if(f.y===0){var fr=(busy&&!(f.state==='special'&&f.key==='hero'&&f.stateT<.30))?900:2600;if(f.vx>0)f.vx=Math.max(0,f.vx-fr*dt);else if(f.vx<0)f.vx=Math.min(0,f.vx+fr*dt);}
 f.x=Math.max(70,Math.min(W-70,f.x));
 if(f.state==='ko'){f.updateAnim(dt);return;}
 if(f.stunT>0){f.stunT-=dt;f.updateAnim(dt);if(f.stunT<=0&&(f.state==='hit'||f.state==='blockstun')){f.state='idle';f.setAnim('idle');}return;}
 if(busy&&f.state!=='hit'&&f.state!=='blockstun'){
  // attack progression
  var A=ANIMS[f.key][f.anim];
  if(f.state==='special'&&f.key==='hero'){
   if(f.stateT<.30){f.vx=f.face*1010;}
   var Ad=ATK.hero.special;var dx=foe.x-f.x;
   if(Math.abs(dx)<=172&&Math.sign(dx)===f.face&&!f.hasHit){tryHit(f,foe,'special');if(f.hasHit)f.vx=f.face*120;}
  }
  if(f.state==='special'&&f.key==='warrior'&&!f.hasHit&&f.stateT>=.18){
   f.hasHit=true;sfx('cast');

  if(G.hitstop>0){G.hitstop-=dt;return;}
  var ts=G.slowmo>0?.22:1;if(G.slowmo>0)G.slowmo-=dt;
  var sdt=dt*ts;

 if(G.state==='roundEnd'){G.phaseT+=dt;var sdt2=G.slowmo>0?dt*.22:dt;if(G.slowmo>0)G.slowmo-=dt;
  fighterUpdate(P1,P2,sdt2);fighterUpdate(P2,P1,sdt2);updateParts(sdt2);

  return;}
 if(G.state==='matchEnd'){G.endT+=dt;P1.in={};P2.in={};fighterUpdate(P1,P2,dt);fighterUpdate(P2,P1,dt);updateParts(dt);embers(dt);return;}
}
