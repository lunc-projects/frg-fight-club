<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ---------- language selector ---------- */
  #langWrap{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;z-index:90;display:flex;align-items:center;gap:6px;background:rgba(8,12,30,.88);border:1px solid #ffd23e;border-radius:999px;padding:6px 11px;box-shadow:0 0 14px rgba(255,210,62,.35)}

  #langSel{background:transparent;border:none;color:#ffd23e;font-size:15px;font-weight:700;outline:none;max-width:132px}
  #langSel option{background:#0b1030;color:#fff}

  /* ---------- score sheet ---------- */
  #sheet{position:fixed;top:calc(48px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;background:rgba(6,9,24,.82);border:1px solid rgba(140,180,255,.4);border-radius:8px;padding:3px;max-width:97vw}
  .fr{flex:0 0 auto;width:32px;text-align:center;border-radius:4px;background:rgba(20,30,60,.55);padding:2px 0 3px}
  .fr.cur{outline:2px solid #ffd23e;background:rgba(80,60,0,.5)}
  .fr .fn{font-size:8.5px;font-weight:800;color:#9db8e8;letter-spacing:.5px}
  .fr .fm{font-size:11.5px;font-weight:800;color:#fff;min-height:14px;letter-spacing:1px;white-space:nowrap}
  .fr .ft{font-size:12.5px;font-weight:900;color:#ffd23e;min-height:15px}
  .fr.w10{width:44px}
  @media (max-width:420px){ .fr{width:29px} .fr.w10{width:40px} }

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:calc(108px + env(safe-area-inset-top));left:8px;z-index:55;background:rgba(6,9,24,.78);border:1px solid rgba(140,180,255,.4);border-radius:12px;padding:6px 12px;pointer-events:none}
  #hud .lab{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:#9db8e8}
  #hud .val{font-size:23px;font-weight:900;color:#fff;line-height:1.05}
  #hudTotal{color:#ffd23e}
  #msg{position:fixed;top:26%;left:0;right:0;z-index:70;text-align:center;font-size:clamp(30px,9vw,52px);font-weight:900;font-style:italic;letter-spacing:1px;color:#ffd23e;text-shadow:0 0 24px rgba(255,180,0,.85),0 3px 0 #7a4a00;opacity:0;transition:opacity .18s;pointer-events:none}
  #msg.show{opacity:1}
  #msg small{display:block;font-size:clamp(14px,4.4vw,20px);color:#cfe2ff;font-style:normal;letter-spacing:2px;text-shadow:0 2px 8px #000}

  /* ---------- controls ---------- */
  #ctrl{position:fixed;left:0;right:0;bottom:0;z-index:65;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(5,6,15,0),rgba(5,6,15,.88) 38%);text-align:center}
  #phaseLab{font-size:13px;font-weight:800;letter-spacing:2px;color:#cfe2ff;text-shadow:0 1px 5px #000;margin-bottom:7px}
  #phaseLab b{color:#ffd23e}

  #throwBtn{display:block;width:min(330px,86vw);margin:0 auto;padding:16px 18px;border:none;border-radius:16px;font-size:21px;font-weight:900;letter-spacing:1.5px;cursor:pointer;color:#231300;background:linear-gradient(180deg,#ffd23e,#ff9a1f);box-shadow:0 5px 0 #9c4d00,0 12px 24px rgba(0,0,0,.55)}

  #throwBtn:disabled{filter:grayscale(.6) brightness(.6);box-shadow:0 5px 0 #444}
  #hookLab{margin-top:7px;font-size:12px;font-weight:700;color:#9db8e8;letter-spacing:1px;min-height:15px}

  .howCard{margin-top:16px;background:rgba(8,12,30,.9);border:1px solid rgba(140,180,255,.45);border-radius:14px;padding:12px 16px;max-width:min(430px,92vw);font-size:14.5px;line-height:1.5;color:#dbe9ff}

</style>

<body>
<div id="game"></div>

<button id="muteBtn" aria-label="Sound">🔊</button>
<div id="langWrap"><span>🌐</span><select id="langSel" aria-label="Language"></select></div>

<!-- compact score sheet -->
<div id="sheet" class="hidden"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="lab" data-i18n="frame">FRAME</div><div class="val" id="hudFrame">1</div>
  <div class="lab" data-i18n="total">TOTAL</div><div class="val" id="hudTotal">0</div>
</div>
<div id="msg"></div>

<!-- controls -->
<div id="ctrl" class="hidden">
  <div id="phaseLab"></div>
  <div id="powerWrap" class="hidden"><div id="powerSweet"></div><div id="powerBar"></div></div>
  <button id="throwBtn" data-i18n="throw">THROW</button>
  <div id="hookLab"></div>
</div>

<!-- menu -->
<div id="menu" class="screen">
  <div class="titleArt">LUNA <span class="gold">BOWLING</span></div>
  <div class="tagline" id="tagline">Ten pins. One moon. No gravity excuses.</div>
  <button class="btn" id="playBtn" data-i18n="play">▶ PLAY</button>
  <div class="bestLine" id="bestLine"></div>
  <div class="howCard" id="howto">Drag to aim ◀ ▶ · hold THROW for power · drag sideways for curve · release to bowl!</div>
</div>

<!-- game over -->
<div id="over" class="screen hidden">
  <div class="titleArt" style="font-size:clamp(32px,9vw,54px)" data-i18n="gameOver">GAME OVER</div>
  <div class="tagline" data-i18n="yourScore">YOUR SCORE</div>
  <div id="finalScore">0</div>
  <div id="newBest"></div>
  <button class="btn" id="againBtn" data-i18n="newGame">NEW GAME</button>
  <button class="btn dark" id="menuBtn" data-i18n="menu">MAIN MENU</button>
</div>

function tone(freq, dur, type, vol, when=0, slideTo=null){

  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noiseBurst(dur, vol, freq, when=0){
  if (muted) return; const c = ac(), t = c.currentTime + when;
  const len = Math.max(1, (dur * c.sampleRate) | 0), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t);
}

  if (muted || rumble) return; const c = ac();
  const len = c.sampleRate, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

let ballState = null, settleT = 0, betweenT = 0, lastActionT = 0, msgT = 0, camShake = 0;
const clock = new THREE.Clock();

function computeScores(){
  const fs = new Array(10).fill(null); let ri = 0, total = 0;
  for (let f = 0; f < 10; f++){
    if (f < 9){
      if (rolls[ri] === undefined) break;
      if (rolls[ri] === 10){
        if (rolls[ri+1] === undefined || rolls[ri+2] === undefined) break;
        total += 10 + rolls[ri+1] + rolls[ri+2]; ri += 1;
      } else {
        if (rolls[ri+1] === undefined) break;
        if (rolls[ri] + rolls[ri+1] === 10){
          if (rolls[ri+2] === undefined) break;
          total += 10 + rolls[ri+2];
        } else total += rolls[ri] + rolls[ri+1];
        ri += 2;
      }
      fs[f] = total;
    } else {
      const r = rolls.slice(ri);
      if (r.length < 2) break;
      const need = (r[0] === 10 || r[0] + r[1] === 10) ? 3 : 2;
      if (r.length < need) break;
      total += r[0] + r[1] + (r[2] || 0); fs[f] = total;
    }
  }
  return { fs, total };
}
function markFor(knocked, standingBefore, prevInRack){
  if (knocked === 0) return '–';
  if (standingBefore === 10 && knocked === 10) return 'X';
  if (prevInRack > 0 && prevInRack + knocked === 10) return '/';
  if (standingBefore < 10 && knocked === standingBefore && prevInRack > 0) return '/';
  return String(knocked);
}
function frameMarks(){
  const marks = Array.from({ length:10 }, () => []); let ri = 0;
  for (let f = 0; f < 10; f++){
    if (f < 9){
      if (rolls[ri] === undefined) break;
      if (rolls[ri] === 10){ marks[f] = ['X']; ri += 1; }
      else {
        marks[f].push(markFor(rolls[ri], 10, 0));
        if (rolls[ri+1] !== undefined) marks[f].push(markFor(rolls[ri+1], 10 - rolls[ri], rolls[ri]));
        ri += 2;
      }
    } else {
      let standing = 10, prev = 0;
      for (let b = 0; b < 3 && rolls[ri] !== undefined; b++){
        const k = rolls[ri]; marks[f].push(markFor(k, standing, prev)); ri++;
        if (b === 0){ if (k === 10){ standing = 10; prev = 0; } else { standing = 10 - k; prev = k; } }
        else if (b === 1){
          const b1 = rolls[ri - 2];
          if (b1 === 10){ if (k === 10){ standing = 10; prev = 0; } else { standing = 10 - k; prev = k; } }
          else standing = 10; /* spare or strike path: fresh rack for ball 3 (open frame never reaches ball 3) */
          if (b1 !== 10) prev = 0;
        }
      }
    }
  }
  return marks;
}
function buildSheet(){
  const sh = $('sheet'); sh.innerHTML = '';
  for (let f = 0; f < 10; f++){
    const d = document.createElement('div'); d.className = 'fr' + (f === 9 ? ' w10' : '');
    d.innerHTML = `<div class="fn">${f + 1}</div><div class="fm" id="fm${f}"></div><div class="ft" id="ft${f}"></div>`;
    sh.appendChild(d);
  }
}
function renderSheet(){
  const { fs } = computeScores(), marks = frameMarks();
  for (let f = 0; f < 10; f++){
    $('fm' + f).textContent = marks[f].join(' ');
    $('ft' + f).textContent = fs[f] === null ? '' : fs[f];
    document.querySelectorAll('.fr')[f].classList.toggle('cur', phase !== 'over' && f === frameIdx);
  }
}
function updateHUD(){
  const { total } = computeScores();
  $('hudFrame').textContent = Math.min(frameIdx + 1, 10) + ' · ' + T('ball') + ' ' + Math.max(1, ballInFrame);
  $('hudTotal').textContent = total;
}
function updateBestLine(){
  const best = +(localStorage.getItem('lunaBowlBest') || 0);
  $('bestLine').textContent = best > 0 ? T('best') + ': ' + best : '';
}
function showMsg(big, sub){
  const m = $('msg');
  m.innerHTML = big + (sub ? `<small>${sub}</small>` : '');
  m.classList.add('show'); msgT = 1.6;
}
function standingCount(){ return pins.filter(p => !p.down).length; }

function resetPin(p, fresh){
  p.vx = 0; p.vz = 0; p.falling = false; p.down = false; p.fallT = 0; p.wob = 0; p.sweep = 0;
  if (fresh){ p.x = p.hx; p.z = p.hz; }
  p.grp.visible = true;
  p.grp.position.set(p.x, 0, p.z);
  p.grp.rotation.set(0, 0, 0);
}
function setupRack(fresh){
  pins.forEach(p => {
    if (fresh) resetPin(p, true);
    else if (p.down){ p.grp.visible = false; p.vx = 0; p.vz = 0; p.falling = false; }  /* swept into the pit */
    else { p.grp.rotation.set(0,0,0); p.wob = 0; p.vx = 0; p.vz = 0; p.grp.position.set(p.x, 0, p.z); }
  });
  standingStart = standingCount();
  if (fresh) rackPrev = 0;
}
function resetBall(){
  ballState = null; stopRumble();
  ball.position.set(aimX, BALL_R, FOUL_Z);
  ball.rotation.set(0, 0, 0);
  aimArrow.visible = true;
}
function newGame(){
  rolls = []; frameIdx = 0; ballInFrame = 1; aimX = 0; hook = 0;
  setupRack(true); resetBall();
  phase = 'aim';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  $('sheet').classList.remove('hidden'); $('hud').classList.remove('hidden'); $('ctrl').classList.remove('hidden');
  renderSheet(); updateHUD(); updatePhase();
}
function gameOver(){
  phase = 'over';
  const { total } = computeScores();
  $('finalScore').textContent = total;
  const best = +(localStorage.getItem('lunaBowlBest') || 0);
  if (total > best){ localStorage.setItem('lunaBowlBest', total); $('newBest').textContent = T('newBest'); }
  else $('newBest').textContent = T('best') + ': ' + best;
  $('over').classList.remove('hidden'); $('ctrl').classList.add('hidden');
  updateBestLine(); renderSheet();
}
function updatePhase(){
  const pl = $('phaseLab');
  if (phase === 'aim'){ pl.innerHTML = T('aimPhase'); $('powerWrap').classList.add('hidden'); $('throwBtn').disabled = false; $('hookLab').textContent = ''; }
  else if (phase === 'power'){ pl.innerHTML = T('powerPhase'); $('powerWrap').classList.remove('hidden'); }
}
$('playBtn').onclick = () => { ac(); newGame(); };
$('againBtn').onclick = () => { ac(); newGame(); };
$('menuBtn').onclick = () => { phase = 'menu'; $('over').classList.add('hidden'); $('sheet').classList.add('hidden'); $('hud').classList.add('hidden'); $('ctrl').classList.add('hidden'); $('menu').classList.remove('hidden'); setupRack(true); aimX = 0; resetBall(); };

/* ---- ball / frame flow ---- */
function doThrow(power, hk){
  if (phase !== 'aim' && phase !== 'power') return;
  phase = 'roll'; aimArrow.visible = false;
  $('powerWrap').classList.add('hidden'); $('throwBtn').disabled = true; $('hookLab').textContent = '';
  const speed = 7.5 + (power / 100) * 9.5;
  /* difficulty: release jitter + power character — the same input no longer repeats the same throw */
  const jx = (Math.random() * 2 - 1) * .085;
  const jv = (Math.random() * 2 - 1) * .16;
  const over = Math.max(0, power - 92) / 8;        /* 0..1: skids + deflects off the rack */
  const under = Math.max(0, 58 - power) / 58;      /* 0..1: hooks early, arrives light */
  const launchX = THREE.MathUtils.clamp(aimX + swayX + jx, -1.6, 1.6);
  ballState = { x: launchX, z: FOUL_Z, vx: hk * .5 + jv, vz: -speed, hook: hk, power, over, under, gutter: false, done: false, deckT: 0 };
  settleT = 0; lastActionT = 0; sndThrow(); startRumble();
}
function finishBall(){
  const knocked = standingStart - standingCount();
  rolls.push(knocked);
  const isStrike = knocked === 10 && standingStart === 10;
  const isSpare = !isStrike && rackPrev > 0 && rackPrev + knocked === 10;
  if (ballState && ballState.gutter && knocked === 0){ showMsg(T('gutter'), ''); sndGutter(); }
  else if (isStrike){ showMsg(T('strike'), knocked + ' ' + T('pins')); sndStrike(); }
  else if (isSpare){ showMsg(T('spare'), knocked + ' ' + T('pins')); sndSpare(); }
  else showMsg(knocked + '', T('pins'));
  camShake = Math.min(.5, knocked * .05);
  renderSheet(); updateHUD();
  phase = 'between'; betweenT = 1.15;
}
function advance(){
  const knocked = rolls[rolls.length - 1];
  if (frameIdx < 9){
    if (ballInFrame === 1 && knocked < 10){ ballInFrame = 2; setupRack(false); rackPrev = knocked; }
    else { frameIdx++; ballInFrame = 1; setupRack(true); }
  } else {
    /* 10th frame */
    if (ballInFrame === 1){
      ballInFrame = 2;
      if (knocked === 10) setupRack(true); else { setupRack(false); rackPrev = knocked; }
    } else if (ballInFrame === 2){
      const b1 = rolls[rolls.length - 2], b2 = knocked;
      if (b1 === 10){
        ballInFrame = 3;
        if (b2 === 10) setupRack(true);
        else if (standingCount() === 0) setupRack(true);
        else { setupRack(false); rackPrev = b2; }
      } else if (b1 + b2 === 10){ ballInFrame = 3; setupRack(true); }
      else { gameOver(); return; }
    } else { gameOver(); return; }
  }
  if (frameIdx > 9){ gameOver(); return; }
  resetBall(); phase = 'aim';
  renderSheet(); updateHUD(); updatePhase();
}

/* ================= physics ================= */
let quietT = 0;
function pinFall(p, dx, dz, speed){
  const len = Math.hypot(dx, dz) || 1; dx /= len; dz /= len;
  speed *= .74 + Math.random() * .48;   /* pin-action variance: identical hits scatter differently every throw */
  if (p.falling){ p.vx += dx * speed * .35; p.vz += dz * speed * .35; return; }
  p.falling = true; p.fallT = 0;
  p.vx = dx * speed; p.vz = dz * speed;
  p.axis.set(dz, 0, -dx);
  if (p.axis.lengthSq() < .01) p.axis.set(1, 0, 0); p.axis.normalize();
  quietT = 0;
}
function stepPins(dt){
  for (const p of pins){
    if (!p.grp.visible) continue;
    if (p.falling){
      p.fallT += dt;
      const k = Math.min(1, p.fallT / .45), e = k * k * (3 - 2 * k);
      p.grp.quaternion.setFromAxisAngle(p.axis, e * 1.62);
      p.x += p.vx * dt; p.z += p.vz * dt;
      const damp = Math.max(0, 1 - 3.9 * dt); p.vx *= damp; p.vz *= damp;
      p.grp.position.set(p.x, 0, p.z);
      if (k >= 1) p.down = true;
      else quietT = 0;
      if (!p.down && (p.z < DECK_Z - 4.2 || Math.abs(p.x) > 3.6)) p.down = true;
    } else if (!p.down && p.wob > 0){
      p.wob = Math.max(0, p.wob - dt * 1.3);
      const a = Math.sin(p.wob * 22) * .13 * p.wob;
      p.grp.rotation.set(a, 0, a * .6);
      if (p.wob === 0) p.grp.rotation.set(0, 0, 0);
    }
  }
  /* pin -> pin chain hits */
  for (const a of pins){
    if (!a.falling || !a.grp.visible) continue;
    const as = Math.hypot(a.vx, a.vz); if (as < 1.1) continue;
    for (const b of pins){
      if (b === a || b.down || b.falling || !b.grp.visible) continue;
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d < PIN_R * 2 + .03 && d > .001){
        const imp = as * .52;   /* chains bleed energy now — a flying pin no longer guarantees the next pin */
        if (imp > 2.7 + Math.random() * 2.1) pinFall(b, dx / d, dz / d, imp);
        else if (imp > .9) b.wob = 1;
        quietT = 0;
      }
    }
  }
}
function stepBall(dt){
  const bs = ballState; if (!bs) return;
  if (!bs.gutter){
    const biteZ = bs.under > 0 ? 4.5 : .5;               /* underpowered: hook bites early + hard, ball wanders light */
    const bite = 3.4 * (1 + (bs.under || 0) * 1.2) * (1 - (bs.over || 0) * .55); /* overpowered: ball skids, hook can't bite */
    if (bs.z < biteZ) bs.vx += bs.hook * bite * dt;
    bs.x += bs.vx * dt; bs.z += bs.vz * dt;
    if (Math.abs(bs.x) > LANE_HALF - .02){ bs.gutter = true; bs.vx = 0; noiseBurst(.12, .2, 320); }
  } else {
    bs.x = Math.sign(bs.x) * (LANE_HALF + .28); bs.z += bs.vz * dt;
  }
  ball.position.set(bs.x, bs.gutter ? .21 : BALL_R, bs.z);
  ball.rotation.x += (bs.vz / BALL_R) * dt;
  ball.rotation.z -= (bs.vx / BALL_R) * dt * .6;
  setRumble(Math.abs(bs.vz) / 17 * (bs.gutter ? .5 : 1));
  /* ball -> pin collisions */
  if (!bs.gutter && bs.z < DECK_Z + 1.2){
    let hits = 0;
    for (const p of pins){
      if (p.down || !p.grp.visible) continue;
      const dx = p.x - bs.x, dz = p.z - bs.z, rr = BALL_R + PIN_R;
      if (dx * dx + dz * dz < rr * rr){
        const d = Math.sqrt(dx * dx + dz * dz) || .01, nx = dx / d, nz = dz / d;
        const spd = Math.hypot(bs.vx, bs.vz);
        p.x = bs.x + nx * rr; p.z = bs.z + nz * rr;
        const pwrF = bs.over ? .92 : 1 - (bs.under || 0) * .3;   /* light arrivals scatter weakly */
        pinFall(p, nx, nz, Math.min((spd * .8 + .7) * pwrF, 7.2));
        bs.vx += nx * (.3 + (bs.over || 0) * .6);              /* overpowered ball deflects off the rack instead of driving through */
        bs.vz *= bs.over ? .86 : .94; hits++;
      }
    }
    if (hits){ sndCrash(hits); camShake = Math.min(.45, .12 + hits * .08); quietT = 0; }
  }
  if (bs.z < DECK_Z + 1.5) bs.deckT += dt;
  if (bs.z < DECK_Z - 4.4 || (bs.deckT > .2 && Math.abs(bs.vz) < .35)){ bs.done = true; bs.vz = 0; stopRumble(); }
  if (!bs.done && bs.z > DECK_Z - 4.4) quietT = 0;
  if (bs.done || bs.deckT > .3){
    quietT += dt;
    if ((bs.done && quietT > .75) || bs.deckT > 4.2){ finishBall(); }
  }
}

/* ================= input ================= */
let dragAim = null, holdX = 0;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => {
  ac();
  if (phase === 'aim'){ dragAim = { sx: e.clientX, bx: aimX }; }
});
addEventListener('pointermove', e => {
  if (dragAim && phase === 'aim'){
    aimX = THREE.MathUtils.clamp(dragAim.bx + (e.clientX - dragAim.sx) * .0075, -1.25, 1.25);
    ball.position.x = aimX; aimArrow.position.x = aimX;
  } else if (phase === 'power'){
    hook = THREE.MathUtils.clamp((e.clientX - holdX) * .006, -1, 1);
    $('hookLab').textContent = Math.abs(hook) < .12 ? '' : (hook < 0 ? '◀'.repeat(Math.min(5, Math.ceil(-hook * 5))) + ' CURVE' : 'CURVE ' + '▶'.repeat(Math.min(5, Math.ceil(hook * 5))));
  }
});
addEventListener('pointerup', () => { dragAim = null; });
const tb = $('throwBtn');
tb.addEventListener('pointerdown', e => {
  ac();
  if (phase !== 'aim') return;
  phase = 'power'; powerT = 0; powerDir = 1; powerVal = 0; hook = 0; holdX = e.clientX;
  updatePhase(); e.preventDefault();
});
tb.addEventListener('pointerup', () => { if (phase === 'power') doThrow(powerVal, hook); });
tb.addEventListener('pointercancel', () => { if (phase === 'power'){ phase = 'aim'; updatePhase(); } });
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' && phase === 'aim'){ aimX = Math.max(-1.25, aimX - .12); ball.position.x = aimX; aimArrow.position.x = aimX; }
  if (e.code === 'ArrowRight' && phase === 'aim'){ aimX = Math.min(1.25, aimX + .12); ball.position.x = aimX; aimArrow.position.x = aimX; }
  if (e.code === 'Space' && phase === 'aim'){ phase = 'power'; powerT = 0; powerDir = 1; hook = 0; holdX = innerWidth / 2; updatePhase(); e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' && phase === 'power') doThrow(powerVal, hook); });

/* ================= main loop ================= */
const camPos = new THREE.Vector3(0, 2.8, 13), camTgt = new THREE.Vector3(0, .6, -8);
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .033), t = clock.elapsedTime;
  earth.rotation.y = t * .008;
  if (phase === 'power'){
    powerT += dt * 1.35;
    const cyc = powerT % 2; powerVal = (cyc < 1 ? cyc : 2 - cyc) * 100;
    $('powerBar').style.width = powerVal + '%';
    /* aim sway: the aim point trembles while charging, worse the longer you hold — release timing matters */
    const amp = Math.min(.055, .012 + powerT * .022);
    swayX = Math.sin(t * 37) * amp + Math.sin(t * 13.7) * amp * .6;
    ball.position.x = aimX + swayX; aimArrow.position.x = aimX + swayX;
  } else swayX = 0;
  if (phase === 'roll' && ballState) stepBall(dt);
  if (phase === 'roll' || phase === 'between') stepPins(dt);
  if (phase === 'between'){ betweenT -= dt; if (betweenT <= 0) advance(); }
  if (msgT > 0){ msgT -= dt; if (msgT <= 0) $('msg').classList.remove('show'); }
  /* camera */
  const P = new THREE.Vector3(), L = new THREE.Vector3();
  if (phase === 'menu' || phase === 'over'){ P.set(Math.sin(t * .1) * 1.2, 2.7, 12.6); L.set(0, .7, -10); }
  else if (phase === 'aim' || phase === 'power'){ P.set(aimX * .55, 3.1, 13.2); L.set(aimX * .3, .3, -9); }
  else if (phase === 'roll' && ballState){ P.set(ballState.x * .6, 3.0, Math.max(ballState.z + 7.6, -5.4)); L.set(ballState.x * .8, .2, ballState.z - 7); }
  else { P.set(0, 3.6, DECK_Z + 9.6); L.set(0, .4, DECK_Z - .5); }
  const k = 1 - Math.exp(-dt * 3.6);
  camPos.lerp(P, k); camTgt.lerp(L, k);
  camera.position.copy(camPos);
  if (camShake > 0){ camShake = Math.max(0, camShake - dt * 1.4); camera.position.x += (Math.random() - .5) * camShake * .3; camera.position.y += (Math.random() - .5) * camShake * .3; }
  camera.lookAt(camTgt);
  aimArrow.material.opacity = .55 + Math.sin(t * 5) * .3;
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= boot + QA hooks ================= */
buildSheet();
setupRack(true); resetBall();
applyLang();
animate();
window.__bowl = {
  state: () => ({ phase, frame: frameIdx + 1, ball: ballInFrame, rolls: rolls.slice(), scores: computeScores(), standing: standingCount() }),
  start: () => newGame(),
  setAim: x => { aimX = THREE.MathUtils.clamp(x, -1.25, 1.25); ball.position.x = aimX; aimArrow.position.x = aimX; },
  throwBall: (p = 90, h = 0) => doThrow(p, h),
  setRolls: r => { rolls = r.slice(); renderSheet(); updateHUD(); },
  pins: () => pins.map(p => ({ x:+p.x.toFixed(2), z:+p.z.toFixed(2), down:p.down, falling:p.falling }))
};
</script>
</body>
