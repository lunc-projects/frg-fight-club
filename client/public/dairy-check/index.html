<!DOCTYPE html>
<html lang="en">
<head>
<base href="/dairy-check/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dairy Checker</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#ffffff; --ink:#263238; --muted:#6b7a80; --line:#e3ded2;
    --accent:#1565c0; --accent-ink:#ffffff;
    --red:#c62828; --red-bg:#fdecea; --amber:#b26a00; --amber-bg:#fff4e0;
    --green:#2e7d32; --green-bg:#e8f5e9; --grey:#616161; --grey-bg:#eeeeee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
  header h1{font-size:24px;margin:0;flex:1 1 auto}
  .langbox{display:flex;align-items:center;gap:8px;font-size:15px}
  .langbox select{font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--accent);background:#fff;min-height:48px}
  .sub{color:var(--muted);font-size:16px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .scanbtn{display:block;width:100%;font-size:21px;font-weight:700;padding:18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:60px}
  .scanbtn:active{transform:scale(.99)}
  #camwrap{display:none;margin-top:12px}
  #camwrap.open{display:block}
  video{width:100%;border-radius:12px;background:#000;max-height:320px;object-fit:cover}
  .stopbtn{margin-top:8px;width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .note{color:var(--muted);font-size:14px;margin-top:10px}
  .ortxt{text-align:center;color:var(--muted);margin:14px 0 8px;font-size:15px}
  .row{display:flex;gap:8px}
  .row input{flex:1;font-size:18px;padding:13px;border:2px solid var(--line);border-radius:10px;min-width:0}
  .row button{font-size:17px;font-weight:600;padding:13px 18px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
  #result{display:none}
  #result.show{display:block}
  .verdict{border-radius:14px;padding:18px 14px;text-align:center;font-size:25px;font-weight:800;letter-spacing:.3px;margin-bottom:12px}
  .verdict.contains{background:var(--red-bg);color:var(--red);border:2px solid var(--red)}
  .verdict.may{background:var(--amber-bg);color:var(--amber);border:2px solid var(--amber)}
  .verdict.none{background:var(--green-bg);color:var(--green);border:2px solid var(--green)}
  .verdict.unknown{background:var(--grey-bg);color:var(--grey);border:2px solid var(--grey)}
  .prod{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .prod img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .prod .pname{font-size:18px;font-weight:700}
  .prod .pcode{color:var(--muted);font-size:13px}
  .why{font-size:16px;margin:6px 0}
  .why b{font-weight:700}
  .small{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45}
  #historyCard{display:none}
  #historyCard.show{display:block}
  .hhead{display:flex;align-items:center;justify-content:space-between}
  .hhead h2{font-size:17px;margin:0}
  .hhead button{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .hitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .hitem:last-child{border-bottom:0}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  .dot.contains{background:var(--red)} .dot.may{background:#ef8f00} .dot.none{background:var(--green)} .dot.unknown{background:#9e9e9e}
  .hitem .hn{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hitem .hv{font-size:13px;font-weight:700}
  .hv.contains{color:var(--red)} .hv.may{color:var(--amber)} .hv.none{color:var(--green)} .hv.unknown{color:var(--grey)}
  .err{color:var(--red);font-size:15px;margin-top:10px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="t-title">🥛 Dairy Checker</h1>
    <label class="langbox"><span id="t-langLabel">Language</span>
      <select id="langSel" aria-label="Language"></select>
    </label>
  </header>
  <p class="sub" id="t-sub">Scan a product barcode and find out if it contains dairy.</p>

  <div class="card">
    <button class="scanbtn" id="scanBtn">📷 <span id="t-scan">Scan barcode</span></button>
    <div id="camwrap">
      <video id="cam" playsinline muted></video>
      <button class="stopbtn" id="stopBtn">■ <span id="t-stop">Stop camera</span></button>
      <div class="note" id="t-point">Point the camera at the barcode…</div>
    </div>
    <div class="note" id="camNote" style="display:none"></div>
    <div class="ortxt" id="t-or">— or type the number —</div>
    <div class="row">
      <input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="Barcode number">
      <button id="checkBtn"><span id="t-check">Check</span></button>
    </div>
    <div class="err" id="errBox"></div>
  </div>

  <div class="card" id="result">
    <div class="verdict" id="verdictBox"></div>
    <div class="prod" id="prodBox" style="display:none">
      <img id="prodImg" alt="">
      <div>
        <div class="pname" id="prodName"></div>
        <div class="pcode" id="prodCode"></div>
      </div>
    </div>
    <div class="why" id="whyBox"></div>
    <div class="why" id="allergenBox" style="font-size:14.5px"></div>
    <div class="small" id="unknownLine" style="display:none"></div>
    <div class="small" id="t-honest">Data from Open Food Facts. Labels can change — always check the package.</div>
  </div>

  <div class="card" id="historyCard">
    <div class="hhead">
      <h2 id="t-history">Checked this trip</h2>
      <button id="clearHist"><span id="t-clear">Clear</span></button>
    </div>
    <div id="histList"></div>
  </div>
</div>

<script id="verdict-logic">
"use strict";
/* Pure verdict logic — no DOM. Extracted and run directly by the node QA test. */
var DAIRY_WORDS = [
  "milk","whey","casein","caseinate","lactose","butter","cream","cheese",
  "yogurt","yoghurt","ghee","curd","buttermilk","custard",
  "lait","leche","milch","latte","melk","leite","mleko","smetana"
];
/* Plant / non-dairy phrases stripped before word matching to avoid false alarms. */
var SAFE_PHRASES = [
  "coconut milk","oat milk","almond milk","soy milk","soya milk","rice milk",
  "cashew milk","hazelnut milk","pea milk","hemp milk","coconut cream",
  "peanut butter","cocoa butter","shea butter","cashew butter","almond butter",
  "sunflower seed butter","cream of tartar","cream of coconut","butter beans",
  "butterfly","butternut"
];
function _stripSafe(text){
  var out = " " + text.toLowerCase() + " ";
  for (var i=0;i<SAFE_PHRASES.length;i++){
    out = out.split(SAFE_PHRASES[i]).join(" ");
  }
  return out;
}
function _dairyWordHit(text){
  var clean = _stripSafe(text);
  for (var i=0;i<DAIRY_WORDS.length;i++){
    var re = new RegExp("(^|[^a-z])" + DAIRY_WORDS[i] + "([^a-z]|$)");
    var m = clean.match(re);
    if (m) return DAIRY_WORDS[i];
  }
  return null;
}
function _tagHas(tags, want){
  if (!Array.isArray(tags)) return false;
  for (var i=0;i<tags.length;i++){ if (tags[i] === want) return true; }
  return false;
}
/* Returns {level: contains|may|none|unknown, reason: {kind, value}} */
function dairyVerdict(product){
  if (!product || typeof product !== "object") return {level:"unknown", reason:{kind:"nodata"}};
  var allergens = product.allergens_tags || [];
  var traces = product.traces_tags || [];
  var text = product.ingredients_text_en || product.ingredients_text || "";
  var hasData = (typeof text === "string" && text.trim().length > 0) ||
                (Array.isArray(product.allergens_tags) && product.allergens_tags.length > 0) ||
                (Array.isArray(product.ingredients) && product.ingredients.length > 0);
  /* 1 — declared milk allergen */
  if (_tagHas(allergens, "en:milk")) return {level:"contains", reason:{kind:"allergen"}};
  /* ingredients analysis tags sometimes carry milk */
  var analysis = product.ingredients_analysis_tags || [];
  if (_tagHas(analysis, "en:milk")) return {level:"contains", reason:{kind:"allergen"}};
  /* split off a "may contain …" clause: it feeds MAY, not CONTAINS */
  var mayClause = "";
  var mainText = text;
  var mayMatch = text.match(/may contain[^.;]*/i);
  if (mayMatch){
    mayClause = mayMatch[0];
    mainText = text.replace(mayMatch[0], " ");
  }
  /* 2 — dairy word in the ingredient list itself */
  var hit = _dairyWordHit(mainText);
  if (hit) return {level:"contains", reason:{kind:"ingredient", value:hit}};
  /* 3 — structured ingredient ids (e.g. en:skimmed-milk-powder) */
  if (Array.isArray(product.ingredients)){
    for (var i=0;i<product.ingredients.length;i++){
      var id = (product.ingredients[i].id || "").replace(/^en:/,"").replace(/-/g," ");
      var ih = _dairyWordHit(id);
      if (ih) return {level:"contains", reason:{kind:"ingredient", value:id}};
    }
  }
  /* 4 — traces of milk */
  if (_tagHas(traces, "en:milk")) return {level:"may", reason:{kind:"traces"}};
  if (mayClause && _dairyWordHit(mayClause)) return {level:"may", reason:{kind:"maytext"}};
  var traceText = text.match(/traces of[^.;]*/i);
  if (traceText && _dairyWordHit(traceText[0])) return {level:"may", reason:{kind:"maytext"}};
  /* 5 — found, with data, nothing dairy */
  if (hasData) return {level:"none", reason:{kind:"clean"}};
  return {level:"unknown", reason:{kind:"nodata"}};
}
</script>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var lang = localStorage.getItem("dairycheck_lang") || "en";
if (!I18N[lang]) lang = "en";
function T(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

var langSel = $("langSel");
Object.keys(LANG_NAMES).forEach(function(code){
  var o = document.createElement("option");
  o.value = code; o.textContent = LANG_NAMES[code];
  langSel.appendChild(o);
});
langSel.value = lang;
langSel.addEventListener("change", function(){
  lang = langSel.value;
  localStorage.setItem("dairycheck_lang", lang);
  applyLang();
  renderHistory();
});

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  $("t-title").textContent = T("title");
  $("t-langLabel").textContent = T("langLabel");
  $("t-sub").textContent = T("sub");
  $("t-scan").textContent = T("scan");
  $("t-stop").textContent = T("stop");
  $("t-point").textContent = T("point");
  $("t-or").textContent = T("or");
  $("codeInput").placeholder = T("codePh");
  $("t-check").textContent = T("check");
  $("t-honest").textContent = T("honest");
  $("t-history").textContent = T("history");
  $("t-clear").textContent = T("clear");
  if (lastResult) showResult(lastResult.code, lastResult.data, lastResult.verdict);
}

function showErr(msg){
  var e = $("errBox");
  e.textContent = msg || "";
  e.className = "err" + (msg ? " show" : "");
}

var lastResult = null;
function cleanTag(t){ return t.replace(/^[a-z]{2}:/,"").replace(/-/g," "); }

function showResult(code, data, verdict){
  var box = $("result");
  box.className = "card show";
  var vb = $("verdictBox");
  vb.className = "verdict " + verdict.level;
  vb.textContent = T(verdict.level === "contains" ? "vContains" :
                     verdict.level === "may" ? "vMay" :
                     verdict.level === "none" ? "vNone" : "vUnknown");
  var p = data && data.product;
  if (p){
    $("prodBox").style.display = "flex";
    $("prodName").textContent = p.product_name_en || p.product_name || T("noName");
    $("prodCode").textContent = code;
    var img = $("prodImg");
    if (p.image_small_url || p.image_url){ img.src = p.image_small_url || p.image_url; img.style.display = ""; }
    else img.style.display = "none";
  } else {
    $("prodBox").style.display = "none";
  }
  var why = "";
  var r = verdict.reason || {};
  if (r.kind === "allergen") why = T("whyAllergen");
  else if (r.kind === "traces") why = T("whyTraces");
  else if (r.kind === "ingredient") why = T("whyIngredient").replace("{w}", r.value);
  else if (r.kind === "maytext") why = T("whyMayText");
  else if (r.kind === "clean") why = T("whyClean");
  $("whyBox").innerHTML = "";
  $("whyBox").appendChild(document.createTextNode(why));
  var al = (p && p.allergens_tags) || [];
  var tr = (p && p.traces_tags) || [];
  var parts = al.map(cleanTag);
  tr.forEach(function(t){ parts.push(cleanTag(t) + " (traces)"); });
  $("allergenBox").textContent = p ? (T("allergensLabel") + " " + (parts.length ? parts.join(", ") : T("noneListed"))) : "";
  $("unknownLine").style.display = (verdict.level === "unknown") ? "" : "none";
  $("unknownLine").textContent = T("unknownLine");
}

/* ---------- history ---------- */
function getHistory(){
  try { return JSON.parse(localStorage.getItem("dairycheck_history") || "[]"); }
  catch(e){ return []; }
}
function saveHistory(h){ localStorage.setItem("dairycheck_history", JSON.stringify(h.slice(0,30))); }
function addHistory(code, name, level){
  var h = getHistory().filter(function(x){ return x.code !== code; });
  h.unshift({code:code, name:name, level:level});
  saveHistory(h);
  renderHistory();
}
function renderHistory(){
  var h = getHistory();
  $("historyCard").className = "card" + (h.length ? " show" : "");
  var list = $("histList");
  list.innerHTML = "";
  h.forEach(function(item){
    var d = document.createElement("div");
    d.className = "hitem";
    var short = item.level === "contains" ? T("sContains") : item.level === "may" ? T("sMay") :
                item.level === "none" ? T("sNone") : T("sUnknown");
    d.innerHTML = '<span class="dot ' + item.level + '"></span><span class="hn"></span><span class="hv ' + item.level + '"></span>';
    d.querySelector(".hn").textContent = item.name || item.code;
    d.querySelector(".hv").textContent = short;
    d.addEventListener("click", function(){ $("codeInput").value = item.code; lookup(item.code); });
    list.appendChild(d);
  });
}
$("clearHist").addEventListener("click", function(){ saveHistory([]); renderHistory(); });

/* ---------- lookup ---------- */
var busy = false;
function lookup(code){
  code = (code || "").replace(/\D/g,"");
  if (!code){ showErr(T("emptyCode")); return; }
  if (busy) return;
  busy = true;
  showErr("");
  $("t-check").textContent = T("checking");
  fetch("https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json?fields=product_name,product_name_en,image_small_url,image_url,allergens_tags,traces_tags,ingredients_text,ingredients_text_en,ingredients,ingredients_analysis_tags", {
    headers: { "Accept": "application/json" }
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    var verdict;
    if (!data || data.status !== 1 || !data.product){
      verdict = { level:"unknown", reason:{kind:"nodata"} };
      lastResult = { code:code, data:null, verdict:verdict };
      showResult(code, null, verdict);
      addHistory(code, code, "unknown");
    } else {
      verdict = dairyVerdict(data.product);
      lastResult = { code:code, data:data, verdict:verdict };
      showResult(code, data, verdict);
      addHistory(code, data.product.product_name_en || data.product.product_name || code, verdict.level);
    }
  })
  .catch(function(){ showErr(T("errNet")); })
  .finally(function(){
    busy = false;
    $("t-check").textContent = T("check");
  });
}
$("checkBtn").addEventListener("click", function(){ lookup($("codeInput").value); });
$("codeInput").addEventListener("keydown", function(e){ if (e.key === "Enter") lookup($("codeInput").value); });

/* ---------- camera scan (BarcodeDetector) ---------- */
var stream = null, detector = null, scanTimer = null;
function stopScan(){
  if (scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  $("camwrap").className = "";
}
$("stopBtn").addEventListener("click", stopScan);
$("scanBtn").addEventListener("click", function(){
  var note = $("camNote");
  function fail(){
    note.textContent = T("camFail");
    note.style.display = "";
    $("codeInput").focus();
  }
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    fail();
    return;
  }
  note.style.display = "none";
  detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(function(s){
    stream = s;
    var v = $("cam");
    v.srcObject = s;
    $("camwrap").className = "open";
    return v.play();
  })
  .then(function(){
    var v = $("cam");
    scanTimer = setInterval(function(){
      detector.detect(v).then(function(codes){
        if (codes && codes.length){
          var raw = codes[0].rawValue;
          stopScan();
          $("codeInput").value = raw;
          lookup(raw);
        }
      }).catch(function(){});
    }, 350);
  })
  .catch(function(){ stopScan(); fail(); });
});

applyLang();
renderHistory();
</script>
</body>
</html>
