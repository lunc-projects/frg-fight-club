<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>LUNC RUSH 3D — Luna Classic Endless Runner</title>
<meta name="description" content="LUNC Rush 3D — a full-3D endless runner on Luna Classic. Play as Roo the kangaroo: bound through the Australian outback, grab LUNC crescent coins and race the winding outback track that bends left and right.">
<meta name="theme-color" content="#0b2a4a">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0b2a4a;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;height:100dvh}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  #hudRow{display:flex;justify-content:space-between;align-items:center;width:100%}
  #hudLeft{display:flex;gap:6px;align-items:center}

  .hudbox img{width:20px;height:20px}
  .hudbox .starIco{color:#63b3ff;font-size:18px;line-height:1}
  .hudbox.dist{color:#cfe8ff;height:28px;font-size:13px;padding:0 10px 0 9px;opacity:.94}
  #hudRight{display:flex;gap:6px;align-items:center}
  #hearts{font-size:15px;letter-spacing:1px;color:#ff5d7a;text-shadow:0 1px 3px rgba(0,0,0,.6);background:rgba(6,24,44,.72);border-radius:999px;height:34px;padding:0 11px;border:2px solid rgba(255,93,122,.6);display:flex;align-items:center}
  .iconbtn{pointer-events:auto;background:rgba(6,24,44,.78);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}
  .iconbtn:active{transform:scale(.93)}
  #ctrlHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 138px);max-width:88vw;background:rgba(6,24,44,.82);border:2px solid rgba(255,203,61,.85);border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;color:#ffe9a8;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.45);opacity:1;transition:opacity .45s ease}
  #ctrlHint.fade{opacity:0}
  #banner{position:absolute;top:22%;left:0;right:0;text-align:center;pointer-events:none}
  #bannerMain{font-size:clamp(30px,8vw,58px);font-weight:900;color:#ffcf3d;text-shadow:0 3px 0 #b97e0a,0 6px 18px rgba(0,0,0,.5);letter-spacing:1px}
  #bannerSub{font-size:clamp(15px,4vw,24px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);margin-top:4px}
  #bannerMain.fadeout,#bannerSub.fadeout{transition:opacity .3s;opacity:0 !important}
  /* speed vignette: alpha is baked into the CSS shadow (0.16); the
     element's opacity is the only thing JS animates (cheap compositor
     work, no repaint of the shadow itself) */
  #speedFx{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(120,200,255,.16);opacity:0;transition:opacity .25s}

  /* ---------- Touch buttons ---------- */
  #touchUI{position:fixed;inset:auto 0 0 0;z-index:6;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-end;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .tcluster{display:flex;gap:14px;align-items:flex-end}
  .tbtn{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(8,30,55,.55);color:#fff;font-size:27px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(2px);touch-action:none}
  .tbtn.big{width:84px;height:84px;font-size:34px;border-color:rgba(255,203,61,.9);background:rgba(90,60,4,.55)}
  .tbtn:active{transform:scale(.92);background:rgba(255,203,61,.5)}
  @media (pointer:fine){ #touchUI{opacity:.55} }

  /* ---------- Floating joystick (house style: gold crescent knob) ---------- */
  #stickDock{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:118px;height:118px;z-index:7;pointer-events:none}
  #stickBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:3px solid rgba(45,212,191,.75);background:radial-gradient(circle at 50% 42%,rgba(20,120,110,.34),rgba(6,24,44,.42));box-shadow:0 4px 18px rgba(0,0,0,.4),inset 0 0 22px rgba(45,212,191,.22);opacity:.62}
  #stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;will-change:transform;border-radius:50%;border:3px solid rgba(255,203,61,.95);background:radial-gradient(circle at 38% 32%,#ffe9a8,#f5a623 72%,#b97e0a);box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  #stickKnob img{width:30px;height:30px;pointer-events:none}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 35%,rgba(11,60,110,.55),rgba(4,16,32,.88));padding:18px;text-align:center}
  #howPanel,#boardPanel{z-index:12}
  .logo{font-size:clamp(38px,10vw,64px);font-weight:900;line-height:.95;color:#ffcf3d;text-shadow:0 4px 0 #b97e0a,0 8px 24px rgba(0,0,0,.6);letter-spacing:1px}
  .logo .d3{color:#63b3ff;text-shadow:0 4px 0 #1d5fa8,0 8px 24px rgba(0,0,0,.6)}
  .crescent{width:74px;height:74px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));margin-bottom:2px}
  #menuTag{font-size:clamp(14px,4vw,19px);font-weight:600;color:#d8ecff;margin:2px 0 8px;max-width:520px}
  .bigbtn{pointer-events:auto;background:linear-gradient(180deg,#ffd94d,#f5a623);border:none;border-bottom:5px solid #b97e0a;color:#3a2400;font-size:clamp(19px,5.4vw,25px);font-weight:900;padding:13px 42px;border-radius:999px;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 20px rgba(0,0,0,.45);margin:5px;min-width:230px;touch-action:none}
  .bigbtn:active{transform:translateY(3px);border-bottom-width:2px}
  .smallbtn{pointer-events:auto;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:15px;font-weight:800;padding:9px 22px;border-radius:999px;cursor:pointer;margin:5px;min-width:132px;touch-action:none}
  .smallbtn:active{transform:scale(.95)}
  .rowbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
  .pstack{display:flex;flex-direction:column;align-items:center;gap:10px}
  .pstack .bigbtn,.pstack .smallbtn{width:min(260px,80vw);margin:0}
  #saveRow .bigbtn{min-width:150px}
  #langSel{margin-top:16px;background:rgba(6,24,44,.85);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:10px;font-size:15px;padding:8px 10px;max-width:86vw}
  .panel{background:rgba(6,24,44,.92);border:2px solid rgba(255,203,61,.6);border-radius:18px;padding:18px 20px;max-width:min(92vw,480px);max-height:82vh;overflow:auto;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .panel h2{color:#ffcf3d;font-size:22px;margin-bottom:10px;text-align:center}
  .panel .body{font-size:15px;line-height:1.55;color:#e6f2ff}
  .panel .center{text-align:center;margin-top:14px}
  table.board{width:100%;border-collapse:collapse;font-size:15px}
  table.board td,table.board th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.14)}
  table.board td.nm{font-weight:700;color:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.board td.sc{text-align:right;font-weight:800;color:#ffe9a8}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
  .tab{pointer-events:auto;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);color:#cfe8ff;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}
  .tab.on{background:#ffcf3d;color:#3a2400;border-color:#ffcf3d}
  #overTitle{font-size:clamp(32px,9vw,52px);font-weight:900;color:#ff5d7a;text-shadow:0 3px 0 #8f1d33,0 6px 18px rgba(0,0,0,.5)}
  #finalScoreLine{font-size:clamp(20px,6vw,30px);font-weight:900;color:#ffe9a8;margin:8px 0 2px}
  #finalDetail{color:#cfe8ff;font-weight:600;margin-bottom:12px}
  #saveRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  #nameInput{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);border-radius:999px;color:#fff;font-size:16px;font-weight:700;padding:10px 16px;width:170px;text-align:center;outline:none}
  #nameInput::placeholder{color:rgba(255,255,255,.55)}
  #savedLine{color:#7dff9a;font-weight:800;min-height:22px;margin-top:6px}
  #loadErr{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0b2a4a;color:#ffd7d7;font-size:16px;padding:24px;text-align:center}
  /* ---------- Boot / loading ---------- */
  #boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b2a4a}
  #boot .crescent{animation:bootPulse 1.1s ease-in-out infinite alternate;margin:0}
  #bootTxt{font-weight:800;font-size:17px;color:#ffe9a8;letter-spacing:1px}
  @keyframes bootPulse{from{transform:scale(.92);opacity:.72}to{transform:scale(1.05);opacity:1}}
</style>
</head>
<body>
<div id="game"></div>

<!-- BOOT / LOADING -->
<div id="boot">
  <img class="crescent" src="lunc.png" alt="Luna Classic crescent">
  <div id="bootTxt">Loading…</div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="speedFx"></div>
  <div id="hudTop">
    <div id="hudRow">
      <div id="hudLeft">
        <div class="hudbox"><img src="lunc.png" alt="LUNC"><span id="hudCoins">0</span></div>
        <div class="hudbox"><span class="starIco">★</span><span id="hudStars">0</span></div>
      </div>
      <div id="hudRight">
        <div id="hearts">♥♥♥</div>
        <button class="iconbtn" id="muteBtn" aria-label="Sound">🔊</button>
        <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
      </div>
    </div>
    <div class="hudbox dist" id="distBox"><span id="hudDistLabel">DIST</span>&nbsp;<span id="hudDist">0m</span></div>
  </div>
  <div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>
  <div id="ctrlHint" class="hidden"></div>
</div>

<!-- Touch controls: the ALWAYS-VISIBLE floating joystick (bottom-left) steers
     freely left/right + push up = jump, push down = roll; JUMP / ROLL buttons stay as extras. -->
<div id="touchUI" class="hidden">
  <div class="tcluster">
    <button class="tbtn" id="btnRoll" aria-label="Roll">▼</button>
    <button class="tbtn big" id="btnJump" aria-label="Jump">▲</button>
  </div>
</div>
<div id="stickDock" class="hidden">
  <div id="stickBase"><div id="stickKnob"><img src="lunc.png" alt=""></div></div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <img class="crescent" src="lunc.png" alt="Luna Classic crescent">
  <div class="logo">LUNC RUSH <span class="d3">3D</span></div>
  <div id="menuTag"></div>
  <button class="bigbtn" id="playBtn"></button>
  <div class="rowbtns">
    <button class="smallbtn" id="howBtn"></button>
    <button class="smallbtn" id="boardBtn"></button>
  </div>
  <select id="langSel" aria-label="Language"></select>
</div>

<!-- HOW TO -->
<div id="howPanel" class="screen hidden">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="body" id="howBody"></div>
    <div class="center"><button class="smallbtn" id="howClose"></button></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="boardPanel" class="screen hidden">
  <div class="panel">
    <h2 id="boardTitle"></h2>
    <div class="tabs">
      <button class="tab on" id="tabAll"></button>
      <button class="tab" id="tabWeek"></button>
    </div>
    <div id="boardBody"></div>
    <div class="center"><button class="smallbtn" id="boardClose"></button></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pausePanel" class="screen hidden">
  <div class="panel" style="text-align:center">
    <h2 id="pauseTitle"></h2>
    <div class="center pstack">
      <button class="bigbtn" id="resumeBtn"></button>
      <button class="smallbtn" id="howBtnPause"></button>
      <button class="smallbtn" id="quitBtn"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="overPanel" class="screen hidden">
  <div id="overTitle"></div>
  <div id="finalScoreLine"></div>
  <div id="finalDetail"></div>
  <div id="saveRow">
    <input id="nameInput" maxlength="14" autocomplete="off">
    <button class="bigbtn" id="submitBtn" style="font-size:17px;padding:10px 26px"></button>
  </div>
  <div id="savedLine"></div>
  <div class="rowbtns">
    <button class="bigbtn" id="againBtn"></button>
    <button class="smallbtn" id="menuBtn"></button>
  </div>
</div>

it:{tag:"Runner infinito 3D — insegui il raggio di luna e sfonda il loop gigante!",play:"▶ GIOCA",how:"COME SI GIOCA",board:"🏆 CLASSIFICA",howTitle:"Come si gioca",howBody:"<b>Joystick (in basso a sinistra): spingi ◀ ▶</b> per schivare gli ostacoli.<br><b>Spingi lo stick in su</b> per saltare · <b>in giù</b> per rotolare sotto le barriere. Anche i pulsanti ▲ ▼ funzionano.<br>Desktop: frecce o WASD.<br>Raccogli <b>monete mezzaluna LUNC</b> e rare <b>stelle USTC</b> blu.<br>Se vieni colpito, le monete si spargono — riprendile in fretta!<br>Ogni corsa finisce al <b>LOOP GIGANTE</b> — entra a tutta velocità e attraversalo in forma di palla!",close:"CHIUDI",allTime:"Sempre",week:"Questa settimana",loading:"Caricamento…",noScores:"Nessun punteggio — sii il primo!",score:"PUNTI",zone1:"Centro Rosso",zone2:"Canyon Veloce",zone3:"Tundra al Neon",go:"VIA!",zoneClear:"ZONA COMPLETATA!",timeBonus:"Bonus tempo",finish:"🏁 CE L'HAI FATTA!",over:"PARTITA FINITA",finalScore:"Punteggio finale",submit:"SALVA",saved:"Salvato!",rank:"Sei il n. {n} di sempre!",namePh:"Il tuo nome",again:"GIOCA ANCORA",menu:"MENU",paused:"PAUSA",resume:"RIPRENDI",quit:"ESCI AL MENU",coinsWord:"monete",starsWord:"stelle",controls:"Comandi",stick:"Joystick",pad:"Pulsanti",distWord:"Distanza",swipeHint:"Joystick: spingi ◀ ▶ per sterzare — su salta, giù rotola!"},

ru:{tag:"3D-бесконечный раннер — мчись за лунным лучом и врывайся в гигантскую петлю!",play:"▶ ИГРАТЬ",how:"КАК ИГРАТЬ",board:"🏆 РЕЙТИНГ",howTitle:"Как играть",howBody:"<b>Джойстик (слева внизу): веди ◀ ▶</b>, чтобы объезжать препятствия.<br><b>Джойстик вверх</b> — прыжок · <b>вниз</b> — перекат под барьерами. Кнопки ▲ ▼ тоже работают.<br>На компьютере: стрелки или WASD.<br>Собирай <b>монеты-полумесяцы LUNC</b> и редкие синие <b>звёзды USTC</b>.<br>При ударе монеты разлетаются — собери их обратно как можно быстрее!<br>Каждый забег заканчивается у <b>ГИГАНТСКОЙ ПЕТЛИ</b> — входи на полной скорости и проходи её в форме шара!",close:"ЗАКРЫТЬ",allTime:"За всё время",week:"Эта неделя",loading:"Загрузка…",noScores:"Пока нет результатов — стань первым!",score:"ОЧКИ",zone1:"Красный Центр",zone2:"Каньонный Рывок",zone3:"Неоновая Тундра",go:"ВПЕРЁД!",zoneClear:"ЗОНА ПРОЙДЕНА!",timeBonus:"Бонус за время",finish:"🏁 ТЫ СДЕЛАЛ ЭТО!",over:"ИГРА ОКОНЧЕНА",finalScore:"Итоговые очки",submit:"СОХРАНИТЬ",saved:"Сохранено!",rank:"Ты №{n} за всё время!",namePh:"Твоё имя",again:"ЕЩЁ РАЗ",menu:"МЕНЮ",paused:"ПАУЗА",resume:"ДАЛЬШЕ",quit:"В МЕНЮ",coinsWord:"монет",starsWord:"звёзд",controls:"Управление",stick:"Джойстик",pad:"Кнопки",distWord:"Дистанция",swipeHint:"Джойстик: веди ◀ ▶ — вверх прыжок, вниз перекат!"},
