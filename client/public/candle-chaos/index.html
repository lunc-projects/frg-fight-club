<!-- HUD -->

    <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="banner"><div id="bannerMain"></div><div id="bannerSub"></div></div>
  <div id="deathFlash"></div>
</div>

<!-- Touch: JUMP stays as the big gold button; steering is the joystick. -->
<div id="touchUI" class="hidden">
  <button id="btnJump">JUMP</button>
</div>
<div id="stickDock" class="hidden">
  <div id="stickBase"><div id="stickKnob">☾</div></div>
</div>

<!-- MENU -->
<div id="menu" class="screen">

  <div class="logo">CANDLE<br><span class="chaos">CHAOS</span></div>
  <div class="studio">LUNC DEV STUDIO · LUNA CLASSIC</div>
  <div id="menuTag"></div>
  <button class="bigbtn" id="playBtn"></button>
  <div class="rowbtns">
    <button class="smallbtn" id="howBtn"></button>
    <button class="smallbtn" id="boardBtn"></button>
  </div>
  <select id="langSel" aria-label="Language"></select>
  <div id="secStrip"></div>
</div>

<!-- HOW TO -->
<div id="howPanel" class="screen hidden">
  <div class="panel">
    <h2 id="howTitle"></h2>
    <div class="body" id="howBody"></div>
    <div class="center"><button class="smallbtn" id="howClose"></button></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="boardPanel" class="screen hidden">
  <div class="panel">
    <h2 id="boardTitle"></h2>
    <div class="tabs">
      <button class="tab on" id="tabAll"></button>
      <button class="tab" id="tabWeek"></button>
    </div>
    <div id="boardBody"></div>
    <div class="center"><button class="smallbtn" id="boardClose"></button></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pausePanel" class="screen hidden">
  <div class="panel" style="text-align:center">
    <h2 id="pauseTitle"></h2>
    <div class="center">
      <button class="bigbtn" id="resumeBtn"></button><br>
      <button class="smallbtn" id="quitBtn"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="overPanel" class="screen hidden">
  <div id="overTitle"></div>
  <div id="finalScoreLine"></div>
  <div id="finalDetail"></div>
  <div id="saveRow">
    <input id="nameInput" maxlength="14" autocomplete="off">
    <button class="bigbtn" id="submitBtn" style="font-size:17px;padding:10px 26px"></button>
  </div>
  <div id="savedLine"></div>
  <div class="rowbtns">
    <button class="bigbtn" id="againBtn"></button>
    <button class="smallbtn" id="menuBtn"></button>
  </div>
</div>

<div id="loading"><div class="moonIco">🌙</div><div class="lt">CANDLE CHAOS</div><div id="loadBar"><div id="loadFill"></div></div></div>
<div id="qaState"></div>
<div id="loadErr" class="hidden">⚠️ The game could not load. Check your connection and refresh.</div>
<script>
setTimeout(function () {
  if (!window.__ccBooted) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loadErr').classList.remove('hidden');
  }
}, 45000);
</script>

pt:"<b><span style='color:#3dff7c'>Vela VERDE = seguro.</span> <span style='color:#ff4757'>Vela VERMELHA = morte!</span></b><br>Guie com o <b>joystick</b> (canto inferior esquerdo), setas ou WASD. O botão <b>PULAR</b> (ou ESPAÇO) vence vãos e velas altas.<br>O caminho é um gráfico vivo — sobe e desce como um preço. As velas atrás de você <b>racham e caem</b>, continue!<br>Pegue <b>ingressos Luna Classic</b> (+50) e <b>estrelas USTC</b> (+150). Encadeie pousos verdes para um <b>bônus de sequência</b>.",

de:"<b><span style='color:#3dff7c'>GRÜNE Kerze = sicher.</span> <span style='color:#ff4757'>ROTE Kerze = Tod!</span></b><br>Steuere mit dem <b>Joystick</b> (unten links), Pfeiltasten oder WASD. Die <b>SPRINGEN</b>-Taste (oder LEERTASTE) überwindet Lücken und hohe Kerzen.<br>Der Weg ist ein lebender Chart — er steigt und fällt wie ein Kurs. Kerzen hinter dir <b>brechen und fallen weg</b> — bleib in Bewegung!<br>Sammle <b>Luna-Classic-Tickets</b> (+50) und <b>USTC-Sterne</b> (+150). Verkette grüne Landungen für einen <b>Serienbonus</b>.",
it:"<b><span style='color:#3dff7c'>Candela VERDE = sicuro.</span> <span style='color:#ff4757'>Candela ROSSA = morte!</span></b><br>Guida con il <b>joystick</b> (in basso a sinistra), frecce o WASD. Il pulsante <b>SALTA</b> (o SPAZIO) supera vuoti e candele alte.<br>Il percorso è un grafico vivo — sale e scende come un prezzo. Le candele dietro di te <b>si crepano e cadono</b>, continua a muoverti!<br>Raccogli <b>biglietti Luna Classic</b> (+50) e <b>stelle USTC</b> (+150). Concatena atterraggi verdi per un <b>bonus serie</b>.",
nl:"<b><span style='color:#3dff7c'>GROENE kaars = veilig.</span> <span style='color:#ff4757'>RODE kaars = dood!</span></b><br>Stuur met de <b>joystick</b> (linksonder), pijltjestoetsen of WASD. De <b>SPRING</b>-knop (of SPATIE) overbrugt gaten en hoge kaarsen.<br>Het pad is een levende grafiek — het stijgt en daalt als een koers. Kaarsen achter je <b>barsten en vallen weg</b>, blijf bewegen!<br>Pak <b>Luna Classic-tickets</b> (+50) en <b>USTC-sterren</b> (+150). Keten groene landingen voor een <b>reeksbonus</b>.",
ru:"<b><span style='color:#3dff7c'>ЗЕЛЁНАЯ свеча = безопасно.</span> <span style='color:#ff4757'>КРАСНАЯ свеча = смерть!</span></b><br>Управляй <b>джойстиком</b> (слева внизу), стрелками или WASD. Кнопка <b>ПРЫЖОК</b> (или ПРОБЕЛ) преодолевает разрывы и высокие свечи.<br>Путь — живой график: он растёт и падает как цена. Свечи позади <b>трескаются и падают</b> — не останавливайся!<br>Собирай <b>билеты Luna Classic</b> (+50) и <b>звёзды USTC</b> (+150). Соединяй зелёные приземления в <b>бонус серии</b>.",
uk:"<b><span style='color:#3dff7c'>ЗЕЛЕНА свічка = безпечно.</span> <span style='color:#ff4757'>ЧЕРВОНА свічка = смерть!</span></b><br>Керуй <b>джойстиком</b> (зліва внизу), стрілками або WASD. Кнопка <b>СТРИБОК</b> (або ПРОБІЛ) долає розриви й високі свічки.<br>Шлях — живий графік: він росте й падає як ціна. Свічки позаду <b>тріскаються й падають</b> — не зупиняйся!<br>Збирай <b>квитки Luna Classic</b> (+50) і <b>зірки USTC</b> (+150). Ланцюж зелені приземлення у <b>бонус серії</b>.",
tr:"<b><span style='color:#3dff7c'>YEŞİL mum = güvenli.</span> <span style='color:#ff4757'>KIRMIZI mum = ölüm!</span></b><br><b>Joystick</b> (sol altta), ok tuşları veya WASD ile yön ver. <b>ZIPLA</b> düğmesi (veya BOŞLUK) boşlukları ve yüksek mumları aşar.<br>Yol canlı bir grafiktir — fiyat gibi yükselir ve düşer. Arkandaki mumlar <b>çatlayıp düşer</b>, hareket etmeye devam et!<br><b>Luna Classic biletleri</b> (+50) ve <b>USTC yıldızları</b> (+150) topla. Yeşil inişleri zincirleyip <b>seri bonusu</b> kazan.",
ar:"<b><span style='color:#3dff7c'>الشمعة الخضراء = آمن.</span> <span style='color:#ff4757'>الشمعة الحمراء = موت!</span></b><br>تحكم بـ<b>عصا التحكم</b> (أسفل اليسار) أو الأسهم أو WASD. زر <b>القفز</b> (أو المسافة) يتجاوز الفجوات والشموع العالية.<br>المسار مخطط حي — يصعد ويهبط كالسعر. الشموع خلفك <b>تتشقق وتسقط</b>، فاستمر في الحركة!<br>اجمع <b>تذاكر Luna Classic</b> (+50) و<b>نجوم USTC</b> (+150). سلسِل الهبوطات الخضراء للحصول على <b>مكافأة السلسلة</b>.",
hi:"<b><span style='color:#3dff7c'>हरी मोमबत्ती = सुरक्षित।</span> <span style='color:#ff4757'>लाल मोमबत्ती = मौत!</span></b><br><b>जॉयस्टिक</b> (नीचे बाएँ), एरो की या WASD से चलाओ। <b>कूद</b> बटन (या SPACE) खाली जगहों और ऊँची मोमबत्तियों को पार करता है।<br>रास्ता एक जीवंत चार्ट है — कीमत की तरह ऊपर-नीचे होता है। पीछे की मोमबत्तियाँ <b>दरककर गिर जाती हैं</b>, चलते रहो!<br><b>Luna Classic टिकट</b> (+50) और <b>USTC सितारे</b> (+150) बटोरो। हरी लैंडिंग की शृंखला से <b>स्ट्रीक बोनस</b> पाओ।",
id:"<b><span style='color:#3dff7c'>Lilin HIJAU = aman.</span> <span style='color:#ff4757'>Lilin MERAH = mati!</span></b><br>Kendalikan dengan <b>joystick</b> (kiri bawah), tombol panah atau WASD. Tombol <b>LOMPAT</b> (atau SPASI) melewati celah dan lilin tinggi.<br>Jalur ini grafik yang hidup — naik turun seperti harga. Lilin di belakangmu <b>retak dan jatuh</b>, teruslah bergerak!<br>Kumpulkan <b>tiket Luna Classic</b> (+50) dan <b>bintang USTC</b> (+150). Rangkaikan pendaratan hijau untuk <b>bonus beruntun</b>.",
vi:"<b><span style='color:#3dff7c'>Nến XANH = an toàn.</span> <span style='color:#ff4757'>Nến ĐỎ = chết!</span></b><br>Điều khiển bằng <b>cần điều khiển</b> (góc trái dưới), phím mũi tên hoặc WASD. Nút <b>NHẢY</b> (hoặc SPACE) vượt qua khoảng trống và nến cao.<br>Đường đi là một biểu đồ sống — lên xuống như giá. Nến phía sau bạn <b>nứt và rơi xuống</b>, hãy tiếp tục di chuyển!<br>Nhặt <b>vé Luna Classic</b> (+50) và <b>sao USTC</b> (+150). Chuỗi hạ cánh xanh để nhận <b>thưởng chuỗi</b>.",
th:"<b><span style='color:#3dff7c'>เทียนเขียว = ปลอดภัย</span> <span style='color:#ff4757'>เทียนแดง = ตาย!</span></b><br>บังคับด้วย<b>จอยสติ๊ก</b> (ซ้ายล่าง) ปุ่มลูกศร หรือ WASD ปุ่ม<b>กระโดด</b> (หรือ SPACE) ข้ามช่องว่างและเทียนสูงได้<br>เส้นทางคือกราฟที่มีชีวิต — ขึ้นลงเหมือนราคา เทียนข้างหลังจะ<b>แตกและร่วงลง</b> อย่าหยุดเคลื่อนที่!<br>เก็บ<b>ตั๋ว Luna Classic</b> (+50) และ<b>ดาว USTC</b> (+150) ต่อการลงเทียนเขียวเพื่อ<b>โบนัสต่อเนื่อง</b>",
ko:"<b><span style='color:#3dff7c'>초록 캔들 = 안전.</span> <span style='color:#ff4757'>빨간 캔들 = 죽음!</span></b><br><b>조이스틱</b>(왼쪽 아래), 방향키 또는 WASD로 조종하세요. <b>점프</b> 버튼(또는 스페이스)으로 틈과 높은 캔들을 넘습니다.<br>길은 살아있는 차트 — 가격처럼 오르내립니다. 뒤의 캔들은 <b>금이 가고 떨어지니</b> 계속 움직이세요!<br><b>Luna Classic 티켓</b>(+50)과 <b>USTC 별</b>(+150)을 모으세요. 초록 착지를 이어 <b>연속 보너스</b>를 받으세요.",
ja:"<b><span style='color:#3dff7c'>緑のローソク＝安全。</span> <span style='color:#ff4757'>赤のローソク＝死！</span></b><br><b>ジョイスティック</b>（左下）、矢印キーまたはWASDで操作。<b>ジャンプ</b>ボタン（またはスペース）で隙間や高いローソクを越えます。<br>道は生きているチャート — 価格のように上下します。後ろのローソクは<b>ひび割れて落ちていく</b>ので、止まらないで！<br><b>Luna Classicチケット</b>（+50）と<b>USTCスター</b>（+150）を集めよう。緑の着地をつなげて<b>連続ボーナス</b>。",
zh:"<b><span style='color:#3dff7c'>绿蜡烛 = 安全。</span> <span style='color:#ff4757'>红蜡烛 = 死亡！</span></b><br>用<b>摇杆</b>（左下）、方向键或 WASD 操控。<b>跳跃</b>按钮（或空格）可越过空隙和高蜡烛。<br>这条路是活的图表 — 像价格一样涨跌。你身后的蜡烛会<b>开裂坠落</b>，千万别停！<br>收集 <b>Luna Classic 门票</b>（+50）和 <b>USTC 星星</b>（+150）。连续落在绿蜡烛上可获得<b>连击奖励</b>。"};
