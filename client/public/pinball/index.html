<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Luna Pinball — LUNC Dev Studio Arcade</title>
<meta name="description" content="Luna Pinball: a packed Luna Classic space pinball machine. Insert coin (it's pretend — free play), pull the plunger, light the lanes, lock balls in the Moon saucer and start MULTIBALL.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --gold:#f5c542; --gold2:#ffdf7e; --ink:#0b1026; --panel:#131a3a; --panel2:#0e1430;
    --teal:#37e0c8; --red:#ff5470; --txt:#eef1ff; --dim:#9aa5d8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#05070f;color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
  body{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#101736 0%,#05070f 55%,#02030a 100%);padding:10px 8px 26px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body.playing{overflow:hidden;position:fixed;inset:0;width:100%;height:100dvh;padding:0}
  body.playing .wrap{height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:4px 0}
  body.playing .topbar{margin-bottom:2px}
  .wrap{max-width:452px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px}
  .topbar .brand{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--gold);text-transform:uppercase}
  .topbar .brand small{display:block;color:var(--dim);letter-spacing:.08em;font-weight:600;font-size:10px}
  .tools{display:flex;gap:6px;align-items:center}
  .tools select{background:var(--panel);color:var(--txt);border:1px solid #2b3768;border-radius:9px;padding:7px 6px;font-size:13px;max-width:128px}
  .iconbtn{background:var(--panel);border:1px solid #2b3768;color:var(--txt);border-radius:9px;padding:7px 10px;font-size:15px;cursor:pointer}
  .iconbtn:active{transform:scale(.95)}

  /* ============ THE MACHINE ============ */
  .machine{background:linear-gradient(180deg,#1a1030 0%,#120a24 100%);border-radius:22px;padding:10px 10px 12px;box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid #2c1e52;transform-origin:50% 0;transform:perspective(1150px) rotateX(2.2deg)}
  /* Backbox */
  .backbox{background:linear-gradient(180deg,#241645,#170d33);border:2px solid #3a2766;border-radius:14px;padding:9px 10px 10px;box-shadow:inset 0 0 24px rgba(0,0,0,.55);position:relative;overflow:hidden}
  .backbox::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
  .marquee{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:7px}
  .marquee .moon{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 0 7px rgba(245,197,66,.65))}
  .marquee h1{font-size:25px;letter-spacing:.12em;font-weight:900;color:var(--gold2);text-shadow:0 0 14px rgba(245,197,66,.55),0 2px 0 #7a4d00;font-style:italic;white-space:nowrap}
  .marquee .star{color:var(--teal);font-size:17px;text-shadow:0 0 9px rgba(55,224,200,.8)}
  .dmdrow{display:flex;gap:8px;align-items:stretch}
  .speaker{flex:0 0 34px;border-radius:7px;background:#0a0618 radial-gradient(circle,#2c2050 1.6px,transparent 1.8px) 0 0/7px 7px;box-shadow:inset 0 0 8px #000}
  #dmd{flex:1 1 auto;width:100%;height:74px;display:block;background:#180a02;border-radius:7px;box-shadow:inset 0 0 18px #000,inset 0 0 4px #000;border:1px solid #3a1c05}
  /* Cabinet + playfield */
  .cab{display:flex;margin-top:10px}
  .rail{flex:0 0 15px;border-radius:8px;background:linear-gradient(90deg,#4a2c14,#7a4d22 45%,#3a2110);box-shadow:inset 0 0 6px rgba(0,0,0,.7);position:relative}
  .rail::before{content:"";position:absolute;left:3px;right:3px;top:10px;bottom:10px;border-radius:5px;background:linear-gradient(90deg,#20242e,#596270 50%,#1b1f28);opacity:.85}
  .pfbox{flex:1 1 auto;position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px #060812,0 0 34px rgba(30,60,180,.25);background:#070b22}
  #game{display:block;width:100%;height:auto;touch-action:none}
  /* Flipper + nudge cabinet buttons */
  .ctrl{position:relative;height:0}
  .fbtn{position:absolute;top:-64px;width:86px;height:86px;border-radius:50%;border:2px solid rgba(245,197,66,.55);background:radial-gradient(circle at 35% 30%,rgba(255,223,126,.28),rgba(20,16,48,.55) 65%);color:var(--gold2);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;z-index:6;backdrop-filter:blur(1px)}
  .fbtn.on{background:radial-gradient(circle at 35% 30%,rgba(255,223,126,.65),rgba(90,60,0,.6) 70%);transform:scale(.94)}
  #flipL{left:6px}#flipR{right:6px}
  .nbtn{position:absolute;top:-392px;width:40px;padding:9px 0;border-radius:9px;border:1px solid #2b3768;background:rgba(14,20,48,.82);color:var(--dim);font-size:9px;font-weight:800;letter-spacing:.06em;writing-mode:vertical-rl;text-align:center;cursor:pointer;z-index:6;touch-action:none}
  #nudgeL{left:2px}#nudgeR{right:2px;transform:rotate(180deg)}
  #plungeZone{position:absolute;right:0;top:0;width:64px;height:100%;z-index:5;border-radius:10px 0 0 10px;background:linear-gradient(180deg,rgba(245,197,66,.05),rgba(245,197,66,.16));border-left:2px dashed rgba(245,197,66,.45);color:rgba(245,197,66,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  #plungeZone.hide{display:none}
  #launchBtn{margin-top:9px;width:100%;border:none;border-radius:11px;padding:15px 8px;font-size:17px;font-weight:900;letter-spacing:.06em;cursor:pointer;color:#2a1400;background:linear-gradient(180deg,#ffd76e,#f5a623 55%,#d97c06);box-shadow:0 5px 0 #8a4d02,0 8px 18px rgba(0,0,0,.5);text-transform:uppercase;touch-action:none;display:none}
  #launchBtn.show{display:block}
  #launchBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4d02}
  #plungeZone b{font-size:15px;line-height:1}
  #plungeZone span{font-size:8px;font-weight:800;letter-spacing:.14em}
  .nbtn.on{background:#5a1030;color:#ffb3c2}
  /* Coin door */
  .coindoor{margin-top:12px;background:linear-gradient(180deg,#23262e,#14161c);border:2px solid #3c414d;border-radius:12px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -8px 18px rgba(0,0,0,.5)}
  .cdrow{display:flex;align-items:center;gap:10px}
  .slotplate{flex:0 0 auto;background:linear-gradient(180deg,#31353f,#1d2026);border:1px solid #4a505c;border-radius:9px;padding:7px 9px;text-align:center}
  .slot{width:7px;height:30px;margin:0 auto 4px;background:#05060a;border-radius:3px;box-shadow:inset 0 0 4px #000,0 0 0 2px #585f6c}
  .slotplate span{font-size:8.5px;letter-spacing:.1em;color:#c8cdd8;font-weight:700}
  .creditbox{flex:1 1 auto;text-align:center}
  .creditbox .lbl{font-size:9.5px;letter-spacing:.22em;color:#8f96a8;font-weight:800}
  .creditbox .num{font-family:'Courier New',monospace;font-size:26px;font-weight:900;color:#ff5d47;text-shadow:0 0 10px rgba(255,60,30,.75);line-height:1.05}
  .cdbtns{display:flex;gap:8px;margin-top:9px}
  .bigbtn{flex:1;border:none;border-radius:11px;padding:13px 8px;font-size:16px;font-weight:900;letter-spacing:.05em;cursor:pointer;color:#231600;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d99a17);box-shadow:0 5px 0 #8a5f06,0 8px 18px rgba(0,0,0,.5);text-transform:uppercase}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5f06}
  .bigbtn:disabled{filter:grayscale(.8) brightness(.6);box-shadow:0 3px 0 #444;cursor:not-allowed}
  .bigbtn.coin{background:linear-gradient(180deg,#ffe9a8,#ffc933 55%,#e0a50e)}
  .bigbtn.start{background:linear-gradient(180deg,#8dffb0,#2fe07a 55%,#12a24b);color:#03240f;box-shadow:0 5px 0 #0a6e33,0 8px 18px rgba(0,0,0,.5)}
  .bigbtn.start:disabled{box-shadow:0 3px 0 #444}
  .bigbtn.pulse{animation:pulse .8s infinite alternate}
  @keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
  .cdnote{text-align:center;margin-top:7px;font-size:11px;color:#9aa0b4}
  /* Overlays */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;background:rgba(4,6,20,.86);backdrop-filter:blur(2.5px);z-index:8;padding:18px 16px;text-align:center;overflow-y:auto}
  .screen.show{display:flex}
  .screen h2{font-size:27px;letter-spacing:.06em;color:var(--gold2);text-shadow:0 0 16px rgba(245,197,66,.5)}
  .screen h3{font-size:20px;color:var(--gold2)}
  .screen p{font-size:14px;line-height:1.5;color:var(--txt);max-width:330px}
  .screen .tag{color:var(--dim);font-size:13.5px}
  .play{border:none;border-radius:11px;padding:13px 22px;font-size:16.5px;font-weight:900;letter-spacing:.04em;cursor:pointer;color:#231600;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d99a17);box-shadow:0 4px 0 #8a5f06;text-transform:uppercase;min-width:210px}
  .play:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5f06}
  .play.alt{background:linear-gradient(180deg,#2a3565,#1b2450);color:var(--txt);box-shadow:0 4px 0 #0c1130;border:1px solid #3a4a8a}
  .play.small{min-width:0;padding:9px 15px;font-size:13.5px}
  .play:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
  .howbody{text-align:left;font-size:13.5px;line-height:1.55;max-width:340px;color:var(--txt)}
  .howbody b{color:var(--gold2)}
  .missiongrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:340px;width:100%}
  .missiongrid div{background:rgba(23,30,66,.9);border:1px solid #2b3768;border-radius:9px;padding:7px 9px;font-size:12px;text-align:left}
  .missiongrid b{color:var(--teal);display:block;font-size:12.5px;letter-spacing:.04em}
  #nameInput{background:#0a0f2c;border:1.5px solid #3a4a8a;border-radius:10px;color:var(--txt);font-size:17px;padding:11px 13px;text-align:center;width:230px;font-weight:700}
  #nameInput:focus{outline:none;border-color:var(--gold)}
  .boardlist{width:100%;max-width:340px;max-height:300px;overflow-y:auto}
  .boardlist .row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(90,110,200,.16);font-size:15px}
  .boardlist .rk{color:var(--gold);font-weight:900;width:30px;text-align:right}
  .boardlist .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .boardlist .sc{font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:7px}
  .statusline{font-size:13px;color:var(--teal);min-height:17px;font-weight:700}
  .finalscore{font-size:41px;font-weight:900;color:var(--gold2);text-shadow:0 0 18px rgba(245,197,66,.5);font-variant-numeric:tabular-nums;line-height:1}
  .statsline{font-size:13px;color:var(--dim)}
  /* Strips + footer */
  .strip{margin-top:12px;background:linear-gradient(90deg,rgba(20,60,44,.85),rgba(13,40,30,.85));border:1px solid #1f7a4d;border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.45;text-align:center;color:#c9f5dd}
  .strip b{color:#7dffb0}
  .hintline{text-align:center;color:var(--dim);font-size:12px;margin-top:9px;line-height:1.5}
  .foot{text-align:center;color:#5d6794;font-size:11px;margin-top:12px;letter-spacing:.06em}
  .foot b{color:#8b96c4}
  @media (max-width:380px){ .marquee h1{font-size:21px} .fbtn{width:74px;height:74px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">LUNC Dev Studio<small>Arcade · Luna Classic</small></div>
    <div class="tools">
      <select id="langSel" aria-label="Language"></select>
      <button class="iconbtn" id="muteBtn" aria-label="Sound">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </div>

  <div class="machine">
    <div class="backbox">
      <div class="marquee">
        <svg class="moon" viewBox="0 0 40 40" aria-hidden="true"><path d="M26.5 3.5A15.5 15.5 0 1 0 36.5 24 12.3 12.3 0 0 1 26.5 3.5Z" fill="#f5c542" stroke="#ffdf7e" stroke-width="1.6"/></svg>
        <h1>LUNA PINBALL</h1>
        <span class="star">★</span>
      </div>
      <div class="dmdrow">
        <div class="speaker"></div>
        <canvas id="dmd" width="472" height="74"></canvas>
        <div class="speaker"></div>
      </div>
    </div>

    <div class="cab">
      <div class="rail"></div>
      <div class="pfbox">
        <canvas id="game" width="420" height="780"></canvas>
        <div id="plungeZone" aria-label="Plunger — pull down and release"><b>▼</b><b>▼</b><span>PULL</span></div>

        <div class="screen show" id="menuScreen">
          <h2>🌙 LUNA PINBALL</h2>
          <p class="tag" data-i18n="tag"></p>
          <div class="missiongrid">
            <div><b>🛰 ORBIT</b><span data-i18n="mOrbit"></span></div>
            <div><b>🌕 MOON LOCK</b><span data-i18n="mMoon"></span></div>
            <div><b>🌙 LUNC</b><span data-i18n="mLunc"></span></div>
            <div><b>★ USTC</b><span data-i18n="mUstc"></span></div>
          </div>
          <button class="play alt" id="howBtn" data-i18n="howBtn"></button>
          <button class="play alt" id="boardBtn" data-i18n="boardBtn"></button>
          <p class="tag" data-i18n="menuHint"></p>
        </div>

        <div class="screen" id="howScreen">
          <h3 data-i18n="howTitle"></h3>
          <div class="howbody" data-i18n-html="howBody"></div>
          <button class="play small" id="howClose" data-i18n="close"></button>
        </div>

        <div class="screen" id="boardScreen">
          <h3 data-i18n="boardTitle"></h3>
          <div class="tabs">
            <button class="play small" id="tabAll" data-i18n="allTime"></button>
            <button class="play small alt" id="tabWeek" data-i18n="week"></button>
          </div>
          <div class="boardlist" id="boardList"></div>
          <button class="play small" id="boardClose" data-i18n="close"></button>
        </div>

        <div class="screen" id="overScreen">
          <h2 data-i18n="gameOver"></h2>
          <div class="finalscore" id="finalScore">0</div>
          <div class="statsline" id="overStats"></div>
          <input id="nameInput" maxlength="16" autocomplete="off" data-i18n-ph="namePh">
          <button class="play" id="submitBtn" data-i18n="submitBtn"></button>
          <div class="statusline" id="submitStatus"></div>
          <button class="play alt" id="overBoardBtn" data-i18n="boardBtn"></button>
          <button class="play alt" id="againBtn" data-i18n="againBtn"></button>
        </div>

        <div class="screen" id="pauseScreen">
          <h2 data-i18n="paused"></h2>
          <button class="play" id="resumeBtn" data-i18n="resumeBtn"></button>
          <button class="play alt" id="quitBtn" data-i18n="quitBtn"></button>
        </div>
      </div>
      <div class="rail"></div>
    </div>

    <div class="ctrl">
      <button class="fbtn" id="flipL" aria-label="Left flipper">◀</button>
      <button class="fbtn" id="flipR" aria-label="Right flipper">▶</button>
      <button class="nbtn" id="nudgeL">NUDGE</button>
      <button class="nbtn" id="nudgeR">NUDGE</button>
    </div>

    <div class="coindoor">
      <div class="cdrow">
        <div class="slotplate"><div class="slot"></div><span>25¢ · FREE</span></div>
        <div class="creditbox">
          <div class="lbl" data-i18n="creditsLbl"></div>
          <div class="num" id="creditNum">0</div>
        </div>
        <div class="slotplate"><div class="slot"></div><span>25¢ · FREE</span></div>
      </div>
      <div class="cdbtns">
        <button class="bigbtn coin" id="coinBtn">🪙 <span data-i18n="insertCoin"></span></button>
        <button class="bigbtn start" id="startBtn" disabled>▶ <span data-i18n="startBtn"></span></button>
      </div>
      <button id="launchBtn" aria-label="Launch ball — hold to charge, release to fire">🚀 <span data-i18n="launchBtn"></span></button>
      <div class="cdnote" data-i18n="coinNote"></div>
    </div>
  </div>

  <div class="strip" data-i18n-html="securityStrip"></div>
  <div class="hintline" data-i18n="flipHint"></div>
  <div class="foot"><b>LUNA PINBALL</b> · LUNC DEV STUDIO · LUNA CLASSIC</div>
</div>

<script>
"use strict";
/* ================= I18N ================= */
const LANGS = [["en","English"],["es","Español"],["pt","Português"],["fr","Français"],["de","Deutsch"],["it","Italiano"],["nl","Nederlands"],["ru","Русский"],["uk","Українська"],["tr","Türkçe"],["ar","العربية"],["hi","हिन्दी"],["id","Bahasa Indonesia"],["vi","Tiếng Việt"],["th","ไทย"],["ko","한국어"],["ja","日本語"],["zh","简体中文"]];
const I18N = {
en:{tag:"A real arcade pinball machine, Luna Classic style — packed playfield, wire ramps, a Moon saucer, missions and MULTIBALL.",insertCoin:"INSERT COIN",startBtn:"START",launchBtn:"LAUNCH — hold, release to fire",creditsLbl:"CREDITS",coinNote:"The coin is pretend — free play, no payment, ever.",menuHint:"Insert a coin below, then press START. Pull the plunger to launch!",howBtn:"HOW TO PLAY",boardBtn:"🏆 LEADERBOARD",boardTitle:"🏆 LEADERBOARD",howTitle:"How to play",close:"CLOSE",allTime:"All time",week:"This week",loading:"Loading…",noScores:"No scores yet — be the first!",boardOff:"Board unavailable right now — play on!",gameOver:"GAME OVER",finalScore:"Final score",submitBtn:"SAVE SCORE",saved:"Saved!",savedRank:"🏆 You're #{n} all-time!",saveFail:"Could not save — try again.",namePh:"Your name",againBtn:"INSERT COIN AGAIN",paused:"PAUSED",resumeBtn:"RESUME",quitBtn:"QUIT TO MENU",bestDevice:"Best on this device: {n}",overStats:"Top multiplier ×{m} · Missions done: {k}",mOrbit:"Light L-U-N lanes up top (flippers change the lit lane). Orbit shots pay ×5 for 30s!",mMoon:"Shoot the Moon saucer to lock balls. Lock 3 → MULTIBALL with jackpots!",mLunc:"Knock down all 4 LUNC targets to raise your bonus multiplier.",mUstc:"Hit all 3 USTC star targets to light an extra BALL SAVE.",howBody:"<b>🪙 INSERT COIN</b> (pretend coin — free), then <b>START</b>.<br><b>Plunger:</b> hold &amp; release the gold spring on the right of the shooter lane — or hold <b>SPACE</b>. Medium power into the flashing lane = <b>SKILL SHOT</b>.<br><b>Flippers:</b> tap/hold the big ◀ ▶ buttons, touch the lower playfield halves, or use <b>Z</b> and <b>/</b> keys. Flippers also change the lit top lane.<br><b>Nudge:</b> NUDGE buttons or <b>Shift</b> keys — but 3 warnings = <b>TILT</b> and you lose the ball's bonus!<br><b>Missions:</b> ORBIT (light L-U-N), MOON LOCK ×3 = MULTIBALL, LUNC targets raise the multiplier, USTC stars light a ball save. The first seconds of every ball are protected by BALL SAVE.<br>3 balls per game. Good luck, captain!",securityStrip:"🔒 <b>Security:</b> this game is 100% FREE and never asks you to connect a wallet or sign anything. The coin is pretend. Any page that asks you to connect or sign is a <b>fake</b>.",flipHint:"Flippers: ◀ ▶ buttons or Z / keys · Plunger: hold & release the spring or SPACE · Nudge: side buttons or Shift",dmInsert:"INSERT COIN",dmStart:"PRESS START",dmBall:"BALL {n}",dmSkill:"SKILL SHOT!",dmSaved:"BALL SAVED",dmTilt:"TILT!",dmWarn:"WARNING!",dmMulti:"MULTIBALL!",dmLock:"BALL {n} LOCKED",dmLockLit:"LOCK IS LIT",dmOrbit:"ORBIT MODE!",dmJack:"JACKPOT!",dmSuper:"SUPER JACKPOT!",dmBonus:"BONUS",dmGOver:"GAME OVER",dmMoon:"MOON MASTER!",dmCombo:"MISSION DONE!",dmShoot:"SHOOT AGAIN",dmCredit:"CREDIT {n}"},

T (enciende L-U-N), BLOQUEO LUNAR ×3 = MULTIBOLA, los LUNC suben el multiplicador, las estrellas USTC encienden un salvabolas. Los primeros segundos de cada bola están protegidos.<br>3 bolas por partida. ¡Suerte, capitán!",securityStrip:"🔒 <b>Seguridad:</b> este juego es 100% GRATIS y nunca te pide conectar una cartera ni firmar nada. La moneda es de mentira. Cualquier página que te pida conectar o firmar es <b>falsa</b>.",flipHint:"Flippers: botones ◀ ▶ o teclas Z / · Émbolo: mantén y suelta el resorte o ESPACIO · Empujón: botones laterales o Shift",dmInsert:"INSERTA MONEDA",dmStart:"PULSA INICIAR",dmBall:"BOLA {n}",dmSkill:"¡TIRO DE HABILIDAD!",dmSaved:"¡BOLA SALVADA!",dmTilt:"¡TILT!",dmWarn:"¡AVISO!",dmMulti:"¡MULTIBOLA!",dmLock:"BOLA {n} BLOQUEADA",dmLockLit:"BLOQUEO ACTIVO",dmOrbit:"¡MODO ÓRBITA!",dmJack:"¡JACKPOT!",dmSuper:"¡SUPER JACKPOT!",dmBonus:"BONUS",dmGOver:"FIN DEL JUEGO",dmMoon:"¡AMO LUNAR!",dmCombo:"¡MISIÓN CUMPLIDA!",dmShoot:"DISPARA OTRA VEZ",dmCredit:"CRÉDITO {n}"},

al zijn beschermd.<br>3 ballen per spel. Succes, kapitein!",securityStrip:"🔒 <b>Veiligheid:</b> dit spel is 100% GRATIS en vraagt nooit om een wallet te koppelen of iets te ondertekenen. De munt is nep. Elke pagina die vraagt om koppelen of ondertekenen is <b>nep</b>.",flipHint:"Flippers: ◀ ▶ knoppen of Z / · Plunjer: veer vasthouden & loslaten of SPATIE · Stoten: zijknoppen of Shift",dmInsert:"MUNT INWERPEN",dmStart:"DRUK OP START",dmBall:"BAL {n}",dmSkill:"SKILL SHOT!",dmSaved:"BAL GERED",dmTilt:"TILT!",dmWarn:"WAARSCHUWING!",dmMulti:"MULTIBAL!",dmLock:"BAL {n} VERGRENDELD",dmLockLit:"VERGRENDELING AAN",dmOrbit:"ORBIT-MODUS!",dmJack:"JACKPOT!",dmSuper:"SUPERJACKPOT!",dmBonus:"BONUS",dmGOver:"SPEL VOORBIJ",dmMoon:"MAANMEESTER!",dmCombo:"MISSIE VOLTOOID!",dmShoot:"SCHIET OPNIEUW",dmCredit:"CREDIT {n}"},
ru:{tag:"Настоящий аркадный пинбол в стиле Luna Classic — плотное поле, проволочные рампы, лунная капсула, миссии и МУЛЬТИШАР.",insertCoin:"ВСТАВИТЬ МОНЕТУ",startBtn:"СТАРТ",launchBtn:"LAUNCH — hold, release to fire",creditsLbl:"КРЕДИТЫ",coinNote:"Монета игрушечная — игра бесплатна, без платежей, никогда.",menuHint:"Вставь монету ниже и нажми СТАРТ. Тяни плунжер, чтобы запустить!",howBtn:"КАК ИГРАТЬ",boardBtn:"🏆 РЕЙТИНГ",boardTitle:"🏆 РЕЙТИНГ",howTitle:"Как играть",close:"ЗАКРЫТЬ",allTime:"За всё время",week:"Эта неделя",loading:"Загрузка…",noScores:"Пока нет результатов — стань первым!",boardOff:"Рейтинг недоступен — играй дальше!",gameOver:"ИГРА ОКОНЧЕНА",finalScore:"Итоговые очки",submitBtn:"СОХРАНИТЬ",saved:"Сохранено!",savedRank:"🏆 Ты №{n} за всё время!",saveFail:"Не удалось сохранить — попробуй ещё раз.",namePh:"Твоё имя",againBtn:"ЕЩЁ РАЗ ВСТАВИТЬ МОНЕТУ",paused:"ПАУЗА",resumeBtn:"ДАЛЬШЕ",quitBtn:"В МЕНЮ",bestDevice:"Рекорд на этом устройстве: {n}",overStats:"Макс. множитель ×{m} · Миссий: {k}",mOrbit:"Зажги дорожки L-U-N наверху (флипперы меняют дорожку). Орбиты платят ×5 в течение 30 с!",mMoon:"Стреляй в лунную капсулу, чтобы запирать шары. 3 запирания → МУЛЬТИШАР с джекпотами!",mLunc:"Сбей все 4 цели LUNC, чтобы поднять бонусный множитель.",mUstc:"Попади по всем 3 звёздам USTC, чтобы зажечь дополнительное СПАСЕНИЕ ШАРА.",howBody:"<b>🪙 ВСТАВИТЬ МОНЕТУ</b> (игрушечная — бесплатно), затем <b>СТАРТ</b>.<br><b>Плунжер:</b> удерживай и отпускай золотую пружину справа от дорожки — или удерживай <b>ПРОБЕЛ</b>. Средняя сила в мигающую дорожку = <b>СКИЛЛ-ШОТ</b>.<br><b>Флипперы:</b> большие кнопки ◀ ▶, касание нижних половин поля или клавиши <b>Z</b> и <b>/</b>. Они же меняют зажжённую дорожку.<br><b>Толчок:</b> кнопки NUDGE или <b>Shift</b> — но 3 предупреждения = <b>ТИЛТ</b>, и бонус шара сгорит!<br><b>Миссии:</b> ОРБИТА (зажги L-U-N), ЛУННАЯ БЛОКИРОВКА ×3 = МУЛЬТИШАР, цели LUNC повышают множитель, звёзды USTC дают спасение шара. Первые секунды каждого шара защищены.<br>3 шара на игру. Удачи, капитан!",securityStrip:"🔒 <b>Безопасность:</b> эта игра на 100% БЕСПЛАТНА и никогда не просит подключить кошелёк или что-то подписать. Монета игрушечная. Любая страница, которая просит подключить или подписать, — <b>подделка</b>.",flipHint:"Флипперы: кнопки ◀ ▶ или клавиши Z / · Плунжер: удерживай и отпускай пружину или ПРОБЕЛ · Толчок: боковые кнопки или Shift",dmInsert:"ВСТАВЬ МОНЕТУ",dmStart:"НАЖМИ СТАРТ",dmBall:"ШАР {n}",dmSkill:"СКИЛЛ-ШОТ!",dmSaved:"ШАР СПАСЁН",dmTilt:"ТИЛТ!",dmWarn:"ПРЕДУПРЕЖДЕНИЕ!",dmMulti:"МУЛЬТИШАР!",dmLock:"ШАР {n} ЗАПЕРТ",dmLockLit:"БЛОКИРОВКА ГОРИТ",dmOrbit:"РЕЖИМ ОРБИТЫ!",dmJack:"ДЖЕКПОТ!",dmSuper:"СУПЕР-ДЖЕКПОТ!",dmBonus:"БОНУС",dmGOver:"ИГРА ОКОНЧЕНА",dmMoon:"ЛУННЫЙ МАСТЕР!",dmCombo:"МИССИЯ ВЫПОЛНЕНА!",dmShoot:"СТРЕЛЯЙ ЕЩЁ",dmCredit:"КРЕДИТ {n}"},
uk:{tag:"Справжній аркадний пінбол у стилі Luna Classic — щільне поле, дротяні рампи, місячна капсула, місії та МУЛЬТИКУЛЯ.",insertCoin:"ВСТАВИТИ МОНЕТУ",startBtn:"СТАРТ",launchBtn:"LAUNCH — hold, release to fire",creditsLbl:"КРЕДИТИ",coinNote:"Монета іграшкова — гра безкоштовна, без платежів, ніколи.",menuHint:"Встав монету нижче й натисни СТАРТ. Тягни плунжер, щоб запустити!",howBtn:"ЯК ГРАТИ",boardBtn:"🏆 РЕЙТИНГ",boardTitle:"🏆 РЕЙТИНГ",howTitle:"Як грати",close:"ЗАКРИТИ",allTime:"За весь час",week:"Цей тиждень",loading:"Завантаження…",noScores:"Поки немає результатів — стань першим!",boardOff:"Рейтинг недоступний — грай далі!",gameOver:"ГРУ ЗАВЕРШЕНО",finalScore:"Підсумкові очки",submitBtn:"ЗБЕРЕГТИ",saved:"Збережено!",savedRank:"🏆 Ти №{n} за весь час!",saveFail:"Не вдалося зберегти — спробуй ще раз.",namePh:"Твоє ім'я",againBtn:"ЩЕ РАЗ ВСТАВИТИ МОНЕТУ",paused:"ПАУЗА",resumeBtn:"ДАЛІ",quitBtn:"ДО МЕНЮ",bestDevice:"Рекорд на цьому пристрої: {n}",overStats:"Макс. множник ×{m} · Місій: {k}",mOrbit:"Засвіти доріжки L-U-N угорі (фліпери міняють доріжку). Орбіти платять ×5 протягом 30 с!",mMoon:"Стріляй у місячну капсулу, щоб замикати кулі. 3 замикання → МУЛЬТИКУЛЯ з джекпотами!",mLunc:"Збий усі 4 цілі LUNC, щоб підняти бонусний множник.",mUstc:"Влуч в усі 3 зірки USTC, щоб засвітити додатковий РЯТУНОК КУЛІ.",howBody:"<b>🪙 ВСТАВИТИ МОНЕТУ</b> (іграшкова — безкоштовно), потім <b>СТАРТ</b>.<br><b>Плунжер:</b> утримуй і відпускай золоту пружину праворуч від доріжки — або утримуй <b>ПРОБІЛ</b>. Середня сила в миготливу доріжку = <b>СКІЛ-ШОТ</b>.<br><b>Фліпери:</b> великі кнопки ◀ ▶, дотик до нижніх половин поля або клавіші <b>Z</b> і <b>/</b>. Вони ж міняють засвічену доріжку.<br><b>Поштовх:</b> кнопки NUDGE або <b>Shift</b> — але 3 попередження = <b>ТИЛТ</b>, і бонус кулі згорить!<br><b>Місії:</b> ОРБІТА (засвіти L-U-N), МІСЯЧНЕ ЗАМИКАННЯ ×3 = МУЛЬТИКУЛЯ, цілі LUNC піднімають множник, зірки USTC дають рятунок кулі. Перші секунди кожної кулі захищені.<br>3 кулі на гру. Успіху, капітане!",securityStrip:"🔒 <b>Безпека:</b> ця гра на 100% БЕЗКОШТОВНА й ніколи не просить підключити гаманець чи щось підписати. Монета іграшкова. Будь-яка сторінка, що просить підключити чи підписати, — <b>підробка</b>.",flipHint:"Фліпери: кнопки ◀ ▶ або клавіші Z / · Плунжер: утримуй і відпускай пружину або ПРОБІЛ · Поштовх: бічні кнопки або Shift",dmInsert:"ВСТАВ МОНЕТУ",dmStart:"НАТИСНИ СТАРТ",dmBall:"КУЛЯ {n}",dmSkill:"СКІЛ-ШОТ!",dmSaved:"КУЛЮ ВРЯТОВАНО",dmTilt:"ТИЛТ!",dmWarn:"ПОПЕРЕДЖЕННЯ!",dmMulti:"МУЛЬТИКУЛЯ!",dmLock:"КУЛЯ {n} ЗАМКНЕНА",dmLockLit:"ЗАМОК ГОРИТЬ",dmOrbit:"РЕЖИМ ОРБІТИ!",dmJack:"ДЖЕКПОТ!",dmSuper:"СУПЕР-ДЖЕКПОТ!",dmBonus:"БОНУС",dmGOver:"ГРУ ЗАВЕРШЕНО",dmMoon:"МІСЯЧНИЙ МАЙСТЕР!",dmCombo:"МІСІЮ ВИКОНАНО!",dmShoot:"СТРІЛЯЙ ЩЕ",dmCredit:"КРЕДИТ {n}"},
tr:{tag:"Gerçek bir arcade pinball makinesi, Luna Classic tarzı — dolu saha, tel rampalar, Ay kapsülü, görevler ve MULTIBALL.",insertCoin:"JETON AT",startBtn:"BAŞLAT",launchBtn:"LAUNCH — hold, release to fire",creditsLbl:"KREDİLER",coinNote:"Jeton sahte — ücretsiz oyun, ödeme asla yok.",menuHint:"Aşağıdan jeton at ve BAŞLAT'a bas. Fırlatmak için pistonu çek!",howBtn:"NASIL OYNANIR",boardBtn:"🏆 SIRALAMA",boardTitle:"🏆 SIRALAMA",howTitle:"Nasıl oynanır",close:"KAPAT",allTime:"Tüm zamanlar",week:"Bu hafta",loading:"Yükleniyor…",noScores:"Henüz skor yok — ilk sen ol!",boardOff:"Sıralama şu an kullanılamıyor — oynamaya devam et!",gameOver:"OYUN BİTTİ",finalScore:"Final skoru",submitBtn:"KAYDET",saved:"Kaydedildi!",savedRank:"🏆 Tüm zamanlarda {n}. sıradasın!",saveFail:"Kaydedilemedi — tekrar dene.",namePh:"Adın",againBtn:"TEKRAR JETON AT",paused:"DURAKLATILDI",resumeBtn:"DEVAM",quitBtn:"MENÜYE ÇIK",bestDevice:"Bu cihazdaki en iyi: {n}",overStats:"En yüksek çarpan ×{m} · Görevler: {k}",mOrbit:"Üstteki L-U-N şeritlerini yak (flipperlar yanan şeridi değiştirir). Orbitler 30 sn boyunca ×5 öder!",mMoon:"Topları kilitlemek için Ay kapsülüne at. 3 kilit → jackpotlu MULTIBALL!",mLunc:"Bonus çarpanını artırmak için 4 LUNC hedefini de vur.",mUstc:"Ekstra TOP KURTARMA yakmak için 3 USTC yıldızını da vur.",howBody:"<b>🪙 JETON AT</b> (sahte jeton — ücretsiz), sonra <b>BAŞLAT</b>.<br><b>Piston:</b> şeridin sağındaki altın yayı basılı tutup bırak — ya da <b>BOŞLUK</b> tuşunu basılı tut. Yanıp sönen şeride orta güç = <b>SKILL SHOT</b>.<br><b>Flipperlar:</b> büyük ◀ ▶ düğmeleri, sahanın alt yarılarına dokun ya da <b>Z</b> ve <b>/</b> tuşları. Yanan şeridi de değiştirirler.<br><b>Dürtme:</b> NUDGE düğmeleri ya da <b>Shift</b> — ama 3 uyarı = <b>TILT</b> ve topun bonusu yanar!<br><b>Görevler:</b> ORBIT (L-U-N yak), AY KİLİDİ ×3 = MULTIBALL, LUNC hedefleri çarpanı artırır, USTC yıldızları top kurtarma yakar. Her topun ilk saniyeleri korumalıdır.<br>Oyun başına 3 top. Bol şans, kaptan!",securityStrip:"🔒 <b>Güvenlik:</b> bu oyun %100 ÜCRETSİZ ve asla cüzdan bağlamanı ya da bir şey imzalamanı istemez. Jeton sahtedir. Bağlama ya da imzalama isteyen her sayfa <b>sahtedir</b>.",flipHint:"Flipperlar: ◀ ▶ düğmeleri ya da Z / · Piston: yayı tut-bırak ya da BOŞLUK · Dürtme: yan düğmeler ya da Shift",dmInsert:"JETON AT",dmStart:"BAŞLAT'A BAS",dmBall:"TOP {n}",dmSkill:"SKILL SHOT!",dmSaved:"TOP KURTARILDI",dmTilt:"TILT!",dmWarn:"UYARI!",dmMulti:"MULTIBALL!",dmLock:"TOP {n} KİLİTLENDİ",dmLockLit:"KİLİT YANDI",dmOrbit:"ORBİT MODU!",dmJack:"JACKPOT!",dmSuper:"SÜPER JACKPOT!",dmBonus:"BONUS",dmGOver:"OYUN BİTTİ",dmMoon:"AY USTASI!",dmCombo:"GÖREV TAMAM!",dmShoot:"TEKRAR AT",dmCredit:"KREDİ {n}"},

>مزيفة</b>.",flipHint:"المضارب: أزرار ◀ ▶ أو Z / · المكبس: اضغط وحرّر الزنبرك أو المسافة · الدفع: الأزرار الجانبية أو Shift",dmInsert:"أدخل عملة",dmStart:"اضغط ابدأ",dmBall:"كرة {n}",dmSkill:"رمية مهارة!",dmSaved:"تم إنقاذ الكرة",dmTilt:"TILT!",dmWarn:"تحذير!",dmMulti:"كرة متعددة!",dmLock:"الكرة {n} مقفلة",dmLockLit:"القفل مضيء",dmOrbit:"وضع المدار!",dmJack:"الجائزة الكبرى!",dmSuper:"سوبر جاكبوت!",dmBonus:"مكافأة",dmGOver:"انتهت اللعبة",dmMoon:"سيد القمر!",dmCombo:"أُنجزت المهمة!",dmShoot:"ارمِ مجددًا",dmCredit:"رصيد {n}"},

/* ================= AUDIO (all synthesized, no files) ================= */
let AC = null, muted = localStorage.getItem('lunaPinballMute') === '1';
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f0, f1, dur, type, vol, when){
  if (muted || !audio()) return; const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
function noiseBurst(dur, vol, freq, when){
  if (muted || !audio()) return; const t = AC.currentTime + (when || 0);
  const len = Math.max(1, (AC.sampleRate * dur) | 0), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1800; f.Q.value = .8;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
let lastSpinSfx = 0;
function sfx(name){
  if (muted) return;
  switch(name){
    case 'coin': tone(988, 988, .07, 'square', .10); tone(1319, 1319, .28, 'square', .10, .07); break;
    case 'start': [523, 659, 784].forEach((f, i) => tone(f, f, .12, 'square', .11, i * .09)); break;
    case 'flip': noiseBurst(.05, .16, 900); tone(160, 60, .06, 'triangle', .18); break;
    case 'bumper': tone(190, 90, .09, 'square', .16); noiseBurst(.06, .14, 2400); break;
    case 'sling': tone(150, 70, .08, 'square', .14); noiseBurst(.05, .12, 1500); break;
    case 'target': tone(1568, 1568, .09, 'square', .10); tone(2093, 2093, .14, 'square', .08, .05); break;
    case 'lane': tone(880, 880, .07, 'sine', .14); break;
    case 'roll': tone(1175, 1175, .06, 'sine', .11); break;
    case 'spin': { const n = performance.now(); if (n - lastSpinSfx > 45){ lastSpinSfx = n; tone(2400, 1800, .03, 'square', .05); } break; }
    case 'ramp': noiseBurst(.34, .10, 700); tone(300, 900, .3, 'sine', .05); break;
    case 'saucer': tone(700, 180, .22, 'sine', .16); noiseBurst(.08, .10, 500, .16); break;
    case 'lock': tone(392, 392, .1, 'square', .12); tone(587, 587, .18, 'square', .12, .1); break;
    case 'multi': [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, f, .13, 'square', .12, i * .07)); break;
    case 'jackpot': [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, .12, 'square', .12, i * .06)); break;
    case 'drain': tone(420, 60, .5, 'sawtooth', .10); break;
    case 'save': tone(523, 1047, .18, 'sine', .14); break;
    case 'nudge': noiseBurst(.09, .20, 300); tone(90, 50, .1, 'triangle', .2); break;
    case 'warn': tone(140, 140, .16, 'sawtooth', .14); break;
    case 'tilt': tone(160, 40, .8, 'sawtooth', .16); break;
    case 'bonus': tone(1900, 1900, .04, 'square', .07); break;
    case 'plunge': noiseBurst(.12, .12, 500); tone(120, 300, .1, 'triangle', .1); break;
    case 'skill': [1047, 1319, 1568].forEach((f, i) => tone(f, f, .1, 'square', .11, i * .05)); break;
  }
}

/* ================= DOT-MATRIX DISPLAY ================= */
const dmdCv = document.getElementById('dmd'), dmdCtx = dmdCv.getContext('2d');
const dmdOff = document.createElement('canvas'); dmdOff.width = 118; dmdOff.height = 19;
const dmdOffCtx = dmdOff.getContext('2d');
let dmdQueue = [], dmdCurrent = null, dmdUntil = 0, dmdScroll = 0;
function dmdShow(text, opts){
  opts = opts || {};
  const item = { text: String(text), dur: opts.dur || 1900, big: !!opts.big, prio: opts.prio || 0 };
  if (item.prio >= 2){ dmdCurrent = item; dmdUntil = performance.now() + item.dur; dmdQueue.length = 0; return; }
  if (!dmdCurrent || performance.now() > dmdUntil){ dmdCurrent = item; dmdUntil = performance.now() + item.dur; }
  else dmdQueue.push(item);
}
function dmdDefault(){
  if (G.state === 'menu' || G.state === 'over') return '★ LUNA PINBALL ★';
  return null;
}
function drawDMD(now){
  // pick content
  if (!dmdCurrent || now > dmdUntil){ dmdCurrent = dmdQueue.shift() || null; if (dmdCurrent) dmdUntil = now + dmdCurrent.dur; }
  const o = dmdOffCtx; o.fillStyle = '#000'; o.fillRect(0, 0, 118, 19);
  o.fillStyle = '#ffb347'; o.textAlign = 'center'; o.textBaseline = 'middle';
  let main = null, sub = null;
  if (dmdCurrent){ main = dmdCurrent.text; }
  else if (G.state === 'playing' || G.state === 'bonus'){
    main = fmt(G.score);
    sub = (lang === 'en' ? 'BALL ' : '') + (T('dmBall').replace('{n}', G.ball)) + '   ·   ' + T('dmCredit').replace('{n}', G.credits);
    if (lang !== 'en') sub = T('dmBall').replace('{n}', G.ball) + ' · ' + T('dmCredit').replace('{n}', G.credits);
  } else if (G.state === 'coinwait'){ main = T('dmStart'); sub = T('dmCredit').replace('{n}', G.credits); }
  else { main = dmdDefault(); sub = (G.state === 'menu') ? T('dmInsert') : null; }
  if (main != null){
    if (dmdCurrent && dmdCurrent.big){ o.font = 'bold 13px "Courier New",monospace'; o.fillText(main, 59, 10); }
    else if (sub){ o.font = 'bold 10px "Courier New",monospace'; o.fillText(main, 59, 6.5); o.font = '6.5px "Courier New",monospace'; o.fillStyle = '#ff9435'; o.fillText(sub, 59, 15.5); }
    else { o.font = 'bold 11px "Courier New",monospace'; o.fillText(main, 59, 10); }
  }
  // pixelate onto visible canvas + dot grid
  const c = dmdCtx, W = dmdCv.width, H = dmdCv.height;
  c.fillStyle = '#160800'; c.fillRect(0, 0, W, H);
  c.imageSmoothingEnabled = false;
  c.drawImage(dmdOff, 0, 0, W, H);
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = 'rgba(0,0,0,0.92)';
  const pitch = 4;
  for (let y = 0; y < H + pitch; y += pitch) for (let x = 0; x < W + pitch; x += pitch){
    c.beginPath(); c.arc(x, y, 1.15, 0, 7); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  const gr = c.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgba(255,150,50,0.05)'); gr.addColorStop(1, 'rgba(0,0,0,0.14)');
  c.fillStyle = gr; c.fillRect(0, 0, W, H);
}

function arcW(cx, cy, r, a0, a1, step, rest, kind){
  let px = cx + r * Math.cos(a0), py = cy - r * Math.sin(a0);
  for (let a = a0 + step; a <= a1 + 1e-6; a += step){
    const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
    W(px, py, x, y, rest, kind); px = x; py = y;
  }
}

/* ================= PHYSICS ================= */
function segCollide(b, s, rest){
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L2 = dx * dx + dy * dy || 1;
  let t = ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / L2; t = Math.max(0, Math.min(1, t));
  const cx = s.x1 + dx * t, cy = s.y1 + dy * t;
  let nx = b.x - cx, ny = b.y - cy, d = Math.hypot(nx, ny);
  if (d >= BALL_R || d === 0) return null;
  nx /= d; ny /= d;
  b.x += nx * (BALL_R - d); b.y += ny * (BALL_R - d);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0){
    const r = rest != null ? rest : s.rest;
    b.vx -= (1 + r) * vn * nx; b.vy -= (1 + r) * vn * ny;
    b.vx *= .995; b.vy *= .995;
    return { nx, ny, speed: -vn, cx, cy };
  }
  return null;
}
function circCollide(b, c, rest, kick){
  let nx = b.x - c.x, ny = b.y - c.y, d = Math.hypot(nx, ny), min = BALL_R + c.r;
  if (d >= min || d === 0) return null;
  nx /= d; ny /= d;
  b.x = c.x + nx * min; b.y = c.y + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0 || kick){
    const r = rest != null ? rest : .5;
    b.vx -= (1 + r) * vn * nx; b.vy -= (1 + r) * vn * ny;
    if (kick){ const sp = Math.hypot(b.vx, b.vy), want = Math.max(sp, kick); b.vx = nx * want + (b.vx - nx * (b.vx * nx + b.vy * ny)) * .3; b.vy = ny * want + (b.vy - ny * (b.vx * nx + b.vy * ny)) * .3; }
    return { nx, ny, speed: Math.abs(vn) };
  }
  return null;
}
function flipperCollide(b, f){
  const tx = f.px + Math.cos(f.ang) * f.len, ty = f.py + Math.sin(f.ang) * f.len;
  const dx = tx - f.px, dy = ty - f.py, L2 = dx * dx + dy * dy;
  let t = ((b.x - f.px) * dx + (b.y - f.py) * dy) / L2; t = Math.max(0, Math.min(1, t));
  const cx = f.px + dx * t, cy = f.py + dy * t;
  let nx = b.x - cx, ny = b.y - cy, d = Math.hypot(nx, ny), min = BALL_R + f.r;
  if (d >= min) return;
  if (d === 0){ nx = 0; ny = -1; d = .001; } else { nx /= d; ny /= d; }
  b.x = cx + nx * min; b.y = cy + ny * min;
  const omega = (f.ang - f.prevAng) / STEP;             // rad/s
  const rx = cx - f.px, ry = cy - f.py;
  const svx = -omega * ry, svy = omega * rx;            // surface velocity at contact
  const rvx = b.vx - svx, rvy = b.vy - svy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0){
    const rest = .32;
    b.vx -= (1 + rest) * vn * nx; b.vy -= (1 + rest) * vn * ny;
    if (Math.abs(omega) > 2){ // active swing: add punch along the normal
      b.vx += nx * Math.abs(omega) * 26; b.vy += ny * Math.abs(omega) * 26;
    }
  }
}
const GRAV = 1060, STEP = 1 / 240;
function physicsStep(b, dt){
  if (b.mode === 'play'){
    b.vy += GRAV * dt;
    const sp = Math.hypot(b.vx, b.vy), MAX = 1750;
    if (sp > MAX){ b.vx *= MAX / sp; b.vy *= MAX / sp; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const s of walls) segCollide(b, s);
    for (const p of posts) circCollide(b, p, p.rest);
    circCollide(b, MOON, .55);
    if (circCollide(b, MOON, .55)) { /* handled below via dist check */ }
    for (const bm of bumpers){ const hit = circCollide(b, bm, .6, 560); if (hit) onBumper(b, bm); }
    for (const sl of slings){ const hit = segCollide(b, sl, .5); if (hit && sl.cool <= 0){ sl.cool = .12; sl.flash = 1; onSling(b, sl); } }
    for (const tg of luncTargets){ if (!tg.down){ const hit = segCollide(b, tg, .45); if (hit) onLuncTarget(b, tg); } else segCollide(b, { x1: tg.x1, y1: tg.y1 + 7, x2: tg.x2, y2: tg.y2 + 7, rest: .4 }); }
    for (const tg of ustcTargets){ const hit = segCollide(b, tg, .45); if (hit) onUstcTarget(b, tg); }
    for (const f of flippers) flipperCollide(b, f);
    featureChecks(b);
  } else if (b.mode === 'ramp'){
    b.rampT += dt * b.rampSpeed;
    const path = b.rampPath, total = path.len;
    if (b.rampT >= total){
      const rp = RAMPS[b.rampId];
      b.mode = 'play'; b.x = rp.drop.x; b.y = rp.drop.y; b.vx = rp.drop.vx; b.vy = rp.drop.vy;
      onRampExit(b, b.rampId);
    } else {
      const p = pathPoint(path, b.rampT); b.x = p.x; b.y = p.y;
    }
  } else if (b.mode === 'saucer'){
    b.saucerT -= dt;
    b.x += (SAUCER.x - b.x) * .35; b.y += (SAUCER.y - b.y) * .35;
    if (b.saucerT <= 0){ b.mode = 'play'; b.vx = (Math.random() * 60 - 30); b.vy = 430; onSaucerEject(b); }
  } else if (b.mode === 'shooter'){
    b.x = 388; if (b.y > 726){ b.y = 726; b.vy = 0; }
    b.vy += GRAV * dt; b.y += b.vy * dt;
    if (b.y >= 726){ b.y = 726; b.vy = 0; b.settled = true; }
    for (const s of walls) if (s.x1 >= 360 || s.x2 >= 360 || (s.y1 === 744)) segCollide(b, s);
    if (b.y < 690) b.mode = 'play';
  }
}
function buildPath(pts){
  const segs = []; let len = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], l = Math.hypot(x2 - x1, y2 - y1);
    segs.push({ x1, y1, x2, y2, l, at: len }); len += l;
  }
  return { pts, segs, len };
}
function pathPoint(path, t){
  for (const s of path.segs){ if (t <= s.at + s.l){ const k = s.l ? (t - s.at) / s.l : 0; return { x: s.x1 + (s.x2 - s.x1) * k, y: s.y1 + (s.y2 - s.y1) * k }; } }
  const last = path.pts[path.pts.length - 1]; return { x: last[0], y: last[1] };
}
RAMPS.forEach(r => { r.pathObj = buildPath(r.path); });

function serveBall(auto){
  const b = newBall(); G.balls.push(b);
  dmdShow(T('dmBall').replace('{n}', G.ball) + (G.ball === 1 ? ' · ' + T('dmSkill').replace('!', '') + '?' : ''), { dur: 1500 });

function startGame(){
  if (G.credits <= 0 || G.state === 'playing') return;
  G.credits--; updateCredits();
  hideAllScreens(); G.state = 'playing'; G.paused = false;
  resetGame(); resetBallFeatures();
  G.startTime = performance.now();
  G.balls = []; serveBall(false);
  sfx('start');
  dmdShow(T('dmBall').replace('{n}', 1), { dur: 1400, big: true });
}
function endBall(){
  // end-of-ball bonus count-up, then next ball or game over
  G.state = 'bonus';
  const bonus = Math.floor(G.bonusPool) * G.bonusMult;
  let counted = 0; const total = bonus;
  dmdShow(T('dmBonus') + ' ×' + G.bonusMult, { dur: 1200 });
  const iv = setInterval(() => {
    counted += Math.max(50, Math.floor(total / 18));
    if (counted >= total){ counted = total; clearInterval(iv); G.score += 0; setTimeout(nextBall, 350); }
    else { G.score += Math.max(50, Math.floor(total / 18)); sfx('bonus'); if (counted > total) counted = total; }
  }, 55);
  if (total <= 0){ clearInterval(iv); setTimeout(nextBall, 500); }
  G._bonusTotal = total;
}
function nextBall(){
  G.balls = G.balls.filter(b => !b.dead);
  if (G.ball >= 3){ gameOver(); return; }
  G.ball++; resetBallFeatures(); serveBall(false);
  G.state = 'playing';
  dmdShow(T('dmBall').replace('{n}', G.ball), { dur: 1300, big: true });
}
function gameOver(){
  G.state = 'over'; G.balls = [];
  G.elapsed = (performance.now() - G.startTime) / 1000;
  dmdShow(T('dmGOver'), { dur: 2600, big: true, prio: 2 });
  const best = Math.max(G.score, +(localStorage.getItem('lunaPinballBest') || 0));
  localStorage.setItem('lunaPinballBest', best);
  document.getElementById('finalScore').textContent = fmt(G.score);
  document.getElementById('overStats').textContent =
    T('overStats').replace('{m}', G.topMult).replace('{k}', G.missionsDone) + ' · ' + T('bestDevice').replace('{n}', fmt(best));
  prefillName();
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitStatus').textContent = '';
  showScreen('overScreen');
}

  } else {
    addScore(orbitBoost ? 50000 : 10000, ramp.trig.x, ramp.trig.y - 24, orbitBoost ? 'ORBIT RAMP' : 'RAMP');
  }

}

  b.mode = 'saucer'; b.saucerT = .95; b.vx = 0; b.vy = 0; SAUCER.flash = 1;

function featureChecks(b){
  const now = performance.now();

  const dm = Math.hypot(b.x - MOON.x, b.y - MOON.y);

  // HUD strip: score / ball / multiplier
  ctx.fillStyle = 'rgba(4,6,14,.72)'; rr(ctx, 12, 8, 300, 30, 8); ctx.fill();
  ctx.fillStyle = '#ffd968'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(G.score), 20, 24);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'bold 11px system-ui';
  ctx.fillText('BALL ' + G.ball + ' / 3', 168, 24);
  ctx.fillStyle = '#b48cff'; ctx.fillText('×' + G.bonusMult, 244, 24);
  // ball icons
  for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.arc(292 + i * 14, 23, 5, 0, 7); ctx.fillStyle = i < 4 - G.ball ? '#e8ecf4' : 'rgba(255,255,255,.18)'; ctx.fill(); }
  // glass sheen
  const sheen = ctx.createLinearGradient(0, 0, PW, PH);
  sheen.addColorStop(0, 'rgba(255,255,255,.07)'); sheen.addColorStop(.25, 'rgba(255,255,255,0)'); sheen.addColorStop(.8, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(255,255,255,.04)');
  ctx.fillStyle = sheen; ctx.fillRect(0, 0, PW, PH);
  // tilt overlay
  if (G.tilted){ ctx.fillStyle = 'rgba(255,40,40,.10)'; ctx.fillRect(0, 0, PW, PH); }
  ctx.restore();
}
function drawBall(b, scale){ drawBallAt(b.x, b.y, BALL_R * (scale || 1)); }
function drawBallAt(x, y, r){
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 5, r, r * .5, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - r * .4, y - r * .45, 1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.45, '#d7dde8'); g.addColorStop(.85, '#8d97a8'); g.addColorStop(1, '#5c6575');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x - r * .38, y - r * .42, r * .22, 0, 7); ctx.fill();
}

/* ================= INPUT ================= */
function bindHold(el, down, up, isPlungerBtn){
  const start = e => {
    /* While a ball waits in the shooter lane, the flipper buttons are
       plunger buttons too: they sit exactly where the player's thumb lands
       to pull (the right one covers the ball's on-screen position). Press-
       and-hold charges, release fires. In open play they're flippers. */
    if (isPlungerBtn && shooterWaiting()){
      e.preventDefault();
      if (plungerPointer === null){ plungerPointer = 'btn' + el.id; plungerViaHold = true; G.plungerHeld = true; }
      return;
    }
    e.preventDefault(); down();
  };
  const end = e => {
    if (plungerPointer === 'btn' + el.id){
      plungerPointer = null; G.plungerHeld = false;
      launchBall(G.plunger); G.plunger = 0;
      return;
    }
    e.preventDefault(); up && up();
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end); el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function setFlip(side, on){
  const f = flippers[side === 'L' ? 0 : 1];
  if (G.tilted) on = false;
  if (on && !f.pressed){ sfx('flip'); if (G.state === 'playing'){ laneChange(side === 'L' ? -1 : 1); } if (G.state === 'bonus') skipBonus(); }
  f.pressed = on;
}
function skipBonus(){ /* bonus interval is short; hook kept for feel */ }
function shooterWaiting(){ return G.state === 'playing' && G.balls.some(b => b.mode === 'shooter' && b.settled); }
bindHold(document.getElementById('flipL'), () => setFlip('L', true), () => setFlip('L', false), true);
bindHold(document.getElementById('flipR'), () => setFlip('R', true), () => setFlip('R', false), true);
bindHold(document.getElementById('nudgeL'), () => nudge('L'));
bindHold(document.getElementById('nudgeR'), () => nudge('R'));
let touchFlip = { L: null, R: null };
cv.addEventListener('pointerdown', e => {
  const rect = cv.getBoundingClientRect(), x = (e.clientX - rect.left) / rect.width * PW, y = (e.clientY - rect.top) / rect.height * PH;
  /* The whole shooter lane is plunger territory: the lane column (x >= 364)
     at ANY height, plus the ball's own area at the bottom of the lane. The
     old gate (x > 366) sat ~9px INSIDE the lane's right edge — a finger
     centered on the ball could land left of it and become a flipper press. */
  const laneTouch = x >= 364 && (y > 100 || y > PH * .55);
  if (y > PH * .55 && !laneTouch){
    const side = x < PW / 2 ? 'L' : 'R';
    touchFlip[side] = e.pointerId; setFlip(side, true);
  } else if (laneTouch){ plungerDown(e); }
});
cv.addEventListener('pointerup', e => { for (const s of ['L', 'R']) if (touchFlip[s] === e.pointerId){ touchFlip[s] = null; setFlip(s, false); } plungerUp(e); });
cv.addEventListener('pointercancel', e => { for (const s of ['L', 'R']) if (touchFlip[s] === e.pointerId){ touchFlip[s] = null; setFlip(s, false); } plungerUp(e); });
let plungerPointer = null, plungerStartY = 0, plungerViaHold = false;
function plungerDown(e){
  const b = G.balls.find(x => x.mode === 'shooter' && x.settled);
  if (!b || G.state !== 'playing') return;
  plungerPointer = e.pointerId; plungerStartY = e.clientY; plungerViaHold = false; G.plungerHeld = true;
}
function plungerMove(e){
  if (plungerPointer !== e.pointerId) return;
  const rect = cv.getBoundingClientRect();
  const dy = (e.clientY - plungerStartY) / rect.height * PH;
  /* A real pull still wins, but if the player just holds (no drag) the
     auto-charge in the main loop ramps power too — then a hold would be
     stuck at whatever the tiny drag read. Drag only RAISES charge. */
  const dragPower = Math.max(0, Math.min(1, dy / 130));
  if (dragPower > 0.02) plungerViaHold = false;
  G.plunger = Math.max(G.plunger, dragPower);
}
function plungerUp(e){
  if (plungerPointer !== e.pointerId) return;
  plungerPointer = null; G.plungerHeld = false;
  launchBall(G.plunger); G.plunger = 0;
}
cv.addEventListener('pointermove', plungerMove);
/* Dedicated plunger grab strip: now the FULL height of the shooter-lane
   column (ball to bottom of the playfield), so a pull can start on the ball
   itself or anywhere down the lane. */
let zonePointer = null;
const pzEl = document.getElementById('plungeZone');
pzEl.addEventListener('pointerdown', e => { e.preventDefault(); try { pzEl.setPointerCapture(e.pointerId); } catch(err){} zonePointer = e.pointerId; plungerPointer = e.pointerId; plungerStartY = e.clientY; plungerViaHold = false; const b = G.balls.find(x => x.mode === 'shooter' && x.settled); G.plungerHeld = !!b; });
pzEl.addEventListener('pointermove', e => { if (e.pointerId === zonePointer) plungerMove(e); });
const pzEnd = e => { if (e.pointerId === zonePointer){ zonePointer = null; plungerUp(e); } };
pzEl.addEventListener('pointerup', pzEnd); pzEl.addEventListener('pointercancel', pzEnd);
pzEl.addEventListener('contextmenu', e => e.preventDefault());
/* LAUNCH button fallback: hold to charge, release to fire. Always works —
   thumb-sized, no aim, no drag. */
const launchBtnEl = document.getElementById('launchBtn');
launchBtnEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const b = G.balls.find(x => x.mode === 'shooter' && x.settled);
  if (!b || G.state !== 'playing' || plungerPointer !== null) return;
  plungerPointer = 'launch'; plungerViaHold = true; G.plungerHeld = true;
  try { launchBtnEl.setPointerCapture(e.pointerId); } catch(err){}
});
const launchEnd = e => { if (plungerPointer === 'launch'){ plungerPointer = null; G.plungerHeld = false; launchBall(G.plunger); G.plunger = 0; } };
launchBtnEl.addEventListener('pointerup', launchEnd);
launchBtnEl.addEventListener('pointercancel', launchEnd);
launchBtnEl.addEventListener('contextmenu', e => e.preventDefault());
function launchBall(power){
  const b = G.balls.find(x => x.mode === 'shooter');
  if (!b || G.state !== 'playing') return;
  b.vy = -(1115 + 760 * Math.max(0, Math.min(1, power))); b.vx = 0; b.settled = false; b.justLaunched = true;
  sfx('plunge');
}
function fitMachine(){
  /* Fit the whole machine (backbox + playfield + coin door) into short
     viewports by scaling it down — never by letting the page scroll away
     from the controls. Tall screens are untouched (scale 1). */
  const m = document.querySelector('.machine');
  m.style.transform = ''; m.style.zoom = '';
  const pv = window.visualViewport;
  const vh = pv ? pv.height : window.innerHeight;
  const vw = pv ? pv.width : window.innerWidth;
  /* Scale source = the canvas. Chromium's CSS zoom does not scale canvas
     backing uniformly (measured: the playfield shrinks LESS than the zoom
     factor), so fit math based on the canvas's own measured rect is exact:
     the canvas dominates the machine's height and width, and the fixed
     chrome (backbox/coin door ~190px, rails + cabinet padding ~50px)
     scales with the rest. */
  const cr = cv.getBoundingClientRect();
  const chromeH = 196, chromeW = 52;
  let s = 1;
  if (cr.height > 4) s = Math.min(s, (vh - 88 - chromeH) / cr.height);
  if (cr.width > 4) s = Math.min(s, (vw - 12 - chromeW) / cr.width);
  s = Math.min(1, Math.max(.45, s));
  if (s < .999) m.style.zoom = s;
  m.style.transform = 'perspective(1150px) rotateX(' + (s < .999 ? '1.4deg' : '2.2deg') + ')';
}
let fitQueued = false;
function queueFit(){ if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fitMachine(); }); }
addEventListener('resize', queueFit); addEventListener('orientationchange', queueFit);
if (window.visualViewport) visualViewport.addEventListener('resize', queueFit);
function refreshChrome(){
  const playing = G.state === 'playing' || G.state === 'bonus';
  document.body.classList.toggle('playing', playing);
  const shooterReady = G.state === 'playing' && G.balls.some(b => b.mode === 'shooter' && b.settled);
  launchBtnEl.classList.toggle('show', shooterReady);
  pzEl.classList.toggle('hide', !shooterReady);
  queueFit();
}
setInterval(refreshChrome, 250);
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'arrowleft') setFlip('L', true);
  else if (k === '/' || k === 'arrowright') setFlip('R', true);
  else if (k === ' '){ e.preventDefault(); if (!spaceHeld){ spaceHeld = true; spaceT0 = performance.now(); G.plungerHeld = true; } }
  else if (k === 'shift') nudge(Math.random() < .5 ? 'L' : 'R');
  else if (k === 'p') togglePause();
  else if (k === 'm') toggleMute();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'arrowleft') setFlip('L', false);
  else if (k === '/' || k === 'arrowright') setFlip('R', false);
  else if (k === ' '){ spaceHeld = false; G.plungerHeld = false; launchBall(Math.min(1, (performance.now() - spaceT0) / 900)); G.plunger = 0; }
});

/* ================= SCREENS / COIN / LEADERBOARD ================= */
const $ = id => document.getElementById(id);
const screens = ['menuScreen', 'howScreen', 'boardScreen', 'overScreen', 'pauseScreen'];
function showScreen(id){ screens.forEach(s => $(s).classList.toggle('show', s === id)); }
function hideAllScreens(){ screens.forEach(s => $(s).classList.remove('show')); }
function updateCredits(){ $('creditNum').textContent = G.credits; $('startBtn').disabled = G.credits <= 0; }
$('coinBtn').addEventListener('click', () => {
  audio(); sfx('coin'); G.credits = Math.min(9, G.credits + 1); updateCredits();
  if (G.state === 'menu'){ G.state = 'coinwait'; hideAllScreens(); }
  dmdShow(T('dmCredit').replace('{n}', G.credits) + ' · ' + T('dmStart'), { dur: 1500 });
});
$('startBtn').addEventListener('click', () => { audio(); startGame(); });
$('howBtn').addEventListener('click', () => showScreen('howScreen'));
$('howClose').addEventListener('click', () => showScreen(G.state === 'over' ? 'overScreen' : 'menuScreen'));
$('boardBtn').addEventListener('click', () => { showScreen('boardScreen'); loadBoard(); });
$('boardClose').addEventListener('click', () => showScreen(G.state === 'over' ? 'overScreen' : 'menuScreen'));
$('overBoardBtn').addEventListener('click', () => { showScreen('boardScreen'); loadBoard(); });
$('againBtn').addEventListener('click', () => { if (G.credits > 0){ startGame(); } else { G.state = 'menu'; showScreen('menuScreen'); } });
$('tabAll').addEventListener('click', () => { boardTab = 'all'; $('tabAll').classList.add('on'); $('tabWeek').classList.remove('on'); renderBoard(); });
$('tabWeek').addEventListener('click', () => { boardTab = 'week'; $('tabWeek').classList.add('on'); $('tabAll').classList.remove('on'); renderBoard(); });
function togglePause(){
  if (G.state !== 'playing' && G.state !== 'bonus') return;
  G.paused = !G.paused;
  if (G.paused) showScreen('pauseScreen'); else hideAllScreens();
}
$('pauseBtn').addEventListener('click', togglePause);
$('resumeBtn').addEventListener('click', togglePause);
$('quitBtn').addEventListener('click', () => { G.paused = false; G.state = 'menu'; G.balls = []; showScreen('menuScreen'); dmdQueue.length = 0; dmdCurrent = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'playing' && !G.paused) togglePause(); });
function toggleMute(){
  muted = !muted; localStorage.setItem('lunaPinballMute', muted ? '1' : '0');
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
}
$('muteBtn').addEventListener('click', toggleMute);
$('muteBtn').textContent = muted ? '🔇' : '🔊';
const API_URL = 'https://frg-fight-club.vercel.app/api/luna-games?game=pinball';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let boardData = null, boardTab = 'all';
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
async function loadBoard(){
  const list = $('boardList'); list.innerHTML = '<div class="brow"><span>' + esc(T('loading')) + '</span><span></span></div>';
  try {
    const r = await fetch(API_URL); const j = await r.json();
    boardData = j; renderBoard();
  } catch(e){ list.innerHTML = '<div class="brow"><span>' + esc(T('boardOff')) + '</span><span></span></div>'; }
}
function renderBoard(){
  const list = $('boardList'); if (!list) return;
  const rows = boardData ? (boardTab === 'week' ? boardData.week : boardData.all) : null;
  if (!rows){ list.innerHTML = '<div class="brow"><span>' + esc(T('loading')) + '</span><span></span></div>'; return; }
  if (!rows.length){ list.innerHTML = '<div class="brow"><span>' + esc(T('noScores')) + '</span><span></span></div>'; return; }
  list.innerHTML = rows.slice(0, 15).map((r, i) => '<div class="brow"><span>' + (i + 1) + '. ' + esc(r.name) + '</span><b>' + fmt(r.score) + '</b></div>').join('');
}
function prefillName(){
  const saved = localStorage.getItem('lunaPinballName') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || '') : '');
  if (saved) $('nameInput').value = saved;
}
$('submitBtn').addEventListener('click', async () => {
  const name = ($('nameInput').value || 'Player').trim().slice(0, 16) || 'Player';
  localStorage.setItem('lunaPinballName', name);
  $('submitBtn').disabled = true; $('submitStatus').textContent = T('loading');
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: tg ? tg.initData : '', name, score: Math.floor(G.score), seconds: Math.max(10, Math.round(G.elapsed)) }) });
    const j = await r.json();
    if (j && j.ok){ $('submitStatus').textContent = j.rank ? T('savedRank').replace('{n}', j.rank) : T('saved'); boardData = null; }
    else { $('submitStatus').textContent = T('saveFail'); $('submitBtn').disabled = false; }
  } catch(e){ $('submitStatus').textContent = T('saveFail'); $('submitBtn').disabled = false; }
});

/* ================= MAIN LOOP ================= */
let lastT = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > .06) dt = .06;
  // plunger charge while held: keyboard hold, LAUNCH button hold, or a
  // press-and-hold on the lane/strip without dragging (pointer is set)
  if (G.plungerHeld && (plungerPointer === null || plungerViaHold)) G.plunger = Math.min(1, G.plunger + dt * 1.1);
  if (!G.paused && (G.state === 'playing' || G.state === 'bonus')){
    acc += dt;
    while (acc > STEP){
      acc -= STEP;
      for (const f of flippers){
        f.prevAng = f.ang;
        const tgt = f.pressed && !G.tilted ? f.up : f.rest;
        const rate = (f.pressed && !G.tilted) ? 26 : 15;
        const d = tgt - f.ang, step = rate * STEP;
        f.ang += Math.abs(d) < step ? d : Math.sign(d) * step;
      }
      for (const b of [...G.balls]) if (!b.dead) physicsStep(b, STEP);
      G.balls = G.balls.filter(b => !b.dead || b.held);
      if (G.tilt > 0) G.tilt = Math.max(0, G.tilt - 9 * STEP);
      for (const bm of bumpers) if (bm.flash > 0) bm.flash -= STEP * 3;
      if (MOON.flash > 0) MOON.flash -= STEP * 2.4;
      if (SAUCER.flash > 0) SAUCER.flash -= STEP * 2;
      for (const sl of slings){ if (sl.cool > 0) sl.cool -= STEP; if (sl.flash > 0) sl.flash -= STEP * 3; }
      for (const tg of luncTargets) if (tg.flash > 0) tg.flash -= STEP * 3;
      for (const tg of ustcTargets) if (tg.flash > 0) tg.flash -= STEP * 3;
      for (const r of rollovers) if (r.flash > 0) r.flash -= STEP * 2;
      if (spinSensor.angle) spinSensor.angle *= (1 - STEP * 2);
    }
  }
  // popups / sparks always animate
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > 1.15) popups.splice(i, 1);
  for (const s of sparks){ s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; }
  for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].t > sparks[i].life) sparks.splice(i, 1);
  draw(now); drawDMD(now);
}
/* ================= INIT ================= */
const langSel = $('langSel');
LANGS.forEach(([k, label]) => { const o = document.createElement('option'); o.value = k; o.textContent = label; langSel.appendChild(o); });
langSel.value = lang;
langSel.addEventListener('change', () => { lang = langSel.value; localStorage.setItem('lunaPinballLang', lang); applyI18n(); });
applyI18n(); updateCredits(); showScreen('menuScreen'); queueFit();
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
requestAnimationFrame(frame);
/* Debug/QA hook */
window.LP = {
  G, flippers, lanes, RAMPS, SAUCER, MOON, bumpers,
  plungerState: () => ({ power: G.plunger, held: G.plungerHeld }),
  insertCoin: () => $('coinBtn').click(),
  start: () => $('startBtn').click(),
  launch: p => launchBall(p == null ? 1 : p),
  flip: (s, on) => setFlip(s, on !== false),
  nudge: s => nudge(s || 'L'),
  ball: () => G.balls.find(b => !b.dead && !b.held) || G.balls[0],
  setBall: (x, y, vx, vy) => { const b = G.balls.find(b => !b.dead && !b.held) || G.balls[0]; if (b){ b.mode = 'play'; b.held = false; b.x = x; b.y = y; b.vx = vx || 0; b.vy = vy || 0; } },
  saucer: () => { const b = G.balls.find(b => !b.dead && !b.held) || G.balls[0]; if (b) onSaucer(b); },
  state: () => ({ state: G.state, score: G.score, ball: G.ball, credits: G.credits, balls: G.balls.length, locks: G.locks, mb: G.inMultiball, mult: G.bonusMult })
};
