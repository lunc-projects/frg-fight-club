<!DOCTYPE html>
<!--
  SOL Dev token page — PREVIEW build (name/symbol shown are the current pick; mint + pool land at launch).
  Placeholders filled at launch time:
    SOL Dev     token name, e.g. SOL Dev
    SOLDEV   token symbol, e.g. SOLDEV
    Mint address lands at launch     mint address (from mint-soldev.mjs output)
    # Raydium swap link (from pool-raydium.mjs output)

  House standard: clean view, tidy cards, bottom nav, 18-language selector.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOL Dev (SOLDEV) — on Solana</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{

  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  header{display:flex; align-items:center; gap:10px; padding:14px 16px; max-width:560px; margin:0 auto;}
  header img{width:38px; height:38px; border-radius:50%;}
  header .brand{font-weight:800; font-size:17px; letter-spacing:.2px;}
  header .brand span{color:var(--gold);}
  #langSel{margin-left:auto; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:7px 8px; font-size:14px; font-weight:600; max-width:150px;}
  main{max-width:560px; margin:0 auto; padding:4px 14px 10px; display:flex; flex-direction:column; gap:14px;}

  .hero h1{font-size:30px; margin-top:14px;}
  .hero .sym{display:inline-block; margin-top:8px; background:var(--card2); border:1px solid var(--gold);

  .hero p{color:var(--dim); margin-top:12px; line-height:1.5; font-size:15px;}
  h2{font-size:17px; margin-bottom:6px;}
  .sub{color:var(--dim); font-size:14px; line-height:1.5;}

    background:var(--gold); color:#191104; white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn.big{display:block; text-align:center; text-decoration:none; margin-top:14px; padding:14px; font-size:16px; border-radius:14px;}
  .note{color:var(--dim); font-size:13px; margin-top:10px;}
  .fact{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line);}
  .fact:first-of-type{border-top:0;}
  .fact .tick{color:var(--green); font-size:19px; line-height:1.3;}
  .fact b{display:block; font-size:15px;}
  .fact span{color:var(--dim); font-size:13.5px; line-height:1.45;}
  footer{max-width:560px; margin:0 auto; padding:6px 22px 0; color:var(--dim); font-size:12.5px; text-align:center; line-height:1.5;}
  nav{position:fixed; left:0; right:0; bottom:0; background:rgba(13,15,20,.96); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:10;}

  nav a .ic{display:block; font-size:21px; margin-bottom:2px;}
  nav a.on{color:var(--gold);}
.pv-ribbon{max-width:560px; margin:0 auto 14px; text-align:center; font-size:12.5px; font-weight:800; letter-spacing:.4px; color:var(--gold2); background:rgba(245,185,66,.12); border:1.5px solid rgba(245,185,66,.45); border-radius:999px; padding:7px 12px;}

</head>

    <div class="fact"><div class="tick">✓</div><div><b data-i18n="s3t"></b><span data-i18n="s3d"></span></div></div>
    <div class="fact"><div class="tick">✓</div><div><b data-i18n="s4t"></b><span data-i18n="s4d"></span></div></div>
  </section>
</main>

<footer data-i18n="footer"></footer>

<nav>

};
const $ = (s) => document.querySelector(s);
const sel = $("#langSel");
LANGS.forEach(([code, name]) => {
  const o = document.createElement("option");
  o.value = code; o.textContent = name; sel.appendChild(o);
});
function t(k){ const l = sel.value || "en"; return (I18N[l] && I18N[l][k]) || I18N.en[k] || k; }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = sel.value;
  document.documentElement.dir = sel.value === "ar" ? "rtl" : "ltr";
  try { localStorage.setItem("solDevLang", sel.value); } catch(e){}
}
try { sel.value = localStorage.getItem("solDevLang") || "en"; } catch(e){ sel.value = "en"; }
if (!I18N[sel.value]) sel.value = "en";
sel.addEventListener("change", applyLang);
applyLang();
$("#copyBtn").addEventListener("click", async () => {
  const addr = $("#mintAddr").textContent.trim();
  try { await navigator.clipboard.writeText(addr); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  const b = $("#copyBtn"); b.textContent = t("copied");
  setTimeout(() => { b.textContent = t("copy"); }, 1600);
});
document.querySelectorAll("nav a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll("nav a").forEach(x => x.classList.remove("on"));
  a.classList.add("on");
}));
</script>
