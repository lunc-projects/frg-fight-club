<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GP claim completion</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecf8; padding: 24px; }
  button { font-size: 18px; padding: 14px 22px; border-radius: 10px; border: 0; background: #f5c542; color: #111; font-weight: 700; }
  pre { white-space: pre-wrap; word-break: break-all; background: #141a30; padding: 16px; border-radius: 10px; margin-top: 18px; }
</style>
</head>
<body>
<h1>LUNC Grand Prix — complete the FRG car claim</h1>
<p>Payment tx: 7327EC7103B6492D984A8F9C5EC9EA51E1992A777C88E62660E523E4492C8D16 (50 LUNC, tier 3, buyer terra1t2fcl…qnlh)</p>
<button id="go">Complete claim</button>
<pre id="out">Not run yet.</pre>
<script>
  const out = document.getElementById('out');
  async function run() {
    out.textContent = 'Posting claim to the mint service…';
    try {
      const r = await fetch('https://lunc-gp-mint-production.up.railway.app/buy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          address: 'terra1t2fclmenwehn6kczxg76cgd86sy2tdvvatqnlh',
          tier: 3,
          txHash: '7327EC7103B6492D984A8F9C5EC9EA51E1992A777C88E62660E523E4492C8D16'
        })
      });
      const text = await r.text();
      out.textContent = 'HTTP ' + r.status + '\n' + text;
    } catch (e) {
      out.textContent = 'FETCH ERROR: ' + e.message;
    }
  }
  document.getElementById('go').addEventListener('click', run);
</script>
</body>
</html>
