<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block Puzzle — sample game (preview)</title>
<style>
  :root { --cs: min(8.8vw, 46px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    min-height:100vh; color:#e8eaf6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(300px 300px at 90% -70px, rgba(255,214,106,.28), rgba(255,214,106,0) 70%),
      radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.8), rgba(255,255,255,0) 60%),
      radial-gradient(1.6px 1.6px at 32% 64%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      radial-gradient(2.2px 2.2px at 58% 14%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%),
      radial-gradient(130% 90% at 50% 0%, #232a5e 0%, #12173a 48%, #070a22 100%);
    -webkit-user-select:none; user-select:none; touch-action: manipulation; overflow-x:hidden;
  }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px 2px; max-width:560px; margin:0 auto; flex-wrap:wrap;
  }
  header .title { font-weight:900; letter-spacing:.14em; font-size:17px; color:#ffd76a; text-shadow:0 2px 10px rgba(255,180,0,.35); }
  header .title small { display:block; letter-spacing:.08em; font-weight:700; font-size:10.5px; opacity:.75; }
  .stats { display:flex; gap:8px; font-size:13.5px; font-weight:800; }
  .stats span {
    background:linear-gradient(90deg,#2a2a72,#6a63e8); color:#fff; border-radius:999px;
    padding:6px 14px; box-shadow:0 3px 8px rgba(5,8,30,.55);
  }
  .stats b { font-variant-numeric: tabular-nums; }
  #wrap { max-width:560px; margin:0 auto; padding:8px 10px 30px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  #grid {
    display:grid; grid-template-columns:repeat(10, var(--cs)); grid-template-rows:repeat(10, var(--cs));
    gap:2px; padding:8px; border-radius:16px; background:rgba(120,130,255,.08);
    border:2.5px dashed rgba(190,198,255,.35); touch-action:none;
  }
  .cell {
    border-radius:22%; background:rgba(140,150,255,.10);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--cs) * .5); line-height:1;
  }
  .cell.hl-ok { background:rgba(74,222,61,.45); }
  .cell.hl-bad { background:rgba(229,50,79,.45); }
  .tile {
    border-radius:22%; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.22), 0 2px 5px rgba(2,4,18,.5);
  }
  #tray { display:flex; gap:12px; justify-content:center; min-height:calc(var(--cs) * 2.1); }
  .slot {
    width:calc(var(--cs) * 3.1); height:calc(var(--cs) * 2.1);
    display:flex; align-items:center; justify-content:center;
    border-radius:14px; background:rgba(120,130,255,.07); border:2px dashed rgba(190,198,255,.22);
    touch-action:none;
  }
  .piece { display:grid; gap:2px; cursor:grab; }
  .piece .pcell { width:calc(var(--cs) * .62); height:calc(var(--cs) * .62); }
  .piece .pcell.empty { visibility:hidden; }
  .piece.used { opacity:.14; pointer-events:none; }
  .piece.dead { opacity:.35; filter:grayscale(.8); }
  #dragGhost { position:fixed; z-index:50; pointer-events:none; display:none; gap:2px; }
  #dragGhost .pcell { width:var(--cs); height:var(--cs); }
  #dragGhost .pcell.empty { visibility:hidden; }
  button.chunky {
    cursor:pointer; border:none; color:#fff; border-radius:14px; padding:13px 30px;
    font-size:16px; font-weight:900; letter-spacing:.07em; text-shadow:0 1px 2px rgba(0,0,0,.3); font-family:inherit;
  }
  button.chunky:active { transform:translateY(3px); }
  button.green { background:linear-gradient(180deg,#7a6cff,#4b3ed1); box-shadow:0 5px 0 #2c2390; }
  button.green:active { box-shadow:0 2px 0 #2c2390; }
  button.orange { background:linear-gradient(180deg,#8d99c9,#5a6699); box-shadow:0 5px 0 #39406b; }
  button.orange:active { box-shadow:0 2px 0 #39406b; }
  #over {
    position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(10,24,64,.88); text-align:center; padding:20px;
  }
  #over h1 { margin:0; font-size:40px; letter-spacing:.08em; color:#ffd76a; text-shadow:0 4px 26px rgba(255,180,0,.45); }
  #over p { margin:0; font-size:16px; }
  footer { text-align:center; font-size:12px; color:#9aa3d0; font-weight:600; padding:0 12px 18px; max-width:560px; margin:0 auto; }
</style>
</head>
<body>
<header>
  <div class="title">🧩 LUNA BLOCKS<small>SAMPLE GAME · PREVIEW ONLY</small></div>
  <div class="stats">
    <span>Score <b id="stScore">0</b></span>
    <span>Best <b id="stBest">0</b></span>
  </div>
</header>

<div id="wrap">
  <div id="grid"></div>
  <div id="tray"></div>
  <button id="newBtn" class="chunky orange">NEW GAME</button>
</div>
<footer>Drag a piece onto the board. Fill a full row or column to clear it — clearing 2+ at once pays bonus. Game ends when no piece fits.</footer>

<div id="dragGhost"></div>
<div id="over">
  <h1>🧩 NO MORE MOVES</h1>
  <p id="overStats"></p>
  <button id="againBtn" class="chunky green">Play Again</button>
</div>

<script>
'use strict';
/*LOGIC-START*/
const N = 10;
/* piece shapes: cells as [dr, dc]; color indexes into PALETTE */
const SHAPES = [
  { cells: [[0,0]], name: 'dot' },
  { cells: [[0,0],[0,1]], name: 'domino-h' },
  { cells: [[0,0],[1,0]], name: 'domino-v' },
  { cells: [[0,0],[0,1],[0,2]], name: 'line3-h' },
  { cells: [[0,0],[1,0],[2,0]], name: 'line3-v' },
  { cells: [[0,0],[0,1],[0,2],[0,3]], name: 'line4-h' },
  { cells: [[0,0],[1,0],[2,0],[3,0]], name: 'line4-v' },
  { cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], name: 'line5-h' },
  { cells: [[0,0],[1,0],[2,0],[3,0],[4,0]], name: 'line5-v' },
  { cells: [[0,0],[0,1],[1,0],[1,1]], name: 'sq2' },
  { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], name: 'sq3' },
  { cells: [[0,0],[1,0],[1,1]], name: 'corner-s' },
  { cells: [[0,0],[0,1],[1,0]], name: 'corner-s2' },
  { cells: [[0,0],[1,0],[2,0],[2,1]], name: 'corner-l' },
  { cells: [[0,0],[0,1],[0,2],[1,1]], name: 'tee' },
  { cells: [[0,1],[0,2],[1,0],[1,1]], name: 'zig' },
  { cells: [[0,0],[0,1],[1,1],[1,2]], name: 'zag' },
  { cells: [[0,0],[1,0],[1,1],[2,1]], name: 'ell' },
];
function emptyBoard(){ return Array.from({ length: N }, () => Array(N).fill(0)); }
function fits(board, shape, r, c){
  for (const [dr, dc] of shape.cells){
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || rr >= N || cc < 0 || cc >= N || board[rr][cc] !== 0) return false;
  }
  return true;
}
function place(board, shape, r, c, color){
  const next = board.map(row => row.slice());
  for (const [dr, dc] of shape.cells) next[r + dr][c + dc] = color;
  return next;
}
function clearLines(board){
  const rows = [], cols = [];
  for (let r = 0; r < N; r++) if (board[r].every(v => v !== 0)) rows.push(r);
  for (let c = 0; c < N; c++){
    let full = true;
    for (let r = 0; r < N; r++) if (board[r][c] === 0){ full = false; break; }
    if (full) cols.push(c);
  }
  if (!rows.length && !cols.length) return { board, lines: 0 };
  const next = board.map(row => row.slice());
  for (const r of rows) for (let c = 0; c < N; c++) next[r][c] = 0;
  for (const c of cols) for (let r = 0; r < N; r++) next[r][c] = 0;
  return { board: next, lines: rows.length + cols.length };
}
function linePoints(lines){
  if (!lines) return 0;
  return lines * (lines + 1) / 2 * 10;   /* 1->10, 2->30, 3->60, 4->100 */
}
function anyFit(board, shapes){
  for (const shape of shapes){
    if (!shape) continue;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (fits(board, shape, r, c)) return true;
  }
  return false;
}
/*LOGIC-END*/

const PALETTE = [
  null,
  { g: 'linear-gradient(160deg,#8f86ff,#4b3ed1)', glyph: '🌙' },
  { g: 'linear-gradient(160deg,#ffd76a,#e8a013)', glyph: '⭐' },
  { g: 'linear-gradient(160deg,#ff7aa8,#e5324f)', glyph: '✦' },
  { g: 'linear-gradient(160deg,#7df4ff,#2196c9)', glyph: '💧' },
  { g: 'linear-gradient(160deg,#9dff70,#2fae4e)', glyph: '☾' },
  { g: 'linear-gradient(160deg,#e2b6ff,#8b46c7)', glyph: '🔮' },
];
const $ = id => document.getElementById(id);
let board = emptyBoard();
let tray = [];            /* [{shape, color, used}] x3 */
let score = 0, best = +(localStorage.getItem('blocksBest') || 0);
let over = false;

function deal(){
  tray = Array.from({ length: 3 }, () => ({
    shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
    color: 1 + Math.floor(Math.random() * (PALETTE.length - 1)),
    used: false,
  }));
}
function newGame(){
  board = emptyBoard(); score = 0; over = false;
  deal(); render();
  $('over').style.display = 'none';
}
function tileHTML(color){
  const p = PALETTE[color];
  return `<div class="tile" style="background:${p.g}">${p.glyph}</div>`;
}
function render(){
  const grid = $('grid');
  grid.innerHTML = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const d = document.createElement('div');
    d.className = 'cell'; d.dataset.r = r; d.dataset.c = c;
    if (board[r][c]) d.innerHTML = tileHTML(board[r][c]);
    grid.appendChild(d);
  }
  const trayEl = $('tray');
  trayEl.innerHTML = '';
  const liveShapes = tray.filter(t => !t.used).map(t => t.shape);
  const anyMoves = anyFit(board, liveShapes);
  tray.forEach((t, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const p = document.createElement('div');
    p.className = 'piece' + (t.used ? ' used' : '') + (!t.used && !anyMoves ? ' dead' : '');
    p.dataset.idx = i;
    const rows = Math.max(...t.shape.cells.map(([dr]) => dr)) + 1;
    const cols = Math.max(...t.shape.cells.map(([, dc]) => dc)) + 1;
    p.style.gridTemplateRows = `repeat(${rows}, auto)`;
    p.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    const filled = new Set(t.shape.cells.map(([dr, dc]) => dr + ',' + dc));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
      const cell = document.createElement('div');
      if (filled.has(r + ',' + c)){
        cell.className = 'pcell';
        cell.innerHTML = tileHTML(t.color);
        cell.dataset.r = r; cell.dataset.c = c;
      } else {
        cell.className = 'pcell empty';
      }
      p.appendChild(cell);
    }
    slot.appendChild(p);
    trayEl.appendChild(slot);
  });
  $('stScore').textContent = score;
  $('stBest').textContent = Math.max(best, score);
}

/* ================= drag & drop ================= */
let drag = null;   /* {idx, grabR, grabC, shape, color} */
const ghost = $('dragGhost');

function cellPx(){
  return $('grid').getBoundingClientRect().width / N;
}
function anchorFor(e){
  const rect = $('grid').getBoundingClientRect();
  const px = cellPx();
  const c = Math.round((e.clientX - rect.left) / px) - drag.grabC;
  const r = Math.round((e.clientY - rect.top) / px) - drag.grabR;
  return { r, c };
}
function paintHighlight(){
  document.querySelectorAll('.cell.hl-ok, .cell.hl-bad').forEach(el => el.classList.remove('hl-ok', 'hl-bad'));
  if (!drag || !drag.anchor) return;
  const ok = fits(board, drag.shape, drag.anchor.r, drag.anchor.c);
  for (const [dr, dc] of drag.shape.cells){
    const rr = drag.anchor.r + dr, cc = drag.anchor.c + dc;
    if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
    const el = document.querySelector(`.cell[data-r="${rr}"][data-c="${cc}"]`);
    if (el) el.classList.add(ok ? 'hl-ok' : 'hl-bad');
  }
}
document.addEventListener('pointerdown', e => {
  if (over) return;
  const pieceEl = e.target.closest('.piece');
  if (!pieceEl || pieceEl.classList.contains('used')) return;
  const idx = +pieceEl.dataset.idx;
  const cellEl = e.target.closest('.pcell');
  const t = tray[idx];
  drag = {
    idx, shape: t.shape, color: t.color, anchor: null,
    grabR: cellEl && !cellEl.classList.contains('empty') ? +cellEl.dataset.r : 0,
    grabC: cellEl && !cellEl.classList.contains('empty') ? +cellEl.dataset.c : 0,
  };
  ghost.innerHTML = '';
  const rows = Math.max(...t.shape.cells.map(([dr]) => dr)) + 1;
  const cols = Math.max(...t.shape.cells.map(([, dc]) => dc)) + 1;
  ghost.style.display = 'grid';
  ghost.style.gridTemplateRows = `repeat(${rows}, auto)`;
  ghost.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  const filled = new Set(t.shape.cells.map(([dr, dc]) => dr + ',' + dc));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const cell = document.createElement('div');
    cell.className = 'pcell' + (filled.has(r + ',' + c) ? '' : ' empty');
    if (filled.has(r + ',' + c)) cell.innerHTML = tileHTML(t.color);
    ghost.appendChild(cell);
  }
  moveGhost(e);
});
function moveGhost(e){
  if (!drag) return;
  const px = cellPx();
  ghost.style.left = (e.clientX - (drag.grabC + 0.5) * px) + 'px';
  ghost.style.top = (e.clientY - (drag.grabR + 0.5) * px - px * 0.7) + 'px';
  drag.anchor = anchorFor(e);
  paintHighlight();
}
document.addEventListener('pointermove', e => { if (drag) moveGhost(e); });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const { idx, shape, color } = drag;
  const anchor = anchorFor(e);
  ghost.style.display = 'none';
  document.querySelectorAll('.cell.hl-ok, .cell.hl-bad').forEach(el => el.classList.remove('hl-ok', 'hl-bad'));
  drag = null;
  if (!fits(board, shape, anchor.r, anchor.c)) { render(); return; }
  board = place(board, shape, anchor.r, anchor.c, color);
  score += shape.cells.length;
  const cleared = clearLines(board);
  board = cleared.board;
  score += linePoints(cleared.lines);
  tray[idx].used = true;
  if (tray.every(t => t.used)) deal();
  best = Math.max(best, score);
  localStorage.setItem('blocksBest', best);
  render();
  const liveShapes = tray.filter(t => !t.used).map(t => t.shape);
  if (!anyFit(board, liveShapes)){
    over = true;
    $('overStats').textContent = `Score ${score} · Best ${best}` +
      (score >= 300 ? ' — constellation builder! 🌌' : score >= 150 ? ' — tidy sky. Lines in pairs pay double-ish, plan for them.' : ' — corners and long lines jam first; keep the middle open.');
    $('over').style.display = 'flex';
  }
});
document.addEventListener('pointercancel', () => {
  drag = null; ghost.style.display = 'none';
  document.querySelectorAll('.cell.hl-ok, .cell.hl-bad').forEach(el => el.classList.remove('hl-ok', 'hl-bad'));
});

$('newBtn').addEventListener('click', newGame);
$('againBtn').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
