const W=916,H=412, cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const GY=330;                       /* ground line (feet) */
let PORTRAIT=false;   /* phone held upright: canvas is CSS-rotated to landscape */
function fitCanvas(){
  PORTRAIT=innerWidth<innerHeight;
  if(PORTRAIT){
    /* rotate the stage so the 916x412 battlefield fills a portrait phone:
       the canvas keeps its landscape size, turned 90 degrees by CSS */
    const s=Math.min(innerHeight/W, innerWidth/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    cv.style.transform='rotate(90deg)';
  } else {
    const s=Math.min(innerWidth/W, innerHeight/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    cv.style.transform='';
  }
}
addEventListener('resize',fitCanvas); fitCanvas();

      const item={col:seed.col,colName:seed.colName,contract:seed.contract,id:seed.id,name:'LUNC Zombie NFT #'+seed.id,rarity:null,skin:null,img:null,imgOk:false};
      try{
        const info=await lcdSmart(seed.contract,{nft_info:{token_id:seed.id}});
        const ext=(info&&info.extension)||{};
        if(ext.name)item.name=ext.name;
        if(ext.image){item.img=ext.image; const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{item.imgOk=true; drawFighterCardImages();}; im.onerror=()=>{item.imgObj=null;}; im.src=ext.image; item.imgObj=im;}
        for(const a of (ext.attributes||[])){

const keys={};
const joy={active:false,id:-1,dx:0,dy:0,cx:64,cy:336};
let fireHeld=false, bombQueued=false, jumpQueued=false;
const cvPos={x:0,y:0,s:1};
function refreshCvPos(){const r=cv.getBoundingClientRect(); cvPos.x=r.left; cvPos.y=r.top; cvPos.s=r.width/W;}
function toGame(e){
  if(PORTRAIT){
    /* CSS rotate(90deg) maps game (x,y) -> client (left + (H-y)*s, top + x*s);
       invert it so taps land where the player sees them */
    const r=cv.getBoundingClientRect(), s=r.height/W;
    return {x:(e.clientY-r.top)/s, y:H-(e.clientX-r.left)/s};
  }
  return {x:(e.clientX-cvPos.x)/cvPos.s, y:(e.clientY-cvPos.y)/cvPos.s};
}
let uiHits=[];   /* rebuilt every frame: {x,y,w,h,fn,id} */
function hitAt(x,y){for(let i=uiHits.length-1;i>=0;i--){const b=uiHits[i]; if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b;} return null;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); refreshCvPos(); audio(); startMusic();
  const p=toGame(e);
  const hit=hitAt(p.x,p.y);
  if(hit){hit.fn(); return;}
  if(screen==='play'){
    if(p.x<W*.4&&p.y>H*.5){ joy.active=true; joy.id=e.pointerId; joy.dx=0; joy.dy=0; }
    else if(p.x>W*.55&&p.y>H*.5){
      const dF=Math.hypot(p.x-848,p.y-330), dB=Math.hypot(p.x-782,p.y-352), dJ=Math.hypot(p.x-848,p.y-252);
      if(dB<34)bombQueued=true; else if(dJ<34)jumpQueued=true; else if(dF<46)fireHeld=true;
    }
  }
});
cv.addEventListener('pointermove',e=>{
  if(!joy.active||e.pointerId!==joy.id)return;
  const p=toGame(e);
  joy.dx=clamp((p.x-joy.cx)/30,-1,1); joy.dy=clamp((p.y-joy.cy)/30,-1,1);
});
function endPointer(e){
  if(e.pointerId===joy.id){joy.active=false; joy.dx=0; joy.dy=0;}
  fireHeld=false;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
addEventListener('keydown',e=>{
  if(pasteFocused)return;
  const k=e.key.toLowerCase();
  keys[k]=true;
  if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k===' '?' ':k))e.preventDefault();
  if(k===' ')jumpQueued=true;
  if(k==='k')bombQueued=true;

});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function moveInput(){
  let mx=0;
  if(keys['arrowleft']||keys['a'])mx-=1;
  if(keys['arrowright']||keys['d'])mx+=1;
  if(joy.active)mx+=joy.dx;

}

/* ================= CAMPAIGN / LEVEL SYSTEM =================
   Levels are DATA: LEVELS[] entries are all the engine reads — world width,
   ruin blocks, spawn table, raft stretch, orb position, start loadout, music
   mood. The campaign plan is 40 levels (Tom, Nov 10: "we only had three
   levels before — we will add 40"). Only Level 1 is playable in this test;
   LEVELS 2–40 on the map are labeled locked ("campaign under construction"),
   never faked as playable. Adding a level = appending one data entry. */
const CAMPAIGN_TOTAL=40;
const LEVELS=[
 {n:1,name:'Operation Dawn Break',world:3540,orbX:3320,
  ruins:[[1150,278,150,52],[1300,226,150,104],[1450,278,140,52],[2050,246,170,84],[2380,278,130,52]],
  raft:{x0:1740,x1:2940,deckY:302,startX:1780},
  spawns:[
   {x:760,kind:'soldier',ex:1350},{x:900,kind:'zed',ex:1480},{x:1050,kind:'soldier',ex:1620},
   {x:1200,kind:'zed2',ex:1750},{x:1380,kind:'soldier',ex:1900},{x:1500,kind:'zed',ex:1980},
   {x:1700,kind:'soldier',ex:2100},{x:1850,kind:'zed',ex:2250},{x:2000,kind:'soldier',ex:2400},
   {x:2560,kind:'soldier',ex:3050,bank:true},{x:2620,kind:'zed',ex:3180,bank:true},
   {x:2900,kind:'soldier',ex:3260},{x:2950,kind:'zed2',ex:3400},{x:3020,kind:'soldier',ex:3440}],
  startAmmo:226,startBombs:14,startFrg:5.2,startLunc:518}
];
let LV=LEVELS[0];
const WORLD=()=>LV.world, ORBX=()=>LV.orbX;
const RUINS=LV.ruins;
const PLATS=RUINS.map(r=>({x:r[0],y:r[1],w:r[2]}));
function platsAt(x){ /* standable tops under a world x */
  const out=[GY];
  for(const p of PLATS){ if(x>p.x-8&&x<p.x+p.w+8)out.push(p.y); }
  if(G&&G.onRaft)out.push(LV.raft.deckY);
  return out;
}
function ruinTopAt(x,feetY){ /* top of the ruin block a wall-climb should land on (<= the feet), or null */
  let best=null;
  for(const p of PLATS){ if(x>p.x-8&&x<p.x+p.w+8){ const t=p.y; if(feetY>=t-6&&t<GY&&(best===null||t<best))best=t; } }
  return best;
}
/* floor for an entity: only tops its feet are near/above count (no teleporting up) */
function floorFor(x,feetY){
  let f=GY;
  for(const p of PLATS){ if(x>p.x-8&&x<p.x+p.w+8&&feetY<=p.y+16&&p.y<f)f=p.y; }
  return f;
}
/* ruins are solid blocks: if feet are well below a top, the block is a wall */
function wallClamp(e){
  for(const p of PLATS){
    if(e.y>p.y+14&&e.x>p.x-13&&e.x<p.x+p.w+13){
      e.x=(e.x<p.x+p.w/2)?p.x-13:p.x+p.w+13;
    }
  }
}
function heroMaxHp(){ return Math.round(665*(fighter?fighter.mult:1)); }
function heroDmgMult(){ return fighter?fighter.mult:1; }
function squadBonus(){ return fighter?Math.min(3,Math.max(0,nftList.length-1)):0; }
const SPAWNS=()=>LV.spawns;
function newGame(){

  G={t:0,time:0,lastBombT:-1,hero:{x:60,y:GY,vy:0,face:1,wp:0,moving:false,aim:0,muzzle:0,ground:true,hp:maxHp,maxHp:maxHp},
     cam:0,shake:0,ammo:LV.startAmmo,bombs:LV.startBombs,frg:LV.startFrg,lunc:LV.startLunc,kills:0,total:LV.spawns.length,
     enemies:[],bullets:[],pickups:[],floaters:[],spawned:LV.spawns.map(()=>false),
     lastShot:0,lastEShot:0,reload:0,onRaft:false,raftX:LV.raft.startX,orbTaken:false,endT:0,deadT:0,score:0};
  screen='play';
}
function spawnEnemy(sp){
  const base=sp.kind==='soldier'?SOLDIER:(sp.kind==='zed'?ZED:ZED2);
  G.enemies.push({kind:sp.kind,base,x:sp.ex,y:sp.bank?300:GY,vy:0,ground:true,hp:sp.kind==='soldier'?3:2,dead:0,wp:rr(0,9),bank:!!sp.bank,shotCd:rr(1,2.4),flash:0});
}
function heroFire(){
  const h=G.hero; if(G.ammo<=0||G.reload>0)return;
  h.muzzle=.07; G.ammo--; SFX.shot();
  if(G.ammo===0){G.reload=1.1; G.floaters.push({x:h.x,y:h.y-110,txt:'RELOADING…',age:0,col:'#ffd968'});}
  const mx=h.x+h.face*52, my=h.y-56;
  G.bullets.push({x:mx,y:my,vx:h.face*760,life:.85,foe:false,dmg:heroDmgMult()});
  spawnPart({x:mx+h.face*8,y:my,vx:h.face*rr(10,40),vy:rr(-24,6),life:.24,max:.24,r:2.2,col:'#ffd98a'});
}
function killEnemy(e){
  e.dead=.0001; G.kills++; SFX.die();
  const n=e.kind==='soldier'?3:2;
  for(let i=0;i<n;i++){const isF=i%2===0;
    G.pickups.push({x:e.x+rr(-8,8),y:e.y-52,vx:rr(-30,50),vy:rr(-190,-120),kind:isF?'frg':'lunc',age:0});}
  const sq=squadBonus();
  for(let i=0;i<sq;i++)G.pickups.push({x:e.x+rr(-12,12),y:e.y-46,vx:rr(-40,60),vy:rr(-200,-130),kind:i%2?'lunc':'frg',age:0});
  G.floaters.push({x:e.x,y:e.y-96,txt:e.kind==='soldier'?'+ FRG  + LUNC':'+ LUNC',age:0});
  for(let i=0;i<10;i++)spawnPart({x:e.x,y:e.y-40,vx:rr(-70,70),vy:rr(-120,-10),life:rr(.3,.6),max:.6,r:rr(1.6,3.4),col:i%2?'#9db98a':'#5c7350',grav:300});
  if(e.kind==='soldier'&&Math.random()<.5)G.pickups.push({x:e.x,y:e.y-40,vx:rr(-16,16),vy:-160,kind:'ammo',age:0});
}
function throwBomb(){
  if(G.bombs<=0)return;
  G.bombs--; const h=G.hero, bx=h.x+h.face*300, by=GY;
  G.lastBombT=G.time;
  G.shake=9; SFX.boom();
  for(let i=0;i<42;i++)spawnPart({x:bx+rr(-26,26),y:by-rr(0,26),vx:rr(-190,190),vy:rr(-260,-30),life:rr(.35,.8),max:.8,r:rr(2.5,6),col:['#ffb03a','#ff7a26','#e2543e','#ffd98a'][i%4],grav:240,grow:true});
  for(let i=0;i<16;i++)spawnPart({x:bx+rr(-14,14),y:by-8,vx:rr(-40,40),vy:rr(-90,-30),life:rr(.6,1.1),max:1.1,r:rr(4,9),col:'#3a3a3a',alpha:.4,grow:true});
  for(const e of G.enemies){if(e.dead===0&&!e.bank&&Math.abs(e.x-bx)<190)killEnemy(e);}
  G.floaters.push({x:bx,y:GY-130,txt:'BOOM!',age:0,big:true});
}
function hurtHero(dmg){
  const h=G.hero; if(screen!=='play'||G.orbTaken)return;
  h.hp-=dmg; SFX.hurt();
  spawnPart({x:h.x,y:h.y-50,vx:rr(-40,40),vy:rr(-80,-10),life:.3,max:.3,r:2.6,col:'#c94436'});
  if(h.hp<=0){h.hp=0; screen='dead'; G.deadT=0; stopMusic();}
}
function stepGame(dt){
  const h=G.hero; G.t+=dt; if(screen==='play')G.time+=dt;
  /* spawns by hero progress */
  SPAWNS().forEach((sp,i)=>{ if(!G.spawned[i]&&h.x>=sp.x){G.spawned[i]=true; spawnEnemy(sp);} });
  /* reload */
  if(G.reload>0){G.reload-=dt; if(G.reload<=0){G.ammo=226; G.floaters.push({x:h.x,y:h.y-110,txt:'AMMO READY',age:0,col:'#9fe8a9'});}}
  /* ----- hero movement ----- */
  const mx=moveInput();
  const onRaftZone=h.x>LV.raft.x0&&h.x<LV.raft.x1;
  if(onRaftZone&&!G.onRaft){G.onRaft=true;}
  if(h.x>=LV.raft.x1&&G.onRaft){G.onRaft=false;}
  const speed=G.onRaft?60:215;
  if(!G.onRaft){
    if(Math.abs(mx)>.12){h.face=mx>0?1:-1; h.x+=mx*speed*dt; h.moving=true;}
    else h.moving=false;
  } else {
    G.raftX=Math.min(LV.raft.x1-60,G.raftX+92*dt);
    h.x=G.raftX+66; h.moving=false; if(Math.abs(mx)>.12)h.face=mx>0?1:-1;
  }
  h.x=clamp(h.x,30,WORLD()-40);
  if(!G.onRaft)wallClamp(h);
  /* vertical: raft deck or platforms */
  /* jump: a held jump into a ruin wall climbs it (step-stone rule from the
     preview/Garuda tower): feet below the top by <= 104px and rising ->
     step up onto that top. Ordinary running into a wall still blocks. */
  if(jumpQueued){jumpQueued=false;
    if(h.ground&&!G.onRaft){
      const climbTo=ruinTopAt(h.x+h.face*16,h.y);
      if(climbTo!==null&&h.y-climbTo>0){ h.y=climbTo; h.ground=true; SFX.jump(); }
      else { h.vy=-560; h.ground=false; SFX.jump(); }
    }}
  const floorY=G.onRaft?LV.raft.deckY:floorFor(h.x,h.y);
  if(!h.ground||h.y<floorY){
    h.vy+=1500*dt; h.y+=h.vy*dt;
    if(h.y>=floorY){h.y=floorY; h.vy=0; h.ground=true;}
  } else { h.y=floorY; h.ground=true; }
  if(G.onRaft)h.y=LV.raft.deckY+Math.sin(G.t*1.8)*2.5;
  if(h.moving&&h.ground)h.wp+=dt*11; else h.wp*=.85;
  /* fire */
  const wantFire=fireInput();
  let tgt=null,bd=1e9;
  for(const e of G.enemies){if(e.dead>0)continue; const d=(e.x-h.x)*h.face; if(d>20&&d<bd){bd=d;tgt=e;}}
  h.aim=tgt&&bd<520?1:0;
  if(wantFire&&G.t-G.lastShot>.17){G.lastShot=G.t; heroFire();}
  if(bombQueued){bombQueued=false; if(!G.onRaft)throwBomb();}
  if(h.muzzle>0)h.muzzle-=dt;
  /* ----- enemies ----- */
  for(const e of G.enemies){
    if(e.dead>0){e.dead=Math.min(1,e.dead+dt*3); continue;}
    if(e.flash>0)e.flash-=dt;
    const d=h.x-e.x, ad=Math.abs(d);
    if(!e.bank){
      /* settle to a floor (same rules as the hero — no teleporting up blocks) */
      const ef=floorFor(e.x,e.y);
      if(e.y<ef){e.vy+=1500*dt; e.y+=e.vy*dt; if(e.y>=ef){e.y=ef;e.vy=0;}}
      else e.y=ef;
      if(e.kind==='soldier'){
        if(ad>240)e.x+=Math.sign(d)*34*dt;
        wallClamp(e);
        e.wp+=dt*5;
        e.shotCd-=dt;
        if(e.shotCd<0&&ad<430&&Math.abs(e.y-h.y)<70){e.shotCd=rr(1.5,2.6);
          G.bullets.push({x:e.x+Math.sign(d)*46,y:e.y-54,vx:Math.sign(d)*560,life:.85,foe:true,dmg:26});
          if(Math.random()<.5)SFX.eshot();}
      } else {
        if(ad>44)e.x+=Math.sign(d)*(e.kind==='zed'?46:56)*dt;
        wallClamp(e);
        e.wp+=dt*8;
        if(ad<=46&&Math.abs(e.y-h.y)<60){ e.atk=(e.atk||0)+dt; if(e.atk>.7){e.atk=0; hurtHero(38);} }
      }
    } else {
      if(ad>260)e.x-=26*dt;
      e.wp+=dt*5;
      if(e.kind==='soldier'){ e.shotCd-=dt;
        if(e.shotCd<0&&ad<520){e.shotCd=rr(1.6,2.8);
          G.bullets.push({x:e.x-46,y:e.y-54,vx:-560,life:.9,foe:true,dmg:26}); if(Math.random()<.5)SFX.eshot();} }
    }
  }
  /* ----- bullets ----- */
  for(const b of G.bullets){
    b.life-=dt; b.x+=b.vx*dt;
    if(b.foe){
      if(Math.abs(b.x-h.x)<20&&b.y>h.y-84&&b.y<h.y){b.life=0; hurtHero(b.dmg||26);}
    } else {
      for(const e of G.enemies){
        if(e.dead>0)continue;
        if(Math.abs(b.x-e.x)<22&&b.y>e.y-88&&b.y<e.y){ b.life=0; e.hp-=b.dmg; e.flash=.08; SFX.hit();
          spawnPart({x:b.x,y:b.y,vx:rr(-30,30),vy:rr(-40,0),life:.2,max:.2,r:2,col:'#cfe8b0'});
          if(e.hp<=0)killEnemy(e);
          break; }
      }
    }
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
  /* ----- pickups ----- */
  for(const p of G.pickups){
    p.age+=dt;
    if(p.age<.5){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=620*dt; if(p.y>GY-8){p.y=GY-8;p.vy*=-.35;}}
    else{
      if(p.kind==='ammo'){ if(Math.abs(p.x-h.x)<30&&Math.abs(p.y-(h.y-40))<56){p.done=true; G.ammo=Math.min(226,G.ammo+40); G.reload=0; G.floaters.push({x:h.x,y:h.y-104,txt:'+40 AMMO',age:0,col:'#a8c6dc'});} continue; }
      const tx=p.kind==='frg'?352:480, ty=25, sx=p.x-G.cam;
      const nx=sx+(tx-sx)*Math.min(1,dt*7), ny=p.y+(ty-p.y)*Math.min(1,dt*7);
      p.x=nx+G.cam; p.y=ny;
      if(Math.abs(tx-sx)<14&&Math.abs(ty-p.y)<12){p.done=true;
        if(p.kind==='frg'){G.frg+=.3; SFX.pickupF();} else {G.lunc+=6; SFX.pickupL();}}
    }
    if(p.age>7&&p.kind==='ammo')p.done=true;
  }
  G.pickups=G.pickups.filter(p=>!p.done);
  for(const f of G.floaters)f.age+=dt;
  G.floaters=G.floaters.filter(f=>f.age<1.5);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*22);
  stepParts(dt);
  /* camera */
  const target=G.onRaft?clamp(h.x-330,1450,2380):clamp(h.x-300,0,WORLD()-W+40);
  G.cam+=(target-G.cam)*Math.min(1,dt*5);
  /* orb */
  if(!G.orbTaken&&h.x>ORBX()-30&&G.kills>=G.total){ grabOrb(); }
  if(G.orbTaken){ G.endT+=dt; }
}
function grabOrb(){
  G.orbTaken=true; SFX.orb(); startMusic();
  for(let i=0;i<22;i++)spawnPart({x:ORBX()+16,y:GY-96,vx:rr(-90,90),vy:rr(-140,20),life:rr(.4,.9),max:.9,r:rr(1.6,3.4),col:i%2?'#aef2ff':'#f5c542',grav:120});
  G.frg+=2.4; G.lunc+=120;
  setTimeout(()=>{ if(screen==='play'&&G&&G.orbTaken){ finishMission(); } },1400);
}
function missionScore(){ return Math.round(G.lunc + G.frg*10 + G.kills*25 + Math.max(0,600-G.time*2)); }
function finishMission(){
  screen='complete'; stopMusic(); SFX.orb();
  const sc=missionScore();

function wrapText(txt,x,y,maxW,lh){
  const words=String(txt).split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy); line=w; yy+=lh;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy;
}

      if(!G.orbTaken&&G.kills<G.total){
        ctx.fillStyle='rgba(255,157,138,.95)'; ctx.font='700 11px Arial'; ctx.textAlign='center';
        ctx.fillText('🔒 '+G.kills+'/'+G.total,px,GY-140); ctx.textAlign='left';
      }
    }
  }
  drawEntities();
  g.fillStyle='rgba(6,12,6,.85)';
  g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=26){const gx=x+((cam*1.6)%26); g.lineTo(x,H-8-((gx*7)%13));}
  g.lineTo(W,H); g.closePath(); g.fill();
}
function drawEntities(){
  const g=ctx, cam=G.cam, h=G.hero;
  for(const e of G.enemies){
    const sx=e.x-cam; if(sx<-80||sx>W+80)continue;
    drawFighter(sx,e.y,{...e.base,face:e.x>h.x?1:-1,moving:e.dead===0,walkPhase:e.wp,aim:e.kind==='soldier'?.8:0,dead:e.dead,scale:e.bank?.92:1});
    if(e.dead===0){
      const hpMax=e.kind==='soldier'?3:2, frac=clamp(e.hp/hpMax,0,1);
      if(frac<1){ g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(sx-16,e.y-102,32,4.5);
        g.fillStyle=frac>.45?'#59d977':'#e2543e'; g.fillRect(sx-16,e.y-102,32*frac,4.5); }
      if(e.flash>0){ g.fillStyle='rgba(255,240,200,.25)'; g.beginPath(); g.arc(sx,e.y-46,26,0,7); g.fill(); }
    }
  }
  /* hero — the selected Commando or the base zombie hero */
  const style=fighter?fighter.style:HERO_BASE;
  drawFighter(h.x-cam,h.y,{...style,face:h.face,moving:h.moving,walkPhase:h.wp,aim:h.aim,muzzle:h.muzzle>0?1:0,scale:1.06,dead:screen==='dead'?Math.min(1,G.deadT*1.4):0});
  if(fighter&&screen!=='dead'){
    g.fillStyle='rgba(255,217,104,.9)'; g.font='700 9.5px Arial'; g.textAlign='center';
    g.fillText('🎖 #'+fighter.id,g,h.x-cam,h.y-100); g.textAlign='left';
  }
  /* bullets */
  g.strokeStyle='#ffe9a8'; g.lineWidth=2.4;
  for(const b of G.bullets){
    const bx=b.x-cam;
    g.globalAlpha=.9; g.beginPath(); g.moveTo(bx,b.y); g.lineTo(bx+(b.vx>0?13:-13),b.y); g.stroke();
    g.fillStyle='#fff6d8'; g.fillRect(bx+(b.vx>0?11:-13),b.y-1,3,2);
  }
  g.globalAlpha=1;
  for(const p of G.pickups){
    const sx=p.x-cam;
    if(p.kind==='frg')frgGem(sx,p.y,8);
    else if(p.kind==='lunc')crescentDraw(sx,p.y,8,'#f5c542');
    else { g.fillStyle='#a8c6dc'; roundRect(sx-7,p.y-5,14,10,2); g.fill(); g.fillStyle='#16222c'; g.font='900 8px Arial'; g.textAlign='center'; g.fillText('A',sx,p.y+3); g.textAlign='left'; }
  }
  g.textAlign='center';
  for(const f of G.floaters){
    g.globalAlpha=clamp(1.4-f.age,0,1);
    g.font=(f.big?'900 30px':'700 13px')+' Arial';
    g.fillStyle=f.col||(f.big?'#ffb03a':'#ffe9a8');
    g.fillText(f.txt,f.x-cam,f.y-f.age*36);
  }
  g.globalAlpha=1; g.textAlign='left';
  drawParts();
}
function drawHUD(){
  const g=ctx, h=G.hero;
  /* portrait — NFT image when a Commando is selected */
  g.fillStyle='rgba(8,14,10,.78)'; roundRect(10,10,58,72,7); g.fill();
  g.strokeStyle=fighter?'#f5c542':'rgba(190,220,200,.5)'; g.lineWidth=fighter?2:1.4; roundRect(10,10,58,72,7); g.stroke();
  if(fighter&&fighter.imgObj&&fighter.img&&fighter.imgObj.complete&&fighter.imgObj.naturalWidth>0){
    try{ g.save(); roundRectPath(g,13,13,52,52,5); g.clip(); g.drawImage(fighter.imgObj,13,13,52,52); g.restore(); }catch(e){ drawPortrait(g,fighter.style,39,44,.62); }
  } else drawPortrait(g,fighter?fighter.style:HERO_BASE,39,44,.62);
  g.fillStyle='#dff2e2'; g.font='700 10px Arial'; g.textAlign='center';
  g.fillText(fighter?('#'+fighter.id):'ZED-1',39,76); g.textAlign='left';
  /* HP */
  g.fillStyle='rgba(8,14,10,.78)'; roundRect(74,12,168,17,4); g.fill();
  g.fillStyle='#12241a'; roundRect(76,14,164,13,3); g.fill();
  const frac=clamp(h.hp/h.maxHp,0,1), hpw=164*frac;
  const hpg=g.createLinearGradient(76,0,240,0); hpg.addColorStop(0,frac>.3?'#59d977':'#e2543e'); hpg.addColorStop(1,frac>.3?'#2f9e57':'#a02c22');
  g.fillStyle=hpg; if(hpw>2){roundRect(76,14,hpw,13,3); g.fill();}
  g.fillStyle='#eaf7ec'; g.font='700 11.5px Arial';
  g.fillText(String(Math.ceil(h.hp))+' / '+h.maxHp,84,25);
  /* Ammo / Bombs */
  g.font='700 12.5px Arial';
  g.fillStyle='rgba(168,198,220,.92)'; roundRect(74,36,86,19,3); g.fill();
  g.fillStyle='rgba(168,198,220,.92)'; roundRect(166,36,86,19,3); g.fill();
  g.fillStyle='#16222c'; g.fillText(T('ammo'),80,50); g.fillText(T('bombs'),172,50);
  g.textAlign='right'; g.fillText(G.reload>0?'···':String(G.ammo),154,50); g.fillText(String(G.bombs),246,50); g.textAlign='left';
  /* counters */
  function capsule(x,drawIcon,val){
    g.fillStyle='rgba(10,14,16,.82)'; roundRect(x,10,118,30,15); g.fill();
    g.strokeStyle='rgba(200,220,230,.35)'; g.lineWidth=1.2; roundRect(x,10,118,30,15); g.stroke();
    drawIcon(x+22,25);
    g.fillStyle='#f2f6f2'; g.font='700 16px Arial'; g.textAlign='center'; g.fillText(val,x+72,31); g.textAlign='left';
  }
  capsule(330,(x,y)=>frgGem(x,y,9),G.frg.toFixed(1));
  capsule(458,(x,y)=>crescentDraw(x,y,10,'#f5c542'),String(Math.round(G.lunc)));
  g.fillStyle='rgba(245,197,66,.95)'; g.font='700 9.5px Arial'; g.textAlign='center';
  g.fillText('F R G',352,49); g.fillText('L U N C',480,49);
  g.fillStyle='rgba(230,245,240,.85)'; g.font='700 11px Arial';
  g.fillText('☠ '+G.kills+'/'+G.total+' · ⏱ '+fmtTime(G.time),640,26);
  g.textAlign='left';
  /* MY FIGHTER tile */
  g.fillStyle='rgba(8,14,10,.78)'; roundRect(806,10,100,64,8); g.fill();
  g.strokeStyle='#f5c542'; g.lineWidth=1.6; roundRect(806,10,100,64,8); g.stroke();
  if(fighter&&fighter.imgObj&&fighter.imgObj.complete&&fighter.imgObj.naturalWidth>0){
    try{ g.save(); roundRectPath(g,812,16,40,40,5); g.clip(); g.drawImage(fighter.imgObj,812,16,40,40); g.restore(); }catch(e){ drawPortrait(g,fighter.style,832,40,.5); }
  } else drawPortrait(g,fighter?fighter.style:HERO_BASE,832,40,.5);
  g.fillStyle='#ffd968'; g.font='900 10px Arial'; g.fillText('MY',848,26);
  g.fillStyle='#fff'; g.fillText('FIGHTER',848,39);
  g.fillStyle='#f5c542'; roundRect(848,46,44,14,3); g.fill();
  g.fillStyle='#1a1406'; g.font='900 9.5px Arial'; g.textAlign='center'; g.fillText(fighter?('#'+fighter.id):'NFT',870,56.5); g.textAlign='left';
  /* touch controls */
  const jx=64, jy=336, knob=joy.active?joy.dx*14:(G&&G.hero.moving?10:3);
  g.fillStyle='rgba(10,16,12,.4)'; g.beginPath(); g.arc(jx,jy,35,0,7); g.fill();
  g.strokeStyle='rgba(220,240,225,.55)'; g.lineWidth=2; g.beginPath(); g.arc(jx,jy,35,0,7); g.stroke();
  g.fillStyle='rgba(220,240,225,.35)'; g.beginPath(); g.arc(jx+knob,jy,16,0,7); g.fill();
  g.strokeStyle='rgba(220,240,225,.7)'; g.beginPath(); g.arc(jx+knob,jy,16,0,7); g.stroke();
  /* jump button */
  g.fillStyle='rgba(10,16,12,.4)'; g.beginPath(); g.arc(848,252,24,0,7); g.fill();
  g.strokeStyle='rgba(220,240,225,.6)'; g.lineWidth=2; g.beginPath(); g.arc(848,252,24,0,7); g.stroke();
  g.fillStyle='rgba(240,248,240,.9)'; g.font='900 15px Arial'; g.textAlign='center'; g.fillText('▲',848,258); g.textAlign='left';
  /* fire button */
  g.fillStyle=fireHeld?'rgba(80,20,16,.55)':'rgba(10,16,12,.4)'; g.beginPath(); g.arc(848,330,31,0,7); g.fill();
  g.strokeStyle='rgba(255,220,220,.65)'; g.lineWidth=2; g.beginPath(); g.arc(848,330,31,0,7); g.stroke();
  g.strokeStyle='rgba(255,240,240,.9)';
  g.beginPath(); g.arc(848,330,13,0,7); g.stroke();
  g.beginPath(); g.moveTo(848,312); g.lineTo(848,322); g.moveTo(848,338); g.lineTo(848,348);
  g.moveTo(830,330); g.lineTo(840,330); g.moveTo(856,330); g.lineTo(866,330); g.stroke();
  g.fillStyle='#ff5340'; g.beginPath(); g.arc(848,330,3,0,7); g.fill();
  /* bomb button */
  g.fillStyle='rgba(10,16,12,.4)'; g.beginPath(); g.arc(782,352,20,0,7); g.fill();
  g.strokeStyle='rgba(220,240,225,.55)'; g.beginPath(); g.arc(782,352,20,0,7); g.stroke();
  g.fillStyle='#2c3136'; g.beginPath(); g.arc(782,355,8.5,0,7); g.fill();
  g.fillStyle='#8a929a'; g.fillRect(779,343,6,5);
  /* mute mini-toggle, obvious state */
  drawBtn(W-64,84,54,22,SOUND?'🔊 ON':'🔇 OFF',{fs:10.5,fill:SOUND?'rgba(20,50,30,.9)':'rgba(50,20,20,.9)',stroke:SOUND?'#59d977':'#e2543e',col:'#fff',r:6});
  regBtn('sound',W-64,84,54,22,()=>setSound(!SOUND));
}
function drawEndPanel(won){
  const g=ctx;
  g.fillStyle='rgba(3,7,5,.45)'; g.fillRect(0,0,W,H);
  g.save(); g.textAlign='center';
  g.fillStyle='rgba(5,16,14,.92)'; roundRect(W/2-250,86,500,208,12); g.fill();
  g.strokeStyle=won?'#3fd68f':'#e2543e'; g.lineWidth=2.2; roundRect(W/2-250,86,500,208,12); g.stroke();
  g.fillStyle='#f2fbf8'; g.font='700 20px Arial'; g.fillText(T('brief'),W/2,124);
  g.fillStyle=won?'#59d977':'#ff8a76'; g.font='900 26px "Arial Black",Arial,sans-serif';
  g.fillText(won?T('complete'):T('failed'),W/2,160);
  g.font='700 14.5px Arial'; g.fillStyle='#e6f5f0';
  if(won){
    const sc=G.finalScore||missionScore();
    g.fillText('⭐ '+sc+'   ·   ☠ '+G.kills+'/'+G.total+'   ·   ⏱ '+fmtTime(G.time),W/2,192);
    g.font='600 12.5px Arial'; g.fillStyle='#ffd968';
    g.fillText('FRG '+G.frg.toFixed(1)+'  ·  LUNC '+Math.round(G.lunc)+(fighter?'  ·  🎖 '+fighter.name:''),W/2,216);
    if(G.newBest){ g.fillStyle='#9fe8a9'; g.font='700 12px Arial'; g.fillText('⭐ NEW BEST ON THIS DEVICE',W/2,240); }
  } else {
    g.font='600 13px Arial'; g.fillStyle='rgba(230,245,240,.85)';
    wrapTextCenter(T('dead'),W/2,190,440,17);
    g.font='700 13px Arial'; g.fillStyle='#ffd968';
    g.fillText('☠ '+G.kills+'/'+G.total+'  ·  ⏱ '+fmtTime(G.time),W/2,240);
  }
  g.restore();
  drawBtn(W/2-170,308,160,38,won?T('again'):T('retry'),{fs:13.5});
  regBtn('again',W/2-170,308,160,38,()=>{SFX.click(); newGame();});
  drawBtn(W/2+10,308,160,38,T('toTitle'),{fs:13.5,fill:'rgba(10,30,30,.92)',stroke:'rgba(64,200,190,.8)',col:'#dff7f1'});
  regBtn('title',W/2+10,308,160,38,()=>{SFX.click(); screen='title'; G=null;});
}
function wrapTextCenter(txt,cx,y,maxW,lh){
  const words=String(txt).split(' '); let line='', yy=y;
  for(const w of words){ const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,cx,yy); line=w; yy+=lh;} else line=test; }
  if(line)ctx.fillText(line,cx,yy);
  return yy;
}
/* ---- main render ---- */
function render(now){
  uiHits=[];
  const t=now/1000;
  ctx.save();
  if(G&&G.shake>0)ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);
  if(screen==='title')drawTitle(t);
  else if(screen==='brief')drawBrief(t);
  else if(screen==='play'||screen==='dead'||screen==='complete'){
    drawWorld(); drawHUD();
    if(screen==='dead')drawEndPanel(false);
    if(screen==='complete')drawEndPanel(true);
    if(G.orbTaken&&screen==='play'){
      ctx.save(); ctx.textAlign='center';
      ctx.fillStyle='rgba(5,16,14,.85)'; roundRect(W/2-238,120,476,86,10); ctx.fill();
      ctx.strokeStyle='#3fd68f'; ctx.lineWidth=2; roundRect(W/2-238,120,476,86,10); ctx.stroke();
      ctx.fillStyle='#f2fbf8'; ctx.font='700 21px Arial'; ctx.fillText(T('brief'),W/2,152);
      ctx.fillStyle='#59d977'; ctx.font='900 25px Arial'; ctx.fillText(T('complete'),W/2,186);
      ctx.restore();
    }
  }
  ctx.restore();
  if(langOpen)drawLangGrid();
  /* portrait phones: the stage itself is CSS-rotated to fill the screen
     (fitCanvas), so no rotate nag is needed — the game just plays turned. */
  pasteBox.style.display=(screen==='brief'&&!langOpen)?'block':'none';
  if(screen==='brief')layoutPasteBox();
}
/* language selector opens picker (override the cycling registration) */

/* ================= 9 · MAIN LOOP + QA HOOKS ================= */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(screen==='play'&&G)stepGame(dt);
  else if(screen==='dead'&&G){G.deadT+=dt; stepParts(dt);}
  render(now);
  requestAnimationFrame(loop);
}
initEmbers();
requestAnimationFrame(loop);
/* QA / debug hooks (read-only state + scenario driver) */
window.__z2={
  get state(){return {screen,lang:LANG,sound:SOUND,kills:G?G.kills:0,total:G?G.total:0,frg:G?G.frg:0,lunc:G?G.lunc:0,
    hp:G?Math.round(G.hero.hp):0,maxHp:G?G.hero.maxHp:0,ammo:G?G.ammo:0,bombs:G?G.bombs:0,heroX:G?Math.round(G.hero.x):0,
    onRaft:G?G.onRaft:false,orb:G?G.orbTaken:false,time:G?Math.round(G.time):0,
    fighter:fighter?{name:fighter.name,id:fighter.id,col:fighter.col,rarity:fighter.rarity,mult:fighter.mult}:null,
    lastBombT:G?G.lastBombT:-1, enemies:G?G.enemies.filter(e=>e.dead===0).map(e=>({kind:e.kind,x:Math.round(e.x)})):[],
    level:LV.n, campaign:CAMPAIGN_TOTAL,
    nftStatus,nftCount:nftList.length,best:loadBest()};},
  start(){screen='brief';},
  enter(){newGame();},
  key(k,down){ if(down){keys[k]=true; if(k===' ')jumpQueued=true; if(k==='k')bombQueued=true;} else keys[k]=false; },
  selectFighter, clearFighter,
  fire(on){fireHeld=!!on;},
  bomb(){bombQueued=true;},
  jump(){jumpQueued=true;},
  teleport(x){if(G){G.hero.x=x; G.cam=clamp(x-300,0,WORLD-W+40);}},
  lookup:lookupNFT,
  setLang(l){if(I18N[l]){LANG=l; localStorage.setItem('z2lang',LANG);}},
  hit(x,y){const h=hitAt(x,y); if(h){h.fn(); return h.id;} return null;}
};
