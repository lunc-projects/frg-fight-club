   One mission: OPERATION DAWN BREAK. Test route only — not published.
   Sections: 1 i18n · 2 storage/settings · 3 audio · 4 art layers (from
   the approved preview) · 5 NFT fighter (Garuda pattern) · 6 input ·
   7 game core · 8 screens/render · 9 QA hooks
   ===================================================================== */
const W=916,H=412, cv=document.getElementById('cv'), ctx=cv.getContext('2d');
/* CLEAN/CRISP pass (Tom, Nov 10: "more clean, more crisp, more real
   looking"): the canvas BACKING STORE renders above CSS pixels —
   capped at 1.5x — so the hero, tracers, art and HUD text are sharp
   on high-density phone screens. Drawing stays in game units —
   fitCanvas() sets the transform — and the stage SCALE
   (getBoundingClientRect) the input/paste-box/pair-box math reads is
   CSS-based and unchanged. The cap is 1.5, not 2: measured in sandbox
   Chromium, 2x doubled the frame cost (16.7ms -> ~29ms, i.e. ~34fps)
   while 1.5x held ~60fps. Sustained frame pressure (rolling average
   frame time over ~34ms for 3s) drops the cap to 1 automatically so a
   hot phone keeps its frame rate; the drop is logged, never silent. */
let DPR_CAP=1.5, dprDropLogged=false;
let DPR=Math.min((typeof devicePixelRatio!=='undefined'?devicePixelRatio:1)||1,DPR_CAP);
const GY=330;                       /* ground line (feet) */
let PORTRAIT=false;   /* phone held upright: canvas is CSS-rotated to landscape */
function fitCanvas(){
  PORTRAIT=innerWidth<innerHeight;
  DPR=Math.min((typeof devicePixelRatio!=='undefined'?devicePixelRatio:1)||1,DPR_CAP);
  const bw=Math.round(W*DPR), bh=Math.round(H*DPR);
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(PORTRAIT){
    /* rotate the stage so the 916x412 battlefield fills a portrait phone:
       the canvas keeps its landscape size, turned 90 degrees by CSS */
    const s=Math.min(innerHeight/W, innerWidth/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    cv.style.transform='rotate(90deg)';
  } else {
    const s=Math.min(innerWidth/W, innerHeight/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    cv.style.transform='';
  }
}
addEventListener('resize',fitCanvas); fitCanvas();

/* ================= 3 · AUDIO (WebAudio, synthesized) ================= */
let AC=null, musicTimer=null, musicStep=0;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol,slideTo){
  if(!SOUND)return; const ac=audio(); if(!ac)return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,ac.currentTime);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,ac.currentTime+dur);
  g.gain.setValueAtTime(vol||.12,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
function noiseBurst(dur,vol,low){
  if(!SOUND)return; const ac=audio(); if(!ac)return;
  const len=Math.floor(ac.sampleRate*dur), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=low||900;
  const g=ac.createGain(); g.gain.value=vol||.3;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}

/* moody minor loop — bass pulse + sparse high notes, very quiet */
const BASSSEQ=[55,0,55,0,65.4,0,55,0,49,0,49,0,58.3,0,73.4,0];
function musicTick(){
  if(!SOUND||!AC)return;
  const s=musicStep%16;
  const f=BASSSEQ[s];
  if(f)blip(f,.34,'triangle',.10);
  if(s%8===4)blip(440*Math.pow(2,[0,3,5,3][(musicStep>>3)%4]/12),.5,'sine',.028);
  musicStep++;
}
function startMusic(){ if(musicTimer)return; audio(); musicTimer=setInterval(musicTick,215); }
function stopMusic(){ if(musicTimer){clearInterval(musicTimer); musicTimer=null;} }

let _s=1337;
function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+rnd()*(b-a);}
function resetRng(){_s=1337;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function roundRectPath(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function roundRect(x,y,w,h,r){roundRectPath(ctx,x,y,w,h,r);}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function makeStrip(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;}
function speckle(g,w,h,n,cols,aMin,aMax,sMin,sMax){for(let i=0;i<n;i++){g.globalAlpha=rr(aMin,aMax);g.fillStyle=cols[(rnd()*cols.length)|0];g.beginPath();g.ellipse(rr(0,w),rr(0,h),rr(sMin,sMax),rr(sMin,sMax)*.6,rr(0,3),0,7);g.fill();}g.globalAlpha=1;}

const swampFar=makeStrip(1600,412,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2c4a3a');gr.addColorStop(.5,'#1a2f22');gr.addColorStop(1,'#0b1710');

/* ---- NFT art as the in-level character (Garuda rule: the selected NFT IS
   the playable character). The token's own artwork rides the hero rig as a
   framed fighter figure: walk bob + lean, fire recoil + muzzle flash, red
   flash on hit, fall on death. The front-facing art is never redrawn into a
   fake side profile. If the art failed to load, the caller falls back to the

/* ================= NFT CUT-OUT BUILDER (Garuda rule) =================
   Tom (Nov 10): "Fix the character like we did with Garuda — can't be a
   square, has to be a cut-out character. With legs." Same pattern as the
   Garuda full-body pack: the token's OWN art, cut out of its backdrop,
   palette sampled from the art, lower body completed underneath.
   Matte v2 (Nov 11): border flood where EVERY border pixel seeds
   with its own colour as its front reference (STEP gates local drift,
   CAP gates distance from the seed colour), the fighter = largest
   remaining blob plus severed fragments that live inside its box, and
   a solidify pass that fills the silhouette solid — see buildCutout.
   Honest sanity gates: on
   any failure the square-frame treatment stands in and the UI says so.
   Tuned/validated on Tom's real #337 + #713 art (colours, not tokens:
   no per-token data anywhere in this code). */
const CUT={STEP:26,CAP:110};
function buildCutout(it){
  if(!it||it.cut||it.cutFail)return;
  const img=it.imgObj;
  if(!img||!img.complete||!img.naturalWidth)return;
  try{
    const w=img.naturalWidth, h=img.naturalHeight, N=w*h;
    const src=document.createElement('canvas'); src.width=w; src.height=h;
    const sg=src.getContext('2d',{willReadFrequently:true});
    sg.drawImage(img,0,0);
    const data=sg.getImageData(0,0,w,h).data;   /* throws if CORS-tainted */
    /* Matte v2 (Nov 11 - Tom's ghost fix). MEASURED root cause of the
       see-through fighter: the old matte starved on real art - its single
       top-centre anchor let the sky flood mark 864 of 589,824 px on #337 -
       so the "defocus ground" smoothness flood did the real cutting, and
       it cannot tell defocused ground from the fighter's own smooth cloth:
       it climbed from the bottom edge and deleted the black undersuit
       (#337) and the smooth scarf (#713), leaving disconnected armour
       fragments = a translucent ghost. Matte v2: (1) a border flood in
       which EVERY border pixel seeds with its OWN colour as its front
       reference - STEP gates local drift, CAP gates distance from that
       seed colour; no anchor, no hue exemption, no smoothness flood.
       (2) The fighter = the largest remaining blob PLUS any severed
       fragment (an arm, a thigh) whose box lives mostly inside the core's
       box - side backdrop slabs fail that test and stay out.
       (3) SOLIDIFY: fill every column between its first and last kept
       pixel and bridge row gaps up to 60 px, so the silhouette is solid
       by construction - alpha inside is binary, see-through impossible.
       Validated on Tom's real #337 + #713 art: both cut out complete
       and solid (silhouette fill .64 / .58; the old matte kept 28-40%
       of the body). */
    const bg=new Uint8Array(N), rR=new Float32Array(N), rG=new Float32Array(N), rB=new Float32Array(N);
    const stack=[];
    const seed=(x,y)=>{const n=y*w+x; if(bg[n])return; const i=n*4;
      bg[n]=1; rR[n]=data[i]; rG[n]=data[i+1]; rB[n]=data[i+2]; stack.push(n);};
    for(let x=0;x<w;x++){seed(x,0); seed(x,h-1);}
    for(let y=0;y<h;y++){seed(0,y); seed(w-1,y);}
    const tryAdd=(n,from)=>{
      if(bg[n])return;
      const i=n*4, r=data[i], g=data[i+1], b=data[i+2], j=from*4;
      if(Math.abs(r-data[j])+Math.abs(g-data[j+1])+Math.abs(b-data[j+2])>CUT.STEP)return;
      if(Math.abs(r-rR[from])+Math.abs(g-rG[from])+Math.abs(b-rB[from])>CUT.CAP)return;
      bg[n]=1; rR[n]=rR[from]; rG[n]=rG[from]; rB[n]=rB[from]; stack.push(n);
    };
    while(stack.length){
      const n=stack.pop(), x=n%w, y=(n/w)|0;
      if(x>0)tryAdd(n-1,n);
      if(x<w-1)tryAdd(n+1,n);
      if(y>0)tryAdd(n-w,n);
      if(y<h-1)tryAdd(n+w,n);
    }
    /* blobs of non-backdrop, largest first; the fighter's core is #0 */
    const seen=new Uint8Array(N); const comps=[];
    for(let s0=0;s0<N;s0++){
      if(bg[s0]||seen[s0])continue;
      const comp=[]; const st=[s0]; seen[s0]=1;
      let mnx=w,mxx=-1,mny=h,mxy=-1;
      while(st.length){const n=st.pop(); comp.push(n); const x=n%w, y=(n/w)|0;
        if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y;
        const nb=(m)=>{ if(!bg[m]&&!seen[m]){seen[m]=1; st.push(m);} };
        if(x>0)nb(n-1); if(x<w-1)nb(n+1); if(y>0)nb(n-w); if(y<h-1)nb(n+w);
        if(x>0&&y>0)nb(n-w-1); if(x<w-1&&y>0)nb(n-w+1); if(x>0&&y<h-1)nb(n+w-1); if(x<w-1&&y<h-1)nb(n+w+1);
      }
      comps.push({comp:comp,area:comp.length,bbox:[mnx,mny,mxx,mxy]});
    }
    if(!comps.length){it.cutFail=true; return;}
    comps.sort((a,b)=>b.area-a.area);
    const main=comps[0];
    let mbx0=main.bbox[0], mby0=main.bbox[1], mbx1=main.bbox[2], mby1=main.bbox[3];
    const keep=new Uint8Array(N);
    for(const n of main.comp)keep[n]=1;
    for(let ci=1;ci<comps.length;ci++){
      const c=comps[ci];
      if(c.area<N*.012)continue;
      const cb=c.bbox;
      const xIn=Math.max(0,Math.min(cb[2],mbx1)-Math.max(cb[0],mbx0)+1)/(cb[2]-cb[0]+1);
      const yIn=Math.max(0,Math.min(cb[3],mby1)-Math.max(cb[1],mby0)+1)/(cb[3]-cb[1]+1);
      if(xIn<.6||yIn<.4)continue;   /* a side backdrop slab fails this; a severed arm passes */
      for(const n of c.comp)keep[n]=1;
      if(cb[0]<mbx0)mbx0=cb[0]; if(cb[1]<mby0)mby0=cb[1]; if(cb[2]>mbx1)mbx1=cb[2]; if(cb[3]>mby1)mby1=cb[3];
    }
    /* solidify: no holes inside the silhouette, ever */
    for(let x=mbx0;x<=mbx1;x++){
      let y0=-1, y1=-1;
      for(let y=mby0;y<=mby1;y++)if(keep[y*w+x]){y0=y;break;}
      if(y0<0)continue;
      for(let y=mby1;y>=mby0;y--)if(keep[y*w+x]){y1=y;break;}
      for(let y=y0;y<=y1;y++)keep[y*w+x]=1;
    }
    for(let y=mby0;y<=mby1;y++){
      let last=-1;
      for(let x=mbx0;x<=mbx1;x++){
        if(keep[y*w+x]){
          if(last>=0&&x-last-1<=60)for(let xx=last+1;xx<x;xx++)keep[y*w+xx]=1;
          last=x;
        }
      }
    }
    let minX=w, maxX=-1, minY=h, maxY=-1, count=0;
    for(let n=0;n<N;n++){
      if(keep[n]){ const x=n%w, y=(n/w)|0;
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; count++; }
    }

      wm.setActions(acts);
      (wm.walletRepos || []).forEach(repo => {
        if (repo.setActions) repo.setActions(acts);
        (repo.wallets || []).forEach(w => { if (w.setActions) w.setActions(acts); });
      });
      (wm.mainWallets || []).forEach(w => { if (w.setActions) w.setActions(acts); });
    } catch (e) {}
    kitManager = wm;
    kitMountedPromise = Promise.resolve().then(() => wm.onMounted()).catch(() => {});
    /* backstop: when the mount (and its stored-account restore)
       finishes — whenever that is — adopt whatever it found */

/* while a WalletConnect pairing waits, the client holds the
   pairing URI (client.qrUrl). On a phone the client redirects
   into the wallet app itself (client.redirect) and no box is
   needed; anywhere else the box offers the raw link for the
   wallet's own WalletConnect scanner — the honest desktop path
   now that the generic modal is gone. */
function watchPairing(cw, pretty){
  let stopped = false, timer = null;
  const tick = () => {
    if (stopped) return;
    try {
      const client = cw.client;
      const uri = client && client.qrUrl && client.qrUrl.data;
      if (uri && !(client && client.redirect)){
        showPairBox(uri);
        z2KitHint('Approve the connection in ' + pretty + ' — or paste the pairing link shown in MY GARUDA into its WalletConnect scanner.');
      }
    } catch (e) {}
    if (!stopped) timer = setTimeout(tick, 500);
  };
  timer = setTimeout(tick, 600);
  return { stop(){ stopped = true; if (timer) clearTimeout(timer); } };
}

function kitFailLine(cw, pretty){

function kitConnect(entryId, opts){

/* ---- session restore: on load and on pageshow, adopt a live
   CosmosKit session silently. Detection first: CosmosKit keeps
   the current wallet under its own localStorage key (and the WC
   sign clients theirs under wc@2:*) — with neither present and
   no test hook injected there is nothing to restore and the
   stack is not even loaded. */
const KIT_WALLET_NAMES = ['keplr-extension', 'keplr-mobile', 'station-extension', 'galaxy-station'];
function kitHasStoredState(){
  try {
    if (localStorage.getItem('cosmos-kit@2:core//current-wallet')) return true;
  } catch (e) {}
  try {
    if (typeof localStorage.key === 'function' && typeof localStorage.length === 'number'){
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && (k.indexOf('wc@2:') === 0 || k.indexOf('cosmos-kit@2:') === 0)) return true;
      }
    }
  } catch (e) {}
  return false;
}
function kitScanAdopt(){
  if (!kitManager || z2WalletVia) return false;
  for (const name of KIT_WALLET_NAMES){
    let cw = null;
    try { cw = kitManager.getChainWallet(KIT_CHAIN_NAME, name); } catch (e) {}
    if (cw && cw.isWalletConnected && cw.address && z2ValidAddr(cw.address)){
      kitChainWallet = cw; kitWalletName = name; kitPrettyName = cw.walletPrettyName || name;
      z2KitApplyAddress(cw.address, name === 'galaxy-station' ? 'galaxy' : 'luncdash');
      return true;
    }
  }

}
let kitAdopting = false;
function kitRestoreSession(){
  if (kitAdopting) return Promise.resolve(false);
  if (z2WalletVia) return Promise.resolve(true);
  if (!kitHook() && !kitHasStoredState()) return Promise.resolve(false);
  kitAdopting = true;
  return ensureKitManager()
    .then(() => Promise.race([kitMountedPromise || Promise.resolve(), new Promise(r => setTimeout(r, 6000))]))
    .then(() => kitScanAdopt())
    .catch(err => { console.log('[z2-nft] CosmosKit restore skipped: ' + (err && err.message)); return false; })
    .then(ok => { kitAdopting = false; return ok; });
}
/* boot: restore first; with a stored address inside a wallet's own
   browser, quietly upgrade the read-only restore to a live session
   with that wallet (the behavior the injected-Keplr boot had). */
function kitBootFlow(){
  return kitRestoreSession().then(() => {
    if (z2WalletVia) return;
  });
}
/* raw esm.sh modules -> the shape normalizeKitLibs returns, with
   the extra decode error GP's hook path never produced: the WC
   bundle imports @walletconnect/* submodules that carry their own
   copies of @cosmjs packages, and mixing the two copies makes the
   chain-wallet constructors throw Realm-brand errors ("Expected a
   Uint8Array" / "not a valid instance"). When that shape appears,
   drop the WC bundle's own Galaxy factory and pass its base
   classes through — same classes GP's full-bundle hook used. */
function normalizeZ2KitLibs(raw){
  try { return normalizeKitLibs(raw); }
  catch (e) {
    const msg = String((e && e.message) || e);
    if (!/Uint8Array|valid instance|Realm|instanceof/.test(msg)) throw e;
    const cleaned = Object.assign({}, raw);
    try {
      const wc = Object.assign({}, raw.walletconnect);
      delete wc.GalaxyClient; delete wc.ChainGalaxyStation; delete wc.GalaxyStationWallet;
      cleaned.walletconnect = wc;
    } catch (e2) {}
    return normalizeKitLibs(cleaned);
  }
}

/* coming back to the page re-runs the stored-session check — the
   return path matters: approving in the wallet app backgrounds
   this page, and the session can land in CosmosKit's store while
   this page's own connect promise never resolves */

  window.addEventListener('pageshow', () => { kitRestoreSession(); });

  document.addEventListener('visibilitychange', () => {

/* ---- AIM (Tom, Nov 10: "the gun needs to rotate to shoot up and down") ----
   The right thumb control is an AIM stick: drag it and the gun rotates
   through the FULL half-circle on the facing side (Tom, Nov 10: "straight
   up, straight down, all in between" — aimA clamps to ±90° from facing);
   firing shoots along the angle. Desktop: the mouse aims, W/S nudge the
   angle. aimA lives on the hero (+ = up, relative to the facing). */
const aimStick={active:false,id:-1,cx:848,cy:330};
const AIM_MAX=Math.PI/2;                /* full arc (Tom, Nov 10): straight down through level to straight up on the facing side */
let mouseAim={x:0,y:0,t:-9,seen:false};
const mouseSeen=()=>mouseAim.seen&&(performance.now()/1000-mouseAim.t)<4;

function aimFromPoint(px,py){          /* world angle from the gun pivot to a screen point */
  if(!G)return;
  const h=G.hero, pvx=h.x-G.cam, pvy=h.y-58-(G.camY||0);
  let th=Math.atan2(-(py-pvy),px-pvx);
  if(h.face===1)th=clamp(th,-AIM_MAX,AIM_MAX);
  else th=clamp(th,Math.PI-AIM_MAX,Math.PI+AIM_MAX);
  h.aimA=(h.face===1)?th:Math.PI-th;
}
function gunPose(aA){
  /* Gun pivot + barrel vector in hero-rig space, per current rig. Returns
     the muzzle offset for a LEVEL shot plus the aim reference point the
     barrel rotates about, so muzzleWorld() can swing the muzzle through
     the full arc around the shoulder — at ±90° the muzzle must sit
     above/below the pivot, not stay pinned out front. The visible gun in
     each rig is drawn from the same numbers (drawFighter/drawHeroCutout). */
  aA=aA||0;
  if(!fighter&&figsReady&&FIGS[FREE_KEYS[freePick]]&&FIGS[FREE_KEYS[freePick]].grip){
    /* painted rig: muzzle = grip + the barrel vector rotated by the same
       compensated angle the gun overlay is drawn with */
    const F=FIGS[FREE_KEYS[freePick]], u=90/F.hPx;
    const gx=(F.grip[0]-F.anchorX)*u, gy=(F.grip[1]-F.hPx)*u;
    const mvx=(F.muzzle[0]-F.grip[0])*u, mvy=(F.muzzle[1]-F.grip[1])*u;
    const ph=-aA-(F.restA||0), c=Math.cos(ph), sn=Math.sin(ph);
    return {mx:gx+mvx*c-mvy*sn, my:gy+mvx*sn+mvy*c};
  }
  if(fighter&&cutReady()){
    /* cut-out rig: visible gun rotates about the grip (28,-74) with the
       barrel tip 39px along the aim — mirror that exactly */
    const gx=15+Math.cos(aA)*13, gy=-74-Math.sin(aA)*13;
    return {mx:gx+39*Math.cos(aA), my:gy-39*Math.sin(aA)};
  }
  if(fighter&&fighterArtReady())return {px:52,py:-56,bl:12};
  /* code hero: gun group origin (20,-57), barrel tip 37px along the aim */
  return {mx:20+37*Math.cos(aA), my:-57-37*Math.sin(aA)};
}
function muzzleWorld(){
  const h=G.hero, aA=h.aimA||0, gp=gunPose(aA);
  /* the framed fallback keeps its fixed flash point at the frame's edge;
     the cut-out + code rigs swing the muzzle around the shoulder pivot */
  if(gp.mx!==undefined)return {x:h.x+h.face*gp.mx+(h.moving&&h.ground?Math.sin(h.wp||0)*1.4:0), y:h.y+gp.my-(h.moving?Math.abs(Math.sin(h.wp||0))*2.2:0), ang:(h.face===1?aA:Math.PI-aA)};
  return {x:h.x+h.face*(gp.px+Math.cos(aA)*gp.bl), y:h.y+gp.py-Math.sin(aA)*gp.bl, ang:(h.face===1?aA:Math.PI-aA)};
}
const cvPos={x:0,y:0,s:1};
function refreshCvPos(){const r=cv.getBoundingClientRect(); cvPos.x=r.left; cvPos.y=r.top; cvPos.s=r.width/W;}
function toGame(e){
  if(PORTRAIT){
    /* CSS rotate(90deg) maps game (x,y) -> client (left + (H-y)*s, top + x*s);
       invert it so taps land where the player sees them */
    const r=cv.getBoundingClientRect(), s=r.height/W;
    return {x:(e.clientY-r.top)/s, y:H-(e.clientX-r.left)/s};

}
let uiHits=[];   /* rebuilt every frame: {x,y,w,h,fn,id} */
function hitAt(x,y){for(let i=uiHits.length-1;i>=0;i--){const b=uiHits[i]; if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b;} return null;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); refreshCvPos(); audio(); startMusic();
  const p=toGame(e);
  const hit=hitAt(p.x,p.y);
  if(hit){
    /* the language picker is modal while open: only its own buttons fire —
       a tap in a gap between its buttons must not fall through to the
       screen underneath (the full-stage START region would catch it) */
    if(langOpen&&hit.id.indexOf('lang')!==0)return;
    if(levelOpen&&hit.id.indexOf('lv')!==0)return;
    hit.fn(); return;
  }
  if(screen==='play'){
    if(p.x<W*.4&&p.y>H*.5){ joy.active=true; joy.id=e.pointerId; joy.dx=0; joy.dy=0; }
    else if(p.x>W*.55&&p.y>H*.5){
      const dF=Math.hypot(p.x-848,p.y-330), dB=Math.hypot(p.x-782,p.y-352), dJ=Math.hypot(p.x-848,p.y-252);

});

function buildLevel(def, n){

  const hpAdd=Math.floor((n-1)/10);

           raft:{x0:-100000,x1:-100000,deckY:302,startX:0}, raftOn:!!def[3]};
  const pSold=Math.min(.55,.28+n*.007);

  const hpFor=k=>(k==='soldier'?3:2)+hpAdd;

    const plats=[]; let px=120, y=GY;

      y-=76+rng()*12;

      if(Math.abs(nx-px)<130)nx=clamp(px+(px<width/2?1:-1)*260, 30, width-320);
      plats.push([Math.round(nx),Math.round(y),Math.round(190+rng()*90),46]);
      px=nx;
    }
    const aw=560, ax=clamp(px,40,width-aw-40);

    L.ruins=plats; L.world=width; L.topY=topY;
    L.orbX=ax+aw-110; L.orbY=topY;
    plats.forEach((p,i)=>{
      if(i===0||i===plats.length-1)return;
      if(i%2===0||rng()<.3){ const k=pickKind(); L.spawns.push({x:Math.round(p[0]+p[2]/2)-40, kind:k, ex:Math.round(p[0]+p[2]/2), ey:p[1], hp:hpFor(k)}); }
    });
    L.spawns.push({x:300,kind:'zed',ex:420,ey:GY,hp:hpFor('zed')});
    L.spawns.push({x:520,kind:'soldier',ex:660,ey:GY,hp:hpFor('soldier')});
    L.boss={x:L.orbX-250, y:topY, triggerY:topY+330, hp:bossHp, scale:bossScale, name:th.boss};
    for(let x=260;x<width-200;x+=460+rng()*160)L.props.push([Math.round(x), th.props[(rng()*th.props.length)|0]]);
  } else {
    const world=Math.round(5000+n*95+rng()*400);

      const cw=140+rng()*60, st=(rng()*3)|0;
      if(st===0){ L.ruins.push([x,278,Math.round(cw),52],[x+Math.round(cw),226,Math.round(cw),104],[x+2*Math.round(cw),278,Math.round(cw*.9),52]); x+=3*cw+260+rng()*320; }
      else if(st===1){ L.ruins.push([x,246,Math.round(cw+30),84]); x+=cw+330+rng()*300; }
      else { L.ruins.push([x,278,Math.round(cw),52],[x+Math.round(cw)+70,262,Math.round(cw*.8),68]); x+=2*cw+380+rng()*300; }
    }
    if(def[3]){ const rx0=Math.round(world*.42); L.raft={x0:rx0,x1:rx0+1200,deckY:302,startX:rx0+40}; }
    const count=12+Math.round(n*.55);
    for(let i=0;i<count;i++){
      const sx=Math.round(760+(world-1500)*(i+.5)/count+(rng()-.5)*160);
      const k=pickKind();
      const sp={x:Math.max(300,sx-260), kind:k, ex:sx, hp:hpFor(k)};
      if(k==='soldier'){ const top=L.ruins.find(r=>sx>r[0]-6&&sx<r[0]+r[2]+6); if(top&&rng()<.7)sp.ey=top[1]; }
      L.spawns.push(sp);
    }
    if(def[3]){
      L.spawns.push({x:L.raft.x1+120,kind:'soldier',ex:L.raft.x1+560,bank:true,hp:hpFor('soldier')});
      L.spawns.push({x:L.raft.x1+180,kind:'zed',ex:L.raft.x1+700,bank:true,hp:hpFor('zed')});
    }
    L.boss={x:L.orbX-170, y:GY, triggerX:L.orbX-760, hp:bossHp, scale:bossScale, name:th.boss};
    for(let px2=300;px2<world-260;px2+=430+rng()*220)L.props.push([Math.round(px2), th.props[(rng()*th.props.length)|0]]);
  }

function platsAt(x){ /* standable tops under a world x */
  const out=[GY];

  if(G&&G.onRaft)out.push(LV.raft.deckY);
  return out;
}
function ruinTopAt(x,feetY){ /* top of the ruin block a wall-climb should land on (<= the feet), or null */
  let best=null;
  for(const p of PLATS){ if(x>p.x-8&&x<p.x+p.w+8){ const t=p.y; if(feetY>=t-6&&t<GY&&(best===null||t<best))best=t; } }
  return best;
}
/* floor for an entity: only tops its feet are near/above count (no teleporting up) */
function floorFor(x,feetY){
  let f=GY;
  for(const p of PLATS){ if(x>p.x-8&&x<p.x+p.w+8&&feetY<=p.y+16&&p.y<f)f=p.y; }
  return f;
}
/* ruins are solid blocks: if feet are well below a top, the block is a wall */
function wallClamp(e){
  for(const p of PLATS){
    if(e.y>p.y+14&&e.x>p.x-13&&e.x<p.x+p.w+13){
      e.x=(e.x<p.x+p.w/2)?p.x-13:p.x+p.w+13;
    }
  }
}

    if(h.y>=floorY){h.y=floorY; h.vy=0; h.ground=true;}
  } else { h.y=floorY; h.ground=true; }
  if(G.onRaft)h.y=LV.raft.deckY+Math.sin(G.t*1.8)*2.5;
  if(h.moving&&h.ground)h.wp+=dt*11; else h.wp*=.85;
  /* fire */
  const wantFire=fireInput();
  /* desktop aim keys: W/S raise/lower the gun when nothing fresher aims */
  if(!aimStick.active&&!mouseSeen()){
    if(keys['w'])h.aimA=clamp((h.aimA||0)+1.9*dt,-AIM_MAX,AIM_MAX);
    if(keys['s'])h.aimA=clamp((h.aimA||0)-1.9*dt,-AIM_MAX,AIM_MAX);
  }
  /* near-vertical fire must still reach the foe overhead / at his feet:
     the plain box test (|dx|<22, full body height) misses a shot passing
     through the head/feet zone within a step of travel — widen the test
     for steep shots only (level fire keeps the exact old box). Runs BEFORE
     the generic bullet pass so a steep kill isn't eaten at ground level. */
  for(const b of G.bullets){
    if(b.foe||b.life<=0)continue;
    const vyN=Math.abs(b.vy||0)/800;
    if(vyN<.8)continue;
    const nx=b.x+b.vx*dt, ny=b.y+(b.vy||0)*dt;
    for(const e of G.enemies){
      if(e.dead>0)continue;
      const segHit=(Math.abs(b.x-e.x)<(e.hw||22)+4&&b.y>e.y-(e.hh||96)-8&&b.y<e.y+2)||(Math.abs(nx-e.x)<(e.hw||22)+4&&ny>e.y-(e.hh||96)-8&&ny<e.y+2);
      if(segHit){ b.life=0; e.hp-=b.dmg; e.flash=.08; SFX.hit();
        G.flashes.push({x:b.x,y:b.y,ang:0,t:.08,max:.08,impact:true,col:'#3b9dff'});
        for(let i=0;i<6;i++)spawnPart({x:b.x,y:b.y,vx:rr(-70,70),vy:rr(-70,10),life:rr(.14,.26),max:.26,r:rr(1.5,2.8),col:i%2?'#6fc2ff':'#cfeaff'});
        if(e.hp<=0)killEnemy(e);
        break; }
    }
  }
  let tgt=null,bd=1e9;
  for(const e of G.enemies){if(e.dead>0)continue; const d=(e.x-h.x)*h.face; if(d>20&&d<bd){bd=d;tgt=e;}}
  h.aim=tgt&&bd<520?1:0;
  if(wantFire&&G.t-G.lastShot>.17){G.lastShot=G.t; heroFire();}
  if(bombQueued){bombQueued=false; launchGrenade();}
  if(h.muzzle>0)h.muzzle-=dt;
  /* ----- enemies ----- */
  for(const e of G.enemies){
    if(e.dead>0){e.dead=Math.min(1,e.dead+dt*3); continue;}
    if(e.flash>0)e.flash-=dt;
    const d=h.x-e.x, ad=Math.abs(d);
    if(!e.bank){
      /* settle to a floor (same rules as the hero — no teleporting up blocks) */
      const ef=floorFor(e.x,e.y);
      if(e.y<ef){e.vy+=1500*dt; e.y+=e.vy*dt; if(e.y>=ef){e.y=ef;e.vy=0;}}
      else e.y=ef;
      if(e.kind==='boss'){
        /* the big one: slow, relentless, hits like a truck */
        if(ad>(e.hw+26))e.x+=Math.sign(d)*(30+Math.min(26,LV.n))*dt;
        wallClamp(e);
        e.wp+=dt*3.2;
        if(ad<=e.hw+30&&Math.abs(e.y-h.y)<80){ e.atk=(e.atk||0)+dt; if(e.atk>.8){e.atk=0; hurtHero(40+Math.round(LV.n/2));} }
      } else if(e.kind==='soldier'){
        if(ad>240)e.x+=Math.sign(d)*34*dt;
        wallClamp(e);
        e.wp+=dt*5;
        e.shotCd-=dt;
        if(e.shotCd<0&&ad<430&&Math.abs(e.y-h.y)<70){e.shotCd=rr(1.5,2.6);
          const sg=Math.sign(d);
          G.bullets.push({x:e.x+sg*52,y:e.y-54,vx:sg*560,vy:0,life:.85,foe:true,dmg:26});
          e.muzzle=.07; G.flashes.push({x:e.x+sg*66,y:e.y-54,ang:sg>0?0:Math.PI,t:.08,max:.08,foe:true,seed:Math.random()*9});
          SFX.eshot();}
      } else {
        if(ad>44)e.x+=Math.sign(d)*(e.kind==='zed'?46:56)*dt;
        wallClamp(e);
        e.wp+=dt*8;
        if(ad<=46&&Math.abs(e.y-h.y)<60){ e.atk=(e.atk||0)+dt; if(e.atk>.7){e.atk=0; hurtHero(38);} }
      }
    } else {
      if(ad>260)e.x-=26*dt;
      e.wp+=dt*5;
      if(e.kind==='soldier'){ e.shotCd-=dt;
        if(e.shotCd<0&&ad<520){e.shotCd=rr(1.6,2.8);
          G.bullets.push({x:e.x-52,y:e.y-54,vx:-560,vy:0,life:.9,foe:true,dmg:26});
          e.muzzle=.07; G.flashes.push({x:e.x-66,y:e.y-54,ang:Math.PI,t:.08,max:.08,foe:true,seed:Math.random()*9});
          SFX.eshot();} }
    }
  }
  for(const f of G.flashes)f.t-=dt;
  G.flashes=G.flashes.filter(f=>f.t>0);
  for(const e of G.enemies)if(e.muzzle>0)e.muzzle-=dt;
  /* ----- bullets (vx+vy: shots travel the aim angle) ----- */
  for(const b of G.bullets){
    b.life-=dt; b.x+=b.vx*dt; b.y+=(b.vy||0)*dt;
    if(b.y<(LV&&LV.mode==='climb'?LV.topY-200:4))b.life=0; /* ceiling follows the level: climb towers live far above y=4 */
    if(b.y>GY+8){ /* ground strike — dirt + spark burst */
      b.life=0;
      for(let i=0;i<5;i++)spawnPart({x:b.x,y:GY+2,vx:rr(-50,50),vy:-rr(20,95),life:rr(.16,.3),max:.3,r:rr(1.4,2.6),col:i%2?'#ffb03a':'#8a6f4d',grav:340});
    }
    if(b.life<=0)continue;
    if(b.foe){
      if(Math.abs(b.x-h.x)<20&&b.y>h.y-96&&b.y<h.y){b.life=0;
        G.flashes.push({x:b.x,y:b.y,ang:0,t:.07,max:.07,impact:true,col:'#e04dff'});
        hurtHero(b.dmg||26);}
    } else {
      for(const e of G.enemies){
        if(e.dead>0)continue;
        if(Math.abs(b.x-e.x)<(e.hw||22)&&b.y>e.y-(e.hh||96)&&b.y<e.y){ b.life=0; e.hp-=b.dmg; e.flash=.08; SFX.hit();
          G.flashes.push({x:b.x,y:b.y,ang:0,t:.08,max:.08,impact:true,col:'#3b9dff'});
          for(let i=0;i<6;i++)spawnPart({x:b.x,y:b.y,vx:rr(-70,70),vy:rr(-70,10),life:rr(.14,.26),max:.26,r:rr(1.5,2.8),col:i%2?'#6fc2ff':'#cfeaff'});
          if(e.hp<=0)killEnemy(e);
          break; }
      }
    }
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
  /* ----- pickups ----- */
  for(const p of G.pickups){
    p.age+=dt;
    if(p.age<.5){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=620*dt; const pf=floorFor(p.x,p.y)-8; if(p.y>pf){p.y=pf;p.vy*=-.35;}}
    else{
      if(p.kind==='ammo'){ if(Math.abs(p.x-h.x)<30&&Math.abs(p.y-(h.y-40))<56){p.done=true; G.bombs=Math.min(99,G.bombs+1); G.floaters.push({x:h.x,y:h.y-104,txt:'+1 '+T('grenade'),age:0,col:'#a8c6dc'});} continue; }
      const tx=p.kind==='frg'?352:480, ty=25, sx=p.x-G.cam;
      const nx=sx+(tx-sx)*Math.min(1,dt*7), ny=p.y+(ty-p.y)*Math.min(1,dt*7);
      p.x=nx+G.cam; p.y=ny;
      if(Math.abs(tx-sx)<14&&Math.abs(ty-p.y)<12){p.done=true;
        if(p.kind==='frg'){G.frg+=.3; SFX.pickupF();} else {G.lunc+=6; SFX.pickupL();}}
    }
    if(p.age>7&&p.kind==='ammo')p.done=true;
  }
  G.pickups=G.pickups.filter(p=>!p.done);
  for(const f of G.floaters)f.age+=dt;
  G.floaters=G.floaters.filter(f=>f.age<1.5);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*22);
  stepParts(dt);
  /* camera */
  const target=G.onRaft?clamp(h.x-330,1450,2380):clamp(h.x-300,0,WORLD()-W+40);
  G.cam+=(target-G.cam)*Math.min(1,dt*5);
  const targetY=LV.mode==='climb'?clamp(h.y-250,LV.topY-130,0):0;
  G.camY=(G.camY||0)+(targetY-(G.camY||0))*Math.min(1,dt*4.5);
  /* orb */
  if(!G.orbTaken&&h.x>ORBX()-30&&Math.abs(h.y-ORBY())<70&&G.kills>=G.total){ grabOrb(); }
  if(G.orbTaken){ G.endT+=dt; }
}
function grabOrb(){
  G.orbTaken=true; SFX.orb(); startMusic();
  for(let i=0;i<22;i++)spawnPart({x:ORBX()+16,y:ORBY()-96,vx:rr(-90,90),vy:rr(-140,20),life:rr(.4,.9),max:.9,r:rr(1.6,3.4),col:i%2?'#aef2ff':'#f5c542',grav:120});
  G.frg+=2.4; G.lunc+=120;
  setTimeout(()=>{ if(screen==='play'&&G&&G.orbTaken){ finishMission(); } },1400);
}
function missionScore(){ return Math.round(G.lunc + G.frg*10 + G.kills*25 + Math.max(0,600-G.time*2)); }
function finishMission(){
  screen='complete'; stopMusic(); SFX.orb();
  const sc=missionScore();
  const best=loadBest();
  const rec={score:sc,time:Math.round(G.time),kills:G.kills,level:LV.n,fighter:fighter?fighter.name:'BASE'};
  if(!best||sc>best.score)saveBest(rec);
  if(LV.n>=unlocked&&LV.n<CAMPAIGN_TOTAL){ unlocked=LV.n+1; localStorage.setItem('z2unlock',String(unlocked)); }
  G.finalScore=sc; G.newBest=!!best&&sc>best.score||!best;
}

function wrapText(txt,x,y,maxW,lh){
  const words=String(txt).split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy); line=w; yy+=lh;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy;
}

/* ---- muzzle flashes + impact bursts (world space, shared by all rigs) ----
   Tom (Nov 10): "bigger red flash", tracer fire. Nov 11: hero fire goes
   BLUE at his word - hero flash = big blue starburst with light spill;
   enemy flash = smaller violet; impacts = a tight blue/violet burst.
   Additive ('lighter') so it reads as light. */
function drawFlashes(){
  const g=ctx, cam=G.cam;
  g.save(); g.globalCompositeOperation='lighter';
  for(const f of G.flashes){
    const fx=f.x-cam, fy=f.y-(G.camY||0); if(fx<-90||fx>W+90)continue;
    const k=f.t/f.max;
    if(f.impact){
      g.globalAlpha=k*.85;
      const gr=g.createRadialGradient(fx,fy,0,fx,fy,20);
      gr.addColorStop(0,'rgba(255,235,210,.95)'); gr.addColorStop(.35,f.col==='#3b9dff'?'rgba(80,165,255,.8)':'rgba(224,77,255,.8)'); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(fx,fy,20,0,7); g.fill();
      g.strokeStyle=f.col; g.lineWidth=2;
      for(let i=0;i<5;i++){const a=i*1.256+(f.x%7); g.beginPath(); g.moveTo(fx,fy); g.lineTo(fx+Math.cos(a)*13*k,fy+Math.sin(a)*13*k); g.stroke();}
      continue;
    }
    const R=f.big?30:19, core=f.foe?'224,77,255':'110,190,255', mid=f.foe?'255,120,250':'60,145,255';
    g.globalAlpha=Math.min(1,k*1.4);
    /* light spill on the shooter + ground */
    const sg=g.createRadialGradient(fx,fy,0,fx,fy,f.big?74:48);
    sg.addColorStop(0,'rgba('+core+','+(.20*k)+')'); sg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sg; g.beginPath(); g.arc(fx,fy,f.big?74:48,0,7); g.fill();
    /* starburst spikes along the shot angle */
    g.save(); g.translate(fx,fy); g.rotate(-f.ang);
    g.fillStyle='rgba('+mid+','+(.9*k)+')';
    g.beginPath(); g.moveTo(-4,-2.2); g.lineTo(R,-0.8); g.lineTo(R*1.25,0); g.lineTo(R,0.8); g.lineTo(-4,2.2); g.closePath(); g.fill();
    g.save(); g.rotate(.5+((f.seed||0)%3)*.2);
    g.beginPath(); g.moveTo(-2,-1.4); g.lineTo(R*.62,-.5); g.lineTo(R*.8,0); g.lineTo(R*.62,.5); g.lineTo(-2,1.4); g.closePath(); g.fill(); g.restore();
    g.save(); g.rotate(-.55-((f.seed||0)%3)*.15);
    g.beginPath(); g.moveTo(-2,-1.4); g.lineTo(R*.55,-.5); g.lineTo(R*.72,0); g.lineTo(R*.55,.5); g.lineTo(-2,1.4); g.closePath(); g.fill(); g.restore();
    const cg=g.createRadialGradient(0,0,0,0,0,R*.5);
    cg.addColorStop(0,'rgba(255,246,220,'+(.95*k)+')'); cg.addColorStop(.5,'rgba('+mid+','+(.55*k)+')'); cg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=cg; g.beginPath(); g.arc(0,0,R*.5,0,7); g.fill();
    g.restore();
  }
  g.restore(); g.globalAlpha=1;
}
function drawEntities(){
  const g=ctx, cam=G.cam, h=G.hero;

    const sx=e.x-cam; if(sx<-(e.boss?280:90)||sx>W+(e.boss?280:90))continue;
    const sy=e.y-(G.camY||0);
    if(!(figsReady&&drawSpriteFigure(sx,sy,{fig:e.fig,face:h.x>=e.x?1:-1,moving:e.dead===0,walkPhase:e.wp,aimA:0,muzzle:e.muzzle>0?1:0,flash:e.flash||0,dead:e.dead,scale:(e.scale||1)*(e.bank?.92:1),legAmp:e.boss?.12:.2})))
      drawFighter(sx,sy,{...e.base,face:e.x>h.x?1:-1,moving:e.dead===0,walkPhase:e.wp,aim:e.kind==='soldier'?.8:0,muzzle:e.muzzle>0?1:0,dead:e.dead,scale:(e.scale||1)*(e.bank?.92:1)});
    if(e.dead===0){
      const frac=clamp(e.hp/(e.maxHp||3),0,1), bw2=e.boss?54:16, by2=sy-(e.hh||96)-8;
      if(frac<1){ g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(sx-bw2,by2,bw2*2,4.5);
        g.fillStyle=frac>.45?'#59d977':'#e2543e'; g.fillRect(sx-bw2,by2,bw2*2*frac,4.5); }
      if(e.flash>0&&!figsReady){ g.fillStyle='rgba(255,240,200,.25)'; g.beginPath(); g.arc(sx,sy-46,26,0,7); g.fill(); }

     selected and its art has loaded, the NFT's own artwork IS the hero
     (drawHeroArt); if the art failed, the tint rig stands in and the HUD
     notes it. No NFT -> base hero, unchanged. */
  const style=fighter?fighter.style:HERO_BASE;
  const heroOpts={face:h.face,moving:h.moving,walkPhase:h.wp,aim:h.aim,aimA:h.aimA||0,muzzle:h.muzzle>0?1:0,flash:h.flash||0,dead:screen==='dead'?Math.min(1,G.deadT*1.4):0};
  const hy=h.y-(G.camY||0);
  if(fighter&&cutReady()) drawHeroCutout(h.x-cam,hy,heroOpts);
  else if(fighterArtReady()) drawHeroArt(h.x-cam,hy,heroOpts);
  else if(!fighter&&figsReady&&drawSpriteFigure(h.x-cam,hy,{fig:FREE_KEYS[freePick],face:h.face,moving:h.moving,walkPhase:h.wp,aimA:h.aimA||0,muzzle:h.muzzle>0?1:0,flash:h.flash||0,dead:heroOpts.dead,scale:1.06})){}
  else drawFighter(h.x-cam,hy,{...style,...heroOpts,scale:1.06});
  if(fighter&&screen!=='dead'){
    g.fillStyle='rgba(255,217,104,.9)'; g.font='700 9.5px Arial'; g.textAlign='center';
    g.fillText('🎖 #'+fighter.id,g,h.x-cam,hy-((fighter&&cutReady())?112:100)); g.textAlign='left';
  } else if(!fighter&&screen!=='dead'){
    g.fillStyle='rgba(255,217,104,.9)'; g.font='700 9.5px Arial'; g.textAlign='center';
    g.fillText(FREE_NAMES[freePick],g,h.x-cam,hy-102); g.textAlign='left';
  }
  /* aim guide — a short dashed line along the gun when aiming off-level */
  if(Math.abs(h.aimA||0)>.06&&screen==='play'){
    const mz=muzzleWorld(), ax=mz.x-cam, ay=mz.y-(G.camY||0);
    g.save(); g.strokeStyle='rgba(255,220,160,.4)'; g.lineWidth=1.6; g.setLineDash([4,5]);
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(ax+Math.cos(mz.ang)*30,ay-Math.sin(mz.ang)*30); g.stroke(); g.restore();
  }
  /* bullets — TRACER FIRE (Tom, Nov 10): glowing streaks with fading tails.
     Nov 11 (Tom): the hero's shots were "little tiny red dots, hard to
     see" — now BLUE COMETS: a bright head ~5x the old dot with a glow,
     and a long tapering tail that fades to nothing behind it (never a
     solid bar). The tail follows the velocity vector, so straight-up /
     straight-down fire carries it too. Enemy = hostile violet, unchanged. */
  g.save(); g.globalCompositeOperation='lighter';
  g.translate(0,-(G.camY||0));
  for(const b of G.bullets){
    const bx=b.x-cam, spd=Math.hypot(b.vx,b.vy||0)||1, ux=b.vx/spd, uy=(b.vy||0)/spd;
    if(b.foe){
      const tl=38, tx=bx-ux*tl, ty=b.y-uy*tl;
      const gr=g.createLinearGradient(tx,ty,bx,b.y);
      gr.addColorStop(0,'rgba(224,77,255,0)'); gr.addColorStop(.55,'rgba(224,77,255,.34)'); gr.addColorStop(1,'rgba(255,150,250,.95)');
      g.strokeStyle=gr; g.lineCap='round'; g.lineWidth=5;
      g.beginPath(); g.moveTo(tx,ty); g.lineTo(bx,b.y); g.stroke();
      g.strokeStyle='rgba(255,227,251,.95)'; g.lineWidth=2.1;
      g.beginPath(); g.moveTo(bx-ux*tl*.45,b.y-uy*tl*.45); g.lineTo(bx,b.y); g.stroke();
      g.fillStyle='#ffe3fb'; g.beginPath(); g.arc(bx,b.y,2.3,0,7); g.fill();
      continue;
    }
    /* hero comet: segmented tail, width + alpha growing toward the head */
    const TL=120, SEG=6;
    for(let s=0;s<SEG;s++){
      const t0=s/SEG, t1=(s+1)/SEG, tm=(t0+t1)/2;
      g.strokeStyle='rgba(70,160,255,'+(0.06+0.62*tm*tm).toFixed(3)+')';
      g.lineWidth=1.2+6.4*Math.pow(tm,1.4); g.lineCap='round';
      g.beginPath();
      g.moveTo(bx-ux*TL*(1-t0), b.y-uy*TL*(1-t0));
      g.lineTo(bx-ux*TL*(1-t1), b.y-uy*TL*(1-t1));
      g.stroke();
    }
    /* bright core line along the front of the shot */
    g.strokeStyle='rgba(205,238,255,.92)'; g.lineWidth=2.6;
    g.beginPath(); g.moveTo(bx-ux*TL*.38,b.y-uy*TL*.38); g.lineTo(bx,b.y); g.stroke();
    /* head: ~5x the old 2.3 dot, white-blue core inside a blue glow */
    const hg=g.createRadialGradient(bx,b.y,0,bx,b.y,15);
    hg.addColorStop(0,'rgba(255,255,255,.98)'); hg.addColorStop(.32,'rgba(175,228,255,.95)');
    hg.addColorStop(.68,'rgba(64,152,255,.75)'); hg.addColorStop(1,'rgba(64,152,255,0)');
    g.fillStyle=hg; g.beginPath(); g.arc(bx,b.y,15,0,7); g.fill();
    g.fillStyle='rgba(240,252,255,.98)'; g.beginPath(); g.arc(bx,b.y,4.6,0,7); g.fill();
  }
  g.restore();
  drawFlashes();
  for(const gr of G.grenades){
    const gx=gr.x-cam, gy2=gr.y-(G.camY||0);
    g.fillStyle='#232a20'; g.beginPath(); g.arc(gx,gy2,6.5,0,7); g.fill();
    g.fillStyle='#4c5548'; g.beginPath(); g.arc(gx-1.5,gy2-1.5,2.6,0,7); g.fill();
    g.fillStyle='#8a929a'; g.fillRect(gx-1.5,gy2-10,3,4);
  }
  for(const p of G.pickups){
    const sx=p.x-cam;
    const py=p.y-(G.camY||0);
    if(p.kind==='frg')frgGem(sx,py,8);
    else if(p.kind==='lunc')crescentDraw(sx,py,8,'#f5c542');
    else { g.fillStyle='#2c3136'; g.beginPath(); g.arc(sx,py+1,7,0,7); g.fill(); g.fillStyle='#8a929a'; g.fillRect(sx-2,py-9,4,4); g.fillStyle='#ffd968'; g.beginPath(); g.arc(sx,py-10,1.8,0,7); g.fill(); }
  }
  g.textAlign='center';
  for(const f of G.floaters){
    g.globalAlpha=clamp(1.4-f.age,0,1);
    g.font=(f.big?'900 30px':'700 13px')+' Arial';
    g.fillStyle=f.col||(f.big?'#ffb03a':'#ffe9a8');
    g.fillText(f.txt,f.x-cam,f.y-(G.camY||0)-f.age*36);
  }
  g.globalAlpha=1; g.textAlign='left';
  drawParts();
}

  g.fillStyle=fireHeld?'rgba(80,20,16,.55)':'rgba(10,16,12,.4)'; g.beginPath(); g.arc(848,330,31,0,7); g.fill();
  g.strokeStyle='rgba(255,220,220,.65)'; g.lineWidth=2; g.beginPath(); g.arc(848,330,31,0,7); g.stroke();
  if(Math.abs(aA)>.06){ g.strokeStyle='rgba(255,190,90,.75)'; g.lineWidth=2.4;
    g.beginPath(); g.moveTo(848,330); g.lineTo(848+kdx*1.7,330+kdy*1.7); g.stroke(); }
  g.fillStyle='rgba(220,240,225,.4)'; g.beginPath(); g.arc(848+kdx,330+kdy,14,0,7); g.fill();
  g.strokeStyle='rgba(255,240,240,.9)';
  g.beginPath(); g.arc(848+kdx,330+kdy,9,0,7); g.stroke();
  g.beginPath(); g.moveTo(848+kdx,330+kdy-15); g.lineTo(848+kdx,330+kdy-5); g.moveTo(848+kdx,330+kdy+5); g.lineTo(848+kdx,330+kdy+15);
  g.moveTo(848+kdx-15,330+kdy); g.lineTo(848+kdx-5,330+kdy); g.moveTo(848+kdx+5,330+kdy); g.lineTo(848+kdx+15,330+kdy); g.stroke();
  g.fillStyle='#ff5340'; g.beginPath(); g.arc(848+kdx,330+kdy,2.6,0,7); g.fill();
  /* GRENADE button — big, reachable; launches an arcing grenade paid from
     the Bombs stock; visibly disabled at 0 */
  const gOn=G.bombs>0;
  g.fillStyle=gOn?'rgba(30,40,22,.55)':'rgba(10,16,12,.35)'; g.beginPath(); g.arc(782,352,27,0,7); g.fill();
  g.strokeStyle=gOn?'rgba(255,200,90,.85)':'rgba(220,240,225,.3)'; g.lineWidth=2.2; g.beginPath(); g.arc(782,352,27,0,7); g.stroke();
  g.fillStyle=gOn?'#2c3136':'#3a3f36'; g.beginPath(); g.arc(782,356,10,0,7); g.fill();
  g.fillStyle='#8a929a'; g.fillRect(779.5,343,5,6);
  g.fillStyle='#ffd968'; g.beginPath(); g.arc(782,341,2.2,0,7); g.fill();
  g.fillStyle=gOn?'#ffe9a8':'rgba(230,245,240,.4)'; g.font='900 10.5px Arial'; g.textAlign='center';
  g.fillText(T('grenade')+' ×'+G.bombs,782,394); g.textAlign='left';
  /* mute mini-toggle, obvious state */
  drawBtn(W-64,84,54,22,SOUND?'🔊 ON':'🔇 OFF',{fs:10.5,fill:SOUND?'rgba(20,50,30,.9)':'rgba(50,20,20,.9)',stroke:SOUND?'#59d977':'#e2543e',col:'#fff',r:6});
  regBtn('sound',W-64,84,54,22,()=>setSound(!SOUND));
}
function drawEndPanel(won){
  const g=ctx;
  g.fillStyle='rgba(3,7,5,.45)'; g.fillRect(0,0,W,H);
  g.save(); g.textAlign='center';
  g.fillStyle='rgba(5,16,14,.92)'; roundRect(W/2-250,86,500,208,12); g.fill();
  g.strokeStyle=won?'#3fd68f':'#e2543e'; g.lineWidth=2.2; roundRect(W/2-250,86,500,208,12); g.stroke();
  g.fillStyle='#f2fbf8'; g.font='700 20px Arial'; g.fillText(LV.n===1?T('brief'):LV.name,W/2,124);
  g.fillStyle=won?'#59d977':'#ff8a76'; g.font='900 26px "Arial Black",Arial,sans-serif';
  g.fillText(won?T('complete'):T('failed'),W/2,160);
  g.font='700 14.5px Arial'; g.fillStyle='#e6f5f0';
  if(won){
    const sc=G.finalScore||missionScore();
    g.fillText('⭐ '+sc+'   ·   ☠ '+G.kills+'/'+G.total+'   ·   ⏱ '+fmtTime(G.time),W/2,192);
    g.font='600 12.5px Arial'; g.fillStyle='#ffd968';
    g.fillText('FRG '+G.frg.toFixed(1)+'  ·  LUNC '+Math.round(G.lunc)+(fighter?'  ·  🎖 '+fighter.name:''),W/2,216);
    if(G.newBest){ g.fillStyle='#9fe8a9'; g.font='700 12px Arial'; g.fillText('⭐ NEW BEST ON THIS DEVICE',W/2,240); }
  } else {
    g.font='600 13px Arial'; g.fillStyle='rgba(230,245,240,.85)';
    wrapTextCenter(T('dead'),W/2,190,440,17);
    g.font='700 13px Arial'; g.fillStyle='#ffd968';
    g.fillText('☠ '+G.kills+'/'+G.total+'  ·  ⏱ '+fmtTime(G.time),W/2,240);
  }
  g.restore();
  if(won&&LV.n<CAMPAIGN_TOTAL){
    drawBtn(W/2-258,308,150,38,T('again'),{fs:12.5});
    regBtn('again',W/2-258,308,150,38,()=>{SFX.click(); newGame();});
    drawBtn(W/2-90,308,180,38,T('next'),{fs:13.5,fill:'rgba(50,42,8,.95)',stroke:'#f5c542',col:'#ffd94d'});
    regBtn('next',W/2-90,308,180,38,()=>{SFX.click(); setLevel(LV.n+1); newGame();});
    drawBtn(W/2+108,308,150,38,T('toTitle'),{fs:12.5,fill:'rgba(10,30,30,.92)',stroke:'rgba(64,200,190,.8)',col:'#dff7f1'});
    regBtn('title',W/2+108,308,150,38,()=>{SFX.click(); screen='title'; G=null;});
  } else {
    drawBtn(W/2-170,308,160,38,won?T('again'):T('retry'),{fs:13.5});
    regBtn('again',W/2-170,308,160,38,()=>{SFX.click(); newGame();});
    drawBtn(W/2+10,308,160,38,T('toTitle'),{fs:13.5,fill:'rgba(10,30,30,.92)',stroke:'rgba(64,200,190,.8)',col:'#dff7f1'});
    regBtn('title',W/2+10,308,160,38,()=>{SFX.click(); screen='title'; G=null;});
  }
}
function wrapTextCenter(txt,cx,y,maxW,lh){
  const words=String(txt).split(' '); let line='', yy=y;
  for(const w of words){ const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,cx,yy); line=w; yy+=lh;} else line=test; }
  if(line)ctx.fillText(line,cx,yy);
  return yy;
}
/* ---- main render ---- */
function render(now){
  uiHits=[];
  const t=now/1000;
  ctx.save();
  if(G&&G.shake>0)ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);
  if(screen==='title')drawTitle(t);
  else if(screen==='brief')drawBrief(t);
  else if(screen==='play'||screen==='dead'||screen==='complete'){
    drawWorld(); drawHUD();
    if(screen==='dead')drawEndPanel(false);
    if(screen==='complete')drawEndPanel(true);
    if(G.orbTaken&&screen==='play'){
      ctx.save(); ctx.textAlign='center';
      ctx.fillStyle='rgba(5,16,14,.85)'; roundRect(W/2-238,120,476,86,10); ctx.fill();
      ctx.strokeStyle='#3fd68f'; ctx.lineWidth=2; roundRect(W/2-238,120,476,86,10); ctx.stroke();
      ctx.fillStyle='#f2fbf8'; ctx.font='700 21px Arial'; ctx.fillText(T('brief'),W/2,152);
      ctx.fillStyle='#59d977'; ctx.font='900 25px Arial'; ctx.fillText(T('complete'),W/2,186);
      ctx.restore();
    }
  }
  ctx.restore();
  if(langOpen)drawLangGrid();
  if(levelOpen)drawLevelGrid();
  /* portrait phones: the stage itself is CSS-rotated to fill the screen
     (fitCanvas), so no rotate nag is needed — the game just plays turned. */
  pasteBox.style.display=(screen==='brief'&&!langOpen&&!levelOpen)?'block':'none';
  if(screen==='brief')layoutPasteBox();
  if(screen!=='brief'&&pairBox.style.display!=='none')pairBox.style.display='none';
  else if(screen==='brief'&&pairBox.style.display!=='none')layoutPairBox();
}
/* language selector opens picker (override the cycling registration) */

/* ================= 9 · MAIN LOOP + QA HOOKS ================= */
let lastT=performance.now();
let frameCostAvg=0, slowSince=0;
let LITE_FG=false, LITE_NEAR=false, liteSince=0, lite2Since=0;
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  frameCostAvg=frameCostAvg*.95+dt*.05;
  if(DPR_CAP>1){
    if(frameCostAvg>.034){ if(!slowSince)slowSince=now; else if(now-slowSince>3000){ DPR_CAP=1; if(!dprDropLogged){ dprDropLogged=true; console.log('[z2] sustained frame pressure — render scale dropped to 1x to hold frame rate'); } fitCanvas(); } }
    else slowSince=0;
  }
  /* quality governor (max-out pass, Nov 11): if a device STILL can't hold
     frame rate at 1x render scale, shed the two most expensive decorative
     layers in order — foreground silhouettes + fireflies first, then the
     near trunks — so gameplay smoothness wins over decoration. The painted
     plates, ground, ruins and actors NEVER shed. Every shed is logged. */
  if(DPR_CAP<=1&&!LITE_FG){
    if(frameCostAvg>.040){ if(!liteSince)liteSince=now; else if(now-liteSince>5000){ LITE_FG=true; console.log('[z2] quality governor: foreground layer shed to hold frame rate'); } }
    else liteSince=0;
  }
  if(LITE_FG&&!LITE_NEAR){
    if(frameCostAvg>.048){ if(!lite2Since)lite2Since=now; else if(now-lite2Since>5000){ LITE_NEAR=true; console.log('[z2] quality governor: near layer shed to hold frame rate'); } }
    else lite2Since=0;
  }
  if(screen==='play'&&G)stepGame(dt);
  else if(screen==='dead'&&G){G.deadT+=dt; stepParts(dt);}
  render(now);
  requestAnimationFrame(loop);
}
initEmbers();
requestAnimationFrame(loop);
/* QA / debug hooks (read-only state + scenario driver) */
window.__z2={
  get state(){return {screen,lang:LANG,sound:SOUND,kills:G?G.kills:0,total:G?G.total:0,frg:G?G.frg:0,lunc:G?G.lunc:0,
    hp:G?Math.round(G.hero.hp):0,maxHp:G?G.hero.maxHp:0,ammo:G?G.ammo:0,bombs:G?G.bombs:0,heroX:G?Math.round(G.hero.x):0,
    onRaft:G?G.onRaft:false,orb:G?G.orbTaken:false,time:G?Math.round(G.time):0,
    fighter:fighter?{name:fighter.name,id:fighter.id,col:fighter.col,rarity:fighter.rarity,mult:fighter.mult}:null,
    lastBombT:G?G.lastBombT:-1, aimA:G?+((G.hero.aimA||0).toFixed(3)):0, cut:fighter?(fighter.cut?'ready':(fighter.cutFail?'failed':'none')):null,
    enemies:G?G.enemies.filter(e=>e.dead===0).map(e=>({kind:e.kind,x:Math.round(e.x),y:Math.round(e.y)})):[],
    level:LV.n, campaign:CAMPAIGN_TOTAL, unlocked, freePick, figsReady, camY:G?Math.round(G.camY||0):0, grenades:G?G.grenades.length:0, boss:(G&&G.bossRef)?{name:LV.boss.name,hp:G.bossRef.hp,maxHp:G.bossRef.maxHp,x:Math.round(G.bossRef.x),y:Math.round(G.bossRef.y)}:null, theme:LV.theme.id, mode:LV.mode, world:WORLD(), orbX:ORBX(), orbY:ORBY(),
    nftStatus,nftCount:nftList.length,best:loadBest(),
    dpr:DPR, backing:[cv.width,cv.height], lite:{fg:LITE_FG,near:LITE_NEAR}, plates:{far:!!plateFarCv,mid:!!plateMidCv}, walletVia:z2WalletVia,
    pairVisible:pairBox.style.display!=='none', pairUri:(document.getElementById('z2PairUri')||{}).value||'',
    dashSheet:z2DashSheetOn, openHref:(document.getElementById('z2PairOpen')||{}).href||''};},
  start(){screen='brief';},
  enter(){newGame();},
  key(k,down){ if(down){keys[k]=true; if(k===' ')jumpQueued=true; if(k==='k')bombQueued=true;} else keys[k]=false; },
  selectFighter, clearFighter,
  fire(on){fireHeld=!!on;},
  bomb(){bombQueued=true;},
  jump(){jumpQueued=true;},
  teleport(x){if(G){G.hero.x=x; G.cam=clamp(x-300,0,WORLD-W+40);}},
  lookup:lookupNFT,
  setLang(l){if(I18N[l]){LANG=l; localStorage.setItem('z2lang',LANG);}},
  hit(x,y){const h=hitAt(x,y); if(h){h.fn(); return h.id;} return null;},
  setLevel(n){ if(n>=1&&n<=unlocked)setLevel(n); },
  unlockAll(){ unlocked=CAMPAIGN_TOTAL; },
  setFree(i){ freePick=i; localStorage.setItem('z2free',String(i)); if(fighter)clearFighter(); },
  bossSpawn(){ if(G&&!G.bossSpawned)spawnBoss(); },
  grenade(){ launchGrenade(); },
  teleportY(y){ if(G){ G.hero.y=y; G.hero.vy=0; G.camY=LV.mode==='climb'?clamp(y-250,LV.topY-130,0):0; } },
};
